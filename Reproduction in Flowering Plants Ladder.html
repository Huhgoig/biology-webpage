   opts:[`A style, B filament, C sepal, D ovule`,`A stigma, B filament, C petal, D ovule`,`A style, B anther, C sepal, D ovary`,`A stigma, B anther, C sepal, D ovule`], ans:0,
   hint:`Work out each letter on its own: first the ring, then the part.`,
   sol:psol(['A ends on the slender stalk below the stigma: the style, not the stigma itself.','B is on a thin stalk below the knob: the filament, not the anther.','C is on the green outer ring: the sepal. A petal is coloured and is the next ring in.','D is a small round body inside the ovary: an ovule, not the ovary.'],'Answer: A style, B filament, C sepal, D ovule')}
  ] },

/* ================= LEVEL 3 ================= */
{ id:3, name:'What each flower part does', short:'Structure and function',
  teach:{ h:'Every part is built for one job', b:`
<p>Every part of a flower is built for a job. Learn the pairs and you can answer almost any "state the function" question.</p>
${contrast3(['Part','Job','How its structure helps'],[
 ['Sepals','Protect the flower while it is still a bud','Tough and green, they enclose the bud'],
 ['Petals','Attract pollinators such as insects and birds','Large, brightly coloured and often scented'],
 ['Anther','Makes and releases pollen','Sits at the top of the stamen where pollen is easy to reach'],
 ['Filament','Holds the anther up where pollen can be picked up','A thin stalk that lifts the anther'],
 ['Stigma','Receives pollen','Sticky or feathery surface that catches grains'],
 ['Style','Holds the stigma up; the pollen tube later grows down it','A slender column'],
 ['Ovary','Protects the ovules; later becomes the fruit','A swollen chamber around the ovules'],
 ['Ovule','Contains the ovum (female gamete); later becomes the seed','A small body inside the ovary'],
 ['Receptacle','Holds all the flower parts together','The swollen top of the flower stalk']])}
${pw([
 'Question (2 marks): Explain how the structure of the receptacle helps the flower.',
 'Step 1: say what the structure is like. The receptacle is the swollen tip of the flower stalk.',
 'Step 2: link it to the job. All the other parts are attached to it, so it holds them together in the right positions.'],
 'Model answer: The receptacle is the swollen top of the stalk (1) that holds all the flower parts in position (1).')}
${prule('Answer a function question in two parts: <b>what the structure is like</b>, then <b>what that lets the part do</b>.')}
${ptrap('The anther <b>gives out</b> pollen; the stigma <b>receives</b> it. The petals do not make pollen and the sepals do not attract insects.')}
${keyterms([['pollen','dust-like grains that carry the male gametes'],['pollinator','an animal that carries pollen between flowers'],['stigma','receives pollen'],['ovule','contains the ovum'],['fruit','develops from the ovary'],['seed','develops from the ovule']])}` },
  reteach:{ h:'Cross the part out: what would stop working?', b:`
<p>A second way to learn a function: imagine the part is <b>missing</b> and ask what goes wrong. The thing that goes wrong is the job of the part.</p>
${pw([
 'Take the ovary away from a bean flower.',
 'The ovules lose the chamber that protects them.',
 'No ovules means no ova to be fertilised, so no seeds can form.',
 'There is nothing to swell and ripen into a fruit either.'],
 'Without an ovary: no protection for the ovules, no seeds and no fruit.')}
${contrast('If this were missing...','...this would go wrong',[
 ['Petals','Insects and birds do not notice the flower, so little pollen is carried'],
 ['Ovule','There is no ovum, so no seed can form'],
 ['Receptacle','The other parts have nothing to hold them together in position']])}
${prule('Method: <b>cross the part out, then ask what stops working</b>. Anything that stops is the job of that part.')}
${keyterms([['petals','attract pollinators'],['ovule','holds the ovum'],['ovary','protects the ovules'],['receptacle','holds the parts together']])}` },
  qs:[
  {type:'mc', stem:`What is the main function of the <b>petals</b> in an insect-pollinated flower?`,
   opts:[`To attract insects to the flower by colour and scent`,`To make the pollen that the insects carry to other flowers`,`To protect the flower while it is still a young bud`,`To receive the pollen that visiting insects have carried`], ans:0,
   hint:`Think about why petals are large and brightly coloured.`,
   sol:psol(['Petals are large, coloured and often scented, so insects notice the flower and visit it.','Pollen is made by the anther, the bud is protected by the sepals, and pollen is received by the stigma.'],'Answer: To attract insects to the flower by colour and scent')},
  {type:'text', stem:`Name the slender part of the carpel that <b>holds the stigma up</b>.`, ans:'style', anyCase:true, accept:['styles','the style'], ph:'one word',
   hint:`It joins the stigma to the ovary.`,
   sol:psol(['The carpel has a stigma at the top, a style below it and an ovary at the base.','The style is the slender column that holds the stigma up.'],'Answer: style')},
  {type:'mc', stem:`Which statement describes the function of the <b>sepals</b>?`,
   opts:[`They enclose and protect the young flower bud before it opens`,`They hold the anthers up so that the pollen can be carried away`,`They contain the ovules and later grow into the fruit`,`They make the flower open when a pollinator arrives nearby`], ans:0,
   hint:`Sepals are the outermost ring, which is green and tough.`,
   sol:psol(['The sepals are the outermost ring and cover the bud before it opens.','This protects the delicate petals, stamens and carpel inside.','Holding up the anthers is the job of the filaments, and the ovary contains the ovules.'],'Answer: They enclose and protect the young flower bud before it opens')},
  {type:'text', stem:`Name the sticky part of the carpel that <b>receives pollen</b>.`, ans:'stigma', anyCase:true, accept:['stigmas','the stigma'], ph:'one word',
   hint:`It is at the very top of the carpel.`,
   sol:psol(['The carpel has a stigma at the top, a style below it and an ovary at the base.','Pollen lands on the sticky surface of the stigma.'],'Answer: stigma')},
  {type:'mc', stem:`A researcher removed all the <b>stamens</b> from flower buds before they opened and protected the flowers from pollen from other plants. Which result is most likely?`,
   opts:[`No seeds form, because no pollen is produced to reach the stigmas`,`Seeds form as normal, because the ovules and stigmas are still there`,`No seeds form, because the sepals can no longer protect the carpel`,`The petals fall off at once, because the anthers receive pollen`], ans:0,
   hint:`Ask what the stamens make, and what the seeds need before they can form.`,
   sol:psol(['The anthers of the stamens make the pollen, so with no stamens there is no pollen.','Without pollen reaching the stigma, no male gamete can fertilise an ovum and no seeds form.','The ovules and stigmas alone are not enough, the sepals do not make seeds, and the anthers give out pollen rather than receive it.'],'Answer: No seeds form, because no pollen is produced to reach the stigmas')}
  ] },

/* ================= LEVEL 4 ================= */
{ id:4, name:'Male and female parts and gametes', short:'Male and female parts',
  teach:{ h:'The stamen makes male gametes; the carpel holds the female gamete', b:`
<p>A flower has a male part and a female part. The <b>stamen</b> (anther and filament) is the male part: the anther makes <b>pollen grains</b>, which carry the <b>male gametes</b>. The <b>carpel</b> (stigma, style and ovary) is the female part: the ovary holds <b>ovules</b>, and each ovule contains a <b>female gamete</b>, the <b>ovum</b> (egg cell). Gametes are made by <b>meiosis</b>, so each is <b>haploid</b> (n).</p>
${contrast('Stamen (male)','Carpel (female)',[
 ['Parts: anther and filament','Parts: stigma, style and ovary'],
 ['Anther makes pollen grains that carry male gametes','Ovary contains ovules; each ovule holds an ovum'],
 ['Male gamete: haploid (n)','Ovum: haploid (n)'],
 ['Pollen grains are made by meiosis in the anther','A cell made by meiosis in the ovule gives rise to the ovum']])}
${vis(flow(['Body cell of the plant: 2n','Meiosis in anther or ovule','Gametes: n','Fusion gives zygote: 2n']),'Chromosome number from body cell to zygote')}
${pw([
 'A pea plant has 2n = 14 chromosomes in its body cells. How many chromosomes are in a male gamete, in an ovum and in the zygote?',
 'Each gamete has half the body-cell number: 14 &divide; 2 = 7, so n = 7.',
 'Male gamete 7 and ovum 7.',
 'Fusion adds them back: 7 + 7 = 14.'],
 'Male gamete 7, ovum 7, zygote 14.')}
${prule('<b>Male:</b> stamen, pollen, haploid (n). <b>Female:</b> carpel, ovule, ovum, haploid (n). Gametes come from meiosis, the zygote is diploid (2n).')}
${ptrap('The ovary is not the female gamete. The ovary is an organ; the ovum is one cell inside an ovule, inside the ovary.')}
${keyterms([['stamen','anther and filament'],['carpel','stigma, style and ovary'],['pollen grain','carries the male gamete'],['ovule','holds the ovum'],['ovum','the female gamete (egg cell)'],['meiosis','division that halves the chromosome number'],['haploid (n)','one set of chromosomes'],['diploid (2n)','two sets of chromosomes']])}` },
  reteach:{ h:'The same jobs in a human and in a flower', b:`
<p>You already know the human system. The flower does the same jobs with different parts. Put them side by side.</p>
${contrast3(['Job','Human','Flowering plant'],[
 ['Male part that makes male gametes','Testis','Stamen'],
 ['Male gamete','Sperm, n = 23','Male gamete, n'],
 ['Female part','Ovary','Carpel'],
 ['Female gamete','Ovum, n = 23','Ovum, n'],
 ['Chromosome number of a gamete','Half of the body-cell number','Half of the body-cell number'],
 ['Fusion gives','Zygote, 2n = 46','Zygote, 2n']])}
${pw([
 'Human body cell: 2n = 46. Halve it for each gamete: 46 &divide; 2 = 23.',
 'Sperm 23 + ovum 23 = 46 in the zygote.',
 'The flowering plant follows exactly the same rule, whatever its own number is.'],
 'Gametes: half of 2n. Zygote: back to 2n.')}
${prule('If you know the human system, you know the flower: <b>the gametes get half the number, fusion doubles it again</b>.')}
${keyterms([['stamen','male part'],['carpel','female part'],['n','chromosomes in a gamete'],['2n','chromosomes in a body cell or zygote']])}` },
  qs:[
  {type:'text', stem:`The anther together with its filament forms the male part of a flower. What is this part called?`, ans:'stamen', anyCase:true, accept:['stamens','the stamen'], ph:'one word',
   hint:`It is the ring of stalks with knobs.`,
   sol:psol(['The male part is made of an anther, which makes pollen, on a filament.','Together they are the stamen.'],'Answer: stamen')},
  {type:'num', stem:`Radish has a diploid number of 18 (2n = 18). How many chromosomes does one <b>ovum</b> of a radish contain?`, ans:9, unit:'chromosomes',
   hint:`A gamete is haploid, so it has half of the diploid number.`,
   sol:psol(['The ovum is a gamete made by meiosis, so it is haploid (n).','n = 18 &divide; 2 = 9.'],'Answer: 9')},
  {type:'mc', stem:`Which statement correctly says where the gametes of a flower are found?`,
   opts:[`Male gametes are carried in pollen grains and the ovum is inside an ovule`,`Male gametes are made in the stigma and the ovum is inside the style`,`Male gametes are found inside the ovule and the ovum is made in the anther`,`Male gametes are carried in pollen grains and the ovum is made in the filament`], ans:0,
   hint:`Male gametes are made in the stamen, and the ovum is inside the ovary.`,
   sol:psol(['The anther makes pollen grains, which carry the male gametes.','Each ovule inside the ovary contains an ovum.','The stigma only receives pollen, the style is a stalk, and the filament only holds the anther up.'],'Answer: Male gametes are carried in pollen grains and the ovum is inside an ovule')},
  {type:'text', stem:`Name the type of cell division in the anther that produces cells with the <b>haploid</b> number of chromosomes.`, ans:'meiosis', anyCase:true, accept:['meiotic division','by meiosis','meiotic'], ph:'one word',
   hint:`It is the division that halves the chromosome number.`,
   sol:psol(['Gametes must be haploid (n) so that fusion restores the diploid number.','The division that halves the chromosome number is meiosis. Mitosis keeps the number the same.'],'Answer: meiosis')},
  {type:'mc', stem:`Onion has 2n = 16. Which row gives the number of chromosomes in a cell from the anther wall, in a male gamete and in a zygote?`,
   opts:[`Anther wall cell 16, male gamete 8, zygote 16`,`Anther wall cell 16, male gamete 16, zygote 32`,`Anther wall cell 8, male gamete 8, zygote 16`,`Anther wall cell 16, male gamete 8, zygote 8`], ans:0,
   hint:`The anther wall is made of ordinary body cells.`,
   sol:psol(['A cell in the anther wall is an ordinary body cell: 2n = 16.','A male gamete is made by meiosis: n = 8.','The zygote forms when n + n fuse: 8 + 8 = 16.','Gametes are not 16 and the zygote is not 8, because meiosis halves and fusion doubles.'],'Answer: Anther wall cell 16, male gamete 8, zygote 16')}
  ] },

/* ================= LEVEL 5 ================= */
{ id:5, name:'Pollination, self and cross', short:'Pollination',
  teach:{ h:'Pollination moves pollen from an anther to a stigma', b:`
<p><b>Pollination</b> is the transfer of pollen from an <b>anther</b> to a <b>stigma</b>. It is not fertilisation: no gametes have fused yet. If the pollen lands on a stigma of the <b>same plant</b> it is <b>self-pollination</b>. If it lands on a stigma of a <b>different plant of the same species</b> it is <b>cross-pollination</b>.</p>
${contrast('Self-pollination','Cross-pollination',[
 ['Pollen goes to a stigma on the same plant','Pollen goes to a stigma on another plant of the same species'],
 ['Reliable: works even if no pollinator or other plant is near','Needs an agent such as wind or an animal; much pollen is wasted'],
 ['Little variation in the offspring','More variation in the offspring'],
 ['Weaker in a changing environment','Offspring more likely to include some that survive change']])}
<p>Many plants have ways to <b>avoid</b> self-pollination:</p>
${cards([{t:'Different ripening times', d:'The anthers and the stigma of one flower mature at different times.'},{t:'Self-incompatibility', d:'The plant\'s own pollen fails to grow on its own stigma.'},{t:'Male and female flowers on separate plants', d:'Pollen must come from another plant, as in the pawpaw and the date palm.'}],{min:170})}
${pw([
 'A bee collects pollen from one lemon flower and brushes it onto the stigma of a second flower on the same lemon tree. Is this self or cross?',
 'Where did the pollen start? The anther of flower 1.',
 'Where did it land? The stigma of flower 2.',
 'Are the two flowers on the same plant? Yes.'],
 'Self, even though two different flowers were involved: the pollen stayed on one plant.')}
${prule('Pollination = anther to stigma. <b>Same plant = self. Different plant of the same species = cross.</b>')}
${ptrap('Pollination is not fertilisation. Pollination only places pollen on the stigma. Fertilisation, the fusion of gametes, comes later.')}
${keyterms([['pollination','transfer of pollen from anther to stigma'],['self-pollination','pollen lands on a stigma of the same plant'],['cross-pollination','pollen lands on a stigma of another plant of the same species'],['pollinating agent','wind or an animal that carries pollen'],['variation','differences between offspring'],['self-incompatibility','a plant\'s own pollen fails to fertilise it']])}` },
  reteach:{ h:'Decide with a table: where did the pollen start and land?', b:`
<p>Instead of memorising definitions, ask two questions about the pollen: <b>where did it start</b> and <b>where did it land</b>? The answer decides the type.</p>
${dataTable(['Pollen starts on','Pollen lands on','Type'],[
 ['Anther of a flower on plant 1','Stigma of the same flower','Self-pollination'],
 ['Anther of a flower on plant 1','Stigma of a different flower on plant 1','Self-pollination'],
 ['Anther of a flower on plant 1','Stigma of a flower on plant 2 (same species)','Cross-pollination']],{w:560})}
${prule('A plant avoids self-pollination by stopping its own pollen from reaching, or from working on, its own stigma. Ask of any mechanism: <b>how does it keep the plant\'s own pollen away from the plant\'s own stigma?</b>')}
${keyterms([['self','same plant'],['cross','different plant, same species'],['where it started','the anther the pollen came from'],['where it landed','the stigma that received it']])}` },
  qs:[
  {type:'text', stem:`Name the process in which pollen is transferred from an anther to a stigma.`, ans:'pollination', anyCase:true, accept:['pollinating','pollinate'], ph:'one word',
   hint:`It is not fertilisation, because no gametes have fused yet.`,
   sol:psol(['The transfer of pollen from an anther to a stigma is pollination.','Fertilisation is the later fusion of the male gamete with the ovum.'],'Answer: pollination')},
  {type:'mc', stem:`In many flowers the anthers release their pollen before the stigma of the same flower is ready to receive it. What is the effect of this difference in timing?`,
   opts:[`It makes it less likely that the flower pollinates itself with its own pollen`,`It makes the flower more likely to pollinate itself, as the pollen waits for the stigma`,`It stops the stigma from receiving pollen from any other plant of the species`,`It lets a pollen tube grow before the pollen has reached the stigma`], ans:0,
   hint:`Ask whether the pollen can land on a stigma that is not yet ready.`,
   sol:psol(['When the stigma is not ready, pollen from the same flower cannot germinate on it.','This makes self-pollination less likely and favours cross-pollination.','Timing does not make self-pollination more likely or stop pollen from other plants, and a pollen tube cannot grow before pollen has reached a stigma.'],'Answer: It makes it less likely that the flower pollinates itself with its own pollen')},
  {type:'mc', stem:`Which is an <b>advantage of self-pollination</b> for a plant?`,
   opts:[`It can still produce seed when no pollinators or other plants are nearby`,`It gives offspring with a wide variety of features that help them survive`,`It produces offspring that are better suited to changing conditions`,`It uses large amounts of pollen, most of which is wasted on other plants`], ans:0,
   hint:`Self-pollination needs only one plant.`,
   sol:psol(['Self-pollination needs no other plant and no pollinating agent, so it is reliable.','A wide variety, and being better suited to change, are advantages of cross-pollination.','Using and wasting large amounts of pollen is a feature of cross-pollination that depends on an agent, not an advantage of self-pollination.'],'Answer: It can still produce seed when no pollinators or other plants are nearby')},
  {type:'text', stem:`A sunbird carries pollen from a protea flower on one bush to a protea flower on a <b>different</b> bush of the same species. What type of pollination is this?`, ans:'cross-pollination', anyCase:true, accept:['cross pollination','cross','cross-pollinated','cross pollinated','cross-pollinated flower'], ph:'type of pollination',
   hint:`Ask whether the two flowers are on the same plant or on different plants.`,
   sol:psol(['The pollen started on one bush and landed on a different bush of the same species.','Different plants, same species: cross-pollination.'],'Answer: cross-pollination')},
  {type:'mc', stem:`Which row correctly matches a way of avoiding self-pollination with how it works?`,
   opts:[`Self-incompatibility: the plant's own pollen fails to grow on its own stigma`,`Different ripening times: pollen is released after fertilisation has occurred`,`Separate male and female flowers: the anthers and stigma form one structure`,`Self-incompatibility: the plant's own pollen cannot leave its anther`], ans:0,
   hint:`Think about what happens to a plant's own pollen once it lands on its own stigma.`,
   sol:psol(['In self-incompatibility, pollen lands on the plant\'s own stigma but does not grow, so no fertilisation follows.','Pollen is released before, not after, fertilisation. Separate male and female flowers keep the anthers and stigma apart rather than joining them. The pollen is not blocked from leaving the anther: the block happens at the stigma.'],'Answer: Self-incompatibility: the plant\'s own pollen fails to grow on its own stigma')}
  ] },

/* ================= LEVEL 6 ================= */
{ id:6, name:'Wind and insect pollination', short:'Wind vs insect',
  teach:{ h:'The pollinating agent decides how the flower is built', b:`
<p>A flower is built to suit whatever carries its pollen. Flowers that need an <b>animal</b> must be noticed and must reward the visitor. Flowers that rely on the <b>wind</b> need no advertising, but must send out and catch pollen from the air.</p>
${contrast('Wind-pollinated flower','Insect-pollinated flower',[
 ['Petals small and dull (green or brown), sometimes absent','Petals large and brightly coloured'],
 ['No scent and no nectar','Scented and makes nectar, a sugary liquid reward'],
 ['Very large amounts of light, smooth, dry pollen','Smaller amounts of sticky or spiky pollen that clings to the visitor'],
 ['Anthers hang outside the flower on long filaments','Anthers inside the flower where a visitor brushes against them'],
 ['Large, feathery stigma outside the flower to catch pollen from the air','Small, sticky stigma inside the flower'],
 ['Grasses and maize are examples','Many garden flowers. Sunbird-pollinated flowers (such as proteas) also make nectar but are often red or orange with little scent']])}
${pw([
 'Flower X has small green petals, no scent, no sugary reward, anthers dangling outside the flower and a large feathery stigma. How is it pollinated?',
 'Small, dull petals, no scent and no sugary reward: nothing to attract or pay an animal.',
 'Dangling anthers and light pollen: pollen is blown away by the wind.',
 'Large, feathery stigma: a wide surface to catch pollen drifting past.'],
 'Wind-pollinated.')}
${prule('Features that <b>attract and reward</b> (colour, scent, nectar, sticky pollen) mean an animal. Features that <b>release and catch pollen in the air</b> (hanging anthers, light pollen, feathery stigma, no show) mean wind.')}
${ptrap('Wind-pollinated flowers make <b>more</b> pollen, not less. Most of it is blown away and never reaches a stigma.')}
${keyterms([['pollinating agent','wind or an animal that carries pollen'],['nectar','sugary liquid made by a flower to reward visitors'],['feathery stigma','a large, branched stigma that catches pollen from the air'],['anther','releases the pollen'],['filament','stalk of the stamen'],['adaptation','a feature that helps an organism survive or reproduce']])}` },
  reteach:{ h:'Design the flower: what does each pollinator need?', b:`
<p>Instead of learning two lists, design a flower from what its pollinator needs. Two cases.</p>
${contrast3(['Pollinator','What it needs','So the flower must...'],[
 ['<b>Sunbird</b> pollinating a protea','Food, and a flower it can see from far away','Be large and red or orange, offer plenty of sugary food, and have pollen that sticks to the bird\'s head'],
 ['<b>Wind</b> pollinating maize','To lift pollen and drop it on a stigma by chance','Make huge amounts of light, dry pollen on exposed anthers, and hold out exposed stigmas with a wide surface to catch it']])}
${pw([
 'Test the design on one feature: why would maize NOT make a sugary reward?',
 'A sugary reward costs the plant sugar. Its job is to pay a visitor.',
 'The wind needs no payment, so the sugar is saved.'],
 'No sugary reward, no scent and no bright petals in a wind-pollinated flower.')}
${prule('<b>Start from the pollinator.</b> An animal needs to find the flower, be paid and be dusted with pollen. The wind needs only exposed pollen and a net to catch it.')}
${keyterms([['sugary reward','pays an animal visitor'],['dry, light pollen','travels easily on the wind'],['sticky pollen','clings to an animal']])}` },
  qs:[
  {type:'mc', stem:`Which flower is most likely to be pollinated by <b>insects</b>?`,
   opts:[`Large yellow petals, a sweet scent and nectar at the base of the petals`,`Small green petals, no scent and anthers hanging outside the flower`,`Small brown petals, no nectar and a large feathery stigma outside the flower`,`No petals at all and very large amounts of light, dry pollen on exposed anthers`], ans:0,
   hint:`Choose the flower that advertises itself and rewards its visitors.`,
   sol:psol(['Large yellow petals, scent and nectar attract insects and reward them.','The other three flowers show wind features: small dull petals or none, no nectar or scent, exposed anthers, a feathery stigma and large amounts of light pollen.'],'Answer: Large yellow petals, a sweet scent and nectar at the base of the petals')},
  {type:'text', stem:`Insect-pollinated flowers make a sugary liquid that rewards their visitors. Name this liquid.`, ans:'nectar', anyCase:true, accept:['the nectar'], ph:'one word',
   hint:`Bees collect it to make honey.`,
   sol:psol(['The sugary liquid made by the flower to pay its visitors is nectar.','Wind-pollinated flowers do not make it, because the wind needs no reward.'],'Answer: nectar')},
  {type:'mc', stem:`Grass flowers have large, <b>feathery</b> stigmas that hang outside the flower. How does this help pollination?`,
   opts:[`The large feathery surface catches pollen grains drifting in the air`,`The bright colour attracts insects that carry pollen from far away`,`The sticky surface glues the pollen to the body of a visiting insect`,`The long shape keeps the pollen safe inside the flower until it is ripe`], ans:0,
   hint:`Wind-pollinated flowers need a net for pollen that is floating past.`,
   sol:psol(['Grass pollen travels in the air, so the stigma must catch grains by chance.','A large, feathery stigma held outside the flower gives a wide net for this.','Bright colour and stickiness are features of insect-pollinated flowers, and a stigma held outside is not hidden inside the flower.'],'Answer: The large feathery surface catches pollen grains drifting in the air')},
  {type:'text', stem:`In a grass flower the anthers dangle outside the flower in the wind. Name the part of the stamen that is long and flexible so that this can happen.`, ans:'filament', anyCase:true, accept:['filaments','the filament','long filament','filament of the stamen'], ph:'one word',
   hint:`It is the stalk that holds up the anther.`,
   sol:psol(['A stamen has an anther and a filament.','The long, flexible filament lets the anther hang out in the wind and shake pollen free.'],'Answer: filament')},
  {type:'mc', stem:`Flower P and flower Q grow in the same meadow.<br>Which row correctly says how each is pollinated and gives a correct reason?`, v:vis(dataTable(['Feature','Flower P','Flower Q'],[['Petals','Large and pink','Small and green'],['Scent','Present','Absent'],['Anthers','Inside the flower','Hanging outside the flower'],['Stigma','Small and sticky','Large and feathery']],{w:440}),'Features of two flowers'),
   opts:[`P: insects, because of its large pink petals and scent; Q: wind, because of its hanging anthers and feathery stigma`,`P: wind, because of its small sticky stigma; Q: insects, because of its small green petals and lack of scent`,`P and Q: wind, because both flowers grow in the same meadow and are exposed to the same moving air`,`P: insects, because its anthers are inside; Q: insects, because a feathery stigma can catch pollen from a visiting bee`], ans:0,
   hint:`Look at each flower separately, then match the whole set of features to an agent.`,
   sol:psol(['Flower P: large coloured petals and scent attract insects. The small sticky stigma and anthers inside are insect features.','Flower Q: small green petals, no scent, hanging anthers and a large feathery stigma are wind features.','Growing in the same meadow does not decide the agent, and a feathery stigma is for catching airborne pollen, not for a visiting bee.'],'Answer: P: insects, because of its large pink petals and scent; Q: wind, because of its hanging anthers and feathery stigma')}
  ] },

/* ================= LEVEL 7 ================= */
{ id:7, name:'Fertilisation and the pollen tube', short:'Fertilisation',
  teach:{ h:'After pollination, a pollen tube carries the male gametes to the ovule', b:`
<p>Pollination only puts pollen on the stigma. <b>Fertilisation</b> happens later, deep inside the flower. The pollen grain absorbs fluid from the stigma and <b>germinates</b>: it grows a <b>pollen tube</b> down the style to the ovary. The tube enters an ovule through a tiny opening, the <b>micropyle</b>. Two male gametes pass down the tube. The nucleus of one fuses with the nucleus of the ovum, and the result is a <b>zygote</b>, which is diploid (2n). The other fuses with other nuclei in the ovule and forms a food store for the seed.</p>
${vis(flow(['Pollen grain lands on the stigma','Pollen tube grows down the style','Tube enters the ovule at the micropyle','Male gamete fuses with the ovum']),'From pollen grain to fertilisation')}
${vis(flower({labels:['stigma','style','ovary','ovule']}),'The parts a pollen tube passes through on its way to an ovule: stigma, style, then ovary and ovule')}
${pw([
 'Suppose the tube that grows from a pollen grain advances 3 mm every hour and the style is 15 mm long. A flower is pollinated at 08:00.',
 'Time for the tube to cross the style: 15 &divide; 3 = 5 hours.',
 'The tube cannot reach the ovule before 08:00 + 5 hours = 13:00.'],
 'Fertilisation happens hours after pollination, not at the same moment.')}
${prule('<b>Pollination</b> puts pollen on the stigma (outside the flower). <b>Fertilisation</b> is the fusion of a male gamete with the ovum (inside the ovule). The second male gamete fuses with other nuclei and forms the endosperm, a food store (in a bean the cotyledons take over this role). Exam questions at this level focus on the fusion that makes the zygote.')}
${ptrap('The pollen grain itself does not travel down the style. It stays on the stigma: only the tube grows down, carrying the male gametes.')}
${keyterms([['pollination','pollen reaches the stigma'],['germinate (pollen)','the grain grows a tube'],['pollen tube','carries the male gametes down the style'],['micropyle','tiny opening in the ovule'],['fertilisation','male gamete fuses with the ovum'],['zygote','diploid cell formed by fertilisation']])}` },
  reteach:{ h:'The journey, told by the pollen grain', b:`
<p>Follow one pollen grain from the moment it lands. Read it as a story: each step needs the one before it.</p>
${chain(['I land on a sticky stigma. This is only the arrival of pollen: nothing has fused yet.','I take in sugary fluid and grow a thin thread from my side.','My thread pushes down through the style towards the ovary, like a root through soil.','I find an ovule and enter it through a tiny opening in its surface.','My male gametes move down the thread. One fuses with the ovum, and a new diploid cell with the full chromosome number is made.'],{hi:4})}
${ptrap('<b>Landing on the stigma is not fusion.</b> A bee that leaves pollen on a stigma has only delivered the pollen. The fusion comes hours or days later, inside the ovule, and only if a thread reaches it. A flower that has received pollen may never have its ovum fertilised.')}
${prule('Two locations to remember: the pollen arrives <b>outside</b> (on the stigma), the fusion happens <b>inside</b> (in the ovule). The thread is the bridge between the two.')}
${keyterms([['stigma','where pollen lands'],['style','the thread grows down it'],['ovum','the female gamete']])}` },
  qs:[
  {type:'text', stem:`Name the structure that grows from a germinating pollen grain and carries the male gametes down the style.`, ans:'pollen tube', anyCase:true, accept:['pollen tubes','tube','the pollen tube','pollen-tube','tube of the pollen grain'], ph:'two words',
   hint:`It grows from the pollen grain towards the ovule.`,
   sol:psol(['After pollination the pollen grain germinates on the stigma.','It grows a tube down the style, and the male gametes travel along it: this is the pollen tube.'],'Answer: pollen tube')},
  {type:'mc', stem:`A bee leaves pollen on the stigma of a flower at 10:00. Which statement is correct at 10:05?`,
   opts:[`The flower has been pollinated, but fertilisation has not yet happened`,`The flower has been fertilised, but pollination has not yet happened`,`The flower has been both pollinated and fertilised, because the pollen has arrived`,`The flower has been neither pollinated nor fertilised, until the pollen tube forms`], ans:0,
   hint:`One of the two processes needs a tube to grow down the style first.`,
   sol:psol(['Pollination is the arrival of pollen on a stigma, and it has happened.','Fertilisation is the fusion of a male gamete with the ovum, and it needs a pollen tube to grow down the style, which takes hours.','Fertilisation cannot come before pollination, arrival of the pollen is already pollination, and the two processes are not the same thing.'],'Answer: The flower has been pollinated, but fertilisation has not yet happened')},
  {type:'order', stem:`Put these events of pollination and fertilisation in the correct order.`,
   items:[`The tube enters the ovule through the micropyle`,`Pollen is carried from an anther to a stigma`,`The male gamete fuses with the ovum to form a zygote`,`The pollen grain germinates and a pollen tube starts to grow`,`The pollen tube grows down the style towards the ovary`], ans:[4,1,5,2,3],
   hint:`Ask where the pollen is at each step: outside the flower first, deep inside an ovule last.`,
   sol:psol(['1. Pollen is carried from an anther to a stigma (pollination).','2. The pollen grain germinates and a pollen tube starts to grow.','3. The pollen tube grows down the style towards the ovary.','4. The tube enters the ovule through the micropyle.','5. The male gamete fuses with the ovum to form a zygote (fertilisation).'],'Answer: B, D, E, A, C')},
  {type:'text', stem:`Name the diploid cell that is formed when the nucleus of a male gamete fuses with the nucleus of the ovum.`, ans:'zygote', anyCase:true, accept:['zygotes','a zygote','fertilised ovum','fertilised egg','fertilised egg cell'], ph:'one word',
   hint:`Its chromosome number is 2n.`,
   sol:psol(['The male gamete (n) and the ovum (n) fuse.','The cell that results has 2n chromosomes and is called the zygote. It will develop into the embryo.'],'Answer: zygote')},
  {type:'mc', stem:`A class hand-pollinated flowers of one plant at 09:00. The style of each flower was then cut off at its base at different times and the flowers were left to develop.<br>Which is the best explanation for the result for the flowers whose style was cut off <b>1 hour</b> after pollination?`, v:vis(dataTable(['Style cut off after','1 hour','4 hours','8 hours','24 hours'],[['Flowers that formed seeds (%)','0','15','70','95']],{w:560}),'Data from a class investigation'),
   opts:[`The pollen tubes had not reached the ovules, so no fertilisation had happened`,`No pollen had been placed on the stigma, so pollination had not taken place yet`,`The ovules had already been fertilised, so they could no longer form seeds`,`The cut removed the stigma, so the flowers could not be pollinated afterwards`], ans:0,
   hint:`Pollen was placed on the stigma at 09:00. Ask what still had to happen before an ovule could be fertilised.`,
   sol:psol(['The flowers were hand-pollinated at 09:00, so pollination had already taken place.','The percentage forming seeds rises as the style is cut later: the tubes need hours to grow down the style.','At 1 hour the tubes had not reached the ovules, so no fertilisation, no zygote and no seed.','Pollination had taken place, and fertilised ovules would produce seeds rather than fail to.'],'Answer: The pollen tubes had not reached the ovules, so no fertilisation had happened')}
  ] },

/* ================= LEVEL 8 ================= */
{ id:8, name:'From flower to seed and fruit', short:'Seed and fruit',
  teach:{ h:'After fertilisation the ovule becomes a seed and the ovary becomes a fruit', b:`
<p>Fertilisation starts a chain of changes. The zygote divides by mitosis and grows into an <b>embryo</b> with a <b>plumule</b> (future shoot), a <b>radicle</b> (future root) and <b>cotyledons</b> (a food store). The <b>ovule</b> becomes the <b>seed</b>, and its outer layers harden into the <b>testa</b> (seed coat). The <b>ovary</b> becomes the <b>fruit</b>, and the ovary wall becomes the <b>pericarp</b>. The petals and stamens have done their job and wither.</p>
${cards([{t:'Zygote', d:'divides by mitosis to form the embryo (plumule, radicle, cotyledons)', hi:true},{t:'Ovule', d:'becomes the seed; the outer layers become the testa'},{t:'Ovary', d:'becomes the fruit; its wall becomes the pericarp'},{t:'Petals and stamens', d:'wither and fall off'}],{min:170})}
${pw([
 'A pea pod contains 6 peas. At least how many pollen tubes grew into the ovary of the flower that made the pod?',
 'Each pea is a seed, and every seed came from its own fertilisation.',
 'Each fertilisation takes place in a separate part of the ovary, and each needs its own pollen tube to reach it.'],
 'At least 6 pollen tubes: one for each seed.')}
${prule('<b>Ovule to seed. Ovary to fruit. Ovary wall to pericarp.</b> The fruit protects the seeds and often helps to carry them away from the plant.')}
${ptrap('The seed is not the fruit. The seed is the ripened ovule; the fruit is the ripened ovary around it. A dry bean pod is a fruit as well as a juicy peach.')}
${keyterms([['embryo','a young plant formed from the zygote'],['seed','the ripened ovule'],['testa','the seed coat, from the outer layers of the ovule'],['fruit','the ripened ovary'],['pericarp','the ripened ovary wall'],['plumule','the future shoot'],['radicle','the future root'],['cotyledon','the seed leaf that stores food']])}` },
  reteach:{ h:'Before and after: what each part becomes', b:`
<p>Another way to see it: put the flower <b>before</b> fertilisation next to the flower <b>after</b>. Each part either becomes something or withers.</p>
${contrast3(['Part','Before fertilisation','After fertilisation'],[
 ['Zygote','A single cell (2n)','An embryo with plumule, radicle and cotyledons'],
 ['Ovule','Holds the ovum','Becomes the seed'],
 ['Outer layers of the ovule','Cover the ovule','Harden into the testa'],
 ['Ovary','Holds the ovules','Becomes the fruit'],
 ['Wall of the ovary','Surrounds the ovules','Becomes the wall of the fruit']])}
${pw([
 'Suppose a tomato fruit contains 80 seeds. Read the table to trace them back to the flower.',
 'Seeds are in the "after" column next to the structure that held the ovum, so the flower held at least 80 of those structures.',
 'The flesh and skin of the tomato are in the "after" column next to the wall that surrounded them.'],
 'Seeds come from the structures that held the ova; the fruit wall comes from the wall around them.')}
${prule('Read the table from <b>left to right</b>: what the part was, then what it turns into. Ask of any part not in the table whether its job is still needed.')}
${keyterms([['seed','from the ovule'],['fruit','from the ovary'],['testa','from the outer layers of the ovule'],['embryo','from the zygote']])}` },
  qs:[
  {type:'text', stem:`A watermelon contains hundreds of seeds. Each seed developed from which structure inside the ovary of the flower?`, ans:'ovule', anyCase:true, accept:['ovules','the ovule','an ovule'], ph:'one word',
   hint:`The structure that holds the ovum.`,
   sol:psol(['The ovary of the flower held many ovules, each containing an ovum.','After fertilisation each fertilised ovule ripened into a seed.'],'Answer: ovule')},
  {type:'text', stem:`After fertilisation the wall of the ovary ripens and becomes the wall of the fruit. What name is given to this ripened ovary wall?`, ans:'pericarp', anyCase:true, accept:['the pericarp','pericarps'], ph:'one word',
   hint:`The name starts with peri, meaning around.`,
   sol:psol(['The ovary becomes the fruit.','The wall of the ovary becomes the wall of the fruit, which is called the pericarp. The seeds lie inside it.'],'Answer: pericarp')},
  {type:'mc', stem:`What happens to the petals and stamens of a flower after fertilisation?`,
   opts:[`They wither and fall off because their jobs are done`,`They become the seed coat that protects the embryo`,`They grow larger and form the wall of the fruit`,`They stay unchanged so that more pollen can be received`], ans:0,
   hint:`Ask whether the flower still needs to attract pollinators or make pollen.`,
   sol:psol(['Petals attract pollinators and stamens make pollen: both jobs are finished once fertilisation has happened.','The testa comes from the outer layers of the ovule, and the wall of the fruit comes from the wall of the ovary.'],'Answer: They wither and fall off because their jobs are done')},
  {type:'mc', stem:`Which statement about the structures formed after fertilisation is correct?`,
   opts:[`The ovary wall becomes the pericarp, which is the wall of the fruit`,`The ovule becomes the pericarp, which surrounds the whole fruit`,`The testa forms from the wall of the ovary that surrounds the seed`,`The embryo develops from the pericarp, which is the wall of the ovule`], ans:0,
   hint:`Pericarp comes from the part of the carpel, not the ovule.`,
   sol:psol(['The ovary wall ripens into the pericarp, which is the wall of the fruit.','The ovule becomes the seed, the testa forms from the outer layers of the ovule, and the embryo develops from the zygote.'],'Answer: The ovary wall becomes the pericarp, which is the wall of the fruit')},
  {type:'mc', stem:`The ovary of a flower contained 12 ovules. After pollination a fruit formed, and it contained 9 seeds. Which is the best explanation?`,
   opts:[`Nine ovules were fertilised, so only these nine developed into seeds`,`Nine pollen grains landed on the stigma, so only nine ovules were present`,`Twelve ovules were fertilised but three seeds were lost as the fruit formed`,`Nine of the twelve ovules grew into seeds without being fertilised`], ans:0,
   hint:`A seed forms only from an ovule that has been fertilised.`,
   sol:psol(['Each seed develops from a fertilised ovule, so 9 seeds means 9 ovules were fertilised.','The other 3 ovules were not reached by a pollen tube, so they did not become seeds.','The ovary held 12 ovules whatever the number of pollen grains, and ovules cannot form seeds without fertilisation.'],'Answer: Nine ovules were fertilised, so only these nine developed into seeds')}
  ] },

/* ================= LEVEL 9 ================= */
{ id:9, name:'Seed structure and germination', short:'Seed and germination',
  teach:{ h:'A seed holds an embryo and a food store, and needs three things to germinate', b:`
<p>A seed is a sleeping plant with its own lunch. The <b>testa</b> protects it. The <b>micropyle</b> is a tiny pore where water enters. The <b>cotyledons</b> store food. The <b>embryo</b> has a <b>radicle</b> (the future root) and a <b>plumule</b> (the future shoot). <b>Germination</b> is the start of growth of the embryo into a seedling. The radicle emerges first.</p>
${vis(seedDiag({labels:'all'}),'A bean seed cut open to show the embryo and the food store')}
${cards([{t:'Water', d:'Enters through the micropyle and testa; the seed swells and the testa splits. Enzymes become active.'},{t:'Oxygen', d:'Needed for aerobic respiration, which releases energy for growth.'},{t:'Suitable temperature', d:'Enzymes work best at a suitable temperature: too cold is slow, too hot damages them.'}],{min:170})}
${pw([
 'Seeds are sealed in a bottle filled to the top with boiled, cooled water. Predict whether they germinate.',
 'Water: yes, the seeds are surrounded by it.',
 'Temperature: room temperature, which is suitable.',
 'Oxygen: boiling drives out dissolved oxygen and the full bottle lets none in.'],
 'No germination: without oxygen the embryo cannot respire to release energy.')}
${prule('Water, oxygen and a suitable temperature. Most seeds do <b>not</b> need light or soil: the food comes from the seed\'s own store. In a fair test, change <b>one</b> condition and keep the others the same.')}
${ptrap('The plumule does not come out first. The <b>radicle</b> emerges first, anchors the seedling and takes in water, and the shoot follows.')}
${keyterms([['testa','protective seed coat'],['micropyle','pore where water enters'],['cotyledon','food store of the seed'],['radicle','the future root'],['plumule','the future shoot'],['germination','growth of the embryo into a seedling']])}` },
  reteach:{ h:'What a seed needs, and how to prove it', b:`
${vis(seedDiag({labels:[{k:'testa'},{k:'plumule'},{k:'cotyledon'},{k:'radicle'},{k:'micropyle'}], letters:true}),'A bean seed with five parts labelled')}
${dataTable(['Letter','Part','What to remember'],[['A','Testa','Protective coat'],['B','Plumule','Future shoot'],['C','Cotyledon','The bulk of the seed: its food store'],['D','Radicle','Future root; the first part to emerge'],['E','Micropyle','Tiny pore in the testa']],{w:520})}
<p>You can show what a seed needs by taking <b>one</b> need away at a time. The tube with everything is the <b>control</b>. Each other tube differs from it in <b>one</b> way only.</p>
${dataTable(['Tube','Only change from the control','Result','What it shows'],[
 ['A (control)','None: wet cotton wool, air, 25 °C, near a window','Seeds germinate','Conditions are suitable'],
 ['B','Cotton wool is dry','No germination','Water is needed'],
 ['C','Kept at 2 °C in a cold room, near a window','Little or no germination','A suitable temperature is needed'],
 ['D','Kept in a dark cupboard','Seeds germinate','Light is not needed']],{w:620})}
${pw([
 'Why must tube B be at 25 °C like the control, and not in a fridge?',
 'If B were colder as well as drier, a failure to germinate could be due to either.',
 'Changing one condition at a time makes the result clear.'],
 'Keep everything else the same: one change, one conclusion.')}
${prule('<b>One change, one conclusion.</b> The seed supplies its own food while it germinates, so soil nutrients are not needed at this stage. The radicle emerges first.')}
${keyterms([['control','the set-up with all conditions suitable'],['variable','a condition that can change'],['fair test','only one condition changed'],['radicle','emerges first']])}` },
  qs:[
  {type:'text', stem:`Which part of the embryo emerges first from a germinating seed and grows down to form the root?`, ans:'radicle', anyCase:true, accept:['radicles','the radicle'], ph:'one word',
   hint:`The word has the same start as root.`,
   sol:psol(['The embryo has two parts: the plumule (future shoot) and the radicle (future root).','The radicle emerges first, anchoring the seedling and absorbing water.'],'Answer: radicle')},
  {type:'mc', stem:`The diagram shows a bean seed cut open. Which letter labels the part that <b>stores the food</b> used by the embryo?`, v:vis(seedDiag({labels:[{k:'radicle'},{k:'cotyledon'},{k:'micropyle'},{k:'plumule'}], letters:true}),'A bean seed with four parts labelled'),
   opts:['A','B','C','D'], ans:1,
   hint:`It is the largest part of the seed, found around the embryo.`,
   sol:psol(['The embryo (radicle and plumule) is small. The bulk of the seed is the cotyledon, the food store.','B is the cotyledon.','A is the radicle, C is the micropyle (the pore in the testa) and D is the plumule.'],'Answer: B')},
  {type:'mc', stem:`For most seeds, which of the following is <b>not</b> needed for germination?`,
   opts:[`Bright sunlight shining directly on the seed`,`Water to soften the testa and activate enzymes`,`Oxygen for aerobic respiration in the embryo`,`A temperature at which enzymes can work well`], ans:0,
   hint:`Seeds buried in soil germinate in the dark.`,
   sol:psol(['Water enters and activates enzymes, oxygen supports respiration, and a suitable temperature lets the enzymes work.','Most seeds germinate underground in the dark, using the food stored in the cotyledons, so light is not needed.'],'Answer: Bright sunlight shining directly on the seed')},
  {type:'text', stem:`Name the tiny opening in the testa through which water first enters the seed.`, ans:'micropyle', anyCase:true, accept:['the micropyle','micropile'], ph:'one word',
   hint:`It is also where the pollen tube entered the ovule.`,
   sol:psol(['The micropyle is a small pore in the testa.','It is the entrance for the pollen tube in the ovule and, in the seed, the way water enters.'],'Answer: micropyle')},
  {type:'mc', stem:`A learner wants to show that seeds need <b>oxygen</b> to germinate. She puts 20 bean seeds in each of two bottles. Bottle 1 is filled with water that has been boiled and cooled, with a layer of oil on top. Bottle 2 contains ordinary wet cotton wool in air. Which set of conditions must be kept the <b>same</b> in both bottles?`,
   opts:[`Type of seed, number of seeds, temperature and water supply`,`Type of seed, number of seeds, temperature and oxygen supply`,`Number of seeds, oxygen supply and the type of liquid`,`Temperature and light only, because the seeds are the same type`], ans:0,
   hint:`The only thing allowed to differ is the condition being tested.`,
   sol:psol(['Oxygen is the condition being tested, so it must differ between the bottles.','Everything else that could affect germination must be kept the same: the type and number of seeds, the temperature and the water supply.','Keeping the oxygen supply the same would remove the thing being tested, and light alone is not enough.'],'Answer: Type of seed, number of seeds, temperature and water supply')}
  ] },

/* ================= LEVEL 10 ================= */
{ id:10, name:'Seed and fruit dispersal', short:'Dispersal',
  teach:{ h:'Seeds and fruits are built to travel', b:`
<p><b>Dispersal</b> is the carrying of seeds or fruits away from the parent plant. Its agent is wind, animals, water or the plant itself, and each fruit has features that fit its agent.</p>
${cards([
 {t:'Wind', d:'Light seeds with wings or parachutes of fine hairs, for example the dandelion.'},
 {t:'Animals (outside)', d:'Hooks, barbs or sticky surfaces catch in fur or feathers, for example the blackjack.'},
 {t:'Animals (inside)', d:'Sweet, fleshy fruit is eaten and the seeds pass out in the dung, away from the parent.'},
 {t:'Water', d:'Light, waterproof husk with air spaces floats, for example the coconut.'},
 {t:'Explosive', d:'A dry pod splits suddenly and throws the seeds out, for example a pea pod.'}],{min:150})}
${pw([
 'Fruit X is large, hard, light and covered in a thick, fibrous, waterproof husk full of air spaces. It is often found washed up on beaches.',
 'Light and air-filled: it floats.',
 'Waterproof husk: the seed inside stays dry and alive for a long time at sea.',
 'Found on beaches: it was carried there by water.'],
 'Dispersed by water.')}
${prule('<b>Why disperse?</b> Seedlings that grow far from the parent compete less for light, water and minerals, and the species can colonise new areas.')}
${ptrap('Dispersal is not pollination. Pollination moves <b>pollen</b> between flowers. Dispersal moves <b>seeds or fruits</b> away from the parent plant.')}
${keyterms([['dispersal','carrying of seeds or fruits away from the parent plant'],['competition','plants struggling for the same light, water and minerals'],['fleshy fruit','soft fruit that animals eat'],['hooks and barbs','catch in the fur of passing animals'],['explosive dispersal','a dry pod throws the seeds out']])}` },
  reteach:{ h:'Match the fruit to the method with a features table', b:`
<p>You do not have to remember every plant. Look at the <b>features</b> of the fruit and read off how it is carried. Here is the rule table.</p>
${contrast3(['Feature you see','How it is carried','Why the feature works'],[
 ['Very light, flattened or hairy parts that catch the air','Wind','Light parts are lifted and carried by air'],
 ['Bright, soft, sweet flesh around a hard seed','Animals, by being eaten','Animals eat the flesh; the hard seed passes through unharmed'],
 ['Hooks, barbs or a sticky coat','Animals, on the outside','They catch in fur or feathers and drop off later'],
 ['Light, waterproof, buoyant husk','Water','It floats and keeps the seed dry'],
 ['Dry pod with walls that twist as they dry','The plant itself, by splitting suddenly','The tension throws the seeds out']])}
${pw([
 'A shrub bears red berries, soft and sweet, each with one hard stone. Which row of the table applies?',
 'Bright colour and sweet flesh: an animal is attracted to eat it.',
 'Hard stone: it survives the animal\'s gut and is dropped in the dung.'],
 'Carried by animals, by being eaten.')}
${prule('<b>Ask what is carrying it.</b> Wind needs light parts. An animal must be rewarded (flesh) or must catch a ride (hooks). Water needs buoyancy and waterproofing. A dry pod needs the tension of drying. A seedling that lands under the parent has to share light, water and minerals with it.')}
${keyterms([['light, hairy','carried on the wind'],['fleshy and sweet','eaten by animals'],['hooked','sticks to animals'],['buoyant, waterproof','carried on water'],['dry, twisting pod','throws seeds out']])}` },
  qs:[
  {type:'mc', stem:`Which fruit is most likely to be carried by <b>animals that eat it</b>?`,
   opts:[`A bright red, sweet and juicy fruit with a hard seed inside`,`A dry, light fruit with a thin papery wing on one side`,`A small, dry fruit covered in tiny hooked bristles all over`,`A hard, light fruit with a buoyant, waterproof outer husk`], ans:0,
   hint:`Choose the fruit that rewards an animal for eating it.`,
   sol:psol(['A bright colour and sweet, juicy flesh attract an animal to eat the fruit.','The hard seed passes through the animal unharmed and is dropped in dung away from the parent.','A papery wing suits wind, hooked bristles suit animals carrying them on the outside, and a buoyant husk suits water.'],'Answer: A bright red, sweet and juicy fruit with a hard seed inside')},
  {type:'text', stem:`What name is given to the carrying of seeds or fruits away from the parent plant?`, ans:'dispersal', anyCase:true, accept:['seed dispersal','fruit dispersal','dispersion','seed and fruit dispersal'], ph:'one word',
   hint:`It is not pollination, which moves pollen.`,
   sol:psol(['Carrying seeds or fruits away from the parent is dispersal.','Pollination moves pollen, not seeds.'],'Answer: dispersal')},
  {type:'mc', stem:`Why is it an advantage to a plant when its seeds are dispersed <b>away</b> from the parent?`,
   opts:[`Seedlings are not shaded or crowded by the parent, so competition is less`,`Seeds that land far away are fertilised, but seeds near the parent are not`,`Dispersal brings pollen from other plants to the flowers of the parent`,`Seedlings far from the parent do not need water, light or minerals`], ans:0,
   hint:`Think about a seedling growing right under a large parent plant.`,
   sol:psol(['Directly under the parent, seedlings are shaded and share the soil\'s water and minerals with a larger plant and with each other.','Far away there is less competition, and new areas can be colonised.','Fertilisation has already happened before dispersal, dispersal does not carry pollen, and every seedling needs water, light and minerals.'],'Answer: Seedlings are not shaded or crowded by the parent, so competition is less')},
  {type:'text', stem:`The seeds of a certain tree are flat and have a thin papery wing that makes them spin slowly as they fall. Name the agent most likely to disperse them.`, ans:'wind', anyCase:true, accept:['the wind','wind dispersal','air','by wind','by the wind','wind-dispersed','wind dispersed'], ph:'one word',
   hint:`The wing makes the seed light and slows its fall.`,
   sol:psol(['A thin papery wing makes the seed light and slows its fall.','This gives the air time to carry it away from the parent: wind dispersal.'],'Answer: wind')},
  {type:'mc', stem:`A researcher counted seedlings of one tree species at different distances from the parent trees.<br>Which conclusion is best supported by the data?`, v:vis(dataTable(['Distance from parent tree (m)','0 to 2','2 to 10','10 to 20','20 to 30'],[['Seedlings still alive after one year (out of 100)','5','30','55','60']],{w:600}),'A researcher recorded the survival of seedlings'),
   opts:[`Seedlings survive better further from the parent, which supports dispersal reducing competition`,`Seedlings survive only if animals carry them, because the survival rate is lowest close to the parent tree`,`Seedlings near the parent tree germinate less often than seedlings far away from the parent`,`Seedlings 20 to 30 m away survive no better than seedlings only 2 m away from the parent tree`], ans:0,
   hint:`The table shows survival, not germination. Compare the first and last columns.`,
   sol:psol(['Survival rises from 5 out of 100 near the parent to 60 out of 100 at 20 to 30 m.','Seedlings near the parent face the most competition, so this supports dispersal reducing competition.','The data say nothing about animals or germination, and 60 is far higher than 5.'],'Answer: Seedlings survive better further from the parent, which supports dispersal reducing competition')}
  ] },

/* ================= LEVEL 11 ================= */
{ id:11, name:'Asexual reproduction in plant breeding', short:'Asexual and breeding',
  teach:{ h:'Farmers grow plants from pieces of a parent, and every piece is a clone', b:`
<p>Besides seeds, many plants can be grown from a part of the parent. This is <b>vegetative reproduction</b>, a kind of asexual reproduction. Farmers use it to get plants that are exactly like a good parent.</p>
${cards([
 {t:'Runner', d:'A creeping stem that roots and forms a new plant (strawberry).'},
 {t:'Bulb', d:'A short stem with fleshy leaves that divides (onion).'},
 {t:'Tuber', d:'A swollen underground stem with buds (potato).'},
 {t:'Rhizome', d:'An underground stem growing sideways, with buds along it (ginger, many grasses).'},
 {t:'Cutting', d:'A piece of stem or leaf that roots in soil or water (rose).'},
 {t:'Grafting', d:'A shoot of one plant is joined to the rooted stem of another (fruit trees).'},
 {t:'Tissue culture', d:'A few cells are grown on sterile nutrient jelly into many plants.'}],{min:170})}
${contrast('Advantages','Disadvantages',[
 ['Offspring are identical, so a good crop keeps its quality','No variation: one disease or climate change can kill every plant'],
 ['No pollination or seed formation is needed, so plants mature sooner','Plants grow crowded beside the parent unless the farmer spreads them'],
 ['Plants that cannot make viable seeds, such as seedless fruit, can be multiplied','A disease in the parent passes to every offspring']])}
${pw([
 'A farmer plants a plantation of 1 000 banana plants, all grown from pieces of a single parent plant. A virus arrives to which this variety has no resistance. Predict what happens.',
 'All the plants are clones, so every plant has the same genes.',
 'If one plant has no resistance, none of the others has it either.'],
 'Nearly every plant is infected: the whole crop is at risk.')}
${prule('Clones have the <b>same genes</b>, so they have the <b>same strengths and the same weaknesses</b>. That is an advantage while conditions stay the same, and a danger when they change.')}
${ptrap('Grafting and cuttings are still asexual: no gametes fuse, even though a farmer helps the plant. The offspring are clones.')}
${keyterms([['vegetative reproduction','a new plant grows from a part of the parent'],['clone','identical copy of the parent'],['cutting','a piece of stem or leaf that roots'],['grafting','joining a shoot to the rooted stem of another plant'],['tissue culture','growing many plants from a few cells in sterile jelly'],['resistance','ability to survive a disease']])}` },
  reteach:{ h:'Decide: do clones help or hurt in this situation?', b:`
<p>This is the asexual reproduction you met in Level 1, now used on farms. First check the main ways of making a new plant from a part of the parent.</p>
${dataTable(['Plant part or technique','What it is','Example'],[
 ['Tuber','A swollen underground stem with buds','Yam, Jerusalem artichoke'],
 ['Runner','A creeping stem that roots and forms a new plant','Strawberry'],
 ['Cutting','A piece of stem that grows roots','Rose'],
 ['Grafting','A shoot joined to the rooted stem of another plant','Fruit trees']],{w:560})}
<p>Then, for any situation, use a scaffold. Ask: <b>are the plants clones?</b> Then ask whether <b>conditions stay the same</b> or <b>change</b>.</p>
${chain(['Are the plants grown from a part of one parent?','If yes: they are clones with the same genes.','Do conditions stay the same (same market, same climate, no new disease)? Clones <b>help</b>: each plant keeps the parent\'s useful genes.','Do conditions change (new disease, hotter climate)? Clones <b>hurt</b>: no variation, so no plant may cope.'])}
${dataTable(['Situation','Clones help or hurt?','Reason'],[
 ['A grower wants every new plant to carry the disease resistance of one healthy plant','Help','Identical genes copy the resistance'],
 ['A new virus attacks the crop','Hurt','None of the plants is resistant'],
 ['A grower needs many young plants quickly from one good plant','Help','No pollination or waiting for seed'],
 ['The climate becomes hotter and drier over many years','Hurt','No variation, so no plant may cope with the change']],{w:620})}
${prule('Clones help when the <b>goal is sameness</b> and hurt when the <b>environment changes</b>.')}
${keyterms([['clone','identical genes'],['variation','differences that let some survive'],['propagation','making new plants'],['resistance','survives the disease']])}` },
  qs:[
  {type:'text', stem:`A potato plant forms swollen underground stems with buds, and each of these can grow into a new plant. What is this type of vegetative structure called?`, ans:'tuber', anyCase:true, accept:['tubers','stem tuber','potato tuber'], ph:'one word',
   hint:`The word also names a swollen underground stem such as the yam.`,
   sol:psol(['A swollen underground stem with buds that can grow into new plants is a tuber.','A bulb is a short stem with fleshy leaves, and a runner creeps over the ground.'],'Answer: tuber')},
  {type:'mc', stem:`Which is an <b>advantage</b> of growing a fruit tree from a cutting rather than from a seed?`,
   opts:[`The fruit will have the same quality as the fruit of the parent tree`,`The new tree will show variation that helps it resist new diseases`,`The new tree is formed by the fusion of two gametes and so is fitter`,`The new tree has no need of roots, so it can be planted at once`], ans:0,
   hint:`A cutting is a piece of the parent. What does that say about its genes?`,
   sol:psol(['A cutting grows by mitosis from the parent\'s own cells, so the new tree is a clone with the same genes.','The fruit is therefore the same as the parent\'s fruit.','Variation and fusion of gametes belong to sexual reproduction, and a cutting must grow roots to survive.'],'Answer: The fruit will have the same quality as the fruit of the parent tree')},
  {type:'text', stem:`What name is given to the technique in which a few cells from one plant are grown on sterile nutrient jelly to make many identical plants?`, ans:'tissue culture', anyCase:true, accept:['plant tissue culture','micropropagation','cloning','tissue culturing','tissue-culture','tissue culture technique','in vitro culture'], ph:'two words',
   hint:`The cells grow on a sterile jelly with nutrients.`,
   sol:psol(['A few cells from one plant are grown on sterile nutrient jelly into many small plants.','All the plants are clones of the original. The technique is tissue culture.'],'Answer: tissue culture')},
  {type:'mc', stem:`Grapes that have <b>no viable seeds</b> are grown commercially. Which is the best explanation of how new vines are made?`,
   opts:[`By cuttings or grafting, because there are no seeds and the vines are clones`,`By sowing the dark spots inside the fruit, because they are the seeds of the vine`,`By cross-pollinating two seedless vines every season to make new seed for sowing`,`By collecting pollen and growing it on nutrient jelly until it forms a vine`], ans:0,
   hint:`If there are no seeds, the new plants must come from a part of the parent.`,
   sol:psol(['A seedless variety has no viable seeds to sow.','New vines are made vegetatively, by cuttings or grafting, and so are clones of the parent.','Pollen cannot grow into a whole plant on its own, and two seedless vines cannot produce seed by cross-pollination.'],'Answer: By cuttings or grafting, because there are no seeds and the vines are clones')},
  {type:'mc', stem:`A farmer plants an orchard of 5 000 citrus trees, all grown from cuttings of one tree. A fungal disease spreads and kills every tree. Which is the best explanation?`,
   opts:[`The trees are genetically identical, so none had a gene for resistance to the fungus`,`Cuttings cannot resist disease because they grow without roots at first`,`Trees grown from seed would also have been identical, so nothing could have been done`,`The fungus changed the genes of the trees one after another until all were affected`], ans:0,
   hint:`Think about what the trees share, and what a clone cannot do.`,
   sol:psol(['All the trees are clones, so they share the same genes.','If one tree has no resistance, none of the others has it either, so all are vulnerable.','Trees grown from seed would show variation and some might resist. Cuttings do grow roots, and fungi do not rewrite a tree\'s genes.'],'Answer: The trees are genetically identical, so none had a gene for resistance to the fungus')}
  ] },

{ id:12, name:'Exam standard: plant investigations', short:'Data and investigations',
  teach:{ h:'A data question asks you to describe, explain, name the variables and evaluate', b:`
<p>An investigation question has four jobs. <b>Describe</b> what the data shows, using numbers. <b>Explain</b> it with biology. <b>Identify</b> the variables. <b>Evaluate</b> the conclusion: does the data support it, and what is missing?</p>
${vis(barChart({title:'Flowers that formed fruit (out of 30)', cats:['Open','Bagged','Bag+hand'], series:[{name:'Flowers', vals:[24,2,23]}], yLabel:'flowers', max:30, step:10, w:400}),'Data from a class investigation: pumpkin flowers were left open, covered with fine mesh bags before they opened, or covered and then hand-pollinated. There were 30 flowers in each group.')}
${pw([
 'Describe (2): 24 of the 30 open flowers formed fruit, but only 2 of the 30 bagged flowers did. Bagged flowers that were hand-pollinated did almost as well as open flowers (23 of 30).',
 'Explain (2): The bags kept out pollinating insects, so little pollen reached the stigmas and few ovules were fertilised. Hand-pollination supplied pollen, so fertilisation happened and fruit formed.',
 'Variables (3): independent = how the flowers were treated; dependent = number of flowers that formed fruit; constant = plant species, 30 flowers per group, same garden.',
 'Evaluate (2): the conclusion "insects are needed for fruit" is supported, but 2 bagged flowers still formed fruit, so a little pollen reached them or a bag was not sealed. Repeating the test would show whether this is reliable.'],
 'Model answer, 9 marks: numbers, a biological reason, three variables and a balanced evaluation.')}
${prule('<b>Describe</b> = what, with numbers. <b>Explain</b> = why, with a biological link (pollen, fertilisation, enzymes). <b>Variables</b> = what you change, what you measure, what you keep the same. <b>Evaluate</b> = supported or not, and what limits it.')}
${ptrap('Do not explain when asked to describe, and do not just repeat the numbers when asked to explain.')}
${keyterms([['independent variable','the condition that is changed'],['dependent variable','what is measured'],['constant variables','conditions kept the same'],['control','set-up used for comparison'],['reliable','gives similar results when repeated'],['conclusion','what the data tells you']])}` },
  reteach:{ h:'A four-step scaffold for any data question', b:`
<p>Use the same four steps every time. Here is a different data set: try to complete each sentence stem for it.</p>
${vis(dataTable(['Water given to each dish per day (mL)','0','2','5','10','40'],[['Bean seeds that sprouted (out of 20)','0','11','18','17','3']],{w:600}),'Data from a class investigation: 20 bean seeds in each dish, all at 22 °C')}
${dataTable(['Step','Sentence stem to complete'],[
 ['<b>Describe</b>','The highest was ___ at ___; the lowest was ___ at ___; between them the trend is ___.'],
 ['<b>Explain</b>','This happens because ___, which means ___.'],
 ['<b>Variables</b>','I changed ___ (independent). I measured ___ (dependent). I kept ___ the same.'],
 ['<b>Evaluate</b>','This supports / does not support the claim because ___. A limit of the data is ___.']],{w:620})}
${prule('Always finish an evaluation with a <b>limit</b> of the data: only five values tested, one dish each, or not repeated.')}
${keyterms([['describe','what the data shows'],['explain','why it happens'],['variable','something that can change'],['evaluate','judge the conclusion']])}` },
  qs:[
  {type:'num', stem:`Use the data to calculate the percentage of seeds that germinated at <b>15 °C</b>. Give a whole number.`, v:germTemp(), ans:48, unit:'%',
   hint:`Divide the number germinated by 50 and multiply by 100.`,
   sol:psol(['At 15 °C, 24 of the 50 seeds germinated.','Percentage = 24 &divide; 50 &times; 100 = 48.'],'Answer: 48')},
  {type:'mc', stem:`Which statement best <b>describes</b> the results?`, v:germTemp(),
   opts:[`Germination rose from 3 seeds at 10 °C to a peak of 42 at 25 °C, then fell to 0 at 45 °C`,`Germination rose steadily from 3 seeds at 10 °C to a peak of 42 seeds at 45 °C`,`Germination was highest at 15 °C with 24 seeds, and fell steadily to 0 seeds at 45 °C`,`Germination was highest at 35 °C with 30 seeds, and some seeds still germinated at 45 °C`], ans:0,
   hint:`Quote the highest value, the lowest value and the trend between them.`,
   sol:psol(['Read the chart: 3, 24, 42, 30 and 0 seeds at 10, 15, 25, 35 and 45 °C.','The peak is 42 seeds at 25 °C, after which the numbers fall to 0 at 45 °C.','The other options misplace the peak or state values that are not in the chart.'],'Answer: Germination rose from 3 seeds at 10 °C to a peak of 42 at 25 °C, then fell to 0 at 45 °C')},
  {type:'mc', stem:`Which is the best <b>explanation</b> for no seeds germinating at 45 °C?`, v:germTemp(),
   opts:[`The high temperature damaged the enzymes that the embryo needs to grow`,`At 45 °C the testa became too thick for water to enter the seed`,`The seeds respire only in the cold, so warmth stops all energy release`,`Light was missing at 45 °C, and seeds need light to germinate`], ans:0,
   hint:`Germination depends on enzymes, and enzymes are sensitive to temperature.`,
   sol:psol(['Germination depends on enzymes working in the embryo.','At 45 °C the high temperature damages (denatures) the enzymes, so the embryo cannot grow.','Water was available in every dish, the dishes all had the same light, and respiration is also enzyme-controlled so it does not need the cold.'],'Answer: The high temperature damaged the enzymes that the embryo needs to grow')},
  {type:'text', stem:`Name the <b>dependent variable</b> in this investigation: the quantity that the learners measured.`, v:germTemp(), ans:'number of seeds germinated', anyCase:true, accept:['seeds germinated','number germinated','the number of seeds germinated','number of seeds that germinated','the number of seeds that germinated','number of seeds germinating','germination','number of germinated seeds','number of seeds that germinate'], ph:'what was counted',
   hint:`The independent variable is what the learners changed on purpose. The dependent variable is what they counted.`,
   sol:psol(['The learners changed the temperature on purpose: that is the independent variable.','They counted how many of the 50 seeds germinated in each dish: that is the dependent variable.','Water, air, light, seed type and number of seeds were kept the same: these are the constant variables.'],'Answer: number of seeds germinated')},
  {type:'mc', stem:`A learner concludes: "Bean seeds germinate only at 25 °C." Which is the best evaluation of this conclusion?`, v:germTemp(),
   opts:[`Not supported: seeds also germinated at 10, 15 and 35 °C, so 25 °C is only the best tested`,`Fully supported: the highest number of seeds germinated at 25 °C out of all five temperatures`,`Supported: no seeds germinated at 45 °C, so 25 °C must be the only temperature that works`,`Not supported: the number of seeds germinating at 25 °C was lower than at any other temperature`], ans:0,
