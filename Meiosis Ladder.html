 'Replication doubles the chromatids (6 to 12). The chromosomes stay at 6.')}
${mrule('DNA replication happens <b>once</b>, in interphase, before meiosis I begins. It doubles the chromatids, not the chromosomes.')}
${keyterms([['interphase','the stage between divisions'],['S phase','the part of interphase when DNA is copied'],['DNA replication','making an identical copy of DNA'],['chromatin','uncoiled DNA and protein threads'],['organelle','a small structure inside a cell']])}` },
  reteach:{ h:'A before-and-after tally of one cell', b:`
<p>Look at the same cell twice, once before and once after the S phase, and tally what changed. The cell has 2n = 4.</p>
<div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-end">
<div>${chromSet(4,'single',{pairs:true,w:230})}<div style="text-align:center;font-size:13px;color:#6E6F72">Before S phase</div></div>
<div>${chromSet(4,'x',{pairs:true,w:230})}<div style="text-align:center;font-size:13px;color:#6E6F72">After S phase</div></div>
</div>
${dataTable(['Count','Before S phase','After S phase','Changed?'],[['Chromosomes','4','4','No'],['Chromatids','4','8','Yes, doubled'],['Homologous pairs','2','2','No']],{w:520})}
${mrule('Tally trick: chromatids = chromosomes before copying, and chromosomes &times; 2 after copying.')}
${mtrap('A cell does not become 4n or "diploid twice" after S phase. It still has 2n chromosomes; each one simply has two chromatids.')}
${keyterms([['S phase','DNA copied here'],['chromosome number','counted by centromeres, unchanged by copying']])}` },
  qs:[
  {type:'num', stem:`A cell with 2n = 12 is in the G1 stage, before the S phase. How many chromatids does the cell contain at the <b>end</b> of the S phase?`, ans:24, unit:'chromatids',
   hint:`Start with 12 chromosomes, then give each chromosome a second chromatid.`,
   sol:msol(['Before S phase: 12 chromosomes, 12 chromatids.','DNA replication gives each chromosome two chromatids.','12 &times; 2 = 24.'],'Answer: 24')},
  {type:'mc', stem:`A cell has 10 chromosomes at the start of interphase. Which row correctly describes the same cell at the <b>end</b> of the S phase?`,
   opts:[`10 chromosomes and 20 chromatids`,`20 chromosomes and 20 chromatids`,`10 chromosomes and 10 chromatids`,`20 chromosomes and 40 chromatids`], ans:0,
   hint:`Replication changes one of the two numbers, not both.`,
   sol:msol(['The chromosome number does not change in replication: it stays 10.','Each chromosome now has two chromatids: 10 &times; 2 = 20.','The option with 20 chromosomes treats every chromatid as a new chromosome.'],'Answer: 10 chromosomes and 20 chromatids')},
  {type:'text', stem:`Name the long stage of the cell cycle between one division and the next, during which the DNA is replicated.`, ans:'interphase', anyCase:true, accept:['inter phase','inter-phase','interphase of the cell cycle'], ph:'one word',
   hint:`It is not part of the division itself.`,
   sol:msol(['The stage between divisions, containing G1, S and G2, is interphase.'],'Answer: interphase')},
  {type:'mc', stem:`Why can individual chromosomes <b>not</b> be seen as separate rods in a cell during interphase?`,
   opts:[`The DNA is uncoiled into long, thin chromatin threads in the nucleus`,`The DNA has not been copied yet, so there is far too little of it to see`,`The nucleolus covers all of the chromosomes until prophase begins`,`The chromosomes have been broken down into separate nucleotides in the cytoplasm`], ans:0,
   hint:`Think about the shape of DNA when it is not packed for division.`,
   sol:msol(['In interphase the DNA is a loose tangle of chromatin, much too thin to make out as rods.','It coils up into visible chromosomes only at the start of prophase.','The other options are wrong: the DNA is intact and not broken down, and it is copied during interphase.'],'Answer: The DNA is uncoiled into long, thin chromatin threads in the nucleus')},
  {type:'mc', stem:`Data from a class investigation: a student measured the relative amount of DNA in the nucleus of one cell as it moved through interphase. Which statement best explains why the amount doubled from 8 to 16 units?`,
   v:dataTable(['Stage','Relative DNA per nucleus (arbitrary units)'],[['Start of interphase (G1)','8'],['Middle of S phase','12'],['End of S phase','16'],['G2, just before division','16']],{w:460}),
   opts:[`DNA was replicated in S phase, so each chromosome now has two chromatids`,`The cell divided by mitosis, so each new nucleus now holds twice as much DNA`,`The nucleus took in extra chromosomes from the cytoplasm during G2`,`The chromosome number doubled, so the cell became haploid in S phase`], ans:0,
   hint:`Look at which stage the rise happens in, and what happens to DNA in that stage.`,
   sol:msol(['The DNA rises only during S phase (8 to 12 to 16) and then stays at 16 in G2.','S phase is when DNA is replicated, so each chromosome gains a second chromatid.','Division would <b>halve</b> the DNA per nucleus, not double it, and the chromosome number does not change.'],'Answer: DNA was replicated in S phase, so each chromosome now has two chromatids')}
  ] },

/* ================= LEVEL 4 ================= */
{ id:4, name:'Prophase I: pairing and crossing over', short:'Prophase I',
  teach:{ h:'In prophase I the homologues pair up and swap segments', b:`
<p>Prophase I is the longest phase of meiosis. The chromatin coils into visible chromosomes, each with two chromatids. Then the homologous chromosomes <b>pair up</b> (synapsis) to form a <b>bivalent</b>. While paired, <b>non-sister chromatids</b> cross over at points called <b>chiasmata</b> (one is a <b>chiasma</b>) and swap segments.</p>
${chain(['Chromatin coils into visible chromosomes','Homologous chromosomes pair up as bivalents','Crossing over: non-sister chromatids swap segments at chiasmata','Nuclear membrane breaks down and spindle fibres form'])}
${vis(chromCross(), 'One bivalent before and after crossing over. Two of its four chromatids have swapped segments. (This diagram uses gold and blue for the two homologues.)')}
${mwk([
 'A cell has 2n = 6, so it has 6 chromosomes.',
 'Pairs of homologues lying together: 6 &divide; 2 = 3.',
 'Each pair has 2 chromosomes &times; 2 chromatids = 4 chromatids.',
 'Total chromatids: 3 &times; 4 = 12.'],
 'The cell has 3 homologous pairs lying together and 12 chromatids. The chromosome number is still 6.')}
${mrule('Crossing over happens in prophase I between <b>non-sister</b> chromatids of <b>homologous</b> chromosomes, and it creates new combinations of alleles.')}
${mtrap('Sister chromatids are identical, so swapping segments between them would change nothing. Crossing over is always between non-sister chromatids.')}
${keyterms([['synapsis','the pairing of homologous chromosomes'],['bivalent','a pair of homologous chromosomes together'],['chiasma (pl. chiasmata)','the point where chromatids cross over'],['crossing over','exchange of segments between non-sister chromatids'],['non-sister chromatids','chromatids of different homologues'],['spindle','fibres that move the chromosomes']])}` },
  reteach:{ h:'How prophase I differs from the prophase you already know', b:`
<p>Prophase of mitosis and prophase I both start the same way, but prophase I has two extra events. Put them side by side.</p>
${contrast('Prophase of mitosis','Prophase I of meiosis',[
 ['Chromosomes coil up, each with two chromatids','Chromosomes coil up, each with two chromatids'],
 ['Homologues stay <b>separate</b>','Homologues <b>pair up</b> as bivalents'],
 ['No exchange of segments','<b>Crossing over</b> at chiasmata, always between <b>non-sister</b> chromatids of the two homologues'],
 ['Nuclear membrane breaks down','Nuclear membrane breaks down']])}
${mwk([
 'Drawing checklist for a cell with 2n = 4 in prophase I:',
 '1. Only 4 chromosomes: 2 homologous pairs.',
 '2. Each chromosome drawn as 2 chromatids joined at a centromere: 4 &times; 2 = 8 chromatids.',
 '3. Each pair drawn <b>side by side</b>, with at least one chiasma.',
 '4. No nuclear membrane, and spindle fibres shown.'],
 'Two pairs, each with 4 chromatids, and 8 chromatids in the cell.')}
${keyterms([['bivalent','homologues paired side by side'],['chiasma','crossing point'],['prophase I','pairing and crossing over happen here']])}` },
  qs:[
  {type:'text', stem:`Name the process in which homologous chromosomes exchange segments of their chromatids during prophase I.`, ans:'crossing over', anyCase:true, accept:['crossing-over','crossover','cross over','cross-over','crossing over of chromatids','synapsis and crossing over','recombination','genetic recombination','chiasma formation'], ph:'two words',
   hint:`The points where it happens are called chiasmata.`,
   sol:msol(['Segments are swapped between non-sister chromatids at chiasmata.','This exchange is called crossing over.'],'Answer: crossing over')},
  {type:'num', stem:`A cell with 2n = 8 begins prophase I. How many <b>bivalents</b> form in this cell?`, ans:4, unit:'bivalents',
   hint:`A bivalent is one homologous pair.`,
   sol:msol(['Each bivalent is a pair of homologous chromosomes.','8 chromosomes &divide; 2 = 4 pairs.'],'Answer: 4')},
  {type:'text', stem:`Name the structure formed when a pair of homologous chromosomes lies side by side during prophase I.`, ans:'bivalent', anyCase:true, accept:['bivalents','a bivalent','tetrad','tetrads'], ph:'one word',
   hint:`It holds four chromatids altogether.`,
   sol:msol(['Two homologous chromosomes paired together, each with two chromatids, make one structure with four chromatids.','That structure is a bivalent.'],'Answer: bivalent')},
  {type:'mc', stem:`During crossing over, which parts of the chromosomes are exchanged?`,
   opts:[`Segments of non-sister chromatids belonging to a homologous pair`,`Segments between the two sister chromatids of one chromosome`,`Whole chromatids between two unrelated, non-homologous chromosomes`,`Complete chromosomes between two different bivalents in the cell`], ans:0,
   hint:`Sister chromatids are identical, so swapping between them would achieve nothing.`,
   sol:msol(['Crossing over takes place between the two homologues of a bivalent.','Only <b>non-sister</b> chromatids swap segments, because sister chromatids are identical.','Chromosomes of different pairs, or whole chromosomes, are not exchanged.'],'Answer: Segments of non-sister chromatids belonging to a homologous pair')},
  {type:'mc', stem:`Under the microscope, a student sees a cell in which the nuclear membrane has disappeared. Each chromosome is made of two chromatids, the homologous chromosomes lie side by side in pairs, and X-shaped crossings are visible between chromatids of the paired chromosomes. The pairs are scattered through the cell and are not lined up on the equator. Which phase is this?`,
   opts:[`Prophase I of meiosis`,`Prophase of mitosis`,`Prophase II of meiosis`,`Metaphase I of meiosis`], ans:0,
   hint:`Look for the two events that mitosis never has: pairing and crossing over.`,
   sol:msol(['Chromosomes lying in homologous pairs means bivalents have formed.','X-shaped crossings between chromatids are chiasmata, so crossing over is happening.','Neither pairing nor crossing over occurs in mitosis or in meiosis II, and in metaphase I the pairs would already be lined up on the equator.'],'Answer: Prophase I of meiosis')}
  ] },

/* ================= LEVEL 5 ================= */
{ id:5, name:'Metaphase I: bivalents at the equator', short:'Metaphase I',
  teach:{ h:'In metaphase I the pairs line up together on the equator', b:`
<p>In metaphase I the bivalents move to the middle of the cell, the <b>equator</b>. They line up as <b>pairs</b>: one homologue of each pair faces each pole. Spindle fibres from the poles attach to the centromeres. Which homologue faces which pole is decided by chance for every bivalent.</p>
${vis(mioCell('metI',{w:260}), 'Metaphase I for a cell with 2n = 4: two bivalents on the equator, each homologue facing one pole. Gold and charcoal show the two parents.')}
${mwk([
 'A cell has 2n = 6 in metaphase I.',
 'The homologues lie in the middle of the cell in pairs: 6 &divide; 2 = 3 pairs.',
 'Chromosomes: 6. Chromatids: 6 &times; 2 = 12.',
 'In mitosis the same cell would line up its 6 chromosomes <b>singly</b>, not in pairs.'],
 'Three pairs lie in the middle of the cell in metaphase I.')}
<p>Each bivalent can face either pole, so every extra bivalent doubles the number of ways the chromosomes can be sorted: n = 1 gives 2 combinations and n = 2 gives 4.</p>
${mrule('Metaphase I: <b>pairs</b> of homologous chromosomes on the equator. Metaphase of mitosis: <b>single</b> chromosomes on the equator. Number of combinations in the gametes = 2<sup>n</sup>.')}
${mtrap('Both phases have chromosomes on the equator. What tells them apart is whether the chromosomes are lined up in pairs or one by one.')}
${keyterms([['equator','the middle line of the cell'],['bivalent','a homologous pair'],['spindle fibres','thread-like fibres attached to centromeres'],['pole','either end of the cell'],['metaphase I','pairs on the equator']])}` },
  reteach:{ h:'Two ways to line up: counting the combinations', b:`
<p>Take a cell with 2n = 4. It has two bivalents. Each bivalent can face either way, and the choice is random. Here are two of the possible arrangements.</p>
<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">
<div>${mioCell('metI',{w:230,tag:'A'})}</div><div>${mioCell('metI',{w:230,tag:'B',flip:true})}</div></div>
${dataTable(['Arrangement','Cell at the LEFT pole gets','Cell at the RIGHT pole gets'],[['A','gold (top pair) + charcoal (bottom pair)','charcoal (top pair) + gold (bottom pair)'],['B','gold (top pair) + gold (bottom pair)','charcoal (top pair) + charcoal (bottom pair)']],{w:560})}
<p>Together A and B give four different combinations of parental chromosomes: gold top + charcoal bottom, charcoal top + gold bottom, gold top + gold bottom and charcoal top + charcoal bottom. Each extra bivalent doubles the number of combinations.</p>
${dataTable(['Haploid number n','Combinations of chromosomes in the gametes'],[['1','2 = 2<sup>1</sup>'],['2','4 = 2<sup>2</sup>'],['23 (human)','2<sup>23</sup> = 8 388 608, about 8,4 million']],{w:520})}
${mrule('Number of possible combinations in the gametes = 2<sup>n</sup>, where n is the haploid number. This is why the random arrangement of bivalents at metaphase I produces variation.')}
${keyterms([['random arrangement','each bivalent faces either pole by chance'],['independent assortment','each pair is sorted independently of the others'],['combination','one particular mix of parental chromosomes']])}` },
  qs:[
  {type:'num', stem:`The diploid number of a species is 10. In metaphase I of meiosis, how many <b>pairs</b> of homologous chromosomes lie together on the equator of one cell?`, ans:5, unit:'pairs',
   hint:`Each bivalent is two homologous chromosomes.`,
   sol:msol(['Each pair is a bivalent, made of two chromosomes.','10 &divide; 2 = 5.'],'Answer: 5')},
  {type:'num', stem:`A species has a haploid number of n = 3. Ignoring crossing over, how many different combinations of maternal and paternal chromosomes are possible in its gametes?`, ans:8, unit:'combinations',
   hint:`Each bivalent can face either way, so the choices multiply.`,
   sol:msol(['Each of the 3 bivalents has 2 possible orientations.','2 &times; 2 &times; 2 = 2<sup>3</sup> = 8.'],'Answer: 8')},
  {type:'text', stem:`Name the imaginary line across the middle of the cell, halfway between the poles, on which the chromosomes line up in metaphase.`, ans:'equator', anyCase:true, accept:['the equator','cell equator','equatorial plane','equatorial plate','metaphase plate','equatorial region'], ph:'one word',
   hint:`The poles are at the two ends of the cell.`,
   sol:msol(['The line halfway between the two poles is the equator of the cell.'],'Answer: equator')},
  {type:'mc', stem:`What is the significance of the <b>random</b> arrangement of bivalents on the equator in metaphase I?`,
   opts:[`It gives the gametes many different mixtures of maternal and paternal chromosomes`,`It makes sure the gametes receive exactly half the chromosomes of the parent cell`,`It lets non-sister chromatids exchange segments of DNA before the cell divides`,`It makes all four cells formed at the end of meiosis genetically identical to each other`], ans:0,
   hint:`Think about what the two arrangements A and B gave the cells at each pole.`,
   sol:msol(['Each bivalent faces either pole by chance, so different gametes get different mixtures of parental chromosomes.','Halving the number is done by separating the homologues in anaphase I, and exchange of segments is crossing over.','The four cells are not identical, they are varied.'],'Answer: It gives the gametes many different mixtures of maternal and paternal chromosomes')},
  {type:'mc', stem:`A cell from a species with 2n = 8 is examined. Four pairs of chromosomes lie side by side on the equator, and each chromosome is made of two chromatids. Which statement correctly identifies the phase and gives the reason?`,
   opts:[`Metaphase I, because the homologous chromosomes are lined up as pairs`,`Metaphase of mitosis, because the chromosomes are lying on the equator`,`Metaphase II, because each chromosome is made of two chromatids`,`Prophase I, because the homologous chromosomes are paired up`], ans:0,
   hint:`Look at how the chromosomes are arranged on the equator: in pairs or one by one?`,
   sol:msol(['Pairs of homologous chromosomes on the equator can only be metaphase I.','In metaphase of mitosis and in metaphase II the chromosomes are lined up singly.','In prophase I the pairs have not yet moved to the equator.'],'Answer: Metaphase I, because the homologous chromosomes are lined up as pairs')}
  ] },

/* ================= LEVEL 6 ================= */
{ id:6, name:'Anaphase I and telophase I', short:'Anaphase I, telophase I',
  teach:{ h:'Whole homologous chromosomes are pulled apart', b:`
<p>In anaphase I the spindle fibres shorten and pull the two chromosomes of each bivalent to <b>opposite poles</b>. The centromeres do not divide, so every chromosome still has <b>two chromatids</b>. In telophase I the chromosomes may uncoil and nuclear membranes may re-form, and cytokinesis splits the cell into <b>two haploid cells</b>.</p>
${vis('<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center"><div>'+mioCell('anaI',{w:250,tag:'A'})+'</div><div>'+mioCell('telI',{w:250,tag:'B'})+'</div></div>', 'A: anaphase I. Whole chromosomes, each still with two chromatids, move to opposite poles. B: the end of meiosis I: two cells, each with 2 chromosomes (drawn visible so they can be counted).')}
${mwk([
 'A cell with 2n = 8 has 4 bivalents in metaphase I.',
 'Anaphase I pulls one chromosome of each bivalent to each pole: 4 chromosomes to each pole.',
 'After telophase I each new cell has 4 chromosomes.',
 'Each of those chromosomes still has 2 chromatids: 4 &times; 2 = 8 chromatids per cell.'],
 'Each cell: 4 chromosomes (haploid) and 8 chromatids.')}
${mrule('Anaphase I separates the <b>homologous chromosomes</b>, which halves the chromosome number (2n to n). The chromatids stay together until meiosis II.')}
${mtrap('Do not say the chromatids separate in anaphase I. The two chromatids of each chromosome are still joined at the centromere after meiosis I.')}
${keyterms([['anaphase I','homologous chromosomes move to opposite poles'],['telophase I','two cells form, each with n chromosomes'],['cytokinesis','division of the cytoplasm'],['spindle fibres','shorten to pull chromosomes'],['reduction division','meiosis I, because 2n becomes n']])}` },
  reteach:{ h:'What moves? One rule for each anaphase, then a count drill', b:`
<p>Meiosis has two anaphases, and the only thing that changes is <b>what gets pulled apart</b>.</p>
${contrast('Anaphase I','Anaphase II',[['Homologous <b>chromosomes</b> separate','Sister <b>chromatids</b> separate'],['Centromeres do <b>not</b> divide','Centromeres <b>do</b> divide'],['2n becomes n','each daughter cell ends with n (chromatids become chromosomes)']])}
<p>Use the drill below on a cell with 2n = 10. Check each row by applying the rule: count centromeres for chromosomes, then double.</p>
${dataTable(['Stage','Chromosomes in the cell','Chromatids in the cell'],[['Metaphase I (whole cell)','10','20'],['After telophase I (each cell)','5','10'],['Metaphase II (each cell)','5','10'],['After telophase II (each cell)','5','5']],{w:540})}
${mrule('Count the centromeres for chromosomes. Chromatids are 2 per chromosome until the centromeres divide in anaphase II.')}
${keyterms([['homologues','move apart in anaphase I'],['chromatids','move apart in anaphase II'],['haploid','n, reached after telophase I']])}` },
  qs:[
  {type:'num', stem:`A cell has a diploid number of 6 (2n = 6). How many chromosomes are in <b>each</b> cell at the end of telophase I and cytokinesis?`, ans:3, unit:'chromosomes',
   hint:`Meiosis I halves the chromosome number.`,
   sol:msol(['Homologous chromosomes are separated, so each cell gets one chromosome of every pair.','6 &divide; 2 = 3.'],'Answer: 3')},
  {type:'num', stem:`A cell with 2n = 14 completes meiosis I. How many chromatids are in <b>each</b> of the two new cells?`, ans:14, unit:'chromatids',
   hint:`First find the chromosomes in each cell, then remember each is still made of two chromatids.`,
   sol:msol(['Chromosomes in each cell: 14 &divide; 2 = 7.','Each chromosome still has 2 chromatids: 7 &times; 2 = 14.'],'Answer: 14')},
  {type:'text', stem:`Name the structures that shorten and pull the homologous chromosomes towards opposite poles in anaphase I.`, ans:'spindle fibres', anyCase:true, accept:['spindle fibre','spindle fibers','spindle fiber','spindle','the spindle','spindle fibres','spindle microtubules','microtubules','spindle threads'], ph:'two words',
   hint:`They attach to the centromeres from the poles.`,
   sol:msol(['Fibres of the spindle attach to the centromeres and shorten.','Their shortening pulls the chromosomes apart.'],'Answer: spindle fibres')},
  {type:'mc', stem:`Which structures are pulled apart to opposite poles in <b>anaphase I</b>?`,
   opts:[`The two homologous chromosomes of each bivalent`,`The two sister chromatids of each chromosome`,`Pairs of non-homologous chromosomes from two different bivalents`,`The two sets of organelles of the original cell`], ans:0,
   hint:`The centromeres do not divide in this anaphase.`,
   sol:msol(['In anaphase I whole homologous chromosomes separate.','Sister chromatids only separate in anaphase II.','Anaphase I separates the two homologues of each bivalent, not chromosomes from different bivalents.'],'Answer: The two homologous chromosomes of each bivalent')},
  {type:'mc', stem:`Meiosis I is often called the "reduction division". Which observation about a cell at the end of telophase I best supports this name?`,
   opts:[`Each new cell has half the number of chromosomes of the original cell`,`Each new cell has only half the number of chromatids in each chromosome`,`Each new cell has half the amount of cytoplasm of the original cell`,`Each new cell has fewer genes on each and every one of its chromosomes`], ans:0,
   hint:`Reduction refers to the chromosome number, not the size of the cell.`,
   sol:msol(['Meiosis I reduces 2n to n, because homologues go to different cells.','The chromatids per chromosome are still 2 at this stage, and the genes on each chromosome are unchanged.','Cytoplasm is divided but that is not what "reduction" refers to.'],'Answer: Each new cell has half the number of chromosomes of the original cell')}
  ] },

/* ================= LEVEL 7 ================= */
{ id:7, name:'Meiosis II: chromatids separate', short:'Meiosis II',
  teach:{ h:'Meiosis II separates the chromatids, like mitosis', b:`
<p>Each of the two cells from meiosis I now divides again. There is <b>no DNA replication</b> in between, because every chromosome still has two chromatids. Meiosis II runs like mitosis: prophase II, metaphase II, anaphase II, telophase II and cytokinesis.</p>
${vis('<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center"><div>'+cellPhase('metaphase',{w:168,tag:'A'})+'</div><div>'+cellPhase('anaphase',{w:168,tag:'B'})+'</div><div>'+mioCell('telII',{w:168,tag:'C'})+'</div></div>', 'Meiosis II in a cell with n = 2. These pictures look the same as mitosis because meiosis II behaves like mitosis, but here the cell is haploid. A: 2 chromosomes (4 chromatids) in single file. B: centromeres have divided and chromatids move apart. C: two nuclei have formed, each with n = 2 chromosomes (uncoiled).')}
${mwk([
 'Each of the two cells from meiosis I divides again. Take one cell, with n = 3, entering metaphase II.',
 'It has 3 chromosomes, each with 2 chromatids: 6 chromatids, lined up singly.',
 'In the next phase the centromeres divide and the 6 chromatids separate, 3 to each pole.',
 'Each chromatid is now a chromosome with a single chromatid.'],
 'Each new cell has 3 chromosomes, each with 1 chromatid.')}
${mrule('Meiosis II: each of the two cells from meiosis I divides again. Anaphase II is the phase in which the sister chromatids separate.')}
${keyterms([['meiosis II','the second division, like mitosis'],['metaphase II','single chromosomes on the equator'],['anaphase II','centromeres divide, chromatids separate'],['telophase II','nuclei re-form in each cell'],['haploid','n, the number in every cell at the end']])}` },
  reteach:{ h:'Meiosis I and meiosis II side by side, phase by phase', b:`
<p>Set the two divisions next to each other for a cell with 2n = 4. The counts are for each cell at that stage.</p>
${contrast3(['Phase','Meiosis I (2n = 4 cell)','Meiosis II (n = 2 cell)'],[
 ['Prophase','Homologues pair; crossing over; 4 chromosomes, 8 chromatids','No pairing; 2 chromosomes, 4 chromatids'],
 ['Metaphase','2 <b>bivalents</b> (pairs) on the equator','2 <b>single</b> chromosomes on the equator'],
 ['Anaphase','Homologues separate: 2 whole chromosomes to each pole','Centromeres divide: 2 chromatids to each pole'],
 ['Telophase','2 cells, each 2 chromosomes with 2 chromatids','4 cells, each 2 chromosomes with 1 chromatid'],
 ['DNA copied first?','Yes, in the interphase before it','No, there is no copying before it']])}
${mrule('Meiosis I changes the chromosome number (2n to n). Meiosis II changes the chromatid number (2 to 1 per chromosome).')}
${keyterms([['meiosis I','separates homologues'],['meiosis II','separates chromatids'],['four haploid cells','the end result']])}` },
  qs:[
  {type:'num', stem:`One diploid cell with 2n = 8 completes <b>both</b> meiotic divisions. How many cells are present at the end of meiosis II?`, ans:4, unit:'cells',
   hint:`Meiosis I gives two cells, and then each of them divides again.`,
   sol:msol(['Meiosis I: 1 cell becomes 2 cells.','Meiosis II: each of the 2 cells divides, giving 2 &times; 2 = 4.'],'Answer: 4')},
  {type:'num', stem:`A cell has 5 chromosomes at metaphase II. How many chromatids does this cell contain?`, ans:10, unit:'chromatids',
   hint:`There is no replication between the divisions, so each chromosome still has two chromatids.`,
   sol:msol(['Chromosomes at metaphase II: 5, each still with 2 chromatids.','5 &times; 2 = 10.'],'Answer: 10')},
  {type:'text', stem:`In which phase of meiosis do the centromeres split, letting the chromatids move to opposite poles?`, ans:'anaphase II', anyCase:true, accept:['anaphase 2','anaphase two','anaphase ii','anaphase of meiosis II','meiosis II anaphase'], ph:'e.g. telophase I',
   hint:`Sister chromatids stay joined throughout meiosis I.`,
   sol:msol(['Centromeres only divide in the second division.','The phase where chromatids are pulled to opposite poles is anaphase II.'],'Answer: anaphase II')},
  {type:'mc', stem:`Why is there <b>no</b> DNA replication between meiosis I and meiosis II?`,
   opts:[`Each chromosome still has two chromatids, so nothing new needs to be copied`,`Haploid cells have no enzymes for copying DNA, so replication cannot happen`,`Crossing over has already doubled the total amount of DNA in each cell`,`The chromosome number must be halved again, so DNA is lost and not copied`], ans:0,
   hint:`Recall what each chromosome looks like at the end of telophase I.`,
   sol:msol(['At the end of meiosis I each chromosome still has two sister chromatids.','Meiosis II only has to separate those chromatids, so no new DNA is needed.','Haploid cells can replicate DNA, and crossing over swaps DNA but does not add any.'],'Answer: Each chromosome still has two chromatids, so nothing new needs to be copied')},
  {type:'mc', stem:`A cell from an organism with 2n = 8 is examined. It has 4 chromosomes, each made of two chromatids, lined up singly on the equator, and no chromosomes are paired. Which phase is this?`,
   opts:[`Metaphase II of meiosis`,`Metaphase I of meiosis`,`Metaphase of a mitotic division`,`Anaphase II of meiosis`], ans:0,
   hint:`Compare the number of chromosomes in the cell with the diploid number of the organism.`,
   sol:msol(['The organism has 2n = 8, but this cell has only 4 chromosomes, which is n (haploid).','So the cell has already been through meiosis I, and the chromosomes are lined up singly: metaphase II.','Metaphase I would show pairs, metaphase of mitosis would show 8 chromosomes, and in anaphase II the chromatids would already be moving apart.'],'Answer: Metaphase II of meiosis')}
  ] },

/* ================= LEVEL 8 ================= */
{ id:8, name:'The outcome of meiosis', short:'Outcome of meiosis',
  teach:{ h:'One diploid cell becomes four different haploid cells', b:`
<p>A complete meiosis turns <b>one diploid cell into four haploid cells</b>. The four cells are genetically different from one another and from the parent cell. In humans the testes make sperm and the ovaries make ova, and the two processes end differently.</p>
${vis(flow(['1 diploid cell (2n)','Meiosis I: 2 haploid cells','Meiosis II: 4 haploid cells']), 'The outcome of one complete meiosis')}
${contrast('Spermatogenesis (testis)','Oogenesis (ovary)',[
 ['One cell gives <b>four</b> sperm','One cell gives <b>one</b> ovum plus small polar bodies'],
 ['All four sperm are functional','The polar bodies break down'],
 ['Cytoplasm is shared equally','Most cytoplasm goes to the ovum, to feed the zygote'],
 ['Starts at puberty and continues','Starts before birth: the cells pause in prophase I until ovulation']])}
${mwk([
 'A cell of a hypothetical organism has 2n = 12.',
 'After meiosis I: 2 cells, each with 12 &divide; 2 = 6 chromosomes and 12 chromatids.',
 'After meiosis II: 4 cells, each with 6 chromosomes and 6 chromatids.',
 'The four cells carry different combinations of alleles.'],
 'One cell with 12 chromosomes gives four haploid cells with 6 chromosomes each.')}
${mrule('Meiosis halves the chromosome number, so that fertilisation can restore it, and it makes gametes that are genetically different.')}
${keyterms([['gamete','haploid sex cell'],['spermatogenesis','making sperm in the testis'],['oogenesis','making ova in the ovary'],['polar body','small cell formed with the ovum'],['haploid','n chromosomes']])}` },
  reteach:{ h:'Model answer: three reasons meiosis matters', b:`
<p>In humans, one meiosis in a testis gives four sperm. One meiosis in an ovary gives one ovum plus small cells that break down, because most of the cytoplasm goes to one cell. Recall also why the cells differ: crossing over in prophase I and the random arrangement of bivalents in metaphase I.</p>
<p>Examiners often ask <i>why</i> meiosis is important. Learn this three-mark answer and notice how each mark is a separate idea.</p>
${mwk([
 '<b>Question:</b> Explain why meiosis is important in the life cycle of a sexually reproducing organism. (3)',
 'Meiosis halves the chromosome number from 2n to n in the gametes. (1)',
 'Fertilisation restores the diploid number, so the chromosome number stays constant from one generation to the next. (1)',
 'Crossing over and the random arrangement of chromosomes make the gametes genetically different, which gives natural selection more variation to act on. (1)'],
 'Total: 3 marks, one for each idea.')}
${dataTable(['Mark','The idea','Key words'],[['1','halving','2n to n, haploid gametes'],['2','constant number','fertilisation restores 2n'],['3','variation','crossing over, random arrangement']],{w:520})}
${mtrap('Do not write that meiosis "makes the cells identical" or "doubles the chromosomes". Meiosis halves the number and the cells are different.')}
${keyterms([['variation','differences between individuals'],['adaptation','a feature that improves survival and reproduction']])}` },
  qs:[
  {type:'mc', stem:`Which row correctly describes the outcome of <b>one</b> complete meiosis in a human testis?`,
   opts:[`Four sperm, each haploid with 23 chromosomes`,`Two sperm, each diploid with 46 chromosomes`,`Four sperm, each diploid with 46 chromosomes`,`One sperm and three polar bodies, each with 23 chromosomes`], ans:0,
   hint:`Count the cells made from one cell, then the chromosome number in each.`,
   sol:msol(['Meiosis gives 4 cells from 1, and halves 46 to 23.','Spermatogenesis gives four <b>functional</b> sperm, while polar bodies belong to oogenesis.'],'Answer: Four sperm, each haploid with 23 chromosomes')},
  {type:'text', stem:`Name the small cells that are formed together with the single ovum during oogenesis and later break down.`, ans:'polar bodies', anyCase:true, accept:['polar body','polar cells','polar cell','polar bodies and ovum'], ph:'two words',
   hint:`They are formed because most of the cytoplasm goes to one cell.`,
   sol:msol(['In oogenesis the cytoplasm is shared very unequally.','The small cells that receive little cytoplasm are the polar bodies.'],'Answer: polar bodies')},
  {type:'mc', stem:`Why are the four gametes made from <b>one</b> diploid cell not genetically identical?`,
   opts:[`Crossing over and the random arrangement of bivalents shuffle the genetic material`,`The four cells inherit unequal numbers of chromosomes from the one parent cell they share`,`The DNA is copied in a slightly different way in each cell during meiosis II`,`Each gamete is made from a separate parent cell that carries different chromosomes`], ans:0,
   hint:`Think of what happens in prophase I and metaphase I.`,
   sol:msol(['Crossing over gives chromatids new combinations of alleles.','The random arrangement of bivalents gives each cell a different mix of parental chromosomes.','All four cells are haploid with the same number of chromosomes, and they come from one parent cell.'],'Answer: Crossing over and the random arrangement of bivalents shuffle the genetic material')},
  {type:'num', stem:`A testis contains 30 cells that each complete meiosis. How many sperm are produced in total?`, ans:120, unit:'sperm',
   hint:`How many sperm does one meiosis make?`,
   sol:msol(['One cell completing meiosis gives 4 sperm.','30 &times; 4 = 120.'],'Answer: 120')},
  {type:'mc', stem:`Consider the two statements about meiosis.<br>1. Meiosis, together with fertilisation, keeps the chromosome number of a species constant from one generation to the next.<br>2. One cell dividing by meiosis in a human ovary produces four functional ova.<br>Which option is correct?`,
   opts:[`Only statement 1 is correct`,`Only statement 2 is correct`,`Both statements are correct`,`Neither statement is correct`], ans:0,
   hint:`Check each statement on its own. How many functional ova come from one meiosis?`,
   sol:msol(['Statement 1 is true: meiosis halves 2n to n and fertilisation restores 2n, so together they keep the number constant.','Statement 2 is false: oogenesis gives one functional ovum and polar bodies.'],'Answer: Only statement 1 is correct')}
  ] },

/* ================= LEVEL 9 ================= */
{ id:9, name:'Sources of genetic variation', short:'Sources of variation',
  teach:{ h:'Three chance events make every gamete and every zygote different', b:`
<p>Apart from identical twins, brothers and sisters differ even though they have the same parents. Three events shuffle the genes, and the first two happen <b>during meiosis</b>.</p>
${cards([
 {t:'1. Crossing over (prophase I)',d:'Non-sister chromatids swap segments, so alleles end up in new combinations on the same chromosome.',hi:true},
 {t:'2. Random arrangement of bivalents (metaphase I)',d:'Each bivalent faces either pole by chance, so maternal and paternal chromosomes are mixed in the gametes. Also called independent assortment.',hi:true},
 {t:'3. Random fertilisation (after meiosis)',d:'Any sperm can fuse with any ovum, so each zygote joins two chance gametes.'}],{min:200})}
${mwk([
 'Humans have n = 23.',
 'One parent can make 2<sup>23</sup> = 8 388 608 combinations of chromosomes, before crossing over is counted.',
 'The other parent can do the same: 8 388 608.',
 'A child receives one gamete from each: 8 388 608 &times; 8 388 608 is about 7,0 &times; 10<sup>13</sup> combinations.'],
 'A different child from the same two parents is almost certain to differ.')}
${mrule('Variation from meiosis: <b>crossing over</b> and the <b>random arrangement of bivalents</b>. Random fertilisation adds more variation when the gametes meet.')}
${keyterms([['variation','differences between individuals'],['crossing over','swaps segments of chromatids'],['independent assortment','random arrangement of bivalents'],['allele','one form of a gene'],['gamete','sex cell'],['zygote','cell after fertilisation']])}` },
  reteach:{ h:'Bead strings and card shuffles', b:`
<p>Picture each chromosome as a string of coloured beads, where each bead is a gene. Gold beads came from the mother and charcoal beads from the father.</p>
<table class="rep"><tr><th>Event</th><th>Picture</th><th>What is new?</th></tr>
<tr><td><b>Crossing over</b></td><td>Before: <b style="color:#B07D00;letter-spacing:2px">P Q R S T</b> and <b style="color:#4D4D4F;letter-spacing:2px">p q r s t</b><br>After: <b style="color:#B07D00;letter-spacing:2px">P Q R</b><b style="color:#4D4D4F;letter-spacing:2px"> s t</b> and <b style="color:#4D4D4F;letter-spacing:2px">p q r</b><b style="color:#B07D00;letter-spacing:2px"> S T</b></td><td>Cut two strings at the same spot and swap the ends: each string now has gold and charcoal beads (new allele combinations on one chromosome).</td></tr>
<tr><td><b>Random arrangement</b></td><td>Two pairs of strings are tossed to the left or right pole with a coin.</td><td>Each gamete gets a different mix of whole gold and charcoal strings.</td></tr>
<tr><td><b>Random fertilisation</b></td><td>One bag of strings is picked from each parent by chance.</td><td>A new mix of two sets in every zygote.</td></tr></table>
${mtrap('A <b>mutation</b> is a change in the DNA itself (a bead changed into a different bead). It is not a step of meiosis, so it is not one of the sources of variation produced by meiosis. Random fertilisation also happens after meiosis, not during it.')}
${keyterms([['crossing over','new combinations on a chromosome'],['random arrangement','new combinations of whole chromosomes'],['mutation','a change in the DNA']])}` },
  qs:[
  {type:'text', stem:`Name the source of variation that happens after meiosis, when a sperm meets an ovum purely by chance.`, ans:'random fertilisation', anyCase:true, accept:['random fertilization','fertilisation','fertilization','chance fertilisation','chance fertilization','random fusion of gametes'], ph:'two words',
   hint:`It happens after meiosis is complete, when the gametes meet.`,
   sol:msol(['Which sperm fuses with which ovum is a matter of chance.','This adds variation and is called random fertilisation.'],'Answer: random fertilisation')},
  {type:'mc', stem:`Which source of variation mixes <b>whole chromosomes</b> into the gametes, rather than swapping parts of chromosomes?`,
   opts:[`The random arrangement of bivalents on the equator in metaphase I`,`Crossing over between non-sister chromatids during prophase I of meiosis`,`The copying of every chromatid during interphase before meiosis`,`The separation of sister chromatids at the poles in anaphase II`], ans:0,
   hint:`Crossing over swaps parts. Which event decides which whole chromosomes go to which pole?`,
   sol:msol(['In metaphase I each bivalent faces either pole by chance, so whole maternal and paternal chromosomes are mixed.','Crossing over swaps only parts of chromatids, and copying and chromatid separation do not create new combinations.'],'Answer: The random arrangement of bivalents on the equator in metaphase I')},
  {type:'mc', stem:`Which pair of events during meiosis produces genetic variation among the gametes?`,
   opts:[`Crossing over in prophase I and random arrangement of bivalents in metaphase I`,`DNA replication in interphase and separation of chromatids in anaphase II`,`Pairing of homologues in prophase I and cytokinesis in telophase II`,`Crossing over in prophase II and independent assortment in anaphase II of meiosis`], ans:0,
   hint:`Only two events shuffle genetic material, and both happen in the first division.`,
   sol:msol(['Crossing over (prophase I) and random arrangement (metaphase I) are the two sources of variation within meiosis.','Replication makes identical copies, cytokinesis only divides the cytoplasm, and neither crossing over nor independent assortment happens in meiosis II.'],'Answer: Crossing over in prophase I and random arrangement of bivalents in metaphase I')},
  {type:'num', stem:`A species has a diploid number of 2n = 8. Ignoring crossing over, how many different combinations of maternal and paternal chromosomes can one parent produce in its gametes?`, ans:16, unit:'combinations',
   hint:`First find n, then use 2 to the power n.`,
   sol:msol(['n = 8 &divide; 2 = 4.','Combinations = 2<sup>4</sup> = 2 &times; 2 &times; 2 &times; 2 = 16.'],'Answer: 16')},
  {type:'mc', stem:`Explain how meiosis contributes to genetic variation. (4) Which answer would earn full marks?`,
   opts:[`Crossing over in prophase I swaps segments between non-sister chromatids, giving new allele combinations. Bivalents are arranged randomly in metaphase I, so maternal and paternal chromosomes mix in the gametes.`,
         `Crossing over in prophase I swaps segments between sister chromatids, giving new allele combinations. Bivalents are arranged randomly in metaphase I, so maternal and paternal chromosomes are mixed in the gametes.`,
         `Mutation during DNA replication in interphase changes the alleles of each gamete in the testis or ovary. Random fertilisation during meiosis then joins two chromosomes together, so that every gamete formed is different.`,
         `Meiosis halves the chromosome number, so every gamete has fewer chromosomes than the parent cell. The zygote then receives a different number from each parent, so that the offspring are all different.`], ans:0,
   hint:`Full marks need both events, each with where it happens and what it changes. Check which chromatids swap.`,
   sol:msol(['Mark 1 and 2: crossing over in prophase I exchanges segments between <b>non-sister</b> chromatids, giving new allele combinations.','Mark 3 and 4: random arrangement of bivalents in metaphase I mixes maternal and paternal chromosomes in the gametes.','The answer with sister chromatids fails because sister chromatids are identical, the mutation answer fails because mutation is not part of meiosis and fertilisation is after it, and the halving answer fails because halving the number does not itself create variation.'],'Answer: Crossing over in prophase I swaps segments between non-sister chromatids, giving new allele combinations. Bivalents are arranged randomly in metaphase I, so maternal and paternal chromosomes mix in the gametes.')}
  ] },

/* ================= LEVEL 10 ================= */
{ id:10, name:'Meiosis compared with mitosis', short:'Meiosis vs mitosis',
  teach:{ h:'Same stages in name, very different results', b:`
<p>Mitosis and meiosis both copy DNA once and both use a spindle, but they have different jobs and different results. Use this table to compare them, and always compare like with like.</p>
${contrast('Mitosis','Meiosis',[
 ['In body cells (growth, repair)','In the gonads (animals), to make gametes'],
 ['<b>One</b> division','<b>Two</b> divisions'],
 ['<b>Two</b> daughter cells','<b>Four</b> daughter cells'],
 ['Daughters are diploid (2n), same as the parent','Daughters are haploid (n), half the parent number'],
 ['Daughters are genetically identical to the parent','Daughters are genetically different from the parent and from each other'],
 ['Homologues stay separate; no crossing over','Homologues pair; crossing over in prophase I']])}
${mwk([
 'A scientist watches a mouse cell (2n = 40) divide once.',
 'Number of daughter cells: 2. Mitosis gives 2, meiosis gives 4.',
 'Chromosomes in each daughter: 40, the same as the parent, so not halved.',
 'The daughters are identical copies of the parent cell.'],
 'This is mitosis.')}
${mrule('Check three things: the <b>number of daughter cells</b>, the <b>chromosome number</b> in them, and whether they are <b>identical</b> to the parent.')}
${keyterms([['mitosis','one division giving two identical diploid cells'],['meiosis','two divisions giving four haploid cells'],['gonad','organ that makes gametes'],['diploid','2n'],['haploid','n']])}` },
  reteach:{ h:'Name the phase from a picture: a clue checklist', b:`
<p>Exam diagrams show one cell and ask "which phase?". Work down the three clues in order.</p>
${vis(mioCell('metI',{w:240}), 'Pairs lying side by side on the equator mean meiosis I. Here, 2 bivalents.')}
${chain(['Are the chromosomes lying on the equator in <b>homologous pairs</b>? If yes, it is metaphase I of meiosis.','If they are in <b>single file</b>, count them and compare with the diploid number of the species.','The <b>same</b> as the diploid number: metaphase of mitosis. <b>Half</b> the diploid number: metaphase II of meiosis.'])}
${mwk([
 'A cell from a species with 2n = 10 shows 5 pairs of chromosomes side by side on the equator.',
 'Clue 1: the chromosomes are in homologous pairs.',
 'There are 5 pairs, which is 10 chromosomes, the full diploid number.'],
 'Pairs on the equator: metaphase I of meiosis.')}
<p>Recall: in anaphase I the homologous chromosomes separate, and in anaphase II the sister chromatids separate.</p>
${keyterms([['bivalent','pair on the equator'],['single file','one chromosome after another'],['diploid number','2n of the species']])}` },
  qs:[
  {type:'mc', stem:`Which feature is found in meiosis but <b>not</b> in mitosis?`,
   opts:[`Homologous chromosomes pair up and exchange segments`,`The DNA is copied once in the interphase before it`,`Spindle fibres attach to the centromeres of chromosomes`,`The cell divides by cytokinesis at the end of the process`], ans:0,
   hint:`Both processes copy DNA, use a spindle and finish with cytokinesis.`,
   sol:msol(['Pairing of homologues and crossing over happen only in prophase I of meiosis.','DNA copying, the spindle and cytokinesis occur in both.'],'Answer: Homologous chromosomes pair up and exchange segments')},
  {type:'mc', stem:`A cell from a species with 2n = 12 shows 6 chromosomes, each made of two chromatids, lined up in single file on the equator. Which stage is this?`,
   opts:[`Metaphase II of meiosis`,`Metaphase I of meiosis`,`Metaphase of a mitotic division`,`Anaphase I of meiosis`], ans:0,
   hint:`Compare 6 with the diploid number, and decide whether the chromosomes are in pairs or single.`,
   sol:msol(['They are in single file, so not metaphase I.','There are 6 chromosomes, which is half the diploid number of 12, so it is not mitosis.','Single chromosomes and the haploid number mean metaphase II.'],'Answer: Metaphase II of meiosis')},
  {type:'text', stem:`Name the organs in an animal inside which meiosis takes place to make gametes.`, ans:'gonads', anyCase:true, accept:['gonad','testes and ovaries','ovaries and testes','testis and ovary','ovary and testis','testes','ovaries','testis','ovary','sex glands','testes, ovaries','ovaries, testes','testes/ovaries'], ph:'one word',
   hint:`Testes and ovaries share one collective name.`,
   sol:msol(['Meiosis makes gametes, not body cells.','It takes place in the testes of a male and the ovaries of a female, which are together called the gonads.'],'Answer: gonads')},
  {type:'num', stem:`A scientist lets 15 diploid cells each complete one mitosis, and 15 other diploid cells each complete one whole meiosis. How many <b>more</b> cells does the meiosis group produce than the mitosis group?`, ans:30, unit:'cells',
   hint:`Work out the cells made from one starting cell in each process, then multiply by 15.`,
   sol:msol(['Mitosis: 1 cell gives 2 cells, so 15 cells give 15 &times; 2 = 30.','Meiosis: 1 cell gives 4 cells, so 15 cells give 15 &times; 4 = 60.','Difference: 60 - 30 = 30.'],'Answer: 30')},
  {type:'mc', stem:`Data from a class investigation: a student examined the daughter cells produced by two dividing cells, P and Q. Each parent cell had 2n = 8. Which row identifies the divisions correctly?`,
   v:dataTable(['Parent cell','Daughter cells formed','Chromosomes in each daughter cell'],[['P','2','8'],['Q','4','4']],{w:500}),
   opts:[`P is mitosis because its daughters keep 8 chromosomes, and Q is meiosis because its daughters have 4`,`P is meiosis because it gives only two cells, and Q is mitosis because it gives four cells`,`P is mitosis because it halves the chromosome number, and Q is meiosis because it keeps 4 chromosomes`,`Both are meiosis because both divisions produce cells with a different number to the parent`], ans:0,
   hint:`Compare the number of daughter cells and the chromosome number in them with the parent cell.`,
   sol:msol(['P: 2 cells, each with 8 chromosomes, the same as the parent (2n = 8). This is mitosis.','Q: 4 cells, each with 4 chromosomes, half of the parent. This is meiosis.','A complete meiosis gives four cells, not two, and mitosis never halves the chromosome number.'],'Answer: P is mitosis because its daughters keep 8 chromosomes, and Q is meiosis because its daughters have 4')}
  ] },

/* ================= LEVEL 11 ================= */
{ id:11, name:'Non-disjunction', short:'Non-disjunction',
  teach:{ h:'When chromosomes fail to separate', b:`
<p>Normally the homologues separate in anaphase I and the chromatids in anaphase II. <b>Non-disjunction</b> is the failure of homologous chromosomes (in anaphase I) or sister chromatids (in anaphase II) to separate. Some gametes then get one chromosome too many (n + 1) and some one too few (n − 1).</p>
${vis(chain(['One bivalent fails to separate in anaphase I','Two gametes are n + 1 and two gametes are n − 1','Fertilisation by a normal gamete (n)','Zygote is 2n + 1 (trisomy) or 2n − 1 (monosomy)']), 'The result of non-disjunction in anaphase I')}
${mwk([
 'An organism has 2n = 6, so n = 3, with bivalents A, B and C. The A bivalent fails to separate in anaphase I.',
 'One cell gets both A chromosomes plus one B and one C: 4 chromosomes (n + 1).',
 'The other cell gets only B and C: 2 chromosomes (n − 1).',
 'Meiosis II splits each cell normally, giving gametes with 4, 4, 2 and 2 chromosomes.',
 'Fertilisation by a normal gamete (n = 3): 4 + 3 = 7 or 2 + 3 = 5.'],
 'The zygotes have 7 chromosomes (2n + 1) or 5 chromosomes (2n − 1).')}
${mrule('<b>Trisomy</b> = three copies of one chromosome. <b>Monosomy</b> = only one copy. In humans, trisomy of chromosome 21 causes Down syndrome, and the risk rises with the age of the mother.')}
${keyterms([['non-disjunction','failure of chromosomes to separate'],['trisomy','three copies of one chromosome'],['monosomy','one copy of a chromosome'],['Down syndrome','caused by trisomy 21'],['n + 1','gamete with an extra chromosome']])}` },
  reteach:{ h:'Which anaphase failed? Count the four gametes', b:`
<p>A failure of chromosomes or chromatids to separate is called non-disjunction. Take a species with n = 2 (bivalents A and B). A normal gamete has 2 chromosomes. See what the four gametes look like when the failure is in the first or the second division.</p>
${dataTable(['Where the separation fails','Chromosomes in the four gametes','Normal (2)','Extra (3)','Missing (1)'],[
 ['Anaphase I, bivalent A fails','3, 3, 1, 1','0','2','2'],
 ['Anaphase II, in one of the two cells, chromosome A fails','2, 2, 3, 1','2','1','1']],{w:580})}
<p>In anaphase I, the error is carried into <b>both</b> cells made by meiosis I, so all four gametes are wrong. In anaphase II, only the cell that goes wrong passes on an error, so the other two gametes are normal.</p>
${mwk([
 'Anaphase II failure in one cell with n = 2:',
 'Cell 1 divides normally: two gametes with 2 chromosomes each.',
 'In cell 2 the two chromatids of chromosome A stay together: one gamete gets A, A and B (3 chromosomes).',
 'The other gamete gets only B (1 chromosome).'],
 'Gametes: 2, 2, 3, 1. Two are normal.')}
${mwk(['Fertilisation by a normal gamete (2 chromosomes), using the gametes above:','A 3-chromosome gamete + a normal gamete: 3 + 2 = 5, which is 2n + 1.'],'A 1-chromosome gamete + a normal gamete: 1 + 2 = 3, which is 2n − 1.')}
${keyterms([['n + 1','one extra chromosome'],['n − 1','one chromosome missing'],['anaphase I error','all four gametes affected'],['anaphase II error','two gametes affected']])}` },
  qs:[
  {type:'num', stem:`A human ovum with 24 chromosomes is fertilised by a normal sperm. How many chromosomes does the zygote contain?`, ans:47, unit:'chromosomes',
   hint:`A normal human sperm has 23 chromosomes.`,
   sol:msol(['Ovum: 24 chromosomes (one too many).','Normal sperm: 23 chromosomes.','Zygote: 24 + 23 = 47.'],'Answer: 47')},
  {type:'text', stem:`Name the term for the failure of homologous chromosomes or sister chromatids to separate during meiosis.`, ans:'non-disjunction', anyCase:true, accept:['nondisjunction','non disjunction','nondisjunction of chromosomes','non-disjunction of chromosomes'], ph:'one word',
   hint:`Dis-junction means separating; the word starts with a prefix meaning "not".`,
   sol:msol(['Chromosomes or chromatids that fail to separate cause gametes with extra or missing chromosomes.','This failure is called non-disjunction.'],'Answer: non-disjunction')},
  {type:'mc', stem:`A single cell goes wrong when one pair of chromosomes does not separate, and all four of the gametes it makes have the wrong number of chromosomes. At which stage did the failure occur?`,
   opts:[`Anaphase I, because both cells formed by meiosis I inherit the error`,`Anaphase II, because only one of the two cells formed in meiosis I is affected`,`Telophase I, because the nuclear membranes fail to re-form properly`,`Prophase I, because crossing over changes the chromosome number of the cell`], ans:0,
   hint:`Ask which failure affects both of the cells made in the first division.`,
   sol:msol(['An error in anaphase I is passed to both cells from meiosis I, so all four gametes are wrong.','An error in anaphase II affects only one cell, so the other two gametes would be normal.','Neither telophase I nor crossing over changes the chromosome number.'],'Answer: Anaphase I, because both cells formed by meiosis I inherit the error')},
  {type:'mc', stem:`Consider the two statements.<br>1. A person with trisomy 21 has three copies of chromosome 21 in the body cells of the person.<br>2. Non-disjunction in anaphase II in only one of the two cells can still produce normal gametes.<br>Which option is correct?`,
   opts:[`Only statement 1 is correct`,`Only statement 2 is correct`,`Both statements are correct`,`Neither statement is correct`], ans:2,
   hint:`Check each statement alone. Think about the second cell in a failure of anaphase II.`,
   sol:msol(['Statement 1 is true: trisomy 21 means three copies of chromosome 21.','Statement 2 is true: the cell that divides normally gives two normal gametes.'],'Answer: Both statements are correct')},
  {type:'mc', stem:`An ovum with 22 chromosomes is fertilised by a normal sperm. Which statement is correct?`,
   opts:[`The zygote has 45 chromosomes, a monosomy, because the ovum was missing a chromosome`,`The zygote has 45 chromosomes, a trisomy, because the ovum had an extra chromosome`,`The zygote has 46 chromosomes, which is normal, because the sperm and ovum each contribute n`,`The zygote has 44 chromosomes, because the sperm must also have lost a chromosome`], ans:0,
   hint:`Add the ovum and the sperm, then compare with 46.`,
   sol:msol(['Normal sperm: 23. Ovum: 22 (one fewer than normal n = 23).','Zygote: 22 + 23 = 45, which is one fewer than 46, so it is a monosomy.','A trisomy would need 47 chromosomes, and the sperm was normal.'],'Answer: The zygote has 45 chromosomes, a monosomy, because the ovum was missing a chromosome')}
  ] },

/* ================= LEVEL 12 ================= */
{ id:12, name:'Reading a karyotype', short:'Karyotypes',
  teach:{ h:'A karyotype lays the chromosomes out in homologous pairs', b:`
<p>A <b>karyotype</b> is a picture of all the chromosomes of one cell, cut out and arranged in homologous pairs, numbered roughly from largest to smallest. Pairs 1 to 22 are the <b>autosomes</b>. The last pair is the <b>sex chromosomes</b>: XX in a female and XY in a male. Doctors use karyotypes to count chromosomes and to spot extra or missing ones.</p>
${dataTable(['Part of the karyotype','Normal female karyotype'],[['Pairs 1 to 22 (autosomes)','2 chromosomes in each pair: 44 in all'],['Last pair (sex chromosomes)','X and X'],['Total number of chromosomes','46']],{w:520})}
${mwk([
 'Karyotype 1 shows 23 pairs of chromosomes.',
 'Pair 21 has two chromosomes, so there is no extra chromosome 21.',
 'The last pair is X and X, so the person is female.',
