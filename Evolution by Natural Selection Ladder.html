 sol:`<div class="step-line">A derived characteristic first appears at the node that is the common ancestor of all the organisms that have it, and of no others.</div><div class="step-line">At D the lineage has only the pigeon and the duck. The feature is found in the crocodile as well, so it first appears at C. At B the salamander would also have it.</div><div class="step-line ans">Answer: C</div>`},
{type:'mc', stem:`The cladogram shows five species of beetle. Which statement is correct?`, v:vis(cladogram([['Species P','Species Q'],['Species R',['Species S','Species T']]]), 'Cladogram of five beetle species.'), opts:[`Species S and T share a more recent common ancestor with each other than either does with species R`,`Species P and R share a more recent common ancestor than the one that P shares with species Q`,`Species Q is more closely related to species T than it is to species P, which is drawn beside it`,`Species R and S are more closely related to each other than species S is to its neighbour, species T`], ans:0,
 hint:'Find the node where S and T join, then compare it with the node where R joins them.',
 sol:`<div class="step-line">S and T join at their own node, near the tips. R joins them only at the next node down, so S and T are more closely related to each other than either is to R.</div><div class="step-line">P and Q are a pair. R and the group of S and T are another. P and Q are each equally distant from R, S and T, so the statements about P with R, and about Q with T, are wrong. R is further from S than T is.</div><div class="step-line ans">Answer: species S and T share a more recent common ancestor with each other than either does with species R</div>`},
{type:'text', stem:`A branching point on a cladogram represents the most recent ______ of the organisms found on the branches above it.`, ans:'common ancestor', anyCase:true, accept:['common ancestors','ancestor','shared ancestor','ancestral species','ancestral organism','last common ancestor','most recent common ancestor'], ph:'two words',
 hint:'It is the species from which the branches descended.',
 sol:`<div class="step-line">A node is where a lineage splits. It represents the common ancestor of everything on the branches above it.</div><div class="step-line ans">Answer: common ancestor</div>`},
{type:'mc', stem:`A researcher recorded five traits in four organisms, P, Q, R and S.
<br><b>Illustrative data.</b> Which cladogram is <b>consistent</b> with the table?`, v:vis(dataTable(['Trait','P','Q','R','S'],[['Trait 1','yes','yes','yes','yes'],['Trait 2','no','yes','yes','yes'],['Trait 3','no','no','yes','yes'],['Trait 4','no','no','yes','no'],['Trait 5','no','no','no','yes']],{w:380}))
 + `<div style="display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center"><div style="flex:1 1 100%;max-width:400px"><b>Option A</b>${cladogram(['P',['Q',['R','S']]],{w:340})}</div><div style="flex:1 1 100%;max-width:400px"><b>Option B</b>${cladogram(['P',['R',['Q','S']]],{w:340})}</div><div style="flex:1 1 100%;max-width:400px"><b>Option C</b>${cladogram([['P','Q'],['R','S']],{w:340})}</div><div style="flex:1 1 100%;max-width:400px"><b>Option D</b>${cladogram(['S',['R',['Q','P']]],{w:340})}</div></div>`, opts:['A','B','C','D'], ans:0,
 hint:'The organism with the fewest traits branches first. Then look at which traits are shared by only some.',
 sol:`<div class="step-line">P has only trait 1, which all four share, so P branches off first.</div><div class="step-line">Q has traits 1 and 2 and is next. R and S share trait 3, which Q lacks, so R and S branch together last. Traits 4 and 5 each belong to one organism only, so they do not change the grouping.</div><div class="step-line">Option B puts Q with S, but Q lacks trait 3. Option C pairs P with Q, but P lacks trait 2. Option D has S branching first, but S has the most traits.</div><div class="step-line ans">Answer: Option A</div>`}
]},

{ id:15, name:'Evolution and climate change', short:'Evolution under climate change',
  teach:{ h:'Under climate change, populations adapt, move or die out', b:`
<p>When the climate changes, each population has three possible outcomes. It can <b>adapt</b> by natural selection, it can <b>move</b> to a place where the climate suits it, or it can <b>go extinct</b>. People can also help.</p>
${cards([
 {t:'Adapt', d:'Needs variation in a useful trait, enough time (generations) and a population large enough to survive. A short generation time and a large population make it faster.', hi:true},
 {t:'Move', d:'Individuals disperse to a new area. If they cannot, people may do it for them: assisted migration.'},
 {t:'Go extinct', d:'No suitable variation, too little time, a very small population or nowhere to go.'},
 {t:'Human help', d:'Seed banks store seeds and so preserve genetic diversity. Artificial selection can breed crops, such as drought-tolerant maize.'}
],{min:200})}
<div class="worked"><span class="lbl">Worked example: model answer (6 marks)</span>
<div class="step-line">Explain how a warmer, drier climate could change a mountain wildflower population.</div>
<div class="step-line">1. There is variation in flowering time: some plants flower early and some late.</div>
<div class="step-line">2. Warmer, drier summers are the selective pressure.</div>
<div class="step-line">3. Early-flowering plants set seed before the hot, dry season and survive.</div>
<div class="step-line">4. Late-flowering plants die before they set seed, so fewer of them reproduce.</div>
<div class="step-line">5. The allele for early flowering is passed on to the offspring.</div>
<div class="step-line ans">6. Over generations the proportion of early-flowering plants in the population increases.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Use the six steps, and then add a judgement: will there be enough <b>variation</b>, <b>time</b> and <b>population size</b> for this to work?</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Do not write that a species "will evolve to cope". Evolution has no goal. If there is no variation or too little time, the population simply dies out.</p></div>
${keyterms([['adaptation','a trait that improves survival in the environment'],['extinction','the loss of every individual of a species'],['assisted migration','moving a species to a suitable new habitat'],['seed bank','a store of seeds that preserves genetic diversity'],['genetic diversity','the range of alleles in a population'],['generation time','the time from birth to reproduction']])}
`},
  reteach:{ h:'An essay plan: claim, three themes, counter, conclusion', b:`
<p>Recall from levels 5, 6, 12 and 13: selection needs variation, small populations lose alleles by chance, and a changing environment raises the proportion of a useful allele over generations. This level puts those ideas together.</p>
<p>A long answer is easier when you plan it as a frame first. This is the frame for any "discuss" or "evaluate" question on selection and biodiversity.</p>
${contrast3(['Part','What to write','Example for: how far can species adapt to a hotter climate?'],[
 ['Claim','One sentence that answers the question','Some species can adapt, but many cannot adapt fast enough'],
 ['Theme 1','Natural selection: the six steps in a scenario','Heat-tolerant individuals survive and the proportion rises'],
 ['Theme 2','What limits it: variation, generation time (the time from birth to reproduction), population size','Slow breeders have few generations before the change is complete'],
 ['Theme 3','Human help: seed banks (stores of seeds), assisted migration (people moving a species), artificial selection','Breed heat-tolerant crops; keep seeds in a seed bank; move seedlings to cooler sites by assisted migration'],
 ['Counter','One fact against your claim','A few species with long generation times may still survive by moving to cooler places, so extinction is not certain'],
 ['Conclusion','Link back to the claim','Adaptation works only with variation and time, so conservation must help']
])}
<div class="worked"><span class="lbl">Worked example: a plan, not a full essay</span>
<div class="step-line">Question: should a rare plant be moved to a cooler mountain, or left to adapt?</div>
<div class="step-line">Claim: moving it is safer, because adapting takes many generations.</div>
<div class="step-line">Themes: (1) six steps if it stays, (2) few seed-setting generations in the time available, (3) protect the site and move seedlings to a cooler site.</div>
<div class="step-line ans">Counter: the new site may carry diseases or competitors. Conclusion: move some plants, store seeds, and keep the rest as a test.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Plan for two minutes: claim, three themes, one counter, one conclusion. Then each paragraph is easy to write.</p></div>
`},
  qs:[
{type:'mc', stem:`A climate is becoming warmer. Which population is most likely to <b>adapt</b> by natural selection?`, opts:[`A large population with wide variation in heat tolerance and a short generation time`,`A small population with little heat-tolerance variation and a short generation time`,`A large population with wide variation in heat tolerance and a very long generation time`,`A small population with wide variation in heat tolerance and a very long generation time`], ans:0,
 hint:'Selection needs variation, population size and many generations.',
 sol:`<div class="step-line">Wide variation gives selection something to work on. A large population keeps enough individuals and alleles. A short generation time gives many generations in the time available.</div><div class="step-line">Each of the other options lacks at least one of these: small size, little variation or a long generation time.</div><div class="step-line ans">Answer: a large population with wide variation in heat tolerance and a short generation time</div>`},
{type:'mc', stem:`What is the main purpose of a <b>seed bank</b> in conserving biodiversity?`, opts:[`It stores seeds to preserve genetic diversity as a safeguard against extinction`,`It breeds new plant species by crossing the seeds that are brought into the bank`,`It lets plants adapt to climate change while they are kept in storage`,`It moves plant species to cooler places so that they can avoid a warming climate`], ans:0,
 hint:'Think about what is kept in the bank, and why it matters later.',
 sol:`<div class="step-line">A seed bank stores seeds from many plants and keeps their alleles. If a wild population is lost, the stored seeds can restore the species and its genetic diversity.</div><div class="step-line">Stored seeds do not evolve and are not crossed. Moving species is assisted migration, which is a different measure.</div><div class="step-line ans">Answer: it stores seeds to preserve genetic diversity as a safeguard against extinction</div>`},
{type:'text', stem:`When people move a species to a new habitat where the future climate will suit it, this is called assisted ______.`, ans:'migration', anyCase:true, accept:['assisted migration','migrate','colonisation','colonization','assisted colonisation','assisted colonization','relocation','translocation','managed relocation','dispersal'], ph:'one word',
 hint:'People help the species to move.',
 sol:`<div class="step-line">Moving a species to a suitable new habitat is called assisted migration.</div><div class="step-line ans">Answer: migration</div>`},
{type:'num', stem:`A beetle species has a generation time of 3 years. The climate is expected to keep changing for the next 60 years. How many generations of beetles will there be in that time?`, ans:20, ph:'e.g. 10',
 hint:'Divide the number of years by the length of one generation.',
 sol:`<div class="step-line">The number of generations is the time available divided by the generation time.</div><div class="step-line">60 years ÷ 3 years per generation = 20 generations. A species with a short generation time gets more generations, so selection has more chances to act before the climate has finished changing.</div><div class="step-line ans">Answer: 20</div>`},
{type:'mc', stem:`A news headline reads: "Species will simply evolve to cope with climate change." A scientist considers two species over the next 50 years, during which the temperature is expected to rise by 3 °C.
<br><b>Illustrative data.</b> <b>Evaluate</b> the headline.`, v:vis(dataTable(['','Species P','Species Q'],[['Generation time','1 year','25 years'],['Population size','about 100\u202f000','about 200'],['Variation in heat tolerance','wide','very little']],{w:420}), 'Illustrative data for two species.'), opts:[`Only partly true: P has about 50 generations and variation so may adapt, but Q has about 2 generations and little variation and may need help or go extinct`,`True for both: all species have enough time to evolve, because evolution always produces the traits that a changing environment needs, whatever the speed of the change`,`False for both: species can never evolve fast enough to keep up with a change in the climate, so every species will go extinct in the 50 years`,`Only partly true: Q will adapt faster than P because it has the longer generation time and a smaller population, while P has too many individuals to change`], ans:0,
 hint:'Divide the 50 years by each generation time, and use the variation and population size.',
 sol:`<div class="step-line">Species P: 50 ÷ 1 = 50 generations, a large population and wide variation. Selection has a lot to work with, so P may well adapt.</div><div class="step-line">Species Q: 50 ÷ 25 = 2 generations, a small population and very little variation. Selection has little time and little variation to act on, so Q may need assisted migration or a seed or captive programme, or it may go extinct.</div><div class="step-line">So the headline is only partly true. Evolution has no goal, so some species will adapt and some will not. A long generation time and a small population make adaptation slower, not faster.</div><div class="step-line ans">Answer: only partly true: P has about 50 generations and variation so may adapt, but Q has about 2 generations and little variation and may need help or go extinct</div>`}
]}
];

  totalQ:0, totalC:0,
  t0:Date.now(),
  cur:null,            // current question object
  sel:null,            // selected mc index
  tries:0,
  ended:false
};

/* ---------- strip ---------- */
function buildStrip(){
  stepsEl.innerHTML = LEVELS.map(function(l,i){return '<div class="step" id="st'+i+'"></div>';}).join('');
  var t=document.getElementById('lvlTot'); if(t) t.textContent = LEVELS.length;
}
function paintStrip(){
  LEVELS.forEach(function(l,i){
    const el=document.getElementById('st'+i); if(!el) return;
    el.className='step';
    if(i===S.li && !S.ended) el.classList.add('now');
    else if(S.stats[i].wrong>0) el.classList.add('stumble');
    else if(S.stats[i].correct>0) el.classList.add('done');
  });
  lvlNumEl.textContent = S.li+1;
  lvlNameEl.textContent = LEVELS[S.li].short;
  scoreLblEl.textContent = S.totalC+' / '+S.totalQ+' correct';
}

/* ---------- small builders ---------- */
function card(inner){ return '<section class="card">'+inner+'</section>'; }
function band(html){ return '<div class="band">'+html+'</div>'; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function scrollTop(){ window.scrollTo({top:0,behavior:'smooth'}); }

/* ==========================================================
   SCREENS
   ========================================================== */
function screenStart(){
  stripEl.classList.add('hide');
  app.innerHTML = card(
    '<p class="eyebrow">IEB Grade 12 Life Sciences · Diversity, change and continuity</p>'+
    '<h1>The Evolution Ladder</h1>'+
    '<p class="sub">Fifteen levels, from where variation comes from up to speciation, cladograms and evolution in modern times.</p>'+
    '<p>Each level teaches one idea, then asks you a question about it.</p>'+
    '<div class="callout"><span class="lbl">How this works</span>'+
    '<p>Get it right and you climb to the next level. <b>Get it wrong and you drop back one level</b> &mdash; where the idea is explained a <b>different way</b>, with a <b>different example</b>. Once that clicks, you climb straight back up and carry on.</p>'+
    '<p>Nothing is timed, and there is no penalty for dropping back. That is how the ladder is meant to work.</p></div>'+
    '<h3>What is your name?</h3>'+
    '<div class="inputrow"><input type="text" class="wide" id="nameIn" placeholder="Your name" autocomplete="off"></div>'+
    '<div class="btnrow"><button class="primary" id="goBtn">Start at Level 1</button></div>'
  );
  const inp=document.getElementById('nameIn');
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') start(); });
  document.getElementById('goBtn').onclick = start;
  function start(){
    S.name = (inp.value||'').trim();
    S.t0 = Date.now();
    stripEl.classList.remove('hide');
    screenTeach(false);
  }
}

function screenTeach(isRe){
  const L = LEVELS[S.li];
  S.stats[S.li].reached = true;
  if(isRe) S.stats[S.li].reteaches++;
  S.seen[S.li]=true;
  const t = isRe ? L.reteach : L.teach;
  let head='';
  if(isRe){
    head = band('<b>Let us try that a different way.</b> Same idea, new explanation, new example. Take your time &mdash; there is no rush and nothing is being marked.');
  }
  app.innerHTML = head + card(
    '<p class="eyebrow">Level '+(S.li+1)+' of '+LEVELS.length+' &middot; '+esc(L.name)+(isRe?' &middot; second look':'')+'</p>'+
    '<h2>'+t.h+'</h2>'+
    '<div style="margin-top:14px">'+t.b+'</div>'+
    '<div class="btnrow"><button class="primary" id="qBtn">'+(isRe?'Try a new question':'Try a question')+'</button></div>'
  ) + endLink();
  document.getElementById('qBtn').onclick = function(){ screenQuestion(); };
  wireEnd();
  paintStrip(); scrollTop();
}

function endLink(){
  return '<div style="text-align:center;margin-top:18px"><button class="link" id="endBtn">End the session and see my report</button></div>';
}
function wireEnd(){
  const b=document.getElementById('endBtn');
  if(b) b.onclick=function(){ if(confirm('End the session now and see the progress report?')) screenReport(); };
}

function screenQuestion(){
  const L = LEVELS[S.li];
  const q = L.qs[ S.qIdx[S.li] % L.qs.length ];
  S.qIdx[S.li]++;
  S.cur = q; S.sel = null; S.tries = 0;

  let body = '<p class="eyebrow">Level '+(S.li+1)+' &middot; '+esc(L.short)+'</p>';
  body += '<div class="qtext">'+q.stem+'</div>';
  if(q.v) body += q.v;
  body += answerUI(q);
  body += '<div class="btnrow"><button class="primary" id="checkBtn">Check my answer</button>'+
          '<button class="ghost" id="hintBtn">Show me a hint</button></div>'+
          '<div id="hintBox"></div><div id="fb"></div>';

  app.innerHTML = card(body) + endLink();

  document.getElementById('checkBtn').onclick = check;
  document.getElementById('hintBtn').onclick = function(){
    document.getElementById('hintBox').innerHTML =
      '<div class="fb nudge"><div class="hd">Hint</div><p>'+esc(q.hint)+'</p></div>';
    this.disabled=true; this.style.opacity=.5;
  };
  if(q.type==='mc'){
    Array.prototype.forEach.call(document.querySelectorAll('button.opt'),function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll('button.opt'),function(x){x.classList.remove('sel');});
        b.classList.add('sel'); S.sel=parseInt(b.dataset.i,10);
      };
    });
  } else {
    Array.prototype.forEach.call(document.querySelectorAll('.ansIn'),function(i){
      i.addEventListener('keydown',function(e){ if(e.key==='Enter') check(); });
    });
    const first=document.querySelector('.ansIn'); if(first) first.focus();
  }
  wireEnd();
  paintStrip(); scrollTop();
}

function answerUI(q){
  if(q.type==='mc'){
    return '<div class="opts">'+q.opts.map(function(o,i){
      return '<button class="opt" data-i="'+i+'">'+o+'</button>';
    }).join('')+'</div>';
  }
  if(q.type==='frac'){
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<span class="fracinput"><input type="text" class="ansIn" id="inN" inputmode="numeric" aria-label="numerator">'+
      '<span class="rule"></span>'+
      '<input type="text" class="ansIn" id="inD" inputmode="numeric" aria-label="denominator"></span></div>';
  }
  if(q.type==='order'){
    return '<div style="margin:14px 0">'+q.items.map(function(t,i){
      return '<div class="orderrow"><input type="text" class="ansIn" id="inO'+i+'" inputmode="numeric" aria-label="position of item '+String.fromCharCode(65+i)+'">'+
             '<div class="txt"><b>'+String.fromCharCode(65+i)+'.</b> '+t+'</div></div>';
    }).join('')+'</div><div style="font-size:13.5px;color:#6E6F72">Number the boxes <b>1</b> to <b>'+q.items.length+'</b> to show the correct order.</div>';
  }
  if(q.type==='text'){
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<input type="text" class="ansIn" id="inT" style="width:190px;text-align:left;font-size:19px" '+
      'autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="'+(q.ph||'')+'" aria-label="answer">'+
      '</div>';
  }
  if(q.type==='coeff'){
    var i=0, out='<div class="coeffrow">';
    q.parts.forEach(function(p){
      if(p==='+'){ out+='<span class="plus">+</span>'; return; }
      if(p==='->'){ out+='<span class="arrow">&rarr;</span>'; return; }
      out+='<input type="text" class="ansIn" id="inC'+i+'" inputmode="numeric" aria-label="coefficient '+(i+1)+'">'+ch(p);
      i++;
    });
    return out+'</div><div style="font-size:13.5px;color:#6E6F72;margin-top:-6px">Put a number in every box. If a formula needs no multiplier, type <b>1</b>.</div>';
  }
  if(q.type==='ratio'){
    const three = q.ans.c!==undefined;
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<input type="text" class="ansIn" id="inA" inputmode="numeric" style="width:72px" aria-label="first number">'+
      '<span class="colon">:</span>'+
      '<input type="text" class="ansIn" id="inB" inputmode="numeric" style="width:72px" aria-label="second number">'+
      (three?'<span class="colon">:</span><input type="text" class="ansIn" id="inC" inputmode="numeric" style="width:72px" aria-label="third number">':'')+
      '</div>';
  }
  if(q.type==='mixed'){
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<input type="text" class="ansIn" id="inW" inputmode="numeric" aria-label="whole number" style="width:64px">'+
      '<span class="fracinput"><input type="text" class="ansIn" id="inN" inputmode="numeric" aria-label="numerator">'+
      '<span class="rule"></span>'+
      '<input type="text" class="ansIn" id="inD" inputmode="numeric" aria-label="denominator"></span></div>';
  }
  return '<div class="inputrow"><span class="unit">Answer:</span>'+
    (q.unit==='R'?'<span class="unit">R</span>':'')+
    '<input type="text" class="ansIn wide" id="inX" inputmode="decimal" aria-label="answer">'+
    (q.unit&&q.unit!=='R'?'<span class="unit">'+q.unit+'</span>':'')+'</div>';
}

/* ---------- reading + marking ---------- */
function readInt(id){
  const el=document.getElementById(id); if(!el) return null;
  const v=(el.value||'').trim().replace(/\s/g,'');
  if(!/^-?\d+$/.test(v)) return null;
  return parseInt(v,10);
}
function readNum(id){
  const el=document.getElementById(id); if(!el) return null;
  let v=(el.value||'').trim().replace(/\s/g,'').replace(/,/g,'.').replace(/^R/i,'').replace(/%$/,'');
  v=v.replace(/\/.*$/,'');                              /* "90km/h" -> "90km" */
  v=v.replace(/[A-Za-z\u2113\u00b0\u00b2\u00b3]+$/,'');   /* "44g", "36m²" -> the number */
  if(!/^-?\d*\.?\d+$/.test(v)) return null;
  return parseFloat(v);
}

function mark(q){
  /* returns {state:'right'|'wrong'|'nudge'|'blank', msg} */
  if(q.type==='mc'){
    if(S.sel===null) return {state:'blank'};
    if(S.sel===q.ans) return {state:'right'};
    if(q.nudge && q.nudge[S.sel]) return {state:'nudge', msg:q.nudge[S.sel]};
    return {state:'wrong'};
  }
  if(q.type==='frac'){
    const n=readInt('inN'), d=readInt('inD');
    if(n===null||d===null||d===0) return {state:'blank'};
    if(n===q.ans.n && d===q.ans.d) return {state:'right'};
    if(n*q.ans.d === q.ans.n*d){
      return {state:'nudge', msg:'The <b>value</b> is right, but it is not in its lowest terms yet. Divide the top and the bottom by the biggest number that goes into both, then check again.'};
    }
    return {state:'wrong'};
  }
  if(q.type==='mixed'){
    const w=readInt('inW'), n=readInt('inN'), d=readInt('inD');
    if(w===null||n===null||d===null||d===0) return {state:'blank'};
    if(w===q.ans.w && n===q.ans.n && d===q.ans.d) return {state:'right'};
    const mine=w + n/d, target=q.ans.w + q.ans.n/q.ans.d;
    if(Math.abs(mine-target)<1e-9){
      if(n>=d) return {state:'nudge', msg:'Close. The value is right, but the fraction part must be <b>less than one whole</b>. Carry the extra whole across into the whole-number box.'};
      return {state:'nudge', msg:'The <b>value</b> is right, but the fraction part is not in its lowest terms. Simplify it and check again.'};
    }
    return {state:'wrong'};
  }
  if(q.type==='ratio'){
    const three = q.ans.c!==undefined;
    const a=readInt('inA'), b=readInt('inB'), c=three?readInt('inC'):null;
    if(a===null||b===null||(three&&c===null)) return {state:'blank'};
    if(a<=0||b<=0||(three&&c<=0)) return {state:'wrong'};
    if(a===q.ans.a && b===q.ans.b && (!three || c===q.ans.c)) return {state:'right'};
    let equiv = (a*q.ans.b === b*q.ans.a);
    if(three) equiv = equiv && (a*q.ans.c === c*q.ans.a);
    if(equiv){
      return {state:'nudge', msg:'That ratio has the <b>right proportions</b>, but it is not in its simplest form yet. Divide every number by the biggest value that goes into all of them, then check again.'};
    }
    return {state:'wrong'};
  }
  if(q.type==='order'){
    const n=q.ans.length, got=[];
    for(let i=0;i<n;i++){
      const v=readInt('inO'+i);
      if(v===null) return {state:'blank'};
      got.push(v);
    }
    const seen={};
    let perm=true;
    for(let i=0;i<n;i++){ if(got[i]<1||got[i]>n||seen[got[i]]) perm=false; seen[got[i]]=1; }
    if(!perm) return {state:'nudge', msg:'Use each number from <b>1 to '+n+' exactly once</b> &mdash; one number per sentence, no repeats and none left out.'};
    let same=true; for(let i=0;i<n;i++) if(got[i]!==q.ans[i]) same=false;
    if(same) return {state:'right'};
    return {state:'wrong'};
  }
  if(q.type==='text'){
    const el=document.getElementById('inT'); if(!el) return {state:'blank'};
    const norm=function(t){
      return String(t)
        .replace(/\s+/g,'')
        .replace(/\u2212/g,'-')                 /* a real minus sign */
        .replace(/\u00d7|\u00b7/g,'*')          /* × or · */
        .replace(/\u00b2/g,'^2').replace(/\u00b3/g,'^3')
        .replace(/\*\*/g,'^')                   /* 3x**2 */
        .replace(/^(y'|f'\(x\)|dy\/dx)=/,'')    /* "y' = ..." */
        .replace(/^=/,'').replace(/[.,;]+$/,'')
        .replace(/(\d)\*(?=[a-zA-Z(])/g,'$1');  /* 3*x -> 3x */
    };
    /* anyCase:true marks the answer as a WORD, not a symbol. Capitals stop
       mattering and a leading article is ignored, so "Nucleus" and
       "the nucleus" are simply right. Leave it off for chemical formulae,
       element symbols, units and anything else where MgO and mgo differ. */
    const prose=function(t){
      return String(t).replace(/^\s*(the|a|an)\s+/i,'');
    };
    const raw=norm(q.anyCase?prose(el.value||''):(el.value||''));
    if(!raw) return {state:'blank'};
    const ok=[q.ans].concat(q.accept||[]).map(function(t){
      return norm(q.anyCase?prose(t):t);
    });
    for(let i=0;i<ok.length;i++) if(raw===ok[i]) return {state:'right'};
    if(q.anyCase){
      for(let i=0;i<ok.length;i++) if(raw.toLowerCase()===ok[i].toLowerCase()) return {state:'right'};
      return {state:'wrong'};
    }
    for(let i=0;i<ok.length;i++) if(raw.toLowerCase()===ok[i].toLowerCase()){
      return {state:'nudge', msg:(q.caseMsg||'You have the right symbols in the right order &mdash; check your <b>capital letters</b> and try again.')};
    }
    return {state:'wrong'};
  }
  if(q.type==='coeff'){
    const n=q.ans.length, got=[];
    for(let i=0;i<n;i++){
      const v=readInt('inC'+i);
      if(v===null||v<1) return {state:'blank'};
      got.push(v);
    }
    let same=true; for(let i=0;i<n;i++) if(got[i]!==q.ans[i]) same=false;
    if(same) return {state:'right'};
    const k=got[0]/q.ans[0];
    let mult = Number.isInteger(k) && k>1;
    if(mult) for(let i=0;i<n;i++) if(got[i]!==q.ans[i]*k) mult=false;
    if(mult) return {state:'nudge', msg:'That equation <b>is</b> balanced &mdash; but every coefficient can still be divided by '+k+'. An answer must use the <b>smallest whole numbers</b> that work. Divide them all by '+k+' and check again.'};
    return {state:'wrong'};
  }
  const x=readNum('inX');
  if(x===null) return {state:'blank'};
  return {state:(Math.abs(x-q.ans)<1e-9?'right':'wrong')};
}

function check(){
  const q=S.cur;
  const r=mark(q);
  const fb=document.getElementById('fb');

  if(r.state==='blank'){
    fb.innerHTML='<div class="fb nudge"><div class="hd">Nothing entered yet</div><p>'+
      (q.type==='mc'?'Tap one of the options first, then press <b>Check my answer</b>.':'Type a number into every box, then press <b>Check my answer</b>.')+'</p></div>';
    return;
  }
  if(r.state==='nudge'){
    fb.innerHTML='<div class="fb nudge"><div class="hd">Almost there</div><p>'+r.msg+'</p></div>';
    return; /* free retry, no penalty */
  }

  /* lock the inputs */
  Array.prototype.forEach.call(document.querySelectorAll('.ansIn'),function(i){i.disabled=true;});
  document.getElementById('checkBtn').disabled=true;
  const hb=document.getElementById('hintBtn'); if(hb){hb.disabled=true; hb.style.opacity=.5;}
  if(q.type==='mc'){
    Array.prototype.forEach.call(document.querySelectorAll('button.opt'),function(b){
      const i=parseInt(b.dataset.i,10); b.disabled=true; b.classList.remove('sel');
      if(i===q.ans) b.classList.add('right');
      else if(i===S.sel) b.classList.add('wrong');
    });
  }

  S.totalQ++; S.stats[S.li].asked++;

  if(r.state==='right'){
    S.totalC++; S.stats[S.li].correct++;
    onRight(fb);
  } else {
    S.stats[S.li].wrong++;
    onWrong(fb,q);
  }
  paintStrip();
}

function onRight(fb){
  const q=S.cur;
  const backTo = (S.pending.length && S.pending[S.pending.length-1] > S.li) ? S.pending[S.pending.length-1] : null;
  const last = (S.li === LEVELS.length-1);
  let msg, btn;

  if(backTo!==null){
    msg='<p>You have got that concept back. Now let us return to <b>Level '+(backTo+1)+' &mdash; '+esc(LEVELS[backTo].short)+'</b> and look at it a different way.</p>';
    btn='Back up to Level '+(backTo+1);
  } else if(last){
    msg='<p>That is the top of the ladder: full IEB Grade 12 standard on evolution. Well done.</p>';
    btn='See my report';
  } else {
    msg='<p>Next up: <b>Level '+(S.li+2)+' &mdash; '+esc(LEVELS[S.li+1].short)+'</b>.</p>';
    btn='Climb to Level '+(S.li+2);
  }

  fb.innerHTML='<div class="fb ok"><div class="hd">Correct'+(S.name?', '+esc(S.name):'')+'</div>'+
    '<div class="worked" style="background:#fff;border-style:solid"><span class="lbl">How it works out</span>'+q.sol+'</div>'+
    msg+'</div>'+
    '<div class="btnrow"><button class="primary" id="nextBtn">'+btn+'</button></div>';

  document.getElementById('nextBtn').onclick=function(){
    if(backTo!==null){
      S.pending.pop();
      S.li=backTo;
      screenTeach(true);          /* re-teach the failed concept a different way */
    } else if(last){
      screenReport();
    } else {
      S.li++;
      screenTeach(false);         /* first teaching of the new concept */
    }
  };
  scrollTop();
}

function onWrong(fb,q){
  const canDrop = S.li>0;
  const target = canDrop ? S.li-1 : 0;
  let msg,btn;

  if(canDrop){
    msg='<p>No problem &mdash; this usually means the step underneath needs shoring up. We are going back to <b>Level '+(target+1)+' &mdash; '+esc(LEVELS[target].short)+'</b>, where it will be explained a different way with a different example. Then we come straight back to this one.</p>';
    btn='Go back to Level '+(target+1);
  } else {
    msg='<p>This is the very first level, so there is nothing below it. Let us look at the same idea from a completely different angle instead.</p>';
    btn='Explain it differently';
  }

  fb.innerHTML='<div class="fb no"><div class="hd">Not quite</div>'+
    '<div class="worked" style="background:#fff;border-style:solid"><span class="lbl">The correct working</span>'+q.sol+'</div>'+
    msg+'</div>'+
    '<div class="btnrow"><button class="primary" id="nextBtn">'+btn+'</button></div>';

  document.getElementById('nextBtn').onclick=function(){
    if(canDrop){
      S.pending.push(S.li);   /* remember to come back and re-teach this one */
      S.li=target;
    }
    screenTeach(true);
  };
  scrollTop();
}

/* ==========================================================
   REPORT
   ========================================================== */
function screenReport(){
  S.ended=true;
  const mins = Math.max(1, Math.round((Date.now()-S.t0)/60000));
  const reached = S.stats.filter(function(s){return s.reached;}).length;
  const topLevel = S.stats.reduce(function(a,s,i){return s.correct>0?i+1:a;},0);
  const acc = S.totalQ? Math.round(100*S.totalC/S.totalQ):0;

  function status(s){
    if(!s.reached) return '<span class="pill nr">Not reached</span>';
    if(s.wrong===0 && s.correct>0) return '<span class="pill first">Secure</span>';
    if(s.wrong===1) return '<span class="pill re">Needed a re-teach</span>';
    if(s.wrong>1) return '<span class="pill hard">Needs more work</span>';
    return '<span class="pill nr">Started</span>';
  }
  function note(s,L){
    if(!s.reached) return 'Not covered in this session.';
    if(s.wrong===0 && s.correct>0) return 'Answered correctly first time.';
    if(s.wrong===0) return 'Taught but not yet answered.';
    return s.wrong+' incorrect attempt'+(s.wrong===1?'':'s')+', '+s.correct+' correct after re-teaching.';
  }

  const focus = S.stats.map(function(s,i){return {s:s,L:LEVELS[i],i:i};})
                       .filter(function(o){return o.s.wrong>0;})
                       .sort(function(a,b){return b.s.wrong-a.s.wrong;});

  let rows = LEVELS.map(function(L,i){
    const s=S.stats[i];
    return '<tr><td><b>'+(i+1)+'</b></td><td>'+esc(L.name)+'</td><td>'+status(s)+'</td><td>'+note(s,L)+'</td></tr>';
  }).join('');

  let focusHtml;
  if(!focus.length){
    focusHtml = '<div class="callout"><span class="lbl">Focus next</span><p>Every question attempted was answered correctly first time. Move on to the Human evolution ladder.</p></div>';
  } else {
    focusHtml = '<div class="callout"><span class="lbl">Focus next</span><ul style="margin-bottom:0">'+
      focus.slice(0,5).map(function(o){
        return '<li><b>'+esc(o.L.name)+'</b> (Level '+(o.i+1)+') &mdash; '+o.s.wrong+' slip'+(o.s.wrong===1?'':'s')+' here.</li>';
      }).join('')+'</ul></div>';
  }

  stripEl.classList.add('hide');
  app.innerHTML = card(
    '<p class="eyebrow">Progress report</p>'+
    '<h1>Evolution Ladder</h1>'+
    '<p class="sub">'+(S.name?esc(S.name)+' &nbsp;&middot;&nbsp; ':'')+'Genius Premium Tuition · IEB Grade 12 Life Sciences · Evolution by natural selection &middot; '+new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'})+'</p>'+
    '<div class="kpis">'+
      '<div class="kpi"><div class="v">'+topLevel+' / '+LEVELS.length+'</div><div class="k">Highest level passed</div></div>'+
      '<div class="kpi"><div class="v">'+S.totalC+' / '+S.totalQ+'</div><div class="k">Questions correct</div></div>'+
      '<div class="kpi"><div class="v">'+acc+'%</div><div class="k">Accuracy</div></div>'+
      '<div class="kpi"><div class="v">'+mins+'</div><div class="k">Minutes</div></div>'+
    '</div>'+
    focusHtml+
    '<h3>Level by level</h3>'+
    '<table class="rep"><thead><tr><th style="width:38px">#</th><th>Concept</th><th style="width:150px">Status</th><th>Detail</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="btnrow"><button class="primary" id="printBtn">Print / save as PDF</button>'+
    '<button class="ghost" id="againBtn">Start again</button></div>'
  );
  document.getElementById('printBtn').onclick=function(){ window.print(); };
  document.getElementById('againBtn').onclick=function(){
    S.li=0; S.pending=[]; S.totalQ=0; S.totalC=0; S.ended=false;
    S.qIdx=LEVELS.map(function(){return 0;});
    S.stats=LEVELS.map(function(){return {asked:0,correct:0,wrong:0,reteaches:0,reached:false};});
    S.t0=Date.now();
    stripEl.classList.remove('hide');
    screenTeach(false);
  };
  scrollTop();
}


/* ---------- balance the multiple-choice keys ----------
   The correct option is distributed evenly across the available positions, so
   the answer can never be guessed from where it sits. Questions whose options
   are bare position labels (A, B, C ...) refer to something on screen and are
   left exactly as written. */
function balanceKeys(){
  var counter=0;
  LEVELS.forEach(function(L){
    L.qs.forEach(function(q){
      if(q.type!=='mc'||!q.opts) return;
      var label=true;
      q.opts.forEach(function(o){ if(!/^[A-E]$/.test(String(o).trim())) label=false; });
      if(label) return;
      var n=q.opts.length, target=counter++ % n;
      if(target===q.ans) return;
      var tmp=q.opts[target]; q.opts[target]=q.opts[q.ans]; q.opts[q.ans]=tmp;
      if(q.nudge){
        var nn={};
        Object.keys(q.nudge).forEach(function(k){
          var i=parseInt(k,10);
          nn[i===target?q.ans:(i===q.ans?target:i)]=q.nudge[k];
        });
        q.nudge=nn;
      }
      q.ans=target;
    });
  });
}
balanceKeys();

/* ---------- boot ---------- */
document.getElementById('stamp').textContent = new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'});
buildStrip();
screenStart();
