<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evolution by Natural Selection Ladder | Genius Premium Tuition</title>
<style>
  :root{
    --charcoal:#4D4D4F;
    --charcoal-deep:#3A3A3C;
    --gold:#F2A900;
    --gold-text:#B07D00;
    --gold-pale:#FBEBCB;
    --grey:#6E6F72;
    --grey-line:#DEDEE0;
    --green:#1F6B2E;
    --green-pale:#E7F3E9;
    --red:#B03030;
    --red-pale:#FBEAEA;
    --paper:#FFFFFF;
    --wash:#F6F6F4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--wash);
    color:var(--charcoal);
    line-height:1.5;
    font-size:17px;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}

  /* ---------- masthead ---------- */
  header.mast{
    background:var(--paper);
    border-bottom:3px solid var(--gold);
    padding:14px 16px 12px;
    position:sticky;top:0;z-index:50;
  }
  .mast-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .mast img{height:34px;width:auto;display:block}
  .mast .kick{
    font-size:10.5px;font-weight:bold;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold-text);margin-left:auto;text-align:right;line-height:1.3;
  }

  /* ---------- progress strip ---------- */
  .strip{background:var(--paper);border-bottom:1px solid var(--grey-line);padding:10px 16px}
  .strip-inner{max-width:820px;margin:0 auto}
  .steps{display:flex;gap:3px;margin-bottom:6px}
  .step{flex:1;height:8px;border-radius:4px;background:var(--grey-line);transition:background .3s}
  .step.done{background:var(--gold)}
  .step.now{background:var(--charcoal)}
  .step.stumble{background:var(--red)}
  .strip-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--grey)}
  .strip-labels b{color:var(--charcoal)}

  /* ---------- cards ---------- */
  .card{
    background:var(--paper);border:1px solid var(--grey-line);border-radius:10px;
    padding:20px;margin-top:18px;box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .eyebrow{
    font-size:10.5px;font-weight:bold;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold-text);margin:0 0 6px;
  }
  h1{font-size:26px;margin:0 0 6px;color:var(--charcoal);line-height:1.2}
  h2{font-size:21px;margin:0 0 4px;color:var(--charcoal);line-height:1.25}
  h3{font-size:16px;margin:20px 0 6px;color:var(--charcoal)}
  p{margin:0 0 12px}
  .sub{color:var(--grey);font-size:14.5px;margin:0 0 14px}
  ul,ol{margin:0 0 12px;padding-left:22px}
  li{margin-bottom:5px}

  .callout{
    background:var(--gold-pale);border-left:4px solid var(--gold);
    padding:12px 14px;border-radius:0 6px 6px 0;margin:14px 0;
  }
  .callout p:last-child{margin-bottom:0}
  .callout .lbl{font-weight:bold;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-text);display:block;margin-bottom:4px}

  .worked{
    background:var(--wash);border:1px dashed var(--grey-line);border-radius:8px;
    padding:12px 14px;margin:14px 0;
  }
  .worked .lbl{font-weight:bold;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);display:block;margin-bottom:6px}
  .worked .step-line{margin:4px 0;font-size:16px}
  .worked .ans{color:var(--green);font-weight:bold}

  /* ---------- fraction typography ---------- */
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
      margin:0 3px;line-height:1.05;position:relative;top:-1px}
  .fr .n{border-bottom:2px solid currentColor;padding:0 4px 1px}
  .fr .d{padding:1px 4px 0}
  .mx{display:inline-flex;align-items:center;gap:3px;vertical-align:middle}
  .eq{font-size:19px}

  /* ---------- visuals ---------- */
  .vis{text-align:center;margin:16px 0}
  .vis svg{max-width:100%;height:auto}
  .cap{font-size:12.5px;color:var(--grey);font-style:italic;margin-top:6px}

  /* ---------- question ---------- */
  .qtext{font-size:19px;margin:0 0 14px;font-weight:bold}
  .opts{display:grid;gap:9px;margin:14px 0}
  button.opt{
    font-family:inherit;font-size:17px;text-align:left;background:var(--paper);
    border:2px solid var(--grey-line);border-radius:8px;padding:13px 15px;cursor:pointer;
    color:var(--charcoal);transition:border-color .15s,background .15s;
  }
  button.opt:hover:not(:disabled){border-color:var(--gold)}
  button.opt.sel{border-color:var(--charcoal);background:var(--wash)}
  button.opt.right{border-color:var(--green);background:var(--green-pale)}
  button.opt.wrong{border-color:var(--red);background:var(--red-pale)}
  button.opt:disabled{cursor:default;opacity:.85}

  .passage{background:#FBFBF9;border:1px solid var(--grey-line);border-left:4px solid var(--charcoal);
    border-radius:0 8px 8px 0;padding:14px 16px;margin:14px 0;font-size:16px;line-height:1.62}
  .passage .ptitle{font-size:12px;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;
    color:var(--grey);margin-bottom:8px}
  .passage p{margin:0 0 10px}
  .passage p:last-child{margin-bottom:0}
  .passage .ln{display:inline-block;width:26px;color:#A9A9AB;font-size:12px;user-select:none}
  .passage em{background:#FBEBCB;font-style:normal;padding:0 2px;border-radius:2px}
  .sent{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1px solid var(--grey-line);
    border-radius:8px;padding:11px 13px;margin:8px 0;font-size:16px;line-height:1.5}
  .sent .tag{flex:none;width:26px;height:26px;border-radius:50%;background:var(--charcoal);color:#fff;
    font-weight:bold;font-size:13px;display:flex;align-items:center;justify-content:center}
  .orderrow{display:flex;gap:10px;align-items:flex-start;margin:9px 0}
  .orderrow input{flex:none;width:50px;font-size:19px;text-align:center;padding:8px 2px;font-family:inherit;
    border:2px solid var(--grey-line);border-radius:6px;color:var(--charcoal)}
  .orderrow input:focus{outline:none;border-color:var(--gold)}
  .orderrow .txt{flex:1;background:var(--paper);border:1px solid var(--grey-line);border-radius:8px;
    padding:10px 12px;font-size:15.5px;line-height:1.5}
  .lbl .mth,.lbl .chem{text-transform:none;font-style:normal}
  .mth{font-family:"Times New Roman",Georgia,serif;font-size:1.06em;font-style:italic;white-space:nowrap}
  .mth sup{font-size:.72em;font-style:normal;vertical-align:0.5em}
  .mth sub{font-size:.72em;font-style:normal;vertical-align:-0.25em}
  .mth .op,.mth .num{font-style:normal}
  .chem{font-family:Arial,Helvetica,sans-serif;white-space:nowrap}
  .chem sub{font-size:.72em;vertical-align:-0.25em}
  .chem sup{font-size:.72em;vertical-align:0.45em}
  .eqn{display:inline-block;font-size:19px;font-weight:bold;letter-spacing:.01em}
  .arrow{padding:0 8px;color:var(--gold-text);font-weight:bold}
  .coeffrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:19px;font-weight:bold;margin:16px 0}
  .coeffrow input{width:52px;font-size:19px;text-align:center;padding:7px 2px;
    border:2px solid var(--grey-line);border-radius:6px;font-family:inherit;color:var(--charcoal)}
  .coeffrow input:focus{outline:none;border-color:var(--gold)}
  .coeffrow .plus{padding:0 3px;color:var(--grey)}
  .keyrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--grey);margin-top:8px}
  .keyrow span{display:inline-flex;align-items:center;gap:5px}
  .keyrow i{width:13px;height:13px;border-radius:50%;border:1.4px solid var(--charcoal);display:inline-block}
  .colon{font-size:26px;font-weight:bold;color:var(--charcoal);padding:0 2px}
  .rt{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;font-weight:bold;white-space:nowrap}
  .rt .c{color:var(--gold-text)}
  .inputrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}
  .fracinput{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
  .fracinput .rule{width:70px;height:2px;background:var(--charcoal)}
  input[type=text]{
    font-family:inherit;font-size:22px;text-align:center;width:70px;padding:8px 4px;
    border:2px solid var(--grey-line);border-radius:6px;color:var(--charcoal);background:var(--paper);
  }
  input[type=text].wide{width:120px}
  input[type=text]:focus{outline:none;border-color:var(--gold)}
  .unit{font-size:16px;color:var(--grey)}

  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  button.primary{
    font-family:inherit;font-size:17px;font-weight:bold;background:var(--charcoal);color:#fff;
    border:none;border-radius:8px;padding:13px 26px;cursor:pointer;
  }
  button.primary:hover{background:var(--charcoal-deep)}
  button.primary:disabled{background:var(--grey-line);color:var(--grey);cursor:default}
  button.ghost{
    font-family:inherit;font-size:15px;background:transparent;color:var(--gold-text);
    border:2px solid var(--gold);border-radius:8px;padding:11px 20px;cursor:pointer;font-weight:bold;
  }
  button.ghost:hover{background:var(--gold-pale)}
  button.link{
    font-family:inherit;font-size:14px;background:none;border:none;color:var(--grey);
    text-decoration:underline;cursor:pointer;padding:6px 0;
  }

  .fb{border-radius:8px;padding:14px 16px;margin-top:16px}
  .fb.ok{background:var(--green-pale);border-left:4px solid var(--green)}
  .fb.no{background:var(--red-pale);border-left:4px solid var(--red)}
  .fb.nudge{background:var(--gold-pale);border-left:4px solid var(--gold)}
  .fb .hd{font-weight:bold;margin-bottom:6px;font-size:17px}
  .fb.ok .hd{color:var(--green)}
  .fb.no .hd{color:var(--red)}
  .fb.nudge .hd{color:var(--gold-text)}
  .fb p:last-child{margin-bottom:0}

  .band{
    background:var(--charcoal);color:#fff;border-radius:8px;padding:12px 16px;margin:0 0 16px;
    font-size:14px;
  }
  .band b{color:var(--gold)}

  /* ---------- report ---------- */
  table.rep{width:100%;border-collapse:collapse;font-size:14.5px;margin:14px 0}
  table.rep th{
    text-align:left;background:var(--charcoal);color:#fff;padding:9px 10px;font-size:12px;
    letter-spacing:.06em;text-transform:uppercase;
  }
  table.rep td{padding:9px 10px;border-bottom:1px solid var(--grey-line);vertical-align:top}
  table.rep tr:nth-child(even) td{background:var(--wash)}
  .pill{display:inline-block;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:11px;white-space:nowrap}
  .pill.first{background:var(--green-pale);color:var(--green)}
  .pill.re{background:var(--gold-pale);color:var(--gold-text)}
  .pill.hard{background:var(--red-pale);color:var(--red)}
  .pill.nr{background:var(--wash);color:var(--grey)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
  .kpi{background:var(--wash);border:1px solid var(--grey-line);border-radius:8px;padding:12px;text-align:center}
  .kpi .v{font-size:26px;font-weight:bold;color:var(--charcoal);line-height:1.1}
  .kpi .k{font-size:11.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

  footer.foot{
    max-width:820px;margin:28px auto 0;padding:14px 16px 24px;color:var(--grey);font-size:12.5px;
    border-top:1px solid var(--grey-line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  }
  .hide{display:none!important}

  @media (max-width:520px){
    body{font-size:16px}
    h1{font-size:22px}
    .qtext{font-size:17.5px}
    .card{padding:16px}
    .mast .kick{font-size:9.5px}
  }
  @media print{
    header.mast{position:static}
    .strip,.btnrow,button{display:none!important}
    body{background:#fff}
    .card{break-inside:avoid;box-shadow:none}
  }
</style>
</head>

<script>
/* ==========================================================
   ADAPTIVE LADDER — shared visual and typography library
   Genius Premium Tuition

   Everything here returns an HTML string. Wrap any diagram in vis(html, caption)
   so it gets the standard centred figure treatment.

   Sections:
     1. Numbers and palette
     2. Typography      f  mix  r  m  ch  eq
     3. Layout          vis  legend  passage  sentCards  dataTable
     4. Fraction models bar  barLbl  pie  pieRow  numline  areaModel  groupModel
     5. Ratio models    tape  wholeBar  counters
     6. Science models  particles  particleRow  atom  atomRow  ptMini  phBar
                        balance  molecule  molRow
     7. Charts          barChart  lineChart  pieChart  boxPlot
     8. Maths graphics  plot  geo

   See references/visual-library.md for signatures and worked examples.
   ========================================================== */

/* ---------- 1. numbers and palette ---------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function gcdAll(arr){return arr.reduce(function(g,x){return gcd(g,x);},0)||1;}
function simp(n,d){var g=gcd(n,d);return {n:n/g,d:d/g};}
function isSimp(n,d){return gcd(n,d)===1;}

/* Brand palette. */
const GOLD='#F2A900', PALE='#FBEBCB', CHAR='#4D4D4F', GREY_L='#6E6F72',
      LINE='#C9C9CB', WHITE='#FFFFFF', GREEN='#1F6B2E', RED='#B03030', GOLD_T='#B07D00';

/* Categorical set for CHARTS. Validated against the six dataviz checks on a light
   surface: lightness band, chroma floor, CVD separation, normal-vision floor and
   contrast. Do not substitute the raw brand colours here — charcoal reads as grey
   and fails the chroma floor, and full-strength gold fails contrast. */
const CAT=['#A87A00','#1F6FB2','#B03030','#5B4A9E'];
const CATNAME=['gold','blue','red','purple'];

/* Fill set for BLOCK MODELS (tape, wholeBar, counters), where blocks are large,
   separated by strokes and directly labelled, so the brand colours are safe. */
const COLS=[GOLD, CHAR, GREEN, GOLD_T];
const TXT =['#4D4D4F', '#FFFFFF', '#FFFFFF', '#FFFFFF'];


/* ---------- 2. typography ---------- */
function f(n,d){return '<span class="fr"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>';}
function mix(w,n,d){return '<span class="mx">'+w+f(n,d)+'</span>';}
function r(){
  const p=Array.prototype.slice.call(arguments);
  return '<span class="rt">'+p.map(function(x,i){
    return (i?'<span class="c">:</span>':'')+'<span>'+x+'</span>';
  }).join('')+'</span>';
}
function m(s){
  /* maths notation: ^ superscript, _ subscript, * renders as a multiplication sign.
     Braces group multi-character scripts:  m('x^{n-1}') */
  return '<span class="mth">'+String(s)
    .replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>')
    .replace(/\^(-?[0-9a-zA-Z]+)/g,'<sup>$1</sup>')
    .replace(/_\{([^}]*)\}/g,'<sub>$1</sub>')
    .replace(/_([0-9a-zA-Z]+)/g,'<sub>$1</sub>')
    .replace(/\*/g,'&nbsp;&times;&nbsp;')
    +'</span>';
}
function ch(s){
  /* chemical formulae:  ch('H2O'), ch('Ca(OH)2'), ch('SO4^2-'), ch('Na^+').
     A coefficient written in front (2H2O) is left alone. */
  return '<span class="chem">'+String(s)
    .replace(/\^([0-9]*[+−-])/g,'<sup>$1</sup>')
    .replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')
    +'</span>';
}
function eq(){
  /* eq('2H2','+','O2','->','2H2O') */
  var p=Array.prototype.slice.call(arguments);
  return '<span class="eqn">'+p.map(function(x){
    if(x==='->') return '<span class="arrow">&rarr;</span>';
    if(x==='+')  return ' + ';
    return ch(x);
  }).join('')+'</span>';
}

/* ---------- 3. layout ---------- */
function vis(html,cap){return '<div class="vis">'+html+(cap?'<div class="cap">'+cap+'</div>':'')+'</div>';}
function legend(items){
  return '<div class="keyrow">'+items.map(function(it){
    return '<span><i style="background:'+it.c+';border-color:'+it.c+'"></i>'+it.t+'</span>';
  }).join('')+'</div>';
}
function passage(title,paras,opt){
  opt=opt||{};
  var body=paras.map(function(p,i){
    return '<p>'+(opt.numbered?'<span class="ln">'+(i+1)+'</span>':'')+p+'</p>';
  }).join('');
  return '<div class="passage">'+(title?'<div class="ptitle">'+title+'</div>':'')+body+'</div>';
}
function sentCards(items){
  return items.map(function(it,i){
    return '<div class="sent"><span class="tag">'+(it.tag||String.fromCharCode(65+i))+'</span><span>'+it.t+'</span></div>';
  }).join('');
}
function dataTable(headers,rows,opt){
  opt=opt||{};
  return '<table class="rep" style="max-width:'+(opt.w||540)+'px;margin:14px auto">'
    +'<thead><tr>'+headers.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead>'
    +'<tbody>'+rows.map(function(r){
        return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';
      }).join('')+'</tbody></table>';
}

/* ---------- 4. fraction models ---------- */
function bar(den,num,opt){
  opt=opt||{};
  const W=opt.w||360, H=opt.h||46, fill=opt.fill||GOLD, cw=W/den;
  let s='<svg viewBox="0 0 '+(W+2)+' '+(H+2)+'" width="'+(W+2)+'" role="img" aria-label="'+num+' of '+den+' parts shaded">';
  for(let i=0;i<den;i++){
    s+='<rect x="'+(1+i*cw)+'" y="1" width="'+cw+'" height="'+H+'" fill="'+(i<num?fill:'#FFFFFF')+'" stroke="'+CHAR+'" stroke-width="1.5"/>';
  }
  s+='</svg>';
  return s;
}
function barLbl(den,num,label,opt){
  opt=opt||{};
  return '<div style="display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0;flex-wrap:wrap">'
       + (label?'<div style="min-width:74px;text-align:right;font-size:17px">'+label+'</div>':'')
       + '<div>'+bar(den,num,opt)+'</div></div>';
}
function pie(den,num,opt){
  opt=opt||{};
  const r=opt.r||58, cx=r+3, cy=r+3, S=(r+3)*2;
  let s='<svg viewBox="0 0 '+S+' '+S+'" width="'+S+'" role="img" aria-label="'+num+' of '+den+' slices shaded">';
  if(den===1){
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(num>=1?GOLD:'#fff')+'" stroke="'+CHAR+'" stroke-width="1.8"/>';
  } else {
    for(let i=0;i<den;i++){
      const a0=(-90+i*360/den)*Math.PI/180, a1=(-90+(i+1)*360/den)*Math.PI/180;
      const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
      const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      const big=(360/den)>180?1:0;
      s+='<path d="M '+cx+' '+cy+' L '+x0.toFixed(2)+' '+y0.toFixed(2)+' A '+r+' '+r+' 0 '+big+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+' Z" fill="'+(i<num?GOLD:'#FFFFFF')+'" stroke="'+CHAR+'" stroke-width="1.6"/>';
    }
  }
  s+='</svg>';
  return s;
}
function pieRow(items){
  let s='<div style="display:flex;gap:14px;justify-content:center;align-items:flex-end;flex-wrap:wrap">';
  items.forEach(function(it){
    s+='<div style="text-align:center">'+pie(it.d,it.n,{r:it.r||46})
      +(it.label?'<div style="font-size:14px;color:#6E6F72;margin-top:4px">'+it.label+'</div>':'')+'</div>';
  });
  return s+'</div>';
}
function numline(den,mark,opt){
  opt=opt||{};
  const W=opt.w||360, H=64, x0=18, x1=W-18, span=x1-x0;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="number line in '+den+' parts">';
  s+='<line x1="'+x0+'" y1="30" x2="'+x1+'" y2="30" stroke="'+CHAR+'" stroke-width="2"/>';
  for(let i=0;i<=den;i++){
    const x=x0+span*i/den, tall=(i===0||i===den);
    s+='<line x1="'+x.toFixed(1)+'" y1="'+(tall?18:23)+'" x2="'+x.toFixed(1)+'" y2="'+(tall?42:37)+'" stroke="'+CHAR+'" stroke-width="'+(tall?2:1.2)+'"/>';
    if(tall) s+='<text x="'+x.toFixed(1)+'" y="58" text-anchor="middle" font-family="Arial" font-size="13" fill="'+CHAR+'">'+(i===0?'0':'1')+'</text>';
  }
  (Array.isArray(mark)?mark:[mark]).forEach(function(m){
    if(m==null) return;
    const x=x0+span*m.v;
    s+='<circle cx="'+x.toFixed(1)+'" cy="30" r="6" fill="'+(m.c||GOLD)+'" stroke="'+CHAR+'" stroke-width="1.5"/>';

function areaModel(an,ad,bn,bd,opt){

function particles(kind,opt){

    for(var r=0;r<4;r++)for(var c=0;c<4;c++) pts.push([32+c*36, 30+r*32]);
  } else if(kind==='liquid'){
    var L=[[30,86],[62,78],[94,88],[126,80],[44,112],[78,108],[112,116],[140,104],

    pts=L;

/* ---------- 7. charts ---------- */
function nf(v){
  var s=String(v), neg=s[0]==='-'; if(neg) s=s.slice(1);
  var p=s.split('.'), i=p[0];
  if(i.length>3) i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'\u2009');
  return (neg?'-':'')+i+(p[1]?','+p[1]:'');
}
function niceStep(max){
  var raw=max/4, p=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)), r=raw/p;
  return (r<=1?1:r<=2?2:r<=5?5:10)*p;
}
function barChart(cfg){
  var cats=cfg.cats, series=cfg.series, n=series.length;
  var W=cfg.w||400, PL=46, PR=12, PT=cfg.title?28:12, PB=42;
  var plotW=W-PL-PR, H=(cfg.h||210), plotH=H-PT-PB;
  var max=cfg.max||Math.max.apply(null,series.reduce(function(a,s){return a.concat(s.vals);},[]));
  var step=cfg.step||niceStep(max);
  var top=Math.ceil(max/step)*step;
  var gw=plotW/cats.length, bw=Math.min((gw-12)/n, 40);
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="'+(cfg.alt||cfg.title||'bar chart')+'">';
  if(cfg.title) s+='<text x="'+(W/2)+'" y="16" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="'+CHAR+'">'+cfg.title+'</text>';
  for(var v=0;v<=top;v+=step){
    var y=PT+plotH-(v/top)*plotH;
    s+='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(PL+plotW)+'" y2="'+y.toFixed(1)+'" stroke="#E8E8E6" stroke-width="1"/>';
    s+='<text x="'+(PL-7)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-family="Arial" font-size="11" fill="'+GREY_L+'">'+nf(v)+'</text>';
  }
  s+='<line x1="'+PL+'" y1="'+(PT+plotH)+'" x2="'+(PL+plotW)+'" y2="'+(PT+plotH)+'" stroke="'+CHAR+'" stroke-width="1.6"/>';
  cats.forEach(function(c,ci){
    var gx=PL+ci*gw, tot=n*bw+(n-1)*2, x0=gx+(gw-tot)/2;
    series.forEach(function(se,si){
      var v=se.vals[ci], bh=(v/top)*plotH, x=x0+si*(bw+2), y=PT+plotH-bh;
      s+='<path d="M '+x+' '+(PT+plotH)+' V '+(y+4)+' q 0 -4 4 -4 h '+(bw-8)+' q 4 0 4 4 V '+(PT+plotH)+' z" fill="'+CAT[si%4]+'"/>';
      s+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="bold" fill="'+CHAR+'">'+nf(v)+'</text>';
    });
    s+='<text x="'+(gx+gw/2)+'" y="'+(PT+plotH+16)+'" text-anchor="middle" font-family="Arial" font-size="11" fill="'+CHAR+'">'+c+'</text>';
  });
  if(cfg.yLabel) s+='<text x="10" y="'+(PT+plotH/2)+'" text-anchor="middle" font-family="Arial" font-size="11" fill="'+GREY_L+'" transform="rotate(-90 10 '+(PT+plotH/2)+')">'+cfg.yLabel+'</text>';
  s+='</svg>';
  if(n>1) s+=legend(series.map(function(se,i){return {c:CAT[i%4],t:se.name};}));
  return s;
}
function lineChart(cfg){

  });
  series.forEach(function(se,si){
    var pts=se.vals.map(function(v,i){return (PL+i*dx).toFixed(1)+','+(PT+plotH-((v-min)/(top-min))*plotH).toFixed(1);});
    s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+CAT[si%4]+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    se.vals.forEach(function(v,i){
      var cx=PL+i*dx, cy=PT+plotH-((v-min)/(top-min))*plotH;
      s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4.4" fill="'+CAT[si%4]+'" stroke="'+WHITE+'" stroke-width="2"/>';
      if(cfg.labels!==false){
        var ly=cy-11, anc='middle';
        if(i===0) anc='start'; if(i===se.vals.length-1) anc='end';
        s+='<text x="'+cx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anc+'" font-family="Arial" font-size="10.5" font-weight="bold" fill="'+CHAR+'" stroke="'+WHITE+'" stroke-width="3" paint-order="stroke">'+nf(v)+'</text>';
      }
    });
  });
  s+='</svg>';
  if(series.length>1) s+=legend(series.map(function(se,i){return {c:CAT[i%4],t:se.name};}));
  return s;
}
function pieChart(slices,opt){
  opt=opt||{};
  var r=opt.r||78, cx=r+4, TOFF=opt.title?22:0, cy=r+4+TOFF, S=(r+4)*2, H=S+TOFF;
  var tot=slices.reduce(function(t,s){return t+s.val;},0), a0=-90;
  var s='<svg viewBox="0 0 '+S+' '+H+'" width="'+S+'" role="img" aria-label="'+(opt.alt||opt.title||'pie chart')+'">';
  if(opt.title) s+='<text x="'+(S/2)+'" y="14" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="'+CHAR+'">'+opt.title+'</text>';
  slices.forEach(function(sl,i){
    var sweep=sl.val/tot*360, a1=a0+sweep;
    var p0=[cx+r*Math.cos(a0*Math.PI/180), cy+r*Math.sin(a0*Math.PI/180)];
    var p1=[cx+r*Math.cos(a1*Math.PI/180), cy+r*Math.sin(a1*Math.PI/180)];
    s+='<path d="M '+cx+' '+cy+' L '+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+
       ' A '+r+' '+r+' 0 '+(sweep>180?1:0)+' 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+' z" fill="'+CAT[i%4]+
       '" stroke="'+WHITE+'" stroke-width="2"/>';
    var am=(a0+sweep/2)*Math.PI/180, lr=r*0.62;
    var lab=(sl.show||Math.round(sl.val/tot*100)+'%');
    if(sweep>34){
      s+='<text x="'+(cx+lr*Math.cos(am)).toFixed(1)+'" y="'+(cy+lr*Math.sin(am)+4).toFixed(1)+
         '" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="'+WHITE+'">'+lab+'</text>';
    } else {
      var orx=r+13;
      s+='<text x="'+(cx+orx*Math.cos(am)).toFixed(1)+'" y="'+(cy+orx*Math.sin(am)+4).toFixed(1)+
         '" text-anchor="'+(Math.cos(am)<0?'end':'start')+'" font-family="Arial" font-size="11.5" font-weight="bold" fill="'+CHAR+'">'+lab+'</text>';
    }
    a0=a1;
  });
  s+='</svg>';
  return s+legend(slices.map(function(sl,i){return {c:CAT[i%4],t:sl.label};}));
}
function boxPlot(d,opt){
  opt=opt||{};
  var W=opt.w||400, H=112, PL=24, PR=24, plotW=W-PL-PR;
  var lo=opt.lo!==undefined?opt.lo:d.min, hi=opt.hi!==undefined?opt.hi:d.max;
  var pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  function X(v){return PL+(v-lo)/(hi-lo)*plotW;}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="box and whisker plot">';
  var yc=46, bh=32;
  s+='<line x1="'+X(d.min)+'" y1="'+yc+'" x2="'+X(d.q1)+'" y2="'+yc+'" stroke="'+CHAR+'" stroke-width="1.8"/>';
  s+='<line x1="'+X(d.q3)+'" y1="'+yc+'" x2="'+X(d.max)+'" y2="'+yc+'" stroke="'+CHAR+'" stroke-width="1.8"/>';
  [d.min,d.max].forEach(function(v){
    s+='<line x1="'+X(v)+'" y1="'+(yc-11)+'" x2="'+X(v)+'" y2="'+(yc+11)+'" stroke="'+CHAR+'" stroke-width="2"/>';
  });
  s+='<rect x="'+X(d.q1)+'" y="'+(yc-bh/2)+'" width="'+(X(d.q3)-X(d.q1))+'" height="'+bh+'" fill="'+CAT[0]+'" fill-opacity="0.28" stroke="'+CAT[0]+'" stroke-width="2" rx="3"/>';
  s+='<line x1="'+X(d.med)+'" y1="'+(yc-bh/2)+'" x2="'+X(d.med)+'" y2="'+(yc+bh/2)+'" stroke="'+CHAR+'" stroke-width="2.6"/>';
  [['min',d.min],['q1',d.q1],['med',d.med],['q3',d.q3],['max',d.max]].forEach(function(p,i){
    var y=(i%2?88:15);
    s+='<text x="'+X(p[1])+'" y="'+y+'" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="'+CHAR+'">'+p[1]+'</text>';
    s+='<text x="'+X(p[1])+'" y="'+(y+12)+'" text-anchor="middle" font-family="Arial" font-size="9.5" fill="'+GREY_L+'">'+
       ({min:'min',q1:'Q1',med:'median',q3:'Q3',max:'max'})[p[0]]+'</text>';
  });
  return s+'</svg>';
}

/* ---------- 8. maths graphics ---------- */
function plot(cfg){
  var xr=cfg.xr||[-5,5], yr=cfg.yr||[-5,5];
  var W=cfg.w||320, H=cfg.h||320, PAD=16;
  var pw=W-2*PAD, ph=H-2*PAD;
  function X(x){return PAD+(x-xr[0])/(xr[1]-xr[0])*pw;}
  function Y(y){return PAD+(yr[1]-y)/(yr[1]-yr[0])*ph;}
  function axStep(range){
    if(range<=12) return 1;
    var raw=range/8, p=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)), r=raw/p;
    return (r<=1?1:r<=2?2:r<=5?5:10)*p;
  }
  var xs=cfg.xstep||axStep(xr[1]-xr[0]), ys=cfg.ystep||axStep(yr[1]-yr[0]);
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="'+(cfg.alt||'graph')+'">';
  var i;
  for(i=Math.ceil(xr[0]/xs)*xs;i<=xr[1];i+=xs){
    s+='<line x1="'+X(i).toFixed(1)+'" y1="'+PAD+'" x2="'+X(i).toFixed(1)+'" y2="'+(H-PAD)+'" stroke="#EDEDEB" stroke-width="1"/>';
  }
  for(i=Math.ceil(yr[0]/ys)*ys;i<=yr[1];i+=ys){
    s+='<line x1="'+PAD+'" y1="'+Y(i).toFixed(1)+'" x2="'+(W-PAD)+'" y2="'+Y(i).toFixed(1)+'" stroke="#EDEDEB" stroke-width="1"/>';
  }
  s+='<line x1="'+PAD+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-PAD)+'" y2="'+Y(0).toFixed(1)+'" stroke="'+CHAR+'" stroke-width="1.6"/>';
  s+='<line x1="'+X(0).toFixed(1)+'" y1="'+PAD+'" x2="'+X(0).toFixed(1)+'" y2="'+(H-PAD)+'" stroke="'+CHAR+'" stroke-width="1.6"/>';
  for(i=Math.ceil(xr[0]/xs)*xs;i<=xr[1];i+=xs){ if(i===0) continue;
    s+='<text x="'+X(i).toFixed(1)+'" y="'+(Y(0)+13).toFixed(1)+'" text-anchor="middle" font-family="Arial" font-size="9.5" fill="'+GREY_L+'">'+i+'</text>';}
  for(i=Math.ceil(yr[0]/ys)*ys;i<=yr[1];i+=ys){ if(i===0) continue;
    s+='<text x="'+(X(0)-5).toFixed(1)+'" y="'+(Y(i)+3.5).toFixed(1)+'" text-anchor="end" font-family="Arial" font-size="9.5" fill="'+GREY_L+'">'+i+'</text>';}
  s+='<text x="'+(W-PAD+1)+'" y="'+(Y(0)-5).toFixed(1)+'" text-anchor="end" font-family="Arial" font-size="12" font-style="italic" fill="'+CHAR+'">x</text>';
  s+='<text x="'+(X(0)+6).toFixed(1)+'" y="'+(PAD+10)+'" font-family="Arial" font-size="12" font-style="italic" fill="'+CHAR+'">y</text>';
  (cfg.fns||[]).forEach(function(fn,fi){
    var pts=[], N=260, prev=null;
    for(var k=0;k<=N;k++){
      var x=xr[0]+(xr[1]-xr[0])*k/N, y;
      try{ y=fn.f(x); }catch(e){ y=NaN; }
      if(!isFinite(y)||y<yr[0]-2||y>yr[1]+2){ if(prev){pts.push('M');prev=null;} continue; }
      pts.push((prev?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)); prev=1;
    }
    var d=pts.filter(function(p){return p!=='M';}).join(' ');
    s+='<path d="'+d+'" fill="none" stroke="'+(fn.c||CAT[fi%4])+'" stroke-width="2.4" stroke-linecap="round"/>';
  });
  (cfg.pts||[]).forEach(function(p){
    s+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="4.6" fill="'+(p.c||CHAR)+'" stroke="'+WHITE+'" stroke-width="1.8"/>';
    if(p.t) s+='<text x="'+(X(p.x)+7).toFixed(1)+'" y="'+(Y(p.y)-7).toFixed(1)+'" font-family="Arial" font-size="11" font-weight="bold" fill="'+CHAR+'">'+p.t+'</text>';
  });
  (cfg.labels||[]).forEach(function(L){
    s+='<text x="'+X(L.x).toFixed(1)+'" y="'+Y(L.y).toFixed(1)+'" font-family="Arial" font-size="12" font-weight="bold" fill="'+(L.c||CHAR)+'">'+L.t+'</text>';
  });
  return s+'</svg>';
}
function geo(cfg){
  var W=cfg.w||320, H=cfg.h||250;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="'+(cfg.alt||'geometry diagram')+'">';
  (cfg.shapes||[]).forEach(function(o){
    if(o.k==='circle') s+='<circle cx="'+o.x+'" cy="'+o.y+'" r="'+o.r+'" fill="'+(o.fill||'none')+'" stroke="'+(o.s||CHAR)+'" stroke-width="'+(o.w||1.8)+'"'+(o.dash?' stroke-dasharray="5 4"':'')+'/>';
    if(o.k==='line')   s+='<line x1="'+o.x1+'" y1="'+o.y1+'" x2="'+o.x2+'" y2="'+o.y2+'" stroke="'+(o.s||CHAR)+'" stroke-width="'+(o.w||1.8)+'"'+(o.dash?' stroke-dasharray="5 4"':'')+' stroke-linecap="round"/>';
    if(o.k==='poly')   s+='<polygon points="'+o.pts+'" fill="'+(o.fill||'none')+'" stroke="'+(o.s||CHAR)+'" stroke-width="'+(o.w||1.8)+'" stroke-linejoin="round"/>';
    if(o.k==='arc')    s+='<path d="'+o.d+'" fill="none" stroke="'+(o.s||CHAR)+'" stroke-width="'+(o.w||1.5)+'"/>';
    if(o.k==='dot')    s+='<circle cx="'+o.x+'" cy="'+o.y+'" r="'+(o.r||4)+'" fill="'+(o.s||CHAR)+'"/>';
    if(o.k==='right')  s+='<path d="M '+o.x+' '+o.y+' '+o.d+'" fill="none" stroke="'+(o.s||CHAR)+'" stroke-width="1.5"/>';
    if(o.k==='text')   s+='<text x="'+o.x+'" y="'+o.y+'" text-anchor="'+(o.a||'middle')+'" font-family="Arial" font-size="'+(o.fs||12.5)+'" font-weight="'+(o.fw||'bold')+'" fill="'+(o.s||CHAR)+'">'+o.t+'</text>';
  });
  return s+'</svg>';
}


/* ==========================================================
   LIFE SCIENCES: cells, chromosomes and cell division
   ========================================================== */

var C_A = '#B07D00';       /* chromosome 1 - dark gold  */
var C_B = '#4D4D4F';       /* chromosome 2 - charcoal   */
var CYTO = '#FFFDF6';      /* cytoplasm fill            */
var NUCF = '#FBEBCB';      /* nucleoplasm fill          */
var WALLC = '#8A6D1F';     /* plant cell wall           */

/* ---- one duplicated chromosome: two sister chromatids, X shape ---- */
function _dup(cx,cy,h,col){
  var hh=h/2, dx=h*0.28, sw=Math.max(4.5,h*0.15);
  function arm(sgn){
    return '<path d="M '+(cx+sgn*dx)+' '+(cy-hh)+
      ' C '+(cx+sgn*dx*0.12)+' '+(cy-hh*0.45)+', '+(cx+sgn*dx*0.12)+' '+(cy+hh*0.45)+
      ', '+(cx+sgn*dx)+' '+(cy+hh)+'" fill="none" stroke="'+col+
      '" stroke-width="'+sw.toFixed(1)+'" stroke-linecap="round"/>';
  }
  return arm(-1)+arm(1)+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+(sw*0.46).toFixed(1)+
    '" fill="#FFFFFF" stroke="'+col+'" stroke-width="1.4"/>';
}

/* ---- one single chromatid being pulled to a pole: a V, apex leading ---- */
function _chromatid(cx,cy,h,col,dir){
  var hh=h/2, a=h*0.26, sw=Math.max(4.5,h*0.15);
  var px=cx+dir*a, qx=cx-dir*a;  /* apex (centromere) leads toward the pole; arms trail toward the equator */
  return '<path d="M '+qx+' '+(cy-hh)+' L '+px+' '+cy+' L '+qx+' '+(cy+hh)+
    '" fill="none" stroke="'+col+'" stroke-width="'+sw.toFixed(1)+
    '" stroke-linejoin="round" stroke-linecap="round"/>';
}

/* ---- one un-copied chromosome: a single rod with a waist ---- */
function _rod(cx,cy,h,col){
  var hh=h/2, sw=Math.max(4.5,h*0.15);
  return '<path d="M '+cx+' '+(cy-hh)+' C '+(cx-h*0.11)+' '+(cy-hh*0.4)+', '+
    (cx+h*0.11)+' '+(cy+hh*0.4)+', '+cx+' '+(cy+hh)+
    '" fill="none" stroke="'+col+'" stroke-width="'+sw.toFixed(1)+
    '" stroke-linecap="round"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+(sw*0.42).toFixed(1)+
    '" fill="#FFFFFF" stroke="'+col+'" stroke-width="1.3"/>';
}

/* ---- loose chromatin threads inside a nucleus ---- */
function _chromatin(cx,cy,r,seedcols){
  var out='', i;
  var paths=[
    'M -30 -14 C -14 -30, 10 -2, 26 -18',
    'M -26 8 C -8 -8, 8 22, 28 6',
    'M -16 24 C 2 10, 12 30, 26 20'
  ];
  for(i=0;i<paths.length;i++){
    out+='<path transform="translate('+cx+','+cy+') scale('+(r/44).toFixed(3)+')" d="'+
      paths[i]+'" fill="none" stroke="'+seedcols[i%seedcols.length]+
      '" stroke-width="'+(3.4*44/r*(r/44)).toFixed(1)+'" stroke-linecap="round" opacity="0.9"/>';
  }
  return out;
}

function _spindle(x1,y1,x2,y2){
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+
    '" stroke="#A9A9AB" stroke-width="1.2"/>';
}
function _pole(x,y){
  return '<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="#6E6F72"/>'+
    '<line x1="'+(x-6)+'" y1="'+(y-7)+'" x2="'+(x+6)+'" y2="'+(y+7)+'" stroke="#6E6F72" stroke-width="2.4" stroke-linecap="round"/>'+
    '<line x1="'+(x-6)+'" y1="'+(y+7)+'" x2="'+(x+6)+'" y2="'+(y-7)+'" stroke="#6E6F72" stroke-width="2.4" stroke-linecap="round"/>';
}
function _txt(x,y,t,opt){
  opt=opt||{};
  return '<text x="'+x+'" y="'+y+'" text-anchor="'+(opt.a||'middle')+
    '" font-family="Arial" font-size="'+(opt.fs||12)+'" font-weight="'+(opt.fw||'bold')+
    '" fill="'+(opt.c||'#4D4D4F')+'">'+t+'</text>';
}
/* label with a thin leader line */
function _lead(x1,y1,x2,y2,tx,ty,t,anchor){
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+
    '" stroke="#6E6F72" stroke-width="1"/>'+
    '<circle cx="'+x1+'" cy="'+y1+'" r="2.2" fill="#6E6F72"/>'+
    _txt(tx,ty,t,{a:anchor||'middle',fs:11.5,fw:'bold',c:'#6E6F72'});
}

/* ==========================================================
   cellPhase(phase, opt)
   phase: interphase | prophase | metaphase | anaphase |
          telophase | cytokinesis | daughters
   opt:   {w, plant:true, tag:'A', label:'text', deep:true}
   ========================================================== */
function cellPhase(phase,opt){
  opt=opt||{};
  var W=270, H=opt.label?214:192, CX=132, CY=96, RX=116, RY=80;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+(opt.w||250)+
        '" role="img" aria-label="cell in '+phase+'">';

  var furrow = (phase==='cytokinesis');
  var deep = furrow;

  /* ---- outline ---- */
  if(opt.plant){
    var pad = 6;
    s+='<rect x="'+(CX-RX)+'" y="'+(CY-RY)+'" width="'+(2*RX)+'" height="'+(2*RY)+
       '" rx="10" fill="#FDF6E4" stroke="'+WALLC+'" stroke-width="5"/>';
    s+='<rect x="'+(CX-RX+pad)+'" y="'+(CY-RY+pad)+'" width="'+(2*RX-2*pad)+
       '" height="'+(2*RY-2*pad)+'" rx="7" fill="'+CYTO+'" stroke="#4D4D4F" stroke-width="1.6"/>';
  } else if(furrow){
    var nY = deep?58:40;   /* how far the notch dips in */
    s+='<path d="M 16 96'+
       ' C 16 38, 66 18, 104 18'+
       ' Q 132 '+(18+nY)+' 160 18'+
       ' C 198 18, 248 38, 248 96'+
       ' C 248 154, 198 174, 160 174'+
       ' Q 132 '+(174-nY)+' 104 174'+
       ' C 66 174, 16 154, 16 96 Z"'+
       ' fill="'+CYTO+'" stroke="#4D4D4F" stroke-width="2"/>';
  } else {
    var rx = (phase==='anaphase'||phase==='telophase')?124:RX;
    s+='<ellipse cx="'+CX+'" cy="'+CY+'" rx="'+rx+'" ry="'+RY+
       '" fill="'+CYTO+'" stroke="#4D4D4F" stroke-width="2"/>';
  }

  /* ---- contents ---- */
  if(phase==='interphase'){
    s+='<circle cx="'+CX+'" cy="'+CY+'" r="50" fill="'+NUCF+'" stroke="#4D4D4F" stroke-width="2"/>';
    s+=_chromatin(CX,CY,50,[C_A,C_B,C_A]);
    s+='<circle cx="'+(CX+22)+'" cy="'+(CY+26)+'" r="8.5" fill="#8A6D1F"/>';
  }
  else if(phase==='prophase'){
    s+='<circle cx="'+CX+'" cy="'+CY+'" r="56" fill="'+NUCF+'" stroke="#4D4D4F" stroke-width="2" stroke-dasharray="7 6"/>';
    s+=_dup(CX-26,CY-12,54,C_A);
    s+=_dup(CX+24,CY+14,54,C_B);
    s+=_pole(26,CY); s+=_pole(238,CY);
    s+=_spindle(32,CY-6,66,CY-30); s+=_spindle(32,CY+6,66,CY+30);
    s+=_spindle(232,CY-6,198,CY-30); s+=_spindle(232,CY+6,198,CY+30);
  }
  else if(phase==='metaphase'){
    s+='<line x1="'+CX+'" y1="20" x2="'+CX+'" y2="172" stroke="#C9C9CB" stroke-width="1.6" stroke-dasharray="6 5"/>';
    s+=_pole(26,CY); s+=_pole(238,CY);
    s+=_spindle(30,CY,CX-6,58); s+=_spindle(30,CY,CX-6,134);
    s+=_spindle(234,CY,CX+6,58); s+=_spindle(234,CY,CX+6,134);
    s+=_dup(CX,58,54,C_A);
    s+=_dup(CX,134,54,C_B);
  }
  else if(phase==='anaphase'){
    s+=_pole(20,CY); s+=_pole(244,CY);
    s+=_spindle(26,CY,66,58); s+=_spindle(26,CY,66,134);
    s+=_spindle(238,CY,198,58); s+=_spindle(238,CY,198,134);
    s+=_chromatid(72,58,50,C_A,-1); s+=_chromatid(72,134,50,C_B,-1);
    s+=_chromatid(192,58,50,C_A,1); s+=_chromatid(192,134,50,C_B,1);
  }
  else if(phase==='telophase'){
    s+='<circle cx="72" cy="'+CY+'" r="44" fill="'+NUCF+'" stroke="#4D4D4F" stroke-width="2" stroke-dasharray="7 6"/>';
    s+='<circle cx="192" cy="'+CY+'" r="44" fill="'+NUCF+'" stroke="#4D4D4F" stroke-width="2" stroke-dasharray="7 6"/>';
    s+=_chromatin(72,CY,42,[C_A,C_B,C_A]);
    s+=_chromatin(192,CY,42,[C_A,C_B,C_A]);
  }
  else if(phase==='cytokinesis'){
    s+='<circle cx="74" cy="'+CY+'" r="40" fill="'+NUCF+'" stroke="#4D4D4F" stroke-width="2"/>';
    s+='<circle cx="190" cy="'+CY+'" r="40" fill="'+NUCF+'" stroke="#4D4D4F" stroke-width="2"/>';
    s+=_chromatin(74,CY,38,[C_A,C_B,C_A]);
    s+=_chromatin(190,CY,38,[C_A,C_B,C_A]);
  }
  else if(phase==='plate'){
    /* plant cytokinesis: a cell plate builds across the middle */
    s+='<circle cx="70" cy="'+CY+'" r="38" fill="'+NUCF+'" stroke="#4D4D4F" stroke-width="2"/>';
    s+='<circle cx="194" cy="'+CY+'" r="38" fill="'+NUCF+'" stroke="#4D4D4F" stroke-width="2"/>';
    s+=_chromatin(70,CY,36,[C_A,C_B,C_A]);
    s+=_chromatin(194,CY,36,[C_A,C_B,C_A]);
    var yy;
    for(yy=28;yy<=164;yy+=14){
      s+='<rect x="'+(CX-5)+'" y="'+yy+'" width="10" height="9" rx="3" fill="'+GOLD+'" stroke="'+WALLC+'" stroke-width="1.2"/>';
    }
  }

  if(opt.tag){
    s+='<circle cx="22" cy="20" r="14" fill="#4D4D4F"/>';
    s+=_txt(22,25,opt.tag,{fs:14,c:'#FFFFFF'});
  }
  if(opt.label) s+=_txt(CX,H-8,opt.label,{fs:13.5});
  return s+'</svg>';
}

/* a row of phase cells, wrapped so it reflows on a phone */
function phaseRow(list){
  return '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-start">'+
    list.map(function(it){
      return '<div style="flex:0 0 auto">'+cellPhase(it.p,{w:it.w||168,plant:it.plant,tag:it.tag,label:it.label})+'</div>';
    }).join('')+'</div>';
}

      ' L '+(CXc+r0*Math.cos(t1)).toFixed(1)+' '+(CYc+r0*Math.sin(t1)).toFixed(1)+

/* ==========================================================
   BIO visual pack  (prelude for the Grade 12 Life Sciences ladders)
   List this file FIRST in --levels so every function below exists before
   the level files that call it. Needs helpers.js (GOLD, PALE, CHAR, GREY_L,
   LINE, WHITE, GREEN, RED, GOLD_T, CAT, COLS, vis, dataTable).

   HOW TO USE
   - Every function returns a string. Wrap diagrams in vis(html, 'caption'):
       vis(punnett(['B','b'],['B','b']), 'Cross between two heterozygous parents')
   - HTML helpers (chain, cards, contrast, contrast3, keyterms, codonTable)
     may hold markup (<b>, <i>, <sub>) in their text.
   - SVG helpers (everything else) take PLAIN CHARACTERS ONLY in label
     text. Never pass m(), ch(), f() or any other helper's output into them.
     Write the real characters: mRNA, 3' end, 5%, mya, x, the Greek beta.
   - Numbers drawn inside diagrams use a decimal comma (0,75), as in the
     exam. Pass numbers as numbers or as strings, both work.
   - Label-by-key diagrams (bodyMap, flower, maleRepro, femaleRepro,
     amnioticEgg, spermOvum) share one convention (keys are forgiving about case, spaces and
     common synonyms: 'fallopian tube', 'oviduct' and 'tube' are the same key):
       labels:'all'                    every label, default text
       labels:['ovary','uterus']       only these, default text
       labels:[{k:'ovary', t:'Ovary'}] custom text (t) and/or custom letter (l)
       letters:true                    draw A, B, C... instead of the names, in
                                       the order of the labels array (or give
                                       {k:'ovary', l:'X'} to force a letter)
     If labels is left out, no labels are drawn (use it for a plain picture).
   - BASECOL and BASETXT hold the base colours (A gold, T blue, G green, C red, U purple).
   - Global names starting with _b are private to this file.

   CONTENTS
   HTML:  chain  cards  contrast  contrast3  keyterms  codonTable  aaOf
   SVG :  arrowScale  flow  cycle  punnett  punnettBlank  pedigree  pyramid
          dna  nucleotide  helix  feedbackLoop  bodyMap  flower  maleRepro
          femaleRepro  cycleChart  amnioticEgg  cladogram  timeline  quadrats
          markRecap  succession  growthCurves  skullRow  spermOvum  chromCross
          gelLanes
   ========================================================== */

/* ---------- private utilities ---------- */
var _bFONT = 'Arial, sans-serif';
/* Base colours for nucleotides. */
var BASECOL = {A:'#F2A900', T:'#1F6FB2', G:'#1F6B2E', C:'#B03030', U:'#5B4A9E'};
var BASETXT = {A:'#4D4D4F', T:'#FFFFFF', G:'#FFFFFF', C:'#FFFFFF', U:'#FFFFFF'};

function _bsvg(w, h, body, maxw, vy){
  return '<svg viewBox="0 '+(vy||0)+' '+w+' '+h+'" width="100%" style="max-width:'+(maxw||w)+'px;display:block;margin:8px auto" font-family="'+_bFONT+'">'+body+'</svg>';
}
/* decimal comma */
function _bn(x){ return String(x).replace('.', ','); }
function _bf(x){ return (Math.round(x*10)/10).toString(); }
/* text: o = {a:anchor, fs:size, fw:weight, c:colour, st:style} */
function _bt(x, y, t, o){
  o = o || {};
  return '<text x="'+_bf(x)+'" y="'+_bf(y)+'" text-anchor="'+(o.a||'middle')+'" font-size="'+(o.fs||13)+'" font-weight="'+(o.fw||'normal')+'" fill="'+(o.c||CHAR)+'"'+(o.st?' font-style="'+o.st+'"':'')+(o.rot?' transform="rotate('+o.rot+' '+_bf(x)+' '+_bf(y)+')"':'')+'>'+t+'</text>';
}
/* word wrap to lines of at most n characters */
function _bwrap(str, n){
  var words = String(str).split(' '), lines = [], cur = '';
  words.forEach(function(w){
    if(!cur) cur = w;
    else if((cur+' '+w).length <= n) cur += ' '+w;
    else { lines.push(cur); cur = w; }
  });
  if(cur) lines.push(cur);
  return lines;
}
/* several centred lines of text, first baseline at y */
function _bml(x, y, lines, o, lh){
  var s = '';
  lh = lh || 15;
  lines.forEach(function(l, i){ s += _bt(x, y + i*lh, l, o); });
  return s;
}
function _bline(x1, y1, x2, y2, col, w, dash){
  return '<line x1="'+_bf(x1)+'" y1="'+_bf(y1)+'" x2="'+_bf(x2)+'" y2="'+_bf(y2)+'" stroke="'+(col||CHAR)+'" stroke-width="'+(w||1.5)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
}
/* line with an arrowhead at (x2,y2) */
function _barrow(x1, y1, x2, y2, col, w, head){
  col = col || CHAR; w = w || 2; head = head || 9;
  var a = Math.atan2(y2-y1, x2-x1), ca = Math.cos(a), sa = Math.sin(a);
  var bx = x2 - head*ca, by = y2 - head*sa;
  var p1 = (bx - head*0.5*sa)+','+(by + head*0.5*ca), p2 = (bx + head*0.5*sa)+','+(by - head*0.5*ca);
  return _bline(x1, y1, bx + 1*ca, by + 1*sa, col, w) + '<polygon points="'+_bf(x2)+','+_bf(y2)+' '+p1+' '+p2+'" fill="'+col+'"/>';
}
function _brect(x, y, w, h, fill, stroke, sw, rx){
  return '<rect x="'+_bf(x)+'" y="'+_bf(y)+'" width="'+_bf(w)+'" height="'+_bf(h)+'" rx="'+(rx||0)+'" fill="'+fill+'" stroke="'+(stroke||'none')+'" stroke-width="'+(sw||1.5)+'"/>';
}
function _brectd(x, y, w, h, stroke, rx){
  return '<rect x="'+_bf(x)+'" y="'+_bf(y)+'" width="'+_bf(w)+'" height="'+_bf(h)+'" rx="'+(rx||0)+'" fill="none" stroke="'+stroke+'" stroke-width="2" stroke-dasharray="6 4"/>';
}
function _bcirc(x, y, r, fill, stroke, sw){
  return '<circle cx="'+_bf(x)+'" cy="'+_bf(y)+'" r="'+r+'" fill="'+fill+'" stroke="'+(stroke||'none')+'" stroke-width="'+(sw||1.5)+'"/>';
}
function _bell(x, y, rx, ry, fill, stroke, sw, rot){
  return '<ellipse cx="'+_bf(x)+'" cy="'+_bf(y)+'" rx="'+rx+'" ry="'+ry+'" fill="'+fill+'" stroke="'+(stroke||'none')+'" stroke-width="'+(sw||1.5)+'"'+(rot?' transform="rotate('+rot+' '+_bf(x)+' '+_bf(y)+')"':'')+'/>';
}
function _bpath(d, fill, stroke, sw, extra){
  return '<path d="'+d+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'none')+'" stroke-width="'+(sw||1.5)+'"'+(extra?' '+extra:'')+'/>';
}
/* deterministic pseudo random numbers (so a diagram never changes between renders) */
function _bseed(n){
  var s = (n*9301 + 49297) % 233280;
  return function(){ s = (s*9301 + 49297) % 233280; return s/233280; };
}
/* Monotone cubic interpolation through [x,y] points, sampled every dx. Never overshoots,
   so a peak given at a data point stays exactly there. Returns an array of [x,y]. */
function _bmono(pts, dx){
  var n = pts.length, h = [], d = [], m = [], i;
  for(i = 0; i < n-1; i++){ h[i] = pts[i+1][0]-pts[i][0]; d[i] = (pts[i+1][1]-pts[i][1])/h[i]; }
  m[0] = d[0]; m[n-1] = d[n-2];
  for(i = 1; i < n-1; i++) m[i] = (d[i-1]*d[i] <= 0) ? 0 : (d[i-1]+d[i])/2;
  for(i = 0; i < n-1; i++){
    if(d[i] === 0){ m[i] = 0; m[i+1] = 0; continue; }
    var a = m[i]/d[i], b = m[i+1]/d[i], s = a*a+b*b;
    if(s > 9){ var t = 3/Math.sqrt(s); m[i] = t*a*d[i]; m[i+1] = t*b*d[i]; }
  }
  var out = [], x, k = 0;
  for(x = pts[0][0]; x <= pts[n-1][0] + 1e-9; x += dx){
    while(k < n-2 && x > pts[k+1][0]) k++;
    var tt = (x-pts[k][0])/h[k], t2 = tt*tt, t3 = t2*tt;
    var y = (2*t3-3*t2+1)*pts[k][1] + (t3-2*t2+tt)*h[k]*m[k] + (-2*t3+3*t2)*pts[k+1][1] + (t3-t2)*h[k]*m[k+1];
    out.push([x, y]);
  }
  return out;
}
function _bpoly(pts, col, w, dash){
  return '<polyline points="'+pts.map(function(p){return _bf(p[0])+','+_bf(p[1]);}).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="'+(w||2.5)+'" stroke-linejoin="round" stroke-linecap="round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
}

/* Label machinery shared by the labelled-diagram helpers.
   _bnorm turns the user's labels option into [{k,t,l}].
   _blabels draws leader lines and either text or lettered circles.
   P[key] = {x,y: target point on the diagram, lx,ly: where the leader line ends, side:'l' or 'r'} */
var _bALIAS = {oviduct:'tube', fallopiantube:'tube', uterinetube:'tube', spermduct:'vasdeferens', pistil:'carpel', adrenals:'adrenal',
  adrenalgland:'adrenal', adrenalglands:'adrenal', ovaries:'ovary', testes:'testis', testicle:'testis', parathyroids:'parathyroid',
  parathyroidglands:'parathyroid', thyroidgland:'thyroid', pituitarygland:'pituitary', pinealgland:'pineal', eggwhite:'albumen',
  zonapellucida:'zona', coronaradiata:'corona', cellmembrane:'membrane', mitochondrion:'mitochondria', flagellum:'tail',
  spermnucleus:'sperm_nucleus', ovumnucleus:'ovum_nucleus', womb:'uterus', endometrial:'endometrium'};
function _bk(k){ return String(k).toLowerCase().replace(/[^a-z0-9]/g, ''); }
function _bnorm(labels, defaults){
  if(labels === 'all') labels = Object.keys(defaults);
  var byNorm = {};
  Object.keys(defaults).forEach(function(k){ byNorm[_bk(k)] = k; });
  return (labels || []).map(function(it){
    if(typeof it === 'string') it = {k: it};
    var nk = _bk(it.k), key = byNorm[nk] || (_bALIAS[nk] && defaults[_bALIAS[nk]] !== undefined ? _bALIAS[nk] : it.k);
    return {k: key, t: (it.t !== undefined ? it.t : (defaults[key] || it.k)), l: it.l};
  });
}
function _blabels(items, P, letters, wrapN){
  var s = '';
  items.forEach(function(it, i){
    var p = P[it.k]; if(!p) return;
    var lt = it.l || String.fromCharCode(65 + i);
    var dir = (p.side === 'l') ? -1 : 1;
    s += _bline(p.x, p.y, p.lx, p.ly, CHAR, 1.2);
    s += _bcirc(p.x, p.y, 2.6, CHAR);
    if(letters){
      s += _bcirc(p.lx + dir*12, p.ly, 12, WHITE, CHAR, 1.8) + _bt(p.lx + dir*12, p.ly + 5, lt, {fs:14, fw:'bold'});
    } else {
      var lines = _bwrap(it.t, wrapN || 17), y0 = p.ly + 5 - (lines.length-1)*8;
      lines.forEach(function(l, j){
        s += _bt(p.lx + dir*5, y0 + j*16, l, {a: dir < 0 ? 'end' : 'start', fs:14, fw:'bold'});
      });
    }
  });
  return s;
}
