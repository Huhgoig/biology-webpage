<div class="step-line">Are the plants surviving because of a predator, drought or disease? No, the grower is deciding what suits people.</div>
<div class="step-line ans">The grower is the selecting agent, so this is artificial selection.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Look for the verb: <b>choose, pick, save, breed from</b> means a human is selecting. <b>Survive, die, escape, resist</b> means the environment is, unless a person is the subject of the sentence.</p></div>
`},
  qs:[
{type:'text', stem:`In artificial selection, who chooses which individuals breed? Answer in one word.`, ans:'humans', anyCase:true, accept:['human','people','person','humanity','mankind','man','breeders','breeder','farmers','farmer','humans.'], ph:'one word',
 hint:'Think of the word artificial: made by people.',
 sol:`<div class="step-line">In artificial selection, humans choose the parents, based on characteristics they want.</div><div class="step-line">Predators, climate and competition for food are environmental pressures. They drive natural selection, not artificial selection.</div><div class="step-line ans">Answer: humans</div>`},
{type:'text', stem:`Breeding closely related individuals over many generations is a danger of artificial selection. What is this called?`, ans:'inbreeding', anyCase:true, accept:['in-breeding','in breeding','inbreed','inbred','inbreeding depression'], ph:'one word',
 hint:'Breeding within the same close family.',
 sol:`<div class="step-line">Mating between closely related individuals is called inbreeding.</div><div class="step-line">It reduces genetic diversity and lets harmful recessive alleles be expressed.</div><div class="step-line ans">Answer: inbreeding</div>`},
{type:'mc', stem:`A farmer keeps only the Boer goats that put on mass fastest and breeds from them. Why is this <b>artificial</b> selection?`, opts:[`The farmer, and not the environment, chooses which animals will breed`,`The grass is part of the environment, and so it decides which goats live`,`The goats with fast mass gain changed their bodies as they grew up`,`Fast mass gain cannot be inherited, so the farmer has to repeat it`], ans:0,
 hint:'Ask who decides which animals produce the next generation.',
 sol:`<div class="step-line">The farmer chooses the parents. That is what makes the selection artificial.</div><div class="step-line">If the grass or a drought decided who survives and breeds on its own, it would be natural selection.</div><div class="step-line">Individual goats do not change their bodies to gain mass for the next generation, and fast mass gain can be inherited, so the options about goats changing their bodies and about mass gain not being inherited are wrong.</div><div class="step-line ans">Answer: the farmer, and not the environment, chooses which animals will breed</div>`},
{type:'mc', stem:`Which of the following is a <b>disadvantage</b> of artificial selection?`, opts:[`The population loses genetic diversity, so a new disease could harm all the individuals`,`The population can only change after many thousands of generations have passed in total`,`The selected traits cannot be inherited by the offspring of the parents that were chosen`,`The environment decides which individuals breed, so humans lose control of the breeding`], ans:0,
 hint:'Think about what happens to the range of alleles when only a few parents are chosen.',
 sol:`<div class="step-line">Using only a few chosen parents reduces genetic diversity. A population in which all individuals are alike can be wiped out by one new disease or change.</div><div class="step-line">Artificial selection is faster than natural selection, the selected traits are inherited, and humans (not the environment) choose the parents. The remaining options are therefore wrong.</div><div class="step-line ans">Answer: the population loses genetic diversity, so a new disease could harm all the individuals</div>`},
{type:'mc', stem:`A sheep farmer breeds only from the sheep with the finest wool, for 20 generations. The wool becomes much finer, but the flock becomes very uniform genetically. <b>Evaluate</b> this method.`, opts:[`Fine wool increased quickly, but low genetic diversity could let one new disease harm the whole flock`,`Fine wool increased slowly, because the environment decides which sheep reproduce in the flock`,`Fine wool increased, and the flock is now better able to survive any change in the environment around it`,`Fine wool increased, since each sheep grew finer wool during its lifetime and passed it on`], ans:0,
 hint:'Give one advantage and one risk.',
 sol:`<div class="step-line">Advantage: the farmer reached the goal (finer wool) in a controlled, relatively short time.</div><div class="step-line">Risk: the flock is genetically uniform, with few alleles. One new disease or a change in climate could affect every sheep.</div><div class="step-line">The option that says the environment decides which sheep reproduce is wrong because humans decide. The option that says the flock can now survive any change is wrong because low diversity makes survival of a change less likely. The option about each sheep growing finer wool and passing it on is Lamarckian.</div><div class="step-line ans">Answer: fine wool increased quickly, but low genetic diversity could let one new disease harm the whole flock</div>`}
]},

{ id:7, name:'Evidence for evolution', short:'Evidence for evolution',
  teach:{ h:'Five lines of evidence point to common ancestry', b:`
<p>Scientists do not rely on one clue. Evidence for evolution comes from <b>five</b> independent sources, and they all agree.</p>
${cards([
 {t:'Fossils', d:'Rock layers show a sequence of life. Transitional fossils such as Archaeopteryx (feathers, teeth and a long bony tail) link groups. The Karoo of South Africa has one of the richest fossil records of land animals in the world.'},
 {t:'Biogeography', d:'Where species live. Marsupials are varied and abundant in Australia but have no native species in Africa or Europe, and island species resemble those of the nearest mainland.'},
 {t:'Comparative anatomy', d:'Homologous, analogous and vestigial structures.', hi:true},
 {t:'Comparative embryology', d:'Early embryos of fish, birds and humans look alike, including pharyngeal arches (gill slits) and a tail.'},
 {t:'DNA and proteins', d:'The more closely related two species are, the more similar their DNA and proteins.'}
],{min:215})}
${contrast3(['Structure','Meaning','Example'],[
 ['Homologous','Same basic structure and bone plan, different function. Shows common ancestry.','Human arm and whale flipper'],
 ['Analogous','Different structure, similar function. Shows similar environments, not ancestry.','Wing of a bird and wing of an insect'],
 ['Vestigial','Reduced structure that has lost its original function.','Human appendix; pelvic bones of whales']
])}
<div class="worked"><span class="lbl">Worked example: reasoning from structure</span>
<div class="step-line">A human arm and a whale flipper look very different and do different jobs.</div>
<div class="step-line">Inside, both have one upper arm bone, two forearm bones, wrist bones and five digits in the same arrangement.</div>
<div class="step-line">Such a close match is unlikely if they arose separately. It is expected if both came from a common ancestor.</div>
<div class="step-line ans">Same bone plan, different function: homologous structures, evidence of a common ancestor.</div></div>
<div class="callout"><span class="lbl">Rule</span><p><b>Homologous</b>: same plan, different job, common ancestor. <b>Analogous</b>: different plan, same job, similar environment. <b>Vestigial</b>: reduced and no longer needed.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>A bird's wing and an insect's wing look alike and do the same job, but they are <b>not</b> evidence of common ancestry. They are analogous.</p></div>
${keyterms([['fossil','preserved remains or traces of an organism'],['transitional fossil','shows features of two groups'],['homologous structure','same bone plan, different function'],['analogous structure','same function, different structure'],['vestigial structure','a reduced structure without its original function'],['biogeography','the study of where species live']])}
`},
  reteach:{ h:'Which type of evidence is it? A classification table', b:`
<p>Recall from level 5: natural selection works on inherited variation, so living things that are related share ancestors. Every line of evidence below is a trace of that shared ancestry.</p>
<p>An exam gives you a clue and asks what kind of evidence it is. Match the clue to the thing being <b>compared</b>.</p>
${contrast3(['Type of evidence','What is compared','Example'],[
 ['Fossils','Remains in rock layers of different ages','Fossil whales with small hind legs lie in older rock than modern whales'],
 ['Biogeography','Where related species live','Ostrich in Africa, rhea in South America, emu in Australia: all flightless birds'],
 ['Comparative anatomy','Body structures of living animals','Tiny hip bones inside a python that has no legs'],
 ['Comparative embryology','Stages of development','Embryos of a fish and a human both have a tail and pharyngeal arches'],
 ['DNA and proteins','Base or amino acid sequences','Human and chimpanzee DNA differ by only about 1 to 2%']
])}
<div class="worked"><span class="lbl">Worked example: classify the clue</span>
<div class="step-line">Clue: the arm bones of a penguin and the arm bones of a human are arranged in the same way.</div>
<div class="step-line">What is compared? Bones of living animals: structures. Is the plan the same while the job differs? Yes (flipper versus arm).</div>
<div class="step-line ans">Comparative anatomy, a homologous structure, pointing to a common ancestor.</div>
<div class="step-line">Second clue: the front leg of a frog and the arm of a human share the same bone plan. The same reasoning applies: homologous structures.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Ask what is being compared: rock layers (fossils), places (biogeography), adult structures (anatomy), early stages (embryology), or sequences (DNA and proteins).</p></div>
`},
  qs:[
{type:'mc', stem:`Which pair of structures is <b>homologous</b>?`, opts:[`The forelimb of a horse and the flipper of a seal`,`The wing of a butterfly and the wing of a bat`,`The fin of a shark and the flipper of a dolphin`,`The eye of an octopus and the eye of a human being`], ans:0,
 hint:'Homologous structures share a bone plan inherited from a common ancestor.',
 sol:`<div class="step-line">The forelimb of a horse and the flipper of a seal share the same bone plan, with different functions. They are homologous.</div><div class="step-line">A butterfly wing has no bones, so it is analogous to a bat wing. A shark fin and a dolphin flipper, and the eye of an octopus and the eye of a human, do the same job but arose separately, so they are analogous.</div><div class="step-line ans">Answer: the forelimb of a horse and the flipper of a seal</div>`},
{type:'text', stem:`The wings of a kiwi are tiny and cannot be used for flight. What type of structure is this?`, ans:'vestigial', anyCase:true, accept:['vestigial structure','a vestigial structure','vestigial structures','vestigial organ','vestigial organs','vestigial'], ph:'one word',
 hint:'It is reduced and no longer needed, like the human appendix.',
 sol:`<div class="step-line">A reduced structure that no longer has its original function is vestigial.</div><div class="step-line">It suggests that the ancestors of the kiwi had wings and used them.</div><div class="step-line ans">Answer: vestigial</div>`},
{type:'mc', stem:`Which one is evidence from <b>biogeography</b>?`, opts:[`Marsupials are varied and common in Australia, but no native ones live in Africa or Europe`,`The embryos of a fish and of a human both have a tail and gill slits in early development`,`Fossils with both feathers and teeth are found in rock that is about 150 million years old`,`Human and chimpanzee DNA differ in only a small percentage of the bases in the genome`], ans:0,
 hint:'Biogeography is about where species are found.',
 sol:`<div class="step-line">Where species live is biogeography. Marsupials are abundant in Australia but no native species live in Africa or Europe.</div><div class="step-line">The tail in embryos is embryology. Feathered fossils are fossil evidence. DNA similarity is biochemical (genetic) evidence.</div><div class="step-line ans">Answer: marsupials are varied and common in Australia, but no native ones live in Africa or Europe</div>`},
{type:'text', stem:`A class data set gives the number of amino acid differences in one protein compared with the human version.
<br><b>Illustrative values.</b> Which animal in the table is most likely to be the closest relative of humans?`, v:vis(dataTable(['Animal','Amino acid differences from human'],[['Chimpanzee','0'],['Rhesus monkey','1'],['Dog','10'],['Horse','12'],['Tuna','21']],{w:380}), 'Illustrative values from a class data set.'), ans:'chimpanzee', anyCase:true, accept:['chimp','chimpanzees','the chimpanzee','chimps'], ph:'one animal',
 hint:'Fewer differences in a protein means a more recent common ancestor.',
 sol:`<div class="step-line">The fewer the differences in a protein, the more recently two species shared an ancestor.</div><div class="step-line">Chimpanzee has 0 differences, the fewest, so it is the closest relative in this data set.</div><div class="step-line">Tuna has the most differences, so it is the most distantly related. Dog and horse are in between.</div><div class="step-line ans">Answer: chimpanzee</div>`},
{type:'mc', stem:`A fossil from the Karoo, about 250 million years old, has a reptile-like skeleton but teeth of different shapes (incisors, canines and cheek teeth) and a jaw with features found in mammals. What does this fossil suggest?`, opts:[`Mammals evolved from reptile-like ancestors, and the fossil is a transitional form`,`All reptiles gradually turned into mammals, and none of them are alive today`,`Mammals grew different teeth by using their jaws, and then passed these on to all of their offspring`,`Mammals and reptiles are unrelated, since the fossil has two sets of features`], ans:0,
 hint:'A fossil with features of two groups is called a transitional fossil.',
 sol:`<div class="step-line">Features of both reptiles (the skeleton) and mammals (different tooth shapes, the jaw) show a link between the groups. This is a transitional form.</div><div class="step-line">It suggests that mammals evolved from reptile-like ancestors. It does not mean that every reptile became a mammal, because reptiles are still alive.</div><div class="step-line">The option about mammals growing different teeth by using their jaws is Lamarckian. The option that says mammals and reptiles are unrelated is wrong because shared features suggest a relationship.</div><div class="step-line ans">Answer: mammals evolved from reptile-like ancestors, and the fossil is a transitional form</div>`}
]},

{ id:8, name:'Convergent and divergent evolution', short:'Convergent and divergent',
  teach:{ h:'Similar environments or a shared ancestor?', b:`
<p>Two patterns explain why species can look alike or look different. <b>Convergent evolution</b>: unrelated species in <b>similar environments</b> evolve similar features. <b>Divergent evolution</b>: related species from a <b>common ancestor</b> move into different environments and evolve different features.</p>
${cards([
 {t:'Convergent evolution', d:'Different ancestors, similar environment, similar selective pressures. Produces analogous structures. Example: shark (a fish) and dolphin (a mammal) have the same streamlined body and fins.', hi:true},
 {t:'Divergent evolution', d:'One ancestor, different environments, different selective pressures. Example: adaptive radiation of Darwin\'s finches into species with different beaks.'}
],{min:230})}
${vis(flow(['One ancestral finch species reaches the islands','Groups settle on different foods','Beaks evolve to suit each food','Many finch species result']), 'Divergent evolution (adaptive radiation) in Darwin\'s finches')}
<div class="worked"><span class="lbl">Worked example: a glider on two continents</span>
<div class="step-line">The sugar glider lives in Australia and is a marsupial. The flying squirrel lives in North America and is a placental mammal. Both glide between trees on a flap of skin.</div>
<div class="step-line">Their last common ancestor was long ago and did not glide. They live in similar forest habitats on separate continents.</div>
<div class="step-line">Similar pressures (moving between trees) selected for similar skin flaps in each lineage.</div>
<div class="step-line ans">Unrelated lineages, similar environment, similar feature: convergence, giving analogous structures.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Same environment, <b>different</b> ancestors: convergent. Same ancestor, <b>different</b> environments: divergent.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Looking alike does not prove being related. Always ask whether the similarity is from a shared ancestor or from a shared environment.</p></div>
${keyterms([['convergent evolution','unrelated species evolve similar features'],['divergent evolution','related species evolve different features'],['adaptive radiation','many species from one ancestor, each adapted to a different niche'],['analogous structure','same function, different origin'],['common ancestor','the species both groups descended from'],['selective pressure','the environmental factor selecting for a trait']])}
`},
  reteach:{ h:'Decision rule: same ancestor, same environment, or both?', b:`
<p>Ask two questions about any pair of species, in this order: <b>1. Do they share a recent common ancestor? 2. Do they live in similar environments?</b></p>
${contrast3(['Ancestor?','Environment?','What happened'],[
 ['Recent common ancestor','Different environments','Features became different: divergent'],
 ['Different, distant ancestors','Similar environments','Similar features appear: analogous structures'],
 ['Recent common ancestor','Similar environments','Often stay similar: no new pattern to explain'],
 ['Different, distant ancestors','Different environments','Look different: nothing to explain']
])}
<div class="worked"><span class="lbl">Worked example: two pairs</span>
<div class="step-line">Pair 1: cacti in the deserts of the Americas and euphorbias in the deserts of Africa. Both are fleshy, spiny plants that store water. They belong to different plant families, so their ancestors were distantly related. Both live in hot, dry places.</div>
<div class="step-line">Pair 2: the hundreds of cichlid fish species in the African lakes. They are all descended from one ancestor and live in different niches (feeding on algae, insects, fish).</div>
<div class="step-line ans">Pair 1: different ancestors, same environment. Pair 2: one ancestor, different environments, so the features diverged.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>The two questions always sort the pair. Different ancestors but a similar environment is the pattern behind analogous structures.</p></div>
`},
  qs:[
{type:'mc', stem:`Which pair is an example of <b>convergent</b> evolution?`, opts:[`Hummingbirds of the Americas and sunbirds of Africa, unrelated groups that both have long thin beaks for nectar`,`A ground finch and a cactus finch on neighbouring islands, which both descended from one ancestral finch species`,`A horse and a zebra, which live in similar grassland, have a recent common ancestor and look alike for that reason`,`Two populations of one lizard species living on the same hillside, which interbreed freely and look the same`], ans:0,
 hint:'Look for unrelated groups with a similar feature.',
 sol:`<div class="step-line">Hummingbirds and sunbirds are unrelated groups that feed on nectar and have evolved similar long, thin beaks. That is convergence.</div><div class="step-line">The two finches share an ancestor and show divergence. The horse and zebra look alike because they are closely related. The lizard populations are not evolving separately.</div><div class="step-line ans">Answer: hummingbirds of the Americas and sunbirds of Africa, unrelated groups that both have long thin beaks for nectar</div>`},
{type:'text', stem:`Unrelated species living in similar environments evolve similar features because of similar selective pressures. What type of evolution is this?`, ans:'convergent', anyCase:true, accept:['convergent evolution','convergence','convergent evolutions'], ph:'one word',
 hint:'The features converge, or come together.',
 sol:`<div class="step-line">Unrelated species, similar environments, similar features: this is convergent evolution.</div><div class="step-line">The structures it produces are called analogous structures.</div><div class="step-line ans">Answer: convergent evolution</div>`},
{type:'text', stem:`When a single ancestral species gives rise to many species, each adapted to a different niche, this is called adaptive ______.`, ans:'radiation', anyCase:true, accept:['adaptive radiation','radiations','a radiation'], ph:'one word',
 hint:'Think of Darwin\'s finches spreading out into many species.',
 sol:`<div class="step-line">One ancestral species, many new species, each adapted to a different niche: this is adaptive radiation. It is a type of divergent evolution.</div><div class="step-line ans">Answer: radiation</div>`},
{type:'mc', stem:`Which statement about <b>analogous</b> structures is correct?`, opts:[`They have a similar function but evolved from different structures in unrelated organisms`,`They have a similar bone plan but different functions in species that share a common ancestor`,`They are structures that have lost most of their function and are now reduced in size`,`They always show that the different species carrying them share a very recent common ancestor`], ans:0,
 hint:'Analogous means same job, different origin.',
 sol:`<div class="step-line">Analogous structures do the same job but come from different origins. They are produced by convergent evolution.</div><div class="step-line">The option about a similar bone plan describes homologous structures. The option about lost function describes vestigial structures. The option about a very recent ancestor is wrong, since analogous structures do not show a recent common ancestor.</div><div class="step-line ans">Answer: they have a similar function but evolved from different structures in unrelated organisms</div>`},
{type:'mc', stem:`Giant groundsels and giant lobelias grow on the high mountains of East Africa. Both are tall plants with a ring of large leaves held on a thick stem. Groundsels and lobelias belong to different plant families. Which explanation is best?`, opts:[`Similar selective pressures on cold, high mountains favoured the same growth form in two unrelated lineages`,`Groundsels turned into lobelias, since they share a growth form and live in the same mountain habitat today`,`Both plants have inherited the growth form from a recent common ancestor that lived on the mountains`,`The plants grew the same way because the cold made individual plants change their form to match`], ans:0,
 hint:'Different families means different ancestors. What do they share?',
 sol:`<div class="step-line">Different families means different ancestors, but they share a cold, high-altitude environment.</div><div class="step-line">Similar selective pressures favoured a similar growth form in each lineage. This is convergent evolution, and the growth forms are analogous.</div><div class="step-line">One species does not turn into another. A recent common ancestor would put them in the same family. Individual plants do not change form because of the cold, since that would be Lamarckian.</div><div class="step-line ans">Answer: similar selective pressures on cold, high mountains favoured the same growth form in two unrelated lineages</div>`}
]},

{ id:9, name:'Gradualism and punctuated equilibrium', short:'Gradualism vs punctuated',
  teach:{ h:'Two models for the pace of evolution', b:`
<p>Does evolution run at an even speed? <b>Gradualism</b> says yes: species change slowly and steadily. <b>Punctuated equilibrium</b>, proposed by Eldredge and Gould, says no: species stay almost unchanged for a very long time, then change quickly in a short burst, often when a new species forms.</p>
${contrast('Gradualism','Punctuated equilibrium',[
 ['Change is slow and steady, a little in every generation','Long periods of little change (stasis), broken by short bursts of rapid change'],
 ['Predicts many transitional fossils in the rock layers','Predicts few transitional fossils, because the bursts are short'],
 ['The fossil record has gaps because fossilisation is rare','The gaps in the fossil record are partly real: change was fast there']
])}
${vis(dataTable(['Rock layer (million years ago)','10','8','6','4','2'],[['Mean shell width of a fossil snail (mm)','20','20','21','33','33']],{w:520}), 'Illustrative data for a fossil snail lineage, from layers of rock of different ages.')}
<div class="worked"><span class="lbl">Worked example: compare the rate of change</span>
<div class="step-line">From 10 to 6 million years ago: width went from 20 mm to 21 mm. Change = 1 mm over 4 million years = 0,25 mm per million years.</div>
<div class="step-line">From 6 to 4 million years ago: width went from 21 mm to 33 mm. Change = 12 mm over 2 million years = 6 mm per million years.</div>
<div class="step-line">From 4 to 2 million years ago: 33 mm to 33 mm. No change.</div>
<div class="step-line">The layers are 2 million years apart, so the real burst may have been much shorter than the gap between layers.</div>
<div class="step-line ans">The burst is 6 ÷ 0,25 = 24 times faster than the slow period. A long flat period plus a short burst fits punctuated equilibrium.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Read the graph for <b>shape</b>. A smooth, steady slope means gradualism. Flat sections joined by a steep step mean punctuated equilibrium.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Punctuated equilibrium does not mean the change happened overnight. A "short burst" can still last tens of thousands of years, which is short in geological time.</p></div>
${keyterms([['gradualism','slow, steady change over a very long time'],['punctuated equilibrium','long stasis broken by rapid change'],['stasis','a period of little or no change'],['transitional fossil','a fossil showing features of an ancestor and a descendant'],['fossil record','the sequence of fossils in rock layers'],['Eldredge and Gould','proposed punctuated equilibrium']])}
`},
  reteach:{ h:'A ramp or a staircase?', b:`
<p>Picture the two models as a <b>ramp</b> and a <b>staircase</b>. On a ramp you rise a little with every step you take. On a staircase you walk along flat floor, then climb a step, then walk along another flat floor.</p>
${vis(lineChart({title:'Picture 1: the ramp', xs:['0','1','2','3','4','5','6','7'], series:[{name:'Body size', vals:[10,13,16,19,22,25,28,31]}], yLabel:'body size (units)', labels:false, min:0, max:35, w:330, h:190}), 'Body size of a lineage over 7 million years (illustrative). Horizontal axis: time in million years from the start; time runs left to right.')}
${vis(lineChart({title:'Picture 2: the staircase', xs:['0','1','2','3','4','5','6','7'], series:[{name:'Body size', vals:[10,10,10,24,24,24,24,24]}], yLabel:'body size (units)', labels:false, min:0, max:35, w:330, h:190}), 'Body size of a lineage over 7 million years (illustrative). Horizontal axis: time in million years from the start; time runs left to right.')}
<div class="worked"><span class="lbl">Worked example: read the steps</span>
<div class="step-line">Picture 1: size rises by 3 units every million years, all the way along. Every layer of rock would show an in-between form.</div>
<div class="step-line">Picture 2: size stays at 10 for 2 million years, jumps by 14 units in one million years, then stays at 24. Most rock layers show one of two forms and very few show an in-between form.</div>
<div class="step-line ans">The ramp is gradualism. The staircase is punctuated equilibrium.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Ramp: even slope, many in-between fossils. Staircase: flat, steep, flat, with few in-between fossils. When you meet a graph, ask: is it a ramp or a staircase?</p></div>
`},
  qs:[
{type:'mc', stem:`The graph shows the skull length of a fossil lineage in rock layers of different ages.
<br><b>Illustrative data.</b> Which model does the graph support?`, v:vis(lineChart({title:'Skull length of a fossil lineage (mm)', xs:['6','5','4','3','2','1'], series:[{name:'Skull length', vals:[12,15,18,21,24,27]}], labels:true, min:0, max:30, w:340, h:200}), 'Horizontal axis: age of rock layer in million years ago.'), opts:[`Gradualism, because the skull length changed by the same amount in each million years`,`Punctuated equilibrium, because the skull length changed in every one of the rock layers shown`,`Gradualism, because the skull length stayed the same in the layers for a long time`,`Punctuated equilibrium, because the change in skull length was fast between layers`], ans:0,
 hint:'Is the change steady, or are there flat sections with a sudden step?',
 sol:`<div class="step-line">The skull length rises by 3 mm in every million years, an even slope. This is a ramp.</div><div class="step-line">A ramp is gradualism. In punctuated equilibrium there would be flat sections and a sudden step.</div><div class="step-line ans">Answer: gradualism, because the skull length changed by the same amount in each million years</div>`},
{type:'text', stem:`In punctuated equilibrium, the long periods in which a species shows little or no change are called periods of ______.`, ans:'stasis', anyCase:true, accept:['equilibrium','stability','static','stagnation','a period of stasis','statis'], ph:'one word',
 hint:'Think of the flat sections of the graph.',
 sol:`<div class="step-line">The flat periods between the bursts of change are periods of stasis (equilibrium).</div><div class="step-line ans">Answer: stasis</div>`},
{type:'text', stem:`Which two scientists proposed the model of punctuated equilibrium in 1972? Give both surnames.`, ans:'Eldredge and Gould', anyCase:true, accept:['Gould and Eldredge','Eldredge Gould','Gould Eldredge','Eldredge & Gould','Gould & Eldredge','Eldredge, Gould','Gould, Eldredge','Niles Eldredge and Stephen Jay Gould','Stephen Jay Gould and Niles Eldredge','Niles Eldredge and Stephen Gould','Eldredge and Stephen Jay Gould'], ph:'two surnames',
 hint:'Two American palaeontologists, in the early 1970s.',
 sol:`<div class="step-line">Niles Eldredge and Stephen Jay Gould proposed punctuated equilibrium in 1972.</div><div class="step-line">Darwin and Wallace proposed natural selection. Lamarck proposed use and disuse. Watson and Crick described the structure of DNA.</div><div class="step-line ans">Answer: Eldredge and Gould</div>`},
{type:'mc', stem:`Why do supporters of punctuated equilibrium say that the <b>gaps</b> in the fossil record are expected?`, opts:[`Rapid change in small populations left few fossils of the in-between forms`,`Fossils of in-between forms were destroyed by the new species that replaced them`,`Species change in every generation, so no two generations look alike`,`Gradual change produces many fossils, so the gaps must have been filled in later`], ans:0,
 hint:'Short bursts of change happen to small groups, in a short time.',
 sol:`<div class="step-line">Bursts of rapid change happen in a short time and in small populations. Few individuals live, die and fossilise during a burst, so few in-between forms are found.</div><div class="step-line">New species do not destroy fossils. Change in every generation would be gradualism. Gradual change would predict many in-between fossils, not gaps.</div><div class="step-line ans">Answer: rapid change in small populations left few fossils of the in-between forms</div>`},
{type:'mc', stem:`A researcher measured the mean tooth length of two fossil lineages, X and Y, in rock layers of different ages.
<br><b>Illustrative data.</b> Which statement is correct?`, v:vis(dataTable(['Age of layer (million years ago)','12','10','8','6','4','2'],[['Lineage X: tooth length (mm)','14','16','18','20','22','24'],['Lineage Y: tooth length (mm)','14','14','14','23','23','23']],{w:540}), 'Illustrative data for two lineages.'), opts:[`X fits gradualism (2 mm every 2 million years); Y fits punctuated equilibrium (no change, then 9 mm in 2 million years, then no change)`,`X fits punctuated equilibrium (2 mm every 2 million years); Y fits gradualism (no change for 4 million years, then 9 mm in 2 million years, then none)`,`Both X and Y fit gradualism, because the tooth length of each lineage is larger at the end of the record than it was at the start`,`Both X and Y fit punctuated equilibrium, because the tooth length of each lineage changed at some stage during the time shown in the table`], ans:0,
 hint:'Work out the change per two million years for each lineage.',
 sol:`<div class="step-line">Lineage X: 14, 16, 18, 20, 22, 24 mm, so +2 mm in every 2 million years. A constant rate: a ramp, gradualism.</div><div class="step-line">Lineage Y: 14, 14, 14 (stasis), then 23 mm after the 8 to 6 interval (+9 mm in 2 million years), then 23, 23 (stasis). A staircase: punctuated equilibrium.</div><div class="step-line">Both lineages increased, and both changed at some stage, so those facts cannot tell the two models apart. The pattern of the change can.</div><div class="step-line ans">Answer: X fits gradualism (2 mm every 2 million years); Y fits punctuated equilibrium (no change, then 9 mm in 2 million years, then no change)</div>`}
]},

{ id:10, name:'Species and reproductive isolation', short:'Species and isolation',
  teach:{ h:'Reproductive isolation keeps species separate', b:`
<p>A <b>species</b> is a group of organisms that can <b>interbreed to produce fertile offspring</b>. Two species stay separate because of <b>isolating mechanisms</b>: barriers that stop them breeding together successfully.</p>
${contrast3(['Isolating mechanism','How it keeps the species apart','Example'],[
 ['Geographic','A physical barrier keeps the groups from ever meeting','Two groups of tortoises on different islands'],
 ['Temporal','They breed at different times of day or year','Two frog species that breed in different months'],
 ['Behavioural','Courtship signals (calls, dances) are not recognised','Songbirds that answer only their own species\' song'],
 ['Mechanical','Body parts or flowers do not fit together','Flowers shaped for one pollinator only'],
 ['Hybrid sterility','Offspring are born but are sterile','Hybrids of two fruit fly species']
])}
<div class="worked"><span class="lbl">Worked example: which mechanism?</span>
<div class="step-line">Two firefly species live in the same meadow at the same time of night.</div>
<div class="step-line">Males of species X flash twice a second. Males of species Y flash once every three seconds. Females answer only their own species' pattern.</div>
<div class="step-line">They meet and breed at the same time, so the barrier is not place or timing. The signals are not recognised, so mating never starts.</div>
<div class="step-line ans">The mechanism is a difference in courtship signals: behavioural isolation.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Work down the list in the order the barriers act: do they meet, do they breed at the same time, does courtship work, do the bodies fit, is the offspring fertile? In the exam, name the one the scenario describes.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>"Can mate" is not the same as "same species". Two species may mate and produce offspring, but if the offspring are sterile, the two groups remain separate species.</p></div>
${keyterms([['species','can interbreed to produce fertile offspring'],['reproductive isolation','barriers to breeding between species'],['temporal isolation','breeding at different times'],['behavioural isolation','courtship signals not recognised'],['mechanical isolation','parts do not fit'],['hybrid sterility','offspring of two species are sterile']])}
`},
  reteach:{ h:'Five questions that name the barrier', b:`
<p>Recall from level 1: a species is one kind of population, and new species arise when populations change, as in natural selection (level 5). Here is how to tell which barrier keeps two species apart.</p>
<p>Instead of memorising a list, ask six questions, in order. The first <b>no</b> (or the first problem) points to the barrier. Several barriers can act together, so in the exam name the one the scenario describes.</p>
${chain([
 '<b>Do the two groups ever meet?</b> If no, the barrier is geographic.',
 '<b>Do they breed at the same time?</b> If no, the barrier is temporal.',
 '<b>Does courtship work?</b> If the signals are not recognised, the barrier is behavioural.',
 '<b>Do the bodies or flowers fit?</b> If not, the barrier is mechanical.',
 '<b>Are the offspring fertile?</b> If not, the barrier is hybrid sterility.',
 '<b>So are they one species?</b> If the offspring are sterile, the parents are separate species, even though they mated.'
])}
<div class="worked"><span class="lbl">Worked example: run the questions</span>
<div class="step-line">Two lizard species live on two islands separated by 40 km of open sea. Neither can cross it.</div>
<div class="step-line">Q1: do the two groups ever meet? No, so the first question already fails.</div>
<div class="step-line ans">The barrier is geographic isolation, and the later questions are never reached.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>The questions go from "never meet" to "offspring cannot reproduce". Stop at the first one that fails, and name the barrier the scenario describes.</p></div>
`},
  qs:[
{type:'mc', stem:`Which statement correctly defines a <b>species</b>?`, opts:[`A group of organisms that can interbreed and produce fertile offspring`,`A group of organisms that look alike and live in the same place`,`A group of organisms that can mate and produce offspring that are sterile`,`A group of organisms that share the same habitat and feed on the same food`], ans:0,
 hint:'The offspring must be able to breed too.',
 sol:`<div class="step-line">A species is a group that can interbreed to produce fertile offspring.</div><div class="step-line">Looking alike or living together does not make a species. Producing only sterile offspring means the parents are different species.</div><div class="step-line ans">Answer: a group of organisms that can interbreed and produce fertile offspring</div>`},
{type:'text', stem:`Two species of cricket live in the same meadow. One species sings and mates at dusk. The other species sings and mates at midnight, so the two never mate with each other. This is an example of ______ isolation.`, ans:'temporal', anyCase:true, accept:['temporal isolation','temporal reproductive isolation','temporal barrier','temporal.'], ph:'one word',
 hint:'The groups are kept apart by when they breed, not where or how.',
 sol:`<div class="step-line">The two species live in the same place and use calls, so the barrier is not geographic.</div><div class="step-line">They breed at different times of the day (dusk and midnight), so they never mate with each other. A difference in timing is temporal isolation.</div><div class="step-line ans">Answer: temporal</div>`},
{type:'text', stem:`Two species of snail have shells that coil in opposite directions, so their reproductive openings do not line up and they cannot mate. This is an example of ______ isolation.`, ans:'mechanical', anyCase:true, accept:['mechanical isolation','mechanical reproductive isolation','mechanical barrier'], ph:'one word',
 hint:'It is about the shape and fit of body parts.',
 sol:`<div class="step-line">The two species live together and may be ready to mate, but their bodies do not fit together, so mating cannot take place.</div><div class="step-line">A difference in the shape or fit of body parts is mechanical isolation. It is not about place, timing, courtship signals or sterile offspring.</div><div class="step-line ans">Answer: mechanical</div>`},
{type:'mc', stem:`A horse and a donkey can mate and produce a mule. Mules are almost always sterile. Which statement is correct?`, opts:[`Horses and donkeys are separate species, because their hybrid offspring are sterile`,`Horses and donkeys are one species, because they are able to mate with each other freely`,`Horses and donkeys are separate species, because mules look different from both`,`Horses and donkeys are one species, because they live in the same places`], ans:0,
 hint:'Remember the word fertile in the definition.',
 sol:`<div class="step-line">The mule is sterile, so horse and donkey cannot interbreed to produce fertile offspring. By definition they are separate species.</div><div class="step-line">Being able to mate, or living in the same place, does not make one species. Looking different from the parents is not the test either.</div><div class="step-line ans">Answer: horses and donkeys are separate species, because their hybrid offspring are sterile</div>`},
{type:'mc', stem:`A researcher played recordings of male calls of two frog species, X and Y, to female frogs of species X, and recorded their responses.
<br><b>Illustrative data from a researcher's experiment.</b> What do the data show?`, v:vis(barChart({title:'Response of 50 species X females', cats:['Moved to call X','Moved to call Y','No response'], series:[{name:'Females', vals:[46,2,2]}], yLabel:'number of females', w:360, h:200}), 'Females could choose between the two recorded calls.'), opts:[`Behavioural isolation, because females of X nearly always move towards the call of their own species`,`Mechanical isolation, because 92% of the females were able to move towards one of the two recorded calls`,`Temporal isolation, because the experiment was done on the females at only one time of the year`,`Hybrid sterility, because 4% of the females did not respond to either of the two recorded calls`], ans:0,
 hint:'What is the signal, and who recognises it?',
 sol:`<div class="step-line">46 of 50 females (92%) moved towards the call of their own species and only 2 towards the call of Y.</div><div class="step-line">The females recognise the call of their own species, so the courtship signal keeps the species apart: behavioural isolation.</div><div class="step-line">The experiment did not test body fit, timing or the fertility of offspring, so the other options are not supported by the data.</div><div class="step-line ans">Answer: behavioural isolation, because females of X nearly always move towards the call of their own species</div>`}
]},

{ id:11, name:'Allopatric speciation', short:'Allopatric speciation',
  teach:{ h:'A barrier splits one population into two species', b:`
<p><b>Allopatric</b> speciation means "in different places". A population is split by a <b>geographic barrier</b> (a sea, river or mountain). The two parts cannot interbreed, so each evolves on its own until they are different species.</p>
${chain([
 'One population of forest mice lives on a coastal plain and interbreeds freely.',
 'The sea level rises. A geographic barrier splits the population in two: one group is on an island and the other is on the mainland.',
 'There is <b>no gene flow</b> between the groups.',
 'Each group faces different selective pressures, and different mutations arise in each.',
 'Natural selection makes the groups genotypically and phenotypically different.',
 'Even if the barrier disappears they cannot interbreed to produce fertile offspring: <b>two species</b>.'
])}
<div class="worked"><span class="lbl">Worked example: mark a weak answer</span>
<div class="step-line">A learner wrote: "The sea split the mice. They changed and became different species." Mark it out of 5 against the list.</div>
<div class="step-line">Barrier named (sea): 1 mark. The two groups stopped exchanging alleles: missing. Different selective pressures and mutations: missing. Genetically and phenotypically different: not stated. Cannot interbreed if reunited: missing.</div>
<div class="step-line ans">The answer scores 1 out of 5. It names the barrier and nothing else.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Include five things: the barrier, no gene flow, different selective pressures (and mutations), the populations becoming different, and that they can no longer interbreed.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>The barrier does not make a new species by itself. Speciation is complete only when the populations are <b>reproductively isolated</b>, even if the barrier is removed.</p></div>
${keyterms([['allopatric speciation','speciation after a geographic barrier'],['geographic barrier','sea, river or mountain that separates a population'],['gene flow','movement of alleles between populations by interbreeding'],['selective pressure','environmental factor favouring some traits'],['reproductive isolation','populations can no longer interbreed successfully']])}
`},
  reteach:{ h:'A river, a mole rat and a mark checklist', b:`
<p>Here is a full-mark answer, with the mark for each sentence shown on the right. Notice that each sentence earns its mark by naming something in the scenario.</p>
<p><b>Imagine:</b> a population of blind mole rats that dig tunnels along both banks of a river. The river changes course and widens. The mole rats cannot swim across. Explain how two species could arise (5 marks).</p>
${contrast('Model answer','Mark',[
 ['The widening river formed a geographic barrier that split the population into two groups.','1'],
 ['There was no gene flow between the groups, as they could not interbreed.','1'],
 ['Each side had different soil and food, so different selective pressures acted, and different mutations arose.','1'],
 ['Over many generations each group became genotypically and phenotypically different.','1'],
 ['The groups could no longer interbreed to produce fertile offspring even if reunited: they were two species.','1']
])}
<div class="worked"><span class="lbl">Worked example: find the five names</span>
<div class="step-line">Barrier: the river. Selective pressure: different soil and food on each bank.</div>
<div class="step-line">The two things that students forget: the groups stopped exchanging alleles, and they would stay separate even without the river.</div>
<div class="step-line ans">Take each of the five marks from a sentence that names something in the scenario.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>When the question names a barrier, use its name in sentence 1. When it names the habitats, use them in sentence 3.</p></div>
`},
  qs:[
{type:'order', stem:`A population of freshwater fish lives in one large lake. A long drought splits the lake into two separate lakes. Put the steps that follow in the correct order.`, items:[
 `Each population becomes genotypically and phenotypically different from the other.`,
 `The two populations experience different selective pressures, and different mutations arise in each.`,
 `The two populations are separated by a geographic barrier, so there is no gene flow between them.`,
 `If the lakes join again, the fish cannot interbreed to produce fertile offspring and there are two species.`], ans:[3,2,1,4], ph:'', hint:'Which step has to come first for the other steps to happen?',
 sol:`<div class="step-line">1. The drought splits the lake: a geographic barrier, so no gene flow.</div><div class="step-line">2. Different selective pressures and different mutations act in each lake.</div><div class="step-line">3. The two populations become genotypically and phenotypically different.</div><div class="step-line ans">4. If the lakes join again they cannot interbreed to produce fertile offspring: two species.</div>`},
{type:'mc', stem:`The word <b>allopatric</b> in allopatric speciation refers to speciation that occurs:`, opts:[`in different places, after the population is split by a geographic barrier`,`in the same place, without any barrier between the groups of the population`,`at different times, when the groups breed in different seasons of the year`,`at the same time, when many new species form from one ancestor quickly`], ans:0,
 hint:'Allo means other or different.',
 sol:`<div class="step-line">Allopatric means in different places: a barrier separates the populations.</div><div class="step-line">The option about the same place without a barrier describes sympatric speciation. The option about different breeding seasons describes temporal isolation. The option about many new species from one ancestor describes rapid adaptive radiation.</div><div class="step-line ans">Answer: in different places, after the population is split by a geographic barrier</div>`},
{type:'text', stem:`A mountain range splits a population of lizards. The movement of alleles between the two groups through interbreeding stops. Name this movement of alleles.`, ans:'gene flow', anyCase:true, accept:['geneflow','flow of genes','flow of alleles','allele flow','gene-flow','gene flow between populations','genetic exchange'], ph:'two words',
 hint:'Genes flow between populations that interbreed.',
 sol:`<div class="step-line">The movement of alleles from one population to another through interbreeding is gene flow.</div><div class="step-line">A geographic barrier stops gene flow, and so allows the populations to diverge.</div><div class="step-line ans">Answer: gene flow</div>`},
{type:'mc', stem:`Two populations of a beetle were separated by a river for many generations. Which observation would show that <b>speciation has been completed</b>?`, opts:[`When the populations are brought together they cannot breed to produce fertile offspring`,`The two populations look slightly different from each other in body colour and size`,`The two populations feed on different plants on either side of the river in their separate areas`,`The river has been present for more than ten thousand years between the two populations`], ans:0,
 hint:'Reproductive isolation is the test of a species.',
 sol:`<div class="step-line">Speciation is complete when the populations can no longer interbreed to produce fertile offspring, even when they meet again.</div><div class="step-line">Differences in appearance, diet and the age of the barrier may all be present, but varieties within one species can show these too.</div><div class="step-line ans">Answer: when the populations are brought together they cannot breed to produce fertile offspring</div>`},
{type:'mc', stem:`Two populations of a ground squirrel live on opposite sides of a deep canyon. The squirrels cannot cross it. The north side is cool and wet and the south side is hot and dry. After many generations the squirrels from the two sides will not interbreed. <b>Explain</b> how this came about (4 marks). Which answer earns full marks?`, opts:[`The canyon stopped gene flow; different selective pressures and mutations on each side made the groups different, until they could no longer interbreed`,`The canyon caused the squirrels to change to suit the conditions on each side, and the changes were inherited until they could no longer interbreed at all`,`The squirrels on the hot side needed a thicker coat, so they changed during their lives, and this made them unable to breed with the others`,`The canyon made the two groups different species at once, because the cool side and the hot side of the canyon have different species of plants`], ans:0,
 hint:'Barrier, no gene flow, different pressures, different populations, cannot interbreed.',
 sol:`<div class="step-line">1. The canyon is a geographic barrier, so there is no gene flow.</div><div class="step-line">2. Different selective pressures (cool and wet versus hot and dry) and different mutations act on each side.</div><div class="step-line">3. The populations become genotypically and phenotypically different.</div><div class="step-line">4. They can no longer interbreed to produce fertile offspring: two species.</div><div class="step-line">The options about the canyon causing the squirrels to change, and about needing a thicker coat, are Lamarckian (change during life that is inherited, or because of need). The option about the groups becoming different species at once is wrong because a species does not form instantly, only after many generations.</div><div class="step-line ans">Answer: the canyon stopped gene flow; different selective pressures and mutations on each side made the groups different, until they could no longer interbreed</div>`}
]},

{ id:12, name:'Sympatric speciation and the founder effect', short:'Sympatric, founder, drift',
  teach:{ h:'Chance can change a small population, and no barrier is needed', b:`
<p>Not all change is selection by the environment. In <b>small populations</b> chance matters. This level covers three ideas about small groups and speciation without a barrier.</p>
${cards([
 {t:'Sympatric speciation', d:'A new species forms in the same area, with no geographic barrier. Examples: a plant doubles its chromosome number (polyploidy) and cannot breed with its parent species; apple maggot flies switched to a new host plant.'},
 {t:'Founder effect', d:'A few individuals start a new population. They carry only some of the alleles of the source population, so allele frequencies differ by chance. Example: porphyria is common among Afrikaners, who descend from a few early settlers.', hi:true},
 {t:'Bottleneck and genetic drift', d:'A population crash leaves a few survivors with only some alleles. Random change of allele frequency in a small population is genetic drift. Example: cheetahs show very low genetic diversity.'}
],{min:200})}
${vis(barChart({title:'Carriers of a rare allele (%)', cats:['Source population','New colony'], series:[{name:'Carriers', vals:[2,20]}], yLabel:'% carriers', max:25, w:330, h:190}), 'Illustrative values: the same allele is much more common in the colony, by chance.')}
<div class="worked"><span class="lbl">Worked example: a calculation</span>
<div class="step-line">In a source population, 2 of every 100 individuals carry a rare allele: 2%.</div>
<div class="step-line">A group of 10 individuals founds a colony. By chance 2 of the 10 carry the allele: 2 ÷ 10 × 100 = 20%.</div>
<div class="step-line ans">The colony has 20 ÷ 2 = 10 times as many carriers as the source population, with no selection involved.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Chance, not selection, explains the change when the group is small and the allele does not give an advantage. Smaller groups swing further from the source.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Founder effect and natural selection are not the same. In natural selection the favourable allele wins. In the founder effect an allele can become common <b>just by chance</b>, even if it is harmful.</p></div>
${keyterms([['sympatric speciation','new species without a geographic barrier'],['polyploidy','a doubling of the chromosome number'],['founder effect','a small group starts a new population'],['genetic drift','chance change in allele frequency'],['bottleneck','a sharp fall in population size'],['genetic diversity','the range of alleles in a population']])}
`},
  reteach:{ h:'Beads in a jar: chance in small samples', b:`
<p>Picture a big jar holding <b>50 red and 50 blue beads</b>. The colours are not better or worse. Now take a small handful of 4 beads without looking and start a new jar from them.</p>
<p>You might draw 2 red and 2 blue. But you might equally draw 3 red and 1 blue, or even 4 blue. A small handful is a poor copy of the big jar. A big handful, such as 40 beads, would be a much better copy.</p>
${contrast('Natural selection','Genetic drift (chance)',[
 ['Cause: an environmental pressure favours some alleles','Cause: random sampling of alleles'],
 ['Works in populations of any size','Strongest in small populations'],
 ['Allele becomes common because it helps survival','Allele may become common even if it gives no advantage'],
 ['Result: better adapted to the environment','Result: lower genetic diversity, not necessarily better adapted']
])}
<div class="worked"><span class="lbl">Worked example: bead counts</span>
<div class="step-line">Take 4 beads and get 3 red and 1 blue. Red in the big jar: 50 ÷ 100 × 100 = 50%.</div>
<div class="step-line">Red in the new jar: 3 ÷ 4 × 100 = 75%.</div>
<div class="step-line ans">The new jar has 75% red and the old jar has 50%. No bead was better. The difference is only chance in a small sample.</div></div>
<p>The same idea explains a <b>bottleneck</b>: tip most of the beads out of the jar and keep only a handful. The handful is the survivors, and it can differ from the original mix by chance.</p>
<div class="callout"><span class="lbl">Rule</span><p>Small group, big swing. If the question says "a few individuals" or "a small number", think chance, not selection.</p></div>
`},
  qs:[
{type:'mc', stem:`Which situation is an example of <b>sympatric</b> speciation?`, opts:[`A plant doubles its chromosome number and cannot breed with its parent species in the same field`,`A river splits a fish population in two, and the two groups become separate species over time`,`A few settlers colonise an island, and the colony differs by chance from the mainland population`,`A drought kills most of a population and only a few individuals survive to breed again later`], ans:0,
 hint:'Sympatric means same place: no barrier.',
 sol:`<div class="step-line">Sympatric speciation happens in the same area. A polyploid plant is reproductively isolated from its parent species while growing right next to it.</div><div class="step-line">The river is a barrier, so that is allopatric. The settlers are an example of the founder effect, and the drought is a bottleneck.</div><div class="step-line ans">Answer: a plant doubles its chromosome number and cannot breed with its parent species in the same field</div>`},
{type:'text', stem:`When a small group of individuals starts a new population, its allele frequencies may differ from the source population purely by chance. Name this effect.`, ans:'founder effect', anyCase:true, accept:['the founder effect','founder','founder principle','founder event','founder effects','founders effect','founder\'s effect'], ph:'two words',
 hint:'The individuals who found the new colony are called founders.',
 sol:`<div class="step-line">The small group that starts a new population is the founders. Their alleles are only a sample of those in the source population.</div><div class="step-line ans">Answer: founder effect</div>`},
{type:'num', stem:`A source population carries a rare allele in 4% of individuals. A group of 12 individuals founds a new population, and 3 of them carry the allele. What percentage of the founders carry the allele? Give the answer as a whole number.`, ans:25, unit:'%', ph:'e.g. 10',
 hint:'Divide the carriers by the total number of founders, then multiply by 100.',
 sol:`<div class="step-line">Carriers in the founders: 3 out of 12.</div><div class="step-line">3 ÷ 12 × 100 = 25%.</div><div class="step-line">The founders have 25% carriers, compared with 4% in the source: about six times as many, by chance.</div><div class="step-line ans">Answer: 25%</div>`},
{type:'mc', stem:`Northern elephant seals were hunted to fewer than 100 individuals in the 1890s. Today the population is large, but it has very low genetic diversity. Which term describes the event that caused this?`, opts:[`A bottleneck, in which a few survivors carried only some of the alleles`,`Adaptive radiation, in which one ancestor gave rise to many species`,`Gene flow, in which alleles moved between separate populations`,`Artificial selection, in which breeders chose the seals with the best traits`], ans:0,
 hint:'Think of a bottle neck: only a few get through.',
 sol:`<div class="step-line">A sharp fall in population size leaves a few survivors with only some of the alleles. This is a bottleneck, and it lowers genetic diversity even when the population later grows large again.</div><div class="step-line">Adaptive radiation produces many species. Gene flow would add alleles, not remove them. Artificial selection needs human breeders.</div><div class="step-line ans">Answer: a bottleneck, in which a few survivors carried only some of the alleles</div>`},
{type:'mc', stem:`A few seeds of a plant species reached a remote island from the mainland. A researcher compared the frequency of allele <b>R</b> in the mainland and the island populations.
<br><b>Illustrative data.</b> Tests showed that R makes no difference to survival or seed production in either habitat. Which explanation is best?`, v:vis(dataTable(['Population','Plants','Frequency of allele R'],[['Mainland','about 5\u202f000','0,80'],['Island, 20 generations later','about 900','0,30']],{w:420}), 'Frequency of R in the two populations (illustrative data).'), opts:[`Founder effect: the few founding seeds carried, by chance, a lower frequency of R than the mainland`,`Natural selection: the island conditions favoured the plants that carried the allele R, so it spread`,`Gene flow: seeds carrying R kept on arriving from the mainland every year, so R became rare`,`Mutation: every plant on the island changed from R to the other allele at once, in one season`], ans:0,
 hint:'If the allele does not affect survival, what else can change its frequency?',
 sol:`<div class="step-line">1. The tests show that R gives no advantage, so natural selection cannot explain the change.</div><div class="step-line">2. A few seeds founded the island population, and their alleles were only a small sample of the mainland alleles. R was less common among them by chance.</div><div class="step-line">3. The frequency stayed low because the island population is small, and a small population changes by chance (drift).</div><div class="step-line">Gene flow from the mainland would raise R towards 0,80, not lower it. A mutation does not change every plant at once.</div><div class="step-line ans">Answer: founder effect: the few founding seeds carried, by chance, a lower frequency of R than the mainland</div>`}
]},

{ id:13, name:'Evolution in present times: resistance', short:'Resistance evolving now',
  teach:{ h:'Resistance is natural selection happening today', b:`
<p>Evolution is not only in the past. Whenever humans use a poison that kills most of a population, the few that survive can pass on their resistance. You explain every case with the <b>same six steps</b>.</p>
${cards([
 {t:'Antibiotics', d:'Resistant bacteria such as MRSA and drug-resistant TB bacteria.'},
 {t:'Insecticides', d:'Mosquitoes that survive the spray, including mosquitoes that carry malaria.'},
 {t:'Herbicides', d:'Weeds that survive the weedkiller used on crops.'},
 {t:'HIV drugs', d:'HIV strains with resistance alleles spread when treatment is taken irregularly.'}
],{min:150})}
${vis(lineChart({title:'Resistant mosquitoes (%)', xs:['Start','1','2','3','4'], series:[{name:'Resistant', vals:[1,4,16,52,88]}], yLabel:'% of population', w:350, h:200}), 'Data from a class simulation: percentage of resistant mosquitoes after each insecticide spraying season (1 to 4).')}
<div class="worked"><span class="lbl">Worked example: model answer (6 marks)</span>
<div class="step-line">Explain how mosquitoes became resistant to an insecticide sprayed on house walls.</div>
<div class="step-line">1. There was variation: a few mosquitoes carried an allele (from an earlier mutation) that made them resistant.</div>
<div class="step-line">2. The insecticide was the selective pressure.</div>
<div class="step-line">3. Resistant mosquitoes survived and reproduced.</div>
<div class="step-line">4. Non-resistant mosquitoes were killed before they could reproduce.</div>
<div class="step-line">5. The resistance allele was passed on to the offspring.</div>
<div class="step-line ans">6. Over many generations the proportion of resistant mosquitoes in the population increased.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>The resistance allele is already present in a few individuals, from a random mutation that the poison did not cause. The poison only selects the individuals that already have it.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Never write "the bacteria became immune" or "the insects got used to it". Resistance is an allele that the survivors already carried. The population changes, not the individuals.</p></div>
${keyterms([['resistance','ability to survive a poison or drug because of an allele'],['antibiotic','a drug that kills bacteria'],['insecticide','a poison that kills insects'],['selective pressure','the poison, drug or other factor selecting survivors'],['mutation','a random change that can make a resistance allele'],['MRSA','methicillin-resistant <i>Staphylococcus aureus</i>, a resistant bacterium']])}
`},
  reteach:{ h:'Wrong sentence, corrected sentence', b:`
<p>Most marks are lost by a few false phrases. Read each wrong sentence, then the version that earns the mark.</p>
${contrast('Wrong sentence','Corrected sentence',[
 ['The bacteria learned to resist the antibiotic.','Some bacteria already carried a resistance allele, so they survived and reproduced.'],
 ['The antibiotic made the bacteria mutate.','The resistance allele was already present from a random mutation. The antibiotic did not cause it, it selected the resistant bacteria.'],
 ['The bacteria became immune.','Bacteria are not immune: the survivors have a resistance allele.'],
 ['Each bacterium became more resistant with time.','The proportion of resistant bacteria in the population increased.'],
 ['Resistance developed because the drug was overused.','Overuse increased the selective pressure, so resistant bacteria spread faster. Overuse did not create the allele.']
])}
<div class="worked"><span class="lbl">Worked example: correct a paragraph</span>
<div class="step-line">Wrong: "The MRSA bacteria in the ward adapted to resist the antibiotic so they survived."</div>
<div class="step-line">Problem 1: "adapted to resist" says the bacteria changed in their lives. Replace it with "some bacteria already carried an allele for resistance".</div>
<div class="step-line">Problem 2: "they survived" does not say who or what happens next. Add that the resistant bacteria reproduced and passed on the allele.</div>
<div class="step-line ans">Corrected: "Some MRSA bacteria already carried a resistance allele. They survived the antibiotic, reproduced and passed on the allele, so resistant bacteria became more common."</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Before you write "learned", "adapted", "became" or "immune" about individuals, stop. Use "already carried", "survived", "passed on" and "proportion increased".</p></div>
<p>The order to write the steps in: variation, selective pressure, survivors, non-survivors, allele passed on, proportion increases.</p>
`},
  qs:[
{type:'mc', stem:`Which statement <b>correctly</b> explains how a population of bacteria became resistant to an antibiotic?`, opts:[`Some bacteria already had a resistance allele, so they survived, reproduced and passed it on`,`The bacteria were exposed to the antibiotic and learned how to survive it over a period of time`,`The antibiotic caused a mutation in each bacterium that made it resistant to the drug`,`The bacteria became immune to the antibiotic in the way that a person becomes immune`], ans:0,
 hint:'Resistance is already in the population before the drug is used.',
 sol:`<div class="step-line">The resistance allele (from a random mutation) was already present in a few bacteria.</div><div class="step-line">The antibiotic killed the non-resistant bacteria. The resistant ones survived, reproduced and passed on the allele.</div><div class="step-line">Bacteria do not learn. The antibiotic does not cause the mutation, it selects it. Immunity belongs to the immune system of larger organisms.</div><div class="step-line ans">Answer: some bacteria already had a resistance allele, so they survived, reproduced and passed it on</div>`},
{type:'order', stem:`Put these steps in the correct order to explain how weeds in a maize field became resistant to a herbicide.`, items:[
 `The resistance allele is passed on to the seeds of the surviving weeds.`,
 `The farmer sprays the field with the herbicide, which acts as the selective pressure.`,
 `In a population of weeds, some plants carry a resistance allele that arose by mutation.`,
 `After many seasons most of the weeds in the field are resistant.`,
 `Resistant weeds survive and produce seeds, while non-resistant weeds are killed before they can reproduce.`], ans:[4,2,1,5,3], ph:'', hint:'Which step has to come first for natural selection to have anything to work on?',
 sol:`<div class="step-line">1. Variation: some weeds carry a resistance allele.</div><div class="step-line">2. The herbicide is the selective pressure.</div><div class="step-line">3. The resistant weeds survive and produce seeds, while the non-resistant weeds are killed before reproducing.</div><div class="step-line">4. The resistance allele is passed to the seeds.</div><div class="step-line ans">5. After many seasons most of the weeds are resistant.</div>`},
{type:'mc', stem:`Doctors tell patients to finish the whole course of antibiotic tablets, even if they feel better. What is the <b>best</b> reason?`, opts:[`Stopping early may leave the more resistant bacteria alive, and they multiply and pass on the allele`,`Taking tablets for longer makes the immune system of the patient stronger against all of the bacteria`,`The tablets teach the surviving bacteria to stay away from the cells of the body of the patient`,`Bacteria that survive a short course become immune and cannot be killed by later courses`], ans:0,
 hint:'Think about which bacteria are the last to be killed.',
 sol:`<div class="step-line">The bacteria that are least affected by the drug are the last to die. If the course stops early, those survivors multiply and pass on their alleles, so resistant bacteria become more common.</div><div class="step-line">Tablets do not strengthen the immune system. Bacteria do not learn or become immune. The survivors are favoured by selection.</div><div class="step-line ans">Answer: stopping early may leave the more resistant bacteria alive, and they multiply and pass on the allele</div>`},
{type:'text', stem:`The proportion of resistant bacteria in a population increases over many generations, because the resistant bacteria survive and reproduce more than the others. Which process of evolution is this?`, ans:'natural selection', anyCase:true, accept:['natural selection.','selection','natural selections','the natural selection','selection by the environment','survival of the fittest','darwinian selection','evolution by natural selection'], ph:'two words',
 hint:'Survivors with a favourable allele pass it on. It is the process Darwin described.',
 sol:`<div class="step-line">Resistant bacteria are favoured by the antibiotic (the selective pressure), so they survive, reproduce and pass on the allele.</div><div class="step-line">A population changing because the favourable alleles become more common is natural selection.</div><div class="step-line ans">Answer: natural selection</div>`},
{type:'mc', stem:`A hospital recorded the percentage of bacterial samples that were resistant to antibiotic X in four different years.
<br><b>Illustrative data from a hospital survey.</b> Which interpretation of the data is correct?`, v:vis(barChart({title:'Samples resistant to antibiotic X (%)', cats:['2016','2018','2020','2022'], series:[{name:'Resistant', vals:[6,14,27,48]}], yLabel:'% of samples', w:360, h:200}), 'Illustrative data from a hospital survey.'), opts:[`Antibiotic X selected for resistant bacteria, which reproduced, so the proportion rose from 6% to 48%`,`Each bacterium became more resistant every year, so by 2022 each one was 48% resistant to antibiotic X`,`The bacteria learned to resist antibiotic X, so the resistance only began to appear after the year 2020`,`Antibiotic X caused a mutation in 48% of the bacterial samples during the year 2022 in the hospital`], ans:0,
 hint:'The data show a proportion of the population, not a change in each bacterium.',
 sol:`<div class="step-line">The percentage of resistant samples rose in each period: 6, 14, 27, 48. The rise from 2016 to 2022 is 48 minus 6 = 42 percentage points, and 48 ÷ 6 = 8 times as many.</div><div class="step-line">Resistant bacteria already existed in 2016 (6%). Antibiotic X killed the non-resistant ones, so the resistant bacteria survived, reproduced and passed on the allele. The proportion of the population increased each year.</div><div class="step-line">The data are for a proportion of samples, not for the resistance of one bacterium. Resistance was present from 2016, so it did not first appear after 2020, and antibiotics select mutations; they do not cause them.</div><div class="step-line ans">Answer: antibiotic X selected for resistant bacteria, which reproduced, so the proportion rose from 6% to 48%</div>`}
]},

{ id:14, name:'Reading cladograms', short:'Cladograms',
  teach:{ h:'A cladogram shows who shares a recent common ancestor', b:`
<p>A <b>cladogram</b> is a branching diagram of relationships. Each <b>branching point (node)</b> is a <b>common ancestor</b> of everything above it on that branch. The more recently two organisms share a node, the more closely related they are.</p>
${vis(cladogram(['Shark',['Frog',['Lizard',['Mouse','Human']]]],{nodes:['A','B','C','D'], hi:['Mouse','Human']}), 'Node D is the most recent common ancestor of mouse and human.')}
${contrast3(['Node','Common ancestor of','Characteristic shared by this group'],[
 ['A','all five animals','Jaws and a vertebral column (the tree has no outgroup, so this is what all five share)'],
 ['B','frog, lizard, mouse, human','Four limbs'],
 ['C','lizard, mouse, human','Amniotic egg'],
 ['D','mouse, human','Hair and mammary glands']
])}
<div class="worked"><span class="lbl">Worked example: who is closer to a human?</span>
<div class="step-line">Is the frog or the shark more closely related to the human?</div>
<div class="step-line">Start at Human and trace back to the first node that the frog is on. Mouse joins at D, lizard joins at C and frog joins at B.</div>
<div class="step-line">Trace back further to find the shark: the shark does not join until A, the root.</div>
<div class="step-line ans">B is more recent than A, so the frog is more closely related to the human than the shark is.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Trace each organism back to the <b>nearest node it shares</b> with the target. The more recent that node, the closer the relationship.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>The <b>order</b> of the tips on the page means nothing. Any branch can be swung round its node without changing the relationships. Only the branching pattern counts.</p></div>
${keyterms([['cladogram','a diagram of relationships by branching'],['node','a branching point, the common ancestor of a branch'],['common ancestor','the species that two groups descend from'],['most recent common ancestor','the nearest shared node'],['derived characteristic','a feature that first evolved in a group'],['tip','an organism at the end of a branch']])}
`},
  reteach:{ h:'A family tree, and building a tree from a table', b:`
<p>Recall from levels 7 and 8: related species share a common ancestor, and homologous structures are the evidence for it. A cladogram draws those shared ancestors as nodes.</p>
<p>Method 1: think of a <b>family tree</b>. Two sisters share their parents (a very recent ancestor). Cousins share their grandparents (an older ancestor). The nearer the shared ancestor, the closer the relatives.</p>
${vis(cladogram(['Moss',['Fern',['Pine','Maize']]],{nodes:['W','X','Y'], hi:['Pine','Maize']}), 'Pine and maize join at node Y, the newest node. Fern joins them at X. Moss joins at W.')}
<p>Method 2: <b>build the tree from a trait table</b>. A trait shared by only some of the organisms marks a group that branches together. The organism with the fewest traits branches off first.</p>
${dataTable(['Organism','Vascular tissue','Seeds','Flowers'],[['Moss','no','no','no'],['Fern','yes','no','no'],['Pine','yes','yes','no'],['Maize','yes','yes','yes']],{w:400})}
<div class="worked"><span class="lbl">Worked example: build it</span>
<div class="step-line">Moss has none of the traits, so it branches off first.</div>
<div class="step-line">Fern is the next to branch. It has vascular tissue only.</div>
<div class="step-line">Pine and maize share seeds. They branch last, as a pair. Maize also has flowers, which does not change who it pairs with.</div>
<div class="step-line ans">Tree: moss, then fern, then the pair pine and maize.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>A trait shared by a group puts that group on one branch. Fewest traits means the earliest branch.</p></div>
`},
  qs:[
{type:'mc', stem:`Use the cladogram to choose the correct statement.`, v:vis(cladogram(['Lancelet',['Salamander',['Crocodile',['Pigeon','Duck']]]],{nodes:['A','B','C','D'], hi:['Crocodile']}), 'Cladogram of five animals.'), opts:[`The pigeon and the duck are equally closely related to the crocodile`,`The salamander is more closely related to the crocodile than the duck is`,`The pigeon is more closely related to the crocodile than the duck is`,`The lancelet is more closely related to the crocodile than the pigeon is`], ans:0,
 hint:'Trace the pigeon and the duck back to the first node they share with the crocodile.',
 sol:`<div class="step-line">The pigeon and the duck join each other at D, and then both join the crocodile at C. So they share exactly the same node with the crocodile.</div><div class="step-line">The salamander joins at B, which is older than C, so it is more distant than the duck. The lancelet joins at A, the oldest node, so it is the most distant.</div><div class="step-line">The pigeon is only drawn higher on the page. The order of the tips does not matter.</div><div class="step-line ans">Answer: the pigeon and the duck are equally closely related to the crocodile</div>`},
{type:'text', stem:`A four-chambered heart is found in the crocodile, the pigeon and the duck, and in no other animal on the cladogram. At which node (A, B, C or D) did this feature first evolve?`, v:vis(cladogram(['Lancelet',['Salamander',['Crocodile',['Pigeon','Duck']]]],{nodes:['A','B','C','D'], hi:['Crocodile','Pigeon','Duck']}), 'The same cladogram.'), ans:'C', anyCase:true, accept:['node C','Node C','node c','c.'], ph:'one letter',
 hint:'Find the node that is the common ancestor of the crocodile, the pigeon and the duck, and of no other animal.',
