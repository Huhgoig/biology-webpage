  {type:'num', stem:`A learner timed how long a seed took to germinate in three repeats: 7,5 days, 8,0 days and 6,5 days. Calculate the <b>mean</b> time, correct to <b>one decimal place</b>.`, ans:7.3, unit:'days',
   hint:`Add the readings, then divide by 3.`,
   sol:sksol(['Sum = 7,5 + 8,0 + 6,5 = 22,0.','Mean = 22,0 &divide; 3 = 7,333...','To one decimal place: 7,3.'],'Answer: 7,3')},
  {type:'num', stem:`A balance gives a mass of 0,04567 g. Write this mass to <b>two significant figures</b>.`, ans:0.046, unit:'g',
   hint:`Count from the first non-zero digit, then look at the next digit.`,
   sol:sksol(['The first non-zero digit is 4. Two significant figures are 4 and 5.','The next digit is 6, which is 5 or more, so the 5 rounds up to 6.','0,04567 becomes 0,046.'],'Answer: 0,046')},
  {type:'mc', stem:`A learner investigated how the distance of a lamp from pondweed affects the number of bubbles it gives off. Her table is shown. Which list gives <b>all</b> the design errors in it?`,
   v:vis(`<p style="text-align:center;margin:6px 0 0"><b>Table 1: The effect of lamp distance on the number of bubbles released per minute</b></p>` + dataTable(['Trial 1 (bubbles per minute)','Trial 2 (bubbles per minute)','Trial 3 (bubbles per minute)','Distance of lamp'],[['32','31','34','10 cm'],['21','19','20','20 cm'],['11','10','12','30 cm']],{w:520}), 'Data from a class investigation'),
   opts:[`The distance (independent variable) is not in the first column, the units are in the cells, and there is no mean column`,`The distance is in the first column, the table has no title, the units are in the headings and the means are missing`,`The table has no title, there is no mean column, the units are written in the headings and only two trials are shown`,`The units are in the cells, the readings are written in words, the table has no repeat trials and the heading has no title`], ans:0,
   hint:`Check where the independent variable sits, where the unit is written, and what the last column should be.`,
   sol:sksol(['The independent variable (distance of the lamp) is in the last column and should be the first.','The unit "cm" is written in every cell instead of the heading.','Three trials were recorded but there is no mean column.','The table <b>does</b> have a title, and it does have repeats, so the other lists contain mistakes that are not there.'],'Answer: The distance (independent variable) is not in the first column, the units are in the cells, and there is no mean column')}
  ] },

/* ================= LEVEL 7 ================= */
{ id:7, name:'Choosing and drawing graphs', short:'Choosing and drawing graphs',
  teach:{ h:'The type of data decides the type of graph', b:`
<p>Pick the graph from the kind of data. The independent variable goes on the <b>x-axis</b> (horizontal) and the dependent variable on the <b>y-axis</b> (vertical).</p>
${contrast3(['Graph','Use it when','Example'],[
 ['Line graph','Both variables are numbers on a scale (continuous), such as time or temperature','Height of a plant over 21 days'],
 ['Bar graph','The independent variable is a category (words) or a separate whole number; bars do not touch','Mean mass of seeds of four species'],
 ['Histogram','Continuous data grouped into class intervals; bars touch','Number of seeds in each mass class'],
 ['Pie chart','Parts of one whole, shown as percentages','Percentage of a diet made up by each food']])}
<p>In the exam your graph must carry its axis titles and units <b>on the axes themselves</b>. This chart shows only the numbers, so its axis titles are given in the caption below it.</p>
${vis(lineChart({title:'Effect of time on height of sunflowers', xs:['0','7','14','21'], series:[{name:'Height',vals:[0,18,45,80]}], max:90, step:10, yLabel:'Height (mm)', w:420, h:230}), 'Axis titles to write on your own graph: x-axis Time (days), y-axis Height (mm). Data from a class investigation.')}
${skwk([
 'Data: the height of sunflower seedlings after 0, 7, 14 and 21 days.',
 'Independent variable: time, which goes on the x-axis. Dependent variable: height, on the y-axis.',
 'Both variables are numbers on a scale, so draw a line graph.',
 'Scale: the largest height is 80 mm and the axis has 10 large squares. 80 &divide; 10 = 8, which is awkward to read, so use the next easy step, 10 mm per square.'],
 'A line graph with time (days) on the x-axis and height (mm) on the y-axis.')}
${skrule('A graph is marked on six things, worth up to 7 marks: the <b>type</b> of graph (1), a <b>title</b> that names both variables (1), <b>axes</b> labelled with units (2), an even <b>scale</b> that fills the page (1), <b>points</b> plotted accurately (1) and the <b>line</b> or bars drawn (1). Remember them as: type, title, axes, scale, points, line.')}
${sktrap('Do not join points to the origin unless (0; 0) was measured, and do not use a bar graph for data that run along a scale such as time.')}
${keyterms([['x-axis','horizontal axis: independent variable'],['y-axis','vertical axis: dependent variable'],['line graph','continuous data'],['bar graph','categories'],['histogram','grouped continuous data, bars touch'],['scale','equal steps along each axis']])}` },
  reteach:{ h:'A decision table and a marked graph', b:`
<p>Ask one question about the independent variable, then pick.</p>
${dataTable(['The independent variable is ...','Graph','Example'],[
 ['a number on a scale (time, temperature, dose)','Line graph','Temperature of a water bath (°C) every minute for ten minutes'],
 ['a category named in words','Bar graph','Number of birds counted in each of four habitats'],
 ['one variable split into class intervals','Histogram','Masses of 80 beans in classes of 0,2 g'],
 ['a share of a whole','Pie chart','How the learners at a school travel to school']],{w:600})}
<p>Now mark this learner's graph against the six checks (type, title, axes, scale, points, line):</p>
${dataTable(['What the learner did','Mark lost'],[
 ['Wrote the title "Graph 1"','Title: it does not name both variables'],
 ['Labelled the axes "Dose" and "Heart rate" with no units','Axes: units are missing'],
 ['Scale on the y-axis went 0, 5, 10, 20, 25 with equal spacing on the paper','Scale: it is not even'],
 ['Drew a line graph for the effect of dose on heart rate and plotted every point correctly','No mark lost'],
 ['Joined the points with a thick, smudged freehand line','Line: use a sharp pencil and draw a neat, clear line']],{w:600})}
${skwk([
 'The highest value to plot is 17 and the y-axis has 10 large squares. Easy steps to read are 1, 2, 5 and 10.',
 '1 unit per square reaches only 10, which is too small for 17.',
 '2 units per square reaches 20, which fits 17 and every grid line is easy to read.',
 '5 or 10 units per square would also fit but would squash the points into the bottom of the page.'],
 'Use the smallest easy step that fits all the data: 2 units per large square.')}
${keyterms([['category','a named group, such as a species'],['continuous','can take any value on a scale'],['class interval','a range, such as 150 to 159 cm']])}` },
  qs:[
  {type:'mc', stem:`A learner measured the rate of an enzyme reaction at 10, 20, 30, 40 and 50 °C. Which graph should she draw?`,
   opts:[`A line graph, because temperature is a continuous variable`,`A bar graph, because only five different temperatures were tested`,`A pie chart, because the rates make up one whole`,`A histogram, because the readings fall into classes`], ans:0,
   hint:`Is the independent variable a category or a number on a scale?`,
   sol:sksol(['Temperature is a number on a continuous scale, so the points are joined in a line graph.','A bar graph is for categories, a pie chart for parts of a whole, and a histogram for grouped frequencies.'],'Answer: A line graph, because temperature is a continuous variable')},
  {type:'text', stem:`On which axis (x or y) is the <b>independent variable</b> plotted?`, ans:'x', anyCase:true, accept:['x-axis','the x-axis','x axis','horizontal','the horizontal axis','horizontal axis'], ph:'x or y',
   hint:`Which variable does the investigator choose?`,
   sol:sksol(['The independent variable goes on the horizontal axis, the x-axis.','The dependent variable goes on the vertical axis, the y-axis.'],'Answer: x')},
  {type:'mc', stem:`The heights of 60 learners were grouped into classes: 150 to 159 cm, 160 to 169 cm, 170 to 179 cm and so on, and the number of learners in each class was counted. Which graph shows this data best?`,
   opts:[`A histogram with the bars touching`,`A bar graph with gaps between the bars`,`A line graph joining the class totals`,`A pie chart of the class totals`], ans:0,
   hint:`Height is continuous and has been grouped into class intervals.`,
   sol:sksol(['Grouped continuous data are shown on a histogram, and the bars touch because one class runs straight into the next.','A bar graph with gaps is used for categories.'],'Answer: A histogram with the bars touching')},
  {type:'mc', stem:`A learner writes a good title, labels both axes with units and plots every point correctly for the numbers on her axes, but her x-axis is marked 0, 10, 20, 40, 50 with the marks spaced equally on the paper. Which graph mark does she <b>lose</b>?`,
   opts:[`Scale: the steps along the axis are not even`,`Title: it must name both of the variables clearly`,`Axes: the axis labels must include units`,`Plotting: the points must be accurate`], ans:0,
   hint:`Look at the numbers on the axis. Are the steps equal?`,
   sol:sksol(['Equal spacing on paper must mean equal steps in value. Here 20 to 40 is a step of 20 but all the other steps are 10, so the scale is wrong.','Her title, axis labels and plotting are stated to be correct.'],'Answer: Scale: the steps along the axis are not even')},
  {type:'num', stem:`A learner must plot a line graph. The largest value is 46 and the y-axis has 10 large squares. Which is the <b>smallest</b> easy step (1, 2, 5 or 10) that lets all the data fit? Give the number of units that one large square should stand for.`, ans:5, unit:'units per square',
   hint:`Ten squares of the step must reach at least 46.`,
   sol:sksol(['10 squares of 1 unit reach only 10 and 10 squares of 2 units reach only 20. Both are too small for 46.','10 squares of 5 units reach 50, which is above 46. It fits.','10 squares of 10 units would also fit but waste space. The smallest that works is 5.'],'Answer: 5')}
  ] },

/* ================= LEVEL 8 ================= */
{ id:8, name:'Reading and describing graphs', short:'Describing graphs',
  teach:{ h:'Describe the trend and quote figures from the graph', b:`
<p>To <b>describe</b> a graph, say what the line or bars do and back it with figures and units taken from the graph. To <b>explain</b>, give the biological reason for what you described. A <b>rate of change</b> tells you how fast the dependent variable changes.</p>
${vis(lineChart({title:'Height of a seedling over ten days', xs:['0','2','4','6','8','10'], series:[{name:'Height',vals:[5,14,30,46,52,52]}], max:60, step:10, yLabel:'Height (mm)', w:440, h:230}), 'Axis titles (write them on the axes of your own graph): x-axis Time (days), y-axis Height (mm). Data from a class investigation.')}
${skwk([
 'Describe: the height rises from 14 mm at day 2 to 46 mm at day 6, and then levels off at 52 mm from day 8 to day 10.',
 'Rate of change = change in height &divide; change in time.',
 'Change in height from day 2 to day 6 = 46 minus 14 = 32 mm.',
 'Change in time = 6 minus 2 = 4 days.',
 'Rate = 32 &divide; 4 = 8 mm per day.'],
 'The average rate of growth between day 2 and day 6 is 8 mm per day.')}
${skrule('The steepest part of a line is where the rate of change is greatest. A good description has three parts: the <b>direction</b> (rises, falls, levels off), the <b>figures with units</b> ("from 14 mm to 46 mm") and the <b>period</b> ("between day 2 and day 6"). An explanation gives the biological reason.')}
${sktrap('"The graph goes up" earns no marks. Always quote figures from the graph, and give the unit.')}
${keyterms([['describe','say what happens, quoting data'],['explain','give the biological reason'],['trend','the overall direction of the data'],['rate of change','change in y divided by change in x'],['levels off','stops changing']])}` },
  reteach:{ h:'A sentence builder and the rise-over-run method', b:`
<p>Use this table of tadpole lengths and build the answer from three blocks.</p>
${vis(dataTable(['Time (days)','0','3','6','9','12'],[['Length of tadpole (mm)','4','7','15','21','22']],{w:540}), 'Data from a class investigation')}
${cards([{t:'Block 1: direction',d:'"The length <b>increases</b> ..."',hi:true},{t:'Block 2: figures',d:'"... from <b>7 mm</b> at day 3 to <b>21 mm</b> at day 9 ..."'},{t:'Block 3: period or end',d:'"... and then <b>levels off</b> at 22 mm by day 12."'}],{min:170})}
<p>Joined up: "The length increases from 7 mm at day 3 to 21 mm at day 9 and then levels off at about 22 mm by day 12."</p>
<p>For a rate, use <b>rise over run</b>. The rise is the change up the y-axis and the run is the change along the x-axis.</p>
${skwk([
 'Rate of growth between day 3 and day 9.',
 'Rise = 21 minus 7 = 14 mm. Run = 9 minus 3 = 6 days.',
 'Rate = 14 &divide; 6 = 2,333...'],
 'To two decimal places the rate is 2,33 mm per day.')}
${skwk([
 'Which interval is steepest? Rise in length for each 3 days: 0 to 3 days: 3 mm; 3 to 6 days: 8 mm; 6 to 9 days: 6 mm; 9 to 12 days: 1 mm.',
 'The biggest rise is 8 mm.'],
 'The steepest part of the line, and so the greatest rate, is from day 3 to day 6.')}
${skrule('<b>Describe</b> = what the data do, with figures. <b>Explain</b> = why they do it, with biology. Do not mix them: a description that says "because" is explaining, and an explanation with no biology is only a description.')}
${keyterms([['rise','change on the y-axis'],['run','change on the x-axis'],['rate','rise divided by run'],['unit of rate','y-unit per x-unit, such as mm per day']])}` },
  qs:[
  {type:'num', stem:`The graph shows the mean mass of tomato plants grown in a class investigation. By how many grams did the mass increase between week 2 and week 4?`, ans:18, unit:'g',
   v:vis(lineChart({title:'Mass of a tomato plant over eight weeks', xs:['0','2','4','6','8'], series:[{name:'Mass',vals:[12,20,38,56,58]}], max:60, step:10, yLabel:'Mass (g)', w:440, h:230}), 'Axis titles (write them on the axes of your own graph): x-axis Time (weeks), y-axis Mass (g). Data from a class investigation.'),
   hint:`Read the mass at week 4 and at week 2, then subtract.`,
   sol:sksol(['Mass at week 4 = 38 g. Mass at week 2 = 20 g.','Increase = 38 minus 20 = 18 g.'],'Answer: 18')},
  {type:'num', stem:`Use the same graph. Calculate the average rate of increase in mass between week 2 and week 8. Give the answer in grams per week, correct to <b>one decimal place</b>.`, ans:6.3, unit:'g per week',
   v:vis(lineChart({title:'Mass of a tomato plant over eight weeks', xs:['0','2','4','6','8'], series:[{name:'Mass',vals:[12,20,38,56,58]}], max:60, step:10, yLabel:'Mass (g)', w:440, h:230}), 'Axis titles (write them on the axes of your own graph): x-axis Time (weeks), y-axis Mass (g). Data from a class investigation.'),
   hint:`Rate = change in mass divided by change in time.`,
   sol:sksol(['Change in mass = 58 minus 20 = 38 g.','Change in time = 8 minus 2 = 6 weeks.','Rate = 38 &divide; 6 = 6,333...','To one decimal place: 6,3 g per week.'],'Answer: 6,3')},
  {type:'mc', stem:`Which sentence is the best <b>description</b> of the tomato plant graph?`,
   v:vis(lineChart({title:'Mass of a tomato plant over eight weeks', xs:['0','2','4','6','8'], series:[{name:'Mass',vals:[12,20,38,56,58]}], max:60, step:10, yLabel:'Mass (g)', w:440, h:230}), 'Axis titles (write them on the axes of your own graph): x-axis Time (weeks), y-axis Mass (g). Data from a class investigation.'),
   opts:[`The mass rises from 12 g at week 0 to 56 g at week 6 and then levels off at 58 g by week 8`,`The mass increases because the plant takes in more water and makes more food every week`,`The mass of the plant goes up very quickly at first and then it stops going up near the end`,`The mass rises from 12 g at week 0 to 38 g at week 4 and then falls to 20 g by week 8`], ans:0,
   hint:`A description gives direction, figures with units and the period.`,
   sol:sksol(['The sentence that begins "The mass rises from 12 g at week 0 ..." gives the direction, the figures with units and the time.','"The mass increases because ..." explains (it says why) and quotes no figures. "The mass of the plant goes up very quickly ..." has no figures. "... then falls to 20 g by week 8" is wrong: the mass does not fall after week 4.'],'Answer: The mass rises from 12 g at week 0 to 56 g at week 6 and then levels off at 58 g by week 8')},
  {type:'mc', stem:`Read the two statements about answering graph questions.<br><b>Statement 1:</b> A "describe" answer should quote figures, with units, taken from the graph.<br><b>Statement 2:</b> An "explain" answer only needs to repeat the trend without giving a reason.<br>Which is correct?`,
   opts:[`Statement 1 only`,`Statement 2 only`,`Both statements`,`Neither statement`], ans:0,
   hint:`"Explain" asks for a reason.`,
   sol:sksol(['Statement 1 is true: marks are given for the figures and their units.','Statement 2 is false: an "explain" answer must give the biological reason for the trend. Repeating the trend is only a description.'],'Answer: Statement 1 only')},
  {type:'mc', stem:`The graph shows the number of bacteria in a culture. Between which two consecutive times was the <b>average rate of increase greatest</b>, and what was it?`,
   v:vis(lineChart({title:'Bacteria in a culture over five hours', xs:['0','1','2','3','4','5'], series:[{name:'Bacteria',vals:[4,6,12,30,44,46]}], max:50, step:10, yLabel:'Bacteria (thousands)', w:460, h:230}), 'Axis titles (write them on the axes of your own graph): x-axis Time (hours), y-axis Bacteria (thousands). Data from a class investigation.'),
   opts:[`2 to 3 hours, at 18 thousand per hour`,`3 to 4 hours, at 14 thousand per hour`,`2 to 3 hours, at 30 thousand per hour`,`4 to 5 hours, at 46 thousand per hour`], ans:0,
   hint:`Work out the rise for each hour. The steepest part of the line has the biggest rise.`,
   sol:sksol(['Rise in each hour: 0 to 1 = 2; 1 to 2 = 6; 2 to 3 = 18; 3 to 4 = 14; 4 to 5 = 2 (thousand).','The greatest rise is 30 minus 12 = 18 thousand between 2 and 3 hours, a rate of 18 thousand per hour.','14 thousand per hour is a real rate but not the greatest. 30 thousand and 46 thousand are the number of bacteria at the end of an interval, not the rise.'],'Answer: 2 to 3 hours, at 18 thousand per hour')}
  ] },

/* ================= LEVEL 9 ================= */
{ id:9, name:'Calculations: mean, percentage, magnification', short:'Biological calculations',
  teach:{ h:'Write the formula, substitute, calculate, give the unit', b:`
<p>Five calculations appear again and again in practical tasks. Write the formula first, then substitute, then calculate and state the unit and the rounding.</p>
${cards([{t:'Mean',d:'sum of the readings &divide; number of readings'},{t:'Percentage',d:'part &divide; whole &times; 100'},{t:'Percentage change',d:'(new minus old) &divide; old &times; 100'},{t:'Rate',d:'change in quantity &divide; time taken'},{t:'Magnification',d:'size of image &divide; actual size of specimen',hi:true}],{min:160})}
${skwk([
 'Percentage change: a bean plant rises in mass from 80 g to 92 g.',
 'Change = 92 minus 80 = 12 g.',
 '12 &divide; 80 &times; 100 = 15%.',
 'Magnification: a drawing of a cheek cell is 45 mm long. The actual cell is 0,05 mm long.',
 'Convert to the same unit: 1 mm = 1 000 µm, so 45 mm = 45 000 µm and 0,05 mm = 50 µm.',
 'Magnification = 45 000 &divide; 50 = 900.'],
 'The mass rose by 15%, and the drawing has a magnification of &times;900.')}
${skrule('To find the <b>actual size</b>, rearrange: actual size = size of image &divide; magnification. Always convert <b>both</b> sizes to the same unit first. 1 mm = 1 000 µm.')}
${sktrap('Magnification has <b>no unit</b>: it is a number of times, written &times;900. Percentage change divides by the <b>old</b> value, not the new one.')}
${keyterms([['mean','sum divided by number of readings'],['percentage change','change divided by the original, times 100'],['rate','change divided by time'],['magnification','image size divided by actual size'],['micrometre (µm)','one thousandth of a millimetre'],['actual size','real size of the specimen']])}` },
  reteach:{ h:'The magnification triangle and a unit ladder', b:`
<p>Instead of three separate formulas, use one triangle for magnification. Cover the one you want and read what is left.</p>
${vis(`<svg viewBox="0 0 520 150" width="100%" style="max-width:440px;display:block;margin:6px auto" font-family="Arial, sans-serif"><polygon points="260,8 100,142 420,142" fill="#FFFDF7" stroke="#4D4D4F" stroke-width="2"/><line x1="170" y1="82" x2="350" y2="82" stroke="#4D4D4F" stroke-width="2"/><line x1="260" y1="82" x2="260" y2="142" stroke="#4D4D4F" stroke-width="2"/><text x="260" y="68" text-anchor="middle" font-size="17" font-weight="bold" fill="#4D4D4F">Image size</text><text x="212" y="118" text-anchor="middle" font-size="16" fill="#4D4D4F">Actual</text><text x="308" y="118" text-anchor="middle" font-size="16" fill="#4D4D4F">Mag.</text></svg>`, 'Magnification triangle: image size on top, actual size and magnification below')}
${dataTable(['Cover this corner','What is left'],[['Mag.','image size &divide; actual size'],['Actual','image size &divide; mag.'],['Image size','actual size &times; mag.']],{w:420})}
${dataTable(['To change','Multiply by','Example'],[['mm to µm','1 000','0,2 mm = 200 µm'],['µm to mm','&divide; 1 000','350 µm = 0,35 mm']],{w:520})}
${skwk([
 'A drawing of a pollen grain is 36 mm across. The actual grain is 120 µm.',
 'Same unit: 36 mm = 36 000 µm.',
 'Magnification = image &divide; actual = 36 000 &divide; 120 = 300.'],
 'The pollen drawing is &times;300.')}
${skwk([
 'A micrograph at &times;200 shows a cell 54 mm long on the page.',
 'Actual = image &divide; magnification = 54 &divide; 200 = 0,27 mm.',
 'Convert: 0,27 mm &times; 1 000 = 270 µm.'],
 'The actual cell is 270 µm long.')}
${skwk([
 'Percentage: 18 of 24 seeds germinate. 18 &divide; 24 &times; 100 = 75%.',
 'Percentage change: a mass falls from 50 g to 40 g, so (40 minus 50) &divide; 50 &times; 100 = negative 20%.'],
 '75% germinated, and the mass fell by 20%.')}
${skrule('Write every step: formula, substitution, answer with rounding. In an exam the working earns marks even when the final number is wrong.')}
${keyterms([['image size','what you measure on the drawing or micrograph'],['actual size','real size of the specimen'],['mean','sum divided by number of readings'],['percentage','part over whole, times 100'],['increase or decrease','sign of the percentage change']])}` },
  qs:[
  {type:'num', stem:`In a sample of 250 seeds, 215 germinated. Calculate the percentage of seeds that germinated.`, ans:86, unit:'%',
   hint:`Divide the part by the whole, then multiply by 100.`,
   sol:sksol(['Percentage = part &divide; whole &times; 100.','215 &divide; 250 = 0,86.','0,86 &times; 100 = 86.'],'Answer: 86')},
  {type:'num', stem:`A seedling had a mass of 45 g. A week later its mass was 60 g. Calculate the <b>percentage increase</b> in mass, correct to <b>one decimal place</b>.`, ans:33.3, unit:'%',
   hint:`Divide the change by the original mass (the old value), then multiply by 100.`,
   sol:sksol(['Change = 60 minus 45 = 15 g.','Percentage increase = 15 &divide; 45 &times; 100 = 33,333...','To one decimal place: 33,3%.'],'Answer: 33,3')},
  {type:'num', stem:`A student drew a plant cell. The drawing is 63 mm long. The actual cell is 90 µm long. Calculate the <b>magnification</b> of the drawing. Give a whole number. Type the number only, without the &times; sign.`, ans:700,
   hint:`Change the drawing length to micrometres first so that both sizes are in the same unit.`,
   sol:sksol(['Convert: 63 mm = 63 &times; 1 000 = 63 000 µm.','Magnification = image size &divide; actual size = 63 000 &divide; 90.','63 000 &divide; 90 = 700.'],'Answer: 700')},
  {type:'num', stem:`A micrograph with a magnification of &times;400 shows a cell that is 18 mm long on the page. Calculate the <b>actual length</b> of the cell in micrometres (µm). Type the number only.`, ans:45, unit:'µm',
   hint:`Actual size = image size divided by magnification. Convert mm to µm at the end.`,
   sol:sksol(['Actual size = image size &divide; magnification = 18 &divide; 400 = 0,045 mm.','Convert to µm: 0,045 &times; 1 000 = 45 µm.'],'Answer: 45')},
  {type:'num', stem:`A class weighed three seedlings at the start of an investigation and again after 14 days. Calculate the <b>percentage increase</b> in the <b>mean</b> mass of the seedlings, correct to <b>one decimal place</b>. Work from the means, not from one seedling.`,
   v:vis(dataTable(['Seedling','Mass at start (g)','Mass after 14 days (g)'],[['1','12,0','19,0'],['2','14,0','21,0'],['3','13,0','20,0']],{w:480}), 'Data from a class investigation'),
   ans:53.8, unit:'%',
   hint:`Find the two means first. Then work out the change as a percentage of the starting mean.`,
   sol:sksol(['Mean at start = (12,0 + 14,0 + 13,0) &divide; 3 = 39,0 &divide; 3 = 13,0 g.','Mean after 14 days = (19,0 + 21,0 + 20,0) &divide; 3 = 60,0 &divide; 3 = 20,0 g.','Change = 20,0 minus 13,0 = 7,0 g.','Percentage increase = 7,0 &divide; 13,0 &times; 100 = 53,846...','To one decimal place: 53,8%.'],'Answer: 53,8')}
  ] },

/* ================= LEVEL 10 ================= */
{ id:10, name:'Biological drawings', short:'Biological drawings',
  teach:{ h:'A drawing is marked on seven things', b:`
<p>A biological drawing is a clear, accurate record, not a picture. A typical memo awards about one mark for each of these criteria.</p>
${cards([
 {t:'1 Size',d:'Large: it fills at least half of the space given.'},
 {t:'2 Pencil and lines',d:'Sharp HB pencil. Clear, continuous, single lines. No sketchy or double lines.'},
 {t:'3 No shading',d:'No colouring and no shading. Show dark areas with a label, not with shading.'},
 {t:'4 Labels',d:'Ruled, straight label lines that touch the structure, do <b>not</b> cross and have no arrowheads. Write labels horizontally, on one side.',hi:true},
 {t:'5 Proportion',d:'Parts are the correct size compared with one another.'},
 {t:'6 Title',d:'A heading that says what the drawing shows, written below it (or where your teacher directs).'},
 {t:'7 Magnification',d:'Given when the drawing is of a magnified specimen, for example &times;40.'}],{min:200})}
${vis(skLabelDemo(), 'Left: correct labelling. Right: the same drawing with label faults. Only the labelling is shown here: a full drawing also needs a title and, for a magnified specimen, the enlargement.')}
${skwk([
 'A learner draws a thin slice of a plant stem seen under a microscope. The drawing is 80 mm wide and fills most of the page.',
 'She writes the heading below the drawing: "Transverse section of a plant stem".',
 'She adds how many times she has enlarged the slice, &times;40, below the heading.'],
 'The heading and the enlargement factor both belong <b>below</b> the drawing.')}
${skrule('Draw what you <b>see</b>, not what you expect to see. Draw outlines only. Labels go on one side, written horizontally, with ruled lines that never cross.')}
${sktrap('Shading, coloured pencils and arrowheads on label lines all lose marks.')}
${keyterms([['label line','a straight ruled line from the label to the structure'],['proportion','correct relative sizes'],['title','heading naming the drawing'],['magnification','how many times bigger the drawing is'],['outline','the edge of a structure']])}` },
  reteach:{ h:'A marked drawing, criterion by criterion', b:`
<p>A teacher marked a learner's drawing of a leaf. Each criterion is worth one mark. Read why each mark was given or lost.</p>
<p><i>Recall: in the calculations level you worked out how many times bigger a drawing or image is than the real specimen.</i></p>
${dataTable(['Question the examiner asks','What the learner did','Mark'],[
 ['Is the drawing large?','The drawing was only 4 cm wide in a space 12 cm wide','0'],
 ['Is it in sharp pencil with clear lines?','Sharp pencil, clear single lines','1'],
 ['Is it free of shading?','Left the leaf blade unshaded','1'],
 ['Are the labels ruled and neat?','Label lines ended in arrowheads','0'],
 ['Are the parts the right size relative to one another?','Midrib and blade sized correctly','1'],
 ['Is there a heading?','No heading','0'],
 ['Is the enlargement given for a magnified specimen?','Yes, as &times;3','1']],{w:640})}
<p>Total: <b>4 out of 7</b>. The three lost marks were all easy to avoid.</p>
${skwk([
 'The drawing is 4 cm wide in a space 12 cm wide, so it fills only one third of the width.',
 'Redraw it at least 6 cm wide, which fills half of the space.',
 'Scale every part by the same amount: if the midrib was half as wide as the blade, it must still be half as wide.'],
 'A larger drawing with the parts kept in the same relative sizes gains the size mark and keeps the proportion mark.')}
${skrule('Before you hand in a drawing, run down the seven questions above with your finger.')}
${keyterms([['size','fills at least half the space'],['label line','ruled line, no arrowhead'],['heading','written below the drawing'],['no shading','outlines only']])}` },
  qs:[
  {type:'mc', stem:`Which of the following should be used for a biological drawing?`,
   opts:[`A sharp HB pencil, drawing clear, single, continuous lines`,`A pen, so that the lines cannot be rubbed out by accident`,`A soft pencil, so that thick sketchy lines show the shape quickly`,`Coloured pencils, so that each structure is shown in its real colour`], ans:0,
   hint:`Think of lines that are clear and can be corrected.`,
   sol:sksol(['A sharp HB pencil allows clear single lines that can be corrected.','A pen cannot be corrected. Sketchy lines and colour both lose marks, because drawings are outlines only.'],'Answer: A sharp HB pencil, drawing clear, single, continuous lines')},
  {type:'mc', stem:`Which description of <b>labelling</b> would earn the mark?`,
   opts:[`Straight lines drawn with a ruler, ending on the structure, with the labels written horizontally to one side`,`Arrows drawn from each label to its structure, crossing each other where that is necessary so that no label is missed`,`Curved lines drawn freehand to each structure with the label written along the length of the line`,`Labels written on top of the structures inside the drawing so that the reader can see which is which`], ans:0,
   hint:`Label lines are ruled, and they must not cross.`,
   sol:sksol(['Ruled, straight lines that end on the structure and labels written horizontally on one side earn the mark.','Arrowheads, crossing lines, freehand curves and labels written on top of the drawing all lose it.'],'Answer: Straight lines drawn with a ruler, ending on the structure, with the labels written horizontally to one side')},
  {type:'text', stem:`A drawing is made from a specimen seen under a microscope. Apart from the title, which one thing must be written below the drawing to show how many times it is enlarged?`, ans:'magnification', anyCase:true, accept:['the magnification','mag','magnification factor','magnification value','magnified','magnifications'], ph:'one word',
   hint:`Think of how many times bigger the drawing is than the real thing.`,
   sol:sksol(['A drawing of a magnified specimen must state how many times bigger the drawing is than the actual specimen.','This is the magnification, for example &times;100.'],'Answer: magnification')},
  {type:'mc', stem:`Read the two statements about drawings.<br><b>Statement 1:</b> Shading may be used to show the nucleus because it is darker.<br><b>Statement 2:</b> Label lines must not cross one another.<br>Which is correct?`,
   opts:[`Statement 1 only`,`Statement 2 only`,`Both statements`,`Neither statement`], ans:1,
   hint:`Biological drawings use outlines only.`,
   sol:sksol(['Statement 1 is false: no shading is allowed. A dark nucleus is shown as an outline and a label.','Statement 2 is true: crossing label lines are confusing and lose the labelling mark.'],'Answer: Statement 2 only')},
  {type:'num', stem:`A learner drew a plant cell as seen under a microscope at &times;400. A practice memo awards 1 mark for each of these seven criteria: size, pencil and clear lines, no shading, labels and label lines, proportion, title, magnification. The drawing is large, in sharp pencil with clear lines, shaded in places with grey, correctly labelled with ruled lines, in proportion and has a title, but the magnification is not written below it. How many marks out of 7 does it earn?`, ans:5, unit:'marks',
   hint:`Go down the seven criteria and count the ones the learner met.`,
   sol:sksol(['Size: yes (1). Pencil and clear lines: yes (1). No shading: no, the drawing is shaded (0).','Labels: yes (1). Proportion: yes (1). Title: yes (1). Magnification: the specimen was magnified but the magnification is not written, so no (0).','Total = 1 + 1 + 0 + 1 + 1 + 1 + 0 = 5.'],'Answer: 5')}
  ] },

/* ================= LEVEL 11 ================= */
{ id:11, name:'Conclusions and inference', short:'Conclusions',
  teach:{ h:'A conclusion answers the aim and is backed by the data', b:`
<p>A <b>conclusion</b> tells the reader whether the hypothesis was supported or rejected, and it quotes the data that show this. An <b>inference</b> is a reasoned step beyond the data. Stay within what the investigation actually tested.</p>
${vis(dataTable(['Temperature (°C)','Mean number of seeds germinated (out of 20)'],[['10','6'],['20','15'],['30','19']],{w:460}), 'Data from a class investigation')}
<p><i>Aim: to investigate the effect of temperature on the germination of maize seeds. Hypothesis: the higher the temperature, the more seeds germinate.</i></p>
${skwk([
 'Step 1: answer the aim. Temperature does affect germination.',
 'Step 2: quote the data. The mean number of seeds germinating rose from 6 at 10 °C to 19 at 30 °C.',
 'Step 3: say what happens to the hypothesis. The results support it.',
 'Step 4: keep to the range tested. This applies from 10 °C to 30 °C, for these maize seeds.'],
 'Conclusion: the hypothesis is supported, because the mean number of seeds that germinated rose from 6 at 10 °C to 19 at 30 °C.')}
${skrule('A good conclusion (1) answers the aim, (2) quotes data, (3) states whether the hypothesis is supported or rejected, and (4) does not go beyond the conditions tested.')}
${sktrap('Two things that change together are <b>correlated</b>. That does not prove one <b>causes</b> the other, because a third factor may explain both. A <b>sample</b> is the part of a population that was actually measured, and a small one cannot be generalised to the whole population.')}
${keyterms([['conclusion','what the results show about the hypothesis'],['supported','results agree with the hypothesis'],['rejected','results disagree with the hypothesis'],['inference','a reasoned step beyond the data'],['correlation','two variables change together'],['causation','one variable makes the other change']])}` },
  reteach:{ h:'Build a conclusion in three boxes, then test it', b:`
<p>Fill three boxes in order. Use this example: aphids on rose bushes sprayed with soapy water or plain water.</p>
${vis(dataTable(['Group','Mean number of aphids per plant after one week'],[['Sprayed with soapy water','14'],['Sprayed with plain water (control)','63']],{w:520}), 'Data from a class investigation')}
<p><i>Hypothesis: soapy water reduces the number of aphids on rose bushes.</i></p>
${cards([{t:'Box 1: the verdict',d:'"The hypothesis is supported ..."',hi:true},{t:'Box 2: the evidence',d:'"... because plants sprayed with soapy water had a mean of 14 aphids, compared with 63 on plants sprayed with plain water."'},{t:'Box 3: the limit',d:'"This is for one week and these rose bushes only."'}],{min:200})}
<p><i>Recall: when you described graphs you quoted figures with units. A conclusion quotes figures from the table in the same way.</i></p>
${dataTable(['Learner conclusion','Problem'],[
 ['"Soap is good."','No data, and it does not say what the hypothesis was.'],
 ['"Soapy water kills aphids on all plants everywhere."','Goes beyond the data: only one plant type was tested.'],
 ['"The hypothesis is supported: the soapy water group had a mean of 14 aphids and the plain water group 63."','Full marks: verdict plus data.']],{w:620})}
<p>If the results had been the other way round (63 aphids with soapy water and 14 with plain water), the full-mark conclusion would be: "The hypothesis is rejected: plants sprayed with soapy water had a mean of 63 aphids, more than the 14 on plants sprayed with plain water." The verdict must match what the data show.</p>
${skwk([
 'Across 12 schools, the schools with more computers have higher matric pass rates.',
 'Step 1: the two change together, so there is a pattern in the data.',
 'Step 2: ask what else differs between the schools. Wealthier schools may have both more computers and better-resourced teaching.',
 'Step 3: from this pattern alone, the computers cannot be said to cause the higher pass rates.'],
 'A pattern in the data is not proof of cause. A controlled experiment is needed to show cause.')}
${skrule('Two variables that change together are only <b>associated</b>. A conclusion based on just three individuals is weaker: they tell you little about thousands. Say so, and suggest testing many more, chosen at random.')}
${keyterms([['verdict','supported or rejected'],['evidence','data quoted from the results'],['association','change together'],['causation','one produces the other'],['number tested','how many individuals were measured']])}` },
  qs:[
  {type:'mc', stem:`A learner's hypothesis was: "Seeds germinate best in neutral soil." She tested the germination of seeds at four pH values. Which is the <b>best conclusion</b>?`,
   v:vis(dataTable(['pH of the soil','3','5','7','9'],[['Seeds that germinated (%)','20','62','90','54']],{w:520}), 'Data from a class investigation'),
   opts:[`Germination was highest (90%) at pH 7 and lower at the other values, so the hypothesis is supported`,`The results show that pH 7 is the best pH for the germination of the seeds of all species of flowering plant`,`The hypothesis is rejected because some seeds also germinated at pH 3, pH 5 and pH 9`,`Germination was 90% at pH 7, so a higher pH in the soil causes more seeds to germinate`], ans:0,
   hint:`A good conclusion quotes the data, says whether the hypothesis is supported, and stays within what was tested.`,
   sol:sksol(['The correct conclusion quotes the highest value (90% at pH 7), compares it with the others and states the verdict for the pH values tested.','"The results show that pH 7 is the best ... all species of flowering plant" overgeneralises: only one kind of seed was tested. "The hypothesis is rejected because some of the seeds also germinated ..." gives the wrong reason: some germination at other pH values does not reject a hypothesis about the best pH. "... so raising the pH of the soil causes more of the seeds to germinate" misreads the data: at pH 9 germination (54%) was lower than at pH 7.'],'Answer: Germination was highest (90%) at pH 7 and lower at the other values, so the hypothesis is supported')},
  {type:'text', stem:`Two variables change together, but one does not necessarily cause the other. Give the word that describes this kind of relationship.`, ans:'correlation', anyCase:true, accept:['a correlation','correlated','correlate','association','an association','positive correlation','negative correlation','correlations'], ph:'one word',
   hint:`Think of two things that rise and fall together without one necessarily causing the other.`,
   sol:sksol(['Variables that rise and fall together are correlated.','This does not show that one causes the other.'],'Answer: correlation')},
  {type:'mc', stem:`A researcher found that, over one year in a coastal town, the monthly number of ice creams sold and the number of drowning incidents rose and fell together. Which conclusion is <b>justified</b>?`,
   opts:[`The two are correlated, but another factor such as hot weather could explain both`,`Eating ice cream causes people to drown, so it should be banned on beaches`,`Drowning incidents cause people to buy more ice cream in the weeks that follow`,`The two are not related, because eating ice cream has no direct effect on whether people drown`], ans:0,
   hint:`Ask what else changes in summer.`,
   sol:sksol(['The two rise and fall together, so they are correlated. A third factor, such as hot weather, brings more people to the beach and also makes people want ice cream.','Claiming that one causes the other goes beyond the data. Saying they are unrelated ignores the pattern in the data.'],'Answer: The two are correlated, but another factor such as hot weather could explain both')},
  {type:'text', stem:`A learner tested three learners from her class. Those who had eaten breakfast scored higher in a short test. She concluded that breakfast improves the marks of all learners, but this conclusion is not justified because the ________ is too small. Give the one word that names the individuals actually measured.`, ans:'sample', anyCase:true, accept:['samples','sample size','sample sizes','the sample size'], ph:'one word',
   hint:`It is the part of a population that is actually measured.`,
   sol:sksol(['Three learners from one class is a very small sample. It may not represent all learners, so the result cannot be generalised.','A larger, random sample would give a more reliable conclusion.'],'Answer: sample')},
  {type:'mc', stem:`A learner's hypothesis was: "Seedlings kept in full light grow taller than seedlings kept in darkness." The mean heights after ten days are in the table. Which is the best <b>conclusion</b>?`,
   v:vis(dataTable(['Group','Mean height after 10 days (mm)'],[['Full light','92'],['Darkness','148']],{w:420}), 'Data from a class investigation'),
   opts:[`The hypothesis is rejected: seedlings in darkness had a mean height of 148 mm, taller than the 92 mm in full light`,`The hypothesis is supported: seedlings in full light had a mean height of 92 mm, so light makes seedlings taller`,`The hypothesis is rejected because seedlings need darkness in order to grow, so light is harmful to plants in general`,`The hypothesis is rejected, but the data cannot be used because seedlings kept in darkness look unhealthy`], ans:0,
   hint:`Compare the two means, then ask whether they agree with the hypothesis.`,
   sol:sksol(['The hypothesis predicted that light-grown seedlings would be taller. The darkness group was taller (148 mm against 92 mm), so the hypothesis is rejected.','"The hypothesis is supported ..." misreads the table. "... light is harmful to plants in general" overgeneralises to all plants. "... the data cannot be used" throws away valid data: the heights were measured and are the evidence.'],'Answer: The hypothesis is rejected: seedlings in darkness had a mean height of 148 mm, taller than the 92 mm in full light')}
  ] },

/* ================= LEVEL 12 ================= */
{ id:12, name:'Evaluating a method and improving it', short:'Evaluating a method',
  teach:{ h:'Name the weakness, say what it did to the results, give a specific fix', b:`
<p>To <b>evaluate</b> a method you look for weaknesses and say how to remove each one. Marks go to <b>specific</b> improvements, not to "be more careful".</p>
${dataTable(['Weakness','Effect on the results','Specific improvement'],[
 ['Only one test','Results may not be repeatable (not reliable)','Repeat three times and calculate the mean'],
 ['Very small sample','May not represent the population','Use a larger random sample'],
 ['A variable not controlled','Test is not fair (not valid)','Keep that variable the same, and say how'],
 ['Instrument too coarse','Readings are not precise enough to show small differences','Use a more precise instrument, such as a ruler marked in mm'],
 ['Judgement by eye','Different observers disagree (subjective)','Use an objective measurement, such as a stopwatch or a colour chart']],{w:640})}
${skwk([
 'A learner compared the masses of seeds from two plants using a kitchen scale that reads only to whole grams. Each seed has a mass of about 0,2 g.',
 'Weakness 1: the scale cannot show differences between seeds, because every seed reads as 0 g.',
 'Weakness 2: the learner did not check that the scale read 0 g with nothing on it, so every reading carries the same extra error.'],
 'Improvements: use a balance that reads to 0,01 g, and check that it reads zero before weighing.')}
${skrule('<b>Ethics and safety</b>: treat living things humanely and return animals to where they were found. Get consent from human volunteers and never harm them. Wear gloves and goggles where the method needs them.')}
${sktrap('"Be more careful" and "do it again" earn nothing. Name the exact fault and the exact change.')}
${keyterms([['evaluate','judge the quality of a method'],['sample size','number of individuals tested'],['repeat','do the test again'],['subjective','depends on the observer\'s opinion'],['objective','measured with an instrument'],['precision','how finely an instrument measures']])}` },
  reteach:{ h:'Vague answers against full-mark answers', b:`
<p>Here are typical answers, with marks, for a method in which a learner timed pill bugs crossing a line, once, with a wall clock, for five bugs in the sun and five in the shade.</p>
${dataTable(['Vague answer (0 marks)','Specific answer (full marks)'],[
 ['Be more careful.','Use a stopwatch, started and stopped by the same person, instead of a wall clock.'],
 ['Do it again.','Repeat the test three times for each bug and calculate a mean.'],
 ['Use more bugs.','Use 20 bugs in each place, chosen at random.'],
 ['Make it fair.','Use the same type of floor and the same size of tray in the sun and the shade.']],{w:640})}
${cards([{t:'Sentence frame',d:'"The weakness was <b>____</b>. This made the results <b>____</b> (unreliable, invalid, inaccurate or imprecise). To improve, I would <b>____</b>."',hi:true}],{min:260})}
${skwk([
 'Weakness: the plants were measured once with a ruler marked in centimetres.',
 'Effect: the readings are not precise, so small differences are missed.',
 'Improvement: measure to the nearest millimetre with a millimetre ruler and take three readings for each plant.'],
 'The weakness, its effect and a specific fix are all stated.')}
${skrule('<b>Ethics</b>: cause as little harm as possible to living things and to their habitat. <b>Safety</b>: wear gloves and goggles and wash your hands after handling soil, plants or animals.')}
${keyterms([['weakness','a fault in the method'],['specific','names the exact change'],['unreliable','results do not repeat'],['invalid','test is not fair'],['inaccurate','far from the true value']])}` },
  qs:[
  {type:'mc', stem:`A learner grew one radish seedling in light and one in darkness, once, and measured the stems. What is the best <b>improvement</b>?`,
   opts:[`Grow many seedlings in each condition and calculate the mean of each group`,`Grow the same two seedlings for longer and measure them again at the end`,`Measure the seedling in the light more carefully than the one in the dark`,`Use a different plant species for each condition so that the results differ`], ans:0,
   hint:`The weakness is a tiny sample with no repeats.`,
   sol:sksol(['One seedling per condition is a very small sample, so the result may not represent the species. Many seedlings and a mean make it more reliable.','Growing the same two seedlings for longer is still a sample of one each. Measuring one seedling more carefully makes the comparison unfair. Different species would bring in another variable.'],'Answer: Grow many seedlings in each condition and calculate the mean of each group')},
  {type:'text', stem:`A learner judged the colour change of a solution by eye and wrote "quite dark". A judgement that depends on the opinion of the observer is called what? Give a one-word answer.`, ans:'subjective', anyCase:true, accept:['subjective judgement','subjective judgment','a subjective judgement','subjectivity','subjective measurement','subjectives'], ph:'one word',
   hint:`The opposite word is "objective".`,
   sol:sksol(['A judgement that depends on the observer\'s opinion is not measured with an instrument.','It is subjective. An objective measurement uses an instrument.'],'Answer: subjective')},
  {type:'text', stem:`A learner investigated the effect of sugar concentration on the bubbles made by yeast, but left the flasks on different shelves around the classroom, some in the sun and some in the shade. Name the <b>main variable</b> that differed between the flasks and was not controlled.`, ans:'temperature', anyCase:true, accept:['the temperature','temperature of the flasks','temperature of the flask','room temperature','the temperature of the flasks','light','light intensity','amount of light','the amount of light'], ph:'one word',
   hint:`Think about how sun and shade change the conditions around a flask.`,
   sol:sksol(['Flasks in the sun would be warmer and brighter than flasks in the shade, which changes the rate of bubbling for a reason that has nothing to do with sugar.','Temperature (and light) differed between flasks but should have been kept the same, so the test was not fair.','A specific improvement is to keep all the flasks in one water bath at a fixed temperature.'],'Answer: temperature (light is also acceptable)')},
  {type:'mc', stem:`A learner counts snails in a garden to estimate their numbers. Which action is <b>ethically acceptable</b>?`,
   opts:[`Collecting the snails gently, counting them and returning them to where they were found`,`Taking them home to keep as pets after the count so that they can be counted again`,`Collecting the snails in a bucket for several hours and then releasing them in a different garden`,`Removing every snail from the garden so that none is counted twice on a later day`], ans:0,
   hint:`Living things must be treated humanely and left where they were found.`,
   sol:sksol(['Gentle handling and release where found cause the least harm.','Taking snails home, keeping them in a bucket and releasing them somewhere else, and removing them all harm the animals or change their habitat.'],'Answer: Collecting the snails gently, counting them and returning them to where they were found')},
  {type:'mc', stem:`A learner wanted to find out whether watering affects the root length of bean seedlings. She planted two seeds in a wet pot and two seeds in a dry pot. The wet pot stood on a sunny window sill and the dry pot stood in a cupboard. After a week she measured every root with a ruler marked in millimetres. Which pair of weaknesses is present in this method?`,
   opts:[`The sample was too small (two seeds per pot), and the amount of light was not kept constant`,`There were no repeats of the measurement, and the dependent variable was not measured at the end`,`The wrong dependent variable was chosen, and the sample was far too large to handle`,`The independent variable was not changed, and the units were not recorded in a table`], ans:0,
   hint:`Count the seeds in each pot and compare where the pots stood.`,
   sol:sksol(['Two seeds per pot is a very small sample. The pots stood in different amounts of light, so light was a second variable that changed with watering.','The roots were measured, so the dependent variable was measured. Watering was changed, so the independent variable was changed. The sample was small, not large.'],'Answer: The sample was too small (two seeds per pot), and the amount of light was not kept constant')}
  ] },

/* ================= LEVEL 13 ================= */
{ id:13, name:'A full PAT-style item', short:'Full PAT-style item',
  teach:{ h:'Work through a whole practical task, mark by mark', b:`
<p>A PAT item gives you a short preamble and a table. You then answer in the order of the scientific method. Here is a model answer, with marks, to one item.</p>
<p><i>A learner measured her own pulse rate after different durations of skipping. She skipped for 0, 2, 4, 6 and 8 minutes and counted her pulse for one minute straight after each.</i></p>
${vis(dataTable(['Duration of exercise (min)','0','2','4','6','8'],[['Pulse rate (beats per minute)','72','96','112','124','130']],{w:540}), 'Data from a class investigation')}
${dataTable(['Question','Model answer','Marks'],[
 ['1 Identify the independent and the dependent variable','Independent: duration of exercise (min). Dependent: pulse rate (beats per minute).','2'],
 ['2 State a hypothesis','The longer the duration of exercise, the higher the pulse rate.','2'],
 ['3 Choose a graph and name its marks','Line graph (both variables are numbers on a scale). Title, labelled axes with units, even scale, accurate plotting, line drawn.','up to 7'],
 ['4 Percentage increase from 0 to 6 minutes (1 decimal place)','(124 minus 72) &divide; 72 &times; 100 = 72,2%','3'],
 ['5 Conclusion','The hypothesis is supported: pulse rose from 72 to 130 beats per minute over 8 minutes.','2'],
 ['6 Evaluate','One learner and one reading each: use many learners, repeat and take means.','2']],{w:660})}
${skwk([
 'Question 4 in full. Write the formula: percentage increase = (new minus old) &divide; old &times; 100.',
 'Substitute the values from the table: (124 minus 72) &divide; 72 &times; 100.',
 'Calculate: 52 &divide; 72 &times; 100 = 72,222...',
 'Round as the question asks (1 decimal place) and add the unit.'],
 'Percentage increase = 72,2%. The formula and substitution earn marks even if the final number is wrong.')}
${skrule('Before designing any investigation, answer five questions: <b>What will I change? What will I measure? What will I keep the same? How many repeats or how large a sample? How will I record and process the results?</b>')}
${sktrap('Do not skip the working. A percentage change with no formula and no rounding statement can lose marks even if the number is right.')}
${keyterms([['independent variable','what you change'],['dependent variable','what you measure'],['hypothesis','testable statement linking them'],['percentage change','(new minus old) divided by old, times 100'],['conclusion','verdict plus data'],['evaluation','weakness plus specific improvement']])}` },
  reteach:{ h:'Command words and what each one asks for', b:`
<p>Exam questions open with a command word. Match each word to what the examiner wants.</p>
${dataTable(['Command word','What to write','Marks usually'],[
 ['Identify / state','One short answer, with units for a measured variable','1'],
 ['State a hypothesis','"The more/higher ..., the more/higher ...": both variables, a direction','2'],
 ['Plot / draw a graph','Title, axes with units, even scale, accurate points, line','up to 7'],
 ['Calculate','Formula, substitution, answer with unit and the stated rounding','2 to 3'],
 ['Conclude','Verdict on the hypothesis plus figures from the table','2'],
 ['Evaluate / suggest an improvement','Weakness plus a specific fix','2']],{w:640})}
<p>Here is the same pattern on a different item. <i>Learners counted the stomata per mm² on leaves from a shaded place and from a sunny place, three leaves each.</i></p>
${vis(dataTable(['Place','Leaf 1','Leaf 2','Leaf 3','Mean (stomata per mm²)'],[['Shaded','48','52','50','50'],['Sunny','78','82','80','80']],{w:560}), 'Data from a class investigation')}
${skwk([
