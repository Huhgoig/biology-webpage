  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Do not say the ligase "cuts" or the restriction enzyme "joins". Scissors cut, glue joins, and the plasmid only carries.</p></div>`},
  qs:[
  {type:'text', stem:`What name is given to the enzymes that cut DNA at specific base sequences?`, ans:'restriction enzyme', anyCase:true, accept:['restriction enzymes','restriction endonuclease','restriction endonucleases','endonuclease','endonucleases','restriction'], ph:'two words',
   hint:'The name tells you the enzyme is selective about where it cuts.',
   sol:`<div class="step-line">An enzyme that recognises one particular base sequence and cuts the DNA there is a restriction enzyme.</div><div class="step-line ans">Answer: restriction enzyme</div>`},
  {type:'text', stem:`Sticky ends pair by weak hydrogen bonds. What type of bond does DNA ligase form to make the join permanent?`, ans:'covalent', anyCase:true, accept:['covalent bond','covalent bonds','a covalent bond','phosphodiester','phosphodiester bond','phosphodiester bonds','covalently'], ph:'one word',
   hint:'These bonds are much stronger than hydrogen bonds.',
   sol:`<div class="step-line">Hydrogen bonds between sticky ends are weak and only temporary.</div><div class="step-line">DNA ligase forms covalent bonds between the sugar-phosphate backbones, joining the gene and the plasmid permanently.</div><div class="step-line ans">Answer: covalent bonds</div>`},
  {type:'mc', stem:`Why must the <b>same</b> restriction enzyme be used to cut the gene and the plasmid?`,
   opts:['Its cuts leave complementary sticky ends, so the gene can pair with the plasmid','It closes the plasmid into a circle again so that the gene is held inside the ring','It stops the ligase from sealing the backbone before the ends have matched','It copies the gene so that there are enough fragments to fill the plasmid'], ans:0,
   hint:'Think about the shape of the jigsaw edge each enzyme leaves.',
   sol:`<div class="step-line">Each restriction enzyme leaves its own overhang. The same enzyme gives the same, complementary overhangs on the gene and the plasmid.</div><div class="step-line">Complementary ends pair by hydrogen bonds. The enzyme does not copy DNA, close the ring or control the ligase.</div><div class="step-line ans">Answer: Its cuts leave complementary sticky ends, so the gene can pair with the plasmid</div>`},
  {type:'text', stem:`Genetic engineers load a gene into a bacterium\'s extra ring of DNA, which lies outside the main chromosome and acts as a <b>vector</b>. Name this ring of DNA.`, ans:'plasmid', anyCase:true, accept:['plasmids','a plasmid','bacterial plasmid','bacterial plasmids'], ph:'one word',
   hint:'It is circular and much smaller than the bacterial chromosome.',
   sol:`<div class="step-line">A plasmid is a small circular DNA molecule in a bacterium.</div><div class="step-line">It can be cut open, receive a gene and be returned to a bacterium, so it carries the gene (it is the vector).</div><div class="step-line ans">Answer: plasmid</div>`},
  {type:'mc', stem:`A gene is flanked by two copies of the sequence AAGCTT, and it contains no CTGCAG site. A plasmid has one AAGCTT site and one CTGCAG site. Enzyme X cuts only at AAGCTT. Enzyme Y cuts only at CTGCAG. Which plan gives a recombinant plasmid?`,
   opts:['Cut the gene and the plasmid with enzyme X, mix them well, then add DNA ligase to join them','Cut the gene with enzyme X and the plasmid with enzyme Y, mix them, then add DNA ligase','Cut the gene and the plasmid with enzyme X, then let the hydrogen bonds hold the sticky ends','Cut the plasmid with enzyme X, add the gene after treating it with enzyme Y, then add ligase'], ans:0,
   hint:'You need matching sticky ends and a permanent join.',
   sol:`<div class="step-line">Enzyme X cuts out the gene and opens the plasmid at its single AAGCTT site, leaving matching sticky ends. Ligase then seals them.</div><div class="step-line">X on the gene with Y on the plasmid gives ends that do not match. Hydrogen bonds alone are only temporary, so ligase is needed. Enzyme Y has no site in the gene, so it leaves the gene uncut and without sticky ends.</div><div class="step-line ans">Answer: Cut the gene and the plasmid with enzyme X, mix them well, then add DNA ligase to join them</div>`}
  ]},

/* ===================== LEVEL 4 ===================== */
{ id:4, name:'Making human insulin in bacteria', short:'Recombinant insulin',
  teach:{ h:'Bacteria can be engineered into insulin factories',
  b:`<p>Since 1982, human insulin has been made by genetically engineered bacteria (<i>E. coli</i>). People with diabetes who cannot make enough insulin use it as medicine.</p>
  ${vis(flow(['Isolate the human insulin gene','Cut gene and plasmid with the same enzyme','Join them with ligase: recombinant plasmid','Insert the plasmid into a bacterium','Bacteria multiply and make insulin','Harvest and purify the insulin']),'Recombinant DNA technology: six steps')}
  <p>Bacteria can read a human gene because the genetic code is universal: the same codons code for the same amino acids in all organisms.</p>
  <p>The older source of insulin was the pancreas of pigs and cattle. Insulin from bacteria is better: it is identical to human insulin, so it is less likely to cause an allergic reaction; the supply is large and reliable; and no animals are needed.</p>
  <div class="worked"><span class="lbl">Worked example: how many producers?</span>
    <div class="step-line">One bacterium carrying the insulin gene on a plasmid divides every 20 minutes. Each division gives 2 cells, and each new cell carries a copy of that plasmid.</div>
    <div class="step-line">After 20 min: 2 cells. After 40 min: 4. After 60 min (3 divisions): 8.</div>
    <div class="step-line">Each division doubles the number, so after n divisions there are 2<sup>n</sup> cells.</div>
    <div class="step-line ans">After 1 hour, 3 divisions: 2<sup>3</sup> = 8 insulin-producing bacteria.</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>Gene out, plasmid open, same enzyme, ligase joins, into bacteria, bacteria multiply (clone), insulin harvested.</p></div>
  ${keyterms([['recombinant DNA','DNA made by joining DNA from two different sources'],['recombinant plasmid','a plasmid containing a foreign gene'],['restriction enzyme','cuts the gene and the plasmid'],['DNA ligase','joins gene and plasmid'],['genetic code is universal','the same codons code for the same amino acids in all organisms'],['host cell','the bacterium that receives the plasmid']])}`},
  reteach:{ h:'Read the figure, then write the model answer',
  b:`<p>Here the same process is drawn with a letter on every stage, the way an examiner sets a figure.</p>
  ${vis(flow(['A: Insulin gene cut from human DNA','B: Plasmid cut with the same enzyme','C: Ligase joins gene and plasmid','D: Plasmid enters a bacterium','E: Bacteria divide, copying the plasmid','F: Insulin collected and purified']),'A figure with lettered stages')}
  ${contrast('Examiner asks','What you write',[
    ['Which letters show an enzyme acting on DNA?','A and B (restriction enzyme), C (ligase)'],
    ['What happens at E?','Each bacterium divides by binary fission and passes on a copy of the plasmid'],
    ['Why use bacteria?','They multiply quickly and are easy to grow in large tanks'],
    ['Why can a bacterium use a human gene at all?','All living things read DNA with one shared genetic code'],
    ['Why is this insulin better than pig insulin?','It has the human amino acid sequence, so the body does not treat it as foreign; supply is large and no animals are needed']
  ])}
  <div class="worked"><span class="lbl">Model answer: Describe how insulin is made by genetic engineering (5)</span>
    <div class="step-line">1. The insulin gene is cut from human DNA with a restriction enzyme. (1)</div>
    <div class="step-line">2. The same restriction enzyme cuts open a bacterial plasmid. (1)</div>
    <div class="step-line">3. The gene is joined into the plasmid by DNA ligase. (1)</div>
    <div class="step-line">4. The plasmid is put into bacteria, which multiply and make insulin. (1)</div>
    <div class="step-line ans">5. The insulin is harvested and purified. (1)</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>Five marks, five steps. Name the enzyme with each cutting or joining step, and say the bacteria multiply.</p></div>`},
  qs:[
  {type:'order', stem:`Human growth hormone is also made by genetically engineered bacteria. Put the steps in the correct order.`,
   items:['The bacteria multiply and make growth hormone','The growth hormone gene and a plasmid are cut with the same restriction enzyme','The growth hormone is harvested and purified','The plasmid carrying the gene is put into bacteria','Ligase joins the growth hormone gene into the plasmid'],
   ans:[4,1,5,3,2],
   hint:'Cut, join, insert, multiply, collect.',
   sol:`<div class="step-line">1. The growth hormone gene and a plasmid are cut with the same restriction enzyme.</div><div class="step-line">2. Ligase joins the growth hormone gene into the plasmid.</div><div class="step-line">3. The plasmid carrying the gene is put into bacteria.</div><div class="step-line">4. The bacteria multiply and make growth hormone.</div><div class="step-line ans">5. The growth hormone is harvested and purified.</div>`},
  {type:'mc', stem:`A bacterium has no insulin gene of its own, yet it builds the correct <b>human</b> protein after a human gene has been put into it. What allows the bacterium to do this?`,
   opts:['The genetic code is universal, so bacteria read human codons and build insulin','Bacteria carry the same DNA as humans, so they already contain an insulin gene','The plasmid rewrites the human gene into bacterial codons before it is read','Ligase changes the codons into the ones that bacteria prefer to use'], ans:0,
   hint:'Think about whether codons mean the same thing in every organism.',
   sol:`<div class="step-line">The same codons code for the same amino acids in all organisms (the code is universal), so a bacterial ribosome builds the correct human protein from the mRNA copied from the gene.</div><div class="step-line">Bacteria do not contain the human gene. A plasmid only carries the gene, and ligase only joins DNA. Neither changes the base sequence.</div><div class="step-line ans">Answer: The genetic code is universal, so bacteria read human codons and build insulin</div>`},
  {type:'text', stem:`What name is given to a plasmid that carries a foreign gene?`, ans:'recombinant plasmid', anyCase:true, accept:['recombinant','recombinant plasmids','recombinant dna','recombinant vector','hybrid plasmid','chimeric plasmid'], ph:'two words',
   hint:'The word means "made by combining DNA from two sources".',
   sol:`<div class="step-line">The plasmid now holds DNA from two sources: the bacterium and the human insulin gene.</div><div class="step-line ans">Answer: a recombinant plasmid</div>`},
  {type:'mc', stem:`Which is an advantage of insulin made by bacteria over insulin taken from pigs?`,
   opts:['It is identical to human insulin, so an allergic reaction is much less likely','It acts for much longer than pig insulin, so it needs injecting only once a week','It is made by the patient\'s own pancreas once the bacteria have been injected','It needs fewer animals than pig insulin, because only a few pigs start the culture'], ans:0,
   hint:'Think about how close the molecule is to the one the body makes.',
   sol:`<div class="step-line">The gene is the human gene, so the insulin has the human amino acid sequence and is less likely to be seen as foreign.</div><div class="step-line">Bacterial insulin is not longer-acting than pig insulin, it is not made by the patient\'s pancreas, and it needs no animals at all. It replaces missing insulin only.</div><div class="step-line ans">Answer: It is identical to human insulin, so an allergic reaction is much less likely</div>`},
  {type:'num', stem:`Assume that one bacterium carrying the inserted insulin gene on a plasmid divides every 30 minutes, that every cell survives and that every new cell has a copy of the plasmid. How many insulin-producing bacteria are present after <b>3 hours</b>?`, ans:64, unit:'bacteria',
   hint:'First find how many divisions fit into 3 hours.',
   sol:`<div class="step-line">3 hours = 180 minutes. 180 ÷ 30 = 6 divisions.</div><div class="step-line">Each division doubles the number of cells: 2<sup>6</sup> = 2 × 2 × 2 × 2 × 2 × 2 = 64.</div><div class="step-line ans">Answer: 64 bacteria</div>`}
  ]},

/* ===================== LEVEL 5 ===================== */
{ id:5, name:'Genetically modified crops', short:'GM crops',
  teach:{ h:'GM crops have a gene added to improve them, but there is a debate',
  b:`<p>A genetically modified (GM) crop has had a gene from another organism added to its DNA. South Africa grows GM maize, soya and cotton.</p>
  ${cards([
    {t:'Bt maize', d:'Carries a gene from the soil bacterium <i>Bacillus thuringiensis</i>. The maize makes a toxin that kills the stem borer caterpillars that eat it.', hi:true},
    {t:'Golden rice', d:'Has genes added so the grain makes β-carotene, which the body changes into vitamin A. It aims to reduce vitamin A deficiency.', hi:true},
    {t:'Herbicide-tolerant soya', d:'Carries a gene that lets the plant survive a weedkiller, so weeds can be sprayed without killing the crop.', hi:true}
  ])}
  ${contrast('Advantages','Concerns',[
    ['Higher yield: less crop lost to pests and weeds','Gene flow: the new gene may spread to wild relatives'],
    ['Fewer pesticide sprays: lower cost and fewer chemicals','Pests may evolve resistance to the toxin'],
    ['Better nutrition, for example golden rice','Possible harm to other insects and to biodiversity'],
    ['Farmers may earn more','Costly seed from a few companies; labelling of GM food']
  ])}
  <div class="worked"><span class="lbl">Worked example: a reasoning chain</span>
    <div class="step-line">Claim: grain that makes β-carotene could help children who eat little vitamin A.</div>
    <div class="step-line">White rice grain has almost no β-carotene, so people who eat mostly rice take in little of it.</div>
    <div class="step-line">The body changes β-carotene into vitamin A, so the engineered grain adds a source.</div>
    <div class="step-line ans">A possible advantage, but it must still be tested to see whether vitamin A levels really improve.</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>When asked to <b>evaluate</b>, weigh the advantages against the concerns and then give a judgement. Use specific biological reasons, not "it is unnatural".</p></div>
  ${keyterms([['GM crop','a crop with a gene from another organism added'],['transgenic','containing a gene from a different species'],['gene flow','genes spreading to other populations by pollen'],['herbicide','a chemical that kills weeds'],['biodiversity','the variety of living things in an area'],['resistance','the ability of a pest to survive a chemical or toxin']])}`},
  reteach:{ h:'A for and against frame for "evaluate"',
  b:`<p>Here is how an examiner awards marks for an evaluation. Read the full-mark answer, then the zero-mark answer.</p>
  <div class="worked"><span class="lbl">Model answer: Evaluate the use of herbicide-tolerant soya (4)</span>
    <div class="step-line">1. For: the crop survives spraying, so weeds are killed without harming it and the yield rises. (1)</div>
    <div class="step-line">2. Against: using one weedkiller every season selects for weeds that survive it, so resistant weeds may evolve. (1)</div>
    <div class="step-line">3. Against: the seed must be bought from a few companies, which can make farming costly. (1)</div>
    <div class="step-line ans">4. Judgement: the benefits are real, but they last only if farmers vary their weed control. (1)</div></div>
  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Zero-mark answer</span><p>"It is unnatural, so it is bad." (0) It gives no biological reason, shows only one side, and reaches no reasoned judgement.</p></div>
  <div class="callout"><span class="lbl">Phrasing</span><p>"On the one hand ... but on the other hand ... Overall, ..." earns more marks than a list of advantages only.</p></div>`},
  qs:[
  {type:'mc', stem:`After a farmer sprays a whole field, the weeds are dead but the crop plants are unharmed. Which GM trait best explains this?`,
   opts:['Tolerance to a herbicide spray','Resistance to stem borer larvae','Extra β-carotene in the grain','Tolerance of very dry soil'], ans:0,
   hint:'A herbicide is a weedkiller.',
   sol:`<div class="step-line">A crop that survives a weedkiller is tolerant of the herbicide. Herbicide-tolerant soya is the example.</div><div class="step-line ans">Answer: Tolerance to a herbicide spray</div>`},
  {type:'text', stem:`Bt maize contains a gene from a soil bacterium. Write the full scientific name (genus and species) of that bacterium.`, ans:'Bacillus thuringiensis', anyCase:true, accept:['B. thuringiensis','B thuringiensis','B.thuringiensis','bacillus thuringensis','thuringiensis'], ph:'two words',
   hint:'Bt is short for the second word of its name.',
   sol:`<div class="step-line">The gene codes for a toxin made by <i>Bacillus thuringiensis</i>, which kills stem borer caterpillars.</div><div class="step-line ans">Answer: Bacillus thuringiensis</div>`},
  {type:'mc', stem:`What is the risk if pollen from a GM crop reaches a related wild plant?`,
   opts:['The new gene may spread into the wild plant population by gene flow','The wild plant will always die because it cannot use the new protein','The GM crop will lose its gene because the wild plant takes it away','The wild plant will become a new species within a single generation'], ans:0,
   hint:'Pollen carries genes.',
   sol:`<div class="step-line">Pollen fertilises the wild plant, so the wild plant\'s offspring may inherit the gene. This is gene flow, which could change wild populations.</div><div class="step-line">Wild plants do not always die. The crop keeps its own gene. A new species does not form in one generation.</div><div class="step-line ans">Answer: The new gene may spread into the wild plant population by gene flow</div>`},
  {type:'mc', stem:`Why might growing Bt maize on the same land year after year lead to Bt-<b>resistant</b> pests?`,
   opts:['Resistant larvae survive and breed, so resistance alleles spread','The toxin changes the DNA of the larvae so that they become resistant','The maize slowly stops making the toxin, so the larvae recover','Larvae that eat the toxin learn to avoid the plants in the next season'], ans:0,
   hint:'Think of natural selection acting on the pest.',
   sol:`<div class="step-line">Some larvae have alleles that let them survive the toxin. They live, reproduce and pass those alleles on.</div><div class="step-line">Over generations the resistance alleles become more common. The toxin does not cause the mutations, and larvae do not learn.</div><div class="step-line ans">Answer: Resistant larvae survive and breed, so resistance alleles spread</div>`},
  {type:'mc', stem:`A student concludes: "GM maize should be banned because it might harm biodiversity." Which response is the best <b>evaluation</b>?`,
   opts:['The risk is possible, not proven, and must be weighed against benefits such as fewer sprays','The conclusion is sound, because gene flow to wild relatives has been proved to destroy biodiversity','The conclusion is wrong, because GM maize cuts pesticide use and so cannot harm biodiversity at all','The conclusion cannot be judged until every possible risk has been shown to be exactly zero'], ans:0,
   hint:'An evaluation weighs both sides and gives a reasoned judgement.',
   sol:`<div class="step-line">A good evaluation names the concern (possible harm), notes that it is a risk and not a proven effect, and weighs it against the benefits.</div><div class="step-line">Harm to biodiversity has not been proved in every case. Fewer sprays are a benefit, but they do not rule out other effects. No technology can show that a risk is exactly zero, so waiting for that would mean never deciding.</div><div class="step-line ans">Answer: The risk is possible, not proven, and must be weighed against benefits such as fewer sprays</div>`}
  ]},

/* ===================== LEVEL 6 ===================== */
{ id:6, name:'Cloning and nuclear transfer', short:'Cloning',
  teach:{ h:'A clone is a genetically identical copy',
  b:`<p>A clone is an organism that is genetically identical to its parent or donor. Some clones are natural (identical twins, or any organism that reproduces asexually). Reproductive cloning of an animal is done by nuclear transfer.</p>
  ${vis(flow(['Egg nucleus removed; donor body cell taken','Donor nucleus put into the egg','Electric pulse starts division','Embryo placed in a surrogate mother','Clone is born']),'Reproductive cloning. Dolly the sheep (born in 1996) was made from the nucleus of an udder cell.')}
  <p>The egg cell that has had its nucleus removed is called <b>enucleated</b>. The clone has the same <b>nuclear</b> DNA as the donor of the body cell, but its mitochondrial DNA comes from the egg donor.</p>
  <div class="worked"><span class="lbl">Worked example: counting chromosomes</span>
    <div class="step-line">A sheep body cell has 54 chromosomes. A sheep egg cell has 27.</div>
    <div class="step-line">The body cell nucleus holds the full set of 54 chromosomes (two of each type).</div>
    <div class="step-line">Once that nucleus is in an egg whose own nucleus has gone, the cell has a complete set, so it does not need a sperm.</div>
    <div class="step-line ans">The cell starts with 54 chromosomes, like a fertilised egg.</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>Cloning by nuclear transfer: body-cell nucleus into an enucleated egg, electric pulse, surrogate mother. The clone\'s nuclear DNA matches the donor of the nucleus.</p></div>
  ${keyterms([['clone','a genetically identical organism'],['nuclear transfer','moving a nucleus from one cell into another'],['enucleated','having had the nucleus removed'],['donor','the animal that supplies the body-cell nucleus'],['surrogate mother','the female that carries the embryo'],['mitochondrial DNA','DNA in the mitochondria, inherited from the egg']])}`},
  reteach:{ h:'Three animals, three contributions',
  b:`<p><i>Recall:</i> in genetic engineering one gene is moved into a cell. In cloning, a whole nucleus, with all its nuclear genes, is moved.</p>
  ${vis(`<svg viewBox="0 0 520 190" width="100%" style="max-width:520px;display:block;margin:8px auto" font-family="Arial, sans-serif">
    <ellipse cx="90" cy="62" rx="62" ry="44" fill="#FFFFFF" stroke="#4D4D4F" stroke-width="2"/>
    <circle cx="90" cy="62" r="20" fill="#F2A900" stroke="#4D4D4F" stroke-width="2"/>
    <ellipse cx="260" cy="62" rx="62" ry="44" fill="#FFFFFF" stroke="#4D4D4F" stroke-width="2"/>
    <circle cx="260" cy="62" r="20" fill="none" stroke="#9A9A9C" stroke-width="2" stroke-dasharray="4 3"/>
    <ellipse cx="222" cy="46" rx="9" ry="5" fill="#1F6B2E"/><ellipse cx="300" cy="50" rx="9" ry="5" fill="#1F6B2E"/><ellipse cx="226" cy="86" rx="9" ry="5" fill="#1F6B2E"/><ellipse cx="296" cy="88" rx="9" ry="5" fill="#1F6B2E"/>
    <rect x="368" y="20" width="124" height="84" rx="34" fill="#FBEBCB" stroke="#4D4D4F" stroke-width="2"/>
    <text x="430" y="68" text-anchor="middle" font-size="14" fill="#4D4D4F">womb</text>
    <g font-size="13" fill="#4D4D4F" text-anchor="middle">
      <text x="90" y="128" font-weight="bold">Goat A (donor)</text><text x="90" y="145">gives the nucleus</text><text x="90" y="162">= nuclear DNA</text><text x="90" y="179">(full body-cell set)</text>
      <text x="260" y="128" font-weight="bold">Goat B (egg donor)</text><text x="260" y="145">gives the cytoplasm</text><text x="260" y="162">with mitochondria = mtDNA</text><text x="260" y="179">(own nucleus removed)</text>
      <text x="430" y="128" font-weight="bold">Goat C (surrogate)</text><text x="430" y="145">gives only the womb</text><text x="430" y="162">= no DNA to the kid</text>
    </g></svg>`,'Who gives what in a cloned kid. The gold circle is the donor nucleus; the green ovals are mitochondria.')}
  <p>The donor nucleus comes from a body cell, so it carries the full body-cell set of chromosomes, not half a set.</p>
  <div class="worked"><span class="lbl">Worked example: who is the kid like?</span>
    <div class="step-line">Nuclear DNA (genes for appearance and body): from the nucleus, so from goat A.</div>
    <div class="step-line">Mitochondrial DNA: in the egg cytoplasm, so from goat B.</div>
    <div class="step-line ans">Goat C carries the embryo but gives it no DNA.</div></div>
  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>The clone is <b>not</b> 100% identical to the donor. Its nuclear DNA matches the donor, but its mitochondrial DNA matches the egg donor. The surrogate gives it no DNA.</p></div>`},
  qs:[
  {type:'order', stem:`A horse is cloned by nuclear transfer. Put the steps in the correct order.`,
   items:['A small electric current prompts the egg to start dividing','A foal with the skin-cell donor\'s nuclear DNA is born','A skin cell is taken from the horse to be copied, and a donor egg has its nucleus removed','The young embryo is placed in the womb of a mare','The skin-cell nucleus is moved into the egg'],
   ans:[3,5,1,4,2],
   hint:'Prepare the cells, combine them, start division, implant, birth.',
   sol:`<div class="step-line">1. A skin cell is taken from the horse to be copied, and a donor egg has its nucleus removed.</div><div class="step-line">2. The skin-cell nucleus is moved into the egg.</div><div class="step-line">3. A small electric current prompts the egg to start dividing.</div><div class="step-line">4. The young embryo is placed in the womb of a mare.</div><div class="step-line ans">5. A foal with the skin-cell donor\'s nuclear DNA is born.</div>`},
  {type:'num', stem:`Body cells of cattle have 60 chromosomes. A nucleus from a cattle body cell is placed in an egg cell whose own nucleus has been removed. How many chromosomes are in the new cell?`, ans:60, unit:'chromosomes',
   hint:'The donor nucleus comes from a body cell, not a gamete.',
   sol:`<div class="step-line">The egg\'s own nucleus (30 chromosomes) is gone.</div><div class="step-line">The donor nucleus comes from a body cell, so it carries the full set of 60.</div><div class="step-line ans">Answer: 60 chromosomes</div>`},
  {type:'text', stem:`What word describes an egg cell from which the nucleus has been removed?`, ans:'enucleated', anyCase:true, accept:['enucleate','enucleated egg','enucleated egg cell','an enucleated egg','enucleated cell','denucleated','anucleate'], ph:'one word',
   hint:'It contains the word "nucleus".',
   sol:`<div class="step-line">An egg with its nucleus removed is enucleated.</div><div class="step-line ans">Answer: enucleated</div>`},
  {type:'mc', stem:`Which of these is a <b>natural</b> clone?`,
   opts:['Identical twins formed when one zygote splits in two','Non-identical twins formed from two separate eggs','Two siblings born one year apart to the same parents','A mule produced by crossing a horse and a donkey'], ans:0,
   hint:'A natural clone is genetically identical.',
   sol:`<div class="step-line">Identical twins come from one fertilised egg, so their genes are identical.</div><div class="step-line">Non-identical twins, siblings and a mule all arise from separate fertilisations, so they are not identical.</div><div class="step-line ans">Answer: Identical twins formed when one zygote splits in two</div>`},
  {type:'mc', stem:`A calf is cloned. The nucleus came from a body cell of cow X. The egg came from cow Y and its own nucleus was removed. The embryo grew in cow Z. Why is the calf <b>not</b> genetically identical to cow X in every respect?`,
   opts:['Its mitochondrial DNA comes from the egg of cow Y, not from cow X','Its nuclear DNA is a mixture of the nuclear DNA of cows X and Y','Cow Z passes some nuclear genes to the calf during pregnancy','The electric pulse changes some nuclear genes so they differ from cow X'], ans:0,
   hint:'Mitochondria sit in the cytoplasm of the egg.',
   sol:`<div class="step-line">The nuclear DNA is entirely from the donor nucleus, so it matches cow X.</div><div class="step-line">The egg supplied the cytoplasm, including the mitochondria, so the mitochondrial DNA matches cow Y.</div><div class="step-line">Cow Z only carries the embryo and gives it no DNA, and the electric pulse does not rewrite genes.</div><div class="step-line ans">Answer: Its mitochondrial DNA comes from the egg of cow Y, not from cow X</div>`}
  ]},
/* ===================== LEVEL 7 ===================== */
{ id:7, name:'Stem cells and their uses', short:'Stem cells',
  teach:{ h:'Stem cells can divide and become specialised',
  b:`<p>A stem cell is an unspecialised cell that can divide and then change into one or more kinds of specialised cell. The change into a specialised cell is called <b>differentiation</b>.</p>
  ${cards([
    {t:'Embryonic stem cells', d:'Taken from a very young embryo. They are <b>pluripotent</b>: they can become almost any type of body cell. Getting them destroys the embryo, which raises ethical objections.', hi:true},
    {t:'Adult stem cells', d:'Found in tissues such as bone marrow. They are <b>multipotent</b>: they can become only a limited range of related cell types, for example blood cells.'},
    {t:'Umbilical cord blood', d:'Blood collected from the umbilical cord after a baby is born. It contains blood-forming stem cells, and collecting it does not harm the baby.'}
  ])}
  <p>Uses: a bone marrow or cord blood transplant replaces diseased blood-forming cells in a patient with leukaemia (a cancer of the blood-forming tissue), and stem cells are used in research to study how tissues develop and how diseases begin.</p>
  <div class="worked"><span class="lbl">Worked example: why only blood cells?</span>
    <div class="step-line">A stem cell in the bone marrow divides again and again.</div>
    <div class="step-line">Its daughter cells can become red blood cells, white blood cells or platelets.</div>
    <div class="step-line">They never become nerve cells or muscle cells.</div>
    <div class="step-line ans">Bone marrow stem cells have a limited range: blood cell types only.</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>Pluripotent means almost any cell type (embryonic). Multipotent means a limited range (adult, such as bone marrow). Both can divide and both become specialised by differentiation.</p></div>
  ${keyterms([['stem cell','an unspecialised cell that can divide and specialise'],['differentiation','becoming a specialised cell'],['pluripotent','able to form almost any cell type'],['multipotent','able to form a limited range of cell types'],['bone marrow','soft tissue inside bones where blood cells form'],['leukaemia','cancer of the blood-forming tissue']])}`},
  reteach:{ h:'Three sources side by side',
  b:`<p><i>Recall:</i> in cloning, the donor nucleus came from a body cell with the full set of chromosomes. A stem cell is also a body cell, but one that has not yet specialised.</p>
  <p>To choose a source, ask these questions in turn.</p>
  ${contrast('Ask yourself','If yes, use',[
    ['Do I need only blood cell types, for example to treat leukaemia?','Bone marrow or cord blood stem cells'],
    ['Must I avoid destroying an embryo?','Adult or cord blood sources: the donor is not harmed'],
    ['Do I need several different tissues, for example to test a drug on them?','Early embryo stem cells, accepting the ethical objection']
  ])}
  <div class="worked"><span class="lbl">Worked example: choose the source</span>
    <div class="step-line">Need: replacement blood-forming cells for a patient whose own marrow is diseased.</div>
    <div class="step-line">Only blood cell types are needed, so a source limited to blood cells is enough.</div>
    <div class="step-line">Bone marrow or cord blood meets the need, and neither requires an embryo to be destroyed.</div>
    <div class="step-line ans">Choose bone marrow or cord blood stem cells.</div></div>
  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Cord blood and bone marrow stem cells are <b>not</b> able to become every cell type. Do not call them pluripotent.</p></div>`},
  qs:[
  {type:'mc', stem:`What is a stem cell?`,
   opts:['An unspecialised cell able to divide and form specialised cells','A fully specialised cell that has lost the ability to divide again','A cell that is found only in embryos and disappears at birth','A cell that makes insulin and releases it into the blood'], ans:0,
   hint:'Think about what the cell can do that a nerve cell cannot.',
   sol:`<div class="step-line">A stem cell is unspecialised, can divide, and can become specialised.</div><div class="step-line">Adults also have stem cells (for example in bone marrow), and a stem cell is not defined by making insulin.</div><div class="step-line ans">Answer: An unspecialised cell able to divide and form specialised cells</div>`},
  {type:'mc', stem:`A team wants to grow heart muscle, nerve and skin cells from one kind of starting cell. Which source of stem cells is the most suitable?`,
   opts:['The early embryo, because its stem cells are pluripotent and versatile','Bone marrow, because its stem cells keep dividing throughout adult life','Cord blood, because collecting it harms neither the baby nor an embryo','Skin tissue, because its cells are specialised and easy to collect'], ans:0,
   hint:'Which source can become almost any cell type?',
   sol:`<div class="step-line">Pluripotent embryonic stem cells can become almost any cell type, so they can give heart, nerve and skin cells.</div><div class="step-line">Bone marrow and cord blood stem cells are multipotent, so they are limited to blood cell types, even though they divide and are ethically easier. Skin cells are already specialised and are not stem cells.</div><div class="step-line ans">Answer: The early embryo, because its stem cells are pluripotent and versatile</div>`},
  {type:'text', stem:`What name is given to the process in which a stem cell becomes a specialised cell?`, ans:'differentiation', anyCase:true, accept:['differentiate','differentiating','cell differentiation','specialisation','specialization','cell specialisation'], ph:'one word',
   hint:'The cell becomes different from the stem cell it came from.',
   sol:`<div class="step-line">When a stem cell takes on the structure and job of a specialised cell, it differentiates.</div><div class="step-line ans">Answer: differentiation</div>`},
  {type:'mc', stem:`Which is the main <b>ethical</b> objection to using embryonic stem cells?`,
   opts:['Obtaining them destroys an early embryo, which some regard as a person','They can form tumours when they are put back into a patient after treatment','They are taken from adult donors who are unable to give informed consent','They cannot specialise, so research on them gives no useful results'], ans:0,
   hint:'Think about what must happen to the embryo.',
   sol:`<div class="step-line">Embryonic stem cells are taken from an early embryo, which is destroyed. People who believe the embryo has moral status object.</div><div class="step-line">Tumour formation is a safety risk, not an ethical objection. The cells are not taken from adults, and they are useful because they can specialise.</div><div class="step-line ans">Answer: Obtaining them destroys an early embryo, which some regard as a person</div>`},
  {type:'mc', stem:`Evaluate this statement: "Using stem cells from umbilical cord blood is ethically more acceptable than using embryonic stem cells." Which reason best <b>supports</b> it?`,
   opts:['Cord blood is collected after birth with no embryo destroyed and no harm to the baby','Cord blood stem cells are pluripotent, so they can replace any tissue in the whole body','Cord blood is usually a good match for the baby\'s own family, so rejection is less likely','Cord blood stem cells are multipotent, so they can treat only blood disorders'], ans:0,
   hint:'The statement is about ethics, not about what the cells can become.',
   sol:`<div class="step-line">The ethical concern is the destruction of an embryo. Cord blood is collected after birth, so that concern does not arise.</div><div class="step-line">Cord blood stem cells are multipotent, not pluripotent. A good match and a limited range of uses are medical points, not ethical ones.</div><div class="step-line ans">Answer: Cord blood is collected after birth with no embryo destroyed and no harm to the baby</div>`}
  ]},

/* ===================== LEVEL 8 ===================== */
{ id:8, name:'DNA profiling and its limits', short:'DNA profiling',
  teach:{ h:'A DNA profile is a pattern of bands that can be compared',
  b:`<p>Everyone except identical twins has a different pattern of DNA fragments, so comparing patterns can show whether two samples came from the same person or from relatives.</p>
  ${vis(flow(['DNA is extracted from cells','DNA is cut into fragments by restriction enzymes','Fragments are separated by gel electrophoresis','Band patterns are compared']),'Making a DNA profile. Small fragments move further through the gel than large ones.')}
  <p>The bands differ because people carry different numbers of short repeated sequences in their non-coding DNA, so their fragments differ in length.</p>
  <p>A child inherits half of its bands from the mother and half from the father, so every band in the child must appear in one parent.</p>
  ${vis(gelLanes([{n:'Mother',bands:[2,5,8]},{n:'Child',bands:[2,7]},{n:'Man A',bands:[3,7,9]},{n:'Man B',bands:[1,4,6]}]),'A paternity test. Each gold band is a DNA fragment.')}
  <div class="worked"><span class="lbl">Worked example: reading a paternity gel</span>
    <div class="step-line">The child has bands at 2 and 7.</div>
    <div class="step-line">Band 2 is also in the mother\'s lane, so it came from her.</div>
    <div class="step-line">Band 7 is not in the mother, so it must come from the father. Man A has a band at 7, but Man B does not.</div>
    <div class="step-line ans">Man A could be the father; Man B is excluded.</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>A match means every band lines up. A match shows the DNA could be the person\'s, not that the person is guilty.</p></div>
  ${cards([{t:'Uses', d:'Paternity tests, forensics, identifying remains, and conservation: RhODIS is a South African database of rhino DNA profiles that helps link seized horn to a poached rhino.'},{t:'Limits', d:'Identical twins share a profile; samples can be contaminated or degraded; a partial profile is weaker evidence; DNA information raises privacy issues.'}])}
  ${keyterms([['DNA profile','a pattern of DNA fragments that identifies an individual'],['gel electrophoresis','separating DNA fragments by size in a gel'],['restriction enzyme','cuts the DNA into fragments'],['contamination','unwanted DNA getting into a sample'],['paternity test','a test to find a child\'s father'],['forensic','using science to solve crimes']])}`},
  reteach:{ h:'Read a crime-scene gel by elimination',
  b:`<p><i>Recall:</i> the fragments in the gel come from cutting DNA with restriction enzymes, the same tools used to make a recombinant plasmid.</p>
  <p>To find a match, take the crime-scene lane and test each suspect. Throw out a suspect as soon as one band does not fit.</p>
  ${vis(gelLanes([{n:'Scene',bands:[1,4,7,9]},{n:'Suspect A',bands:[1,4,7]},{n:'Suspect B',bands:[2,4,7,9]},{n:'Suspect C',bands:[1,4,7,9]},{n:'Suspect D',bands:[1,3,7,9]}]),'Crime-scene sample compared with four suspects')}
  ${contrast3(['Suspect','Check against the scene','Result'],[
    ['A','Has bands 1, 4, 7 but no band at 9','Excluded: a band is missing'],
    ['B','Band at 2 instead of 1','Excluded: a band is in the wrong place'],
    ['D','Band at 3 instead of 4','Excluded: bands in the wrong place']
  ])}
  <div class="worked"><span class="lbl">Worked example: the one that is left</span>
    <div class="step-line">A, B and D each differ from the scene at one band.</div>
    <div class="step-line">Only one suspect has bands at exactly 1, 4, 7 and 9.</div>
    <div class="step-line ans">That suspect matches the scene sample.</div></div>
  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>A match shows the suspect\'s DNA <b>could</b> have come from the scene. It does not prove the suspect committed the crime, because the DNA could have been left earlier, or by an identical twin, and a partial profile could match more than one person.</p></div>`},
  qs:[
  {type:'mc', stem:`The gel shows a mother, her child and two men. Which man could be the father?`,
   v:vis(gelLanes([{n:'Mother',bands:[3,6]},{n:'Child',bands:[3,8]},{n:'Man 1',bands:[1,8]},{n:'Man 2',bands:[2,6]}]),'Paternity test'),
   opts:['Man 1','Man 2','Both men','Neither man'], ans:0,
   hint:'Find the child\'s band that did not come from the mother.',
   sol:`<div class="step-line">The child\'s band at 3 matches the mother, so it is hers.</div><div class="step-line">The band at 8 is not in the mother, so it came from the father. Man 1 has a band at 8, but Man 2 has bands at 2 and 6, so he cannot supply it.</div><div class="step-line">Man 2 shares band 6 with the mother, which does not help: the child does not have it.</div><div class="step-line ans">Answer: Man 1</div>`},
  {type:'mc', stem:`The gel shows DNA from a crime scene and three suspects. Which suspect\'s DNA matches the crime-scene sample?`,
   v:vis(gelLanes([{n:'Scene',bands:[2,5,8]},{n:'Suspect 1',bands:[2,6,8]},{n:'Suspect 2',bands:[2,5,8]},{n:'Suspect 3',bands:[3,5,9]}]),'DNA profiles'),
   opts:['Suspect 1','Suspect 2','Suspect 3','None of them'], ans:1,
   hint:'Every band must line up at the same level.',
   sol:`<div class="step-line">Scene bands: 2, 5, 8.</div><div class="step-line">Suspect 1 has 2, 6, 8, so the middle band is in the wrong place. Suspect 3 has 3, 5, 9, so two bands are wrong.</div><div class="step-line">Suspect 2 has 2, 5, 8, so all three bands line up.</div><div class="step-line ans">Answer: Suspect 2</div>`},
  {type:'text', stem:`Name the technique used to separate DNA fragments by size in a DNA profile.`, ans:'gel electrophoresis', anyCase:true, accept:['electrophoresis','agarose gel electrophoresis','gel-electrophoresis'], ph:'two words',
   hint:'An electric current pulls the fragments through a gel.',
   sol:`<div class="step-line">DNA fragments are placed in a gel and an electric current moves them. Small fragments travel further.</div><div class="step-line ans">Answer: gel electrophoresis</div>`},
  {type:'mc', stem:`Why can DNA profiling <b>not</b> tell identical twins apart?`,
   opts:['They developed from one zygote, so their nuclear DNA is identical','They always have the same fingerprints, so the gel cannot separate them','Their DNA is too similar to cut with a restriction enzyme','They are born at the same time, so their DNA is not fully formed'], ans:0,
   hint:'Think about how identical twins form.',
   sol:`<div class="step-line">Identical twins come from one zygote that splits, so their DNA is the same, and so is their DNA profile.</div><div class="step-line">Their DNA can be cut by enzymes, and it is fully formed at birth.</div><div class="step-line ans">Answer: They developed from one zygote, so their nuclear DNA is identical</div>`},
  {type:'mc', stem:`A lawyer says: "The DNA profile from the scene matches my client, so my client is guilty." Which response is the best <b>evaluation</b>?`,
   opts:['A match shows the DNA could be his, but contamination or a twin must be weighed up first','Correct: a matching profile is strong evidence that the client was present and guilty','Wrong: DNA from a crime scene is valid evidence only when a witness also saw the client','Partly correct: the match shows he left the DNA, but only the time of the crime is uncertain'], ans:0,
   hint:'A good evaluation names a strength and a limitation.',
   sol:`<div class="step-line">A matching profile is strong evidence that the DNA could have come from the client. It shows the client\'s DNA was present, not when it was left or that the client committed the crime.</div><div class="step-line">Limits include contamination, degraded or partial samples, and an identical twin, who would share the profile. DNA evidence does not need a witness, and the time it was left is not the only uncertainty.</div><div class="step-line ans">Answer: A match shows the DNA could be his, but contamination or a twin must be weighed up first</div>`}
  ]},

/* ===================== LEVEL 9 ===================== */
{ id:9, name:'Mitochondrial DNA and the maternal line', short:'mtDNA and ancestry',
  teach:{ h:'Mitochondrial DNA is passed on through mothers only',
  b:`<p>Mitochondria have their own small circular DNA, called mtDNA. You inherit your mtDNA from your mother only, because the zygote\'s mitochondria come from the egg cytoplasm and the sperm\'s mitochondria do not contribute.</p>
  ${vis(pedigree({gens:[[{id:'I-1',s:'m'},{id:'I-2',s:'f',a:true}],[{id:'II-1',s:'f',a:true},{id:'II-3',s:'m'},{id:'II-2',s:'m',a:true},{id:'II-4',s:'f'}],[{id:'III-1',s:'f',a:true},{id:'III-2',s:'m',a:true},{id:'III-3',s:'f'},{id:'III-4',s:'m'}]],mates:[['I-1','I-2'],['II-1','II-3'],['II-2','II-4']],kids:[{p:['I-1','I-2'],c:['II-1','II-2']},{p:['II-1','II-3'],c:['III-1','III-2']},{p:['II-2','II-4'],c:['III-3','III-4']}],legend:false}),'Shaded symbols have the same mtDNA as I-2. Men carry it but do not pass it on.')}
  <div class="worked"><span class="lbl">Worked example: follow the line of mothers</span>
    <div class="step-line">I-2 passes her mtDNA to both children, II-1 and II-2.</div>
    <div class="step-line">II-1 (a woman) passes it to III-1 and III-2.</div>
    <div class="step-line">II-2 (a man) does <b>not</b> pass it to III-3 or III-4: their mother, II-4, supplied theirs.</div>
    <div class="step-line ans">In generation III, only III-1 and III-2 share I-2\'s mtDNA.</div></div>
  <p>Uses: tracing ancestry along the maternal line, identifying remains by comparing with a maternal relative, and studying human evolution. Mutations build up in mtDNA at a roughly steady rate, like a molecular clock, so the more differences between two lineages, the longer ago they shared a common ancestor. A population with more variety in its mtDNA has therefore had longer to build that variety up, so its lineages are older.</p>
  <div class="callout"><span class="lbl">Rule</span><p>mtDNA: mother to all her children, but only her daughters pass it on. A person shares their mtDNA with their mother, siblings and maternal relatives.</p></div>
  ${keyterms([['mtDNA','small circular DNA inside mitochondria'],['maternal line','the line of descent from mother to mother'],['haplogroup','a group of people with a shared mtDNA ancestor'],['molecular clock','using mutation rate to estimate time since lineages split'],['mutation','a change in DNA base sequence'],['common ancestor','an ancestor shared by two lineages']])}`},
  reteach:{ h:'Which relatives share your mtDNA?',
  b:`<p>Start with yourself and walk up the mothers. Everyone on that line, and everyone she gave birth to, shares your mtDNA.</p>
  ${chain(['You','Your mother (she gave it to you)','Her mother (your maternal grandmother)','Her mother, and so on back in time'],{hi:1})}
  ${contrast('Shares your mtDNA','Does not share your mtDNA',[
    ['Your mother','Your father'],
    ['Your brothers and sisters','Your father\'s mother'],
    ['Your mother\'s sister and her children','Your mother\'s brother\'s children'],
    ['Your maternal grandmother','Your own children, if you are a man']
  ])}
  <div class="worked"><span class="lbl">Worked example: Anele\'s family</span>
    <div class="step-line">Anele (a woman) has a son, Kabelo, and a daughter, Naledi.</div>
    <div class="step-line">Kabelo has two children. Naledi has one child.</div>
    <div class="step-line">Anele passes her mtDNA to Kabelo and Naledi. Naledi passes it to her one child. Kabelo\'s children get theirs from their own mother.</div>
    <div class="step-line ans">Anele\'s mtDNA is carried by Kabelo, Naledi and Naledi\'s child: 3 people.</div></div>
  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>A man has his mother\'s mtDNA but his children do not get it from him. A mother\'s brother shares your mtDNA, but his children do not.</p></div>`},
  qs:[
  {type:'mc', stem:`Sipho is a boy. Which of these people has the <b>same</b> mtDNA as Sipho?`,
   opts:['His sister, who has the same mother as he does','His father, who is married to Sipho\'s mother','His father\'s mother, who is Sipho\'s grandmother','His own daughter, if Sipho has one later'], ans:0,
   hint:'mtDNA follows the mother.',
   sol:`<div class="step-line">Sipho and his sister both inherited mtDNA from their mother, so they share it.</div><div class="step-line">His father got mtDNA from the father\'s own mother. Sipho\'s own daughter will get hers from her mother, not from Sipho.</div><div class="step-line ans">Answer: His sister, who has the same mother as he does</div>`},
  {type:'text', stem:`mtDNA is found in an organelle that releases energy from glucose. Name this organelle.`, ans:'mitochondria', anyCase:true, accept:['mitochondrion','the mitochondria','mitochondrial','mitochondrions'], ph:'one word',
   hint:'The "mt" in mtDNA stands for this organelle.',
   sol:`<div class="step-line">mtDNA is the DNA of the mitochondria, the organelles where cellular respiration releases energy.</div><div class="step-line ans">Answer: mitochondria</div>`},
  {type:'mc', stem:`Why is mtDNA inherited from the <b>mother</b> only?`,
   opts:['The zygote\'s mitochondria come from the egg; sperm mitochondria do not contribute','The mother\'s mitochondria carry fewer mutations, so the zygote copies only her mtDNA','Fathers\' mtDNA is identical to the mother\'s, so it cannot be told apart in the zygote','The sperm cell is haploid, so it cannot carry any mitochondria into the egg cell'], ans:0,
   hint:'Think about what the sperm adds to the zygote.',
   sol:`<div class="step-line">The egg supplies the cytoplasm and mitochondria of the zygote. Mitochondria from the sperm do not contribute.</div><div class="step-line">Fathers do have mitochondria and mtDNA. They just do not pass it on. Mutation numbers and similarity of mtDNA play no part, and being haploid does not explain it.</div><div class="step-line ans">Answer: The zygote\'s mitochondria come from the egg; sperm mitochondria do not contribute</div>`},
  {type:'num', stem:`The woman I-2 (shaded) is the ancestor. How many individuals in generation <b>III</b> carry her mtDNA?`,
   v:vis(pedigree({gens:[[{id:'I-1',s:'m'},{id:'I-2',s:'f',a:true}],[{id:'II-1',s:'f'},{id:'II-4',s:'m'},{id:'II-2',s:'f'},{id:'II-5',s:'m'},{id:'II-3',s:'m'},{id:'II-6',s:'f'}],[{id:'III-1',s:'f'},{id:'III-2',s:'m'},{id:'III-3',s:'f'},{id:'III-4',s:'m'},{id:'III-5',s:'f'},{id:'III-6',s:'m'}]],mates:[['I-1','I-2'],['II-1','II-4'],['II-2','II-5'],['II-3','II-6']],kids:[{p:['I-1','I-2'],c:['II-1','II-2','II-3']},{p:['II-1','II-4'],c:['III-1','III-2','III-3']},{p:['II-2','II-5'],c:['III-4']},{p:['II-3','II-6'],c:['III-5','III-6']}],legend:false}),'Only I-2 is shaded. II-1, II-2 and II-3 are her children.'),
   ans:4, unit:'individuals',
   hint:'Only daughters pass it on, so check each mother in generation II.',
   sol:`<div class="step-line">I-2\'s children are II-1 (female), II-2 (female) and II-3 (male). All three carry her mtDNA.</div><div class="step-line">II-1 has 3 children, and II-2 has 1 child, so these 4 carry it.</div><div class="step-line">II-3 is male, so his 2 children (III-5 and III-6) got their mtDNA from II-6.</div><div class="step-line ans">Answer: 4 individuals</div>`},
  {type:'mc', stem:`The table shows <b>illustrative</b> data: the number of different mtDNA sequences found in a sample of 100 people from each region. Which conclusion is best supported, if mutations build up at a steady rate?`,
   v:vis(dataTable(['Region','Different mtDNA sequences in 100 people'],[['Africa','62'],['Europe','35'],['Asia','41'],['Americas','18']],{w:420}),'Illustrative data, not real results'),
   opts:['The African mtDNA lineages are the oldest, because they have had longest to build up mutations','Mutations happen faster in Africa than elsewhere, which explains the higher number of sequences','The Americas have the oldest lineages, because fewer sequences means more time to become uniform','All regions have equally old lineages, because every person inherits mtDNA from a mother'], ans:0,
   hint:'Mutations build up over time, like a molecular clock.',
   sol:`<div class="step-line">If mutations accumulate at a roughly steady rate, the region with the most variation (Africa, 62) has had the longest time to build it up, so its lineages are the oldest.</div><div class="step-line">The clock assumes the same mutation rate everywhere, so a faster rate in Africa is not supported. Less variation (the Americas, 18) means a younger population, not an older one. The regions clearly differ in variation, so they are not equally old.</div><div class="step-line ans">Answer: The African mtDNA lineages are the oldest, because they have had longest to build up mutations</div>`}
  ]},

/* ===================== LEVEL 10 ===================== */
{ id:10, name:'The Human Genome Project and gene therapy', short:'Genome project, gene therapy',
  teach:{ h:'We can read the human genome, and perhaps repair faulty genes',
  b:`<p>The Human Genome Project (1990 to 2003) was an international project that worked out the sequence of almost all the bases in human DNA: about 3 billion base pairs and about 20 000 genes.</p>
  ${cards([
    {t:'Finding disease genes', d:'Knowing where genes are helps scientists find the genes linked to inherited conditions and design genetic tests.'},
    {t:'Personalised medicine', d:'Treatment can be matched to a person\'s genes, so the drug and dose suit them.'},
    {t:'Comparing species', d:'Human DNA can be compared with other species to study evolution.'}
  ])}
  <p>Gene therapy tries to treat an inherited disorder by giving cells a working copy of a gene. The copy is carried into the patient\'s cells by a vector, often a modified virus with its disease-causing genes removed. Trials have been run for conditions such as cystic fibrosis.</p>
  ${vis(flow(['A working copy of the gene is made','It is placed in a vector (a modified virus)','The vector delivers the gene into body cells','The cells make the missing protein']),'Gene therapy')}
  <div class="worked"><span class="lbl">Worked example: will the children inherit it?</span>
    <div class="step-line">A patient receives a working gene in the cells of the lungs only.</div>
    <div class="step-line">Eggs and sperm are made in the ovaries or testes, which were not changed.</div>
    <div class="step-line">The gametes still carry the original faulty allele.</div>
    <div class="step-line ans">The treatment is not passed on to the patient\'s children.</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>The genome is all of an organism\'s DNA. Reading it lets us find disease genes and personalise treatment; gene therapy adds a working gene using a vector. Ethical issues include privacy, insurance discrimination and "designer babies".</p></div>
  ${keyterms([['genome','all the DNA of an organism'],['gene therapy','giving cells a working copy of a gene'],['vector','carries the gene into the cells'],['personalised medicine','treatment matched to a person\'s genes'],['genetic testing','checking DNA for disease-linked alleles'],['designer baby','an embryo chosen or changed to select traits']])}`},
  reteach:{ h:'Benefits and risks side by side',
  b:`<p><i>Recall:</i> a DNA profile or mtDNA can identify a person, so genetic information is personal. That is why privacy matters in this level.</p>
  ${contrast3(['Term','What it is','What it does'],[
    ['HGP','The international project of 1990 to 2003','Worked out the sequence of almost all human DNA'],
    ['Gene therapy','A treatment for an inherited disorder','Gives cells a working copy of the faulty gene'],
    ['Vector','A carrier, often a modified virus','Delivers the working gene into the cells'],
    ['Personalised medicine','Treatment matched to a person\'s genes','Chooses the drug and dose that suit them']
  ])}
  ${contrast('Benefits','Risks and ethical concerns',[
    ['Genes for inherited diseases can be found and tested for early','A person\'s genetic information is private and could be misused'],
    ['Drugs and doses can be matched to a person\'s genes','Genetic information could be used to discriminate against people'],
    ['Gene therapy may treat a disorder at its cause','The vector may trigger an immune reaction, and the treatment may not work'],
    ['Sequence data helps research into evolution','Choosing traits in embryos (designer babies) raises serious ethical questions']
  ])}
  <div class="worked"><span class="lbl">Worked example: weigh one case</span>
    <div class="step-line">Case: a genetic test shows a person carries an allele linked to a condition that may appear late in life.</div>
    <div class="step-line">Benefit: the person can seek early advice and monitoring.</div>
    <div class="step-line">Risk: the person may worry for years, and others could misuse the result.</div>
    <div class="step-line ans">Judgement: the test is useful if the person chooses it and the result stays private.</div></div>
  <div class="callout"><span class="lbl">Memory hook</span><p>Every benefit of reading human DNA has a mirror-image risk, and the risk is usually about who gets to see or use the information.</p></div>`},
  qs:[
  {type:'mc', stem:`What was the main aim of the international project that read human DNA?`,
   opts:['To work out the sequence of almost all the bases in human DNA','To clone a human being from a single body cell','To remove every faulty gene from the human population','To produce human insulin using genetically engineered bacteria'], ans:0,
   hint:'Think about what "sequencing" means.',
   sol:`<div class="step-line">The project determined the sequence of almost all the bases in the human genome.</div><div class="step-line">It did not clone anyone, remove genes from people, or make insulin.</div><div class="step-line ans">Answer: To work out the sequence of almost all the bases in human DNA</div>`},
  {type:'text', stem:`What term describes all of the DNA of an organism?`, ans:'genome', anyCase:true, accept:['the genome','genomes','human genome','the human genome','genomic dna'], ph:'one word',
   hint:'Complete the name of the project: the Human ___ Project.',
   sol:`<div class="step-line">The full set of an organism\'s DNA is its genome.</div><div class="step-line ans">Answer: genome</div>`},
  {type:'num', stem:`The international project that sequenced human DNA began in 1990 and was completed in 2003. For how many years did the project run?`, ans:13, unit:'years',
   hint:'Subtract the start year from the end year.',
   sol:`<div class="step-line">2003 − 1990 = 13.</div><div class="step-line ans">Answer: 13 years</div>`},
  {type:'mc', stem:`In gene therapy, what does the <b>vector</b> (often a modified virus) do?`,
   opts:['It delivers a working copy of the gene into the patient\'s cells','It cuts out the faulty gene from every cell in the patient\'s body','It makes a clone of the patient so that a new body can be grown','It reads the sequence of the genome and prints it for the doctor'], ans:0,
   hint:'A vector is a carrier.',
   sol:`<div class="step-line">A virus can enter cells. With its harmful genes removed, it can deliver a working gene.</div><div class="step-line">A vector does not cut genes out, clone the patient or read the sequence.</div><div class="step-line ans">Answer: It delivers a working copy of the gene into the patient\'s cells</div>`},
  {type:'mc', stem:`An insurance company asks applicants to give the results of their genome tests. Which is the strongest ethical <b>objection</b>?`,
   opts:['People with disease-linked alleles could be refused cover or charged more unfairly','The results could be wrong for some applicants, so cover might be refused by mistake','Sequencing every applicant\'s genome would cost more than the premiums collected','The tests would take so long that most applicants could never be insured at all'], ans:0,
