/* Numbered vertical chain of boxes joined by arrows (HTML). Good for steps of a process.
   chain(['Glucose rises','Pancreas releases insulin','Liver stores glycogen'], {hi:1})
   {hi: index of one box to highlight in gold} */
function chain(items, opt){
  opt = opt || {};
  var out = '<div style="display:flex;flex-direction:column;gap:0;margin:10px 0">';
  items.forEach(function(t, i){
    var hi = opt.hi !== undefined && opt.hi === i;
    out += '<div style="border:2px solid '+(hi?GOLD:LINE)+';background:'+(hi?PALE:WHITE)+';border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.35">'+
         '<span style="display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px;background:'+CHAR+';color:#fff;font-size:12px;font-weight:bold;margin-right:8px">'+(i+1)+'</span>'+t+'</div>';
    if(i < items.length-1) out += '<div style="text-align:center;color:'+GOLD_T+';font-size:18px;line-height:1">&#8595;</div>';
  });
  return out + '</div>';
}

/* Grid of fact cards (HTML). Each card has a bold title t and a description d; hi:true shades it gold.
   cards([{t:'Insulin', d:'Lowers blood glucose'}, {t:'Glucagon', d:'Raises blood glucose', hi:true}], {min:150})
   {min: minimum card width in px, default 150} */
function cards(items, opt){
  opt = opt || {};
  var out = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax('+(opt.min||150)+'px,1fr));gap:8px;margin:10px 0">';
  items.forEach(function(c){
    out += '<div style="border:1.5px solid '+(c.hi?GOLD:LINE)+';background:'+(c.hi?PALE:WHITE)+';border-radius:8px;padding:8px 10px">'+
      '<div style="font-weight:bold;font-size:14px;color:'+CHAR+';margin-bottom:3px">'+c.t+'</div>'+
      '<div style="font-size:13.5px;line-height:1.35;color:'+CHAR+'">'+c.d+'</div></div>';
  });
  return out + '</div>';
}

/* Two-column comparison table (HTML). a and b are the column headings, rows are [left, right] pairs.
   contrast('Mitosis', 'Meiosis', [['One division','Two divisions'], ['Two diploid cells','Four haploid cells']]) */
function contrast(a, b, rows){
  var out = '<table class="rep"><tr><th>'+a+'</th><th>'+b+'</th></tr>';
  rows.forEach(function(r){ out += '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  return out + '</table>';
}

/* Three-column comparison table (HTML). h is an array of 3 headings, rows are arrays of 3 cells.
   contrast3(['Feature','DNA','RNA'], [['Sugar','Deoxyribose','Ribose'], ['Bases','A, T, G, C','A, U, G, C']]) */
function contrast3(h, rows){
  var out = '<table class="rep"><tr><th>'+h[0]+'</th><th>'+h[1]+'</th><th>'+h[2]+'</th></tr>';
  rows.forEach(function(r){ out += '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'; });
  return out + '</table>';
}

/* Key-terms box (HTML) listing 4 to 8 terms the examiner expects, with a short meaning each.
   keyterms([['allele','one form of a gene'], ['genotype','the alleles an organism carries']])
   keyterms(pairs, 'Words to know')  <- optional second argument replaces the title "Key terms" */
function keyterms(pairs, title){
  var out = '<div style="border:1.5px solid '+GOLD+';border-radius:8px;padding:10px 12px;margin:12px 0;background:#FFFDF7">'+
    '<div style="font-weight:bold;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:'+GOLD_T+';margin-bottom:6px">'+(title||'Key terms')+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:3px 14px;font-size:14px;line-height:1.4">';
  pairs.forEach(function(p){ out += '<div><b>'+p[0]+'</b><span style="color:'+GREY_L+'">: '+p[1]+'</span></div>'; });
  return out + '</div></div>';
}

/* Scale between two poles with a gold marker (SVG). pos runs from 0 (left pole) to 1 (right pole).
   arrowScale('Low pH', 'High pH', 0.8, {label:'blood after a meal'}) */
function arrowScale(left, right, pos, opt){
  opt = opt || {};
  var w = 560, h = 82, x1 = 20, x2 = 540, mx = x1 + (x2-x1)*pos;
  var s = '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:'+w+'px;display:block;margin:6px auto" font-family="Arial, sans-serif">';
  s += '<line x1="'+x1+'" y1="40" x2="'+x2+'" y2="40" stroke="'+CHAR+'" stroke-width="3"/>';
  s += '<polygon points="'+x2+',40 '+(x2-12)+',33 '+(x2-12)+',47" fill="'+CHAR+'"/><polygon points="'+x1+',40 '+(x1+12)+',33 '+(x1+12)+',47" fill="'+CHAR+'"/>';
  s += '<text x="'+x1+'" y="70" text-anchor="start" font-size="13" font-weight="bold" fill="'+CHAR+'">'+left+'</text>';
  s += '<text x="'+x2+'" y="70" text-anchor="end" font-size="13" font-weight="bold" fill="'+CHAR+'">'+right+'</text>';
  s += '<circle cx="'+mx.toFixed(1)+'" cy="40" r="10" fill="'+GOLD+'" stroke="'+GOLD_T+'" stroke-width="2"/>';
  if(opt.label){
    var anchor = pos < 0.3 ? 'start' : (pos > 0.7 ? 'end' : 'middle');
    s += '<text x="'+mx.toFixed(1)+'" y="18" text-anchor="'+anchor+'" font-size="12.5" fill="'+GOLD_T+'">'+opt.label+'</text>';
  }
  return s + '</svg>';
}

/* =====================================================================
   B. PROCESS DIAGRAMS
   ===================================================================== */

/* Horizontal flow of boxes with arrows (SVG). Up to 4 boxes sit in one row; 5 or 6 wrap onto
   two rows (read left to right, then the next row); more than 6 falls back to the vertical
   chain() (HTML). Text wraps by itself. Keep each item under about 28 characters.
   flow(['DNA in nucleus','mRNA made','mRNA leaves nucleus','Protein built at ribosome'], {hi:1})
   {hi: index of one box to highlight, w: maximum width in px, default 560} */
function flow(items, opt){
  opt = opt || {};
  var n = items.length;
  if(n > 6) return chain(items, {hi: opt.hi});
  var w = 520, perRow = n <= 4 ? n : Math.ceil(n/2), rows = n <= 4 ? 1 : 2;
  var pad = 8, gap = 28, bw = (w - 2*pad - (perRow-1)*gap)/perRow;
  var maxc = Math.floor((bw - 12)/7.7);
  var lines = items.map(function(t){ return _bwrap(t, maxc); });
  var rowH = [], r;
  for(r = 0; r < rows; r++){
    var mx = 1;
    for(var i = r*perRow; i < Math.min(n, (r+1)*perRow); i++) mx = Math.max(mx, lines[i].length);
    rowH.push(16*mx + 16);
  }
  var vgap = 40, top = 6, h = top*2 + rowH.reduce(function(a, b){return a+b;}, 0) + (rows-1)*vgap;
  var s = '', ys = [], y = top;
  rowH.forEach(function(rh){ ys.push(y); y += rh + vgap; });
  var pos = [];
  items.forEach(function(t, i){
    var rr = Math.floor(i/perRow), cc = i % perRow;
    var x = pad + cc*(bw+gap), yy = ys[rr], bh = rowH[rr];
    pos.push({x:x, y:yy, h:bh});
    var on = opt.hi === i;
    s += _brect(x, yy, bw, bh, on ? PALE : WHITE, on ? GOLD : CHAR, on ? 3 : 2, 8);
    s += _bml(x + bw/2, yy + bh/2 - (lines[i].length-1)*8 + 5, lines[i], {fs:14, fw: on ? 'bold' : 'normal'}, 16);
  });
  for(var j = 0; j < n-1; j++){
    var a = pos[j], b = pos[j+1];
    if(Math.floor(j/perRow) === Math.floor((j+1)/perRow)){
      s += _barrow(a.x + bw + 3, a.y + a.h/2, b.x - 3, b.y + b.h/2, GOLD_T, 2.5, 10);
    } else {
      /* elbow from the end of one row to the start of the next */
      var x1 = a.x + bw/2, y1 = a.y + a.h, ym = y1 + vgap/2, x2 = b.x + bw/2;
      s += _bline(x1, y1 + 2, x1, ym, GOLD_T, 2.5) + _bline(x1, ym, x2, ym, GOLD_T, 2.5) + _barrow(x2, ym, x2, b.y - 3, GOLD_T, 2.5, 10);
    }
  }
  return _bsvg(w, h, s, opt.w);
}

/* Items arranged round a circle with arrows between them (SVG), clockwise from the top.
   Use for cycles and feedback loops, 3 to 6 items. Text wraps by itself, keep items short.
   cycle(['Stimulus','Receptor','Control centre','Effector'], {title:'Feedback loop', hi:0})
   {title: text in the middle (wraps), hi: index of one item to highlight} */
function cycle(items, opt){
  opt = opt || {};
  var n = Math.min(6, Math.max(3, items.length)), w = 480, h = 310, cx = w/2, cy = h/2, rx = 160, ry = 112, bw = 128;
  var s = '';
  s += '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="none" stroke="'+LINE+'" stroke-width="3"/>';
  /* arrowheads halfway between items */
  var i, a;
  for(i = 0; i < n; i++){
    a = -Math.PI/2 + (i+0.5)*2*Math.PI/n;
    var px = cx + rx*Math.cos(a), py = cy + ry*Math.sin(a);
    var tx = -rx*Math.sin(a), ty = ry*Math.cos(a), tl = Math.sqrt(tx*tx+ty*ty); tx /= tl; ty /= tl;
    var nx = -ty, ny = tx;
    s += '<polygon points="'+_bf(px + tx*9)+','+_bf(py + ty*9)+' '+_bf(px - tx*7 + nx*8)+','+_bf(py - ty*7 + ny*8)+' '+_bf(px - tx*7 - nx*8)+','+_bf(py - ty*7 - ny*8)+'" fill="'+GOLD_T+'"/>';
  }
  if(opt.title){
    var tl2 = _bwrap(opt.title, 16);
    s += _bml(cx, cy - (tl2.length-1)*9 + 5, tl2, {fs:15, fw:'bold', c:GOLD_T}, 18);
  }
  for(i = 0; i < n; i++){
    a = -Math.PI/2 + i*2*Math.PI/n;
    var x = cx + rx*Math.cos(a), y = cy + ry*Math.sin(a);
    var ln = _bwrap(items[i] || '', 15), bh = 16*ln.length + 14, on = opt.hi === i;
    s += _brect(x - bw/2, y - bh/2, bw, bh, on ? PALE : WHITE, on ? GOLD : CHAR, on ? 3 : 2, 9);
    s += _bml(x, y - (ln.length-1)*8 + 5, ln, {fs:14, fw: on ? 'bold' : 'normal'}, 16);
  }
  return _bsvg(w, h, s, opt.w);
}

/* =====================================================================
   C. GENETICS: Punnett squares, pedigrees, population pyramid
   ===================================================================== */

/* private: split a gamete string into allele tokens. 'Bb' is not a gamete; 'BT' is two alleles
   (one per gene); 'I^A' is one allele with a superscript. */
function _bAlleles(g){ return String(g).match(/[A-Za-z](?:\^[A-Za-z0-9]+)?/g) || []; }
function _bIsLow(tok){ return tok.charAt(0) === tok.charAt(0).toLowerCase(); }
/* private: join two gametes into a genotype token list, capital allele first per gene */
function _bGenotype(g1, g2){
  var a = _bAlleles(g1), b = _bAlleles(g2), out = [];
  for(var i = 0; i < Math.max(a.length, b.length); i++){
    var x = a[i] || '', y = b[i] || '';
    var swap = (_bIsLow(x) && !_bIsLow(y)) || (_bIsLow(x) === _bIsLow(y) && x > y);
    if(swap){ var t = x; x = y; y = t; }
    out.push(x, y);
  }
  return out;
}
/* private: SVG text for a list of allele tokens (superscripts after ^ become small raised text) */
function _bAlText(tokens, x, y, o){
  o = o || {};
  var inner = '', raised = false;
  tokens.forEach(function(tok){
    var p = tok.split('^');
    inner += (raised ? '<tspan dy="4">' : '<tspan>') + p[0] + '</tspan>';
    raised = false;
    if(p[1]){ inner += '<tspan dy="-4" font-size="'+((o.fs||15)*0.68)+'">'+p[1]+'</tspan>'; raised = true; }
  });
  return '<text x="'+_bf(x)+'" y="'+_bf(y)+'" text-anchor="middle" font-size="'+(o.fs||15)+'" font-weight="'+(o.fw||'normal')+'" fill="'+(o.c||CHAR)+'">'+inner+'</text>';
}
function _bPunnett(g1, g2, opt, blank){
  opt = opt || {};
  var cols = g1.length, rows = g2.length, big = Math.max(cols, rows);
  var cs = big <= 2 ? 84 : (big === 3 ? 76 : 68);
  var lw = 46 + (opt.side ? 20 : 0), th = 40 + (opt.top ? 20 : 0);
  var W = lw + cols*cs + 8, H = th + rows*cs + 8, s = '', hi = opt.hi || [], r, c;
  if(opt.top) s += _bt(lw + cols*cs/2, 15, opt.top, {fs:12.5, fw:'bold', c:GREY_L});
  if(opt.side) s += _bt(12, th + rows*cs/2, opt.side, {fs:12.5, fw:'bold', c:GREY_L, rot:-90});
  for(c = 0; c < cols; c++){
    var cx = lw + c*cs + cs/2, cy = th - 20;
    s += _bcirc(cx, cy, 17, PALE, GOLD_T, 2);
    s += _bAlText(_bAlleles(g1[c]), cx, cy + 5, {fs:15, fw:'bold'});
  }
  for(r = 0; r < rows; r++){
    var rx = lw - 24, ry = th + r*cs + cs/2;
    s += _bcirc(rx, ry, 17, PALE, GOLD_T, 2);
    s += _bAlText(_bAlleles(g2[r]), rx, ry + 5, {fs:15, fw:'bold'});
  }
  for(r = 0; r < rows; r++) for(c = 0; c < cols; c++){
    var on = hi.indexOf(r*cols + c) >= 0, x = lw + c*cs, y = th + r*cs;
    s += '<rect x="'+x+'" y="'+y+'" width="'+cs+'" height="'+cs+'" fill="'+(on ? GOLD : WHITE)+'" fill-opacity="'+(on ? 0.55 : 1)+'" stroke="'+CHAR+'" stroke-width="2"/>';
    if(!blank) s += _bAlText(_bGenotype(g1[c], g2[r]), x + cs/2, y + cs/2 + 5.5, {fs: big >= 4 ? 15 : 17, fw:'bold'});
  }
  return _bsvg(W, H, s, opt.w);
}

/* Punnett square with every cell filled in (SVG). g1 goes across the top, g2 down the side; each is an
   array of 1 to 4 gamete strings. Genotypes are written capital allele first for each gene:
   'B'+'b' gives Bb, 'bB' never appears. Dihybrid gametes are two letters (BT, Bt, bT, bt) and give BbTt.
   A multiple allele is written with ^ for the superscript: 'I^A', 'I^B', 'i' give I^AI^B, I^Ai.
   punnett(['B','b'], ['B','b'])
   punnett(['BT','Bt','bT','bt'], ['BT','Bt','bT','bt'], {hi:[0,5], top:'Father gametes', side:'Mother gametes'})
   {hi: cell numbers to shade gold, counted left to right then down, starting at 0;
    top, side: grey captions; w: maximum width in px} */
function punnett(g1, g2, opt){ return _bPunnett(g1, g2, opt, false); }

/* The same square with EMPTY cells, for a question that asks the student to fill it in (SVG).
   punnettBlank(['R','r'], ['r','r'])   Takes the same options as punnett (hi, top, side, w). */
function punnettBlank(g1, g2, opt){ return _bPunnett(g1, g2, opt, true); }

/* Pedigree chart (SVG). Squares are males, circles females. a:true fills the symbol (affected),
   car:true fills half (carrier), d:true draws a slash (deceased), pro:true adds an arrow (proband).
   Each generation is a row, numbered I, II, III on the left; every symbol shows its id below.
   gens   : array of generations, each an array of {id, s:'m'|'f', a, car, d, pro}, in left to right order
   mates  : pairs of ids joined by a marriage line
   kids   : {p:[parentId, parentId], c:[childIds]} sets of siblings hanging from a marriage line
   Children are centred under their parents. Up to 3 generations and 6 symbols per row works well.
   pedigree({gens:[[{id:'I-1',s:'m'},{id:'I-2',s:'f',a:true}],
                   [{id:'II-1',s:'f'},{id:'II-2',s:'m',a:true},{id:'II-3',s:'m'}]],
             mates:[['I-1','I-2']], kids:[{p:['I-1','I-2'], c:['II-1','II-2','II-3']}]})
   Optional spec.ids:false hides the id labels; spec.legend:false hides the key. */
function pedigree(spec){
  var GAP = 56, ROWH = 96, X0 = 62, Y0 = 34, R = 14, ROM = ['I','II','III','IV','V'];
  var info = {}, rows = [];
  spec.gens.forEach(function(g, gi){
    rows[gi] = g.map(function(p, pi){
      var o = {id: p.id || (ROM[gi]+'-'+(pi+1)), s: p.s, a: !!p.a, car: !!p.car, d: !!p.d, pro: !!p.pro, gi: gi, i: pi, x: 0};
      info[o.id] = o; return o;
    });
  });
  var mateOf = {};
  (spec.mates || []).forEach(function(m){ mateOf[m[0]] = m[1]; mateOf[m[1]] = m[0]; });
  /* positions */
  rows.forEach(function(row, gi){
    var des = row.map(function(){ return null; });
    if(gi > 0){
      (spec.kids || []).forEach(function(k){
        var idx = [];
        k.c.forEach(function(id){ if(info[id] && info[id].gi === gi) idx.push(info[id].i); });
        if(!idx.length) return;
        idx.sort(function(a, b){ return a-b; });
        var px = k.p.map(function(id){ return info[id] ? info[id].x : 0; });
        var mid = px.reduce(function(a, b){ return a+b; }, 0)/px.length;
        idx.forEach(function(ci, j){ des[ci] = mid - (idx.length-1)*GAP/2 + j*GAP; });
      });
      row.forEach(function(o, i){
        if(des[i] === null && mateOf[o.id] && info[mateOf[o.id]] && info[mateOf[o.id]].gi === gi){
          var mi = info[mateOf[o.id]].i;
          if(des[mi] !== null) des[i] = des[mi] + (mi < i ? GAP : -GAP);
        }
      });
    }
    row.forEach(function(o, i){
      var d = des[i];
      if(i === 0) o.x = (d === null ? X0 : d);
      else o.x = Math.max(d === null ? 0 : d, row[i-1].x + GAP);
    });
  });
  var minX = 1e9, maxX = -1e9;
  rows.forEach(function(row){ row.forEach(function(o){ minX = Math.min(minX, o.x); maxX = Math.max(maxX, o.x); }); });
  var shift = X0 - minX;
  rows.forEach(function(row){ row.forEach(function(o){ o.x += shift; }); });
  maxX += shift;
  var showId = spec.ids !== false;
  /* legend items */
  var any = {a:false, car:false, d:false, pro:false, m:false, f:false};
  Object.keys(info).forEach(function(k){ var o = info[k]; if(o.a) any.a = true; if(o.car) any.car = true; if(o.d) any.d = true; if(o.pro) any.pro = true; any[o.s] = true; });
  var leg = [];
  if(any.m) leg.push({k:'m', t:'male'});
  if(any.f) leg.push({k:'f', t:'female'});
  if(any.a) leg.push({k:'a', t:'affected'});
  if(any.car) leg.push({k:'car', t:'carrier'});
  if(any.d) leg.push({k:'d', t:'deceased'});
  var legW = 0;
  leg.forEach(function(l){ l.w = 24 + l.t.length*7 + 16; legW += l.w; });
  var showLeg = spec.legend !== false && leg.length > 0;
  var pedW = maxX + 40, W = Math.max(pedW, showLeg ? legW + 24 : 0), off = (W - pedW)/2;
  var G = rows.length, lastY = Y0 + (G-1)*ROWH;
  var H = lastY + (showId ? 40 : 26) + (showLeg ? 40 : 6);
  var s = '', done = {};
  function Y(gi){ return Y0 + gi*ROWH; }
  function mateLine(a, b){
    var key = a+'|'+b; if(done[key] || !info[a] || !info[b]) return; done[key] = 1;
    var A = info[a], B = info[b], l = Math.min(A.x, B.x), r = Math.max(A.x, B.x);
    s += _bline(l + R + off, Y(A.gi), r - R + off, Y(B.gi), CHAR, 2);
  }
  (spec.mates || []).forEach(function(m){ mateLine(m[0], m[1]); });
  (spec.kids || []).forEach(function(k){
    if(k.p.length === 2){ mateLine(k.p[0], k.p[1]); mateLine(k.p[1], k.p[0]); }
    var P = k.p.map(function(id){ return info[id]; }).filter(Boolean);
    var ch = k.c.map(function(id){ return info[id]; }).filter(Boolean);
    if(!P.length || !ch.length) return;
    var mx = P.reduce(function(a, o){ return a + o.x; }, 0)/P.length + off;
    var py = Y(P[0].gi), cy = Y(ch[0].gi), ys = cy - 40;
    var xs = ch.map(function(o){ return o.x + off; });
    var l = Math.min.apply(null, xs.concat([mx])), r = Math.max.apply(null, xs.concat([mx]));
    s += _bline(mx, py, mx, ys, CHAR, 2);
    s += _bline(l, ys, r, ys, CHAR, 2);
    xs.forEach(function(x){ s += _bline(x, ys, x, cy - R, CHAR, 2); });
  });
  /* generation labels */
  rows.forEach(function(row, gi){ s += _bt(16, Y(gi) + 5, ROM[gi], {fs:15, fw:'bold', c:GREY_L}); });
  /* symbols */
  Object.keys(info).forEach(function(k){
    var o = info[k], x = o.x + off, y = Y(o.gi), fill = o.a ? CHAR : WHITE;
    if(o.s === 'm') s += _brect(x - R, y - R, 2*R, 2*R, fill, CHAR, 2.5, 0);
    else s += _bcirc(x, y, R, fill, CHAR, 2.5);
    if(o.car){
      if(o.s === 'm') s += _brect(x - R, y - R, R, 2*R, CHAR, 'none', 0, 0);
      else s += _bpath('M '+_bf(x)+' '+(y-R)+' A '+R+' '+R+' 0 0 0 '+_bf(x)+' '+(y+R)+' Z', CHAR, 'none', 0);
      if(o.s === 'm') s += _brect(x - R, y - R, 2*R, 2*R, 'none', CHAR, 2.5, 0); else s += _bcirc(x, y, R, 'none', CHAR, 2.5);
    }
    if(o.d) s += _bline(x - R - 5, y + R + 5, x + R + 5, y - R - 5, CHAR, 2.5);
    if(o.pro) s += _barrow(x - R - 22, y + R + 14, x - R - 3, y + R + 2, RED, 2.5, 9);
    if(showId) s += _bt(x, y + R + 17, o.id, {fs:12.5, c:CHAR});
  });
  /* legend */
  if(showLeg){
    var lx = (W - legW)/2, ly = H - 22;
    leg.forEach(function(l){
      var sx = lx + 10;
      if(l.k === 'm') s += _brect(sx - 8, ly - 8, 16, 16, WHITE, CHAR, 2, 0);
      else if(l.k === 'f') s += _bcirc(sx, ly, 8, WHITE, CHAR, 2);
      else if(l.k === 'a') s += _bcirc(sx, ly, 8, CHAR, CHAR, 2);
      else if(l.k === 'car') s += _bpath('M '+sx+' '+(ly-8)+' A 8 8 0 0 0 '+sx+' '+(ly+8)+' Z', CHAR, 'none', 0) + _bcirc(sx, ly, 8, 'none', CHAR, 2);
      else if(l.k === 'd') s += _bcirc(sx, ly, 8, WHITE, CHAR, 2) + _bline(sx - 11, ly + 11, sx + 11, ly - 11, CHAR, 2);
      s += _bt(sx + 15, ly + 4.5, l.t, {a:'start', fs:12.5, c:GREY_L});
      lx += l.w;
    });
  }
  return _bsvg(W, H, s, Math.max(W, 300));
}

/* Population pyramid (SVG). groups lists the age groups from YOUNGEST (drawn at the bottom) to oldest.
   male and female are arrays of percentages, one per group. Males blue on the left, females gold on the right.
   pyramid(['0 to 14','15 to 44','45 to 64','65+'], [14,22,9,3], [13.5,22.5,10,4.5], {title:'Population of town X (2020)'})
   {title: heading above the chart, w: maximum width in px} */
function pyramid(groups, male, female, opt){
  opt = opt || {};
  var n = groups.length, W = 480, padL = 12, midW = 80, half = (W - 2*padL - midW)/2;
  var mx = Math.max.apply(null, male.concat(female));
  var step = mx <= 4 ? 1 : (mx <= 10 ? 2 : (mx <= 20 ? 5 : 10));
  var ax = Math.ceil(mx/step)*step;
  if(ax - mx < step*0.08) ax += step;
  var sc = half/ax, rowH = n > 10 ? 24 : 30, bh = rowH - 5;
  var top = (opt.title ? 30 : 8) + 26, H = top + n*rowH + 20 + 24 + 8, s = '';
  if(opt.title) s += _bt(W/2, 20, opt.title, {fs:15, fw:'bold'});
  var hy = top - 10, lx0 = padL + half, rx0 = padL + half + midW, i, v;
  s += _bt(lx0 - half/2, hy, 'Male', {fs:14, fw:'bold', c:CAT[1]});
  s += _bt(rx0 + half/2, hy, 'Female', {fs:14, fw:'bold', c:CAT[0]});
  for(v = 0; v <= ax + 1e-9; v += step){
    s += _bline(lx0 - v*sc, top, lx0 - v*sc, top + n*rowH, '#E4E4E6', 1);
    s += _bline(rx0 + v*sc, top, rx0 + v*sc, top + n*rowH, '#E4E4E6', 1);
    s += _bt(lx0 - v*sc, top + n*rowH + 16, _bn(v), {fs:12, c:GREY_L});
    s += _bt(rx0 + v*sc, top + n*rowH + 16, _bn(v), {fs:12, c:GREY_L});
  }
  for(i = 0; i < n; i++){
    var y = top + (n-1-i)*rowH + (rowH-bh)/2, ml = male[i]*sc, fl = female[i]*sc;
    s += _brect(lx0 - ml, y, ml, bh, CAT[1], 'none', 0, 2);
    s += _brect(rx0, y, fl, bh, GOLD, 'none', 0, 2);
    s += _bt(padL + half + midW/2, y + bh/2 + 4.5, groups[i], {fs:12.5, fw:'bold'});
    if(ml >= 36) s += _bt(lx0 - ml + 5, y + bh/2 + 4.5, _bn(male[i]), {a:'start', fs:12.5, c:WHITE, fw:'bold'});
    else s += _bt(lx0 - ml - 4, y + bh/2 + 4.5, _bn(male[i]), {a:'end', fs:12.5});
    if(fl >= 36) s += _bt(rx0 + fl - 5, y + bh/2 + 4.5, _bn(female[i]), {a:'end', fs:12.5, fw:'bold'});
    else s += _bt(rx0 + fl + 4, y + bh/2 + 4.5, _bn(female[i]), {a:'start', fs:12.5});
  }
  s += _bt(W/2, H - 6, 'Percentage of the population (%)', {fs:12.5, c:GREY_L});
  return _bsvg(W, H, s, opt.w);
}

/* =====================================================================
   D. DNA, RNA AND THE GENETIC CODE
   ===================================================================== */

/* Strand of bases as coloured boxes (SVG): A gold, T blue, G green, C red, U purple.
   seq is a string such as 'ATGCCGTA'. A '?' draws a grey question box.
   dna('TACGGATC', {pair:true})                      DNA strand with its complementary DNA strand below
   dna('TACGGATC', {pair:true, rna:true, hi:[0,1,2]}) DNA with the mRNA copy below; boxes 0 to 2 outlined (a codon)
   dna('AUGGCUUAA', {rna:true})                       a single mRNA strand
   dna('TACGGATC', {pair:true, blank:true})           complementary strand left empty for the student
   {pair: draw the complementary strand, rna: the strand drawn below is mRNA (U instead of T),
    or, with no pair, the top strand is mRNA, hi: box numbers to outline (start at 0),
    blank: empty lower boxes, names:false hides the DNA / mRNA labels at the left (about 12 bases or fewer reads
    well on a phone),
    ends:true adds 5' and 3' labels, w: maximum width in px} */
function dna(seq, opt){
  opt = opt || {};
  var b = String(seq).replace(/\s+/g, '').split(''), n = b.length, pair = !!opt.pair, rna = !!opt.rna;
  var names = opt.names !== false, ends = !!opt.ends;
  var topName = (rna && !pair) ? 'mRNA' : 'DNA', botName = rna ? 'mRNA' : 'DNA';
  var lw = (names ? 50 : 6) + (ends ? 20 : 0), rw = (ends ? 22 : 6);
  var bw = Math.max(20, Math.min(30, Math.floor((560 - lw - rw)/n) - 3)), pitch = bw + 3;
  var y0 = 8, gap = 24, y1 = y0 + bw + gap;
  var W = lw + n*pitch + rw, H = (pair ? y1 + bw : y0 + bw) + 8, s = '', i;
  var comp = {A: rna ? 'U' : 'T', T:'A', G:'C', C:'G', U:'A'};
  function box(x, y, ch, blank){
    var col = BASECOL[ch];
    if(blank) return _brect(x, y, bw, bw, WHITE, GREY_L, 1.8, 4).replace('/>', ' stroke-dasharray="4 3"/>');
    if(!col) return _brect(x, y, bw, bw, '#E4E4E6', GREY_L, 1.5, 4) + _bt(x + bw/2, y + bw/2 + 5, ch, {fs:14, fw:'bold', c:GREY_L});
    return _brect(x, y, bw, bw, col, 'none', 0, 4) + _bt(x + bw/2, y + bw/2 + 5, ch, {fs:14, fw:'bold', c:BASETXT[ch]});
  }
  if(names){
    s += _bt(lw - (ends ? 24 : 6), y0 + bw/2 + 4.5, topName, {a:'end', fs:12.5, fw:'bold', c:GREY_L});
    if(pair) s += _bt(lw - (ends ? 24 : 6), y1 + bw/2 + 4.5, botName, {a:'end', fs:12.5, fw:'bold', c:GREY_L});
  }
  if(ends){
    s += _bt(lw - 4, y0 + bw/2 + 4.5, "5'", {a:'end', fs:12, c:GREY_L});
    s += _bt(lw + n*pitch + 2, y0 + bw/2 + 4.5, "3'", {a:'start', fs:12, c:GREY_L});
    if(pair){
      s += _bt(lw - 4, y1 + bw/2 + 4.5, "3'", {a:'end', fs:12, c:GREY_L});
      s += _bt(lw + n*pitch + 2, y1 + bw/2 + 4.5, "5'", {a:'start', fs:12, c:GREY_L});
    }
  }
  for(i = 0; i < n; i++){
    var x = lw + i*pitch;
    s += box(x, y0, b[i], false);
    if(pair){
      s += _bline(x + bw/2, y0 + bw + 3, x + bw/2, y1 - 3, GREY_L, 2, '3 3');
      s += box(x, y1, opt.blank ? '' : (comp[b[i]] || '?'), !!opt.blank);
    }
  }
  /* outline runs of highlighted boxes */
  var hi = (opt.hi || []).slice().sort(function(p, q){ return p-q; }), j = 0;
  while(j < hi.length){
    var k = j; while(k+1 < hi.length && hi[k+1] === hi[k]+1) k++;
    var rx = lw + hi[j]*pitch - 3, rw2 = (hi[k]-hi[j]+1)*pitch + 1.5;
    s += '<rect x="'+_bf(rx)+'" y="'+(y0-3)+'" width="'+_bf(rw2)+'" height="'+((pair ? y1 + bw : y0 + bw) - y0 + 6)+'" rx="6" fill="none" stroke="'+CHAR+'" stroke-width="3"/>';
    j = k + 1;
  }
  return _bsvg(W, H, s, opt.w);
}

/* private: the standard genetic code, mRNA codons. Bases run U, C, A, G in all three places. */
var _bAA1 = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
var _bAA3 = {F:'Phe', L:'Leu', S:'Ser', Y:'Tyr', '*':'Stop', C:'Cys', W:'Trp', P:'Pro', H:'His', Q:'Gln', R:'Arg',
             I:'Ile', M:'Met', T:'Thr', N:'Asn', K:'Lys', V:'Val', A:'Ala', D:'Asp', E:'Glu', G:'Gly'};
var _bBASES = 'UCAG';

/* Amino acid (three-letter abbreviation) for an mRNA codon, or 'Stop'. T is accepted in place of U.
   aaOf('GAA') gives 'Glu';  aaOf('UAG') gives 'Stop'.  Handy for checking a worked answer. */
function aaOf(codon){
  var c = String(codon).toUpperCase().replace(/T/g, 'U');
  var i = _bBASES.indexOf(c.charAt(0))*16 + _bBASES.indexOf(c.charAt(1))*4 + _bBASES.indexOf(c.charAt(2));
  return _bAA3[_bAA1.charAt(i)];
}

/* The standard genetic code as an HTML table (mRNA codons). Rows: first base. Columns: second base.
   The four third bases are listed inside each cell. AUG (start, also Met) is shaded gold, stop codons are red.
   codonTable()
   codonTable(['GAA','GAG'])   <- optional list of codons to shade pale gold and bold */
function codonTable(hiList){
  hiList = hiList || [];
  var tdS = 'border:1px solid '+LINE+';padding:4px 3px;vertical-align:top;font-size:12.5px;line-height:1.55;text-align:center';
  var thS = 'background:'+CHAR+';color:#fff;font-size:12px;padding:6px 4px;text-align:center;border:1px solid '+CHAR;
  var out = '<table style="border-collapse:collapse;width:100%;max-width:560px;margin:12px auto"><tr><th style="'+thS+'" rowspan="2">First base</th><th style="'+thS+'" colspan="4">Second base</th></tr><tr>';
  for(var c = 0; c < 4; c++) out += '<th style="'+thS+'">'+_bBASES.charAt(c)+'</th>';
  out += '</tr>';
  for(var r = 0; r < 4; r++){
    out += '<tr><th style="'+thS+'">'+_bBASES.charAt(r)+'</th>';
    for(var c2 = 0; c2 < 4; c2++){
      out += '<td style="'+tdS+'">';
      for(var t = 0; t < 4; t++){
        var codon = _bBASES.charAt(r) + _bBASES.charAt(c2) + _bBASES.charAt(t), aa = aaOf(codon);
        var st = '';
        if(codon === 'AUG') st = 'background:'+GOLD+';font-weight:bold;border-radius:3px;';
        else if(aa === 'Stop') st = 'color:'+RED+';font-weight:bold;';
        else if(hiList.indexOf(codon) >= 0) st = 'background:'+PALE+';font-weight:bold;border-radius:3px;';
        out += '<div style="'+st+'">'+codon+' '+aa+'</div>';
      }
      out += '</td>';
    }
    out += '</tr>';
  }
  out += '</table><div style="text-align:center;font-size:12.5px;color:'+GREY_L+';margin-top:-4px">Gold: AUG, the start codon (Met). Red: stop codons, which code for no amino acid.</div>';
  return out;
}

/* One nucleotide (SVG): phosphate group, pentose sugar, nitrogenous base, joined by bonds.
   nucleotide({base:'A'})              a DNA nucleotide with adenine
   nucleotide({base:'U', rna:true})    an RNA nucleotide with uracil (the sugar is then labelled ribose)
   {base: A, T, G, C or U (any text works), rna: ribose instead of deoxyribose, w: maximum width in px} */
function nucleotide(opt){
  opt = opt || {};
  var base = opt.base || 'A', W = 400, H = 200, s = '';
  var nm = {A:'adenine', T:'thymine', G:'guanine', C:'cytosine', U:'uracil'};
  var col = BASECOL[base] || '#E4E4E6', tc = BASETXT[base] || CHAR;
  var sx = 200, sy = 82, sr = 40, pts = [], i;
  for(i = 0; i < 5; i++){ var a = -Math.PI/2 + i*2*Math.PI/5; pts.push(_bf(sx + sr*Math.cos(a))+','+_bf(sy + sr*Math.sin(a))); }
  s += _bline(100, 84, 163, 84, CHAR, 3) + _bline(240, 84, 290, 84, CHAR, 3);
  s += _bcirc(74, 84, 28, PALE, GOLD_T, 2.5) + _bt(74, 90, 'P', {fs:18, fw:'bold'});
  s += '<polygon points="'+pts.join(' ')+'" fill="#E7F3E9" stroke="'+GREEN+'" stroke-width="2.5"/>';
  s += _brect(290, 56, 74, 56, col, CHAR, 2.5, 6) + _bt(327, 91, base, {fs:26, fw:'bold', c:tc});
  s += _bml(74, 140, ['Phosphate', 'group'], {fs:13, fw:'bold'}, 15);
  s += _bml(200, 140, [opt.rna ? 'Ribose' : 'Deoxyribose', 'sugar'], {fs:13, fw:'bold'}, 15);
  s += _bml(327, 140, ['Nitrogenous', 'base' + (nm[base] ? ' ('+nm[base]+')' : '')], {fs:13, fw:'bold'}, 15);
  return _bsvg(W, H, s, opt.w || 400);
}

/* Double helix schematic (SVG) with 6 base pairs as rungs: two sugar-phosphate backbones, a gap for the
   hydrogen bonds in the middle of each rung, A with T and G with C.
   helix()      helix(300)   <- optional maximum width in px */
function helix(w){
  var W = 440, H = 232, cx = 220, A = 58, s = '', i, y;
  var rungs = ['AT','GC','TA','CG','AT','GC'];
  function hx(yy, ph){ return cx + ph*A*Math.sin(Math.PI*(yy - 13)/60); }
  var s1 = [], s2 = [];
  for(y = 8; y <= 210; y += 2){ s1.push([hx(y, 1), y]); s2.push([hx(y, -1), y]); }
  s += _bpoly(s1, CHAR, 6) + _bpoly(s2, GREY_L, 6);
  for(i = 0; i < 6; i++){
    var ry = 28 + 30*i, xa = hx(ry, 1), xb = hx(ry, -1), mid = (xa + xb)/2;
    var c1 = rungs[i].charAt(0), c2 = rungs[i].charAt(1);
    s += _bline(xa, ry, mid - (xa < xb ? 3 : -3), ry, BASECOL[c1], 11) + _bline(mid + (xa < xb ? 3 : -3), ry, xb, ry, BASECOL[c2], 11);
    s += _bt((xa + mid)/2, ry + 4.5, c1, {fs:12, fw:'bold', c:BASETXT[c1]});
    s += _bt((mid + xb)/2, ry + 4.5, c2, {fs:12, fw:'bold', c:BASETXT[c2]});
  }
  /* labels */
  s += _bline(cx - A, 103, 118, 103, CHAR, 1.2) + _bcirc(cx - A, 103, 2.6, CHAR);
  s += _bml(112, 99, ['Sugar-phosphate', 'backbone'], {a:'end', fs:13, fw:'bold'}, 15);
  var bx = cx + 30, by = 28 + 30*3;
  s += _bline(bx, by, 330, by + 30, CHAR, 1.2) + _bcirc(bx, by, 2.6, CHAR);
  s += _bt(336, by + 34.5, 'Base pair', {a:'start', fs:13, fw:'bold'});
  s += _bline(cx, 58, 330, 36, CHAR, 1.2) + _bcirc(cx, 58, 2.6, CHAR);
  s += _bt(336, 40.5, 'Hydrogen bonds', {a:'start', fs:13, fw:'bold'});
  return _bsvg(W, H, s, w || 440);
}

/* =====================================================================
   E. HORMONES, FEEDBACK AND THE ENDOCRINE SYSTEM
   ===================================================================== */

/* Negative feedback diagram (SVG): a central bar for the normal level with a loop above it (level too
   high) and a loop below it (level too low). Each loop runs stimulus (1), gland (2), hormone (3), effect (4), back to normal.
   Leave out up or down to draw only one loop. Keep each text under about 30 characters (it wraps at 18).
   feedbackLoop({norm:'Blood glucose normal',
     up:{stim:'Blood glucose rises', gland:'Pancreas', hormone:'Insulin', effect:'Liver stores glycogen'},
     down:{stim:'Blood glucose falls', gland:'Pancreas', hormone:'Glucagon', effect:'Liver releases glucose'}})
   Optional up.tag / down.tag change the small caption inside a loop (default "ABOVE NORMAL" / "BELOW NORMAL"). */
function feedbackLoop(spec){
  var W = 420, bw = 176, bh = 50, vg = 34, s = '', xL = 12, xR = W - 12 - bw;
  var hasU = !!spec.up, hasD = !!spec.down;
  var y = 8, yU1 = y, yU2, yBar, yL1, yL2;
  if(hasU){ yU1 = y; yU2 = yU1 + bh + vg; y = yU2 + bh + vg; }
  yBar = y; y += 44 + vg;
  if(hasD){ yL1 = y; yL2 = yL1 + bh + vg; y = yL2 + bh; } else { y -= vg; }
  var H = y + 8;
  function box(x, yy, t, col, num){
    var ln = _bwrap(t || '', 18), out = _brect(x, yy, bw, bh, WHITE, col, 2.2, 9);
    out += _bml(x + bw/2, yy + bh/2 - (ln.length-1)*7.5 + 4.5, ln, {fs:13}, 15);
    return out + _bcirc(x + 4, yy + 4, 9, col, WHITE, 1.5) + _bt(x + 4, yy + 8.3, num, {fs:12, fw:'bold', c:WHITE});
  }
  /* central bar */
  var barW = W - 24, nl = _bwrap(spec.norm || 'Normal level', 40);
  s += _brect(12, yBar, barW, 44, PALE, GOLD, 3, 22) + _bml(W/2, yBar + 27, nl, {fs:15, fw:'bold'}, 16);
  if(hasU){
    var u = spec.up, ca = CAT[2];
    s += _barrow(xL + bw/2, yBar - 3, xL + bw/2, yU2 + bh + 3, ca, 2.5, 10);          /* bar to stimulus */
    s += _barrow(xL + bw/2, yU2 - 3, xL + bw/2, yU1 + bh + 3, ca, 2.5, 10);          /* stimulus up to gland */
    s += _barrow(xL + bw + 3, yU1 + bh/2, xR - 3, yU1 + bh/2, ca, 2.5, 10);          /* gland to hormone */
    s += _barrow(xR + bw/2, yU1 + bh + 3, xR + bw/2, yU2 - 3, ca, 2.5, 10);          /* hormone down to effect */
    s += _barrow(xR + bw/2, yU2 + bh + 3, xR + bw/2, yBar - 3, ca, 2.5, 10);         /* effect to bar */
    s += box(xL, yU2, u.stim, ca, 1) + box(xL, yU1, u.gland, ca, 2) + box(xR, yU1, u.hormone, ca, 3) + box(xR, yU2, u.effect, ca, 4);
    s += _bml(W/2, (yU1 + yU2 + bh)/2 + 4, [u.tag || 'ABOVE NORMAL'], {fs:12, fw:'bold', c:ca});
  }
  if(hasD){
    var d = spec.down, cb = CAT[1];
    s += _barrow(xL + bw/2, yBar + 44 + 3, xL + bw/2, yL1 - 3, cb, 2.5, 10);
    s += _barrow(xL + bw/2, yL1 + bh + 3, xL + bw/2, yL2 - 3, cb, 2.5, 10);
    s += _barrow(xL + bw + 3, yL2 + bh/2, xR - 3, yL2 + bh/2, cb, 2.5, 10);
    s += _barrow(xR + bw/2, yL2 - 3, xR + bw/2, yL1 + bh + 3, cb, 2.5, 10);
    s += _barrow(xR + bw/2, yL1 - 3, xR + bw/2, yBar + 44 + 3, cb, 2.5, 10);
    s += box(xL, yL1, d.stim, cb, 1) + box(xL, yL2, d.gland, cb, 2) + box(xR, yL2, d.hormone, cb, 3) + box(xR, yL1, d.effect, cb, 4);
    s += _bml(W/2, (yL1 + yL2 + bh)/2 + 4, [d.tag || 'BELOW NORMAL'], {fs:12, fw:'bold', c:cb});
  }
  return _bsvg(W, H, s, 420);
}

/* Front view of the human body with the endocrine glands marked (SVG).
   Keys: hypothalamus, pituitary, pineal, thyroid, parathyroid, thymus, adrenal, pancreas, ovary, testis.
   bodyMap('all')                                           every gland, named
   bodyMap(['pituitary','thyroid','adrenal'])               only these, named
   bodyMap([{k:'pituitary', t:'Pituitary gland'}])          custom wording
   bodyMap(['pituitary','thyroid','pancreas'], {letters:true})   A, B, C for a labelling question
   bodyMap([{k:'thyroid', l:'X'}], {letters:true})          force the letter shown
   Only the glands named in labels are drawn. {w: maximum width in px} */
function bodyMap(labels, opt){
  opt = opt || {};
  var DEF = {hypothalamus:'Hypothalamus', pituitary:'Pituitary', pineal:'Pineal gland', thyroid:'Thyroid', parathyroid:'Parathyroid glands',
             thymus:'Thymus', adrenal:'Adrenal glands', pancreas:'Pancreas', ovary:'Ovaries', testis:'Testes'};
  var items = _bnorm(labels, DEF), has = {}, s = '';
  items.forEach(function(it){ has[it.k] = true; });
  var W = 440, H = 456, cx = 220, BODY = '#F5F0E6', EDGE = '#8D8D90';
  /* body */
  s += _brect(cx - 77, 100, 24, 168, BODY, EDGE, 2, 12) + _brect(cx + 53, 100, 24, 168, BODY, EDGE, 2, 12);
  s += _brect(cx - 52, 296 - 6, 50, 160, BODY, EDGE, 2, 18) + _brect(cx + 2, 296 - 6, 50, 160, BODY, EDGE, 2, 18);
  s += _brect(cx - 48, 96, 96, 210, BODY, EDGE, 2, 26);
  s += _brect(cx - 12, 72, 24, 40, BODY, EDGE, 2, 6);
  s += _bcirc(cx, 44, 34, BODY, EDGE, 2);
  /* glands */
  var G = '#F2A900', GE = '#4D4D4F';
  if(has.pineal) s += _bcirc(cx + 4, 30, 5, G, GE, 1.5);
  if(has.hypothalamus) s += _bcirc(cx - 2, 44, 5.5, G, GE, 1.5);
  if(has.pituitary) s += _bcirc(cx + 3, 58, 5, G, GE, 1.5);
  if(has.thyroid || has.parathyroid){
    if(has.thyroid) s += _bell(cx - 9, 96, 6.5, 10, G, GE, 1.5, 12) + _bell(cx + 9, 96, 6.5, 10, G, GE, 1.5, -12) + _brect(cx - 8, 94, 16, 6, G, GE, 1.2, 2);
    if(has.parathyroid) s += _bcirc(cx - 14, 88, 2.6, RED, GE, 1) + _bcirc(cx + 14, 88, 2.6, RED, GE, 1) + _bcirc(cx - 14, 104, 2.6, RED, GE, 1) + _bcirc(cx + 14, 104, 2.6, RED, GE, 1);
  }
  if(has.thymus) s += _bpath('M '+(cx-8)+' 132 Q '+(cx-24)+' 150 '+(cx-6)+' 164 L '+(cx+6)+' 164 Q '+(cx+24)+' 150 '+(cx+8)+' 132 Z', G, GE, 1.5);
  if(has.adrenal){
    s += _bell(cx - 40, 214, 11, 20, '#E4E4E6', GREY_L, 1.2) + _bell(cx + 40, 214, 11, 20, '#E4E4E6', GREY_L, 1.2);
    s += _bpath('M '+(cx-50)+' 202 Q '+(cx-40)+' 188 '+(cx-29)+' 202 Z', G, GE, 1.5) + _bpath('M '+(cx+29)+' 202 Q '+(cx+40)+' 188 '+(cx+50)+' 202 Z', G, GE, 1.5);
  }
  if(has.pancreas) s += _bpath('M '+(cx-20)+' 214 Q '+(cx-8)+' 204 '+(cx+14)+' 210 Q '+(cx+34)+' 214 '+(cx+34)+' 224 Q '+(cx+14)+' 224 '+(cx-6)+' 226 Q '+(cx-22)+' 226 '+(cx-20)+' 214 Z', G, GE, 1.5);
  if(has.ovary) s += _bell(cx - 28, 262, 9, 6, G, GE, 1.5) + _bell(cx + 28, 262, 9, 6, G, GE, 1.5);
  if(has.testis) s += _bell(cx - 8, 320, 7, 10, G, GE, 1.5) + _bell(cx + 8, 320, 7, 10, G, GE, 1.5);
  /* labels: target (x,y) on the body, leader end (lx,ly) in the margin */
  var L = 120, R = 320;
  var P = {
    pineal:       {x:cx+4,  y:30,  lx:R, ly:22,  side:'r'},
    hypothalamus: {x:cx-2,  y:44,  lx:L, ly:34,  side:'l'},
    pituitary:    {x:cx+3,  y:58,  lx:R, ly:62,  side:'r'},
    thyroid:      {x:cx-13, y:97,  lx:L, ly:104, side:'l'},
    parathyroid:  {x:cx+14, y:88,  lx:R, ly:96,  side:'r'},
    thymus:       {x:cx+4,  y:146, lx:R, ly:146, side:'r'},
    adrenal:      {x:cx-42, y:200, lx:L, ly:192, side:'l'},
    pancreas:     {x:cx+24, y:218, lx:R, ly:224, side:'r'},
    ovary:        {x:cx-30, y:262, lx:L, ly:268, side:'l'},

/* Cladogram (SVG), drawn with right-angled branches and all the tips on the right. The tree is nested arrays:

   cladogram(tree, {nodes:['A','B','C','D'], hi:['Human','Chimpanzee']})
   {nodes: labels for the branching points, in order from the root outwards (top branch first); a label of 1 or 2
    characters is shown in a circle, a longer one above the point. hi: tip names to highlight in gold. w: maximum width in px} */

/* Sampling grid (SVG): rows by cols square quadrats, each lettered A, B, C... left to right then down, with
   the stated number of organisms drawn as dots inside. Dots are placed the same way every time.
   quadrats(2, 3, [4, 7, 2, 5, 0, 9])          six quadrats A to F
   quadrats(2, 2, [3, 5, 8, 4], {w:300})
   counts: one number per quadrat in reading order. {col: dot colour, w: maximum width in px} */
function quadrats(rows, cols, counts, opt){
  opt = opt || {};

  var col = opt.col || '#2E7D3A';

    var idx = r*cols + c, x = 2 + c*cs, y = 2 + r*cs, cnt = counts[idx] || 0, rnd = _bseed(idx*37 + cnt*11 + 5), pts = [], tries = 0;
    s += _brect(x, y, cs, cs, '#FBFBF6', CHAR, 2.2, 0);
    while(pts.length < cnt && tries < 4000){
      tries++;

      if(px < x + 24 && py < y + 22) ok = false;
      for(var k = 0; ok && k < pts.length; k++){ var dx = pts[k][0] - px, dy = pts[k][1] - py; if(dx*dx + dy*dy < 10.5*10.5) ok = false; }
      if(tries > 2500) ok = true;
      if(ok) pts.push([px, py]);
    }
    pts.forEach(function(p){ s += _bcirc(p[0], p[1], 3.6, col, '#154A20', 0.8); });
    s += _bt(x + 5, y + 15, String.fromCharCode(65 + idx), {a:'start', fs:13, fw:'bold', c:GREY_L});
  }

}

/* Capture, mark, release, recapture picture (SVG): the first catch of m animals, all marked, then the second
   catch of c animals of which r carry a mark. Marked animals are gold with a charcoal ring.
   markRecap({m:20, c:30, r:6})
   {m: marked in the first catch, c: size of the second catch, r: marked animals in the second catch, w: maximum width} */
function markRecap(o){
  var m = o.m, c = o.c, r = o.r, per = 10, pitch = 18, pw = per*pitch + 20, W = pw*2 + 56, s = '', i;
  var rows1 = Math.ceil(m/per), rows2 = Math.ceil(c/per), rmax = Math.max(rows1, rows2);
  var top = 56, ph = rmax*pitch + 14, H = top + ph + 40;
  function panel(x, title, sub, n, nMarked){
    var o2 = _brect(x, top - 8, pw, ph, '#FBFBF6', CHAR, 2, 8);
    o2 += _bt(x + pw/2, 20, title, {fs:14, fw:'bold'}) + _bt(x + pw/2, 38, sub, {fs:12.5, c:GREY_L});
    for(var k = 0; k < n; k++){

      if(k < nMarked) o2 += _bcirc(cx, cy, 6.6, GOLD, CHAR, 2.4);

  }

  s += panel(8 + pw + 40, 'Second catch', c + ' caught, ' + r + ' marked', c, r);

  s += _bcirc(W/2 - 92, ly - 4, 6.6, GOLD, CHAR, 2.4) + _bt(W/2 - 80, ly, 'marked', {a:'start', fs:12.5, c:GREY_L});

/* Population growth graphs (SVG). type is one of:

   'both'     J and S overlaid, so the point where environmental resistance starts to act is visible
   'predprey' prey (gold) and predator (blue) numbers rising and falling, the predator curve lagging behind
   'surv'     three survivorship curves, Type I, II and III, on a log scale ("survivors (log)")
   growthCurves({type:'S'})
   growthCurves({type:'S', phases:true})     marks lag, exponential and stationary phases on the S curve
   {type: see above, phases: true for the S curve only, w: maximum width in px} */
function growthCurves(opt){
  opt = opt || {};
  var type = opt.type || 'J', W = 560, x0 = 70, x1 = 536, pt = 40, pb = 280, H = (opt.type === 'S' && opt.phases) ? 346 : 336, s = '', i;
  var legend = [], P = function(){};
  function ax(xlab, ylab){
    var o = _bline(x0, pb, x1 + 4, pb, CHAR, 2.2) + _bline(x0, pt - 6, x0, pb, CHAR, 2.2);
    o += '<polygon points="'+(x1 + 10)+','+pb+' '+(x1 - 2)+','+(pb - 5)+' '+(x1 - 2)+','+(pb + 5)+'" fill="'+CHAR+'"/>';
    o += '<polygon points="'+x0+','+(pt - 12)+' '+(x0 - 5)+','+pt+' '+(x0 + 5)+','+pt+'" fill="'+CHAR+'"/>';
    o += _bt((x0 + x1)/2, pb + (type === 'S' && opt.phases ? 46 : 36), xlab, {fs:13, fw:'bold', c:GREY_L});
    o += _bt(22, (pt + pb)/2, ylab, {fs:13, fw:'bold', c:GREY_L, rot:-90});
    return o;
  }
  function curve(f, tmax, ymax, col, dash){
    var pts = [], t;
    for(t = 0; t <= tmax + 1e-9; t += tmax/200){
      var v = f(t); if(v > ymax) break;
      pts.push([x0 + t/tmax*(x1 - x0 - 8), pb - v/ymax*(pb - pt - 6)]);
    }
    return _bpoly(pts, col, 3.4, dash);
  }
  function leg(items){
    var lw = 0, o = '';
    items.forEach(function(it){ it.w = 38 + it.t.length*6.9 + 16; lw += it.w; });
    var lx = (W - lw)/2;
    items.forEach(function(it){ o += _bline(lx, 16, lx + 26, 16, it.c, 4, it.dash) + _bt(lx + 32, 20.5, it.t, {a:'start', fs:13, fw:'bold'}); lx += it.w; });
    return o;
  }
  var N0 = 10, K = 300, r = 0.75;
  if(type === 'J'){
    s += ax('Time', 'Population size');
    s += curve(function(t){ return N0*Math.exp(0.45*t); }, 10, 900, CAT[0]);
    s += _bt(x0 + 16, pt + 16, 'Exponential growth (J-shaped curve)', {a:'start', fs:13.5, fw:'bold', c:CAT[0]});
  } else if(type === 'S'){
    var ym = 360;
    s += ax('Time', 'Population size');
    var yK = pb - K/ym*(pb - pt - 6);
    s += _bline(x0, yK, x1 - 4, yK, GREY_L, 2, '7 5') + _bt(x0 + 10, yK - 8, 'K (carrying capacity)', {a:'start', fs:13, fw:'bold', c:GREY_L});
    s += curve(function(t){ return K/(1 + (K/N0 - 1)*Math.exp(-r*t)); }, 10, ym, CAT[1]);
    if(opt.phases){
      var xs = [x0 + 2.2/10*(x1 - x0 - 8), x0 + 6.0/10*(x1 - x0 - 8)];
      xs.forEach(function(x){ s += _bline(x, pt - 2, x, pb + 24, LINE, 1.6, '4 4'); });
      s += _bt((x0 + xs[0])/2, pb + 18, 'lag phase', {fs:12.5, fw:'bold', c:GREY_L});
      s += _bt((xs[0] + xs[1])/2, pb + 18, 'exponential phase', {fs:12.5, fw:'bold', c:GREY_L});
      s += _bt((xs[1] + x1)/2, pb + 18, 'stationary phase', {fs:12.5, fw:'bold', c:GREY_L});
    } else s += _bt(x0 + 16, pt + 16, 'Logistic growth (S-shaped curve)', {a:'start', fs:13.5, fw:'bold', c:CAT[1]});
  } else if(type === 'both'){
    var ym2 = 400;
    s += leg([{c:CAT[0], t:'J-shaped (exponential)'}, {c:CAT[1], t:'S-shaped (logistic)'}]);
    s += ax('Time', 'Population size');
    var yK2 = pb - K/ym2*(pb - pt - 6);
    s += _bline(x0, yK2, x1 - 4, yK2, GREY_L, 2, '7 5') + _bt(x0 + 10, yK2 - 8, 'K (carrying capacity)', {a:'start', fs:13, fw:'bold', c:GREY_L});
    s += curve(function(t){ return N0*Math.exp(r*t); }, 10, ym2, CAT[0]);
    s += curve(function(t){ return K/(1 + (K/N0 - 1)*Math.exp(-r*t)); }, 10, ym2, CAT[1]);
  } else if(type === 'predprey'){
    s += leg([{c:CAT[0], t:'Prey'}, {c:CAT[1], t:'Predator'}]);
    s += ax('Time', 'Population size');
    s += curve(function(t){ return 62 + 40*Math.sin(2*Math.PI*t/10); }, 30, 130, CAT[0]);
    s += curve(function(t){ return 40 + 24*Math.sin(2*Math.PI*(t - 2.5)/10); }, 30, 130, CAT[1]);
  } else if(type === 'surv'){
    var xT = function(t){ return x0 + t/100*(x1 - x0 - 8); }, yL = function(v){ return pb - Math.log(v)/Math.log(1000)*(pb - pt - 6); };
    s += leg([{c:CAT[1], t:'Type I'}, {c:CAT[0], t:'Type II'}, {c:CAT[2], t:'Type III'}]);
    s += ax('Age (percentage of maximum lifespan)', 'survivors (log)');
    [[1, '1'], [10, '10'], [100, '100'], [1000, '1\u00a0000']].forEach(function(g){
      s += _bline(x0, yL(g[0]), x1, yL(g[0]), '#E4E4E6', 1) + _bt(x0 - 8, yL(g[0]) + 4.5, g[1], {a:'end', fs:12, c:GREY_L});
    });
    [0, 25, 50, 75, 100].forEach(function(t){ s += _bline(xT(t), pb, xT(t), pb + 5, CHAR, 1.5) + _bt(xT(t), pb + 19, t, {fs:12, c:GREY_L}); });
    function sv(f, col){
      var pts = []; for(var t = 0; t <= 100; t += 0.5) pts.push([xT(t), yL(Math.max(1.5, f(t)))]);
      return _bpoly(pts, col, 3.4);
    }
    s += sv(function(t){ return 1000*(1 - Math.pow(t/100, 5)) + 2; }, CAT[1]);
    s += sv(function(t){ return 1000*Math.exp(-0.0392*t) ; }, CAT[0]);
    s += sv(function(t){ return 1000*(0.97*Math.exp(-t/5) + 0.03*Math.exp(-t/90)); }, CAT[2]);
  }
  return _bsvg(W, H, s, opt.w);
}

/* DNA profiling gel (SVG): each lane is a person or sample, each band a DNA fragment. bands are positions from 1
   (top, largest fragments) to 10 (bottom, smallest); decimals such as 4.5 work. Lane names sit above.
   gelLanes([{n:'Mother', bands:[2,5,8]}, {n:'Child', bands:[2,7]}, {n:'Father A', bands:[3,7,9]}, {n:'Father B', bands:[1,4,6]}])
   {w: maximum width in px, rows:false hides the position numbers} */
function gelLanes(lanes, opt){
  opt = opt || {};
  var n = lanes.length, W = 560, lm = 40, pitch = Math.min(76, (W - lm - 16)/n), lw = pitch - 12;
  var maxc = Math.max(6, Math.floor((pitch - 2)/6.9));
  var lab = lanes.map(function(l){ return _bwrap(l.n, maxc); }), ml = Math.max.apply(null, lab.map(function(l){ return l.length; }));
  var gt = 14 + ml*15 + 6, gh = 250, H = gt + gh + 12, s = '', i, k;
  var gw = n*pitch + 10;
  s += _brect(lm - 4, gt, gw, gh, '#2F3033', CHAR, 2, 6);
  var rowY = function(p){ return gt + 30 + (p - 1)*(gh - 50)/9; };
  if(opt.rows !== false) for(k = 1; k <= 10; k++) s += _bt(lm - 10, rowY(k) + 4.5, k, {a:'end', fs:12, c:GREY_L});
  lanes.forEach(function(l, i){
    var x = lm + i*pitch + 1;
    s += _bml(x + lw/2, 16, lab[i], {fs:13, fw:'bold'}, 15);
    s += _brect(x, gt + 8, lw, 8, '#16171A', 'none', 0, 2);
    (l.bands || []).forEach(function(p){ s += _brect(x + 2, rowY(p) - 4, lw - 4, 8, GOLD, 'none', 0, 2); });
  });
  return _bsvg(W, H, s, opt.w);
}
