/* ===================== LEVEL 11 ===================== */
{ id:11, name:'Evaluating a genetic engineering claim', short:'Evaluating arguments',
  teach:{ h:'Separate the claim from the evidence, then judge',
  b:`<p>An evaluation question asks you to separate what is claimed from what has been shown, find the weakness, and reach a reasoned judgement.</p>
  ${passage('A FICTIONAL REPORT',['<b>1.</b> A research institute states that its GM rice "will end vitamin A deficiency in children".','<b>2.</b> In a laboratory test, the institute found that the grain contained β-carotene.','<b>3.</b> The rice was not fed to any children.'])}
  <div class="worked"><span class="lbl">Worked example: claim and evidence</span>
    <div class="step-line">Claim: the rice will end vitamin A deficiency in children (line 1).</div>
    <div class="step-line">Evidence: the grain contains β-carotene (line 2).</div>
    <div class="step-line">Gap: the evidence shows only that the grain has β-carotene. It does not show that children absorb it or that their vitamin A levels rise.</div>
    <div class="step-line ans">The claim goes further than the evidence supports.</div></div>
  <p>Reporting only the results that look good (and leaving out the failed experiments) gives a distorted picture and is a form of bias. Reporting failed experiments lets other scientists avoid repeating the same mistakes and shows the real limits of a method.</p>
  <div class="callout"><span class="lbl">Rule</span><p>Ask three questions: what is claimed, what is the evidence, and what is missing (sample size, repeats, who did the test, what was not tested)?</p></div>
  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>A claim that sounds scientific is not evidence. "Proves" is almost never justified by one trial.</p></div>
  ${keyterms([['claim','a statement that something is true'],['evidence','data that supports or contradicts a claim'],['bias','a distortion, for example by reporting only results that suit you'],['repeat','doing a trial again to check that the result is reliable'],['independent','done by people with no stake in the result'],['evaluate','weigh strengths and weaknesses and give a judgement']])}`},
  reteach:{ h:'A scaffold: claim, evidence, counter, conclusion',
  b:`<p><i>Recall:</i> in the GM crops level, gene flow and pest resistance were concerns. Here you judge how good the evidence for a claim is.</p>
  <p>Write every evaluation in four boxes, in this order.</p>
  ${contrast('Box','Example: a fictional GM tomato that "stays fresh for twice as long"',[
    ['<b>Claim</b>','The tomato stays fresh for twice as long as an ordinary one.'],
    ['<b>Evidence</b>','The seller says one batch lasted longer on a shelf.'],
    ['<b>Counter</b>','Only one batch was tested, and there was no independent check, so chance or bias cannot be ruled out.'],
    ['<b>Conclusion</b>','The claim is promising but not yet established; repeat trials are needed.']
  ])}
  <div class="worked"><span class="lbl">Worked example: the four boxes in one sentence</span>
    <div class="step-line">"The seller claims the tomato lasts longer, and one batch supports this. However, one batch is not enough and no outside group checked it, so the claim is not yet established."</div>
    <div class="step-line ans">Claim, evidence, but, so: four boxes in one sentence.</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>Always finish with a conclusion that follows from the counter. Do not stop at "it is biased".</p></div>`},
  qs:[
  {type:'mc', stem:`Read the report, then answer. Which statement is a claim that is <b>supported</b> by evidence from the trial?`,
   v:vis(passage('A FICTIONAL SEED COMPANY\'S REPORT',['<b>1.</b> "Our GM maize, which carries a drought-tolerance gene, gives a higher yield than ordinary maize."','<b>2.</b> "In our trial, 20 plots of each type were grown in one province during one dry season. The GM plots had the higher average yield."','<b>3.</b> "The gene cannot spread to other plants."','<b>4.</b> <i>Note from an independent reviewer:</i> the report describes no tests of pollen movement. The company ran and analysed the trial itself.'])),
   opts:['The GM plots had a higher average yield than the ordinary plots in the trial','The gene cannot spread to other plants, even by pollen or by seed','The GM maize will give a higher yield in other provinces, because it did in one','The results are reliable, because the company analysed its own data carefully'], ans:0,
   hint:'Look for the statement that the trial data actually back up.',
   sol:`<div class="step-line">Line 2 gives data: the GM plots had the higher average yield. That claim is supported.</div><div class="step-line">"The gene cannot spread" has no test behind it (line 4). "Every province, every year" goes beyond one province and one season. Other provinces were not tested, and the company analysing its own data does not make the results reliable.</div><div class="step-line ans">Answer: The GM plots had a higher average yield than the ordinary plots in the trial</div>`},
  {type:'mc', stem:`Which option gives <b>two</b> valid scientific criticisms of the company\'s report?`,
   v:vis(passage('A FICTIONAL SEED COMPANY\'S REPORT',['<b>1.</b> "Our GM maize, which carries a drought-tolerance gene, gives a higher yield than ordinary maize."','<b>2.</b> "In our trial, 20 plots of each type were grown in one province during one dry season. The GM plots had the higher average yield."','<b>3.</b> "The gene cannot spread to other plants."','<b>4.</b> <i>Note from an independent reviewer:</i> the report describes no tests of pollen movement. The company ran and analysed the trial itself.'])),
   opts:['It covered one season only, and it did not test whether the gene can spread by pollen','It grew both kinds of maize in the same province, and it compared them in the same season','It used a drought-tolerance gene, and it measured yield and not leaf colour','It was published by a company, and companies are never able to report true results'], ans:0,
   hint:'Look for criticisms about how much was tested.',
   sol:`<div class="step-line">One season and one province limit how far the result applies, and the claim that the gene cannot spread has no test (line 4). Both are valid.</div><div class="step-line">Growing both kinds in the same place and season is good design, a drought-tolerance gene is what the company set out to test, and leaf colour is irrelevant to yield. "Never able to report true results" is an overgeneralisation.</div><div class="step-line ans">Answer: It covered one season only, and it did not test whether the gene can spread by pollen</div>`},
  {type:'mc', stem:`The company says: "This trial proves that our GM maize should replace all ordinary maize in South Africa." Which response is the best <b>evaluation</b>?`,
   v:vis(passage('A FICTIONAL SEED COMPANY\'S REPORT',['<b>1.</b> "Our GM maize, which carries a drought-tolerance gene, gives a higher yield than ordinary maize."','<b>2.</b> "In our trial, 20 plots of each type were grown in one province during one dry season. The GM plots had the higher average yield."','<b>3.</b> "The gene cannot spread to other plants."','<b>4.</b> <i>Note from an independent reviewer:</i> the report describes no tests of pollen movement. The company ran and analysed the trial itself.'])),
   opts:['Not justified: one season in one province with company-run data cannot prove this claim','Justified: the GM plots out-yielded the ordinary plots, so the maize is better everywhere','Partly justified: the yield is reliable, but the gene needs a laboratory check first','Not justified: field trials cannot be trusted, so only laboratory tests should be used'], ans:0,
   hint:'Use the limits of the trial to judge the word "proves".',
   sol:`<div class="step-line">Claim: replace all ordinary maize. Evidence: one season, one province, company-run. Counter: the evidence is too narrow and not independent. Conclusion: more trials are needed.</div><div class="step-line">A higher yield in one trial does not prove the maize is better everywhere. The yield result is limited, not reliable on its own, and field trials are a valid way to test a crop; they just need repeating.</div><div class="step-line ans">Answer: Not justified: one season in one province with company-run data cannot prove this claim</div>`},
  {type:'text', stem:`Researchers who publish only the experiments that worked, and quietly drop the failed ones, give a skewed picture of the evidence. What name is given to this kind of error?`, ans:'bias', anyCase:true, accept:['biased','publication bias','reporting bias','selective reporting','bias in reporting','a bias','cherry picking','cherry-picking','selective reporting bias','biased reporting'], ph:'one word',
   hint:'It is a distortion in favour of one outcome.',
   sol:`<div class="step-line">Leaving out the results that do not fit makes the evidence look better than it is. This is bias (selective or publication bias).</div><div class="step-line ans">Answer: bias</div>`},
  {type:'mc', stem:`A laboratory ran ten trials of a new GM plant. Two gave the wanted result and were published. The other eight failed and were not reported. Evaluate this reporting.`,
   opts:['Poor: omitting the eight failures hides the true success rate and invites repeated work','Good: only the successful trials are useful to science, so failures need not be reported','Acceptable: two successes prove that the plant works, so the failures do not matter','Good: failed trials contain no information, because they show nothing about the method'], ans:0,
   hint:'What would a reader think about the plant after seeing only the two successes?',
   sol:`<div class="step-line">Reporting only the two successes suggests the method works far more often than it does (bias).</div><div class="step-line">Reporting failures shows the true success rate, warns others not to repeat the same experiments, and can point to flaws in the method. Failures contain information.</div><div class="step-line ans">Answer: Poor: omitting the eight failures hides the true success rate and invites repeated work</div>`}
  ]}
];

/* ==========================================================
   ENGINE
   ========================================================== */
const app = document.getElementById('app');
const stepsEl = document.getElementById('steps');
const lvlNumEl = document.getElementById('lvlNum');
const lvlNameEl = document.getElementById('lvlName');
const scoreLblEl = document.getElementById('scoreLbl');
const stripEl = document.getElementById('strip');

const S = {
  name:'',
  li:0,
  pending:[],          // stack of levels to come back to
  qIdx:LEVELS.map(function(){return 0;}),
  seen:LEVELS.map(function(){return false;}),
  stats:LEVELS.map(function(l){return {asked:0,correct:0,wrong:0,reteaches:0,reached:false};}),
  totalQ:0, totalC:0,
  t0:Date.now(),
  cur:null,            // current question object
  sel:null,            // selected mc index
  tries:0,
  ended:false
};

/* ---------- strip ---------- */
function buildStrip(){
  stepsEl.innerHTML = LEVELS.map(function(l,i){return '<div class="step" id="st'+i+'"></div>';}).join('');
  var t=document.getElementById('lvlTot'); if(t) t.textContent = LEVELS.length;
}
function paintStrip(){
  LEVELS.forEach(function(l,i){
    const el=document.getElementById('st'+i); if(!el) return;
    el.className='step';
    if(i===S.li && !S.ended) el.classList.add('now');
    else if(S.stats[i].wrong>0) el.classList.add('stumble');
    else if(S.stats[i].correct>0) el.classList.add('done');
  });
  lvlNumEl.textContent = S.li+1;
  lvlNameEl.textContent = LEVELS[S.li].short;
  scoreLblEl.textContent = S.totalC+' / '+S.totalQ+' correct';
}

/* ---------- small builders ---------- */
function card(inner){ return '<section class="card">'+inner+'</section>'; }
function band(html){ return '<div class="band">'+html+'</div>'; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function scrollTop(){ window.scrollTo({top:0,behavior:'smooth'}); }

/* ==========================================================
   SCREENS
   ========================================================== */
function screenStart(){
  stripEl.classList.add('hide');
  app.innerHTML = card(
    '<p class="eyebrow">IEB Grade 12 Life Sciences · Molecular strand</p>'+
    '<h1>The DNA Technology Ladder</h1>'+
    '<p class="sub">Eleven levels, from what a restriction enzyme does up to evaluating a genetic engineering debate at Paper I standard.</p>'+
    '<p>Each level teaches one idea, then asks you a question about it.</p>'+
    '<div class="callout"><span class="lbl">How this works</span>'+
    '<p>Get it right and you climb to the next level. <b>Get it wrong and you drop back one level</b> &mdash; where the idea is explained a <b>different way</b>, with a <b>different example</b>. Once that clicks, you climb straight back up and carry on.</p>'+
    '<p>Nothing is timed, and there is no penalty for dropping back. That is how the ladder is meant to work.</p></div>'+
    '<h3>What is your name?</h3>'+
    '<div class="inputrow"><input type="text" class="wide" id="nameIn" placeholder="Your name" autocomplete="off"></div>'+
    '<div class="btnrow"><button class="primary" id="goBtn">Start at Level 1</button></div>'
  );
  const inp=document.getElementById('nameIn');
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') start(); });
  document.getElementById('goBtn').onclick = start;
  function start(){
    S.name = (inp.value||'').trim();
    S.t0 = Date.now();
    stripEl.classList.remove('hide');
    screenTeach(false);
  }
}

function screenTeach(isRe){
  const L = LEVELS[S.li];
  S.stats[S.li].reached = true;
  if(isRe) S.stats[S.li].reteaches++;
  S.seen[S.li]=true;
  const t = isRe ? L.reteach : L.teach;
  let head='';
  if(isRe){
    head = band('<b>Let us try that a different way.</b> Same idea, new explanation, new example. Take your time &mdash; there is no rush and nothing is being marked.');
  }
  app.innerHTML = head + card(
    '<p class="eyebrow">Level '+(S.li+1)+' of '+LEVELS.length+' &middot; '+esc(L.name)+(isRe?' &middot; second look':'')+'</p>'+
    '<h2>'+t.h+'</h2>'+
    '<div style="margin-top:14px">'+t.b+'</div>'+
    '<div class="btnrow"><button class="primary" id="qBtn">'+(isRe?'Try a new question':'Try a question')+'</button></div>'
  ) + endLink();
  document.getElementById('qBtn').onclick = function(){ screenQuestion(); };
  wireEnd();
  paintStrip(); scrollTop();
}

function endLink(){
  return '<div style="text-align:center;margin-top:18px"><button class="link" id="endBtn">End the session and see my report</button></div>';
}
function wireEnd(){
  const b=document.getElementById('endBtn');
  if(b) b.onclick=function(){ if(confirm('End the session now and see the progress report?')) screenReport(); };
}

function screenQuestion(){
  const L = LEVELS[S.li];
  const q = L.qs[ S.qIdx[S.li] % L.qs.length ];
  S.qIdx[S.li]++;
  S.cur = q; S.sel = null; S.tries = 0;

  let body = '<p class="eyebrow">Level '+(S.li+1)+' &middot; '+esc(L.short)+'</p>';
  body += '<div class="qtext">'+q.stem+'</div>';
  if(q.v) body += q.v;
  body += answerUI(q);
  body += '<div class="btnrow"><button class="primary" id="checkBtn">Check my answer</button>'+
          '<button class="ghost" id="hintBtn">Show me a hint</button></div>'+
          '<div id="hintBox"></div><div id="fb"></div>';

  app.innerHTML = card(body) + endLink();

  document.getElementById('checkBtn').onclick = check;
  document.getElementById('hintBtn').onclick = function(){
    document.getElementById('hintBox').innerHTML =
      '<div class="fb nudge"><div class="hd">Hint</div><p>'+esc(q.hint)+'</p></div>';
    this.disabled=true; this.style.opacity=.5;
  };
  if(q.type==='mc'){
    Array.prototype.forEach.call(document.querySelectorAll('button.opt'),function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll('button.opt'),function(x){x.classList.remove('sel');});
        b.classList.add('sel'); S.sel=parseInt(b.dataset.i,10);
      };
    });
  } else {
    Array.prototype.forEach.call(document.querySelectorAll('.ansIn'),function(i){
      i.addEventListener('keydown',function(e){ if(e.key==='Enter') check(); });
    });
    const first=document.querySelector('.ansIn'); if(first) first.focus();
  }
  wireEnd();
  paintStrip(); scrollTop();
}

function answerUI(q){
  if(q.type==='mc'){
    return '<div class="opts">'+q.opts.map(function(o,i){
      return '<button class="opt" data-i="'+i+'">'+o+'</button>';
    }).join('')+'</div>';
  }
  if(q.type==='frac'){
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<span class="fracinput"><input type="text" class="ansIn" id="inN" inputmode="numeric" aria-label="numerator">'+
      '<span class="rule"></span>'+
      '<input type="text" class="ansIn" id="inD" inputmode="numeric" aria-label="denominator"></span></div>';
  }
  if(q.type==='order'){
    return '<div style="margin:14px 0">'+q.items.map(function(t,i){
      return '<div class="orderrow"><input type="text" class="ansIn" id="inO'+i+'" inputmode="numeric" aria-label="position of item '+String.fromCharCode(65+i)+'">'+
             '<div class="txt"><b>'+String.fromCharCode(65+i)+'.</b> '+t+'</div></div>';
    }).join('')+'</div><div style="font-size:13.5px;color:#6E6F72">Number the boxes <b>1</b> to <b>'+q.items.length+'</b> to show the correct order.</div>';
  }
  if(q.type==='text'){
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<input type="text" class="ansIn" id="inT" style="width:190px;text-align:left;font-size:19px" '+
      'autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="'+(q.ph||'')+'" aria-label="answer">'+
      '</div>';
  }
  if(q.type==='coeff'){
    var i=0, out='<div class="coeffrow">';
    q.parts.forEach(function(p){
      if(p==='+'){ out+='<span class="plus">+</span>'; return; }
      if(p==='->'){ out+='<span class="arrow">&rarr;</span>'; return; }
      out+='<input type="text" class="ansIn" id="inC'+i+'" inputmode="numeric" aria-label="coefficient '+(i+1)+'">'+ch(p);
      i++;
    });
    return out+'</div><div style="font-size:13.5px;color:#6E6F72;margin-top:-6px">Put a number in every box. If a formula needs no multiplier, type <b>1</b>.</div>';
  }
  if(q.type==='ratio'){
    const three = q.ans.c!==undefined;
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<input type="text" class="ansIn" id="inA" inputmode="numeric" style="width:72px" aria-label="first number">'+
      '<span class="colon">:</span>'+
      '<input type="text" class="ansIn" id="inB" inputmode="numeric" style="width:72px" aria-label="second number">'+
      (three?'<span class="colon">:</span><input type="text" class="ansIn" id="inC" inputmode="numeric" style="width:72px" aria-label="third number">':'')+
      '</div>';
  }
  if(q.type==='mixed'){
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<input type="text" class="ansIn" id="inW" inputmode="numeric" aria-label="whole number" style="width:64px">'+
      '<span class="fracinput"><input type="text" class="ansIn" id="inN" inputmode="numeric" aria-label="numerator">'+
      '<span class="rule"></span>'+
      '<input type="text" class="ansIn" id="inD" inputmode="numeric" aria-label="denominator"></span></div>';
  }
  return '<div class="inputrow"><span class="unit">Answer:</span>'+
    (q.unit==='R'?'<span class="unit">R</span>':'')+
    '<input type="text" class="ansIn wide" id="inX" inputmode="decimal" aria-label="answer">'+
    (q.unit&&q.unit!=='R'?'<span class="unit">'+q.unit+'</span>':'')+'</div>';
}

/* ---------- reading + marking ---------- */
function readInt(id){
  const el=document.getElementById(id); if(!el) return null;
  const v=(el.value||'').trim().replace(/\s/g,'');
  if(!/^-?\d+$/.test(v)) return null;
  return parseInt(v,10);
}
function readNum(id){
  const el=document.getElementById(id); if(!el) return null;
  let v=(el.value||'').trim().replace(/\s/g,'').replace(/,/g,'.').replace(/^R/i,'').replace(/%$/,'');
  v=v.replace(/\/.*$/,'');                              /* "90km/h" -> "90km" */
  v=v.replace(/[A-Za-z\u2113\u00b0\u00b2\u00b3]+$/,'');   /* "44g", "36m²" -> the number */
  if(!/^-?\d*\.?\d+$/.test(v)) return null;
  return parseFloat(v);
}

function mark(q){
  /* returns {state:'right'|'wrong'|'nudge'|'blank', msg} */
  if(q.type==='mc'){
    if(S.sel===null) return {state:'blank'};
    if(S.sel===q.ans) return {state:'right'};
    if(q.nudge && q.nudge[S.sel]) return {state:'nudge', msg:q.nudge[S.sel]};
    return {state:'wrong'};
  }
  if(q.type==='frac'){
    const n=readInt('inN'), d=readInt('inD');
    if(n===null||d===null||d===0) return {state:'blank'};
    if(n===q.ans.n && d===q.ans.d) return {state:'right'};
    if(n*q.ans.d === q.ans.n*d){
      return {state:'nudge', msg:'The <b>value</b> is right, but it is not in its lowest terms yet. Divide the top and the bottom by the biggest number that goes into both, then check again.'};
    }
    return {state:'wrong'};
  }
  if(q.type==='mixed'){
    const w=readInt('inW'), n=readInt('inN'), d=readInt('inD');
    if(w===null||n===null||d===null||d===0) return {state:'blank'};
    if(w===q.ans.w && n===q.ans.n && d===q.ans.d) return {state:'right'};
    const mine=w + n/d, target=q.ans.w + q.ans.n/q.ans.d;
    if(Math.abs(mine-target)<1e-9){
      if(n>=d) return {state:'nudge', msg:'Close. The value is right, but the fraction part must be <b>less than one whole</b>. Carry the extra whole across into the whole-number box.'};
      return {state:'nudge', msg:'The <b>value</b> is right, but the fraction part is not in its lowest terms. Simplify it and check again.'};
    }
    return {state:'wrong'};
  }
  if(q.type==='ratio'){
    const three = q.ans.c!==undefined;
    const a=readInt('inA'), b=readInt('inB'), c=three?readInt('inC'):null;
    if(a===null||b===null||(three&&c===null)) return {state:'blank'};
    if(a<=0||b<=0||(three&&c<=0)) return {state:'wrong'};
    if(a===q.ans.a && b===q.ans.b && (!three || c===q.ans.c)) return {state:'right'};
    let equiv = (a*q.ans.b === b*q.ans.a);
    if(three) equiv = equiv && (a*q.ans.c === c*q.ans.a);
    if(equiv){
      return {state:'nudge', msg:'That ratio has the <b>right proportions</b>, but it is not in its simplest form yet. Divide every number by the biggest value that goes into all of them, then check again.'};
    }
    return {state:'wrong'};
  }
  if(q.type==='order'){
    const n=q.ans.length, got=[];
    for(let i=0;i<n;i++){
      const v=readInt('inO'+i);
      if(v===null) return {state:'blank'};
      got.push(v);
    }
    const seen={};
    let perm=true;
    for(let i=0;i<n;i++){ if(got[i]<1||got[i]>n||seen[got[i]]) perm=false; seen[got[i]]=1; }
    if(!perm) return {state:'nudge', msg:'Use each number from <b>1 to '+n+' exactly once</b> &mdash; one number per sentence, no repeats and none left out.'};
    let same=true; for(let i=0;i<n;i++) if(got[i]!==q.ans[i]) same=false;
    if(same) return {state:'right'};
    return {state:'wrong'};
  }
  if(q.type==='text'){
    const el=document.getElementById('inT'); if(!el) return {state:'blank'};
    const norm=function(t){
      return String(t)
        .replace(/\s+/g,'')
        .replace(/\u2212/g,'-')                 /* a real minus sign */
        .replace(/\u00d7|\u00b7/g,'*')          /* × or · */
        .replace(/\u00b2/g,'^2').replace(/\u00b3/g,'^3')
        .replace(/\*\*/g,'^')                   /* 3x**2 */
        .replace(/^(y'|f'\(x\)|dy\/dx)=/,'')    /* "y' = ..." */
        .replace(/^=/,'').replace(/[.,;]+$/,'')
        .replace(/(\d)\*(?=[a-zA-Z(])/g,'$1');  /* 3*x -> 3x */
    };
    /* anyCase:true marks the answer as a WORD, not a symbol. Capitals stop
       mattering and a leading article is ignored, so "Nucleus" and
       "the nucleus" are simply right. Leave it off for chemical formulae,
       element symbols, units and anything else where MgO and mgo differ. */
    const prose=function(t){
      return String(t).replace(/^\s*(the|a|an)\s+/i,'');
    };
    const raw=norm(q.anyCase?prose(el.value||''):(el.value||''));
    if(!raw) return {state:'blank'};
    const ok=[q.ans].concat(q.accept||[]).map(function(t){
      return norm(q.anyCase?prose(t):t);
    });
    for(let i=0;i<ok.length;i++) if(raw===ok[i]) return {state:'right'};
    if(q.anyCase){
      for(let i=0;i<ok.length;i++) if(raw.toLowerCase()===ok[i].toLowerCase()) return {state:'right'};
      return {state:'wrong'};
    }
    for(let i=0;i<ok.length;i++) if(raw.toLowerCase()===ok[i].toLowerCase()){
      return {state:'nudge', msg:(q.caseMsg||'You have the right symbols in the right order &mdash; check your <b>capital letters</b> and try again.')};
    }
    return {state:'wrong'};
  }
  if(q.type==='coeff'){
    const n=q.ans.length, got=[];
    for(let i=0;i<n;i++){
      const v=readInt('inC'+i);
      if(v===null||v<1) return {state:'blank'};
      got.push(v);
    }
    let same=true; for(let i=0;i<n;i++) if(got[i]!==q.ans[i]) same=false;
    if(same) return {state:'right'};
    const k=got[0]/q.ans[0];
    let mult = Number.isInteger(k) && k>1;
    if(mult) for(let i=0;i<n;i++) if(got[i]!==q.ans[i]*k) mult=false;
    if(mult) return {state:'nudge', msg:'That equation <b>is</b> balanced &mdash; but every coefficient can still be divided by '+k+'. An answer must use the <b>smallest whole numbers</b> that work. Divide them all by '+k+' and check again.'};
    return {state:'wrong'};
  }
  const x=readNum('inX');
  if(x===null) return {state:'blank'};
  return {state:(Math.abs(x-q.ans)<1e-9?'right':'wrong')};
}

function check(){
  const q=S.cur;
  const r=mark(q);
  const fb=document.getElementById('fb');

  if(r.state==='blank'){
    fb.innerHTML='<div class="fb nudge"><div class="hd">Nothing entered yet</div><p>'+
      (q.type==='mc'?'Tap one of the options first, then press <b>Check my answer</b>.':'Type a number into every box, then press <b>Check my answer</b>.')+'</p></div>';
    return;
  }
  if(r.state==='nudge'){
    fb.innerHTML='<div class="fb nudge"><div class="hd">Almost there</div><p>'+r.msg+'</p></div>';
    return; /* free retry, no penalty */
  }

  /* lock the inputs */
  Array.prototype.forEach.call(document.querySelectorAll('.ansIn'),function(i){i.disabled=true;});
  document.getElementById('checkBtn').disabled=true;
  const hb=document.getElementById('hintBtn'); if(hb){hb.disabled=true; hb.style.opacity=.5;}
  if(q.type==='mc'){
    Array.prototype.forEach.call(document.querySelectorAll('button.opt'),function(b){
      const i=parseInt(b.dataset.i,10); b.disabled=true; b.classList.remove('sel');
      if(i===q.ans) b.classList.add('right');
      else if(i===S.sel) b.classList.add('wrong');
    });
  }

  S.totalQ++; S.stats[S.li].asked++;

  if(r.state==='right'){
    S.totalC++; S.stats[S.li].correct++;
    onRight(fb);
  } else {
    S.stats[S.li].wrong++;
    onWrong(fb,q);
  }
  paintStrip();
}

function onRight(fb){
  const q=S.cur;
  const backTo = (S.pending.length && S.pending[S.pending.length-1] > S.li) ? S.pending[S.pending.length-1] : null;
  const last = (S.li === LEVELS.length-1);
  let msg, btn;

  if(backTo!==null){
    msg='<p>You have got that concept back. Now let us return to <b>Level '+(backTo+1)+' &mdash; '+esc(LEVELS[backTo].short)+'</b> and look at it a different way.</p>';
    btn='Back up to Level '+(backTo+1);
  } else if(last){
    msg='<p>That is the top of the ladder: full IEB Grade 12 standard on DNA technology. Well done.</p>';
    btn='See my report';
  } else {
    msg='<p>Next up: <b>Level '+(S.li+2)+' &mdash; '+esc(LEVELS[S.li+1].short)+'</b>.</p>';
    btn='Climb to Level '+(S.li+2);
  }

  fb.innerHTML='<div class="fb ok"><div class="hd">Correct'+(S.name?', '+esc(S.name):'')+'</div>'+
    '<div class="worked" style="background:#fff;border-style:solid"><span class="lbl">How it works out</span>'+q.sol+'</div>'+
    msg+'</div>'+
    '<div class="btnrow"><button class="primary" id="nextBtn">'+btn+'</button></div>';

  document.getElementById('nextBtn').onclick=function(){
    if(backTo!==null){
      S.pending.pop();
      S.li=backTo;
      screenTeach(true);          /* re-teach the failed concept a different way */
    } else if(last){
      screenReport();
    } else {
      S.li++;
      screenTeach(false);         /* first teaching of the new concept */
    }
  };
  scrollTop();
}

function onWrong(fb,q){
  const canDrop = S.li>0;
  const target = canDrop ? S.li-1 : 0;
  let msg,btn;

  if(canDrop){
    msg='<p>No problem &mdash; this usually means the step underneath needs shoring up. We are going back to <b>Level '+(target+1)+' &mdash; '+esc(LEVELS[target].short)+'</b>, where it will be explained a different way with a different example. Then we come straight back to this one.</p>';
    btn='Go back to Level '+(target+1);
  } else {
    msg='<p>This is the very first level, so there is nothing below it. Let us look at the same idea from a completely different angle instead.</p>';
    btn='Explain it differently';
  }

  fb.innerHTML='<div class="fb no"><div class="hd">Not quite</div>'+
    '<div class="worked" style="background:#fff;border-style:solid"><span class="lbl">The correct working</span>'+q.sol+'</div>'+
    msg+'</div>'+
    '<div class="btnrow"><button class="primary" id="nextBtn">'+btn+'</button></div>';

  document.getElementById('nextBtn').onclick=function(){
    if(canDrop){
      S.pending.push(S.li);   /* remember to come back and re-teach this one */
      S.li=target;
    }
    screenTeach(true);
  };
  scrollTop();
}

/* ==========================================================
   REPORT
   ========================================================== */
function screenReport(){
  S.ended=true;
  const mins = Math.max(1, Math.round((Date.now()-S.t0)/60000));
  const reached = S.stats.filter(function(s){return s.reached;}).length;
  const topLevel = S.stats.reduce(function(a,s,i){return s.correct>0?i+1:a;},0);
  const acc = S.totalQ? Math.round(100*S.totalC/S.totalQ):0;

  function status(s){
    if(!s.reached) return '<span class="pill nr">Not reached</span>';
    if(s.wrong===0 && s.correct>0) return '<span class="pill first">Secure</span>';
    if(s.wrong===1) return '<span class="pill re">Needed a re-teach</span>';
    if(s.wrong>1) return '<span class="pill hard">Needs more work</span>';
    return '<span class="pill nr">Started</span>';
  }
  function note(s,L){
    if(!s.reached) return 'Not covered in this session.';
    if(s.wrong===0 && s.correct>0) return 'Answered correctly first time.';
    if(s.wrong===0) return 'Taught but not yet answered.';
    return s.wrong+' incorrect attempt'+(s.wrong===1?'':'s')+', '+s.correct+' correct after re-teaching.';
  }

  const focus = S.stats.map(function(s,i){return {s:s,L:LEVELS[i],i:i};})
                       .filter(function(o){return o.s.wrong>0;})
                       .sort(function(a,b){return b.s.wrong-a.s.wrong;});

  let rows = LEVELS.map(function(L,i){
    const s=S.stats[i];
    return '<tr><td><b>'+(i+1)+'</b></td><td>'+esc(L.name)+'</td><td>'+status(s)+'</td><td>'+note(s,L)+'</td></tr>';
  }).join('');

  let focusHtml;
  if(!focus.length){
    focusHtml = '<div class="callout"><span class="lbl">Focus next</span><p>Every question attempted was answered correctly first time. Move on to the Evolution by natural selection ladder.</p></div>';
  } else {
    focusHtml = '<div class="callout"><span class="lbl">Focus next</span><ul style="margin-bottom:0">'+
      focus.slice(0,5).map(function(o){
        return '<li><b>'+esc(o.L.name)+'</b> (Level '+(o.i+1)+') &mdash; '+o.s.wrong+' slip'+(o.s.wrong===1?'':'s')+' here.</li>';
      }).join('')+'</ul></div>';
  }

  stripEl.classList.add('hide');
  app.innerHTML = card(
    '<p class="eyebrow">Progress report</p>'+
    '<h1>DNA Technology Ladder</h1>'+
    '<p class="sub">'+(S.name?esc(S.name)+' &nbsp;&middot;&nbsp; ':'')+'Genius Premium Tuition · IEB Grade 12 Life Sciences · DNA technology and genetic engineering &middot; '+new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'})+'</p>'+
    '<div class="kpis">'+
      '<div class="kpi"><div class="v">'+topLevel+' / '+LEVELS.length+'</div><div class="k">Highest level passed</div></div>'+
      '<div class="kpi"><div class="v">'+S.totalC+' / '+S.totalQ+'</div><div class="k">Questions correct</div></div>'+
      '<div class="kpi"><div class="v">'+acc+'%</div><div class="k">Accuracy</div></div>'+
      '<div class="kpi"><div class="v">'+mins+'</div><div class="k">Minutes</div></div>'+
    '</div>'+
    focusHtml+
    '<h3>Level by level</h3>'+
    '<table class="rep"><thead><tr><th style="width:38px">#</th><th>Concept</th><th style="width:150px">Status</th><th>Detail</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="btnrow"><button class="primary" id="printBtn">Print / save as PDF</button>'+
    '<button class="ghost" id="againBtn">Start again</button></div>'
  );
  document.getElementById('printBtn').onclick=function(){ window.print(); };
  document.getElementById('againBtn').onclick=function(){
    S.li=0; S.pending=[]; S.totalQ=0; S.totalC=0; S.ended=false;
    S.qIdx=LEVELS.map(function(){return 0;});
    S.stats=LEVELS.map(function(){return {asked:0,correct:0,wrong:0,reteaches:0,reached:false};});
    S.t0=Date.now();
    stripEl.classList.remove('hide');
    screenTeach(false);
  };
  scrollTop();
}


/* ---------- balance the multiple-choice keys ----------
   The correct option is distributed evenly across the available positions, so
   the answer can never be guessed from where it sits. Questions whose options
   are bare position labels (A, B, C ...) refer to something on screen and are
   left exactly as written. */
function balanceKeys(){
  var counter=0;
  LEVELS.forEach(function(L){
    L.qs.forEach(function(q){
      if(q.type!=='mc'||!q.opts) return;
      var label=true;
      q.opts.forEach(function(o){ if(!/^[A-E]$/.test(String(o).trim())) label=false; });
      if(label) return;
      var n=q.opts.length, target=counter++ % n;
      if(target===q.ans) return;
      var tmp=q.opts[target]; q.opts[target]=q.opts[q.ans]; q.opts[q.ans]=tmp;
      if(q.nudge){
        var nn={};
        Object.keys(q.nudge).forEach(function(k){
          var i=parseInt(k,10);
          nn[i===target?q.ans:(i===q.ans?target:i)]=q.nudge[k];
        });
        q.nudge=nn;
      }
      q.ans=target;
    });
  });
}
balanceKeys();

/* ---------- boot ---------- */
document.getElementById('stamp').textContent = new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'});
buildStrip();
screenStart();

</script>
