${keyterms([['bipedalism','walking upright on two legs'],['foramen magnum','opening in the skull for the spinal cord'],['S-shaped spine','curved spine that absorbs shock'],['pelvis','hip bones: short and broad in bipeds'],['femur','thigh bone, angled inwards in bipeds'],['arched foot','foot arch with the big toe in line']])}` },
  reteach:{ h:'A tour of the skeleton, from skull to footprint', b:`
<p>Imagine you hold an unlabelled skeleton and must decide whether it walked upright. Check it in this order, from the top of the body down.</p>
${chain([
 '<b>Skull.</b> Find the opening for the spinal cord. Under the skull means upright. Towards the back means on all fours.',
 '<b>Spine.</b> Several curves in an S-shape means upright. One gentle curve means on all fours.',
 '<b>Pelvis.</b> A short, broad bowl means upright. A long, narrow blade means on all fours.',
 '<b>Thigh bone.</b> Angled inwards towards the knee means upright.',
 '<b>Limbs.</b> Legs longer than arms means upright.',
 '<b>Foot.</b> An arch, and a big toe in line with the others, means upright.',
 '<b>Footprints.</b> No bones needed. The Laetoli footprints in Tanzania, about 3,6 million years old, show the same foot pattern: a heel strike, an arch and a big toe in line.'])}
${hwk([
 'Suppose a skeleton has these features: a big toe that grips; thigh bones that do not angle inwards; arms longer than legs.',
 'Big toe: grips, so on all fours. Thigh bone: not angled inwards, so on all fours. Limbs: arms longer, so on all fours.'],
 'Every check points to walking on all fours: this skeleton was not bipedal.')}
${hrule('Three or more upright features together make a strong case. One feature on its own is weaker evidence.')}
${keyterms([['foramen magnum','under the skull in bipeds'],['S-shaped spine','upright posture'],['bowl-shaped pelvis','supports the upper body'],['Laetoli footprints','about 3,6 million years old, Tanzania']])}` },
  qs:[
  {type:'text', stem:`Name the opening at the base of the skull through which the spinal cord passes. Its position under the skull is evidence of bipedalism.`, ans:'foramen magnum', anyCase:true,
   accept:['the foramen magnum','magnum','foramen'], ph:'two words',
   hint:`The Latin name means "great hole".`,
   sol:hsol(['The spinal cord leaves the skull through the foramen magnum.','In bipeds it is under the skull, so the head balances on top of the spine.'],'Answer: foramen magnum')},
  {type:'mc', stem:`The spine of a human is S-shaped. What is the advantage of this shape for a bipedal animal?`,
   opts:['It absorbs shock and balances the trunk over the hips','It makes the spine straight and stiff for running fast','It lets the animal bend forward to use its knuckles','It makes the back longer so the arms touch the ground'], ans:0,
   hint:`Think of a spring that has to carry the weight of the body.`,
   sol:hsol(['The curves act like a spring: they absorb the shock of each step.','They also bring the weight of the head and trunk over the hips, so the body is balanced.','A straight stiff spine would transmit shock to the head. Knuckle-walking and long arms belong to quadrupeds.'],'Answer: it absorbs shock and balances the trunk over the hips')},
  {type:'mc', stem:`Which pair of features, seen on a fossil skeleton, gives the strongest evidence that the animal was <b>bipedal</b>?`,
   opts:['A foramen magnum at the back of the skull and a long narrow pelvis','A femur angled inwards and a big toe in line with the other toes','Arms longer than the legs and a flat foot with an opposable toe','An S-shaped spine and a pelvis that is long and blade-like'], ans:1,
   hint:`Look for the option where both features are upright features.`,
   sol:hsol(['An inward-angled femur and an in-line big toe are both upright features.','The first option has two ape-like features. The third has two ape-like features. The fourth mixes an upright spine with an ape-like pelvis, which is weaker evidence.'],'Answer: A femur angled inwards and a big toe in line with the other toes')},
  {type:'mc', stem:`The Laetoli footprints in Tanzania are about 3,6 million years old. Why are they evidence of bipedalism?`,
   opts:['They show a heel strike, an arch and an in-line big toe','They show knuckle impressions beside each foot print as well','They show long claw marks at the front of each print','They show a wide, splayed big toe pointing outwards'], ans:0,
   hint:`Compare the foot of a human with the foot of a chimpanzee.`,
   sol:hsol(['The prints have a human-like pattern: a heel strike, a clear arch, and a big toe in line with the other toes, in two parallel trails.','Knuckle marks and splayed toes are ape-like features and are not seen at Laetoli. Primates do not have claws.'],'Answer: They show a heel strike, an arch and an in-line big toe')},
  {type:'mc', stem:`Two fossil skeletons were compared. Study the table, then choose the best conclusion.`,
   v:dataTable(['Feature','Fossil P','Fossil Q'],[
     ['Foramen magnum','Under the skull','Towards the back'],
     ['Pelvis','Short and broad','Long and narrow'],
     ['Femur','Angled inwards','Not angled inwards'],
     ['Arms compared with legs','Longer','Longer'],
     ['Big toe','In line with other toes','Splayed, opposable']],{w:480}),
   opts:['Fossil P was bipedal but may also have climbed; Fossil Q was a quadruped','Both fossils were bipedal, because both have arms that are longer than the legs','Fossil Q was bipedal, because its arms are longer than its legs','Neither fossil can be classified without knowing its age'], ans:0,
   hint:`Count the upright features for each fossil, then think about what long arms add.`,
   sol:hsol(['Fossil P has four upright features (central foramen magnum, short broad pelvis, inward-angled femur, in-line big toe), so it was bipedal.','Its long arms are not upright evidence: they suggest it may still have climbed trees.','Fossil Q has ape-like features in the skull, pelvis, femur and foot, so it was a quadruped. Age does not decide posture.'],'Answer: Fossil P was bipedal but may also have climbed; Fossil Q was a quadruped')}
  ] },

/* ================= LEVEL 4 ================= */
{ id:4, name:'Why bipedalism evolved, and its costs', short:'Bipedalism: why and costs',
  teach:{ h:'Upright walking may have helped hominins in several ways, but it cost something', b:`
<p>Scientists have put forward several <b>hypotheses</b> (suggested explanations) for why bipedalism evolved. Natural selection would favour it if upright individuals survived and reproduced more often than the others. One well-known hypothesis, the <b>savanna hypothesis</b>, links this to forests shrinking and open grassland spreading, so that upright individuals had an advantage.</p>
${cards([
 {t:'Seeing over tall grass', d:'Standing upright lifts the eyes above the grass, to spot predators and food sooner.'},
 {t:'Carrying', d:'Hands free to carry food, infants and tools while walking.'},
 {t:'Keeping cool', d:'Less of the body faces the overhead sun, so less heat is gained in open habitat.'},
 {t:'Efficient walking', d:'Upright walking uses less energy over long distances than knuckle-walking.'},
 {t:'Using tools', d:'Free hands can make, hold and throw tools.'}
], {min:200})}
<p>It also had <b>costs</b> (trade-offs):</p>
${cards([
 {t:'Childbirth', d:'The birth canal in the pelvis became narrower, so giving birth became more difficult.', hi:true},
 {t:'Speed', d:'Upright hominins sprint more slowly than four-legged predators.', hi:true}
], {min:200})}
${hwk([
 'Question (2 marks): Explain how bipedalism may have helped hominins living in open habitat with tall grass.',
 'Standing upright lifted the eyes above the grass (1 mark).',
 'So predators or food could be seen sooner, which improved the chances of survival (1 mark).'],
 'Model answer: state the advantage, then say how it helps survival.')}
${hrule('Each hypothesis names an <b>advantage</b> that would let upright individuals survive and reproduce more. Some hypotheses may all be true together.')}
${htrap('Do not write that hominins "needed" or "decided" to stand upright. Individuals that happened to walk upright better survived and passed on their genes.')}
${keyterms([['hypothesis','a suggested explanation that can be tested'],['natural selection','individuals with helpful traits survive and reproduce more'],['savanna','open grassland with scattered trees'],['bipedalism','walking upright on two legs'],['trade-off','a benefit that comes with a cost'],['birth canal','the passage in the pelvis through which a baby is born']])}` },
  reteach:{ h:'Advantages and disadvantages side by side', b:`
<p>Put each hypothesis in a table: the advantage on the left, the cost on the right. Natural selection favours a trait when the benefits outweigh the costs.</p>
${contrast('Advantages of walking upright', 'Disadvantages (costs)', [
 ['Eyes above the grass to see danger','Slower sprinting than four-legged predators'],
 ['Hands free to carry food, infants and tools','Narrower birth canal, so giving birth is more difficult'],
 ['Less body surface in the overhead sun, and less energy used to travel far','Upright posture strains the spine and knees']])}
${hwk([
 'Question (2 marks): Explain how bipedalism may have reduced overheating in hot, open habitat.',
 'Standing upright exposes less of the body surface to the overhead sun (1 mark).',
 'So less heat is gained, and the body is raised away from the hot ground (1 mark).'],
 'Model answer: link the posture to less heat gained.')}
${hrule('A good evaluation names at least one benefit AND one cost, then says which side outweighed the other.')}
${keyterms([['advantage','helps survival and reproduction'],['cost','a disadvantage that came with the trait'],['trade-off','benefit and cost together'],['narrower birth canal','made birth harder']])}` },
  qs:[
  {type:'text', stem:`Walking upright freed which part of the body from walking, so that it could be used to carry food and infants and to make tools?`, ans:'hands', anyCase:true,
   accept:['hand','the hands','arms','the arms','arms and hands','hands and arms','forelimbs','front limbs','forearms'], ph:'one word',
   hint:`Think about which limbs no longer carry weight when walking upright.`,
   sol:hsol(['On four legs, the front limbs bear weight during walking.','Upright on two legs, the hands are free to carry and to use tools.'],'Answer: the hands')},
  {type:'mc', stem:`Walking upright on two legs uses less energy over long distances than knuckle-walking. How could this have helped early hominins that lived where food was scattered widely?`,
   opts:['They could travel further between food sources while using less energy','They could sprint faster than any predator, so they never needed shelter','They could push off with their knuckles, which made every step much longer','They could store extra fat in the pelvis to burn when food was scarce'], ans:0,
   hint:`Think about what saving energy lets an animal do when food is far apart.`,
   sol:hsol(['Efficient walking means a long journey costs less energy.','So a hominin could cover more ground to find scattered food. Sprinting is a cost of bipedalism, not a benefit. Knuckle-walking is the ape method, and bipeds do not store fat in the pelvis.'],'Answer: They could travel further between food sources while using less energy')},
  {type:'mc', stem:`Which of the following was a <b>disadvantage</b> of bipedalism for hominins?`,
   opts:['The birth canal narrowed, which made giving birth more difficult','The arched foot made long-distance walking use more energy','The hands were used for walking, so infants could not be carried','More of the body faced the midday sun, so overheating was more likely'], ans:0,
   hint:`Think about the passage through the pelvis that a baby has to pass through.`,
   sol:hsol(['A narrower birth canal made childbirth harder.','The arched foot saves energy, so the second option is wrong. Hands are free in bipeds. Upright posture reduces the area facing the sun.'],'Answer: The birth canal narrowed, which made giving birth more difficult')},
  {type:'order', stem:`According to the savanna hypothesis, bipedalism spread by natural selection. Put these steps in the correct order.`,
   items:['Upright individuals survived and reproduced more often','Forest shrank and open grassland spread','The bipedal trait became more common over many generations','Some individuals could walk upright more easily than others'], ans:[3,1,4,2],
   hint:`Start with the change in the environment, then the variation that was already there.`,
   sol:hsol(['The environment changed: forest shrank and grassland spread (1).','Variation already existed: some individuals walked upright more easily (2).','Those individuals survived and reproduced more (3), so the trait became more common over many generations (4).'],'Order: environment changes, variation, selection, trait spreads')},
  {type:'mc', stem:`A learner says: <i>"Bipedalism was only an advantage. It had no costs."</i> Which response is best?`,
   opts:['Not correct: it freed the hands and saved energy, but a narrower birth canal made birth harder','Correct: every hypothesis shows only benefits, so natural selection favoured it for that reason','Not correct: it had only costs, which is why hominins later returned to knuckle-walking','Correct: the pelvis of a biped shows no change, so there were no costs to bipedalism'], ans:0,
   hint:`A fair evaluation names both a benefit and a cost.`,
   sol:hsol(['Bipedalism had benefits (free hands, less energy used) and costs (a narrower birth canal made birth more difficult, and sprinting was slower).','It was favoured because, for hominins, the benefits outweighed the costs.','The statement "no costs" ignores the birth canal. "Only costs" would not explain why the trait spread.'],'Answer: Not correct: it freed the hands and saved energy, but a narrower birth canal made birth harder')}
  ] },

/* ================= LEVEL 5 ================= */
{ id:5, name:'Skulls, teeth and brain size', short:'Skull features',
  teach:{ h:'From Australopithecus to Homo sapiens the brain grows and the face flattens', b:`
<p>Skulls show how hominins changed. The <b>cranial capacity</b> (the volume of the braincase) increased, while the face and jaws became smaller and flatter.</p>
${vis(skullRow([
 {n:'Australopithecus', prog:0.8, cran:0.12, brow:false, d:'400 to 500 cm³'},
 {n:'Homo erectus', prog:0.5, cran:0.5, brow:true, d:'900 to 1 100 cm³'},
 {n:'Homo sapiens', prog:0.1, cran:1, brow:false, d:'about 1 350 cm³'}]), 'Skulls drawn from the side, facing left. The cranial capacities are approximate averages.')}
${contrast('Apes and early hominins', 'Homo sapiens', [
 ['Small cranial capacity','Large cranial capacity'],
 ['Face and jaws project forward (prognathism)','Flatter face: jaws project much less'],
 ['Brow ridge present, large in apes and in Homo erectus','Reduced brow ridge, high forehead'],
 ['Large canines in apes, still larger than ours in early hominins; U-shaped dental arcade in apes','Small canines; parabolic (curved) dental arcade'],
 ['No chin','A chin']])}
${hwk([
 'Question (2 marks): Give two differences between the face of Homo erectus and the face of Homo sapiens.',
 'Homo sapiens has a chin, but the jaw of Homo erectus slopes back with no chin (1 mark).',
 'Homo erectus has a thick brow ridge above the eyes, but Homo sapiens has a reduced brow ridge and a high forehead (1 mark).'],
 'Model answer: name the feature in BOTH species.')}
${hrule('Moving towards Homo sapiens: cranial capacity <b>increases</b>; prognathism, brow ridge and canines <b>decrease</b>; a chin appears.')}
${htrap('Write "larger cranial capacity" and "face projects less". Do not write "bigger head" or "smaller face": those are too vague to earn marks.')}
${keyterms([['cranial capacity','volume of the braincase, in cm³'],['prognathism','jaws and face projecting forward'],['brow ridge','bony ridge above the eye sockets'],['canine teeth','pointed teeth: large in apes, small in humans'],['dental arcade','shape of the rows of teeth: U-shaped in apes, parabolic in humans'],['chin','bony projection of the lower jaw, found in Homo sapiens']])}` },
  reteach:{ h:'The same story told in numbers', b:`
<p>Put the cranial capacities on one chart. The bars show how much the brain case grew, and a ratio shows how large the change was.</p>
${vis(barChart({title:'Approximate average cranial capacity (cm³)', cats:['A. afarensis','H. habilis','H. erectus','H. naledi','Neanderthal','H. sapiens'], series:[{name:'cm3', vals:[450,650,1000,550,1500,1350]}], w:520, yLabel:'cm³', max:1600, step:400}), 'Approximate averages: real fossils vary around these values.')}
${hwk([
 'How many times larger is the average braincase volume of Homo sapiens than that of A. afarensis?',
 'Divide: 1 350 ÷ 450 = 3.'],
 'Homo sapiens has about three times the braincase volume of A. afarensis.')}
<p><b>A tick-list for the face.</b> Ape-like: big canines, U-shaped tooth rows, strongly projecting jaws, no chin. Human-like: small canines, parabolic tooth rows, a flat face, a chin.</p>
<p>Remember from Level 3: the foramen magnum lies under the skull in bipeds. Skull shape is read the same way: pick one feature, then say what it shows.</p>
${hrule('The trend is upward but not perfectly straight: Neanderthals averaged slightly more than Homo sapiens, and Homo naledi had a small brain but lived late. Use the numbers to describe the trend, not just to name the biggest.')}
${keyterms([['cranial capacity','braincase volume in cm³'],['average','the typical value of many skulls'],['trend','a general direction of change over time'],['ratio','how many times larger one value is than another']])}` },
  qs:[
  {type:'text', stem:`What term is used for the volume of the braincase of a skull, usually measured in cm³?`, ans:'cranial capacity', anyCase:true,
   accept:['cranial volume','brain size','brain volume','braincase volume','brain capacity','capacity of the cranium','cranium capacity','skull capacity'], ph:'two words',
   hint:`The cranium is the part of the skull that holds the brain.`,
   sol:hsol(['The braincase is the cranium.','Its volume is the cranial capacity.'],'Answer: cranial capacity')},
  {type:'mc', stem:`Which pair of features indicates an <b>ape-like</b> skull?`,
   opts:['Large canine teeth and a U-shaped dental arcade','A prominent chin and a high, rounded forehead','Small canine teeth and a parabolic dental arcade','A foramen magnum under the skull and a flat face'], ans:0,
   hint:`Three of the options are human features.`,
   sol:hsol(['Apes have large canines and a U-shaped arcade, with the tooth rows parallel.','A chin, a high forehead, small canines, a parabolic arcade, a central foramen magnum and a flat face are all human features.'],'Answer: Large canine teeth and a U-shaped dental arcade')},
  {type:'num', stem:`The graph shows approximate average cranial capacities. By how many cm³ is the average cranial capacity of <i>Homo erectus</i> larger than that of <i>A. afarensis</i>?`,
   v:vis(barChart({title:'Approximate average cranial capacity (cm³)', cats:['A. afarensis','H. habilis','H. erectus','H. sapiens'], series:[{name:'cm3', vals:[450,650,1000,1350]}], w:440, yLabel:'cm³'}), 'Approximate average values'),
   ans:550, unit:'cm³',
   hint:`Read the two bars, then subtract the smaller from the larger.`,
   sol:hsol(['H. erectus: 1 000 cm³. A. afarensis: 450 cm³.','Difference: 1 000 − 450 = 550.'],'Answer: 550 cm³')},
  {type:'mc', stem:`Which change took place during the evolution of <i>Homo sapiens</i> from earlier hominins?`,
   opts:['The face became flatter and the jaws projected less','The canine teeth became larger and more pointed','The brow ridges became thicker and more prominent over time','The dental arcade became more U-shaped'], ans:0,
   hint:`Prognathism decreased.`,
   sol:hsol(['Over time prognathism decreased: the face became flatter.','Canines became smaller, brow ridges became reduced, and the arcade became parabolic. The other three options describe the opposite change.'],'Answer: the face became flatter and the jaws projected less')},
  {type:'mc', stem:`A researcher recorded features of three skulls, A, B and C. Which row identifies the three skulls correctly?`,
   v:dataTable(['Feature','Skull A','Skull B','Skull C'],[
     ['Cranial capacity','420 cm³','1 330 cm³','950 cm³'],
     ['Face','Strongly projecting','Flat','Moderately projecting'],
     ['Canine teeth','Fairly large','Small','Reduced'],
     ['Brow ridge','Small','None','Thick'],
     ['Chin','Absent','Present','Absent']],{w:540}),
   opts:['A: Australopithecus; B: Homo sapiens; C: Homo erectus','A: Homo erectus; B: Homo sapiens; C: Australopithecus','A: Australopithecus; B: Homo erectus; C: Homo sapiens','A: Homo sapiens; B: Australopithecus; C: Homo erectus'], ans:0,
   hint:`Match the smallest brain with the most projecting face, and the chin with the flattest face.`,
   sol:hsol(['Skull A: smallest brain, strongly projecting face, large canines, no chin: Australopithecus.','Skull B: large brain, flat face, small canines and a chin: Homo sapiens.','Skull C: intermediate brain size, thick brow ridge, no chin: Homo erectus.'],'Answer: A: Australopithecus; B: Homo sapiens; C: Homo erectus')}
  ] },

/* ================= LEVEL 6 ================= */
{ id:6, name:'Dating fossils: relative and absolute', short:'Dating fossils',
  teach:{ h:'Relative dating says older or younger; absolute dating gives an age in years', b:`
<p>Fossils are dated in two ways. <b>Relative dating</b> says whether a fossil is older or younger than another. <b>Absolute dating</b> gives an age in years, by measuring the decay of a radioactive isotope (<b>radiometric dating</b>).</p>
${vis(hstrata(['Layer 1 (top)','Layer 2','Layer 3 (fossil here)','Layer 4','Layer 5 (bottom)'], 2), 'In undisturbed rock the lowest layer was laid down first. The fossil is younger than layers 4 and 5 and older than layers 1 and 2.')}
${contrast3(['','Relative dating','Absolute (radiometric) dating'],[
 ['Method','Compares the position of rock layers (stratigraphy), or uses index fossils','Measures how much of a radioactive isotope has decayed'],
 ['Result','Older or younger than','An age in years'],
 ['Examples','Layer order; index fossils','Carbon-14: organic remains up to about 50 000 years. Potassium-argon: volcanic rock, millions of years']])}
<p>An <b>index fossil</b> is a species that lived for a short time over a wide area. Any layer containing it has the age of that species.</p>
${hwk([
 'A piece of charcoal has 12,5% of its original carbon-14 left. The half-life of carbon-14 is 5 730 years.',
 'Halve step by step: 100% → 50% → 25% → 12,5%. That is 3 half-lives.',
 'Age = 3 × 5 730 = 17 190 years.'],
 'The charcoal is about 17 190 years old.')}
${hrule('The <b>half-life</b> is the time taken for half of the radioactive atoms in a sample to decay. Age = number of half-lives × the half-life.')}
${htrap('Carbon-14 cannot date a fossil that is millions of years old: after about 50 000 years too little is left to measure. Use potassium-argon on the volcanic layers instead.')}
${keyterms([['stratigraphy','study of rock layers and their order'],['index fossil','a short-lived, widespread species that dates its layer'],['relative dating','older or younger, no age in years'],['absolute dating','an age in years from radioactive decay'],['half-life','time for half the radioactive atoms to decay'],['radiometric dating','dating by the decay of a radioactive isotope']])}` },
  reteach:{ h:'Which method? Ask how old you expect the fossil to be', b:`
<p>A fossil question usually needs both ideas: the skull and skeleton features tell you <b>what</b> it is, and dating tells you <b>how old</b> it is. Choose the dating method by asking two things: how old is the fossil likely to be, and what is it found in?</p>
${cards([
 {t:'Under about 50 000 years, bone, wood or charcoal', d:'Carbon-14 dating of the remains themselves.'},
 {t:'Millions of years, with volcanic ash or lava nearby', d:'Potassium-argon dating of the volcanic layers above and below the fossil.'},
 {t:'Only need older or younger', d:'Relative dating: compare the layers, or use an index fossil.'}
], {min:200})}
<p>To use a half-life, build a halving table. Here is one for a made-up isotope with a half-life of 1 000 years.</p>
${dataTable(['Half-lives passed','0','1','2','3','4'],[
 ['Amount left (g)','80','40','20','10','5'],
 ['Age (years)','0','1 000','2 000','3 000','4 000']],{w:540})}
${hwk([
 'A sample of the made-up isotope has 10 g left from 80 g.',
 'Find 10 g in the table: it is the column for 3 half-lives.',
 'Age = 3 × 1 000 = 3 000 years.'],
 'For carbon-14, use the same table but multiply by 5 730 instead of 1 000.')}
${hrule('Count the halvings first. Then multiply by the half-life.')}
${keyterms([['carbon-14','up to about 50 000 years'],['potassium-argon','volcanic rock, millions of years'],['relative dating','layers and index fossils'],['half-life','the halving time']])}` },
  qs:[
  {type:'mc', stem:`In an <b>undisturbed</b> sequence of rock layers, fossil X lies in a deep layer and fossil Y lies in a layer near the top. Which statement is correct?`,
   opts:['Fossil X is older, because deeper layers were laid down first','Fossil Y is older, because it is nearer the surface and so formed first','Both fossils are the same age because they share a sequence','The fossils cannot be compared until both are dated with carbon-14'], ans:0,
   hint:`New sediment is laid down on top of old sediment.`,
   sol:hsol(['Sediment settles in layers, each on top of the one before.','So in undisturbed rock the deepest layer is the oldest and the top layer is the youngest.','Fossils in the same sequence can still differ in age, and relative dating does not need carbon-14.'],'Answer: Fossil X is older, because deeper layers were laid down first')},
  {type:'num', stem:`Carbon-14 has a half-life of 5 730 years. A bone contained 100 units of carbon-14 when the animal died. It now contains 25 units. How old is the bone, in years?`, ans:11460, unit:'years',
   hint:`Halve 100 until you reach 25 and count the halvings.`,
   sol:hsol(['100 → 50 → 25: that is 2 half-lives.','Age = 2 × 5 730 = 11 460 years.'],'Answer: 11 460 years')},
  {type:'text', stem:`Dating that only shows whether one fossil is older or younger than another, without giving an age in years, is called ______ dating.`, ans:'relative', anyCase:true,
   accept:['relative dating','relative age','relative age dating'], ph:'one word',
   hint:`The opposite of absolute.`,
   sol:hsol(['Comparing layers or using index fossils gives only older or younger.','This is relative dating. Radiometric dating is absolute and gives an age in years.'],'Answer: relative')},
  {type:'mc', stem:`A hominin fossil, about 2 million years old, lies between two layers of volcanic ash. Which method could give its age <b>in years</b>?`,
   opts:['Potassium-argon dating of the volcanic ash layers','Carbon-14 dating of the fossil bone itself','Comparing the fossil with an index fossil in the same layer','Counting the layers between the fossil and the surface'], ans:0,
   hint:`Carbon-14 runs out after about 50 000 years.`,
   sol:hsol(['Volcanic ash contains potassium-40, which decays to argon over millions of years, so it can be dated.','Carbon-14 is too short-lived for 2 million years. The last two methods are relative and give no age in years.'],'Answer: Potassium-argon dating of the volcanic ash layers')},
  {type:'mc', stem:`A hominin bone lies between two undisturbed layers of volcanic ash. Potassium-argon dating gives the lower layer an age of 3,3 million years and the upper layer 3,1 million years. What can be concluded about the bone?`,
   opts:['It is between 3,1 and 3,3 million years old, so the layers bracket it','It is exactly 3,2 million years old, halfway between the layers','It is older than 3,3 million years, because it lies below the top layer','It is younger than 3,1 million years, because bone is organic material'], ans:0,
   hint:`The bone was buried after the lower layer formed and before the upper layer formed.`,
   sol:hsol(['The lower layer was laid down first (3,3 million years ago) and the upper layer last (3,1 million years ago).','The bone is between them, so its age lies between 3,1 and 3,3 million years. It need not be exactly in the middle.'],'Answer: It is between 3,1 and 3,3 million years old, so the layers bracket it')}
  ] },

/* ================= LEVEL 7 ================= */
{ id:7, name:'The australopithecines', short:'Australopithecines',
  teach:{ h:'Australopithecines walked upright but kept long arms and a small brain', b:`
<p><i>Australopithecus</i> was a group of bipedal hominins that lived in Africa about 4 to 2 million years ago. Their brains were small, about 400 to 500 cm³, and their long arms suggest they still climbed trees.</p>
${vis(timeline([
 {t:'About 4 mya', l:'Australopithecus lives in Africa'},
 {t:'3,67 mya', l:'Little Foot, Sterkfontein'},
 {t:'3,6 mya', l:'Laetoli footprints'},
 {t:'3,2 mya', l:'Lucy, A. afarensis'},
 {t:'About 2 mya', l:'Australopithecus dies out'}]), 'mya = million years ago. All dates are approximate.')}
${cards([
 {t:'Australopithecus afarensis', d:'Lucy (Hadar, Ethiopia) and the Laetoli footprints (Tanzania).'},
 {t:'Australopithecus africanus', d:'The Taung Child and Mrs Ples, both from South Africa.'},
 {t:'Little Foot', d:'A nearly complete skeleton from Sterkfontein. Ron Clarke named the species <i>Australopithecus prometheus</i>, but this is debated.'}
], {min:200})}
${hwk([
 'The australopithecines lived about 4 to 2 million years ago.',
 'Time span: 4 − 2 = 2 million years.',
 '<i>Homo sapiens</i> has existed for about 0,3 million years. 2 ÷ 0,3 ≈ 6,7.'],
 'Australopithecus lasted roughly 6 to 7 times longer than our species has so far.')}
${hrule('Australopithecines: <b>bipedal</b>, <b>ape-like long arms and curved finger bones</b> (signs of climbing), <b>small brain</b> (about 400 to 500 cm³), about 4 to 2 million years ago.')}
${htrap('Little Foot is an Australopithecus, but its exact species is debated. Say "Australopithecus" unless the question gives the species.')}
${keyterms([['Australopithecus','"southern ape": bipedal hominins, about 4 to 2 mya'],['A. afarensis','the species of Lucy'],['A. africanus','the species of the Taung Child and Mrs Ples'],['Lucy','about 3,2 mya, Hadar, Ethiopia'],['Taung Child','juvenile skull described by Raymond Dart'],['Little Foot','nearly complete skeleton, Sterkfontein']])}` },
  reteach:{ h:'A matching table and a memory hook for the fossils', b:`
<p>Match each famous fossil to its finder, its place and the kind of find. The dates on this table come from the dating methods in Level 6.</p>
${contrast3(['Fossil','Finder and place','Kind of find'],[
 ['Taung Child','Raymond Dart (found 1924, described 1925); Taung, North West','Juvenile skull'],
 ['Mrs Ples','Robert Broom (1947); Sterkfontein, Gauteng','Adult skull'],
 ['Little Foot','Ron Clarke; Sterkfontein','Nearly complete skeleton, about 3,67 million years old'],
 ['Lucy','Donald Johanson (1974); Hadar, Ethiopia','About 40% of a skeleton, about 3,2 million years old'],
 ['Laetoli footprints','Tanzania','Footprints, about 3,6 million years old']])}
${hrule('Memory hook: <b>T</b>aung = <b>t</b>oddler (a young skull). <b>M</b>rs Ples = <b>m</b>other (an adult skull). <b>L</b>ittle Foot = <b>l</b>arge (the big, nearly complete skeleton). <b>L</b>ucy = Ethiopia.')}
${hwk([
 'Clue: "Trails of footprints in volcanic ash, Tanzania, about 3,6 million years old."',
 'Footprints are not bones, so this is not a skeleton card.',
 'Match the place and age to the card.'],
 'The clue matches the Laetoli footprints: evidence of upright walking.')}
${keyterms([['Taung Child','Dart, 1925'],['Mrs Ples','Broom, 1947, Sterkfontein'],['Little Foot','Clarke, Sterkfontein, 3,67 mya'],['Lucy','Johanson, 1974, Hadar']])}` },
  qs:[
  {type:'text', stem:`Lucy, found at Hadar in Ethiopia in 1974, belongs to which species?`, ans:'Australopithecus afarensis', anyCase:true,
   accept:['A. afarensis','A.afarensis','afarensis','a afarensis','Australopithecus afarensis'], ph:'genus and species',
   hint:`The species name starts with af.`,
   sol:hsol(['Lucy is about 3,2 million years old and was found by Donald Johanson.','Her species is Australopithecus afarensis.'],'Answer: Australopithecus afarensis')},
  {type:'mc', stem:`Which pair of fossils both belong to <i>Australopithecus africanus</i>?`,
   opts:['The Taung Child and Mrs Ples','Lucy and the Taung Child','Lucy and Mrs Ples','Lucy and the Laetoli footprints'], ans:0,
   hint:`Lucy belongs to a different species.`,
   sol:hsol(['The Taung Child and Mrs Ples are both South African A. africanus fossils.','Lucy is A. afarensis, and the Laetoli footprints are not a fossil skeleton at all.'],'Answer: the Taung Child and Mrs Ples')},
  {type:'text', stem:`In 1925 Raymond Dart described the skull of a young australopithecine from a quarry in North West. It is known as the ______ Child.`, ans:'Taung', anyCase:true,
   accept:['Taung Child','the Taung Child','the Taung'], ph:'one word',
   hint:`It is named after the place where it was found.`,
   sol:hsol(['Dart described a juvenile skull found at Taung.','It is called the Taung Child.'],'Answer: Taung')},
  {type:'mc', stem:`Which of these is the most complete australopithecine skeleton found in South Africa?`,
   opts:['Mrs Ples','Lucy','Little Foot','The Taung Child'], ans:2,
   hint:`Think about which find is a skeleton rather than a skull.`,
   sol:hsol(['Little Foot is a nearly complete skeleton from Sterkfontein.','Mrs Ples is a skull and the Taung Child is a juvenile skull. Lucy is from Ethiopia.'],'Answer: Little Foot')},
  {type:'mc', stem:`A fossil has a foramen magnum under the skull, a cranial capacity of 460 cm³, curved finger bones, and arms that are long compared with its legs. Which interpretation is best?`,
   opts:['It walked upright but was also adapted for climbing; it is probably an australopithecine','It was a knuckle-walker, because its arms are long compared with its legs and its fingers are curved','It was a member of Homo, because it walked upright on two legs','It was a modern human, because the foramen magnum lies under the skull'], ans:0,
   hint:`Separate the upright evidence from the climbing evidence.`,
   sol:hsol(['A foramen magnum under the skull shows upright walking.','Curved fingers and long arms show climbing was still important, and a brain of 460 cm³ is small: the australopithecine pattern.','Knuckle-walkers have a foramen magnum towards the back. Homo and modern humans have much larger brains.'],'Answer: It walked upright but was also adapted for climbing; it is probably an australopithecine')}
  ] },

/* ================= LEVEL 8 ================= */
{ id:8, name:'Early Homo: habilis, erectus, naledi', short:'Early Homo',
  teach:{ h:'Early Homo made tools, used fire and left Africa, and one species surprised us', b:`
<p>The genus <i>Homo</i> appeared about 2,4 million years ago. Three early species are important in the exam: <i>Homo habilis</i>, <i>Homo erectus</i> and <i>Homo naledi</i>.</p>
${dataTable(['','Homo habilis','Homo erectus','Homo naledi'],[
 ['When','About 2,4 to 1,6 mya','About 1,9 mya to 100 000 years ago','About 335 000 to 236 000 years ago'],
 ['Where','Olduvai Gorge, Tanzania','Africa, then beyond: the first hominin to leave Africa','Rising Star cave, Dinaledi Chamber, South Africa'],
 ['Brain (approx.)','600 to 700 cm³','900 to 1 100 cm³','500 to 600 cm³'],
 ['Behaviour or discovery','"Handy man": simple Oldowan stone tools','Acheulean hand axes; used fire','Described by Lee Berger and colleagues in 2015'],
 ['Body','Small','Taller, with modern body proportions','Small brain and curved fingers (primitive); human-like feet (modern)']],{w:640})}
${hwk([
 'Two early species: one lived from about 2,4 to 1,6 mya and the other appeared about 1,9 mya.',
 'Did they overlap? The second began (1,9 mya) before the first ended (1,6 mya).',
 'The overlap lasted from 1,9 to 1,6 mya: 1,9 − 1,6 = 0,3 million years.'],
 'The two species lived side by side for about 300 000 years.')}
${hrule('Habilis: <b>stone tools</b>. Erectus: <b>fire, hand axes, taller body, out of Africa</b>. Naledi: <b>small brain with modern features, yet young</b>.')}
${htrap('A small brain does not mean an old fossil. Homo naledi had a small brain but lived only about 335 000 to 236 000 years ago.')}
${keyterms([['Homo habilis','"handy man", Oldowan tools'],['Oldowan tools','simple stone flakes and choppers'],['Homo erectus','fire, hand axes, first out of Africa'],['Acheulean hand axes','shaped, two-sided stone tools'],['Homo naledi','Rising Star cave, announced in 2015'],['Dinaledi Chamber','where Homo naledi was found']])}` },
  reteach:{ h:'A timeline of firsts, and two species side by side', b:`
<p>Follow the species in order of appearance, then compare two of them feature by feature.</p>
${chain([
 '<b>About 2,4 mya.</b> <i>Homo habilis</i> appears and is linked with Oldowan stone tools.',
 '<b>About 1,9 mya.</b> <i>Homo erectus</i> appears. Hand axes, fire, a taller body.',
 '<b>About 335 000 years ago.</b> <i>Homo naledi</i> is living in South Africa.'])}
${contrast3(['Feature','Homo habilis','Homo naledi'],[
 ['Name means','"Handy man"','"Star" (Sesotho), after the Rising Star cave'],
 ['When','About 2,4 to 1,6 mya','About 335 000 to 236 000 years ago'],
 ['Where','Olduvai Gorge, Tanzania','Rising Star cave, South Africa'],
 ['Brain','About 600 to 700 cm³','About 500 to 600 cm³'],
 ['Body','Small','Small brain and curved fingers, with human-like feet']])}
${hwk([
 'Use the table: which species had the larger brain on average, the one with about 650 cm³ (2,4 to 1,6 mya) or the one with about 550 cm³ (335 000 years ago)?',
 'Compare the two values: 650 is larger than 550.'],
 'The much older species had the larger brain, so a small brain does not mean an old fossil.')}
${hrule('Brain size alone does not give the age of a fossil. Always check the dates.')}
${keyterms([['habilis','stone tools'],['erectus','fire, hand axes'],['naledi','small brain, young date'],['Oldowan','simple tools'],['Acheulean','hand axes']])}` },
  qs:[
  {type:'text', stem:`Which early <i>Homo</i> species, whose name means "handy man", is linked with simple Oldowan stone tools?`, ans:'Homo habilis', anyCase:true,
   accept:['H. habilis','H.habilis','H habilis','habilis','Homo habilus'], ph:'genus and species',
   hint:`Handy comes from the Latin word habilis.`,
   sol:hsol(['Habilis means "handy" or "skilful".','Homo habilis is linked with Oldowan stone tools from Olduvai Gorge.'],'Answer: Homo habilis')},
  {type:'text', stem:`Which species of <i>Homo</i> made Acheulean hand axes, used fire, and was the first hominin to leave Africa?`, ans:'Homo erectus', anyCase:true,
   accept:['H. erectus','H.erectus','H erectus','erectus'], ph:'genus and species',
   hint:`Its name means "upright man".`,
   sol:hsol(['Hand axes, fire and the move out of Africa are all linked with one species.','That species is Homo erectus.'],'Answer: Homo erectus')},
  {type:'mc', stem:`Why did the discovery of <i>Homo naledi</i> in the Dinaledi Chamber of the Rising Star cave surprise scientists?`,
   opts:['It had a small brain but human-like feet, and lived only about 335 000 to 236 000 years ago','It was found in Europe, which showed that Homo naledi had left Africa before Homo erectus did','It had a cranial capacity of about 1 350 cm³, larger than that of any living human','It was found next to the oldest stone tools, showing that it was the first tool maker'], ans:0,
   hint:`Think about what a mixture of old and new features, with a recent date, does to a neat story.`,
   sol:hsol(['Homo naledi combined primitive features (a small brain of about 500 to 600 cm³, curved fingers) with modern ones (human-like feet).','It also lived surprisingly recently: about 335 000 to 236 000 years ago.','It was found in South Africa, not Europe. Its brain was small, and it was not linked with the oldest tools.'],'Answer: It had a small brain but human-like feet, and lived only about 335 000 to 236 000 years ago')},
  {type:'order', stem:`Put these species in the order in which they <b>first appeared</b>, earliest first.`,
   items:['Homo erectus','Homo naledi','Homo habilis'], ans:[2,3,1],
   hint:`Habilis dates from about 2,4 mya. Naledi dates from only a few hundred thousand years ago.`,
   sol:hsol(['Homo habilis: about 2,4 mya.','Homo erectus: about 1,9 mya.','Homo naledi: about 335 000 years ago.'],'Order: Homo habilis, Homo erectus, Homo naledi')},
  {type:'mc', stem:`Read the two statements.<br><b>1.</b> <i>Homo erectus</i> had modern body proportions and was taller than <i>Homo habilis</i>.<br><b>2.</b> <i>Homo naledi</i> has a small brain, so it must be older than <i>Homo habilis</i>.<br>Which statement(s) is/are correct?`,
   opts:['1 only','2 only','1 and 2','Neither'], ans:0,
   hint:`Check the date of Homo naledi.`,
   sol:hsol(['Statement 1 is correct: erectus was taller, with modern body proportions.','Statement 2 is wrong: Homo naledi dates from only about 335 000 to 236 000 years ago, much later than Homo habilis (2,4 to 1,6 mya). A small brain does not give the age.'],'Answer: 1 only')}
  ] },

/* ================= LEVEL 9 ================= */
{ id:9, name:'Neanderthals and modern humans', short:'Neanderthals, H. sapiens',
  teach:{ h:'Neanderthals and Homo sapiens were close relatives that met and interbred', b:`
<p><i>Homo neanderthalensis</i> lived in Europe and western Asia. <i>Homo sapiens</i> evolved in Africa. The two met, and today non-African people carry a small amount of Neanderthal DNA.</p>
${vis(skullRow([
 {n:'Homo neanderthalensis', prog:0.45, cran:1, brow:true, d:'1 400 to 1 600 cm³'},
 {n:'Homo sapiens', prog:0.1, cran:0.9, brow:false, d:'about 1 350 cm³'}]), 'Side views of skulls, facing left. The cranial capacities are approximate averages.')}
${cards([
 {t:'Neanderthals', d:'Europe and western Asia, about 400 000 to 40 000 years ago. Large brain, robust and cold-adapted body, tools, burials.'},
 {t:'Homo sapiens', d:'Africa, about 300 000 years ago (Jebel Irhoud). Chin, high forehead, slender skeleton, symbolic culture.'},
 {t:'Interbreeding', d:'People whose ancestors lived outside Africa carry about 1 to 2% Neanderthal DNA.', hi:true}
], {min:200})}
${hwk([
 'Question (2 marks): Explain how the body build of Neanderthals suited a cold climate.',
 'A short, stocky body with short limbs has a small surface area compared with its volume (1 mark).',
 'So less heat is lost to the cold air (1 mark).'],
 'Model answer: describe the build, then link it to heat loss.')}
${hrule('Neanderthals: <b>large brain, robust build, tools and burials</b>, gone about 40 000 years ago. <i>Homo sapiens</i>: <b>chin, high forehead, slender build, symbolic culture</b>, oldest fossils in Africa.')}
${htrap('Neanderthals were not "primitive brutes". They had large brains, made tools and buried their dead. They are also not the ancestors of modern humans: they are a related lineage.')}
${keyterms([['Homo neanderthalensis','Europe and western Asia, about 400 000 to 40 000 years ago'],['Homo sapiens','evolved in Africa about 300 000 years ago'],['Jebel Irhoud','oldest Homo sapiens fossils, Morocco'],['Blombos Cave','engraved ochre, about 75 000 years old'],['symbolic culture','art and ornaments that carry meaning'],['interbreeding','mating between two lineages']])}` },
  reteach:{ h:'Neanderthals and Homo sapiens compared in a table', b:`
<p>Place the two side by side and learn each row.</p>
${contrast('Homo neanderthalensis', 'Homo sapiens', [
 ['Europe and western Asia','Evolved in Africa'],
 ['About 400 000 to 40 000 years ago','Oldest fossils about 300 000 years ago, still living'],
 ['Cranial capacity about 1 400 to 1 600 cm³','Cranial capacity about 1 350 cm³'],
 ['Heavy brow ridge, no chin, sloping forehead','Chin, high forehead, reduced brow ridge'],
 ['Robust skeleton; tools and burials','Slender skeleton; symbolic culture such as engraved ochre']])}
${hwk([
 'A skull has a sloping forehead, a heavy brow ridge, no chin and a cranial capacity of about 1 500 cm³.',
 'No chin and a heavy brow ridge: not Homo sapiens.',
 'Large brain with a sloping forehead and heavy brow: matches the Neanderthal column.'],
 'The skull is Neanderthal.')}
${hrule('Neanderthals had brains as large as ours or larger. The differences lie in the shape of the skull and in the skeleton.')}
${keyterms([['Neanderthal','robust, cold-adapted, gone by about 40 000 years ago'],['Homo sapiens','chin, high forehead, slender build'],['1 to 2%','Neanderthal DNA in non-African people']])}` },
  qs:[
  {type:'mc', stem:`Which feature is found in <i>Homo sapiens</i> but <b>not</b> in Neanderthals?`,
   opts:['A well-formed chin','A heavy brow ridge','A sloping forehead','A robust skeleton'], ans:0,
   hint:`Look at the bone of the lower face.`,
   sol:hsol(['Homo sapiens has a chin, a high forehead and a slender skeleton.','Neanderthals had a heavy brow ridge, a sloping forehead and a robust skeleton, and no chin.'],'Answer: A well-formed chin')},
  {type:'num', stem:`Neanderthals lived from about 400 000 years ago until about 40 000 years ago. For how many years did they exist?`, ans:360000, unit:'years',
   hint:`Subtract the later date from the earlier date.`,
   sol:hsol(['Start: 400 000 years ago. End: 40 000 years ago.','400 000 − 40 000 = 360 000.'],'Answer: 360 000 years')},
  {type:'text', stem:`Engraved pieces of a red-brown mineral pigment, found at Blombos Cave and about 75 000 years old, are evidence of symbolic thought. Name the pigment.`, ans:'ochre', anyCase:true,
   accept:['red ochre','the ochre','engraved ochre','ocher','red ocher'], ph:'one word',
   hint:`It is a natural earth pigment, often red.`,
   sol:hsol(['Blombos Cave in the Western Cape has pieces of ochre engraved with patterns.','Engraving shows planned, symbolic behaviour.'],'Answer: ochre')},
  {type:'mc', stem:`Which observation is evidence that <i>Homo sapiens</i> and Neanderthals interbred?`,
   opts:['About 1 to 2% of the DNA of non-African people matches Neanderthal DNA','Neanderthal fossils have been found at sites in Africa and in Asia','Neanderthals and Homo sapiens had cranial capacities that were almost equal','Both Neanderthals and Homo sapiens made stone tools and used fire'], ans:0,
   hint:`Interbreeding shows up as shared DNA.`,
   sol:hsol(['Interbreeding passes DNA from one lineage to the other.','Non-African people carry 1 to 2% Neanderthal DNA. Similar brain size and similar tools show similarity, not interbreeding.'],'Answer: About 1 to 2% of the DNA of non-African people matches Neanderthal DNA')},
  {type:'mc', stem:`Neanderthals had a slightly larger average cranial capacity (about 1 500 cm³) than <i>Homo sapiens</i> (about 1 350 cm³). A learner concludes that Neanderthals were more intelligent. Which response is best?`,
   opts:['Not supported: cranial capacity alone does not measure intelligence, so behaviour counts too','Supported: a larger cranial capacity always means greater intelligence in every species','Not supported: the data show that Neanderthals had a smaller cranial capacity than Homo sapiens','Supported: Neanderthals lived for longer than Homo sapiens, so they must have been cleverer'], ans:0,
   hint:`Ask what else besides brain volume is needed to judge intelligence.`,
   sol:hsol(['Cranial capacity is volume, not ability. Tools, burials and art also have to be considered.','The data do show that Neanderthals averaged larger, so the third option misreads the data. Homo sapiens is still alive, so the last option is false.'],'Answer: Not supported: cranial capacity alone does not measure intelligence, so behaviour counts too')}
  ] },

/* ================= LEVEL 10 ================= */
{ id:10, name:'The Out of Africa hypothesis', short:'Out of Africa',
  teach:{ h:'Modern humans evolved in Africa, then spread across the world', b:`
<p>The <b>Out of Africa hypothesis</b> says that <i>Homo sapiens</i> evolved in Africa about 300 000 years ago, migrated out about 100 000 to 60 000 years ago, and replaced other hominin populations.</p>
${cards([
 {t:'Fossils', d:'The oldest Homo sapiens fossils (such as Jebel Irhoud, Florisbad) are from Africa.'},
 {t:'Mitochondrial DNA', d:'African populations show the greatest genetic diversity: they have had longest to accumulate mutations.'},
 {t:'Mitochondrial Eve', d:'All living people trace their mitochondrial DNA to one woman who lived in Africa about 150 000 to 200 000 years ago.'},
 {t:'Y chromosome', d:'Studies of the male line also point to an African origin.'},
 {t:'Diversity and distance', d:'Genetic diversity decreases with distance from Africa.'}
], {min:200})}
${contrast('Out of Africa', 'Multiregional hypothesis', [
 ['Homo sapiens evolved once, in Africa','Modern humans evolved in several regions from local Homo erectus populations'],
 ['Migrating groups replaced other hominins','Populations were linked by gene flow'],
 ['Supported by African fossils and DNA diversity','Supported by some regional fossil similarities']])}
${hwk([
 'A woman carries a DNA variant, M, in her mitochondria.',
 'The mitochondria of a zygote come from the ovum, so all of her children inherit M.',
 'Only her daughters pass M on again: her sons do not.'],
 'M travels down the female line only, so it can be traced back through the generations.')}
${hrule('Out of Africa: <b>African origin about 300 000 years ago, migration about 100 000 to 60 000 years ago, replacement of other hominins</b>.')}
${htrap('"Mitochondrial Eve" was not the only woman alive, and not the first woman. She is the most recent woman from whom all living people inherit their mitochondrial DNA.')}
${keyterms([['Out of Africa','Homo sapiens evolved in Africa, then spread'],['multiregional hypothesis','modern humans evolved in several regions'],['mitochondrial DNA (mtDNA)','DNA in mitochondria, inherited from the mother'],['mitochondrial Eve','the common maternal ancestor of all living people'],['genetic diversity','the variety of DNA types in a population'],['Y chromosome','passed from father to son']])}` },
  reteach:{ h:'Why diversity falls as groups move away: a model', b:`
<p>Think of each migration as a small group leaving with only a <b>sample</b> of the variation. The further the sample travels, the less variation is left.</p>
${vis(barChart({title:'Model: genetic diversity (invented values)', cats:['Africa','Region 2','Region 3','Region 4'], series:[{name:'diversity', vals:[100,85,70,55]}], w:420, yLabel:'diversity score', max:120, step:40}), 'A simplified model with invented numbers, to show the pattern: diversity falls with distance from the starting point.')}
${hwk([
 'A bag holds marbles of 10 colours. A small group takes a handful of 5 marbles.',
 'The handful can hold at most 5 of the 10 colours.',
 'The next group draws its handful from those, so it can have even fewer colours.'],
 'Each step away from the starting bag loses colours, just as each step away from Africa loses variants.')}
<p>The same reasoning applies to the DNA clues: mitochondrial DNA (mtDNA) is passed from a mother to all her children, so it follows the female line only. A fossil older than the African ones, found elsewhere, would challenge the whole idea.</p>
${hrule('The population with the <b>most</b> variation is the oldest, and it is the starting point. Variation falls the further the groups travel from it.')}
${keyterms([['sample','a small part taken from a larger group'],['genetic diversity','variety of DNA types'],['starting population','the oldest, with the most variation'],['founder group','a small group that starts a new population']])}` },
  qs:[
  {type:'mc', stem:`Which statement best summarises the <b>Out of Africa</b> hypothesis?`,
   opts:['Modern humans evolved in Africa about 300 000 years ago, then spread and replaced other hominins','Modern humans evolved separately in Africa, Asia and Europe from local Homo erectus populations over time','Modern humans evolved in Europe from Neanderthals and then moved south into Africa','Modern humans evolved in Africa and stayed there until the arrival of Homo erectus in Asia'], ans:0,
   hint:`The word out tells you the direction.`,
   sol:hsol(['Out of Africa: Homo sapiens evolved in Africa, then migrated and replaced other hominins.','The second option is the multiregional hypothesis. The third and fourth options contradict the fossil and DNA evidence.'],'Answer: Modern humans evolved in Africa about 300 000 years ago, then spread and replaced other hominins')},
  {type:'text', stem:`One line of evidence for the Out of Africa hypothesis comes from DNA that is passed on only from a mother to her children. Name this type of DNA (the abbreviation is also accepted).`, ans:'mitochondrial DNA', anyCase:true,
   accept:['mtDNA','mt DNA','mt-DNA','mitochondrial DNA (mtDNA)','mitochondrial-DNA','mitochondrial','DNA of the mitochondria','mitochondria DNA','mitochondrial dna'], ph:'two words',
   hint:`The name tells you which organelle it is found in.`,
   sol:hsol(['Mitochondria are inherited through the ovum, so this DNA follows the female line.','It is called mitochondrial DNA (mtDNA).'],'Answer: mitochondrial DNA')},
  {type:'mc', stem:`Why does the fact that African populations have the greatest genetic diversity support the Out of Africa hypothesis?`,
   opts:['Africa has the oldest populations, which have had the most time to accumulate mutations','African populations are the largest today, so they must have been the first','Mutations occur faster in African populations than in the populations of other continents','Diversity is highest where humans arrived last, so Africa must have been settled last'], ans:0,
   hint:`Mutations build up over time.`,
   sol:hsol(['Mutations add new variants to a population over time.','The oldest population has had longest to build up variants, so greatest diversity points to the oldest population: the one in Africa.','Population size and a faster mutation rate are not shown by the evidence.'],'Answer: Africa has the oldest populations, which have had the most time to accumulate mutations')},
  {type:'num', stem:`The graph is a <b>simplified model</b> with invented numbers. By how many points is the diversity score at Population Z lower than at Population W?`,
   v:vis(barChart({title:'Model: genetic diversity (invented values)', cats:['Pop. W','Pop. X','Pop. Y','Pop. Z'], series:[{name:'diversity', vals:[90,70,50,30]}], w:420, yLabel:'diversity score'}), 'Population W is nearest to Africa; Population Z is farthest.'),
   ans:60, unit:'points',
   hint:`Read the height of the first and last bars.`,
   sol:hsol(['Population W: 90. Population Z: 30.','90 − 30 = 60.'],'Answer: 60 points')},
  {type:'mc', stem:`Which discovery would most seriously <b>challenge</b> the Out of Africa hypothesis?`,
   opts:['Clear Homo sapiens fossils 600 000 years old in Asia, with none that old in Africa','More Homo sapiens fossils about 200 000 years old in Africa','Another large study that again finds the greatest mtDNA diversity in African populations','Neanderthal DNA found in about 1 to 2% of the DNA of non-African people'], ans:0,
   hint:`A challenge must contradict the idea of an African origin.`,
   sol:hsol(['If much older Homo sapiens fossils turned up outside Africa, an African origin about 300 000 years ago would be contradicted.','More African fossils and more African diversity support the hypothesis. Neanderthal DNA shows interbreeding after the migration, which does not contradict it.'],'Answer: Clear Homo sapiens fossils 600 000 years old in Asia, with none that old in Africa')}
  ] },

/* ================= LEVEL 11 ================= */
{ id:11, name:'The Cradle of Humankind and other sites', short:'South African sites',
  teach:{ h:'South Africa holds some of the richest hominin fossil sites in the world', b:`
<p>The <b>Cradle of Humankind</b>, north-west of Johannesburg in Gauteng, was declared a <b>UNESCO World Heritage Site</b> in 1999. The <b>Maropeng</b> visitor centre tells its story. Other important sites lie in other provinces.</p>
${cards([
 {t:'Sterkfontein', d:'Mrs Ples and Little Foot (Australopithecus).'},
 {t:'Swartkrans', d:'Paranthropus robustus; early evidence of the use of fire.'},
 {t:'Kromdraai', d:'Paranthropus robustus fossils.'},
 {t:'Rising Star cave', d:'Homo naledi, in the Dinaledi Chamber.'}
], {min:200})}
<p>Outside the Cradle:</p>
${cards([
 {t:'Taung (North West)', d:'The Taung Child.'},
 {t:'Makapansgat (Limpopo)', d:'Australopithecus fossils.'},
 {t:'Florisbad (Free State)', d:'An early Homo sapiens skull.'},
 {t:'Blombos Cave (Western Cape)', d:'Engraved ochre, about 75 000 years old.'},
 {t:'Klasies River (Eastern Cape)', d:'Remains of early Homo sapiens.'}
], {min:200})}
${hwk([
 'Question (2 marks): Name the Eastern Cape site where early Homo sapiens remains were found, and say whether it is part of the Cradle of Humankind.',
 'The site is Klasies River (1 mark).',
 'It lies in the Eastern Cape, far from Gauteng, so it is not part of the Cradle (1 mark).'],
 'Model answer: name the site, then place it using the province.')}
${hrule('The Cradle has many fossils because its <b>dolomite caves</b> trapped bones. Bones that fell or washed in were buried and cemented in hard rock (breccia), which protected them from decay.')}
${htrap('Not every famous South African site lies in the Cradle. The Taung Child was found in North West, and Blombos Cave is in the Western Cape. The UNESCO site was later extended to include Taung and Makapansgat, but the Cradle of Humankind itself is in Gauteng.')}
${keyterms([['Cradle of Humankind','UNESCO World Heritage Site since 1999'],['Maropeng','the visitor centre'],['Sterkfontein','Mrs Ples and Little Foot'],['Swartkrans','early use of fire'],['dolomite','rock in which the caves formed'],['breccia','hard rock of cemented sediment and bones']])}` },
  reteach:{ h:'A matching table and a map in words', b:`
<p>Learn the sites as a table: the site, the province and what was found there. Several of these sites hold the oldest Homo sapiens or Homo naledi fossils that the Out of Africa evidence rests on.</p>
${contrast3(['Site','Province','Fossil or evidence'],[
 ['Sterkfontein','Gauteng','Mrs Ples, Little Foot'],
 ['Swartkrans','Gauteng','Paranthropus robustus, early fire'],
 ['Kromdraai','Gauteng','Paranthropus robustus'],
 ['Rising Star cave','Gauteng','Homo naledi'],
 ['Taung','North West','The Taung Child'],
 ['Makapansgat','Limpopo','Australopithecus'],
 ['Florisbad','Free State','Early Homo sapiens'],
 ['Blombos Cave','Western Cape','Engraved ochre'],
 ['Klasies River','Eastern Cape','Early Homo sapiens']])}
<p><b>Map in words.</b> Start at Johannesburg. The four Cradle sites lie just to the north-west, in Gauteng. Travel west to North West for Taung. Travel north into Limpopo for Makapansgat. Travel south-west to the Free State for Florisbad. Reach the south coast for Blombos Cave (Western Cape) and Klasies River (Eastern Cape).</p>
${hwk([
 'Clue: "An early Homo sapiens skull from a site in the Free State."',
 'Look down the Province column for Free State: there is one row.'],
 'The site is Florisbad.')}
${hrule('The four Cradle sites are all in Gauteng: Sterkfontein, Swartkrans, Kromdraai and Rising Star.')}
${keyterms([['Gauteng','the four Cradle sites'],['North West','Taung'],['Limpopo','Makapansgat'],['Free State','Florisbad'],['Western Cape','Blombos Cave'],['Eastern Cape','Klasies River']])}` },
  qs:[
  {type:'mc', stem:`What status was given to the Cradle of Humankind in 1999?`,
   opts:['A UNESCO World Heritage Site','A national park','A provincial nature reserve','A wetland of international importance'], ans:0,
   hint:`UNESCO is the United Nations body for education, science and culture.`,
   sol:hsol(['In 1999 the Cradle of Humankind was declared a UNESCO World Heritage Site because of its hominin fossils.'],'Answer: a UNESCO World Heritage Site')},
  {type:'text', stem:`Mrs Ples and Little Foot were both found at the same cave site in the Cradle of Humankind. Name the site.`, ans:'Sterkfontein', anyCase:true,
   accept:['Sterkfontein caves','the Sterkfontein caves','Sterkfontein cave','Sterkfontein Caves'], ph:'one word',
   hint:`Robert Broom worked there in 1947.`,
   sol:hsol(['Robert Broom found Mrs Ples at Sterkfontein in 1947.','Ron Clarke found Little Foot at the same site.'],'Answer: Sterkfontein')},
  {type:'mc', stem:`Which pairing of site and fossil is correct?`,

   hint:`Match each fossil to the site where it was found, not to a site that sounds familiar.`,
   sol:hsol(['Homo naledi was found in the Dinaledi Chamber of the Rising Star cave.','The Taung Child was found at Taung, Lucy at Hadar in Ethiopia, and Mrs Ples at Sterkfontein.'],'Answer: Rising Star cave: Homo naledi')},
  {type:'mc', stem:`Why have so many hominin fossils been found in the caves of the Cradle of Humankind?`,
   opts:['Bones fell or washed into dolomite caves and were cemented in hard rock, protecting them from decay','Hominins lived only in caves, so no hominin fossils can be found in any other part of Africa at all','The caves are made of volcanic rock, so every fossil in them can be dated with carbon-14 dating','The caves are very young, so the bones inside have not had time to decay or weather'], ans:0,
   hint:`Think about what protects a bone from decay after it is buried.`,
   sol:hsol(['The caves formed in dolomite. Bones that fell or were washed in were buried and cemented in hard rock (breccia).','This protected them from decay and from scavengers. Hominins lived in many places, the rock is not volcanic, and carbon-14 cannot date fossils millions of years old.'],'Answer: Bones fell or washed into dolomite caves and were cemented in hard rock, protecting them from decay')},
  {type:'mc', stem:`Read the two statements.<br><b>1.</b> Swartkrans has evidence of the early use of fire.<br><b>2.</b> The Taung Child was found in Gauteng, inside the Cradle of Humankind.<br>Which statement(s) is/are correct?`,
