/* ================= LEVEL 12 ================= */
{ id:12, name:'Reading hominin phylogenetic trees', short:'Phylogenetic trees',
  teach:{ h:'A tree shows who shares a common ancestor with whom', b:`
<p>A <b>phylogenetic tree</b> shows how species are related. Each branching point is a <b>common ancestor</b> of the species beyond it. Two tips that join at a recent branching point are close relatives.</p>
${vis(cladogram(['Australopithecus',['Homo habilis',['Homo erectus',['Homo neanderthalensis','Homo sapiens']]]], {nodes:['A','B','C','D']}), 'A simplified hominin tree. Scientists still debate the exact branching.')}
${hwk([
 'Find the branching point where Homo habilis and Homo neanderthalensis last shared an ancestor.',
 'Trace back from Homo habilis: the first branching point is B.',
 'Trace back from Homo neanderthalensis: first D, then C, then B.',
 'The two paths meet at B, where the lineages split.'],
 'Homo habilis and Homo neanderthalensis last shared an ancestor at B.')}
${hrule('Trace each tip back until the paths meet. That branching point is the <b>most recent common ancestor</b>. The more recent it is, the closer the relationship.')}
${htrap('A tree is not a ladder. The tips are not ancestors of one another: Homo habilis did not "turn into" Homo sapiens. The ancestors are at the branching points.')}
${keyterms([['phylogenetic tree','a diagram of evolutionary relationships'],['branching point (node)','a common ancestor'],['most recent common ancestor','the nearest shared ancestor of two species'],['tip','a species at the end of a branch'],['hypothesis','branching is a best explanation, open to change'],['trend','a pattern across the tree, such as growing brain size']])}` },
  reteach:{ h:'A timeline and a trends table to check a tree against', b:`
<p>To find the most recent common ancestor of two tips, follow each tip back until the two lines join: the join is the answer. A tree should also agree with the fossil record. Each tip is a species known from fossils such as those from Sterkfontein and Rising Star, so put the species on a timeline, then look at the trends from left to right.</p>
${vis(timeline([
 {t:'4 to 2 mya', l:'Australopithecus'},
 {t:'2,4 to 1,6 mya', l:'Homo habilis'},
 {t:'1,9 mya to 100 000 y', l:'Homo erectus'},
 {t:'400 000 to 40 000 y', l:'Homo neanderthalensis'},
 {t:'About 300 000 y', l:'Homo sapiens'}]), 'mya = million years ago; y = years ago. Approximate dates.')}
${dataTable(['Species','Cranial capacity (approx.)','Face'],[
 ['Australopithecus','400 to 500 cm³','Strongly projecting'],
 ['Homo habilis','600 to 700 cm³','Projecting'],
 ['Homo erectus','900 to 1 100 cm³','Moderately projecting'],
 ['Homo neanderthalensis','1 400 to 1 600 cm³','Moderately projecting'],
 ['Homo sapiens','About 1 350 cm³','Flat']],{w:560})}
${hwk([
 'The tree places the Neanderthal and Homo sapiens tips together, on the last branches.',
 'Check the timeline: both appear within the last 400 000 years, much later than the other three species.'],
 'The tree and the timeline agree: later branches first appear later.')}
${hrule('Read the trends down the table: cranial capacity <b>rises overall</b> and the face <b>flattens</b>. The tree gives the relationships, the timeline gives the order.')}
${keyterms([['timeline','the order in time of the fossils'],['trend','brain size up, prognathism down'],['branch order','agrees with the fossil dates']])}` },
  qs:[
  {type:'mc', stem:`Study the tree. Which letter marks the most recent common ancestor of the chimpanzee and <i>Homo sapiens</i>?`,
   v:vis(cladogram(['Gorilla',['Chimpanzee',['Australopithecus',['Homo erectus','Homo sapiens']]]], {nodes:['P','Q','R','S']}), 'A simplified tree. The letters mark branching points.'),
   opts:['P','Q','R','S'], ans:1,
   hint:`Trace back from each of the two tips until the paths meet.`,
   sol:hsol(['From the chimpanzee, the first branching point is Q.','From Homo sapiens, the path goes S, then R, then Q.','The paths meet at Q. Branching point P is shared with the gorilla, which is older.'],'Answer: Q')},
  {type:'mc', stem:`According to the tree in the diagram, which species is the <b>closest relative</b> of <i>Homo sapiens</i>?`,
   v:vis(cladogram(['Gorilla',['Chimpanzee',['Australopithecus',['Homo erectus','Homo sapiens']]]], {nodes:['P','Q','R','S']}), 'The same tree'),
   opts:['Homo erectus','Australopithecus','Chimpanzee','Gorilla'], ans:0,
   hint:`The closest relative joins at the most recent branching point.`,
   sol:hsol(['Homo sapiens joins Homo erectus at S, the most recent branching point on the tree.','Australopithecus joins at R, the chimpanzee at Q and the gorilla at P, all further back.'],'Answer: Homo erectus')},
  {type:'text', stem:`On a phylogenetic tree, two lineages separate at a branching point. What is the species at that point, from which both lineages descend, called? Give the two-word term.`, ans:'common ancestor', anyCase:true,
   accept:['most recent common ancestor','shared ancestor','a common ancestor','last common ancestor','mrca','recent common ancestor'], ph:'two words',
   hint:`It is a species that both branches descend from.`,
   sol:hsol(['A split in the tree shows where two lineages separated.','The species at that point is their common ancestor.'],'Answer: common ancestor')},
  {type:'mc', stem:`Study the tree. A learner says: <i>"The tree shows that humans evolved from chimpanzees."</i> Why is the claim wrong?`,
   v:vis(cladogram(['Gorilla',['Chimpanzee',['Australopithecus',['Homo erectus','Homo sapiens']]]], {nodes:['P','Q','R','S']}), 'The same tree as in the first two questions.'),
   opts:['Humans and chimpanzees are on separate branches from a shared ancestor, so neither evolved from the other','Chimpanzees are on a branch that grew out of the human branch after the two lines split apart from each other','Humans and chimpanzees are on the same branch, so the tree shows that they are one species','Chimpanzees are not shown on the tree, so nothing can be said about their relationship'], ans:0,
   hint:`Look at where the branches for the two species meet.`,
   sol:hsol(['The two tips join at a branching point: a common ancestor, not one of the two species.','So humans and chimpanzees each evolved from that shared ancestor.','The other options describe a different tree or misread this one.'],'Answer: Humans and chimpanzees are on separate branches from a shared ancestor, so neither evolved from the other')},
  {type:'mc', stem:`<i>Homo naledi</i> has a small brain (500 to 600 cm³) and curved fingers, like Australopithecus, but human-like feet. It is dated to about 335 000 to 236 000 years ago. Why is it hard to place on a simple tree like the one in this level?`,
   opts:['Its mixture of primitive and modern features, and its late date, do not fit a simple line of descent','It lived at the same time as Australopithecus, so it must be the direct ancestor of the species Homo habilis','Its brain was larger than that of Homo sapiens, so it must lie at the top of the tree','Its fossils are too old to be dated, so no relationships can be worked out'], ans:0,
   hint:`Think about what a late date with a mixture of features does to a tidy sequence.`,
   sol:hsol(['A tree is a hypothesis built from features and dates.','Naledi has some features like Australopithecus and others like later Homo, yet it is young. That mixture does not slot neatly into a simple sequence, so the tree may have to be redrawn.','Its date is 335 000 to 236 000 years, not that of Australopithecus, and its brain was small.'],'Answer: Its mixture of primitive and modern features, and its late date, do not fit a simple line of descent')}
  ] },

/* ================= LEVEL 13 ================= */
{ id:13, name:'Exam standard: Lucy and Little Foot', short:'Exam-standard case study',
  teach:{ h:'Read the sources, quote the figures, and weigh what each fossil shows', b:`
<p>A Paper II case study gives you data about fossils and asks you to compare them, use the figures, and evaluate a claim. Lucy and Little Foot are both australopithecines, but they differ in several ways.</p>
${dataTable(['','Lucy','Little Foot'],[
 ['Species','Australopithecus afarensis','Australopithecus (Ron Clarke: A. prometheus; debated)'],
 ['Where found','Hadar, Ethiopia','Sterkfontein, South Africa'],
 ['Age','About 3,2 million years','About 3,67 million years'],
 ['Completeness','About 40% of a skeleton','Nearly complete skeleton'],
 ['Found by','Donald Johanson, 1974','Ron Clarke']],{w:620})}
${cards([
 {t:'Lumpers', d:'See variation as normal within one species, and group fossils into fewer species.'},
 {t:'Splitters', d:'See consistent differences as evidence of separate species, and name more species.'}
], {min:220})}
<p>Features of Lucy's species include a short, broad pelvis, an inward-angled femur, arms that are long compared with the legs, and curved finger bones.</p>
${hwk([
 'Lucy is about 40% complete.',
 'The part of the skeleton that is missing is 100% − 40% = 60%.'],
 'About 60% of Lucy’s skeleton was not found.')}
${hrule('Take figures straight from the source and give the unit. A complete skeleton lets scientists work out posture and limb proportions from more bones.')}
${htrap('The species of Little Foot is debated. Splitters and lumpers can look at the same bones and reach different answers, so a species name is a hypothesis, not a fact.')}
${keyterms([['Lucy','A. afarensis, Hadar, about 3,2 mya, about 40% complete'],['Little Foot','Sterkfontein, about 3,67 mya, nearly complete'],['lumpers','group fossils into fewer species'],['splitters','divide fossils into more species'],['bipedal','walking upright on two legs'],['evaluate','weigh the evidence for and against a claim']])}` },
  reteach:{ h:'The "compare" answer scaffold, with marks', b:`
<p>"Compare" means <b>similarity AND difference</b>. Use this scaffold and the marks follow.</p>
${chain([
 '<b>Similarity.</b> One feature both share, with the evidence (1 mark).',
 '<b>Difference 1.</b> A feature, with BOTH species named and the value for each (1 mark).',
 '<b>Difference 2.</b> A second feature, with BOTH species named (1 mark).',
 '<b>Data.</b> Quote at least one figure with its unit from the source (1 mark).'])}
${hwk([
 'Question (4 marks): Compare Australopithecus afarensis and Homo sapiens.',
 'Similarity: both walked upright, shown by a foramen magnum under the skull (1).',
 'Difference: A. afarensis had a cranial capacity of about 400 to 500 cm³, whereas Homo sapiens has about 1 350 cm³ (1 + 1 for the data).',
 'Difference: A. afarensis had a face that projected forward, whereas Homo sapiens has a flat face and a chin (1).'],
 'Total: 4 marks. Name both species in each difference.')}
${hrule('A difference needs both sides: "A. afarensis had X, whereas Homo sapiens has Y". Saying only what one has is not a comparison.')}
${keyterms([['compare','give similarities AND differences'],['whereas','the word that joins the two sides of a difference'],['data','figures from the source, with units'],['evaluate','weigh the evidence for and against']])}` },
  qs:[
  {type:'mc', stem:`Which statement describes a <b>difference</b> between Lucy and Little Foot?`,
   opts:['Lucy was found in Ethiopia, but Little Foot in South Africa','Both fossils are bipedal australopithecines from Africa','Both fossils are more than three million years old, so they are similar in age','Both fossils belong to the genus Homo, as Homo erectus does'], ans:0,
   hint:`A difference names something that is not the same for the two.`,
   sol:hsol(['Lucy comes from Hadar in Ethiopia and Little Foot from Sterkfontein in South Africa: a difference.','The second and third statements are similarities. The fourth is false: both are Australopithecus.'],'Answer: Lucy was found in Ethiopia, but Little Foot in South Africa')},
  {type:'num', stem:`Lucy is about 3,2 million years old and Little Foot about 3,67 million years old. By how many million years is Little Foot older than Lucy? Give your answer to two decimal places.`, ans:0.47, unit:'million years',
   hint:`Subtract the smaller age from the larger age.`,
   sol:hsol(['Little Foot: 3,67 million years. Lucy: 3,2 million years.','3,67 − 3,20 = 0,47.'],'Answer: 0,47 million years')},
  {type:'mc', stem:`Why is a nearly complete skeleton such as Little Foot more valuable to scientists than a fragmentary one?`,
   opts:['More bones can be compared, so conclusions about posture and limbs rest on more evidence','A complete skeleton can always be dated with carbon-14, but a partial skeleton cannot','A complete skeleton proves that the fossil belongs to Homo rather than to Australopithecus','A complete skeleton shows that scientists agree about the species to which it belongs'], ans:0,
   hint:`Think about how many bones are available to measure and compare.`,
   sol:hsol(['More bones means more evidence: pelvis, legs, arms and skull can all be compared.','Completeness does not change the dating method, the genus, or the debate about the species.'],'Answer: More bones can be compared, so conclusions about posture and limbs rest on more evidence')},
  {type:'mc', stem:`Some scientists place Little Foot in <i>Australopithecus prometheus</i>, and others place it with other australopithecines. Which statement describes <b>splitters</b>?`,
   opts:['They name a separate species when fossils show consistent differences','They place fossils with small differences together in one species','They refuse to name a species until DNA can be extracted from the fossil','They classify fossils only by how old they are'], ans:0,
   hint:`Splitters split.`,
   sol:hsol(['Splitters divide fossils into more species when they see consistent differences.','Placing fossils with small differences together is the lumper approach. Classification is based on features, not DNA alone or age alone.'],'Answer: they name a separate species when fossils show consistent differences')},
  {type:'mc', stem:`Study the features of <i>Australopithecus afarensis</i> (Lucy's species) and evaluate the claim: <i>"Fossils such as Lucy show that australopithecines no longer climbed trees."</i>`,
   v:dataTable(['Feature','A. afarensis'],[
     ['Pelvis','Short and broad'],
     ['Femur','Angled inwards at the knee'],
     ['Arms compared with legs','Long'],
     ['Fingers','Curved']],{w:420}),
   opts:['Not supported: the pelvis and femur show upright walking, but long arms and curved fingers suggest climbing','Supported: the pelvis and femur show upright walking, so these hominins cannot also have climbed trees at all','Supported: curved fingers and long arms are found only in animals that never climb trees at all','Not supported: the fossils show that australopithecines walked on their knuckles, like chimpanzees'], ans:0,
   hint:`Sort the features into upright evidence and climbing evidence.`,
   sol:hsol(['Upright evidence: a short, broad pelvis and an inward-angled femur (1 mark).','Climbing evidence: long arms and curved fingers (1 mark).','Conclusion: the animals were bipedal but still suited to climbing, so the claim is not supported (1 mark).','Knuckle-walking is not shown by any of these features.'],'Answer: Not supported: the pelvis and femur show upright walking, but long arms and curved fingers suggest climbing')}
  ] }
];

/* ==========================================================
   ENGINE
   ========================================================== */
const app = document.getElementById('app');
const stepsEl = document.getElementById('steps');
const lvlNumEl = document.getElementById('lvlNum');
const lvlNameEl = document.getElementById('lvlName');
const scoreLblEl = document.getElementById('scoreLbl');
const stripEl = document.getElementById('strip');

const S = {
  name:'',
  li:0,
  pending:[],          // stack of levels to come back to
  qIdx:LEVELS.map(function(){return 0;}),
  seen:LEVELS.map(function(){return false;}),
  stats:LEVELS.map(function(l){return {asked:0,correct:0,wrong:0,reteaches:0,reached:false};}),
  totalQ:0, totalC:0,
  t0:Date.now(),
  cur:null,            // current question object
  sel:null,            // selected mc index
  tries:0,
  ended:false
};

/* ---------- strip ---------- */
function buildStrip(){
  stepsEl.innerHTML = LEVELS.map(function(l,i){return '<div class="step" id="st'+i+'"></div>';}).join('');
  var t=document.getElementById('lvlTot'); if(t) t.textContent = LEVELS.length;
}
function paintStrip(){
  LEVELS.forEach(function(l,i){
    const el=document.getElementById('st'+i); if(!el) return;
    el.className='step';
    if(i===S.li && !S.ended) el.classList.add('now');
    else if(S.stats[i].wrong>0) el.classList.add('stumble');
    else if(S.stats[i].correct>0) el.classList.add('done');
  });
  lvlNumEl.textContent = S.li+1;
  lvlNameEl.textContent = LEVELS[S.li].short;
  scoreLblEl.textContent = S.totalC+' / '+S.totalQ+' correct';
}

/* ---------- small builders ---------- */
function card(inner){ return '<section class="card">'+inner+'</section>'; }
function band(html){ return '<div class="band">'+html+'</div>'; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function scrollTop(){ window.scrollTo({top:0,behavior:'smooth'}); }

/* ==========================================================
   SCREENS
   ========================================================== */
function screenStart(){
  stripEl.classList.add('hide');
  app.innerHTML = card(
    '<p class="eyebrow">IEB Grade 12 Life Sciences · Diversity, change and continuity</p>'+
    '<h1>The Human Evolution Ladder</h1>'+
    '<p class="sub">Thirteen levels, from what makes a primate up to reading fossil evidence and the Out of Africa hypothesis.</p>'+
    '<p>Each level teaches one idea, then asks you a question about it.</p>'+
    '<div class="callout"><span class="lbl">How this works</span>'+
    '<p>Get it right and you climb to the next level. <b>Get it wrong and you drop back one level</b> &mdash; where the idea is explained a <b>different way</b>, with a <b>different example</b>. Once that clicks, you climb straight back up and carry on.</p>'+
    '<p>Nothing is timed, and there is no penalty for dropping back. That is how the ladder is meant to work.</p></div>'+
    '<h3>What is your name?</h3>'+
    '<div class="inputrow"><input type="text" class="wide" id="nameIn" placeholder="Your name" autocomplete="off"></div>'+
    '<div class="btnrow"><button class="primary" id="goBtn">Start at Level 1</button></div>'
  );
  const inp=document.getElementById('nameIn');
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') start(); });
  document.getElementById('goBtn').onclick = start;
  function start(){
    S.name = (inp.value||'').trim();
    S.t0 = Date.now();
    stripEl.classList.remove('hide');
    screenTeach(false);
  }
}

function screenTeach(isRe){
  const L = LEVELS[S.li];
  S.stats[S.li].reached = true;
  if(isRe) S.stats[S.li].reteaches++;
  S.seen[S.li]=true;
  const t = isRe ? L.reteach : L.teach;
  let head='';
  if(isRe){
    head = band('<b>Let us try that a different way.</b> Same idea, new explanation, new example. Take your time &mdash; there is no rush and nothing is being marked.');
  }
  app.innerHTML = head + card(
    '<p class="eyebrow">Level '+(S.li+1)+' of '+LEVELS.length+' &middot; '+esc(L.name)+(isRe?' &middot; second look':'')+'</p>'+
    '<h2>'+t.h+'</h2>'+
    '<div style="margin-top:14px">'+t.b+'</div>'+
    '<div class="btnrow"><button class="primary" id="qBtn">'+(isRe?'Try a new question':'Try a question')+'</button></div>'
  ) + endLink();
  document.getElementById('qBtn').onclick = function(){ screenQuestion(); };
  wireEnd();
  paintStrip(); scrollTop();
}

function endLink(){
  return '<div style="text-align:center;margin-top:18px"><button class="link" id="endBtn">End the session and see my report</button></div>';
}
function wireEnd(){
  const b=document.getElementById('endBtn');
  if(b) b.onclick=function(){ if(confirm('End the session now and see the progress report?')) screenReport(); };
}

function screenQuestion(){
  const L = LEVELS[S.li];
  const q = L.qs[ S.qIdx[S.li] % L.qs.length ];
  S.qIdx[S.li]++;
  S.cur = q; S.sel = null; S.tries = 0;

  let body = '<p class="eyebrow">Level '+(S.li+1)+' &middot; '+esc(L.short)+'</p>';
  body += '<div class="qtext">'+q.stem+'</div>';
  if(q.v) body += q.v;
  body += answerUI(q);
  body += '<div class="btnrow"><button class="primary" id="checkBtn">Check my answer</button>'+
          '<button class="ghost" id="hintBtn">Show me a hint</button></div>'+
          '<div id="hintBox"></div><div id="fb"></div>';

  app.innerHTML = card(body) + endLink();

  document.getElementById('checkBtn').onclick = check;
  document.getElementById('hintBtn').onclick = function(){
    document.getElementById('hintBox').innerHTML =
      '<div class="fb nudge"><div class="hd">Hint</div><p>'+esc(q.hint)+'</p></div>';
    this.disabled=true; this.style.opacity=.5;
  };
  if(q.type==='mc'){
    Array.prototype.forEach.call(document.querySelectorAll('button.opt'),function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll('button.opt'),function(x){x.classList.remove('sel');});
        b.classList.add('sel'); S.sel=parseInt(b.dataset.i,10);
      };
    });
  } else {
    Array.prototype.forEach.call(document.querySelectorAll('.ansIn'),function(i){
      i.addEventListener('keydown',function(e){ if(e.key==='Enter') check(); });
    });
    const first=document.querySelector('.ansIn'); if(first) first.focus();
  }
  wireEnd();
  paintStrip(); scrollTop();
}

function answerUI(q){
  if(q.type==='mc'){
    return '<div class="opts">'+q.opts.map(function(o,i){
      return '<button class="opt" data-i="'+i+'">'+o+'</button>';
    }).join('')+'</div>';
  }
  if(q.type==='frac'){
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<span class="fracinput"><input type="text" class="ansIn" id="inN" inputmode="numeric" aria-label="numerator">'+
      '<span class="rule"></span>'+
      '<input type="text" class="ansIn" id="inD" inputmode="numeric" aria-label="denominator"></span></div>';
  }
  if(q.type==='order'){
    return '<div style="margin:14px 0">'+q.items.map(function(t,i){
      return '<div class="orderrow"><input type="text" class="ansIn" id="inO'+i+'" inputmode="numeric" aria-label="position of item '+String.fromCharCode(65+i)+'">'+
             '<div class="txt"><b>'+String.fromCharCode(65+i)+'.</b> '+t+'</div></div>';
    }).join('')+'</div><div style="font-size:13.5px;color:#6E6F72">Number the boxes <b>1</b> to <b>'+q.items.length+'</b> to show the correct order.</div>';
  }
  if(q.type==='text'){
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<input type="text" class="ansIn" id="inT" style="width:190px;text-align:left;font-size:19px" '+
      'autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="'+(q.ph||'')+'" aria-label="answer">'+
      '</div>';
  }
  if(q.type==='coeff'){
    var i=0, out='<div class="coeffrow">';
    q.parts.forEach(function(p){
      if(p==='+'){ out+='<span class="plus">+</span>'; return; }
      if(p==='->'){ out+='<span class="arrow">&rarr;</span>'; return; }
      out+='<input type="text" class="ansIn" id="inC'+i+'" inputmode="numeric" aria-label="coefficient '+(i+1)+'">'+ch(p);
      i++;
    });
    return out+'</div><div style="font-size:13.5px;color:#6E6F72;margin-top:-6px">Put a number in every box. If a formula needs no multiplier, type <b>1</b>.</div>';
  }
  if(q.type==='ratio'){
    const three = q.ans.c!==undefined;
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<input type="text" class="ansIn" id="inA" inputmode="numeric" style="width:72px" aria-label="first number">'+
      '<span class="colon">:</span>'+
      '<input type="text" class="ansIn" id="inB" inputmode="numeric" style="width:72px" aria-label="second number">'+
      (three?'<span class="colon">:</span><input type="text" class="ansIn" id="inC" inputmode="numeric" style="width:72px" aria-label="third number">':'')+
      '</div>';
  }
  if(q.type==='mixed'){
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<input type="text" class="ansIn" id="inW" inputmode="numeric" aria-label="whole number" style="width:64px">'+
      '<span class="fracinput"><input type="text" class="ansIn" id="inN" inputmode="numeric" aria-label="numerator">'+
      '<span class="rule"></span>'+
      '<input type="text" class="ansIn" id="inD" inputmode="numeric" aria-label="denominator"></span></div>';
  }
  return '<div class="inputrow"><span class="unit">Answer:</span>'+
    (q.unit==='R'?'<span class="unit">R</span>':'')+
    '<input type="text" class="ansIn wide" id="inX" inputmode="decimal" aria-label="answer">'+
    (q.unit&&q.unit!=='R'?'<span class="unit">'+q.unit+'</span>':'')+'</div>';
}

/* ---------- reading + marking ---------- */
function readInt(id){
  const el=document.getElementById(id); if(!el) return null;
  const v=(el.value||'').trim().replace(/\s/g,'');
  if(!/^-?\d+$/.test(v)) return null;
  return parseInt(v,10);
}
function readNum(id){
  const el=document.getElementById(id); if(!el) return null;
  let v=(el.value||'').trim().replace(/\s/g,'').replace(/,/g,'.').replace(/^R/i,'').replace(/%$/,'');
  v=v.replace(/\/.*$/,'');                              /* "90km/h" -> "90km" */
  v=v.replace(/[A-Za-z\u2113\u00b0\u00b2\u00b3]+$/,'');   /* "44g", "36m²" -> the number */
  if(!/^-?\d*\.?\d+$/.test(v)) return null;
  return parseFloat(v);
}

function mark(q){
  /* returns {state:'right'|'wrong'|'nudge'|'blank', msg} */
  if(q.type==='mc'){
    if(S.sel===null) return {state:'blank'};
    if(S.sel===q.ans) return {state:'right'};
    if(q.nudge && q.nudge[S.sel]) return {state:'nudge', msg:q.nudge[S.sel]};
    return {state:'wrong'};
  }
  if(q.type==='frac'){
    const n=readInt('inN'), d=readInt('inD');
    if(n===null||d===null||d===0) return {state:'blank'};
    if(n===q.ans.n && d===q.ans.d) return {state:'right'};
    if(n*q.ans.d === q.ans.n*d){
      return {state:'nudge', msg:'The <b>value</b> is right, but it is not in its lowest terms yet. Divide the top and the bottom by the biggest number that goes into both, then check again.'};
    }
    return {state:'wrong'};
  }
  if(q.type==='mixed'){
    const w=readInt('inW'), n=readInt('inN'), d=readInt('inD');
    if(w===null||n===null||d===null||d===0) return {state:'blank'};
    if(w===q.ans.w && n===q.ans.n && d===q.ans.d) return {state:'right'};
    const mine=w + n/d, target=q.ans.w + q.ans.n/q.ans.d;
    if(Math.abs(mine-target)<1e-9){
      if(n>=d) return {state:'nudge', msg:'Close. The value is right, but the fraction part must be <b>less than one whole</b>. Carry the extra whole across into the whole-number box.'};
      return {state:'nudge', msg:'The <b>value</b> is right, but the fraction part is not in its lowest terms. Simplify it and check again.'};
    }
    return {state:'wrong'};
  }
  if(q.type==='ratio'){
    const three = q.ans.c!==undefined;
    const a=readInt('inA'), b=readInt('inB'), c=three?readInt('inC'):null;
    if(a===null||b===null||(three&&c===null)) return {state:'blank'};
    if(a<=0||b<=0||(three&&c<=0)) return {state:'wrong'};
    if(a===q.ans.a && b===q.ans.b && (!three || c===q.ans.c)) return {state:'right'};
    let equiv = (a*q.ans.b === b*q.ans.a);
    if(three) equiv = equiv && (a*q.ans.c === c*q.ans.a);
    if(equiv){
      return {state:'nudge', msg:'That ratio has the <b>right proportions</b>, but it is not in its simplest form yet. Divide every number by the biggest value that goes into all of them, then check again.'};
    }
    return {state:'wrong'};
  }
  if(q.type==='order'){
    const n=q.ans.length, got=[];
    for(let i=0;i<n;i++){
      const v=readInt('inO'+i);
      if(v===null) return {state:'blank'};
      got.push(v);
    }
    const seen={};
    let perm=true;
    for(let i=0;i<n;i++){ if(got[i]<1||got[i]>n||seen[got[i]]) perm=false; seen[got[i]]=1; }
    if(!perm) return {state:'nudge', msg:'Use each number from <b>1 to '+n+' exactly once</b> &mdash; one number per sentence, no repeats and none left out.'};
    let same=true; for(let i=0;i<n;i++) if(got[i]!==q.ans[i]) same=false;
    if(same) return {state:'right'};
    return {state:'wrong'};
  }
  if(q.type==='text'){
    const el=document.getElementById('inT'); if(!el) return {state:'blank'};
    const norm=function(t){
      return String(t)
        .replace(/\s+/g,'')
        .replace(/\u2212/g,'-')                 /* a real minus sign */
        .replace(/\u00d7|\u00b7/g,'*')          /* × or · */
        .replace(/\u00b2/g,'^2').replace(/\u00b3/g,'^3')
        .replace(/\*\*/g,'^')                   /* 3x**2 */
        .replace(/^(y'|f'\(x\)|dy\/dx)=/,'')    /* "y' = ..." */
        .replace(/^=/,'').replace(/[.,;]+$/,'')
        .replace(/(\d)\*(?=[a-zA-Z(])/g,'$1');  /* 3*x -> 3x */
    };
    /* anyCase:true marks the answer as a WORD, not a symbol. Capitals stop
       mattering and a leading article is ignored, so "Nucleus" and
       "the nucleus" are simply right. Leave it off for chemical formulae,
       element symbols, units and anything else where MgO and mgo differ. */
    const prose=function(t){
      return String(t).replace(/^\s*(the|a|an)\s+/i,'');
    };
    const raw=norm(q.anyCase?prose(el.value||''):(el.value||''));
    if(!raw) return {state:'blank'};
    const ok=[q.ans].concat(q.accept||[]).map(function(t){
      return norm(q.anyCase?prose(t):t);
    });
    for(let i=0;i<ok.length;i++) if(raw===ok[i]) return {state:'right'};
    if(q.anyCase){
      for(let i=0;i<ok.length;i++) if(raw.toLowerCase()===ok[i].toLowerCase()) return {state:'right'};
      return {state:'wrong'};
    }
    for(let i=0;i<ok.length;i++) if(raw.toLowerCase()===ok[i].toLowerCase()){
      return {state:'nudge', msg:(q.caseMsg||'You have the right symbols in the right order &mdash; check your <b>capital letters</b> and try again.')};
    }
    return {state:'wrong'};
  }
  if(q.type==='coeff'){
    const n=q.ans.length, got=[];
    for(let i=0;i<n;i++){
      const v=readInt('inC'+i);
      if(v===null||v<1) return {state:'blank'};
      got.push(v);
    }
    let same=true; for(let i=0;i<n;i++) if(got[i]!==q.ans[i]) same=false;
    if(same) return {state:'right'};
    const k=got[0]/q.ans[0];
    let mult = Number.isInteger(k) && k>1;
    if(mult) for(let i=0;i<n;i++) if(got[i]!==q.ans[i]*k) mult=false;
    if(mult) return {state:'nudge', msg:'That equation <b>is</b> balanced &mdash; but every coefficient can still be divided by '+k+'. An answer must use the <b>smallest whole numbers</b> that work. Divide them all by '+k+' and check again.'};
    return {state:'wrong'};
  }
  const x=readNum('inX');
  if(x===null) return {state:'blank'};
  return {state:(Math.abs(x-q.ans)<1e-9?'right':'wrong')};
}

function check(){
  const q=S.cur;
  const r=mark(q);
  const fb=document.getElementById('fb');

  if(r.state==='blank'){
    fb.innerHTML='<div class="fb nudge"><div class="hd">Nothing entered yet</div><p>'+
      (q.type==='mc'?'Tap one of the options first, then press <b>Check my answer</b>.':'Type a number into every box, then press <b>Check my answer</b>.')+'</p></div>';
    return;
  }
  if(r.state==='nudge'){
    fb.innerHTML='<div class="fb nudge"><div class="hd">Almost there</div><p>'+r.msg+'</p></div>';
    return; /* free retry, no penalty */
  }

  /* lock the inputs */
  Array.prototype.forEach.call(document.querySelectorAll('.ansIn'),function(i){i.disabled=true;});
  document.getElementById('checkBtn').disabled=true;
  const hb=document.getElementById('hintBtn'); if(hb){hb.disabled=true; hb.style.opacity=.5;}
  if(q.type==='mc'){
    Array.prototype.forEach.call(document.querySelectorAll('button.opt'),function(b){
      const i=parseInt(b.dataset.i,10); b.disabled=true; b.classList.remove('sel');
      if(i===q.ans) b.classList.add('right');
      else if(i===S.sel) b.classList.add('wrong');
    });
  }

  S.totalQ++; S.stats[S.li].asked++;

  if(r.state==='right'){
    S.totalC++; S.stats[S.li].correct++;
    onRight(fb);
  } else {
    S.stats[S.li].wrong++;
    onWrong(fb,q);
  }
  paintStrip();
}

function onRight(fb){
  const q=S.cur;
  const backTo = (S.pending.length && S.pending[S.pending.length-1] > S.li) ? S.pending[S.pending.length-1] : null;
  const last = (S.li === LEVELS.length-1);
  let msg, btn;

  if(backTo!==null){
    msg='<p>You have got that concept back. Now let us return to <b>Level '+(backTo+1)+' &mdash; '+esc(LEVELS[backTo].short)+'</b> and look at it a different way.</p>';
    btn='Back up to Level '+(backTo+1);
  } else if(last){
    msg='<p>That is the top of the ladder: full IEB Grade 12 standard on human evolution. Well done.</p>';
    btn='See my report';
  } else {
    msg='<p>Next up: <b>Level '+(S.li+2)+' &mdash; '+esc(LEVELS[S.li+1].short)+'</b>.</p>';
    btn='Climb to Level '+(S.li+2);
  }

  fb.innerHTML='<div class="fb ok"><div class="hd">Correct'+(S.name?', '+esc(S.name):'')+'</div>'+
    '<div class="worked" style="background:#fff;border-style:solid"><span class="lbl">How it works out</span>'+q.sol+'</div>'+
    msg+'</div>'+
    '<div class="btnrow"><button class="primary" id="nextBtn">'+btn+'</button></div>';

  document.getElementById('nextBtn').onclick=function(){
    if(backTo!==null){
      S.pending.pop();
      S.li=backTo;
      screenTeach(true);          /* re-teach the failed concept a different way */
    } else if(last){
      screenReport();
    } else {
      S.li++;
      screenTeach(false);         /* first teaching of the new concept */
    }
  };
  scrollTop();
}

function onWrong(fb,q){
  const canDrop = S.li>0;
  const target = canDrop ? S.li-1 : 0;
  let msg,btn;

  if(canDrop){
    msg='<p>No problem &mdash; this usually means the step underneath needs shoring up. We are going back to <b>Level '+(target+1)+' &mdash; '+esc(LEVELS[target].short)+'</b>, where it will be explained a different way with a different example. Then we come straight back to this one.</p>';
    btn='Go back to Level '+(target+1);
  } else {
    msg='<p>This is the very first level, so there is nothing below it. Let us look at the same idea from a completely different angle instead.</p>';
    btn='Explain it differently';
  }

  fb.innerHTML='<div class="fb no"><div class="hd">Not quite</div>'+
    '<div class="worked" style="background:#fff;border-style:solid"><span class="lbl">The correct working</span>'+q.sol+'</div>'+
    msg+'</div>'+
    '<div class="btnrow"><button class="primary" id="nextBtn">'+btn+'</button></div>';

  document.getElementById('nextBtn').onclick=function(){
    if(canDrop){
      S.pending.push(S.li);   /* remember to come back and re-teach this one */
      S.li=target;
    }
    screenTeach(true);
  };
  scrollTop();
}

/* ==========================================================
   REPORT
   ========================================================== */
function screenReport(){
  S.ended=true;
  const mins = Math.max(1, Math.round((Date.now()-S.t0)/60000));
  const reached = S.stats.filter(function(s){return s.reached;}).length;
  const topLevel = S.stats.reduce(function(a,s,i){return s.correct>0?i+1:a;},0);
  const acc = S.totalQ? Math.round(100*S.totalC/S.totalQ):0;

  function status(s){
    if(!s.reached) return '<span class="pill nr">Not reached</span>';
    if(s.wrong===0 && s.correct>0) return '<span class="pill first">Secure</span>';
    if(s.wrong===1) return '<span class="pill re">Needed a re-teach</span>';
    if(s.wrong>1) return '<span class="pill hard">Needs more work</span>';
    return '<span class="pill nr">Started</span>';
  }
  function note(s,L){
    if(!s.reached) return 'Not covered in this session.';
    if(s.wrong===0 && s.correct>0) return 'Answered correctly first time.';
    if(s.wrong===0) return 'Taught but not yet answered.';
    return s.wrong+' incorrect attempt'+(s.wrong===1?'':'s')+', '+s.correct+' correct after re-teaching.';
  }

  const focus = S.stats.map(function(s,i){return {s:s,L:LEVELS[i],i:i};})
                       .filter(function(o){return o.s.wrong>0;})
                       .sort(function(a,b){return b.s.wrong-a.s.wrong;});

  let rows = LEVELS.map(function(L,i){
    const s=S.stats[i];
    return '<tr><td><b>'+(i+1)+'</b></td><td>'+esc(L.name)+'</td><td>'+status(s)+'</td><td>'+note(s,L)+'</td></tr>';
  }).join('');

  let focusHtml;
  if(!focus.length){
    focusHtml = '<div class="callout"><span class="lbl">Focus next</span><p>Every question attempted was answered correctly first time. Move on to the Population ecology ladder.</p></div>';
  } else {
    focusHtml = '<div class="callout"><span class="lbl">Focus next</span><ul style="margin-bottom:0">'+
      focus.slice(0,5).map(function(o){
        return '<li><b>'+esc(o.L.name)+'</b> (Level '+(o.i+1)+') &mdash; '+o.s.wrong+' slip'+(o.s.wrong===1?'':'s')+' here.</li>';
      }).join('')+'</ul></div>';
  }

  stripEl.classList.add('hide');
  app.innerHTML = card(
    '<p class="eyebrow">Progress report</p>'+
    '<h1>Human Evolution Ladder</h1>'+
    '<p class="sub">'+(S.name?esc(S.name)+' &nbsp;&middot;&nbsp; ':'')+'Genius Premium Tuition · IEB Grade 12 Life Sciences · Human evolution &middot; '+new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'})+'</p>'+
    '<div class="kpis">'+
      '<div class="kpi"><div class="v">'+topLevel+' / '+LEVELS.length+'</div><div class="k">Highest level passed</div></div>'+
      '<div class="kpi"><div class="v">'+S.totalC+' / '+S.totalQ+'</div><div class="k">Questions correct</div></div>'+
      '<div class="kpi"><div class="v">'+acc+'%</div><div class="k">Accuracy</div></div>'+
      '<div class="kpi"><div class="v">'+mins+'</div><div class="k">Minutes</div></div>'+
    '</div>'+
    focusHtml+
    '<h3>Level by level</h3>'+
    '<table class="rep"><thead><tr><th style="width:38px">#</th><th>Concept</th><th style="width:150px">Status</th><th>Detail</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="btnrow"><button class="primary" id="printBtn">Print / save as PDF</button>'+
    '<button class="ghost" id="againBtn">Start again</button></div>'
  );
  document.getElementById('printBtn').onclick=function(){ window.print(); };
  document.getElementById('againBtn').onclick=function(){
    S.li=0; S.pending=[]; S.totalQ=0; S.totalC=0; S.ended=false;
    S.qIdx=LEVELS.map(function(){return 0;});
    S.stats=LEVELS.map(function(){return {asked:0,correct:0,wrong:0,reteaches:0,reached:false};});
    S.t0=Date.now();
    stripEl.classList.remove('hide');
    screenTeach(false);
  };
  scrollTop();
}


/* ---------- balance the multiple-choice keys ----------
   The correct option is distributed evenly across the available positions, so
   the answer can never be guessed from where it sits. Questions whose options
   are bare position labels (A, B, C ...) refer to something on screen and are
   left exactly as written. */
function balanceKeys(){
  var counter=0;
  LEVELS.forEach(function(L){
    L.qs.forEach(function(q){
      if(q.type!=='mc'||!q.opts) return;
      var label=true;
      q.opts.forEach(function(o){ if(!/^[A-E]$/.test(String(o).trim())) label=false; });
      if(label) return;
      var n=q.opts.length, target=counter++ % n;
      if(target===q.ans) return;
      var tmp=q.opts[target]; q.opts[target]=q.opts[q.ans]; q.opts[q.ans]=tmp;
      if(q.nudge){
        var nn={};
        Object.keys(q.nudge).forEach(function(k){
          var i=parseInt(k,10);
          nn[i===target?q.ans:(i===q.ans?target:i)]=q.nudge[k];
        });
        q.nudge=nn;
      }
      q.ans=target;
    });
  });
}
balanceKeys();

/* ---------- boot ---------- */
document.getElementById('stamp').textContent = new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'});
buildStrip();
screenStart();
