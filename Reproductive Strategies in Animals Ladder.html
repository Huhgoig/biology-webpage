${keyterms([['oviparity','embryo develops in an egg laid outside the mother'],['ovoviviparity','egg kept inside the mother, embryo fed by yolk'],['viviparity','embryo inside the mother, fed by her blood'],['yolk','food store in an egg'],['placenta','organ linking the embryo to the mother\'s blood supply'],['uterus','the organ in which the embryo develops']])}` },
  reteach:{ h:'A packed lunch, a lunch in your bag, or meals from the kitchen', b:`
<p>Use a food picture. The embryo needs lunch, and the only question is where the lunch comes from and where it is kept.</p>
${cards([
 {t:'Oviparity',d:'A packed lunch left in the nest. The young eat the yolk inside an egg that was laid.'},
 {t:'Ovoviviparity',d:'A packed lunch carried in the mother\'s bag. She keeps it safe, but the food is still only the yolk.'},
 {t:'Viviparity',d:'Meals delivered all the time from the mother\'s kitchen, through the placenta.'}],{min:170})}
${chain(['Is the egg laid and left to develop outside the mother? If yes, it is oviparity.','If no, the embryo develops inside the mother. Does her blood feed it through a placenta?','If yes, it is viviparity. If no, only the yolk feeds it, so it is ovoviviparity.'])}
${mwk([
 '"Animal X": the female carries her developing young. Each embryo has a thick blood-vessel link to the wall of her uterus, and there is no yolk store.',
 'Developing inside the mother, so not a laid egg. Fed from her blood supply, so not the yolk.'],
 'Viviparity: the embryo is fed through the mother\'s blood.')}
${mrule('Always check the food source. A kept egg fed by yolk is not the same as an embryo fed by the mother.')}
${keyterms([['yolk','food in the egg'],['placenta','link to the mother\'s blood'],['egg laid','oviparity'],['egg kept, yolk only','ovoviviparity'],['mother feeds','viviparity']])}` },
  qs:[
  {type:'text', stem:`A female ostrich lays eggs, and the embryos develop inside the eggs outside her body. Name this reproductive strategy.`, ans:'oviparity', anyCase:true, accept:['ovipary','oviparous','oviparity (ovipary)','ovipary (oviparity)'], ph:'one word',
   hint:`Think of the strategy in which the egg is laid before the embryo has developed.`,
   sol:msol(['The egg is laid and the embryo develops outside the mother\'s body.','The yolk feeds the embryo.'],'Answer: oviparity')},
  {type:'mc', stem:`A female puff adder retains her eggs inside her body. The embryos feed only on yolk and the young hatch from the eggs as she gives birth. There is no placenta. How is this reproductive strategy classified?`,
   opts:[`Ovoviviparity, because the eggs stay inside her and only yolk feeds the embryos`,`Oviparity, because the young hatch from eggs even though the eggs stay inside her`,`Viviparity, because the young appear alive and the embryos develop inside her body`,`Oviparity, because the embryos feed on yolk, just as they do in a bird\'s egg`], ans:0,
   hint:`Ask what feeds the embryos, then ask where they develop.`,
   sol:msol(['Where? Inside the mother, so it is not oviparity.','Fed by what? The yolk only, with no placenta, so it is not viviparity.','Kept inside and fed by yolk: ovoviviparity. Appearing alive is not enough for viviparity, and feeding on yolk is not enough for oviparity.'],'Answer: Ovoviviparity, because the eggs stay inside her and only yolk feeds the embryos')},
  {type:'text', stem:`Name the organ that connects the embryo to the mother's blood supply in a viviparous mammal, so that food and oxygen can pass to the embryo.`, ans:'placenta', anyCase:true, accept:['the placenta','placentae'], ph:'one word',
   hint:`It is a disc-shaped organ that grows into the wall of the uterus.`,
   sol:msol(['In viviparity the mother\'s blood feeds the embryo.','The organ that allows food and oxygen to pass from her blood to the embryo is the placenta.'],'Answer: placenta')},
  {type:'mc', stem:`Which animal is <b>viviparous</b>?`,
   opts:[`A rock hyrax`,`A Cape cobra`,`An ostrich`,`A platypus`], ans:0,
   hint:`Decide which of these are mammals, then remember that one mammal lays eggs.`,
   sol:msol(['The Cape cobra lays eggs: oviparous.','The ostrich lays eggs: oviparous.','The platypus is a mammal, but it is a monotreme that lays eggs: oviparous.','The rock hyrax is a placental mammal whose embryo is fed through a placenta: viviparous.'],'Answer: A rock hyrax')},
  {type:'mc', stem:`Some skinks (a type of lizard) retain their eggs and give birth to live young. A researcher finds that the embryos of one skink species are linked to the mother\'s blood supply by a placenta, and very little yolk is present. Which conclusion is best supported?`,
   opts:[`This skink is viviparous, because the mother's blood feeds the embryos through a placenta`,`This skink is ovoviviparous, because it keeps the eggs inside and the young are born alive`,`This skink is oviparous, because reptiles are classified as egg-laying animals`,`This skink cannot be classified, because placentas belong only to mammals`], ans:0,
   hint:`Look at what feeds the embryo, not at the animal group or at live birth.`,
   sol:msol(['The embryos develop inside the mother and are fed from her blood through a placenta, with little yolk used.','That is viviparity. Live birth alone would only suggest ovoviviparity, and the class Reptilia does not decide the strategy: some reptiles are viviparous.'],'Answer: This skink is viviparous, because the mother\'s blood feeds the embryos through a placenta')}
  ] },

/* ================= LEVEL 4 ================= */
{ id:4, name:'Advantages and disadvantages of each', short:'Advantages and disadvantages',
  teach:{ h:'Each strategy trades protection for cost', b:`
<p>The more the mother does for the embryo, the better protected it is, but the more energy she spends and the fewer offspring she can make. Learn one advantage and one disadvantage for each strategy.</p>
${dataTable(['Strategy','Advantages','Disadvantages'],[
 ['<b>Oviparity</b>','The mother is not weighed down, so she can still move, feed and escape predators. Many eggs can be laid at one time.','The eggs are exposed to predators, drying and changes in temperature. They may need guarding or incubating.'],
 ['<b>Ovoviviparity</b>','The eggs are protected inside the mother and kept at a more stable temperature. She can move to warm places.','The mother is weighed down and slower, so she is easier to catch. If she dies, all the embryos die.'],
 ['<b>Viviparity</b>','The embryo is best protected and is fed continuously, so a high proportion of the young survive.','Large energy cost to the mother. Few young are born, and she is weighed down during pregnancy.']],{w:640})}
${vis(flow(['The mother does more','The embryo is better protected','The mother\'s energy cost rises','Fewer offspring are produced']),'The trade-off that links the three strategies')}
${mwk([
 'Question (2 marks): for a female lizard that lays her eggs in a burrow and leaves them, give one advantage and one disadvantage.',
 'Advantage (1 mark): she is not weighed down by developing young, so she can still run from predators.',
 'Disadvantage (1 mark): the eggs are left exposed to predators and to changes in temperature.'],
 'Full marks: one advantage and one disadvantage, each linked to the mother or to the eggs.')}
${mrule('Write advantages and disadvantages as a pair: protection of the embryo against cost to the mother. In exam answers always name <b>who</b> gains or pays: the embryo or the mother.')}
${mtrap('Do not call viviparity "best". It protects the embryo most, but it costs the mother most. Neither strategy is best everywhere.')}
${keyterms([['advantage','a feature that helps survival or reproduction'],['disadvantage','a cost or risk'],['incubate','keep eggs warm'],['clutch','the eggs laid in one batch'],['energy cost','energy the parent spends on reproduction']])}` },
  reteach:{ h:'Reading the protection and cost gauges', b:`
<p>Think of two gauges for every strategy: how well the embryo is <b>protected</b>, and how much the mother <b>pays</b>. They rise together.</p>
${vis(arrowScale('Embryo unprotected','Embryo well protected',0.12,{label:'egg laid and left'})+arrowScale('Embryo unprotected','Embryo well protected',0.55,{label:'egg kept inside the mother'})+arrowScale('Embryo unprotected','Embryo well protected',0.92,{label:'embryo fed by the mother'}),'Protection of the embryo for the three strategies')}
${vis(arrowScale('Low cost to mother','High cost to mother',0.12,{label:'egg laid and left'})+arrowScale('Low cost to mother','High cost to mother',0.55,{label:'egg kept inside the mother'})+arrowScale('Low cost to mother','High cost to mother',0.92,{label:'embryo fed by the mother'}),'Cost to the mother for the three strategies')}
<p>(Birds that incubate and guard their eggs pay more than an egg-layer that simply leaves them.) Protection includes warmth and safety: a mother that carries the eggs can move to a warm or safe place, which a laid egg cannot. A good answer always uses both gauges. Here is a weak answer taken apart.</p>
${mwk([
 'A learner writes: "Viviparity is best because the embryo is kept safe."',
 'That mentions only the protection gauge. It names no cost to the mother and no loss of offspring numbers.',
 'Repair: "Viviparity protects the embryo most, but it costs the mother much energy and so fewer young can be produced."'],
 'Always set the gain for the embryo against the cost for the mother.')}
${mrule('If you are asked for a disadvantage, find the cost: the mother\'s weight and energy, fewer offspring, or exposure of the eggs.')}
${keyterms([['protection','safety of the embryo'],['cost','energy and risk to the mother'],['trade-off','a gain that comes with a cost']])}` },
  qs:[
  {type:'mc', stem:`Which is an <b>advantage</b> of viviparity?`,
   opts:[`The embryo is protected and fed continuously, so a high share of the young survive`,`The mother is not weighed down, so she can move freely while the young develop`,`Very many offspring can be produced because each needs little energy from the mother`,`The mother uses little energy because the yolk supplies all the food the embryo needs`], ans:0,
   hint:`Viviparity means the mother carries and feeds the embryo.`,
   sol:msol(['The mother protects and feeds the embryo for the whole development, so survival of the young is high.','Moving freely and producing very many offspring are advantages of laying eggs. In viviparity the mother is weighed down and pays a large energy cost, and the food comes from her blood, not only from yolk.'],'Answer: The embryo is protected and fed continuously, so a high share of the young survive')},
  {type:'text', stem:`Which strategy leaves the developing embryos most exposed to predators and changes in temperature: oviparity, ovoviviparity or viviparity? Write one word.`, ans:'oviparity', anyCase:true, accept:['ovipary','oviparous'], ph:'one word',
   hint:`Compare where the embryos are during development in each strategy.`,
   sol:msol(['Eggs that are laid develop outside the mother, where predators and temperature changes can reach them.','In the other two strategies the embryos are inside the mother.'],'Answer: oviparity')},
  {type:'mc', stem:`Which is a <b>disadvantage</b> of ovoviviparity?`,
   opts:[`The mother is weighed down by the eggs, so she is slower and easier to catch`,`The eggs are left unguarded outside her body, so predators can eat them`,`The embryo is nourished through a placenta, which drains the mother\'s energy`,`The eggs are exposed to changes in air temperature outside the mother\'s body`], ans:0,
   hint:`The eggs are kept inside the mother. What does that cost her?`,
   sol:msol(['In ovoviviparity the eggs stay inside the mother, so she carries the weight and is slower.','Unguarded eggs and exposure to temperature changes are disadvantages of laying eggs. A placenta belongs to viviparity.'],'Answer: The mother is weighed down by the eggs, so she is slower and easier to catch')},
  {type:'order', stem:`Arrange the three strategies by how much energy the mother spends on the embryo while it develops, from the <b>least</b> energy to the <b>most</b>.`,
   items:[`Viviparity, with the embryo fed through a placenta`,`Oviparity, with the eggs laid soon after fertilisation`,`Ovoviviparity, with the eggs carried inside her body until they hatch`], ans:[3,1,2],
   hint:`Compare how long the mother carries the embryo and whether she feeds it.`,
   sol:msol(['Least energy: the eggs are laid soon after fertilisation, so she does not carry them.','Middle: she carries the eggs, but the yolk feeds the embryos.','Most energy: she carries the embryo and also feeds it from her blood.'],'Answer: oviparity, then ovoviviparity, then viviparity')},
  {type:'mc', stem:`A lizard lives on a cold mountain where night temperatures fall below freezing. It retains its eggs and gives birth to live young. A related lizard in a warm lowland lays its eggs in sun-warmed soil. Which statement best explains why retaining the eggs is an advantage on the mountain but <b>not</b> in the lowland?`,
   opts:[`The mother can bask and warm the embryos on the mountain, but sun-warmed lowland soil already keeps laid eggs warm`,`Carrying embryos costs the mother less energy in the cold, but it costs her much more energy in the warm lowland`,`Eggs on the mountain need a thicker shell for protection, but lowland eggs can develop with no shell at all`,`The mountain mother can produce far more embryos than the lowland mother, because the cold lowers her need for food`], ans:0,
   hint:`The mother can move. Where can she go that eggs left in a nest cannot, and is that move needed in the lowland?`,
   sol:msol(['Eggs left in a nest follow the temperature of the soil. On a cold mountain the soil is too cold for the embryos to develop well.','A mother that carries the embryos can move into the sun and warm them. In the warm lowland the sun-warmed soil already does this job, so retaining the eggs gains little and still costs the mother energy.','The other statements are wrong: carrying embryos costs the same energy wherever the mother lives, a shell is needed in both habitats, and the cold does not let a mother make more embryos.'],'Answer: The mother can bask and warm the embryos on the mountain, but sun-warmed lowland soil already keeps laid eggs warm')}
  ] },

/* ================= LEVEL 5 ================= */
{ id:5, name:'The amniotic egg', short:'Amniotic egg',
  teach:{ h:'A shell and four membranes keep the embryo alive on land', b:`
<p>Reptiles, birds and egg-laying mammals (monotremes) lay an <b>amniotic egg</b>. The embryo develops inside a shell, wrapped in membranes, with its own food and water supply.</p>
${vis(amnioticEgg({labels:'all'}),'The amniotic egg of a bird')}
${contrast3(['Part','Where it is','What it does'],[
 ['Shell','Outermost layer; hard in birds, leathery in most reptiles','Protects the egg. It is porous, so gases pass through, and it limits water loss.'],
 ['Albumen','The egg white around the membranes','Supplies water and protein and absorbs shocks'],
 ['Chorion','The outermost membrane, enclosing everything inside it','Gas exchange: oxygen in, carbon dioxide out'],
 ['Amnion','A fluid-filled sac around the embryo','Cushions the embryo and stops it drying out'],
 ['Yolk sac','Sac of yolk attached to the embryo','Stores food for the embryo'],
 ['Allantois','A sac that grows out of the embryo','Stores nitrogenous waste and helps with gas exchange']])}
${mwk([
 'Suppose a hen\'s egg has a mass of 60 g when laid. During 21 days of incubation it loses 0,4 g of mass each day through the pores in the shell.',
 'Total loss = 0,4 &times; 21 = 8,4 g.',
 'Percentage of the original mass lost = 8,4 &divide; 60 &times; 100 = 14%.'],
 'The egg loses only 14% of its mass: the shell lets gases through but holds most of the water in.')}
${mrule('Because the egg carries its own fluid, food and waste store inside a protective shell, the embryo no longer needs a pond. Reptiles, birds and monotremes could therefore breed on dry land.')}
${mtrap('Do not swap the amnion and the allantois. The <b>amnion</b> holds the cushioning fluid. The <b>allantois</b> holds the waste.')}
${keyterms([['amniotic egg','egg with a shell and four membranes, laid on land'],['monotreme','egg-laying mammal'],['gas exchange','oxygen in, carbon dioxide out'],['nitrogenous waste','waste containing nitrogen, such as uric acid'],['porous','full of tiny holes that let gases pass'],['membrane','a thin sheet of living tissue']])}` },
  reteach:{ h:'The egg as a tiny camper van', b:`
<p>Imagine a camper van with everything a traveller needs, so it can drive far from any town. The amniotic egg is a camper van for an embryo, so it can be left far from any pond.</p>
${cards([
 {t:'The van body',d:'The shell. It protects the contents and is porous so air gets in.'},
 {t:'The water tank and bumpers',d:'The albumen. It holds water and protein and cushions bumps.'},
 {t:'The swimming pool',d:'The amnion. The embryo floats in this fluid, which cushions it and keeps it moist.'},
 {t:'The pantry',d:'The yolk sac. It stores the food.'},
 {t:'The waste tank',d:'The allantois. It stores nitrogenous waste so the embryo is not poisoned.'},
 {t:'The air vent',d:'The chorion. The outer membrane lets oxygen in and carbon dioxide out.'}],{min:170})}
${vis(amnioticEgg({labels:['shell','albumen','amnion','yolksac','allantois','chorion'],letters:true}),'Lettered amniotic egg: match each letter to a job in the camper van list')}
<p><b>Key to the picture:</b> A shell, B albumen, C amnion, D yolk sac, E allantois, F chorion.</p>
${mwk([
 'Imagine an investigation (illustrative data). The shells of 20 hen\'s eggs are painted with wax, which blocks the pores. Another 20 eggs are left untreated, and all 40 are incubated for 21 days.',
 'Imagine the result: no wax-coated egg hatches, and 18 of the 20 untreated eggs hatch.',
 'The only difference was the blocked pores, so the embryo needs air to pass through the shell.'],
 'Gas exchange through the porous shell is essential: the embryo suffocated when the pores were blocked.')}
${mrule('Learn each part as a job: protect, water and shock, float and cushion, food, waste, gas exchange.')}
${keyterms([['shell','protection, porous'],['albumen','water, protein, shock absorber'],['amnion','fluid cushion'],['yolk sac','food'],['allantois','waste'],['chorion','gas exchange']])}` },
  qs:[
  {type:'mc', stem:`Which letter shows the <b>yolk sac</b>?`, v:vis(amnioticEgg({labels:['amnion','yolksac','chorion','allantois'],letters:true}),'Amniotic egg with four parts lettered'),
   opts:['A','B','C','D'], ans:1,
   hint:`The yolk sac is the round sac of food below the embryo.`,
   sol:msol(['B is the yolk sac: the round sac of yolk below the embryo that stores food.','A is the amnion, the fluid-filled sac around the embryo. C is the chorion, the outer membrane. D is the allantois, the sac that stores waste.'],'Answer: B')},
  {type:'text', stem:`Name the structure labelled B.`, v:vis(amnioticEgg({labels:['chorion','allantois','shell','amnion'],letters:true}),'Amniotic egg with four parts lettered'),
   ans:'allantois', anyCase:true, accept:['the allantois','allantoic sac','allantoic membrane'], ph:'one word',
   hint:`It is a small sac that collects the embryo\'s waste.`,
   sol:msol(['B is the small green sac beside the embryo.','It stores nitrogenous waste and helps with gas exchange: the allantois.','A is the chorion, C is the shell and D is the amnion.'],'Answer: allantois')},
  {type:'text', stem:`Which membrane forms the outermost layer inside the shell, encloses all the other membranes and takes part in gas exchange?`, ans:'chorion', anyCase:true, accept:['the chorion','chorionic membrane'], ph:'one word',
   hint:`It lies just inside the shell and the albumen.`,
   sol:msol(['The shell is outside all the membranes.','The outermost membrane, which lets oxygen in and carbon dioxide out, is the chorion.'],'Answer: chorion')},
  {type:'mc', stem:`Read the two statements.<br><br>Statement 1: The albumen stores the nitrogenous waste of the embryo.<br>Statement 2: The allantois stores the nitrogenous waste of the embryo and helps with gas exchange.`,
   opts:[`Statement 1 only`,`Statement 2 only`,`Both statements`,`Neither statement`], ans:1,
   hint:`Decide which part of the egg stores the waste, and what else it does.`,
   sol:msol(['Statement 1 is false: the albumen is the egg white, a store of water and protein that also cushions the egg. It does not store waste.','Statement 2 is true: nitrogenous waste is stored in the allantois, which also helps with gas exchange.'],'Answer: Statement 2 only')},
  {type:'mc', stem:`Which statement best explains how the amniotic egg made it possible for reptiles to reproduce away from water?`,
   opts:[`The embryo develops in its own fluid, with a food store, a waste store and a shell that limits water loss`,`The shell is thick enough to stop all gases passing in or out, so the embryo is sealed off from the drying air`,`The yolk sac supplies the embryo with oxygen, so no gas exchange through the shell is needed on land`,`The albumen is a store of nitrogenous waste, so the embryo cannot be poisoned while it develops on land`], ans:0,
   hint:`Ask what the embryo gets from the egg that it used to get from a pond.`,
   sol:msol(['In the amniotic egg the amnion provides fluid, the yolk sac provides food, the allantois stores waste, and the shell limits water loss while letting gases pass.','The embryo no longer depends on an outside pond, so the egg can be laid on dry land.','A sealed shell would suffocate the embryo. The yolk sac holds food, not oxygen, and gas exchange through the shell is still needed. The albumen holds water and protein, and the waste is stored in the allantois.'],'Answer: The embryo develops in its own fluid, with a food store, a waste store and a shell that limits water loss')}
  ] },
/* ================= LEVEL 6 ================= */
{ id:6, name:'Altricial and precocial young', short:'Altricial vs precocial',
  teach:{ h:'Altricial young are born helpless, precocial young are born ready', b:`
<p>Young animals differ in how developed they are when they hatch or are born. <b>Altricial</b> young arrive helpless and need a great deal of care. <b>Precocial</b> young arrive well developed and can move and feed soon afterwards.</p>
${vis(arrowScale('Helpless at hatching','Independent at hatching',0.1,{label:'songbird chick'})+arrowScale('Helpless at hatching','Independent at hatching',0.9,{label:'duckling'}),'Two young birds on a scale of independence')}
${contrast('Altricial young','Precocial young',[
 ['Eyes closed; naked or with very few feathers or hairs','Eyes open; covered with down, feathers or fur'],
 ['Cannot leave the nest or move far','Can walk, run or swim within hours or days'],
 ['Fed by the parents, who may make hundreds of feeding trips each day','Often feed themselves, or follow a parent to food'],
 ['Much parental care for a long time','Less care, but the parents still guard them'],
 ['In birds, usually a shorter incubation','In birds, usually a longer incubation'],
 ['Songbirds such as sparrows, mice, humans','Ducklings, chickens, ostriches, wildebeest and other antelope calves']])}
${mwk([
 'A giraffe calf is born with its eyes open, covered in hair. Within an hour it stands, and within a day it can run beside its mother.',
 'Test 1: is it well developed at birth? Yes: eyes open and covered in hair.',
 'Test 2: can it move and keep up soon after birth? Yes.'],
 'It is born ready to move, so it is a precocial young animal.')}
${mrule('Altricial = helpless, much care. Precocial = well developed, moves soon. Most species fit one pattern much more closely than the other.')}
${mtrap('Precocial does <b>not</b> mean "no parental care". The parents still guard the young, and a mammal mother still feeds her calf with milk.')}
${keyterms([['altricial','born helpless, needing much parental care'],['precocial','born well developed and able to move soon'],['incubation','keeping eggs warm until they hatch'],['hatchling','a newly hatched young animal'],['down','soft first feathers'],['parental care','feeding and protecting the young']])}` },
  reteach:{ h:'Where the words come from, and a timeline of the first two weeks', b:`
<p>The two words tell you what they mean. <b>Altricial</b> comes from the Latin <i>alere</i>, "to nourish": these are young that must be nourished by the parents. <b>Precocial</b> comes from the Latin <i>praecox</i>, "ripe early": these are young that are ripe early.</p>
${dataTable(['Time','Songbird chick (altricial)','Duckling (precocial)'],[
 ['<b>Hour 1</b>','Blind, naked, lying in the nest','Dry, eyes open, covered in down'],
 ['<b>Day 1</b>','Cannot move far and is fed by the parents','Walks and swims, following its mother'],
 ['<b>Week 1</b>','Still in the nest, with feathers only starting','Feeds itself and grows fast'],
 ['<b>Week 2</b>','Feathers grown, ready to leave the nest','Still guarded by its mother, needs little feeding']],{w:600})}
${mwk([
 'A newly hatched pigeon chick is watched for one day. Its eyes are closed, it is almost naked, and it lies in the nest while its parents feed it.',
 'Clue A: eyes open and covered at birth? No. Clue B: able to follow its parent within a day? No.'],
 'Both clues are "no": the chick is helpless and is at the opposite end of the scale from a duckling. A "yes" to both would mean precocial.')}
${mrule('Ask two clues: eyes open and covered at birth, and able to follow its parent within a day. Two yes answers mean precocial; two no answers mean the opposite pattern.')}
${keyterms([['alere','"to nourish": altricial'],['praecox','"ripe early": precocial'],['fledge','grow the feathers needed to leave the nest']])}` },
  qs:[
  {type:'mc', stem:`Which description fits a <b>precocial</b> young animal?`,
   opts:[`It is born well developed, with open eyes, and soon able to follow its parent`,`It is born blind and naked and stays in the nest while the parents feed it`,`It is born as a larva that must change completely before it looks like an adult`,`It is born at a very early stage of development and finishes growing in a pouch`], ans:0,
   hint:`Precocial means ripe early: well developed at birth.`,
   sol:msol(['Precocial young are well developed at birth: eyes open and able to move soon.','Blind, naked and nest-bound describes altricial young. A larva that must change completely is a different pattern, and a young animal that finishes growing in a pouch is also born at a very early stage.'],'Answer: It is born well developed, with open eyes, and soon able to follow its parent')},
  {type:'text', stem:`Young animals that are born helpless, with their eyes closed and with little or no covering, and that need a lot of parental care, are described as ____.`, ans:'altricial', anyCase:true, accept:['altricial young','an altricial'], ph:'one word',
   hint:`Think of the word that means the opposite of precocial.`,
   sol:msol(['Helpless at birth, eyes closed, naked, needing much care: this is the altricial pattern.','Precocial is the opposite: well developed at birth.'],'Answer: altricial')},
  {type:'mc', stem:`Which of the following animals produces <b>precocial</b> young?`,
   opts:[`A wildebeest`,`A house mouse`,`A sparrow`,`A human`], ans:0,
   hint:`Which newborn can run within hours of birth?`,
   sol:msol(['A wildebeest calf can stand within minutes and run with the herd within hours: precocial.','Mouse pups are born naked and blind, sparrow chicks are blind and nest-bound, and a human baby is helpless: all altricial.'],'Answer: A wildebeest')},
  {type:'num', stem:`The table describes six newborn animals. How many of them show the <b>altricial</b> pattern?`, v:vis(dataTable(['Newborn','Eyes','Covering','Follows its parent within a day?'],[
   ['Duckling','Open','Down','Yes'],['Mouse pup','Closed','Naked','No'],['Springbok lamb','Open','Hair','Yes'],['Sparrow chick','Closed','Almost naked','No'],['Ostrich chick','Open','Down','Yes'],['Rat pup','Closed','Naked','No']],{w:560}),'Six newborn animals'),
   ans:3, unit:'animals',
   hint:`Altricial young have closed eyes, little or no covering, and cannot follow a parent.`,
   sol:msol(['Altricial young are helpless: eyes closed, little or no covering, and unable to follow a parent.','The mouse pup, the sparrow chick and the rat pup fit this description.','The duckling, the springbok lamb and the ostrich chick have open eyes, a covering and follow their parent: precocial.'],'Answer: 3')},
  {type:'mc', stem:`Blue wildebeest give birth on open grassland where there is nowhere to hide. Which statement best explains why <b>precocial</b> calves are an advantage here?`,
   opts:[`Calves can stand and run with the herd within hours, so they can escape from predators`,`Calves are born blind and helpless, so the herd is able to hide them in tall grass`,`The mother can leave a calf alone for weeks because it can feed itself from birth`,`Calves need less energy for growth because they are born at an early stage of development`], ans:0,
   hint:`Think about what a calf must be able to do on open ground within hours.`,
   sol:msol(['On open grassland there is no cover, so a calf must be able to run with the herd soon after birth.','Precocial calves can do this. Blind, helpless calves would be easy prey, a mammal calf still drinks its mother\'s milk, and precocial young are born at a late, not an early, stage of development.'],'Answer: Calves can stand and run with the herd within hours, so they can escape from predators')}
  ] },

/* ================= LEVEL 7 ================= */
{ id:7, name:'Parental care, r and K strategies', short:'Care, r and K strategies',
  teach:{ h:'More care means fewer offspring: r and K strategies', b:`
<p>A parent has only a limited amount of energy. It can spend it on a great many offspring with no care, or on a few offspring with a great deal of care. This trade-off gives two extreme patterns, called the <b>r strategy</b> (always a small r) and the <b>K strategy</b> (always a capital K).</p>
${vis(arrowScale('Many offspring, no care','Few offspring, much care',0.1,{label:'r strategy'})+arrowScale('Many offspring, no care','Few offspring, much care',0.9,{label:'K strategy'}),'The two ends of the trade-off')}
${contrast('r strategy','K strategy',[
 ['Many small offspring','Few large offspring'],
 ['Little or no parental care','Much parental care'],
 ['Low survival of each offspring','High survival of each offspring'],
 ['Mature early, short life','Mature late, long life'],
 ['Unstable or unpredictable habitat','Stable habitat'],
 ['Population often far below the carrying capacity (K)','Population close to the carrying capacity (K)'],
 ['Many fish, frogs and insects','Elephants, whales, humans']])}
${dataTable(['Animal','Young per season','Parental care','Surviving to adulthood (%)'],[['P','5 000','None','0,2'],['Q','120','None','8'],['R','4','Much','75'],['S','1','Very much','90']],{w:560})}
${vis(barChart({title:'Young surviving to adulthood (%)',cats:['P','Q','R','S'],series:[{name:'Survival',vals:[0.2,8,75,90]}],max:100,step:25,yLabel:'%',w:380}),'Illustrative data for four animals, invented for practice: the more care, the higher the survival')}
${mwk([
 'Animal P: 5 000 young per season, and 0,2% survive to adulthood.',
 'Survivors = 5 000 &times; 0,2 &divide; 100 = 10.',
 'Animal R: 4 young, and 75% survive: 4 &times; 75 &divide; 100 = 3.'],
 'P: 10 survivors from 5 000 young. R: 3 survivors from 4 young.')}
${mrule('Care costs energy and time, so a parent can afford either many offspring or much care for each one, not both. K is the <b>carrying capacity</b>: the largest population the environment can support.')}
${mtrap('r and K are the two ends of a range, not two boxes. Many animals sit somewhere in between.')}
${keyterms([['parental care','feeding and protecting the young'],['r strategy','many offspring, little care, low survival'],['K strategy','few offspring, much care, high survival'],['carrying capacity (K)','largest population the environment can support'],['clutch size','number of eggs laid at one time'],['survival rate','percentage of young reaching adulthood']])}` },
  reteach:{ h:'An energy budget: two ways to spend 100 units', b:`
<p>Give every parent the same <b>energy budget</b> of 100 units each breeding season. Then see how far it goes on two different plans.</p>
${dataTable(['','Plan A','Plan B'],[
 ['<b>Energy budget</b>','100 units','100 units'],
 ['<b>Energy spent on each young</b>','0,05 units: a tiny egg and no care','25 units: a large young and much care'],
 ['<b>Young produced</b>','100 &divide; 0,05 = 2 000','100 &divide; 25 = 4'],
 ['<b>Survive to adulthood</b>','0,1%','50%'],
 ['<b>Survivors</b>','2 000 &times; 0,1 &divide; 100 = 2','4 &times; 50 &divide; 100 = 2'],
 ['<b>Name of the strategy</b>','r strategy','K strategy']],{w:600})}
${mwk([
 'Count the young a budget buys: budget &divide; energy per young.',
 'Then count the survivors: young &times; percentage surviving &divide; 100.',
 'Plan A leaves 2 survivors from 2 000 young, and Plan B leaves 2 survivors from 4 young.'],
 'With the same budget, Plan A buys numbers and Plan B buys survival of each young.')}
${mrule('Same budget, so a parent cannot do both. Plan A is the r strategy. Plan B is the K strategy, and it suits a stable habitat in which the population stays close to the carrying capacity (K).')}
${keyterms([['energy budget','the energy a parent has for reproduction'],['r strategy','spend on numbers'],['K strategy','spend on care'],['survivors','young &times; survival &divide; 100']])}` },
  qs:[
  {type:'mc', stem:`Parental care increases the survival of the young. What is the main <b>cost</b> of parental care to the parents?`,
   opts:[`It uses energy and time that could have been spent producing more offspring`,`It reduces the genetic variation in the offspring because the parents stay together`,`It slows the growth of the young, so they take longer to reach adult size`,`It makes the offspring smaller, so they are easier for predators to catch`], ans:0,
   hint:`Think about what a parent could have done with the same energy.`,
   sol:msol(['A parent has a limited energy budget.','Energy spent on care of each young cannot be spent on making more young, so the cost is a smaller number of offspring.','Care does not change genetic variation, it speeds rather than slows the growth of the young, and it does not make them smaller.'],'Answer: It uses energy and time that could have been spent producing more offspring')},
  {type:'text', stem:`An animal matures within weeks, lives for one season and lays hundreds of eggs in a pond that dries up in most years. Is it an r strategist or a K strategist? Write the letter only.`, ans:'r', anyCase:true, accept:['r strategist','r-strategist','r strategy','r-strategy','r selected','r-selected'], ph:'r or K',
   hint:`Look at how fast it matures and how stable the habitat is.`,
   sol:msol(['Early maturity, a short life, many eggs and an unstable habitat are the pattern of the r strategy.','The K strategy is late maturity, a long life, few offspring and a stable habitat.'],'Answer: r')},
  {type:'num', stem:`A fish lays 3 000 eggs in one breeding season, and 0,4% of them survive to adulthood. How many offspring survive to adulthood?`, ans:12, unit:'offspring',
   hint:`Multiply the number of eggs by 0,4 and divide by 100.`,
   sol:msol(['Survivors = 3 000 &times; 0,4 &divide; 100.','3 000 &times; 0,4 = 1 200, and 1 200 &divide; 100 = 12.'],'Answer: 12')},
  {type:'mc', stem:`Which set of features describes a <b>K strategist</b>?`,
   opts:[`Few offspring, much parental care, high survival of the young and a population close to carrying capacity`,`Many offspring, little parental care, low survival of the young and a population near carrying capacity`,`Few offspring, much parental care, low survival of the young and very early maturity in an unstable habitat`,`Many offspring, much parental care, high survival of the young and a short life in an unpredictable habitat`], ans:0,
   hint:`K strategists put their energy into care, not numbers.`,
   sol:msol(['K strategists produce few offspring and care for them, so survival of the young is high, and the population stays close to the carrying capacity.','The set with many offspring and little care describes an r strategist. The other two sets mix features that do not occur together: much care with low survival and early maturity, or many offspring with much care.'],'Answer: Few offspring, much parental care, high survival of the young and a population close to carrying capacity')},
  {type:'mc', stem:`A learner states: "An elephant should produce as many calves as an open-sea fish produces eggs, because more offspring means more survivors." Which response gives the best reason why the claim is wrong?`,
   opts:[`A parent has a limited energy budget, so much care for each young means fewer young are made`,`Elephants carry their young for so long that they cannot have more than one calf at a time`,`Elephants live in stable habitats, and stable habitats cannot support many offspring`,`Parental care has no effect on survival, so only the number of offspring matters to survival`], ans:0,
   hint:`Ask what a limited energy budget must be shared between.`,
   sol:msol(['An elephant gives each calf a very large amount of care, and care costs energy.','Because the budget is limited, much care for each calf means only a few calves can be made. The fish spends almost nothing on each egg, so it can make thousands.','The other statements are wrong: a long pregnancy does not by itself prevent more than one calf, stable habitats do not rule out many offspring, and care does raise survival.'],'Answer: A parent has a limited energy budget, so much care for each young means fewer young are made')}
  ] },

/* ================= LEVEL 8 ================= */
{ id:8, name:'Courtship, mate choice and breeding seasons', short:'Courtship and timing',
  teach:{ h:'Courtship and breeding seasons put mating and birth at the right time', b:`
<p><b>Courtship</b> is the set of displays, calls and other behaviours that animals perform before mating. A <b>breeding season</b> times reproduction so that the young appear when conditions suit them.</p>
${cards([
 {t:'Species recognition',d:'Each species has its own display or call, so animals mate with their own species and do not waste gametes on a partner of the wrong species.'},
 {t:'Mate choice',d:'A female can judge the health, strength and condition of a male from his display, colour or call, and choose a fit mate.'},
 {t:'Synchronisation',d:'The display brings both partners into breeding condition together, so ova and sperm are ready at the same time.'}],{min:190})}
${cards([
 {t:'The cue',d:'Breeding is triggered by an environmental cue such as day length, temperature or rainfall. Day length is the most reliable: it changes by the same amount on the same dates every year, while temperature and rainfall vary.',hi:true},
 {t:'The reason',d:'The timing puts the birth or hatching of the young at a time when food is plentiful. Many mothers giving birth in a short period also means predators cannot eat all the young.',hi:true}],{min:260})}
${mwk([
 'Suppose a songbird\'s eggs take 12 days to hatch and the chicks need 14 days in the nest. Insect food is plentiful only until 30 November.',
 'Time from laying to the chicks leaving = 12 + 14 = 26 days.',
 'Latest laying date = 30 November minus 26 days = 4 November.'],
 'The eggs must be laid by 4 November, so pairing up and nest building must happen in the weeks before that.')}
${mrule('The cue switches breeding on. The reason it pays is food for the young, and safety in numbers. Courtship makes sure the right animals mate at the right time.')}
${mtrap('The cue and the reason are different things. "Breeds in spring because the days get longer" names the cue. The reason is that the chicks are fed when food is plentiful.')}
${keyterms([['courtship','displays and calls performed before mating'],['breeding season','the time of year when animals reproduce'],['day length','hours of daylight in a day'],['synchronisation','partners ready at the same time'],['mate choice','selecting the fittest partner'],['environmental cue','a change that triggers breeding']])}` },
  reteach:{ h:'Cue and reason: two columns, then a model answer', b:`
<p>Most wrong answers on this topic mix up the two columns below. The left column is what <b>switches breeding on</b>. The right column is <b>why that timing pays</b>.</p>
${contrast('The cue (what triggers breeding)','The reason (why the timing pays)',[
 ['Heavy rain after a dry spell','Frogs lay eggs when pools are full, so tadpoles have water'],
 ['Sea temperature rises','Fish spawn when tiny food organisms are plentiful for the larvae']])}
${cards([
 {t:'Courtship is about the pair',d:'Species recognition, choosing a fit mate, and bringing both partners into breeding condition together.'},
 {t:'The season is about the young',d:'The time of year that gives the young the best chance of food and safety.'}],{min:200})}
${mwk([
 'Question (2 marks): explain why frogs in a dry region breed after heavy rain.',
 'Mark 1: the rain fills temporary pools, in which the eggs and tadpoles can develop.',
 'Mark 2: all the frogs breed at the same time, so males and females are ready together.'],
 'Full marks: one point about the young (water for the tadpoles) and one about the pair (breeding together).')}
${mtrap('Do not answer "because it is warm" or "because the parents like it". Always link the timing to food or safety for the <b>young</b>.')}
${keyterms([['cue','what triggers breeding'],['reason','why the timing helps the young'],['spawn','release eggs and sperm into water'],['temporary pool','a pond that fills only after rain']])}` },
  qs:[
  {type:'text', stem:`Name the set of displays, calls and dances that animals perform before mating.`, ans:'courtship', anyCase:true, accept:['courtship behaviour','courtship behavior','courtship display','courtship displays','courting','courtship ritual','courtship rituals','mating display','mating ritual','courtship dance'], ph:'one word',
   hint:`A human uses the same word for the period before an engagement.`,
   sol:msol(['The behaviours performed before mating, such as displays, calls and dances, are called courtship.'],'Answer: courtship')},
  {type:'mc', stem:`Which of the following is <b>not</b> a purpose of courtship behaviour?`,
   opts:[`To reduce the genetic variation among the offspring of the pair`,`To help animals recognise members of their own species`,`To allow one partner to judge the health and condition of the other`,`To bring both partners into breeding condition at the same time`], ans:0,
   hint:`Three of these help the pair to mate successfully. One would be a disadvantage.`,
   sol:msol(['Courtship helps species recognition, choice of a fit mate and synchronisation of the partners.','It does not aim to reduce variation: choosing a fit mate, in fact, tends to give healthier offspring.'],'Answer: To reduce the genetic variation among the offspring of the pair')},
  {type:'text', stem:`Many temperate birds begin to breed in spring. Which seasonal environmental cue, which is exactly the same every year whatever the weather, is the most reliable trigger for them? Give a two-word answer.`, ans:'day length', anyCase:true, accept:['daylength','day-length','day lengths','length of day','length of the day','hours of daylight','daylight hours','number of daylight hours','photoperiod','photoperiodism','daylight','daylight length','length of daylight','amount of daylight','hours of light','increasing day length','longer days','days getting longer'], ph:'two words',
   hint:`Think about what is the same on a given date every year, however warm or wet it is.`,
   sol:msol(['Temperature and rainfall vary from year to year, so they are unreliable cues.','The number of hours of daylight changes by the same amount on the same dates every year, so day length is the most reliable cue.'],'Answer: day length')},
  {type:'mc', stem:`Most antelope in a grassland region give birth at the start of the rainy season. Which statement best explains why this is an advantage?`,
   opts:[`New grass is plentiful, so mothers make plenty of milk and the calves find food`,`Rain keeps predators away from the herd for weeks, so the calves are not hunted`,`Warm rain gives the calves heat, so the mothers need no energy to keep them warm`,`The males stop fighting when it rains, so the calves are not injured by them`], ans:0,
   hint:`Think about what the mother and calf need to eat and drink.`,
   sol:msol(['The birth season is timed so that the young appear when food is plentiful.','Rain brings new grass, so the mother can eat well and produce milk, and the calf can soon graze.','Rain does not keep predators away, it does not warm the calves, and the behaviour of males is not the reason for the timing.'],'Answer: New grass is plentiful, so mothers make plenty of milk and the calves find food')},
  {type:'mc', stem:`In a herd of blue wildebeest, most of the calves are born within a few weeks of each other. A researcher suggests that this is an advantage. Which statement best explains why?`,
   opts:[`So many calves appear at once that predators cannot kill them all, so a larger share survive`,`Calves born together are all the same age, so they grow at the same speed and none is smaller`,`Mothers that give birth late are left behind by the herd, so only the early calves can be nursed`,`Predators cannot find the calves because the mothers hide them in the grass for three weeks`], ans:0,
   hint:`Think about how many calves a predator can eat in one day.`,
   sol:msol(['When many young are born at the same time, the predators are quickly satisfied and cannot eat them all.','This raises the percentage of calves that survive.','Growth speed is not the reason, late mothers are not simply left behind, and wildebeest calves are precocial: they run with the herd rather than being hidden.'],'Answer: So many calves appear at once that predators cannot kill them all, so a larger share survive')}
  ] },

/* ================= LEVEL 9 ================= */
{ id:9, name:'Matching a strategy to its habitat', short:'Strategy and habitat',
  teach:{ h:'Name the habitat\'s problem, then the feature that answers it', b:`
<p>Every habitat sets a problem for eggs and young. A reproductive strategy is good when it answers that problem. Use three steps for any "explain why" question.</p>
${chain(['Name the main problem the habitat sets: drying out, cold, predators, scattering of gametes.','Pick the feature of the strategy that answers it: type of fertilisation, type of egg, number of eggs, parental care or timing.','State the benefit: more eggs or young survive, or less energy is wasted.'])}
${dataTable(['Problem set by the habitat','Feature that answers it','Benefit'],[
 ['Risk of drying out','Gametes meet inside the body, and the egg has a covering that holds water in','Gametes and embryos stay moist'],
 ['Gametes can be released into water, but eggs and larvae are eaten or swept away','Very many small eggs, no parental care, and gametes shed into the water','Some eggs survive by sheer numbers, and the parent saves energy'],
 ['Near-freezing temperatures','The parent incubates the eggs with its body heat','The embryos stay warm enough to develop'],
 ['A short season when food is plentiful','Breeding timed to that season, and fast-growing young','The young grow while food lasts'],
 ['Open ground with nowhere to hide','Precocial young born at about the same time','Young can run, and predators cannot catch them all']],{w:660})}
${mwk([
 'Question (3 marks): explain why many antelope on open grassland give birth to one well-developed calf at a time.',
 'Mark 1, the problem: there is no cover, so a calf cannot hide. A precocial calf can run with the herd soon after birth.',
 'Mark 2, the feature: one calf lets the mother give enough milk and defend it.',
 'Mark 3, the benefit: the embryo is protected and fed inside her while she keeps moving, so more calves survive.'],
 'Full marks: three links from the habitat to the strategy to the survival of the young.')}
${mrule('A good "explain why" answer has three parts: the habitat problem, the feature, and the benefit to survival. Always write all three.')}
${keyterms([['habitat','where an animal lives'],['adaptation','a feature that suits the habitat'],['incubate','keep eggs warm with body heat'],['environmental resistance','all the factors that limit the growth of a population, such as predation, disease and food shortage'],['precocial','born well developed'],['external fertilisation','gametes meet in the water']])}` },
  reteach:{ h:'A fill-in answer frame and a model answer', b:`
<p>Use a sentence frame so that no part of the answer is forgotten.</p>
${cards([
 {t:'Because...',d:'...the habitat has [this problem],',hi:true},
 {t:'the animal...',d:'...uses [this feature of its strategy],',hi:true},
 {t:'which...',d:'...[helps the eggs or young to survive in this way].',hi:true}],{min:170})}
${cards([
 {t:'Water is scarce',d:'Look at the type of fertilisation, the covering of the egg and where the eggs are laid.'},
 {t:'Eggs and larvae are eaten or swept away',d:'Very many small eggs, because most are lost, and no care, which saves the parent energy.'},
 {t:'Near-freezing cold',d:'Look at what the parent does with its own body.'},
 {t:'Short season of plentiful food',d:'Look at the timing of breeding and at how fast the young grow.'},
 {t:'Open ground, no cover',d:'Look at how developed the young are when they are born.'}],{min:150})}
${mwk([
 'Question (3 marks): explain why a sea turtle buries her eggs in the sand above the high-tide line and then leaves them.',
 'Because the eggs develop on land, they are amniotic eggs with a shell and membranes, so the embryos stay moist (1).',
 'Buried eggs are hidden from predators and kept moist and at a steady temperature (1).',
 'Leaving the eggs saves her energy, which she uses to make many eggs, so some hatchlings survive although there is no care (1).'],
 'Full marks: habitat problem, feature and benefit, in three marks.')}
${mrule('Check your answer against the frame. If one of the three slots is empty, add it.')}
${mtrap('A feature on its own earns no mark. "It lays many eggs" needs a reason: "because most eggs are eaten, so some still survive".')}
${keyterms([['problem','what the habitat does to eggs and young'],['feature','what the strategy does about it'],['benefit','more survive, or less energy is wasted']])}` },
  qs:[
  {type:'mc', stem:`A lizard lives in a hot desert where water is scarce and the surface of the sand is very hot. Which combination of features is best suited to this habitat?`,
   opts:[`Internal fertilisation, and eggs with leathery shells that are buried in soil`,`External fertilisation in shallow pools, and thousands of eggs with no shell`,`Internal fertilisation, and eggs without a shell that are left on the surface`,`External fertilisation, and eggs that are incubated on the surface in the sun`], ans:0,
   hint:`The main problem in a desert is drying out.`,
   sol:msol(['Problem: water is scarce and the surface is hot, so gametes and eggs would dry out.','Features that answer it: internal fertilisation keeps the gametes moist, a leathery shell limits water loss, and burying the eggs keeps them moist and hidden.','External fertilisation needs water, and eggs without a shell or left on the hot surface would dry out.'],'Answer: Internal fertilisation, and eggs with leathery shells that are buried in soil')},
  {type:'text', stem:`An open-ocean fish produces many thousands of eggs and gives no parental care. Which type of fertilisation is expected in this fish?`, ans:'external', anyCase:true, accept:['external fertilisation','external fertilization','externally'], ph:'one word',
   hint:`Where do the gametes of most fish meet?`,
   sol:msol(['Many thousands of eggs and no care is the pattern for gametes released into the water.','The sperm and eggs meet in the surrounding water: external fertilisation.'],'Answer: external')},
  {type:'text', stem:`Arctic birds nest on the ground where it is near freezing even in summer. Predict the parental behaviour that protects their eggs from the cold, in which the parent sits on the eggs and warms them with its body heat. Name this behaviour.`, ans:'incubation', anyCase:true, accept:['incubating','incubate','incubates','brooding','brood','incubation of eggs','incubating the eggs','incubate the eggs','sitting on the eggs','brooding eggs','egg incubation'], ph:'one word',
   hint:`Think about what a hen does when she sits on her eggs.`,
   sol:msol(['Problem: the cold could stop the embryos developing.','Feature: the parent sits on the eggs and keeps them warm with its body heat.','Warming the eggs in this way is called incubation.'],'Answer: incubation')},
  {type:'text', stem:`The egg of a land-living reptile needs a shell and membranes to answer one main problem that does not affect the eggs of a fish in the ocean. Name this problem in two words.`, ans:'drying out', anyCase:true, accept:['drying','dryness','desiccation','dehydration','water loss','loss of water','drying up','lack of water','water shortage','risk of drying out','risk of drying','dry out'], ph:'two words',
   hint:`Think about what happens to a wet egg left in dry air.`,
   sol:msol(['A fish egg is surrounded by water, so it cannot lose its water.','A reptile egg on land is surrounded by air. The shell and the fluid-filled membranes hold the water in, so the problem they answer is drying out.'],'Answer: drying out')},
  {type:'mc', stem:`A seabird nests on a cold Antarctic cliff and lays a single egg each season. Both parents take turns to incubate the egg and then feed the chick. Which statement best explains why this strategy suits the habitat?`,
   opts:[`Warmth and feeding from both parents give the single egg and its chick a good chance of survival here`,`The parents can lay many more eggs later in the season, so the single egg is not at risk from the cold`,`Internal fertilisation is not possible in the cold, so only one egg can be fertilised each season`,`A single egg needs no incubation, because the cold ground keeps the embryo at a steady temperature`], ans:0,
   hint:`Ask what the cold does to an egg left alone, and what care does for a single young.`,
   sol:msol(['Problem: the habitat is cold, so an egg left alone would chill and a chick would not find enough food by itself.','Feature: both parents incubate the egg with their body heat and then feed the chick.','Benefit: care gives the few young a high chance of survival, which is the K-strategy trade-off.','The other statements are wrong: the Antarctic season is short, so there is no time for many more eggs; birds fertilise internally in any climate; and a cold surface would chill the embryo, not keep it at a steady temperature.'],'Answer: Warmth and feeding from both parents give the single egg and its chick a good chance of survival here')}
  ] },

/* ================= LEVEL 10 ================= */
{ id:10, name:'Exam standard: comparing two species', short:'Exam: compare two species',
  teach:{ h:'Four moves for a data item: read, calculate, explain, evaluate', b:`
<p>An exam data item gives a table about two species and then asks four kinds of question. Each kind has a recipe.</p>
${chain(['<b>Read</b>: quote the values from the table, with units.','<b>Calculate</b>: write the formula, substitute, and round as the question says.','<b>Explain</b>: link the data to a feature of the strategy, such as care, numbers or fertilisation.','<b>Evaluate</b>: weigh both strategies against their habitats and give a judged conclusion.'])}
${dataTable(['Feature','Species P: a frog','Species Q: an antelope'],[
 ['Fertilisation','External','Internal'],
 ['Eggs or young produced per female in her lifetime','3 000','10'],
 ['Number that reach adulthood','15','8'],
 ['Parental care','None','The mother guards the calf and feeds it with milk']],{w:600})}
<p style="text-align:center;font-size:13px;color:#6b6b6b">Illustrative data, invented for practice.</p>
${mwk([
 'Percentage reaching adulthood = (number reaching adulthood &divide; number produced) &times; 100.',
 'Species P: 15 &divide; 3 000 = 0,005, and 0,005 &times; 100 = 0,5.',
 'Check by reading the table: 15 out of 3 000 is a small fraction, so a small percentage is sensible.'],
 'Species P: 0,5% of its eggs reach adulthood.')}
${mrule('Percentage = part &divide; whole &times; 100, and the whole is always the number <b>produced</b>. When you evaluate, do not call one strategy "better": say how each strategy suits its habitat and what each one costs.')}
${mtrap('Percentages and numbers answer different questions. Check which one the question asks for.')}
${keyterms([['percentage survival','number reaching adulthood &divide; number produced &times; 100'],['evaluate','weigh up and reach a judgement'],['strategy','the whole pattern of fertilisation, eggs and care'],['clutch size','eggs laid at one time'],['parental care','feeding and protecting the young'],['carrying capacity','the largest population the habitat can support']])}` },
  reteach:{ h:'Five common wrong answers on a data item, and the repair for each', b:`
<p>Most marks lost on this kind of item come from the same five slips. Check each one against your own working.</p>
${dataTable(['Wrong answer','What went wrong','Repair'],[
 ['3 000 &divide; 15 = 200','Whole and part divided the wrong way round','Divide the survivors by the number produced'],
 ['15 &divide; 3 000 = 0,005, written as 0,005%','The step "&times; 100" was left out','Multiply by 100 to turn a fraction into a percentage'],
 ['0,5% rounded to 1%','Rounded to a whole number when two decimal places were asked','Follow the rounding in the question'],
 ['"The percentage is lower, so fewer animals survive"','Percentage and number of survivors confused','Work out the number as well as the percentage'],
 ['"Strategy P is better than Q"','Judged without a habitat or a cost','Say how each suits its habitat and what each costs']],{w:660})}
${mwk([
 'Species R produced 800 eggs, and 12 reached adulthood.',
 'Divide survivors by the number produced: 12 &divide; 800 = 0,015.',
 'Multiply by 100: 0,015 &times; 100 = 1,5.'],
 'Species R: 1,5% of its eggs reach adulthood.')}
${mrule('Read the rounding instruction first, then divide part by whole, multiply by 100 and write the unit. When you explain, say that care raises the <b>percentage</b> that survive, and that very many eggs raise the <b>number</b> that survive.')}
${keyterms([['part','survivors'],['whole','number produced'],['&times; 100','turns a fraction into a percentage']])}` },
  qs:[
  {type:'num', stem:`A researcher recorded the values below for two species. The values are invented for practice.<br><br>Calculate the percentage of Species A eggs that reach adulthood. Give your answer correct to <b>two decimal places</b>.`, v:vis(dataTable(['Feature','Species A: an open-ocean fish','Species B: a seabird nesting on a cliff'],[
   ['Fertilisation','External','Internal'],
   ['Eggs produced per female per breeding season','50 000','2'],
   ['Eggs reaching adulthood per female per season (mean)','10','1'],
   ['Parental care','None','Both parents incubate the eggs and feed the chick']],{w:600}),'Illustrative data for two species'),
   ans:0.02, unit:'%',
   hint:`Divide the number reaching adulthood by the number produced, then multiply by 100.`,
   sol:msol(['Percentage = 10 &divide; 50 000 &times; 100.','10 &divide; 50 000 = 0,0002, and 0,0002 &times; 100 = 0,02.'],'Answer: 0,02%')},
  {type:'num', stem:`Use the table for Species A and Species B. Calculate the percentage of Species B eggs that reach adulthood. Give your answer as a whole number.`, v:vis(dataTable(['Feature','Species A: an open-ocean fish','Species B: a seabird nesting on a cliff'],[
   ['Fertilisation','External','Internal'],
   ['Eggs produced per female per breeding season','50 000','2'],
   ['Eggs reaching adulthood per female per season (mean)','10','1'],
   ['Parental care','None','Both parents incubate the eggs and feed the chick']],{w:600}),'Illustrative data for two species'),
   ans:50, unit:'%',
