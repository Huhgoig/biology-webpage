   opts:[`The follicle does not rupture, so no ovum is released and no corpus luteum forms`,`The follicle ruptures, but the ovum is destroyed before it reaches the fallopian tube`,`The endometrium is shed at once, because LH is the hormone that maintains the lining`,`Oestrogen secretion rises further, because the follicle then develops for longer`], ans:0,
   hint:`What does the LH surge cause?`,
   sol:hrsol(['The LH surge makes the follicle rupture.','If LH cannot act, the follicle does not rupture: no ovulation and so no corpus luteum.','LH does not maintain the lining (progesterone does), and it does not stop the ovum being released once ovulation has happened.'],'Answer: The follicle does not rupture, so no ovum is released and no corpus luteum forms')}
  ] },

/* ================= LEVEL 8 ================= */
{ id:8, name:'Progesterone and the luteal phase', short:'Progesterone',
  teach:{ h:'The corpus luteum secretes progesterone, which maintains the lining and switches off FSH and LH', b:`
<p>After ovulation the <b>corpus luteum</b> secretes <b>progesterone</b> (and some oestrogen). Progesterone <b>maintains and thickens</b> the endometrium so it is ready for an embryo. It also <b>inhibits FSH and LH</b>, so no new follicle develops.</p>
${vis(cycleChart({show:['progesterone'], band:true}), 'Progesterone and the endometrium over one cycle')}
${hrwk([
 'Compare day 10 with day 21 on the graph:',
 'On day 10 progesterone is close to zero and the band below the graph is thin.',
 'On day 21 progesterone is at its highest and the band is much thicker.',
 'The lining is maintained and thickened while progesterone is high.'],
 'High progesterone, thick lining: progesterone maintains the lining.')}
${hrrule('If <b>no fertilisation</b> takes place the corpus luteum degenerates (about day 24 to 26). Progesterone falls, the endometrium can no longer be maintained and it breaks down: <b>menstruation</b>.')}
${hrtrap('The fall in <b>progesterone</b> triggers menstruation, not a rise in any hormone. A high level keeps the lining; a low level lets it go.')}
${keyterms([['corpus luteum','secretes progesterone after ovulation'],['progesterone','maintains the endometrium and inhibits FSH and LH'],['luteal phase','after ovulation until menstruation'],['inhibit','reduce or stop'],['degenerate','break down']])}` },
  reteach:{ h:'The feedback loop: high progesterone switches the pituitary off, low progesterone switches it on', b:`
<p>See progesterone as a thermostat for FSH and LH. When progesterone is <b>high</b>, the pituitary is told to release less FSH and LH. When it <b>falls</b>, the brake is lifted and FSH rises again to start a new cycle.</p>
${vis(feedbackLoop({norm:'Progesterone level', up:{stim:'Progesterone high', gland:'Pituitary gland', hormone:'Less FSH and LH', effect:'No new follicle develops'}, down:{stim:'Progesterone falls', gland:'Pituitary gland', hormone:'More FSH released', effect:'A new follicle starts to grow'}}), 'Negative feedback of progesterone on the pituitary gland')}
${hrwk([
 'Think about a woman who is not pregnant. After ovulation her progesterone stays high for about 12 days.',
 'While it works, progesterone stays high, so FSH and LH stay low.',
 'When the source of progesterone breaks down, the level drops, FSH can rise and a new follicle begins to develop.'],
 'The end of one cycle is the start of the next, because falling progesterone releases the brake on FSH.')}
${hrrule('Read the loop above and ask: what happens to the lining, and to FSH and LH, when progesterone is <b>high</b>? And when it is <b>low</b>?')}
${keyterms([['negative feedback','a high level lowers the release of other hormones'],['progesterone','high in the luteal phase'],['FSH','rises again when progesterone falls'],['menstruation','shedding of the endometrium']])}` },
  qs:[
  {type:'text', stem:`Name the structure in the ovary that secretes progesterone after ovulation.`,
   ans:'corpus luteum', anyCase:true, accept:['the corpus luteum','corpus luteum (yellow body)','yellow body','corpora lutea','corpus luteums'], ph:'two words',
   hint:`It forms from the empty follicle.`,
   sol:hrsol(['After ovulation the empty follicle becomes the <b>corpus luteum</b>.','It secretes progesterone (and some oestrogen).'],'Answer: corpus luteum')},
  {type:'mc', stem:`In a woman who is not pregnant, which event <b>directly</b> causes menstruation?`,
   opts:[`The corpus luteum degenerates, so progesterone falls and the lining breaks down`,`The corpus luteum enlarges, so progesterone rises and the lining breaks down`,`The oestrogen level rises sharply, so the lining is shed to make room for a new one`,`The LH level falls again, so the cells of the endometrium stop receiving nutrients`], ans:0,
   hint:`Which hormone maintains the lining, and what happens to it at the end of the cycle?`,
   sol:hrsol(['Progesterone maintains the endometrium.','If there is no fertilisation the corpus luteum degenerates, progesterone falls, and the lining breaks down: menstruation.','A rise in progesterone would keep the lining, and oestrogen or LH are not what maintain it.'],'Answer: The corpus luteum degenerates, so progesterone falls and the lining breaks down')},
  {type:'mc', stem:`Use the graph. Which statement about <b>days 18 to 24</b> is supported by the graph?`,
   v:vis(cycleChart(), 'The four hormones over one cycle'),
   opts:[`Progesterone is high, while FSH and LH stay low`,`Progesterone is low, while FSH and LH stay high`,`Progesterone and LH are both rising steeply`,`FSH is at its highest, while progesterone is falling`], ans:0,
   hint:`Look at the purple, blue and red lines between day 18 and day 24.`,
   sol:hrsol(['Between days 18 and 24 the progesterone curve is high, close to its peak.','FSH and LH are both low over the same days, because high progesterone inhibits them.'],'Answer: Progesterone is high, while FSH and LH stay low')},
  {type:'text', stem:`Name the part of the uterus whose thickness is maintained by progesterone.`,
   ans:'endometrium', anyCase:true, accept:['the endometrium','uterine lining','lining of the uterus','uterus lining','lining','endometrial lining'], ph:'one word',
   hint:`It is the blood-rich lining where an embryo would implant.`,
   sol:hrsol(['Progesterone maintains and thickens the <b>endometrium</b>, the lining of the uterus, ready for implantation.'],'Answer: endometrium')},
  {type:'mc', stem:`Read the two statements about progesterone.<br><b>Statement 1:</b> A rapid fall in progesterone at the end of the cycle keeps the endometrium thick, so menstruation does not start.<br><b>Statement 2:</b> Progesterone inhibits the release of FSH and LH, so a new follicle does not develop during the luteal phase.<br>Which option is correct?`,
   opts:[`Statement 1 only`,`Statement 2 only`,`Both statements`,`Neither statement`], ans:1,
   hint:`What does a fall in progesterone do to the lining?`,
   sol:hrsol(['Statement 1 is false: a fall in progesterone means the lining can no longer be maintained, so it breaks down and menstruation begins.','Statement 2 is true: progesterone inhibits FSH and LH (negative feedback).'],'Answer: Statement 2 only')}
  ] },

/* ================= LEVEL 9 ================= */
{ id:9, name:'Reading the full hormone graph', short:'Reading the hormone graph',
  teach:{ h:'Identify each hormone by the shape and timing of its curve', b:`
<p>An exam graph may show all four hormones with no names on the curves. You identify each one by its <b>shape</b> and <b>timing</b>.</p>
${vis(cycleChart(), 'FSH, LH, oestrogen and progesterone over a 28-day cycle')}
${contrast3(['Hormone','Fingerprint on the graph','Made by'],[
 ['LH','Sharpest, narrowest spike at ovulation (day 14), low at all other times','Pituitary gland'],
 ['Oestrogen','Rises to a high peak just before ovulation, falls, then a smaller second hump in the luteal phase','Follicle, then corpus luteum'],
 ['Progesterone','Close to zero until ovulation, then a large hump peaking about day 21','Corpus luteum'],
 ['FSH','A small hump early in the cycle and a small peak at ovulation; very low in the luteal phase','Pituitary gland']])}
${hrwk([
 'A curve rises slightly at the start of the cycle, falls, shows a small peak at ovulation, then stays very low until day 25.',
 'It is not the sharpest spike, so it is not LH. It is not close to zero before ovulation, so it is not progesterone.',
 'There is no big peak before ovulation followed by a smaller hump, so it is not oestrogen.'],
 'The curve with small humps and a very low luteal phase is FSH.')}
${hrrule('<b>If fertilisation occurs</b> and the embryo implants, it secretes <b>hCG</b>, which keeps the corpus luteum alive. Progesterone then stays high, the lining is kept and there is no menstruation.')}
${hrtrap('Do not identify a curve by colour, or by height alone. Colours change from one exam paper to the next. Use the <b>shape and the day</b>.')}
${keyterms([['LH','sharp, narrow spike on day 14'],['oestrogen','peak before ovulation, second smaller hump'],['progesterone','low until ovulation, peak about day 21'],['FSH','small humps, low in the luteal phase'],['hCG','from the embryo, maintains the corpus luteum'],['corpus luteum','source of progesterone']])}` },
  reteach:{ h:'A step-by-step method for naming unlabelled curves', b:`
<p>Use the same four steps every time and name the curves in this order.</p>
${chain(['Find the <b>sharpest spike</b> (a narrow peak): that is LH.','Find the curve that is <b>almost zero until after ovulation</b>: that is progesterone.','Of the curves left, the one with a <b>big peak just before ovulation</b> and a smaller hump after it is oestrogen.','The curve that remains, with small humps and a very low luteal phase, is FSH.'],{hi:0})}
${hrwk([
 'A curve is low at first, climbs to a high peak around day 13, drops, then has a smaller peak around day 21.',
 'It does not stay near zero before day 14, so it is not progesterone.',
 'It is not the sharpest spike, so it is not LH. It has two humps with the higher one before ovulation.'],
 'Big peak before ovulation and a smaller later hump: oestrogen.')}
${hrrule('<b>Order of elimination: LH, then progesterone, then oestrogen, then FSH.</b> If the cycle is long or short, the shapes stay the same and only the days move.')}
${keyterms([['LH','sharpest spike'],['progesterone','zero before ovulation'],['oestrogen','two humps'],['FSH','small humps'],['hCG','embryo hormone in pregnancy']])}` },
  qs:[
  {type:'text', stem:`The graph shows four hormones, P, Q, R and S. Write the <b>letter</b> of the curve that shows <b>LH</b>.`,
   v:vis(hrGraph([{n:'P',pts:HR_PG,c:2},{n:'Q',pts:HR_FSH,c:3},{n:'R',pts:HR_LH,c:0},{n:'S',pts:HR_OE,c:1}]), 'Four hormones over one cycle'),
   ans:'R', anyCase:true, accept:['letter R','r.','R.','curve R'], ph:'a letter',
   hint:`Look for the sharpest, narrowest spike.`,
   sol:hrsol(['LH is the sharpest, narrowest spike, at ovulation (day 14).','That is curve R.','P is close to zero until day 14 (progesterone), Q has small humps (FSH) and S has a high peak before ovulation (oestrogen).'],'Answer: R')},
  {type:'text', stem:`The graph shows three hormones, J, K and L. Write the <b>letter</b> of the curve that shows <b>progesterone</b>.`,
   v:vis(hrGraph([{n:'J',pts:HR_OE,c:3},{n:'K',pts:HR_LH,c:1},{n:'L',pts:HR_PG,c:0}]), 'Three hormones over one cycle'),
   ans:'L', anyCase:true, accept:['letter L','l.','L.','curve L'], ph:'a letter',
   hint:`Which curve stays near zero until after ovulation?`,
   sol:hrsol(['Progesterone is close to zero before ovulation, then rises to a large peak in the luteal phase.','That is curve L.','J is oestrogen (peak before ovulation and a second hump) and K is LH (sharp spike).'],'Answer: L')},
  {type:'num', stem:`Use the graph. On which day does the progesterone level reach its peak? Type the number only.`,
   v:vis(cycleChart(), 'FSH, LH, oestrogen and progesterone'),
   ans:21, unit:'day',
   hint:`Find the purple curve and read down from its highest point.`,
   sol:hrsol(['Progesterone is the curve that stays near zero until ovulation.','Its highest point is above day 21 on the horizontal axis.'],'Answer: 21')},
  {type:'text', stem:`Name the hormone secreted by the embryo that keeps the corpus luteum alive in early pregnancy. Give the abbreviation.`,
   ans:'hCG', anyCase:true, accept:['human chorionic gonadotrophin','human chorionic gonadotropin','HCG','hcg','h.c.g.','chorionic gonadotrophin','chorionic gonadotropin'], ph:'abbreviation',
   hint:`The letters stand for human chorionic gonadotrophin.`,
   sol:hrsol(['After implantation the embryo secretes <b>hCG</b>.','hCG keeps the corpus luteum secreting progesterone, so the lining is not shed.'],'Answer: hCG')},
  {type:'mc', stem:`A researcher plotted illustrative hormone levels for one woman over 35 days. Which conclusion is best supported by the graph?`,
   v:vis(hrGraph([{n:'Progesterone',pts:HR_PG_PREG,c:3},{n:'Oestrogen',pts:HR_OE_PREG,c:0},{n:'FSH',pts:HR_FSH_PREG,c:1}],{days:35}), 'Hormone levels of one woman'),
   opts:[`She is probably pregnant, because progesterone stays high after day 28 instead of falling`,`She did not ovulate in this cycle, because the progesterone level rose after day 14`,`Her corpus luteum broke down early, because oestrogen stayed high after day 21 of the cycle`,`She has started menstruating on day 28, because the FSH level is low at that time`], ans:0,
   hint:`In a cycle without pregnancy, what happens to progesterone near day 26 to 28?`,
   sol:hrsol(['In a normal cycle progesterone falls from about day 25 so the lining is shed.','Here progesterone keeps rising to day 35: the corpus luteum has been kept alive, which happens when an embryo has implanted.','Progesterone only rises after ovulation, so ovulation did occur. A high oestrogen does not break down the corpus luteum, and menstruation needs a fall in progesterone, not a low FSH.'],'Answer: She is probably pregnant, because progesterone stays high after day 28 instead of falling')}
  ] },

/* ================= LEVEL 10 ================= */
{ id:10, name:'Fertilisation: sperm meets ovum', short:'Fertilisation',
  teach:{ h:'One sperm digests its way in, and its nucleus fuses with the ovum nucleus', b:`
<p><b>Fertilisation</b> is the fusion of a sperm nucleus with an ovum nucleus. It normally takes place in the <b>fallopian tube</b>. The result is a <b>zygote</b>.</p>
${vis(spermOvum({labels:['acrosome','sperm_nucleus','corona','zona','membrane','ovum_nucleus']}), 'A sperm cell (left) and an ovum (right) with the layers around the ovum')}
${chain(['Sperm swim up through the cervix and uterus into the fallopian tube','Enzymes from the acrosomes digest the corona radiata and the zona pellucida','One sperm head fuses with the ovum membrane and its nucleus enters','The ovum changes so that no other sperm can enter','The sperm nucleus (n) and ovum nucleus (n) fuse: a zygote (2n)'],{hi:4})}
<p>Millions of sperm are released, but most are lost on the way, in the acidic vagina or in the cervix and uterus, and only a few hundred reach the ovum. Enzymes from the acrosomes of many sperm together digest the layers around the ovum, so that one sperm can get through.</p>
${hrwk([
 'Question: Explain why an ovum can be fertilised for only a short time, yet intercourse a few days before ovulation can still lead to pregnancy. (2 marks)',
 'The ovum survives for only about a day after ovulation (1 mark).',
 'Sperm can survive for several days in the female tract, so sperm already waiting in the tube can fertilise the ovum when it arrives (1 mark).'],
 'A short-lived ovum and longer-lived sperm give a fertile window of a few days.')}
${hrrule('<b>Haploid (n) + haploid (n) = diploid (2n).</b> A sperm and an ovum each contribute one set of chromosomes, so the zygote has a full diploid set.')}
${hrtrap('Many sperm help to reach and open the ovum, but only <b>one</b> nucleus fuses. If two sperm entered, the zygote would have too many chromosomes.')}
${keyterms([['fertilisation','fusion of the sperm nucleus and ovum nucleus'],['zygote','the diploid cell formed by fertilisation'],['acrosome','enzymes that digest the ovum layers'],['zona pellucida','jelly layer around the ovum'],['haploid (n)','half the chromosome number'],['diploid (2n)','full chromosome number']])}` },
  reteach:{ h:'The funnel: from millions of sperm to one zygote', b:`
<p>Recap: a sperm and an ovum are <b>haploid</b> gametes (n), made by meiosis.</p>
<p>See fertilisation as a funnel that narrows at every stage.</p>
${flow(['Millions of sperm deposited in the vagina','Many lost or killed in the vagina and cervix','A few hundred reach the fallopian tube','One sperm fertilises the ovum'],{hi:3})}
${hrwk([
 'Check the chromosome number with a different species: a mouse.',
 'A mouse body cell has 40 chromosomes (2n = 40).',
 'Its sperm and ova are haploid: 40 &divide; 2 = 20 chromosomes each.',
 'After fusion the zygote has 20 + 20 = 40 chromosomes.'],
 'The zygote has the same number as a body cell: 40 in a mouse.')}
${hrrule('The funnel narrows at every stage. The ovum then makes sure that <b>only one</b> sperm gets in, so the zygote has exactly 2n chromosomes, never more.')}
${keyterms([['fertilisation','sperm nucleus fuses with ovum nucleus'],['zygote','2n'],['fallopian tube','site of fertilisation'],['acrosome','cap on the sperm head that holds enzymes']])}` },
  qs:[
  {type:'text', stem:`In which structure of the female reproductive system does fertilisation normally take place?`,
   ans:'fallopian tube', anyCase:true, accept:['oviduct','the fallopian tube','fallopian tubes','uterine tube','tube','the oviduct','the tube','oviducts'], ph:'name the structure',
   hint:`The ovum is carried along this tube after ovulation.`,
   sol:hrsol(['After ovulation the ovum is swept into the <b>fallopian tube</b> (oviduct).','Sperm swim up and meet it there. The zygote then travels to the uterus.'],'Answer: fallopian tube')},
  {type:'num', stem:`The nucleus of a sperm cell has 23 chromosomes and the nucleus of an ovum has 23 chromosomes. How many chromosomes are in the nucleus of the <b>zygote</b> formed when they fuse?`, ans:46, unit:'chromosomes',
   hint:`Add the contributions of the two gametes.`,
   sol:hrsol(['The sperm contributes 23 and the ovum contributes 23.','23 + 23 = 46, the diploid number (2n).'],'Answer: 46')},
  {type:'order', stem:`Put these events of fertilisation in the correct order.`,
   items:['The sperm nucleus and the ovum nucleus fuse to form a zygote','Sperm swim up the fallopian tube','The sperm head fuses with the ovum membrane and the sperm nucleus enters','Acrosome enzymes digest the corona radiata and the zona pellucida'], ans:[4,1,3,2],
   hint:`Follow one sperm from entering the tube to the formation of the zygote.`,
   sol:hrsol(['1. Sperm swim up the fallopian tube.','2. Acrosome enzymes digest the corona radiata and zona pellucida.','3. The sperm head fuses with the ovum membrane and its nucleus enters.','4. The two nuclei fuse: a zygote forms.'],'Order: Swim up the tube, Digest the layers, Head fuses and nucleus enters, Nuclei fuse')},
  {type:'mc', stem:`Millions of sperm are released during intercourse, but only <b>one</b> sperm fertilises the ovum. Which is the best explanation for the large number?`,
   opts:[`Most sperm are lost on the way, and acrosome enzymes from many sperm help to open a path to the ovum`,`Each sperm carries only a fraction of a chromosome set, so many sperm must fuse to make a complete set`,`The ovum releases a signal that is only strong enough to attract sperm when millions are present`,`Sperm that reach the ovum first stop the others from moving, so the rest are not needed again`], ans:0,
   hint:`Think about what happens to most sperm before they reach the fallopian tube.`,
   sol:hrsol(['Most sperm are lost in the vagina and cervix, so very few reach the tube.','Enzymes from the acrosomes of many sperm help to digest the corona radiata and zona pellucida.','A single sperm carries a whole haploid set (n), not a fraction of one, so only one nucleus is needed.'],'Answer: Most sperm are lost on the way, and acrosome enzymes from many sperm help to open a path to the ovum')},
  {type:'mc', stem:`Why would fertilisation of an ovum by <b>two sperm</b> be a problem for the zygote?`,
   opts:[`The zygote would have more than 46 chromosomes, which would stop normal development`,`The zygote would have fewer than 46 chromosomes, as the nuclei would cancel out`,`The zygote would be haploid, because two sperm would divide the ovum nucleus in half`,`The zygote would not be able to implant, because the zona pellucida would be too thin`], ans:0,
   hint:`Count the chromosomes: ovum 23, each sperm 23.`,
   sol:hrsol(['The ovum contributes 23 and each sperm 23.','With two sperm: 23 + 23 + 23 = 69, more than the normal diploid 46.','An abnormal chromosome number prevents normal development.'],'Answer: The zygote would have more than 46 chromosomes, which would stop normal development')}
  ] },

/* ================= LEVEL 11 ================= */
{ id:11, name:'From zygote to implantation', short:'Zygote to implantation',
  teach:{ h:'The zygote divides as it travels, and the blastocyst embeds in the thick lining', b:`
<p>The zygote divides by <b>mitosis</b> while it moves along the fallopian tube. These divisions are called <b>cleavage</b>. The cells get smaller because the embryo does not grow in size during cleavage.</p>
${vis(timeline([{t:'Day 0',l:'Fertilisation in the tube: zygote'},{t:'Day 1 to 2',l:'Cleavage: 2 then 4 cells'},{t:'Day 3 to 4',l:'Morula: a solid ball of cells'},{t:'Day 5',l:'Blastocyst: a hollow ball of cells'},{t:'Day 6 to 7',l:'Implantation in the endometrium'}]), 'Days after fertilisation')}
${hrwk([
 'Each cleavage division doubles the number of cells.',
 'After 1 division there are 2 cells, after 2 divisions 4 cells, after 3 divisions 8 cells.',
 'The number of cells = 2 to the power of the number of divisions (2<sup>n</sup>).'],
 'After 3 cleavage divisions there are 2 &times; 2 &times; 2 = 8 cells.')}
${hrrule('The blastocyst <b>implants</b> in the endometrium about <b>6 to 7 days</b> after fertilisation. The endometrium must be thick and rich in blood vessels. Progesterone from the corpus luteum keeps it that way.')}
${hrtrap('Implantation takes place in the <b>uterus</b>, not in the fallopian tube. Fertilisation is in the tube; implantation is in the endometrium.')}
${keyterms([['cleavage','the first mitotic divisions of the zygote'],['morula','solid ball of cells'],['blastocyst','hollow ball of cells that implants'],['implantation','embedding in the endometrium'],['endometrium','lining that receives the blastocyst'],['mitosis','division that keeps the chromosome number']])}` },
  reteach:{ h:'A table of stage, place and day', b:`
<p>Link every stage to where it is and when it happens.</p>
${dataTable(['Stage','Where it is','Days after fertilisation'],[
 ['Zygote','Fallopian tube','0'],
 ['Two-cell and four-cell embryo','Fallopian tube','1 to 2'],
 ['Morula (solid ball)','Moving into the uterus','3 to 4'],
 ['Blastocyst (hollow ball)','Free in the uterus','5'],
 ['Implanted embryo','Embedded in the endometrium','6 to 7']],{w:560})}
${hrwk([
 'Fertilisation takes place at ovulation, on day 14 of the menstrual cycle.',
 'Implantation is 7 days later: 14 + 7 = day 21 of the cycle.',
 'On day 21 progesterone is high and the endometrium is thick, which is ideal for implantation.'],
 'Implantation is on day 21 of the cycle, when the endometrium is at its best.')}
${hrrule('Cell number doubles at each division: <b>1, 2, 4 ...</b> and every cell is genetically identical, because cleavage is mitosis.')}
${keyterms([['zygote','day 0'],['morula','solid ball'],['blastocyst','hollow ball'],['implantation','day 6 to 7'],['progesterone','keeps the lining thick']])}` },
  qs:[
  {type:'order', stem:`Put the stages of early development in the correct order, starting with fertilisation.`,
   items:['Blastocyst','Zygote','Implantation in the endometrium','Morula','Two-cell embryo'], ans:[4,1,5,3,2],
   hint:`Follow one embryo from fertilisation to embedding.`,
   sol:hrsol(['1. Zygote','2. Two-cell embryo (first cleavage)','3. Morula, a solid ball of cells','4. Blastocyst, a hollow ball of cells','5. Implantation in the endometrium'],'Order: Zygote, Two-cell embryo, Morula, Blastocyst, Implantation')},
  {type:'num', stem:`A zygote undergoes <b>5</b> cleavage divisions by mitosis, and each division doubles the number of cells. How many cells are there after the 5 divisions?`, ans:32, unit:'cells',
   hint:`Double the number of cells five times, starting from 1.`,
   sol:hrsol(['After 1 division: 2. After 2: 4. After 3: 8. After 4: 16. After 5: 32.','Or 2<sup>5</sup> = 32.'],'Answer: 32')},
  {type:'num', stem:`Implantation begins about 6 days after fertilisation. Fertilisation occurred on 12 June. On which date in June does implantation begin?`, ans:18, unit:'June',
   hint:`Add 6 days to the date of fertilisation.`,
   sol:hrsol(['12 + 6 = 18.'],'Answer: 18 June')},
  {type:'mc', stem:`Implantation repeatedly fails in a woman whose corpus luteum secretes <b>too little progesterone</b>. Which is the best explanation?`,
   opts:[`The endometrium is too thin and poorly supplied with blood for the blastocyst to embed and be fed`,`The blastocyst cannot divide by mitosis, because progesterone is needed for cell division in the embryo`,`The sperm cannot reach the ovum, because progesterone is needed to move them up the fallopian tube`,`The zona pellucida is not digested, because progesterone supplies the enzymes in the acrosome`], ans:0,
   hint:`What does progesterone do to the lining?`,
   sol:hrsol(['Progesterone maintains and thickens the endometrium.','With too little progesterone the lining is thin, so the blastocyst cannot embed and be nourished.','Progesterone does not control mitosis or sperm movement, and the acrosome enzymes are made by the sperm.'],'Answer: The endometrium is too thin and poorly supplied with blood for the blastocyst to embed and be fed')},
  {type:'mc', stem:`Read the two statements.<br><b>Statement 1:</b> Cleavage divisions are mitosis, and the cells become smaller because the embryo does not grow in size during cleavage.<br><b>Statement 2:</b> Implantation takes place in the endometrium of the uterus, about 7 days after fertilisation.<br>Which option is correct?`,
   opts:[`Statement 1 only`,`Statement 2 only`,`Both statements are correct`,`Neither statement is correct`], ans:2,
   hint:`Check the type of division, and where the blastocyst embeds.`,
   sol:hrsol(['Statement 1 is true: cleavage is mitosis without growth, so the cells get smaller.','Statement 2 is true: the blastocyst embeds in the endometrium of the uterus at about 6 to 7 days.'],'Answer: Both statements are correct')}
  ] },

/* ================= LEVEL 12 ================= */
{ id:12, name:'Placenta, umbilical cord and amnion', short:'Placenta and cord',
  teach:{ h:'The placenta exchanges materials between the blood of mother and foetus without mixing it', b:`
<p>After implantation the <b>placenta</b> forms from the chorion of the embryo and the endometrium of the mother. It joins the foetus to the mother through the <b>umbilical cord</b>.</p>
${vis(hrPlac({labels:'all'}), 'Uterus in late pregnancy (schematic)')}
${cards([
 {t:'Placenta', d:'Exchange of oxygen, nutrients and wastes by diffusion across thin membranes. Villi give a large surface area. It also secretes progesterone and oestrogen, and after about three months it takes over progesterone secretion from the corpus luteum.', hi:true},
 {t:'Umbilical cord', d:'Two umbilical arteries carry oxygen-poor blood and wastes from the foetus to the placenta. One umbilical vein carries oxygen-rich blood and nutrients to the foetus.'},
 {t:'Amnion and amniotic fluid', d:'The amnion is a membrane forming a sac. The fluid cushions the foetus against shock, keeps the temperature steady and lets it move.'}
],{min:200})}
${hrwk([
 'Question: Explain why the blood of the mother and the blood of the foetus do not mix in the placenta. (2 marks)',
 'The mother\'s blood pressure is higher and could burst the thin capillaries of the foetus (1 mark).',
 'The two may have different blood groups, so mixing could cause clumping (1 mark).'],
 'Separate blood supplies are protected: exchange is by diffusion across the membrane, not by mixing.')}
${hrrule('Moves <b>from mother to foetus</b>: oxygen, glucose, amino acids, antibodies. Moves <b>from foetus to mother</b>: carbon dioxide and urea. The placenta is <b>not</b> a perfect barrier: alcohol, nicotine, many drugs and some viruses (for example HIV and rubella) can cross.')}
${hrtrap('Blood does not flow from the mother into the foetus. Substances <b>diffuse</b> across the membranes between two separate blood supplies.')}
${keyterms([['placenta','organ of exchange between mother and foetus'],['umbilical cord','joins foetus to placenta: 2 arteries, 1 vein'],['umbilical vein','oxygen-rich blood to the foetus'],['umbilical arteries','oxygen-poor blood to the placenta'],['amnion','membrane of the amniotic sac'],['amniotic fluid','cushions the foetus'],['diffusion','movement from high to low concentration']])}` },
  reteach:{ h:'Follow the foetal blood round one circuit', b:`
<p>Trace the blood of the foetus on its round trip to the placenta and back.</p>
${flow(['Foetus: blood carrying carbon dioxide and urea leaves','Two umbilical arteries carry it to the placenta','Placenta: wastes diffuse out, oxygen and nutrients diffuse in','One umbilical vein carries the blood back to the foetus'],{hi:2})}
${hrwk([
 'Where does oxygen diffuse, and why?',
 'The mother\'s blood in the placenta has a high concentration of oxygen. The foetal blood arriving through the arteries has a low concentration.',
 'Oxygen diffuses from high to low concentration, so it moves from the mother\'s blood into the foetal blood.'],
 'Oxygen moves down its concentration gradient from mother to foetus.')}
${hrrule('The cord has <b>three</b> vessels: arteries take blood <b>away from the foetus</b>, the vein brings blood <b>to the foetus</b>. The names follow the direction of the blood flow (away from or towards the heart of the foetus), not its oxygen content.')}
${vis(hrPlac({labels:'all'}), 'Uterus in late pregnancy (schematic)')}
${keyterms([['villi','folds that give the placenta a large surface area'],['umbilical arteries','away from the foetus, oxygen-poor'],['umbilical vein','to the foetus, oxygen-rich'],['diffusion','high to low concentration'],['placenta','exchange site']])}` },
  qs:[
  {type:'text', stem:`Write the <b>letter</b> that labels the placenta.`,
   v:vis(hrPlac({labels:['cord','amnion','placenta','wall','fluid'], letters:true}), 'Uterus in late pregnancy'),
   ans:'C', anyCase:true, accept:['letter C','c.','C.'], ph:'a letter',
   hint:`It is the dark red disc attached to the uterine wall, joined to the foetus by the cord.`,
   sol:hrsol(['The placenta is the dark red organ attached to the wall of the uterus.','It is letter C. A is the umbilical cord, B the amnion, D the uterine wall and E the amniotic fluid.'],'Answer: C')},
  {type:'mc', stem:`How does the blood in the <b>umbilical vein</b> differ from the blood in the umbilical arteries?`,
   opts:[`It contains more oxygen and nutrients and less carbon dioxide and urea`,`It contains less oxygen and nutrients and more carbon dioxide and urea`,`It contains more oxygen but also more urea, because the mother's wastes are added`,`It contains the same substances, but it flows at a lower pressure than in the arteries`], ans:0,
   hint:`The vein carries blood from the placenta to the foetus.`,
   sol:hrsol(['The umbilical vein brings blood <b>from the placenta</b> to the foetus: it has just picked up oxygen and nutrients and lost carbon dioxide and urea.','The arteries carry the foetus\'s used blood to the placenta.'],'Answer: It contains more oxygen and nutrients and less carbon dioxide and urea')},
  {type:'num', stem:`How many blood vessels are there in the umbilical cord in total (arteries and veins together)?`, ans:3, unit:'vessels',
   hint:`Add the arteries and the vein.`,
   sol:hrsol(['The cord has 2 umbilical arteries and 1 umbilical vein.','2 + 1 = 3.'],'Answer: 3')},
  {type:'mc', stem:`A pregnant woman drinks alcohol. Which statement is correct?`,
   opts:[`Alcohol crosses the placenta by diffusion and can harm the normal development of the foetus`,`Alcohol is blocked by the placenta, because the placenta acts as a barrier to most harmful drugs`,`Alcohol is unlikely to reach the foetus, because the blood of the mother and foetus is kept separate`,`Alcohol is mostly broken down by the amniotic fluid, so little enters the foetal blood`], ans:0,
   hint:`The placenta is not a complete barrier.`,
   sol:hrsol(['Alcohol, nicotine and many drugs diffuse across the placenta.','The blood supplies do not mix, but they lie close enough for diffusion. The amniotic fluid does not destroy alcohol.'],'Answer: Alcohol crosses the placenta by diffusion and can harm the normal development of the foetus')},
  {type:'mc', stem:`Read the two statements about the placenta.<br><b>Statement 1:</b> The placenta has a large surface area and thin membranes, so exchange by diffusion is efficient.<br><b>Statement 2:</b> The blood of the mother and the foetus mixes in the placenta, so substances can pass without crossing a membrane.<br>Which option is correct?`,
   opts:[`Statement 1 only`,`Statement 2 only`,`Both statements`,`Neither statement`], ans:0,
   hint:`Does the blood of the mother flow into the foetus?`,
   sol:hrsol(['Statement 1 is true: villi give a large surface area and the membranes are thin.','Statement 2 is false: the two blood supplies stay separate and substances cross membranes by diffusion.'],'Answer: Statement 1 only')}
  ] },

/* ================= LEVEL 13 ================= */
{ id:13, name:'Gestation and birth', short:'Gestation and birth',
  teach:{ h:'Pregnancy lasts about nine months, and oxytocin drives labour through positive feedback', b:`
<p><b>Gestation</b> (pregnancy) lasts about <b>38 to 40 weeks</b>, roughly nine months. It is divided into three <b>trimesters</b> of about three months each. Counted from the first day of the last period it is about 40 weeks; counted from fertilisation it is about two weeks shorter.</p>
${cards([
 {t:'First trimester', d:'The embryo becomes a foetus at about 8 weeks. The organs form, so harmful substances can do the most damage.'},
 {t:'Second trimester', d:'The foetus grows and the mother can feel it move.'},
 {t:'Third trimester', d:'Rapid growth and weight gain. The lungs mature, ready for breathing air.'}
],{min:200})}
<p>Birth (labour) is controlled by the hormone <b>oxytocin</b>, released by the pituitary gland. It makes the muscle of the uterus contract. This is <b>positive feedback</b>: the change is made bigger, not reversed.</p>
${vis(cycle(['Baby\'s head presses on the cervix','Nerve impulses to the brain','Pituitary releases oxytocin','Uterine contractions get stronger'],{title:'Positive feedback in labour'}), 'The loop repeats until the baby is born')}
${hrwk([
 'Check the length of gestation in days.',
 'About 40 weeks &times; 7 days = 280 days.',
 'Three trimesters of about 3 months each: 3 &times; 3 = 9 months in total.'],
 'About 280 days, which is about nine months.')}
${hrrule('Stages of birth: contractions open (dilate) the <b>cervix</b>; the baby is pushed out through the vagina; the cord is cut; the <b>placenta</b> is expelled (the afterbirth).')}
${hrtrap('Do not call labour negative feedback. In negative feedback the change is <b>reversed</b>; here pressure on the cervix causes oxytocin, which strengthens the contractions and so increases the pressure.')}
${keyterms([['gestation','the length of pregnancy, about 38 to 40 weeks'],['trimester','one of three periods of about three months'],['oxytocin','makes the uterus contract in labour'],['positive feedback','the change is increased'],['dilation','opening of the cervix'],['afterbirth','the placenta expelled after the baby']])}` },
  reteach:{ h:'Compare positive and negative feedback, and place the weeks on a timeline', b:`
<p>First, the difference between the two kinds of feedback:</p>
${contrast('Negative feedback (for example blood glucose)','Positive feedback (labour)',[
 ['A change is detected and the response <b>reverses</b> it','A change is detected and the response <b>increases</b> it'],
 ['Keeps a level steady','Drives a process to its end'],
 ['Insulin lowers glucose, which stops insulin release','Each response feeds the next step of labour, so the process speeds up'],
 ['Continues all the time','Stops when the baby is born and the pressure is gone']])}
${vis(timeline([{t:'Week 0',l:'First day of the last period'},{t:'Week 13',l:'End of the first trimester'},{t:'Week 27',l:'End of the second trimester'},{t:'Week 40',l:'Birth expected'}]), 'The three trimesters counted from the first day of the last period')}
${hrwk([
 'The labour hormone is also given as a drug to start labour in hospital when a pregnancy is overdue.',
 'The drug makes the uterine muscle contract, and the contractions then increase the natural loop.',
 'Once the baby is delivered the pressure on the cervix is gone and the loop stops.'],
 'Labour ends because the stimulus (the baby pressing on the cervix) disappears at birth.')}
${hrrule('Positive feedback has to be <b>switched off by an event</b> (here, birth). Negative feedback switches itself off as the level returns to normal.')}
${keyterms([['oxytocin','labour hormone'],['positive feedback','change increases'],['negative feedback','change reversed'],['gestation','length of pregnancy, about nine months']])}` },
  qs:[
  {type:'text', stem:`Name the hormone, released by the pituitary gland, that causes the muscles of the uterus to contract during birth.`,
   ans:'oxytocin', anyCase:true, accept:['oxytocin hormone','oxytoxin','oxytocyn'], ph:'one word',
   hint:`It also helps milk to be released during breastfeeding.`,
   sol:hrsol(['The pituitary gland releases <b>oxytocin</b>, which causes the uterus to contract and so drives labour.'],'Answer: oxytocin')},
  {type:'num', stem:`Gestation is about 40 weeks when counted from the first day of the last period. Fertilisation happens at ovulation on day 14 of the cycle. How many weeks after <b>fertilisation</b> is the baby born?`, ans:38, unit:'weeks',
   hint:`Convert the 14 days to weeks and subtract.`,
   sol:hrsol(['14 days = 2 weeks.','Weeks after fertilisation = 40 &minus; 2 = 38.'],'Answer: 38')},
  {type:'mc', stem:`Why is the control of labour an example of <b>positive</b> feedback?`,
   opts:[`Pressure on the cervix causes more oxytocin, which strengthens contractions, until the baby is born`,`Oxytocin makes the contractions weaker, so the uterus slowly returns to its original size and shape`,`Rising progesterone during labour reverses the effect of oxytocin and keeps contractions steady`,`The cervix opens once, and the pituitary gland then stops releasing oxytocin for the rest of labour`], ans:0,
   hint:`Does the response reverse the change or add to it?`,
   sol:hrsol(['Pressure of the baby on the cervix causes oxytocin release, which strengthens contractions, which increases the pressure again.','The change is made bigger, so it is positive feedback. It stops when the baby is born.'],'Answer: Pressure on the cervix causes more oxytocin, which strengthens contractions, until the baby is born')},
  {type:'order', stem:`Put these stages of birth in the correct order.`,
   items:['The baby is pushed out through the vagina','The placenta and membranes are expelled','Strong contractions open the cervix wide'], ans:[2,3,1],
   hint:`Follow one birth from the first contractions to the end of labour.`,
   sol:hrsol(['1. Contractions dilate (open) the cervix.','2. The baby is pushed out through the vagina.','3. The placenta and membranes are expelled (the afterbirth).'],'Order: Cervix opens, Baby delivered, Placenta expelled')},
  {type:'mc', stem:`A pregnant woman is advised to avoid alcohol and certain drugs, <b>especially in the first trimester</b>. Which is the best reason?`,
   opts:[`The organs are forming, so harmful substances crossing the placenta can cause serious defects`,`The placenta is still forming, so the foetus is more exposed to what is in her blood`,`The foetus is largest in the first trimester, so it takes in far more of the substance than later`,`The amniotic fluid is thinnest in the first trimester, so it dilutes harmful substances less`], ans:0,
   hint:`What is developing most rapidly in the first trimester?`,
   sol:hrsol(['In the first trimester the organs and organ systems form.','Harmful substances such as alcohol cross the placenta, so they can cause serious malformations at this stage.','The foetus is smallest, not largest, in the first trimester, and the placenta is forming by then.'],'Answer: The organs are forming, so harmful substances crossing the placenta can cause serious defects')}
  ] },

/* ================= LEVEL 14 ================= */
{ id:14, name:'Contraception', short:'Contraception',
  teach:{ h:'Each contraceptive blocks a different step on the way to a pregnancy', b:`
<p>Contraception prevents pregnancy. Methods are grouped by <b>how</b> they work.</p>
${contrast3(['Type','Examples','How it works'],[
 ['Barrier','Condom (male or female), diaphragm','A physical barrier stops sperm reaching the ovum. A condom also protects against STIs.'],
 ['Hormonal','Pill, injection, implant','Hormones (oestrogen and progesterone, or progesterone only) stop ovulation. This is the main action.'],
 ['IUD','Copper or hormonal device placed in the uterus','Prevents fertilisation or implantation.'],
 ['Sterilisation','Vasectomy, tubal ligation','Permanently blocks the vas deferens or the fallopian tubes.'],
 ['Natural','Rhythm method, withdrawal','Avoid intercourse around ovulation or withdraw before ejaculation. Unreliable.'],
 ['Emergency','Emergency pill','Taken within 72 hours after unprotected sex. Not for regular use.']])}
${hrwk([
 'Question: A woman has a small rod placed under the skin of her arm that slowly releases progesterone for three years. Classify the method and give one way it works. (2 marks)',
 'It is a hormonal method (an implant) (1 mark).',
 'The hormone inhibits the release of FSH and LH, so ovulation does not occur (1 mark).'],
 'Hormonal: the implant stops ovulation.')}
${hrrule('<b>The pill:</b> the hormones in the pill keep the oestrogen and progesterone levels high all month. High levels <b>inhibit FSH and LH</b> by negative feedback, so no follicle matures and there is no LH surge: <b>no ovulation</b>. Because the levels stay steady, there is no mid-cycle peak of oestrogen to trigger an LH surge.')}
${hrtrap('Only <b>condoms</b> also protect against STIs, including HIV. The pill, injection, implant, IUD and sterilisation do <b>not</b>.')}
${keyterms([['contraception','prevention of pregnancy'],['barrier method','stops sperm meeting the ovum'],['hormonal method','prevents ovulation'],['IUD','intrauterine device'],['vasectomy','vas deferens cut and tied'],['tubal ligation','fallopian tubes cut and tied'],['STI','sexually transmitted infection']])}` },
  reteach:{ h:'Ask where on the route each method acts', b:`
<p>Recap: a high level of a hormone can inhibit FSH and LH by negative feedback, as progesterone does in the luteal phase.</p>
<p>Follow the route from ovulation to implantation and mark where each method blocks it.</p>
${chain(['<b>Before ovulation:</b> pill, injection and implant stop the ovum being released','<b>Sperm meets ovum:</b> condom and diaphragm stop sperm entering; vasectomy blocks the vas deferens and tubal ligation blocks the fallopian tubes','<b>Fertilisation:</b> the IUD makes the uterus and tubes unfavourable','<b>Implantation:</b> the IUD can also stop a blastocyst embedding'],{hi:0})}
${hrwk([
 'A couple use withdrawal as contraception. Why is it unreliable?',
 'A small number of sperm can be released before ejaculation, so sperm may already be in the vagina.',
 'It also depends on perfect timing every time.'],
 'Natural methods depend on perfect timing, so they are the least reliable.')}
${hrrule('Sort any method by what it does: <b>stops the ovum being released</b> (hormones), <b>keeps gametes apart</b> (barrier, sterilisation) or <b>stops implantation</b> (IUD).')}
${keyterms([['pill','prevents ovulation'],['condom','barrier, also STI protection'],['IUD','prevents implantation'],['sterilisation','permanent'],['natural methods','least reliable']])}` },
  qs:[
  {type:'text', stem:`Name the type of contraceptive that also reduces the risk of infection with STIs such as HIV.`,
   ans:'condom', anyCase:true, accept:['condoms','male condom','female condom','the condom'], ph:'one word',
   hint:`It is a barrier worn during intercourse.`,
   sol:hrsol(['A condom forms a barrier that also stops the body fluids that carry infection.','The pill, injection, implant and IUD do not protect against STIs.'],'Answer: condom')},
  {type:'mc', stem:`A woman has a <b>tubal ligation</b>. Which is the correct description of what this does?`,
   opts:[`Both fallopian tubes are cut and tied or blocked, so ovum and sperm cannot meet`,`Both ovaries are removed, so no ova are produced and her hormone levels fall`,`The lining of the uterus is removed, so a blastocyst cannot embed in the uterus`,`Both vasa deferentia are cut and tied, so sperm cannot travel to the urethra`], ans:0,
   hint:`Which tube carries the ovum, and where do sperm and ovum meet?`,
   sol:hrsol(['In a tubal ligation the fallopian tubes are cut and tied, so the ovum cannot meet the sperm.','The ovaries stay and keep secreting hormones. Removing the lining is not what this does, and cutting the vasa deferentia is a vasectomy, which is done in men.'],'Answer: Both fallopian tubes are cut and tied or blocked, so ovum and sperm cannot meet')},
  {type:'mc', stem:`Explain how the combined contraceptive <b>pill</b> prevents pregnancy.`,
   opts:[`High oestrogen and progesterone inhibit FSH and LH, so no follicle matures and none ovulates`,`It makes the corpus luteum break down early, so the lining is shed before an embryo can implant`,`It raises the FSH level, so several follicles develop and the ova are too small to be fertilised`,`It kills the sperm in the vagina, so none reach the cervix and the ovum cannot be fertilised`], ans:0,
   hint:`Think about the negative feedback of oestrogen and progesterone on the pituitary.`,
   sol:hrsol(['The pill contains oestrogen and progesterone, so levels stay high.','High levels inhibit FSH and LH by negative feedback, so no follicle develops fully and there is no LH surge.','Without ovulation there is no ovum to fertilise.'],'Answer: High oestrogen and progesterone inhibit FSH and LH, so no follicle matures and none ovulates')},
  {type:'text', stem:`Name the contraceptive device that is placed inside the uterus and prevents fertilisation or implantation. Give the abbreviation or the full name.`,
   ans:'IUD', anyCase:true, accept:['intrauterine device','intra-uterine device','intra uterine device','copper IUD','coil','the coil','IUCD','iud','intrauterine contraceptive device','hormonal IUD','intrauterine','IUD (intrauterine device)','intra-uterine contraceptive device'], ph:'abbreviation or full name',
   hint:`The letters stand for intrauterine device.`,
   sol:hrsol(['A small device placed in the uterus is an <b>IUD</b> (intrauterine device).'],'Answer: IUD')},
  {type:'mc', stem:`The graph shows the LH and FSH levels of a woman who takes the contraceptive pill for 28 days. Which conclusion is supported by the graph?`,
   v:vis(hrGraph([{n:'FSH',pts:HR_FSH_PILL,c:1},{n:'LH',pts:HR_LH_PILL,c:2}]), 'FSH and LH while taking the pill'),

/* ==========================================================
   ENGINE
   ========================================================== */
const app = document.getElementById('app');
const stepsEl = document.getElementById('steps');
const lvlNumEl = document.getElementById('lvlNum');
const lvlNameEl = document.getElementById('lvlName');
const scoreLblEl = document.getElementById('scoreLbl');
const stripEl = document.getElementById('strip');

const S = {
  name:'',
  li:0,
  pending:[],          // stack of levels to come back to
  qIdx:LEVELS.map(function(){return 0;}),
  seen:LEVELS.map(function(){return false;}),
  stats:LEVELS.map(function(l){return {asked:0,correct:0,wrong:0,reteaches:0,reached:false};}),
  totalQ:0, totalC:0,
  t0:Date.now(),
  cur:null,            // current question object
  sel:null,            // selected mc index
  tries:0,
  ended:false
};

/* ---------- strip ---------- */
function buildStrip(){
  stepsEl.innerHTML = LEVELS.map(function(l,i){return '<div class="step" id="st'+i+'"></div>';}).join('');
  var t=document.getElementById('lvlTot'); if(t) t.textContent = LEVELS.length;
}
function paintStrip(){
  LEVELS.forEach(function(l,i){
    const el=document.getElementById('st'+i); if(!el) return;
    el.className='step';
    if(i===S.li && !S.ended) el.classList.add('now');
    else if(S.stats[i].wrong>0) el.classList.add('stumble');
    else if(S.stats[i].correct>0) el.classList.add('done');
  });
  lvlNumEl.textContent = S.li+1;
  lvlNameEl.textContent = LEVELS[S.li].short;
  scoreLblEl.textContent = S.totalC+' / '+S.totalQ+' correct';
}

/* ---------- small builders ---------- */
function card(inner){ return '<section class="card">'+inner+'</section>'; }
function band(html){ return '<div class="band">'+html+'</div>'; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function scrollTop(){ window.scrollTo({top:0,behavior:'smooth'}); }

/* ==========================================================
   SCREENS
   ========================================================== */
function screenStart(){
  stripEl.classList.add('hide');
  app.innerHTML = card(
    '<p class="eyebrow">IEB Grade 12 Life Sciences · Life processes</p>'+
    '<h1>The Human Reproduction Ladder</h1>'+
    '<p class="sub">Sixteen levels, from the male and female systems up to reading a hormone graph and explaining the menstrual cycle at exam standard.</p>'+
    '<p>Each level teaches one idea, then asks you a question about it.</p>'+
    '<div class="callout"><span class="lbl">How this works</span>'+
    '<p>Get it right and you climb to the next level. <b>Get it wrong and you drop back one level</b> &mdash; where the idea is explained a <b>different way</b>, with a <b>different example</b>. Once that clicks, you climb straight back up and carry on.</p>'+
    '<p>Nothing is timed, and there is no penalty for dropping back. That is how the ladder is meant to work.</p></div>'+
    '<h3>What is your name?</h3>'+
    '<div class="inputrow"><input type="text" class="wide" id="nameIn" placeholder="Your name" autocomplete="off"></div>'+
    '<div class="btnrow"><button class="primary" id="goBtn">Start at Level 1</button></div>'
  );
  const inp=document.getElementById('nameIn');
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') start(); });
  document.getElementById('goBtn').onclick = start;
  function start(){
    S.name = (inp.value||'').trim();
    S.t0 = Date.now();
    stripEl.classList.remove('hide');
    screenTeach(false);
  }
}

function screenTeach(isRe){
  const L = LEVELS[S.li];
  S.stats[S.li].reached = true;
  if(isRe) S.stats[S.li].reteaches++;
  S.seen[S.li]=true;
  const t = isRe ? L.reteach : L.teach;
  let head='';
  if(isRe){
    head = band('<b>Let us try that a different way.</b> Same idea, new explanation, new example. Take your time &mdash; there is no rush and nothing is being marked.');
  }
  app.innerHTML = head + card(
    '<p class="eyebrow">Level '+(S.li+1)+' of '+LEVELS.length+' &middot; '+esc(L.name)+(isRe?' &middot; second look':'')+'</p>'+
    '<h2>'+t.h+'</h2>'+
    '<div style="margin-top:14px">'+t.b+'</div>'+
    '<div class="btnrow"><button class="primary" id="qBtn">'+(isRe?'Try a new question':'Try a question')+'</button></div>'
  ) + endLink();
  document.getElementById('qBtn').onclick = function(){ screenQuestion(); };
  wireEnd();
  paintStrip(); scrollTop();
}

function endLink(){
  return '<div style="text-align:center;margin-top:18px"><button class="link" id="endBtn">End the session and see my report</button></div>';
}
function wireEnd(){
  const b=document.getElementById('endBtn');
  if(b) b.onclick=function(){ if(confirm('End the session now and see the progress report?')) screenReport(); };
}

function screenQuestion(){
  const L = LEVELS[S.li];
  const q = L.qs[ S.qIdx[S.li] % L.qs.length ];
  S.qIdx[S.li]++;
  S.cur = q; S.sel = null; S.tries = 0;

  let body = '<p class="eyebrow">Level '+(S.li+1)+' &middot; '+esc(L.short)+'</p>';
  body += '<div class="qtext">'+q.stem+'</div>';
  if(q.v) body += q.v;
  body += answerUI(q);
  body += '<div class="btnrow"><button class="primary" id="checkBtn">Check my answer</button>'+
          '<button class="ghost" id="hintBtn">Show me a hint</button></div>'+
          '<div id="hintBox"></div><div id="fb"></div>';

  app.innerHTML = card(body) + endLink();

  document.getElementById('checkBtn').onclick = check;
  document.getElementById('hintBtn').onclick = function(){
    document.getElementById('hintBox').innerHTML =
      '<div class="fb nudge"><div class="hd">Hint</div><p>'+esc(q.hint)+'</p></div>';
    this.disabled=true; this.style.opacity=.5;
  };
  if(q.type==='mc'){
    Array.prototype.forEach.call(document.querySelectorAll('button.opt'),function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll('button.opt'),function(x){x.classList.remove('sel');});
        b.classList.add('sel'); S.sel=parseInt(b.dataset.i,10);
      };
    });
  } else {
    Array.prototype.forEach.call(document.querySelectorAll('.ansIn'),function(i){
      i.addEventListener('keydown',function(e){ if(e.key==='Enter') check(); });
    });
    const first=document.querySelector('.ansIn'); if(first) first.focus();
  }
  wireEnd();
  paintStrip(); scrollTop();
}

function answerUI(q){
  if(q.type==='mc'){
    return '<div class="opts">'+q.opts.map(function(o,i){
      return '<button class="opt" data-i="'+i+'">'+o+'</button>';
    }).join('')+'</div>';
  }
  if(q.type==='frac'){
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<span class="fracinput"><input type="text" class="ansIn" id="inN" inputmode="numeric" aria-label="numerator">'+
      '<span class="rule"></span>'+
      '<input type="text" class="ansIn" id="inD" inputmode="numeric" aria-label="denominator"></span></div>';
  }
  if(q.type==='order'){
    return '<div style="margin:14px 0">'+q.items.map(function(t,i){
      return '<div class="orderrow"><input type="text" class="ansIn" id="inO'+i+'" inputmode="numeric" aria-label="position of item '+String.fromCharCode(65+i)+'">'+
             '<div class="txt"><b>'+String.fromCharCode(65+i)+'.</b> '+t+'</div></div>';
    }).join('')+'</div><div style="font-size:13.5px;color:#6E6F72">Number the boxes <b>1</b> to <b>'+q.items.length+'</b> to show the correct order.</div>';
  }
  if(q.type==='text'){
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<input type="text" class="ansIn" id="inT" style="width:190px;text-align:left;font-size:19px" '+
      'autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="'+(q.ph||'')+'" aria-label="answer">'+
      '</div>';
  }
  if(q.type==='coeff'){
    var i=0, out='<div class="coeffrow">';
    q.parts.forEach(function(p){
      if(p==='+'){ out+='<span class="plus">+</span>'; return; }
      if(p==='->'){ out+='<span class="arrow">&rarr;</span>'; return; }
      out+='<input type="text" class="ansIn" id="inC'+i+'" inputmode="numeric" aria-label="coefficient '+(i+1)+'">'+ch(p);
      i++;
    });
    return out+'</div><div style="font-size:13.5px;color:#6E6F72;margin-top:-6px">Put a number in every box. If a formula needs no multiplier, type <b>1</b>.</div>';
  }
  if(q.type==='ratio'){
    const three = q.ans.c!==undefined;
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<input type="text" class="ansIn" id="inA" inputmode="numeric" style="width:72px" aria-label="first number">'+
      '<span class="colon">:</span>'+
      '<input type="text" class="ansIn" id="inB" inputmode="numeric" style="width:72px" aria-label="second number">'+
      (three?'<span class="colon">:</span><input type="text" class="ansIn" id="inC" inputmode="numeric" style="width:72px" aria-label="third number">':'')+
      '</div>';
  }
  if(q.type==='mixed'){
    return '<div class="inputrow"><span class="unit">Answer:</span>'+
      '<input type="text" class="ansIn" id="inW" inputmode="numeric" aria-label="whole number" style="width:64px">'+
      '<span class="fracinput"><input type="text" class="ansIn" id="inN" inputmode="numeric" aria-label="numerator">'+
      '<span class="rule"></span>'+
      '<input type="text" class="ansIn" id="inD" inputmode="numeric" aria-label="denominator"></span></div>';
  }
  return '<div class="inputrow"><span class="unit">Answer:</span>'+
    (q.unit==='R'?'<span class="unit">R</span>':'')+
    '<input type="text" class="ansIn wide" id="inX" inputmode="decimal" aria-label="answer">'+
    (q.unit&&q.unit!=='R'?'<span class="unit">'+q.unit+'</span>':'')+'</div>';
}

/* ---------- reading + marking ---------- */
function readInt(id){
  const el=document.getElementById(id); if(!el) return null;
  const v=(el.value||'').trim().replace(/\s/g,'');
  if(!/^-?\d+$/.test(v)) return null;
  return parseInt(v,10);
}
function readNum(id){
  const el=document.getElementById(id); if(!el) return null;
  let v=(el.value||'').trim().replace(/\s/g,'').replace(/,/g,'.').replace(/^R/i,'').replace(/%$/,'');
  v=v.replace(/\/.*$/,'');                              /* "90km/h" -> "90km" */
  v=v.replace(/[A-Za-z\u2113\u00b0\u00b2\u00b3]+$/,'');   /* "44g", "36m²" -> the number */
  if(!/^-?\d*\.?\d+$/.test(v)) return null;
  return parseFloat(v);
}

function mark(q){
  /* returns {state:'right'|'wrong'|'nudge'|'blank', msg} */
  if(q.type==='mc'){
    if(S.sel===null) return {state:'blank'};
    if(S.sel===q.ans) return {state:'right'};
    if(q.nudge && q.nudge[S.sel]) return {state:'nudge', msg:q.nudge[S.sel]};
    return {state:'wrong'};
  }
  if(q.type==='frac'){
    const n=readInt('inN'), d=readInt('inD');
    if(n===null||d===null||d===0) return {state:'blank'};
    if(n===q.ans.n && d===q.ans.d) return {state:'right'};
    if(n*q.ans.d === q.ans.n*d){
      return {state:'nudge', msg:'The <b>value</b> is right, but it is not in its lowest terms yet. Divide the top and the bottom by the biggest number that goes into both, then check again.'};
    }
    return {state:'wrong'};
  }
  if(q.type==='mixed'){
    const w=readInt('inW'), n=readInt('inN'), d=readInt('inD');
    if(w===null||n===null||d===null||d===0) return {state:'blank'};
    if(w===q.ans.w && n===q.ans.n && d===q.ans.d) return {state:'right'};
    const mine=w + n/d, target=q.ans.w + q.ans.n/q.ans.d;
    if(Math.abs(mine-target)<1e-9){
      if(n>=d) return {state:'nudge', msg:'Close. The value is right, but the fraction part must be <b>less than one whole</b>. Carry the extra whole across into the whole-number box.'};
      return {state:'nudge', msg:'The <b>value</b> is right, but the fraction part is not in its lowest terms. Simplify it and check again.'};
    }
    return {state:'wrong'};
  }
  if(q.type==='ratio'){
    const three = q.ans.c!==undefined;
    const a=readInt('inA'), b=readInt('inB'), c=three?readInt('inC'):null;
    if(a===null||b===null||(three&&c===null)) return {state:'blank'};
    if(a<=0||b<=0||(three&&c<=0)) return {state:'wrong'};
    if(a===q.ans.a && b===q.ans.b && (!three || c===q.ans.c)) return {state:'right'};
    let equiv = (a*q.ans.b === b*q.ans.a);
    if(three) equiv = equiv && (a*q.ans.c === c*q.ans.a);
    if(equiv){
      return {state:'nudge', msg:'That ratio has the <b>right proportions</b>, but it is not in its simplest form yet. Divide every number by the biggest value that goes into all of them, then check again.'};
    }
    return {state:'wrong'};
  }
  if(q.type==='order'){
    const n=q.ans.length, got=[];
    for(let i=0;i<n;i++){
      const v=readInt('inO'+i);
      if(v===null) return {state:'blank'};
      got.push(v);
    }
    const seen={};
    let perm=true;
    for(let i=0;i<n;i++){ if(got[i]<1||got[i]>n||seen[got[i]]) perm=false; seen[got[i]]=1; }
    if(!perm) return {state:'nudge', msg:'Use each number from <b>1 to '+n+' exactly once</b> &mdash; one number per sentence, no repeats and none left out.'};
    let same=true; for(let i=0;i<n;i++) if(got[i]!==q.ans[i]) same=false;
    if(same) return {state:'right'};
    return {state:'wrong'};
  }
  if(q.type==='text'){
    const el=document.getElementById('inT'); if(!el) return {state:'blank'};
    const norm=function(t){
      return String(t)
        .replace(/\s+/g,'')
        .replace(/\u2212/g,'-')                 /* a real minus sign */
        .replace(/\u00d7|\u00b7/g,'*')          /* × or · */
        .replace(/\u00b2/g,'^2').replace(/\u00b3/g,'^3')
        .replace(/\*\*/g,'^')                   /* 3x**2 */
        .replace(/^(y'|f'\(x\)|dy\/dx)=/,'')    /* "y' = ..." */
        .replace(/^=/,'').replace(/[.,;]+$/,'')
        .replace(/(\d)\*(?=[a-zA-Z(])/g,'$1');  /* 3*x -> 3x */
    };
    /* anyCase:true marks the answer as a WORD, not a symbol. Capitals stop
       mattering and a leading article is ignored, so "Nucleus" and
       "the nucleus" are simply right. Leave it off for chemical formulae,
       element symbols, units and anything else where MgO and mgo differ. */
    const prose=function(t){
      return String(t).replace(/^\s*(the|a|an)\s+/i,'');
    };
    const raw=norm(q.anyCase?prose(el.value||''):(el.value||''));
    if(!raw) return {state:'blank'};
    const ok=[q.ans].concat(q.accept||[]).map(function(t){
      return norm(q.anyCase?prose(t):t);
    });
    for(let i=0;i<ok.length;i++) if(raw===ok[i]) return {state:'right'};
    if(q.anyCase){
      for(let i=0;i<ok.length;i++) if(raw.toLowerCase()===ok[i].toLowerCase()) return {state:'right'};
      return {state:'wrong'};
    }
    for(let i=0;i<ok.length;i++) if(raw.toLowerCase()===ok[i].toLowerCase()){
      return {state:'nudge', msg:(q.caseMsg||'You have the right symbols in the right order &mdash; check your <b>capital letters</b> and try again.')};
    }
    return {state:'wrong'};
  }
  if(q.type==='coeff'){
    const n=q.ans.length, got=[];
    for(let i=0;i<n;i++){
      const v=readInt('inC'+i);
      if(v===null||v<1) return {state:'blank'};
      got.push(v);
    }
    let same=true; for(let i=0;i<n;i++) if(got[i]!==q.ans[i]) same=false;
    if(same) return {state:'right'};
    const k=got[0]/q.ans[0];
    let mult = Number.isInteger(k) && k>1;
    if(mult) for(let i=0;i<n;i++) if(got[i]!==q.ans[i]*k) mult=false;
    if(mult) return {state:'nudge', msg:'That equation <b>is</b> balanced &mdash; but every coefficient can still be divided by '+k+'. An answer must use the <b>smallest whole numbers</b> that work. Divide them all by '+k+' and check again.'};
    return {state:'wrong'};
  }
  const x=readNum('inX');
  if(x===null) return {state:'blank'};
  return {state:(Math.abs(x-q.ans)<1e-9?'right':'wrong')};
}

function check(){
  const q=S.cur;
  const r=mark(q);
  const fb=document.getElementById('fb');

  if(r.state==='blank'){
    fb.innerHTML='<div class="fb nudge"><div class="hd">Nothing entered yet</div><p>'+
      (q.type==='mc'?'Tap one of the options first, then press <b>Check my answer</b>.':'Type a number into every box, then press <b>Check my answer</b>.')+'</p></div>';
    return;
  }
  if(r.state==='nudge'){
    fb.innerHTML='<div class="fb nudge"><div class="hd">Almost there</div><p>'+r.msg+'</p></div>';
    return; /* free retry, no penalty */
  }

  /* lock the inputs */
  Array.prototype.forEach.call(document.querySelectorAll('.ansIn'),function(i){i.disabled=true;});
  document.getElementById('checkBtn').disabled=true;
  const hb=document.getElementById('hintBtn'); if(hb){hb.disabled=true; hb.style.opacity=.5;}
  if(q.type==='mc'){
    Array.prototype.forEach.call(document.querySelectorAll('button.opt'),function(b){
      const i=parseInt(b.dataset.i,10); b.disabled=true; b.classList.remove('sel');
      if(i===q.ans) b.classList.add('right');
      else if(i===S.sel) b.classList.add('wrong');
    });
  }

  S.totalQ++; S.stats[S.li].asked++;

  if(r.state==='right'){
    S.totalC++; S.stats[S.li].correct++;
    onRight(fb);
  } else {
    S.stats[S.li].wrong++;
    onWrong(fb,q);
  }
  paintStrip();
}

function onRight(fb){
  const q=S.cur;
  const backTo = (S.pending.length && S.pending[S.pending.length-1] > S.li) ? S.pending[S.pending.length-1] : null;
  const last = (S.li === LEVELS.length-1);
  let msg, btn;

  if(backTo!==null){
    msg='<p>You have got that concept back. Now let us return to <b>Level '+(backTo+1)+' &mdash; '+esc(LEVELS[backTo].short)+'</b> and look at it a different way.</p>';
    btn='Back up to Level '+(backTo+1);
  } else if(last){
    msg='<p>That is the top of the ladder: full IEB Grade 12 standard on human reproduction. Well done.</p>';
    btn='See my report';
  } else {
    msg='<p>Next up: <b>Level '+(S.li+2)+' &mdash; '+esc(LEVELS[S.li+1].short)+'</b>.</p>';
    btn='Climb to Level '+(S.li+2);
  }

  fb.innerHTML='<div class="fb ok"><div class="hd">Correct'+(S.name?', '+esc(S.name):'')+'</div>'+
    '<div class="worked" style="background:#fff;border-style:solid"><span class="lbl">How it works out</span>'+q.sol+'</div>'+
    msg+'</div>'+
    '<div class="btnrow"><button class="primary" id="nextBtn">'+btn+'</button></div>';

  document.getElementById('nextBtn').onclick=function(){
    if(backTo!==null){
      S.pending.pop();
      S.li=backTo;
      screenTeach(true);          /* re-teach the failed concept a different way */
    } else if(last){
      screenReport();
    } else {
      S.li++;
      screenTeach(false);         /* first teaching of the new concept */
    }
  };
  scrollTop();
}

function onWrong(fb,q){
  const canDrop = S.li>0;
  const target = canDrop ? S.li-1 : 0;
  let msg,btn;

  if(canDrop){
    msg='<p>No problem &mdash; this usually means the step underneath needs shoring up. We are going back to <b>Level '+(target+1)+' &mdash; '+esc(LEVELS[target].short)+'</b>, where it will be explained a different way with a different example. Then we come straight back to this one.</p>';
    btn='Go back to Level '+(target+1);
  } else {
    msg='<p>This is the very first level, so there is nothing below it. Let us look at the same idea from a completely different angle instead.</p>';
    btn='Explain it differently';
  }

  fb.innerHTML='<div class="fb no"><div class="hd">Not quite</div>'+
    '<div class="worked" style="background:#fff;border-style:solid"><span class="lbl">The correct working</span>'+q.sol+'</div>'+
    msg+'</div>'+
    '<div class="btnrow"><button class="primary" id="nextBtn">'+btn+'</button></div>';

  document.getElementById('nextBtn').onclick=function(){
    if(canDrop){
      S.pending.push(S.li);   /* remember to come back and re-teach this one */
      S.li=target;
    }
    screenTeach(true);
  };
  scrollTop();
}

/* ==========================================================
   REPORT
   ========================================================== */
function screenReport(){
  S.ended=true;
  const mins = Math.max(1, Math.round((Date.now()-S.t0)/60000));
  const reached = S.stats.filter(function(s){return s.reached;}).length;
  const topLevel = S.stats.reduce(function(a,s,i){return s.correct>0?i+1:a;},0);
  const acc = S.totalQ? Math.round(100*S.totalC/S.totalQ):0;

  function status(s){
    if(!s.reached) return '<span class="pill nr">Not reached</span>';
    if(s.wrong===0 && s.correct>0) return '<span class="pill first">Secure</span>';
    if(s.wrong===1) return '<span class="pill re">Needed a re-teach</span>';
    if(s.wrong>1) return '<span class="pill hard">Needs more work</span>';
    return '<span class="pill nr">Started</span>';
  }
  function note(s,L){
    if(!s.reached) return 'Not covered in this session.';
    if(s.wrong===0 && s.correct>0) return 'Answered correctly first time.';
    if(s.wrong===0) return 'Taught but not yet answered.';
    return s.wrong+' incorrect attempt'+(s.wrong===1?'':'s')+', '+s.correct+' correct after re-teaching.';
  }

  const focus = S.stats.map(function(s,i){return {s:s,L:LEVELS[i],i:i};})
                       .filter(function(o){return o.s.wrong>0;})
                       .sort(function(a,b){return b.s.wrong-a.s.wrong;});

  let rows = LEVELS.map(function(L,i){
    const s=S.stats[i];
    return '<tr><td><b>'+(i+1)+'</b></td><td>'+esc(L.name)+'</td><td>'+status(s)+'</td><td>'+note(s,L)+'</td></tr>';
  }).join('');

  let focusHtml;
  if(!focus.length){
    focusHtml = '<div class="callout"><span class="lbl">Focus next</span><p>Every question attempted was answered correctly first time. Move on to the Scientific investigation (PAT skills) ladder.</p></div>';
  } else {
    focusHtml = '<div class="callout"><span class="lbl">Focus next</span><ul style="margin-bottom:0">'+
      focus.slice(0,5).map(function(o){
        return '<li><b>'+esc(o.L.name)+'</b> (Level '+(o.i+1)+') &mdash; '+o.s.wrong+' slip'+(o.s.wrong===1?'':'s')+' here.</li>';
      }).join('')+'</ul></div>';
  }

  stripEl.classList.add('hide');
  app.innerHTML = card(
    '<p class="eyebrow">Progress report</p>'+
    '<h1>Human Reproduction Ladder</h1>'+
    '<p class="sub">'+(S.name?esc(S.name)+' &nbsp;&middot;&nbsp; ':'')+'Genius Premium Tuition · IEB Grade 12 Life Sciences · Human reproduction &middot; '+new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'})+'</p>'+
    '<div class="kpis">'+
      '<div class="kpi"><div class="v">'+topLevel+' / '+LEVELS.length+'</div><div class="k">Highest level passed</div></div>'+
      '<div class="kpi"><div class="v">'+S.totalC+' / '+S.totalQ+'</div><div class="k">Questions correct</div></div>'+
      '<div class="kpi"><div class="v">'+acc+'%</div><div class="k">Accuracy</div></div>'+
      '<div class="kpi"><div class="v">'+mins+'</div><div class="k">Minutes</div></div>'+
    '</div>'+
    focusHtml+
    '<h3>Level by level</h3>'+
    '<table class="rep"><thead><tr><th style="width:38px">#</th><th>Concept</th><th style="width:150px">Status</th><th>Detail</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="btnrow"><button class="primary" id="printBtn">Print / save as PDF</button>'+
    '<button class="ghost" id="againBtn">Start again</button></div>'
  );
  document.getElementById('printBtn').onclick=function(){ window.print(); };
  document.getElementById('againBtn').onclick=function(){
    S.li=0; S.pending=[]; S.totalQ=0; S.totalC=0; S.ended=false;
    S.qIdx=LEVELS.map(function(){return 0;});
    S.stats=LEVELS.map(function(){return {asked:0,correct:0,wrong:0,reteaches:0,reached:false};});
    S.t0=Date.now();
    stripEl.classList.remove('hide');
    screenTeach(false);
  };
  scrollTop();
}


/* ---------- balance the multiple-choice keys ----------
   The correct option is distributed evenly across the available positions, so
   the answer can never be guessed from where it sits. Questions whose options
   are bare position labels (A, B, C ...) refer to something on screen and are
   left exactly as written. */
function balanceKeys(){
  var counter=0;
  LEVELS.forEach(function(L){
    L.qs.forEach(function(q){
      if(q.type!=='mc'||!q.opts) return;
      var label=true;
      q.opts.forEach(function(o){ if(!/^[A-E]$/.test(String(o).trim())) label=false; });
      if(label) return;
      var n=q.opts.length, target=counter++ % n;
      if(target===q.ans) return;
      var tmp=q.opts[target]; q.opts[target]=q.opts[q.ans]; q.opts[q.ans]=tmp;
      if(q.nudge){
        var nn={};
        Object.keys(q.nudge).forEach(function(k){
          var i=parseInt(k,10);
          nn[i===target?q.ans:(i===q.ans?target:i)]=q.nudge[k];
        });
        q.nudge=nn;
      }
      q.ans=target;
    });
  });
}
balanceKeys();

/* ---------- boot ---------- */
document.getElementById('stamp').textContent = new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'});
buildStrip();
screenStart();

</script>
