  b:`<p>A population is made up of children, working-age adults and older people. Children and older people depend on the working-age adults, who earn and pay taxes.</p>
  ${cards([
    {t:'Youthful population', d:'Needs many schools, clinics for children, and jobs for a growing number of school leavers. Few old people.'},
    {t:'Ageing population', d:'Needs pensions, health care for older people and care homes. Fewer workers pay the taxes that fund them.'}],{min:230})}
  ${vis(barChart({title:'Population by age group (millions)', cats:['0 to 14','15 to 64','65+'], series:[{name:'Millions of people', vals:[9,24,3]}], w:400}), 'Imaginary country, for practice')}
  <div class="worked"><span class="lbl">Worked example: the dependency ratio</span>
    <div class="step-line">Dependants = children (0 to 14) + older people (65+) = 9 + 3 = 12 million.</div>
    <div class="step-line">Working age = 15 to 64 = 24 million.</div>
    <div class="step-line">Dependency ratio = 12 ÷ 24 × 100 = 50.</div>
    <div class="step-line ans">There are 50 dependants for every 100 people of working age.</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>Dependency ratio = (number aged 0 to 14 + number aged 65 and older) ÷ (number aged 15 to 64) × 100. A high ratio means a heavy load on the working-age group.</p></div>
  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>The dependency ratio divides by the 15 to 64 group only. Do not divide by the whole population, and do not leave out either of the two dependent groups.</p></div>
  ${keyterms([['dependant','a person too young or too old to work'],['working age','15 to 64 years old'],['dependency ratio','dependants per 100 people of working age'],['pension','regular payment to retired people'],['youthful population','one with a large share of children'],['ageing population','one with a large share of old people']])}`},
  reteach:{ h:'Two scenarios: a young country and an old country',
  b:`<p>Picture the problem for each country, then work out its dependency ratio.</p>
  ${cards([
    {t:'Country Youth: 20 million aged 0 to 14, 25 million aged 15 to 64, 1 million aged 65+', d:'Too few classrooms and teachers. Each year more school leavers than jobs. Dependants: (20 + 1) ÷ 25 × 100 = 84 per 100.', hi:true},
    {t:'Country Grey: 4 million aged 0 to 14, 20 million aged 15 to 64, 8 million aged 65+', d:'Pension and health costs are huge. Few young workers to pay the tax. Dependants: (4 + 8) ÷ 20 × 100 = 60 per 100.', hi:true}],{min:250})}
  <div class="worked"><span class="lbl">Worked example: comparing the two scenarios</span>
    <div class="step-line">Country Youth: 84 dependants per 100 workers, mostly children.</div>
    <div class="step-line">Country Grey: 60 dependants per 100 workers, mostly older people.</div>
    <div class="step-line ans">Both have heavy loads on their workers, but the load is different: schools and jobs for Youth, pensions and health care for Grey.</div></div>
  <div class="callout"><span class="lbl">Working backwards</span><p>If the ratio is 80 and 30 million people are of working age, then dependants = 80 ÷ 100 × 30 = 24 million.</p></div>
  <div class="callout"><span class="lbl">Memory hook</span><p>Young country: classrooms and jobs. Old country: pensions and clinics.</p></div>`},
  qs:[
  {type:'mc', stem:`Which of these is a likely problem for a country with a very <b>youthful</b> population?`,
   opts:[`Too few schools and too few jobs for the large number of young people`,`Too many empty schools, because very few children are born each year`,`A shortage of young workers to pay for the pensions of retired people`,`A very high cost of care homes for a large number of very old people`], ans:0,
   hint:`A youthful population has a wide base. Who needs to be served?`,
   sol:`<div class="step-line">A wide base means many children and teenagers who need classrooms, teachers and later, jobs.</div><div class="step-line">The other three options describe an ageing population, with few children and many old people.</div><div class="step-line ans">Answer: Too few schools and too few jobs for the large number of young people</div>`},
  {type:'num', stem:`A country has 18 million people aged 0 to 14, 40 million aged 15 to 64 and 12 million aged 65 and older. Calculate the <b>dependency ratio</b> (dependants per 100 people of working age).`,
   ans:75, unit:'per 100', hint:`Add the two dependent groups, divide by the working-age group, then multiply by 100.`,
   sol:`<div class="step-line">Dependants = 18 + 12 = 30 million.</div><div class="step-line">Working age = 40 million.</div><div class="step-line">30 ÷ 40 × 100 = 75.</div><div class="step-line ans">Answer: 75 dependants per 100 people of working age</div>`},
  {type:'mc', stem:`Which is a likely consequence of an <b>ageing</b> population?`,
   opts:[`Pension and health care costs rise while fewer workers pay tax to fund them`,`More schools and more teachers are needed for the growing number of children`,`The number of jobs needed each year for school leavers rises quickly`,`The death rate falls as the share of very old people in the country rises`], ans:0,
   hint:`An ageing population has a narrow base and a large top.`,
   sol:`<div class="step-line">A large share of old people needs pensions and health care. With a narrow base there are fewer young workers to pay the taxes that fund them.</div><div class="step-line">The options about more schools and more jobs for school leavers describe a youthful population. The option about the death rate falling is false: a larger share of very old people raises the death rate.</div><div class="step-line ans">Answer: Pension and health care costs rise while fewer workers pay tax to fund them</div>`},
  {type:'num', stem:`Country B has a dependency ratio of 48 and 25 million people of working age (15 to 64). How many dependants does Country B have, in millions?`,
   ans:12, unit:'million', hint:`A ratio of 48 means 48 dependants for every 100 people of working age.`,
   sol:`<div class="step-line">Dependency ratio = dependants ÷ working-age people × 100, so dependants = ratio ÷ 100 × working-age people.</div><div class="step-line">48 ÷ 100 × 25 = 0,48 × 25 = 12.</div><div class="step-line ans">Answer: 12 million dependants</div>`},
  {type:'mc', stem:`<b>Use the pyramid.</b> The 30 to 44 age group is much smaller than the groups on either side of it. Which is the most likely reason?`,
   v:vis(pyramid(['0 to 14','15 to 29','30 to 44','45 to 64','65+'],[14,13.5,6,9.5,4],[13.5,13,8,12.5,6],{title:'Population structure of a region'}), 'Illustrative data, simplified'),
   opts:[`Many adults of that age died in an epidemic or left the region to find work`,`The birth rate 30 to 44 years ago was higher than the birth rate 15 to 29 years ago`,`Most people in this region retire early, so they are no longer counted`,`A very low death rate means that few people die before the age of 45`], ans:0,
   hint:`A dip in the middle of a pyramid means that group lost people, by death or by moving away, or that fewer people were born in that period.`,
   sol:`<div class="step-line">A dip in one age group means the group lost people: a disease such as HIV/AIDS killed many adults of that age, or they migrated to other regions for work.</div><div class="step-line">A higher birth rate in the past would make that group <b>bigger</b>, not smaller, so the option about the birth rate is wrong. A very low death rate would keep people in the group, and retirement does not remove people from a population.</div><div class="step-line">A dip can also come from fewer births at that time (for example during a war or a famine), but none of the other options says that.</div><div class="step-line ans">Answer: Many adults of that age died in an epidemic or left the region to find work</div>`}
  ]},

/* ===================== LEVEL 8 ===================== */
{ id:8, name:'Ecological footprint and Earth Overshoot Day', short:'Ecological footprint',
  teach:{ h:'Our footprint compared with what the Earth can renew',
  b:`<p>The <b>ecological footprint</b> measures how much productive land and sea one person (or a whole country) needs to supply what they use and to absorb their waste. It is measured in <b>global hectares (gha) per person</b>. <b>Biocapacity</b> is the amount of productive land and sea that is available to do this job.</p>
  ${vis(barChart({title:'Country Z: global hectares (gha) per person', cats:['Ecological footprint','Biocapacity'], series:[{name:'Country Z', vals:[5.5,2.5]}], w:400}), 'Imaginary values, for practice')}
  <div class="worked"><span class="lbl">Worked example: footprint against biocapacity</span>
    <div class="step-line">Country Z: footprint 5,5 gha per person. Biocapacity 2,5 gha per person.</div>
    <div class="step-line">Is the footprint bigger than the biocapacity? Yes, 5,5 is more than 2,5.</div>
    <div class="step-line">Shortfall = 5,5 - 2,5 = 3,0 gha per person.</div>
    <div class="step-line ans">Country Z uses more than its land and sea can renew, so it is in ecological deficit (overshoot).</div></div>
  ${contrast('Footprint bigger than biocapacity','Footprint smaller than biocapacity',[['Ecological deficit (overshoot)','Ecological reserve'],['Uses more than the land and sea can renew','Uses less than the land and sea can renew']])}
  <div class="callout"><span class="lbl">Rule</span><p>Footprint bigger than biocapacity means <b>overshoot</b>. <b>Earth Overshoot Day</b> is the date in the year when humanity has used up everything the Earth can renew in that year. In recent years it has fallen around late July or early August (1 August in 2024). A person's footprint rises with a lot of meat in the diet, long car travel, electricity from burning coal, and a lot of waste. South Africa's footprint per person is bigger than the world's biocapacity per person. Footprint divided by the biocapacity of one Earth (about 1,6 gha) gives the number of Earths that would be needed.</p></div>
  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Earth Overshoot Day is <b>not</b> the day the planet runs out of everything. After that date humans keep going by using up stocks faster than they are renewed, for example by overfishing and by letting carbon dioxide build up in the air.</p></div>
  ${keyterms([['ecological footprint','land and sea needed to supply a population and absorb its waste'],['global hectare (gha)','unit of area of average productive land'],['biocapacity','productive land and sea available to supply resources'],['overshoot','footprint is bigger than biocapacity'],['ecological reserve','footprint is smaller than biocapacity'],['Earth Overshoot Day','date when a year\'s renewable supply is used up'],['fossil fuels','coal, oil and gas']])}`},
  reteach:{ h:'How many Earths? Divide by the biocapacity of one Earth',
  b:`<p>Another way to show a footprint is to ask: <b>how many Earths</b> would we need if everyone lived like this? You answer it with one division.</p>
  <p><b>Recall:</b> a ratio is one number divided by another, like the dependency ratio in level 7. Here the ratio is footprint ÷ biocapacity. What raises a footprint? Eating a lot of meat, long car travel, electricity from burning coal, and producing a lot of waste.</p>
  ${chain(['Find the footprint of the person or country (gha per person)','Divide by the biocapacity per person on Earth, about 1,6 gha','The answer is the number of Earths needed'])}
  <div class="worked"><span class="lbl">Worked example: a lifestyle that needs several Earths</span>
    <div class="step-line">A lifestyle has a footprint of 4,8 gha per person.</div>
    <div class="step-line">4,8 ÷ 1,6 = 3.</div>
    <div class="step-line ans">If everyone lived like this we would need 3 Earths.</div></div>
  ${contrast('Footprint ÷ biocapacity is 1 or less','Footprint ÷ biocapacity is more than 1',[['Demand is within what Earth can renew','Demand is more than Earth can renew'],['Lifestyle can continue','Overshoot: stocks run down and wastes build up']])}
  <div class="callout"><span class="lbl">Memory hook</span><p>Divide <b>footprint</b> by <b>biocapacity</b>. Bigger than 1 means more than one Earth.</p></div>`},
  qs:[
  {type:'text', stem:`What is the name for the measure of the productive land and sea needed to supply a population with the resources it uses and to absorb its waste?`,
   ans:'ecological footprint', anyCase:true, accept:['footprint','the ecological footprint','ecological footprints','eco footprint','ecological-footprint'], ph:'two words',
   hint:`It is measured in global hectares per person.`,
   sol:`<div class="step-line">The area of productive land and sea that a population needs for its resources and waste is its ecological footprint.</div><div class="step-line ans">Answer: ecological footprint</div>`},
  {type:'mc', stem:`Which change would <b>increase</b> a household's ecological footprint?`,
   opts:[`Driving a petrol car to work every day instead of taking the bus`,`Buying vegetables from a local market instead of a distant shop`,`Switching to rooftop solar panels to generate electricity at home`,`Sorting waste so that glass, paper and plastic can be recycled`], ans:0,
   hint:`Three of these reduce the amount of land and resources needed. Find the one that adds to it.`,
   sol:`<div class="step-line">A petrol car burns fossil fuels, which needs land and sea to absorb the carbon dioxide. Daily driving raises the footprint compared with taking the bus.</div><div class="step-line">Local food, solar power and recycling all reduce the footprint.</div><div class="step-line ans">Answer: Driving a petrol car to work every day instead of taking the bus</div>`},
  {type:'num', stem:`A person's ecological footprint is 3,2 gha. The biocapacity per person on Earth is 1,6 gha. <b>How many Earths</b> would be needed if everyone lived like this person?`,
   ans:2, unit:'Earths', hint:`Divide the footprint by the biocapacity.`,
   sol:`<div class="step-line">Number of Earths = footprint ÷ biocapacity.</div><div class="step-line">3,2 ÷ 1,6 = 2.</div><div class="step-line ans">Answer: 2 Earths</div>`},
  {type:'mc', stem:`In 2024 Earth Overshoot Day fell on 1 August. What does this mean?`,
   opts:[`By 1 August humanity had used up what the Earth can renew in a whole year`,`On 1 August the Earth ran out of every natural resource that people use`,`On 1 August the world population passed 8 billion people for the first time`,`On 1 August the biocapacity of the Earth was at its highest level of the year`], ans:0,
   hint:`Overshoot means using more than can be renewed. The day marks the point in the year when this starts.`,
   sol:`<div class="step-line">Earth Overshoot Day is the date when humanity's demand for the year has used up the amount of resources that the Earth can renew in that year. After this date humans run down stocks and build up wastes.</div><div class="step-line">Resources did not all run out on that day, the date has nothing to do with the population passing 8 billion, and biocapacity does not peak on that day.</div><div class="step-line ans">Answer: By 1 August humanity had used up what the Earth can renew in a whole year</div>`},
  {type:'mc', stem:`<b>Use the table.</b> Two statements are given.<br><b>1.</b> Country Q has an ecological reserve, because its biocapacity is bigger than its footprint.<br><b>2.</b> Country R is using less than its own biocapacity, because its footprint is smaller than that of Country P.<br>Which option is correct?`,
   v:vis(dataTable(['Country','Footprint (gha per person)','Biocapacity (gha per person)'],[['P','6,3','3,1'],['Q','1,2','1,5'],['R','3,3','0,4']],{w:480}), 'Imaginary values for three countries'),
   opts:[`Statement 1 only`,`Statement 2 only`,`Both statements`,`Neither statement`], ans:0,
   hint:`For each country compare footprint with that country's own biocapacity. A smaller footprint than another country does not settle it.`,
   sol:`<div class="step-line">Statement 1: Q has footprint 1,2 and biocapacity 1,5. Biocapacity is bigger, so Q has a reserve. True.</div><div class="step-line">Statement 2: R's footprint (3,3 gha) is far bigger than its own biocapacity (0,4 gha), so R is not using less than its biocapacity. R uses about 8 times its biocapacity (3,3 ÷ 0,4) and P about 2 times (6,3 ÷ 3,1). A footprint that is smaller than another country's does not decide this. False.</div><div class="step-line ans">Answer: Statement 1 only</div>`}
  ]},

/* ===================== LEVEL 9 ===================== */
{ id:9, name:'Human impact on biodiversity', short:'Loss of biodiversity',
  teach:{ h:'People are the main cause of today\'s loss of biodiversity',
  b:`<p>Biodiversity is the variety of living things in an area. Human activities are reducing it, mainly in six ways.</p>
  ${cards([
    {t:'Habitat destruction', d:'Land cleared for farming, towns and mines. Species lose their homes.'},
    {t:'Poaching', d:'Illegal hunting or harvesting, for example rhino for horn, abalone and pangolins.'},
    {t:'Overfishing', d:'Fish are caught faster than they can breed, so stocks collapse.'},
    {t:'Invasive alien species', d:'Foreign species such as black wattle and water hyacinth spread and crowd out indigenous species.'},
    {t:'Pollution', d:'Chemicals, fertiliser and waste harm plants and animals, especially in water.'},
    {t:'Climate change', d:'Rising temperatures change habitats faster than many species can move or adapt.'}],{min:200})}
  <div class="worked"><span class="lbl">Worked example: naming the cause</span>
    <div class="step-line">Water hyacinth spreads over a dam until the surface is covered by thick plants.</div>
    <div class="step-line">Light cannot reach the water below, so submerged plants die and fish lose food and oxygen.</div>
    <div class="step-line">Water hyacinth came from South America, so it is not indigenous.</div>
    <div class="step-line ans">The cause is an invasive alien species, and indigenous biodiversity falls.</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>Biodiversity matters because it gives us clean water, crop pollination, food, medicines and tourism income, and because every species has value of its own. Losing species weakens the whole ecosystem.</p></div>
  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>An <b>alien</b> species is not simply a species that is not liked. It is one that was introduced from another region. It becomes <b>invasive</b> when it spreads and harms the indigenous species there.</p></div>
  ${keyterms([['biodiversity','the variety of living things in an area'],['indigenous','naturally found in the area'],['alien species','introduced from another region'],['invasive','spreads and harms the local ecosystem'],['poaching','illegal hunting or harvesting'],['habitat destruction','removal of the places where organisms live']])}`},
  reteach:{ h:'From cause to consequence, with a South African example',
  b:`<p>Every cause follows the same chain: a human activity, then a change to the environment, then a fall in biodiversity.</p>
  ${chain(['Human activity: a wetland is drained and built over','Change to the environment: the water, plants and shelter are gone','Consequence: frogs, birds and insects lose their home, so their numbers fall'])}
  ${contrast3(['Cause','South African example','Consequence'],[
    ['Habitat destruction','Fynbos and grassland ploughed up or built over','Indigenous plants and animals lose space'],
    ['Poaching','Pangolins caught illegally for their scales','Population falls, local extinction'],
    ['Overfishing','Some line fish stocks along the coast','Fewer breeding adults, stocks collapse'],
    ['Invasive alien species','Black wattle on river banks; water hyacinth on dams','Indigenous species outcompeted'],
    ['Pollution','Fertiliser run-off and acidic mine water','Water organisms die'],
    ['Climate change','Warmer, drier conditions','Species must move, adapt or die out']])}
  <div class="worked"><span class="lbl">Worked example: one chain written out</span>
    <div class="step-line">Activity: pangolins are caught illegally for their scales and meat.</div>
    <div class="step-line">Change: breeding adults are removed, and a pangolin usually has only one young at a time, so the population cannot replace them quickly.</div>
    <div class="step-line ans">Consequence: the pangolin population declines and local extinction becomes possible.</div></div>`},
  qs:[
  {type:'mc', stem:`Which of these is an <b>invasive alien</b> plant in South Africa?`,
   opts:[`Black wattle`,`Real yellowwood`,`Wild olive`,`Sugarbush protea`], ans:0,
   hint:`Alien means introduced from another region. Three of these are indigenous.`,
   sol:`<div class="step-line">Black wattle was introduced from Australia and spreads along river banks, crowding out indigenous plants.</div><div class="step-line">Real yellowwood, wild olive and sugarbush protea are all indigenous to southern Africa.</div><div class="step-line ans">Answer: Black wattle</div>`},
  {type:'text', stem:`Rhino are shot for their horns and abalone are taken from the sea floor without permits. What is the name of this cause of biodiversity loss?`,
   ans:'poaching', anyCase:true, accept:['wildlife poaching','poaching of animals','animal poaching','illegal harvesting','illegal hunting','poached','poach'], ph:'one word',
   hint:`The word is used for hunting or harvesting that breaks the law.`,
   sol:`<div class="step-line">Hunting or harvesting wild animals or plants illegally, without permits or outside the law, is poaching.</div><div class="step-line">Rhino shot for their horns and abalone taken without permits are both examples.</div><div class="step-line ans">Answer: poaching</div>`},
  {type:'mc', stem:`Why do invasive alien species threaten the biodiversity of an area?`,
   opts:[`They compete with indigenous species for resources and often lack natural enemies`,`They only grow on land that indigenous species do not use, so they cause no real harm`,`They are eaten by indigenous animals, which then run short of their usual food`,`They are poisonous to every animal, so grazing animals leave the area completely`], ans:0,
   hint:`Think about what the alien species needs and what keeps it in check in its home region.`,
   sol:`<div class="step-line">In their new area, alien species often lack the predators, parasites and diseases that keep them in check at home, so they spread and use up the light, water and space that indigenous species need.</div><div class="step-line">The option saying they cause no harm is wrong: they do grow on land that indigenous species use, and crowd them out. The option about being eaten by indigenous animals is wrong: that would keep them in check, not threaten biodiversity. The option about poisoning every animal is an exaggeration: most do not poison animals, they replace the food and shelter that indigenous species need.</div><div class="step-line ans">Answer: They compete with indigenous species for resources and often lack natural enemies</div>`},
  {type:'text', stem:`A mining company strips the vegetation from a hillside. A rare plant that grew only there now survives in a few small patches. Name the cause of biodiversity loss shown here.`,
   ans:'habitat destruction', anyCase:true, accept:['habitat loss','loss of habitat','destruction of habitat','destruction of the habitat','habitat fragmentation','habitat destruction by mining','habitat degradation','habitat destroyed','destruction of the natural habitat','deforestation','land clearing'], ph:'two words',
   hint:`What did the mining remove from the hillside?`,
   sol:`<div class="step-line">Stripping the vegetation removes the place where the plant lives. Removing or breaking up the places where organisms live is habitat destruction.</div><div class="step-line">Nothing was hunted, no foreign species was introduced and no pollutant is mentioned.</div><div class="step-line ans">Answer: habitat destruction</div>`},
  {type:'mc', stem:`<b>Use the data.</b> Which conclusion is best supported by the table?`,
   v:vis(dataTable(['Black wattle cover of the plot (%)','Indigenous plant species per 100 m²'],[['0','46'],['25','31'],['50','18'],['75','7']],{w:480}), 'Data from a researcher\'s survey of four plots along one river'),
   opts:[`Indigenous plant species decrease as wattle cover rises, which fits wattle crowding them out`,`Indigenous plant species increase as wattle cover increases, because wattle makes more habitat`,`Black wattle cover is increasing because the number of indigenous species is falling over time`,`Wattle cover has no effect on indigenous plants, because some species remain in every plot`], ans:0,
   hint:`Compare the first row with the last row. Which way does the second column move?`,
   sol:`<div class="step-line">With no wattle there are 46 indigenous species. With 75 % wattle cover there are only 7. The number falls steadily as wattle cover rises, which fits wattle outcompeting indigenous plants.</div><div class="step-line">The option saying indigenous species increase reverses the trend. The option saying wattle cover is increasing over time reverses the cause and the effect, and the data do not show change over time. The option saying wattle has no effect ignores the clear fall from 46 to 7.</div><div class="step-line ans">Answer: Indigenous plant species decrease as wattle cover rises, which fits wattle crowding them out</div>`}
  ]},

/* ===================== LEVEL 10 ===================== */
{ id:10, name:'Exploitation and sustainable use', short:'Sustainable use',
  teach:{ h:'We can harvest a species for ever if we take no more than it replaces',
  b:`<p>A population produces a surplus of new individuals each year. If people harvest <b>no more than this surplus</b>, the population stays the same size and the harvest can go on for ever. This is <b>sustainable use</b>. The largest harvest that can be taken every year without shrinking the population is the <b>maximum sustainable yield</b>.</p>
  ${cards([
    {t:'Quota', d:'A limit on how many (or how much) may be taken in a season.'},
    {t:'Closed season', d:'No harvesting while the species breeds.'},
    {t:'Size limit', d:'Only individuals above a certain size may be taken, so younger ones can breed first.'},
    {t:'Permits', d:'Only licensed people may harvest.'},
    {t:'Protected areas', d:'Reserves where no harvesting is allowed, so the population can recover.'},
    {t:'Community benefit sharing', d:'Local people earn income from wildlife, so they protect it. CAMPFIRE-style schemes work this way.'}],{min:200})}
  <div class="worked"><span class="lbl">Worked example: a lake</span>
    <div class="step-line">A fish population adds a surplus of 600 new fish a year.</div>
    <div class="step-line">Harvest of 450: 600 - 450 = 150 more fish than last year, so the population grows a little.</div>
    <div class="step-line">Harvest of 600: 600 - 600 = 0, so the population stays stable.</div>
    <div class="step-line ans">Harvest of 800: 600 - 800 = -200 each year, so the population falls and the harvest cannot be kept up.</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>Sustainable harvest: take no more than the surplus the population produces. Poaching and overharvesting take more than the surplus. Illegal harvesting of abalone for export has caused wild numbers to fall sharply. Abalone is now also farmed legally.</p></div>
  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Sustainable does not mean "never harvest". It means harvesting <b>at or below</b> the rate at which the population replaces itself.</p></div>
  ${keyterms([['sustainable use','using a resource so that it lasts for future generations'],['maximum sustainable yield','the largest harvest that can be taken each year without shrinking the population'],['quota','a limit on how much may be harvested'],['closed season','a period when harvesting is banned'],['size limit','a rule about the smallest size that may be taken'],['overharvesting','taking more than the population can replace'],['protected area','land or sea where harvesting is controlled or banned']])}`},
  reteach:{ h:'The surplus model: harvest below what the population adds',
  b:`<p>Use the S-shaped growth curve. A population adds the most new individuals when it is about half the carrying capacity. Near zero or near the carrying capacity it adds very few. The tallest bar is the largest harvest that can be kept up year after year.</p>
  ${vis(barChart({title:'New individuals added per year, by population size', cats:['100','300','500','700','900','1000'], series:[{name:'Surplus per year', vals:[27,63,75,63,27,0]}], w:420, yLabel:'New per year'}), 'The x-axis is the number of individuals in the population, which has a carrying capacity of 1 000. Imaginary values, for practice')}
  <div class="worked"><span class="lbl">Worked example: harvesting a population of 500</span>
    <div class="step-line">At 500 individuals the surplus is 75 a year.</div>
    <div class="step-line">Harvest 60: 75 - 60 = +15, so the population grows.</div>
    <div class="step-line">Harvest 75: 75 - 75 = 0, so it stays at 500.</div>
    <div class="step-line ans">Harvest 90: 75 - 90 = -15, so it falls year after year. Harvest at or below the surplus.</div></div>
  <div class="callout"><span class="lbl">Memory hook</span><p>Harvest less than the growth, and the stock stays. Harvest more than the growth, and the stock sinks.</p></div>`},
  qs:[
  {type:'mc', stem:`Which approach is an example of <b>sustainable</b> harvesting?`,
   opts:[`Setting a yearly quota that is no bigger than the surplus that the population produces`,`Harvesting as many as possible in the first years while the population is still large`,`Harvesting only during the months when the animals gather together in large groups to breed`,`Removing the natural predators of the species so more are left for people to harvest`], ans:0,
   hint:`Sustainable means the population can replace what is taken.`,
   sol:`<div class="step-line">If the quota is no bigger than the yearly surplus, the population is replaced each year, so the harvest can continue.</div><div class="step-line">Taking as many as possible early on uses up the population, harvesting only at breeding time removes breeding adults when they are needed, and removing predators damages the ecosystem.</div><div class="step-line ans">Answer: Setting a yearly quota that is no bigger than the surplus that the population produces</div>`},
  {type:'text', stem:`Using a resource at a rate at which it can be replaced, so that it is still available to future generations, is called ______ use.`,
   ans:'sustainable', anyCase:true, accept:['sustainable use','sustainably','sustainable utilisation','sustainable utilization','sustainable harvesting','sustainable use of resources'], ph:'one word',
   hint:`The word comes from "sustain", to keep going.`,
   sol:`<div class="step-line">Use that can carry on for ever because the resource is replaced as fast as it is used is called sustainable use.</div><div class="step-line ans">Answer: sustainable</div>`},
  {type:'mc', stem:`Why do abalone harvesting rules set a <b>minimum size limit</b>?`,
   opts:[`So that individuals can breed at least once and replace those that are harvested`,`So that the death rate of adult abalone falls to zero in every harvested area`,`So that the natural predators of abalone have less food and decrease in number`,`So that the abalone population reaches its carrying capacity as soon as possible`], ans:0,
   hint:`Think about what a small, young abalone has not yet done.`,
   sol:`<div class="step-line">Small abalone are not yet adults. If they are protected until they reach the size limit, they have a chance to breed, so the population keeps replacing itself.</div><div class="step-line">A size limit cannot lower the natural death rate to zero. It is not meant to starve predators, and reaching carrying capacity is not the aim.</div><div class="step-line ans">Answer: So that individuals can breed at least once and replace those that are harvested</div>`},
  {type:'num', stem:`A population of 20 000 abalone adds 2 000 new individuals a year (births minus natural deaths). Divers take 2 400 abalone in one year. By how many abalone does the population <b>decrease</b> in that year?`,
   ans:400, unit:'abalone', hint:`Subtract the new individuals added from the number taken.`,
   sol:`<div class="step-line">Taken: 2 400. Added: 2 000.</div><div class="step-line">2 400 - 2 000 = 400.</div><div class="step-line ans">Answer: the population decreases by 400 abalone</div>`},
  {type:'mc', stem:`<b>Evaluate using the data.</b> The table shows an imaginary abalone fishery. Which conclusion is best supported?`,
   v:vis(dataTable(['Year','Legal quota (tonnes)','Estimated illegal catch (tonnes)','Population index (year 1 = 100)'],[['1','600','200','100'],['3','400','450','78'],['5','200','700','52']],{w:540}), 'Data from a researcher\'s records for an imaginary fishery'),
   opts:[`Cutting the legal quota did not stop the decline, since the illegal catch kept growing`,`The legal quota caused the decline, so it should be raised to bring back the population`,`The illegal catch is too small to matter, so only the legal quota needs to be managed`,`The population index fell only because the legal quota was cut and so fewer were harvested`], ans:0,
   hint:`Add the legal quota and the illegal catch for each year, then compare with the population index.`,
   sol:`<div class="step-line">Total catch: year 1 = 600 + 200 = 800; year 3 = 400 + 450 = 850; year 5 = 200 + 700 = 900 tonnes.</div><div class="step-line">The legal quota fell, but the total catch rose slightly and the population index fell from 100 to 52. So the decline continued because illegal harvesting grew.</div><div class="step-line">Raising the quota would add to the harvest. The illegal catch is larger than the quota by year 5, so it is not too small to matter. A lower quota cannot cause a fall in the population.</div><div class="step-line ans">Answer: Cutting the legal quota did not stop the decline, since the illegal catch kept growing</div>`}
  ]},

/* ===================== LEVEL 11 ===================== */
{ id:11, name:'Food security and agriculture', short:'Food security',
  teach:{ h:'Food security means everyone can always get enough good food',
  b:`<p><b>Food security</b> means that all people, at all times, have enough safe and nutritious food to live a healthy life. It has four parts.</p>
  ${cards([
    {t:'Availability', d:'Enough food is grown, stored or imported.'},
    {t:'Access', d:'People can afford the food or reach it.'},
    {t:'Use', d:'Food is safe, nutritious and properly prepared, and people are healthy enough to absorb it.'},
    {t:'Stability', d:'The supply stays reliable over time, not only in good years.'}],{min:190})}
  <p><b>Pressures</b>: a growing population, drought, loss of fertile soil, and farmland lost to towns and mines. <b>Responses</b>: irrigation, crop rotation (growing different crops in turn on the same land), GM crops such as Bt maize, and reducing food waste. Each response has trade-offs.</p>
  <div class="worked"><span class="lbl">Worked example: which part has failed?</span>
    <div class="step-line">Shops in a town are full of food. A family has lost its income and cannot buy enough.</div>
    <div class="step-line">Is there enough food in the shops? Yes, so the supply is not the problem.</div>
    <div class="step-line ans">The family cannot afford it, so the problem is with access.</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>Bt maize contains a gene from the bacterium <i>Bacillus thuringiensis</i> (see the DNA technology ladder). The gene makes a protein that kills stem borer caterpillars, so the crop loses less to pests.</p></div>
  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Food security is <b>not</b> only about growing more food. A country can produce plenty and still have hungry people if they cannot afford or use it.</p></div>
  ${keyterms([['food security','everyone can always get enough safe, nutritious food'],['availability','enough food is supplied'],['access','people can afford or reach the food'],['crop rotation','growing different crops in turn on one field'],['GM crop','a crop with a gene from another organism'],['irrigation','supplying water to crops by pipes or canals']])}`},
  reteach:{ h:'Which part has failed? Then problem, fix and cost',
  b:`<p>First match a problem to the part of food security that has failed. Then pair a pressure with a response, and name its cost.</p>
  ${dataTable(['What you see','Part that has failed'],[
    ['A transport strike stops the trucks, and the shelves in a town run empty','Availability'],
    ['Food is sold only in a town 60 km away, and the people of a village have no transport to get there','Access'],
    ['Children eat enough maize meal, but unsafe water keeps making them ill, so their bodies cannot use the food','Use'],
    ['Food prices and supplies swing wildly from month to month, so a household cannot count on having food','Stability']],{w:560})}
  ${contrast3(['Pressure','Response','Trade-off'],[
    ['Pests destroy part of the crop','GM crops such as Bt maize','Seed is costlier; some people have safety concerns'],
    ['Soil is tired from growing the same crop every year','A different crop in each year\'s turn on the same field','Needs planning and may mean less of the most profitable crop'],
    ['Food spoils before it is eaten','Better storage and transport','Costs money to build and run'],
    ['Soil washed away on sloping land','Planting cover crops and ploughing less','Needs training and changes in how farmers work']])}
  <div class="worked"><span class="lbl">Worked example: which part has failed?</span>
    <div class="step-line">Meat sold at a market goes off because it is kept without cooling, and people who eat it fall ill.</div>
    <div class="step-line">Is there food, and can people reach and afford it? Yes. Is the supply steady? Yes.</div>
    <div class="step-line">Is the food safe to eat? No.</div>
    <div class="step-line ans">The part that has failed is the safe and healthy use of food.</div></div>
  <div class="callout"><span class="lbl">Memory hook</span><p>Is it there? Can I get it? Is it safe and usable? Will it last?</p></div>`},
  qs:[
  {type:'mc', stem:`Which statement best defines <b>food security</b>?`,
   opts:[`All people can always get enough safe and nutritious food for a healthy life`,`A country grows more food than its own people could possibly eat in a year`,`Every household owns land on which it can grow all of the food it needs`,`The government stores enough maize to feed the army and the police for a year`], ans:0,
   hint:`Look for the option that covers every person, at all times.`,
   sol:`<div class="step-line">Food security is about all people, at all times, having enough safe and nutritious food.</div><div class="step-line">Producing more than people can eat covers availability only. Owning land is not required, and feeding the army is not about all people.</div><div class="step-line ans">Answer: All people can always get enough safe and nutritious food for a healthy life</div>`},
  {type:'text', stem:`A long drought destroys the maize crop in a province, so there is almost no maize for sale in the area. Which of the four parts of food security (availability, access, use or stability) has failed?`,
   ans:'availability', anyCase:true, accept:['food availability','availability of food','not available','lack of availability'], ph:'one word',
   hint:`Is there food to buy at all, or is the problem only that people cannot afford it?`,
   sol:`<div class="step-line">The crop failed, so little food is supplied. That is a failure of availability.</div><div class="step-line">Access would be the failure if food was in the shops but too expensive. Use is about safe preparation and health. Stability is about the supply staying reliable over time.</div><div class="step-line ans">Answer: availability</div>`},
  {type:'text', stem:`Farmers grow different crops in a planned order on the same field, for example maize one year and beans the next, to keep the soil fertile. What is this practice called?`,
   ans:'crop rotation', anyCase:true, accept:['rotation','rotating crops','crop-rotation','crop rotations','rotation of crops','crop rotation system'], ph:'two words',
   hint:`The crops take turns on the field.`,
   sol:`<div class="step-line">Growing different crops in turn on the same land, so that soil nutrients are not used up and pests do not build up, is crop rotation.</div><div class="step-line ans">Answer: crop rotation</div>`},
  {type:'mc', stem:`Bt maize resists stem borer caterpillars. Which is a possible <b>disadvantage</b> of planting it?`,
   opts:[`Pests may evolve resistance to the Bt protein, so the crop slowly loses its defence`,`The seed must be bought again every season, so no small farmer could ever afford it`,`Bt maize needs much more water than ordinary maize, so it always fails in dry years`,`The Bt protein spreads into nearby ordinary maize plants and turns them into Bt maize`], ans:0,
   hint:`Think about what happens when a pest population is exposed to the same poison every season.`,
   sol:`<div class="step-line">Caterpillars with a gene that lets them survive the Bt protein will survive and breed, so resistance can spread through the pest population by natural selection.</div><div class="step-line">The option about buying seed every season is an exaggeration: seed cost is a real concern, but many small farmers do plant Bt maize. The option about water is wrong: the Bt gene does not change how much water the plant needs. The option about spreading is wrong: the protein is made by the plant's own gene and does not change neighbouring plants.</div><div class="step-line ans">Answer: Pests may evolve resistance to the Bt protein, so the crop slowly loses its defence</div>`},
  {type:'mc', stem:`<b>Evaluate using the data.</b> Which conclusion is best supported by the yields?`,
   v:vis(dataTable(['Plot','Bt maize yield (t per ha)','Ordinary maize yield (t per ha)'],[['1','6,2','4,9'],['2','5,8','5,2'],['3','6,5','4,6'],['4','6,0','5,0'],['5','6,4','4,8'],['Mean','6,2','4,9']],{w:520}), 'Data from a researcher\'s trial on five pairs of plots. Means are rounded to one decimal place.'),
   opts:[`Bt maize had the higher mean yield, but five plots is a small sample so more trials are needed`,`Bt maize is always better, because every Bt plot beat its ordinary partner by more than 1 t per ha`,`Bt maize made no real difference, because in plot 2 the yields differed by only 0,6 t per ha`,`Ordinary maize is better value, because the means in the table are rounded to one decimal place`], ans:0,
   hint:`Compare the two means, then think about how many plots were tested.`,
   sol:`<div class="step-line">Mean for Bt = 6,2 t per ha and mean for ordinary maize = 4,9 t per ha, so Bt was higher: about 1,3 t per ha more.</div><div class="step-line">Only five plots of each were used, so the sample is small and cannot show what will happen on every farm. The option about every Bt plot beating its partner by more than 1 t per ha is wrong: in plot 2 the difference was only 0,6 t per ha. The option about no real difference ignores the 1,3 t per ha difference in the means. The option about rounding is wrong: rounding to one decimal place hardly changes the comparison.</div><div class="step-line ans">Answer: Bt maize had the higher mean yield, but five plots is a small sample so more trials are needed</div>`}
  ]},

/* ===================== LEVEL 12 ===================== */
{ id:12, name:'Water, climate and waste: the outline', short:'Water, climate, waste',
  teach:{ h:'Water, air and waste: three more places where people have an impact',
  b:`<p>At Grade 12 you only need the main ideas for each of these three.</p>
  <p><b>Water.</b> South Africa is a water-scarce country, so both the amount and the quality of water matter. Fertiliser washed into dams causes <b>eutrophication</b>. Acidic water flowing out of old mines (<b>acid mine drainage</b>) pollutes rivers.</p>
  ${chain(['Fertiliser washes from farmland into a dam','Nutrients make algae grow very fast','The algae die and bacteria decompose them, using up the oxygen','Fish and other animals die from lack of oxygen'])}
  <p><b>Atmosphere.</b> The greenhouse effect warms the Earth. People add to it by releasing greenhouse gases.</p>
  ${flow(['Sunlight warms the Earth','The Earth gives off heat','Greenhouse gases trap some of it','The atmosphere warms'])}
  <p><b>Waste.</b> Solid waste is reduced by the three Rs: <b>reduce</b>, <b>reuse</b>, <b>recycle</b>.</p>
  <div class="worked"><span class="lbl">Worked example: the water chain in order</span>
    <div class="step-line">Step 1: a farmer puts too much fertiliser on a field and rain washes it into a dam.</div>
    <div class="step-line">Step 2: the extra nitrates and phosphates feed the algae, which grow into a thick green layer.</div>
    <div class="step-line">Step 3: dead algae sink. Bacteria that break them down use dissolved oxygen.</div>
    <div class="step-line ans">Step 4: with too little oxygen the fish die, and biodiversity in the dam falls.</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>Carbon dioxide (from burning fossil fuels) and methane (from livestock and rubbish dumps) are greenhouse gases. Global warming and climate change are causing habitats to shift, so some species must move or adapt, or they may die out (link to the evolution ladder).</p></div>
  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>The greenhouse effect is natural and necessary: without it the Earth would be too cold for life. The problem is the <b>extra</b> greenhouse gases added by people.</p></div>
  ${keyterms([['eutrophication','too many nutrients in water, causing an algal bloom and oxygen loss'],['acid mine drainage','acidic, metal-rich water that runs out of old mines'],['greenhouse gas','gas that traps heat in the atmosphere'],['climate change','long-term change in temperature and rainfall'],['recycle','turn waste into new products'],['reduce','use less in the first place']])}`},
  reteach:{ h:'Three cards, one example each',
  b:`<p>Take one clear example for each topic and remember its cause and effect.</p>
  ${cards([
    {t:'Water: nutrients in a dam', d:'Sewage from a leaking pipe runs into a dam below a town. Algae grow thickly. When they die, bacteria decompose them and use up the oxygen, so fish die.', hi:true},
    {t:'Atmosphere: methane', d:'Cattle and rubbish dumps release methane. Methane traps heat in the air, so it adds to warming and climate change.', hi:true},
    {t:'Waste: recycling glass', d:'Glass bottles are collected, melted and made into new bottles. This saves raw materials and energy, and cuts the rubbish sent to landfill.', hi:true}],{min:220})}
  <div class="worked"><span class="lbl">Worked example: methane through the chain</span>
    <div class="step-line">Source: a herd of cattle and a rubbish dump release methane.</div>
    <div class="step-line">Effect: methane is a greenhouse gas, so it traps heat in the atmosphere.</div>
    <div class="step-line ans">Result: the Earth warms a little more, which contributes to climate change.</div></div>
  <div class="callout"><span class="lbl">Memory hook</span><p>Water: too many nutrients or too much acid. Air: too many greenhouse gases. Waste: reduce, reuse, recycle.</p></div>`},
  qs:[
  {type:'text', stem:`Name the main greenhouse gas that is released when fossil fuels such as coal and petrol are burned.`,
   ans:'carbon dioxide', anyCase:true, accept:['CO2','CO₂','carbon-dioxide','carbon dioxide gas','CO₂ gas','CO2 gas'], ph:'name or formula',
   hint:`Plants take this gas in during photosynthesis.`,
   sol:`<div class="step-line">Burning coal, oil and petrol releases carbon dioxide, which traps heat in the atmosphere and adds to the greenhouse effect.</div><div class="step-line ans">Answer: carbon dioxide</div>`},
  {type:'text', stem:`The rapid growth of algae in a dam, caused by too many nutrients such as nitrates and phosphates, followed by loss of oxygen, is called ______.`,
   ans:'eutrophication', anyCase:true, accept:['eutrophication of water','eutrophication of a dam'], ph:'one long word',
   hint:`The word starts with "eu" and is about being over-fed with nutrients.`,
   sol:`<div class="step-line">Too many nutrients in a water body lead to an algal bloom. When the algae die, bacteria use up the oxygen. This process is eutrophication.</div><div class="step-line ans">Answer: eutrophication</div>`},
  {type:'mc', stem:`A school collects its used paper. A factory breaks the paper down and makes it into new paper. Which of the three Rs is this?`,
   opts:[`Recycling, because the old paper is made into new paper`,`Reusing, because the old paper is used again as paper`,`Reducing, because the school uses less paper in the first place`,`Recovering, because the paper is collected from the school`], ans:0,
   hint:`Ask whether the item is used again as it is, or broken down and made into something new.`,
   sol:`<div class="step-line">The old paper is broken down and remade into new paper. Turning waste into a new product is recycling.</div><div class="step-line">Reusing would mean using the same sheets again without breaking them down. Reducing would mean using less paper at the start. Recovering is only the collecting of the paper, which comes before the factory remakes it, and it is not one of the three Rs.</div><div class="step-line ans">Answer: Recycling, because the old paper is made into new paper</div>`},
  {type:'mc', stem:`Which is a likely effect of rising global temperatures on biodiversity?`,
   opts:[`Some species must move to cooler areas or adapt, and any that cannot may die out`,`Every species moves towards the poles at the same speed, so no species is lost`,`Only animals are affected, because plants are not able to respond to temperature`,`Species with small ranges benefit most, because cooler areas are already close by`], ans:0,
   hint:`Think about what happens to a species when its habitat gets hotter or drier than it can tolerate.`,
   sol:`<div class="step-line">Habitats change as the climate warms. Species that can move or adapt may survive, and any that cannot may die out, so biodiversity can fall.</div><div class="step-line">The option about every species moving at the same speed is wrong: species move at different speeds and many cannot move fast enough. The option about only animals is wrong: plants also depend on temperature for growth, flowering and survival. The option about small ranges is wrong: species with small ranges have fewer places to go, so they are at greater risk, not less.</div><div class="step-line ans">Answer: Some species must move to cooler areas or adapt, and any that cannot may die out</div>`},
  {type:'mc', stem:`<b>Use the data.</b> Which explains the very low oxygen at Site 3?`,
   v:vis(dataTable(['Site','Description','Dissolved oxygen (mg per litre)'],[['1','Upstream of the farm: clear water, few algae','8,1'],['2','Just below the farm: thick green algae','7,9'],['3','1 km downstream: mostly dead algae, dead fish','1,8']],{w:540}), 'Data from a researcher\'s survey of one river'),
   opts:[`Bacteria that decompose the dead algae use up the dissolved oxygen`,`The extra nutrients are poisonous and push the oxygen out of the water`,`Photosynthesis by the thick algae removes oxygen from the water`,`The fish breathe in all the oxygen, because there are too many of them`], ans:0,
   hint:`Look at what has happened to the algae by Site 3, and think about what decomposers need.`,
   sol:`<div class="step-line">At Site 2 the algae are thick and the oxygen is still high. By Site 3 the algae are dead. Bacteria that break the dead algae down respire and use up the dissolved oxygen, so it falls to 1,8.</div><div class="step-line">Photosynthesis adds oxygen, so the option about photosynthesis removing oxygen is wrong. The nutrients are not poisonous in this way, and the fish are dead, so they are not using up the oxygen.</div><div class="step-line ans">Answer: Bacteria that decompose the dead algae use up the dissolved oxygen</div>`}
  ]},

/* ===================== LEVEL 13 ===================== */
{ id:13, name:'Exam standard: pyramids and policy', short:'Exam: pyramids',
  teach:{ h:'A full model answer: compare, suggest, calculate, evaluate',
  b:`<p>A long pyramid question usually has four tasks. It builds on levels 5 to 7: reading the bars, linking the shape to development, and the effects of population structure. Here is a full model answer on two pyramids.</p>
  ${vis(pyramid(['0 to 14','15 to 29','30 to 44','45 to 64','65+'],[19,13.5,9,6.5,1.5],[18.5,13.5,9.5,7,2],{title:'Country A'}) + pyramid(['0 to 14','15 to 29','30 to 44','45 to 64','65+'],[7.5,10,12.5,15,5],[7,9.5,12,15.5,6],{title:'Country B'}), 'Illustrative data, simplified')}
  <div class="worked"><span class="lbl">Model answer with the mark allocation</span>
    <div class="step-line"><b>(a) Compare the two pyramids: give two differences (2 marks).</b> Country A has a wider base: 37,5 % of its population is younger than 15, whereas only 14,5 % of Country B is. Country B has more old people: 11 % of Country B is aged 65 or older, compared with 3,5 % of Country A.</div>
    <div class="step-line"><b>(b) Suggest a reason for the difference at the top (1 mark).</b> Country B probably has better health care, so more people live to old age.</div>
    <div class="step-line"><b>(c) Calculate the percentage of Country A younger than 15 (2 marks).</b> Males 19 + females 18,5 = 37,5 %.</div>
    <div class="step-line"><b>(d) Evaluate a family planning programme in Country A (2 marks).</b> Benefit: it would lower the birth rate and ease the pressure on schools and jobs. Limitation: it would take years, because the large number of children already born will still reach adulthood. Judgement: it helps in the long term, but it must come with education and health care.</div>
    <div class="step-line ans">Total: 2 + 1 + 2 + 2 = 7 marks</div></div>
  <div class="callout"><span class="lbl">Rule</span><p>Use both countries and quote numbers when you compare. Give a cause that fits the data when you suggest. Show the sum when you calculate. Give a benefit, a limitation and a judgement when you evaluate.</p></div>
  <div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Do not just describe one pyramid. "Compare" needs a point about <b>both</b>, joined by a word such as "whereas", "higher than" or "compared with".</p></div>
  ${keyterms([['compare','state similarities or differences, using both'],['suggest','give a possible reason that fits the data'],['calculate','work out a number, showing the steps'],['evaluate','weigh benefits against limitations and decide'],['dependency ratio','dependants per 100 of working age'],['natural increase','birth rate minus death rate']])}`},
  reteach:{ h:'The mark-scheme checklist for each command word',
  b:`<p>Examiners award marks for specific things. Tick off each one before you move on.</p>
  <p><b>Recall:</b> the skills come from levels 5 to 7. Read a bar and add the male and female bars (level 5), link the shape to development (level 6), and work with dependants and workers (level 7).</p>

  <div class="worked"><span class="lbl">Worked example: evaluating a different policy</span>

  <div class="callout"><span class="lbl">Memory hook</span><p>Compare: both. Suggest: because. Calculate: show. Evaluate: good, bad, so.</p></div>`},
  qs:[
  {type:'mc', stem:`<b>Use the pyramids.</b> Which statement correctly <b>compares</b> the two countries?`,
   v:vis(pyramid(['0 to 14','15 to 29','30 to 44','45 to 64','65+'],[18,14,10,6,1.5],[17.5,13.5,10,7,2.5],{title:'Country X'}) + pyramid(['0 to 14','15 to 29','30 to 44','45 to 64','65+'],[8.5,10.5,12,14,4],[8,10,12,14.5,6.5],{title:'Country Y'}), 'Illustrative data, simplified'),
   opts:[`X has a larger percentage under 15 (35,5 % against 16,5 %), whereas Y has more aged 65 and over (10,5 % against 4 %)`,`Y has a larger percentage under 15 (35,5 % against 16,5 %), whereas X has more aged 65 and over (10,5 % against 4 %)`,`X has a wide base and a narrow top, and these are the features that show that Country X has a high birth rate`,`X has a larger percentage of children than Y, so there must be more girls than boys in the 0 to 14 group of X`], ans:0,

   opts:[`X has a higher birth rate, probably because of little contraception and a need for children as workers`,`X has a high death rate among young children, so many more children are counted in the whole population`,`X has a longer life expectancy than Y, so more of its people are still found in the youngest age group`,`X has better access to contraception, so more families can afford to have many more children each`], ans:0,
   hint:`A wide base means many children are being born. What makes families have more children?`,
   sol:`<div class="step-line">A wide base means that many children are being born, so X has a high birth rate. High birth rates go with little use of contraception, girls leaving school early and children being needed as workers.</div><div class="step-line">The option about a high death rate among children is wrong: it would lower the number of children, not raise it. The option about a longer life expectancy is wrong: it widens the top of a pyramid, not the base. The option about better access to contraception is wrong: contraception lowers the birth rate.</div><div class="step-line ans">Answer: X has a higher birth rate, probably because of little contraception and a need for children as workers</div>`},
