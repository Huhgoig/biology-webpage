    sol:esol(['TSH acts on the thyroid, and FSH and LH act on the gonads, so the pituitary controls other glands: it is the master gland.','It is a small gland at the base of the brain, and it does not control the other glands with nerve impulses.','It controls the thyroid, but it is not the largest gland, and the other glands make their own hormones.','The control runs the other way: the hypothalamus controls the pituitary.'],'It releases hormones that control several of the other endocrine glands') }
  ] },

/* ================= LEVEL 4 ================= */
{ id:4, name:'Growth hormone and its disorders', short:'Growth hormone',
  teach:{ h:'Too much or too little growth hormone changes growth, and timing matters', b:`
<p><b>Growth hormone (GH)</b> is released by the pituitary gland. It stimulates the growth of <b>bones and muscles</b>. Too much or too little of it in childhood, or too much in adulthood, causes a growth disorder.</p>
${cards([
 {t:'Gigantism', d:'<b>Too much GH in childhood</b>, while the growth plates of the long bones are still open. The person grows abnormally tall.', hi:true},
 {t:'Acromegaly', d:'<b>Too much GH in adulthood</b>, after the growth plates have closed. The long bones cannot lengthen, so the hands, feet and jaw thicken and enlarge.'},
 {t:'Pituitary dwarfism', d:'<b>Too little GH in childhood</b>. Growth is slow and the person is very short, with body parts in normal proportion.'},
 {t:'Treatment', d:'GH deficiency is treated with injections of GH made by <b>genetically modified bacteria</b> (DNA technology).'}], {min:220})}
${ewk([
 'A 10-year-old has too little GH.',
 'GH stimulates the growth of bones and muscles, and her growth plates are still open.',
 'With too little stimulation her bones lengthen slowly.'],
 'She will be much shorter than average as an adult, but her body parts stay in normal proportion.')}
${erule('Ask two questions: <b>too much or too little</b> GH, and <b>child or adult</b>? Those two answers name the condition.')}
${etrap('Extra GH in an adult cannot make the long bones longer, because the growth plates have already closed. The person does not grow taller.')}
${keyterms([['growth hormone (GH)','stimulates growth of bones and muscles'],['gigantism','too much GH in childhood'],['acromegaly','too much GH in adulthood'],['pituitary dwarfism','too little GH in childhood'],['growth plates','the regions at the ends of long bones where they lengthen']])}` },
  reteach:{ h:'Timing matters: a two-question table', b:`
<p>You can work out every growth disorder from a table. Choose the row (<b>when</b>) and the column (<b>how much GH</b>).</p>
${vis(dataTable(['','Too much GH','Too little GH'],[
 ['<b>Childhood</b> (growth plates open)','Gigantism: very tall','Pituitary dwarfism: very short, normal proportions'],
 ['<b>Adulthood</b> (growth plates closed)','Acromegaly: hands, feet and jaw thicken, no gain in height','Not examined in this ladder']],{w:580}), 'Growth hormone disorders by timing')}
<p>To judge whether a child's growth is unusual, compare <b>growth over the same ages</b>: subtract the first height from the last, then compare with the average child.</p>
${ewk([
 'Child S was 100 cm at age 6 and 138 cm at age 14.',
 'Growth = 138 − 100 = 38 cm.',
 'The average child grew 45 cm over the same ages.',
 '38 is less than 45.'],
 'Child S grew less than average, which is consistent with too little GH.')}
${erule('Childhood plus too much: gigantism. Adulthood plus too much: acromegaly. Childhood plus too little: dwarfism. GH deficiency is treated with GH injections made by genetically modified bacteria.')}
${keyterms([['gigantism','tall, in childhood'],['acromegaly','thick hands, feet and jaw, in adulthood'],['pituitary dwarfism','short, in childhood']])}` },
  qs:[
  { type:'text', stem:`Name the condition in which the pituitary gland releases <b>too much</b> growth hormone during childhood, so that the person grows abnormally tall.`, ans:'gigantism', accept:['gigantisms','giantism','pituitary gigantism'], anyCase:true, ph:'name of the condition',
    hint:`Think of the extreme result of too much growth: a very tall person.`,
    sol:esol(['Too much GH in <b>childhood</b>, while the growth plates are open, makes the long bones grow too much.','The condition is <b>gigantism</b>.'],'gigantism') },
  { type:'mc', stem:`A 40-year-old man has a pituitary tumour that releases too much GH. His hands, feet and jaw slowly thicken, but he does <b>not</b> grow taller. Which statement explains why?`,
    opts:[`His long bones cannot lengthen as the growth plates have closed, so other bones thicken`,`His cells have lost their receptors for GH, so only the bones of his hands and feet respond`,`The liver breaks down most of the extra GH before it reaches his long bones and jaw`,`Adult bones have stopped responding to GH, so the swelling of the hands is a side effect of the tumour`], ans:0,
    hint:`Think about what happens to the growth plates at the end of childhood.`,
    sol:esol(['In adulthood the growth plates of the long bones have closed, so the bones cannot get longer.','Excess GH therefore thickens and enlarges bones of the hands, feet and jaw. This is acromegaly.','The other statements are wrong: the bones do respond to GH (they thicken), and the excess GH is not broken down before it acts.'],'His long bones cannot lengthen as the growth plates have closed, so other bones thicken') },
  { type:'text', stem:`Name the condition caused by <b>too little</b> growth hormone during childhood.`, ans:'pituitary dwarfism', accept:['pituitary dwarfisms','dwarfisms','dwarfism','dwarfism due to growth hormone deficiency','growth hormone deficiency','gh deficiency','pituitary dwarf'], anyCase:true, ph:'name of the condition',
    hint:`The opposite of the condition that makes a child abnormally tall.`,
    sol:esol(['Too little GH in <b>childhood</b> means the bones lengthen too slowly.','The person is very short but in proportion: <b>pituitary dwarfism</b>.'],'pituitary dwarfism') },
  { type:'mc', stem:`How is a child with a shortage of growth hormone treated today?`,
    opts:[`Regular injections of GH that is made by genetically modified bacteria`,`A diet rich in calcium and protein, which makes the pituitary release more GH`,`Surgery to remove the pituitary gland so that growth can restart`,`Daily GH tablets, which are absorbed unchanged from the small intestine`], ans:0,
    hint:`Think of which topic in DNA technology produces human proteins.`,
    sol:esol(['GH is a protein, so it is given by <b>injection</b>. It would be digested if swallowed as a tablet.','The GH is made by bacteria that carry the human GH gene (genetic engineering).','Diet alone cannot replace missing GH, and removing the pituitary would remove more hormones, not fewer problems.'],'Regular injections of GH that is made by genetically modified bacteria') },
  { type:'mc', stem:`The table and graph show illustrative heights of three children. The values are not from a real study. Which statement about child P is correct?`,
    v:vis(dataTable(['Age in years','Average height','Child P height','Child Q height'],[['6','115 cm','118 cm','108 cm'],['8','128 cm','136 cm','116 cm'],['10','138 cm','155 cm','123 cm'],['12','149 cm','172 cm','129 cm'],['14','163 cm','187 cm','134 cm']],{w:480}) + lineChart({title:'Height (cm) by age in years', xs:['6','8','10','12','14'], series:[{name:'Average',vals:[115,128,138,149,163]},{name:'Child P',vals:[118,136,155,172,187]},{name:'Child Q',vals:[108,116,123,129,134]}], min:0, max:200, step:50, labels:false, w:440}), 'Illustrative heights, ages 6 to 14'),
    opts:[`P grew 69 cm between ages 6 and 14 against an average of 48 cm, consistent with too much GH`,`P grew 69 cm between ages 6 and 14 against an average of 48 cm, consistent with too little GH`,`P grew 59 cm between ages 6 and 14 against an average of 48 cm, consistent with too much GH`,`P grew 69 cm between ages 6 and 14 against an average of 48 cm, consistent with acromegaly`], ans:0,
    hint:`Subtract the age 6 height from the age 14 height for P and for the average, then think about which hormone level would speed up growth.`,
    sol:esol(['Child P: 187 − 118 = 69 cm. The average child: 163 − 115 = 48 cm.','P grew <b>more</b> than average, which fits too much GH in childhood (gigantism).','Too little GH would slow growth. Acromegaly happens in adults, but this is a child (ages 6 to 14) whose growth plates are still open.','The figure 59 cm is a subtraction error.'],'P grew 69 cm between ages 6 and 14 against an average of 48 cm, consistent with too much GH') }
  ] },

/* ================= LEVEL 5 ================= */
{ id:5, name:'The thyroid gland and thyroxin', short:'Thyroid and thyroxin',
  teach:{ h:'Thyroxin sets the metabolic rate, and the thyroid needs iodine to make it', b:`
<p>The <b>thyroid gland</b> in the neck makes <b>thyroxin</b>. Thyroxin controls the <b>metabolic rate</b>: the rate at which cells release energy by respiration. It also controls growth and development. To make thyroxin the thyroid needs <b>iodine</b>, which comes from seafood and iodised salt.</p>
${vis(flow(['Iodine from salt and food','Thyroid makes thyroxin','Thyroxin sets metabolic rate','Cells release energy']), 'From iodine to energy release')}
${contrast('Too little thyroxin: underactive thyroid (hypothyroidism)','Too much thyroxin: overactive thyroid (hyperthyroidism)',[
 ['Slow metabolic rate','Fast metabolic rate'],['Tiredness and slow heartbeat','Restlessness and rapid heartbeat'],['Weight gain and feeling cold','Weight loss and feeling hot, sweating']])}
${cards([{t:'Goitre', d:'If the diet lacks iodine, the thyroid cannot make enough thyroxin and the gland enlarges, causing a swelling in the neck. Iodised salt prevents it.'}], {min:260})}
${ewk([
 'An adult has her thyroid removed and takes no replacement thyroxin.',
 'Thyroxin is missing, so her metabolic rate falls.',
 'Her cells release less energy and less heat.',
 'She eats the same food, but uses less of it.'],
 'She feels tired and cold, and the unused food is stored, so her body mass rises.')}
${erule('<b>Thyroxin = metabolic rate.</b> Too little slows everything down. Too much speeds everything up. No iodine, no thyroxin.')}
${etrap('A goitre is a swollen thyroid, usually from too little iodine. It does not mean the thyroid is overactive.')}
${keyterms([['thyroxin','hormone of the thyroid that controls metabolic rate'],['metabolic rate','rate at which cells release energy'],['iodine','needed to make thyroxin'],['goitre','swelling of the thyroid from iodine lack'],['hypothyroidism','too little thyroxin'],['hyperthyroidism','too much thyroxin']])}` },
  reteach:{ h:'An engine idling slowly or racing', b:`
<p>Think of the body as an <b>engine</b>. Thyroxin is the accelerator: it sets the <b>metabolic rate</b>, the rate at which cells release energy, and it also controls growth and development. Recall: TSH from the pituitary makes the thyroid release thyroxin. Follow each fault as a chain of cause and effect.</p>
<p><b>Too little thyroxin: the engine idles slowly</b></p>
${chain(['Less thyroxin, so a <b>low</b> metabolic rate.','Cells release less energy and less heat.','The person feels tired and cold, and the heart beats slowly.','Food that is not used is stored, so body mass rises.'])}
<p><b>Too much thyroxin: the engine races</b></p>
${chain(['More thyroxin, so a <b>high</b> metabolic rate.','Cells release more energy and more heat.','The person feels hot, sweats, is restless, and the heart beats quickly.','Stored food is used up, so body mass falls.'])}
<p>The engine needs fuel to build the accelerator: <b>iodine</b>. With no iodine in the diet the thyroid cannot make thyroxin, and it enlarges in the neck as a <b>goitre</b>.</p>
${ewk([
 'A patient sweats a lot, cannot sit still and has a resting heart rate of 110 beats per minute.',
 'Sweating and a rapid heartbeat are both fast-engine signs.',
 'A fast engine means a high metabolic rate.'],
 'Too much thyroxin, so an overactive thyroid.')}
${erule('Start from the metabolic rate, then follow the chain: low rate, less energy and heat. High rate, more energy and heat.')}
${keyterms([['thyroxin','controls the metabolic rate'],['iodine','needed for thyroxin'],['goitre','swollen thyroid in the neck']])}` },
  qs:[
  { type:'text', stem:`Name the mineral that the thyroid gland needs to make thyroxin and that is added to table salt.`, ans:'iodine', accept:['iodines','iodide','iodine salt','iodised salt'], anyCase:true, ph:'name of the mineral',
    hint:`Without this mineral the gland cannot make its hormone.`,
    sol:esol(['The thyroid cannot make thyroxin without <b>iodine</b>.','Iodine comes from seafood and iodised salt.'],'iodine') },
  { type:'mc', stem:`Which statement about thyroxin is correct?`,
    opts:[`It sets the rate at which cells release energy, and so affects growth and development`,`It stimulates the thyroid gland to release more thyroxin into the blood when needed`,`It is released by the pituitary gland to stop the thyroid from taking up iodine in food`,`It makes the cells of the body release energy more slowly so that fuel is saved`], ans:0,
    hint:`Thyroxin sets the metabolic rate.`,
    sol:esol(['Thyroxin controls the <b>metabolic rate</b>, the rate at which cells release energy, and also growth and development.','Stimulating the thyroid to release thyroxin is the job of TSH, thyroxin is made by the thyroid (not released by the pituitary), and it speeds up, not slows down, the release of energy.'],'It sets the rate at which cells release energy, and so affects growth and development') },
  { type:'text', stem:`Name the swelling of the thyroid gland in the neck that is caused by a lack of iodine in the diet.`, ans:'goitre', accept:['goitres','goiters','goiter','a goitre','simple goitre','iodine deficiency goitre'], anyCase:true, ph:'one word',
    hint:`Iodised salt helps to prevent it.`,
    sol:esol(['Without iodine the thyroid cannot make enough thyroxin, and the gland enlarges.','The swelling in the neck is a <b>goitre</b>.'],'goitre') },
  { type:'mc', stem:`Which set of signs would you expect in a person with an <b>overactive</b> thyroid (hyperthyroidism)?`,
    opts:[`Weight loss, a rapid heartbeat and feeling hot`,`Weight gain, a slow heartbeat and feeling cold`,`Weight loss, a slow heartbeat and feeling cold`,`Weight gain, a rapid heartbeat and feeling hot`], ans:0,
    hint:`Too much thyroxin makes the metabolic rate high. Which direction does each sign move?`,
    sol:esol(['Too much thyroxin means a <b>high</b> metabolic rate.','Cells use more energy: body mass falls, the heart beats fast and the person feels hot.','The row with weight gain, a slow heartbeat and feeling cold describes an underactive thyroid, and the other two rows mix signs from both conditions.'],'Weight loss, a rapid heartbeat and feeling hot') },
  { type:'mc', stem:`A clinic recorded the results below for three patients over three months. The data are illustrative. Which statement is supported by the table?`,
    v:vis(dataTable(['Patient','Blood thyroxin','Resting heart rate (beats per minute)','Change in body mass'],[['P','Below normal','54','+6 kg'],['Q','Above normal','108','−7 kg'],['R','Normal','70','0 kg']],{w:560}), 'Illustrative clinic results'),
    opts:[`Patient Q has an overactive thyroid: a high metabolic rate uses energy fast, so body mass fell`,`Patient P has an overactive thyroid: a high metabolic rate stores energy, so body mass rose`,`Patient Q has an underactive thyroid: a low metabolic rate gives a fast heartbeat and mass loss`,`Patient R has an overactive thyroid, because the heart rate is within the normal range of 60 to 100`], ans:0,
    hint:`Match each thyroxin level to a metabolic rate, then check that the heart rate and body mass agree with it.`,
    sol:esol(['Patient Q: thyroxin above normal means a high metabolic rate, so the heart rate is fast (108) and energy is used up, so mass falls (−7 kg). That is an overactive thyroid.','Patient P: thyroxin below normal, a slow heart rate (54) and weight gain, which fits an <b>underactive</b> thyroid, not an overactive one.','Patient R has normal thyroxin and a steady mass, so the thyroid is working normally.'],'Patient Q has an overactive thyroid: a high metabolic rate uses energy fast, so body mass fell') }
  ] },

/* ================= LEVEL 6 ================= */
{ id:6, name:'Negative feedback: the principle', short:'Negative feedback',
  teach:{ h:'A change is detected and a response reverses it', b:`
<p>Many hormone levels stay steady because of a loop. The system has a <b>set point</b> (the normal level). When the level moves away from it, a <b>receptor</b> detects the change and a <b>response</b> pushes the level back the other way. The response always <b>reverses</b> the change.</p>
${ewk([
 'A room heater is controlled by a thermostat set to 22 °C.',
 'The room warms to 25 °C. The thermostat detects that this is above the set point.',
 'It switches the heater off. The room cools.',
 'The room falls to 19 °C. The thermostat detects that this is below the set point.',
 'It switches the heater on. The room warms.'],
 'Each change causes a response that reverses it, so the temperature stays close to 22 °C.')}
<p>The same idea controls the hormone thyroxin. Follow each loop on the diagram.</p>
${vis(feedbackLoop({norm:'Thyroxin at the set point', up:{stim:'Thyroxin rises above set point', gland:'Hypothalamus releases less TRH', hormone:'Pituitary releases less TSH', effect:'Thyroid releases less thyroxin'}, down:{stim:'Thyroxin falls below set point', gland:'Hypothalamus releases TRH', hormone:'Pituitary releases TSH', effect:'Thyroid releases more thyroxin'}}), 'The thyroxin loop. TRH from the hypothalamus makes the pituitary release TSH, and TSH makes the thyroid release thyroxin.')}
${erule('This kind of control is called <b>negative feedback</b>: the response <b>reverses</b> the change and brings the level back to the set point.')}
${etrap('"Negative" does not mean harmful. It means the response is the <b>opposite</b> of the change.')}
${keyterms([['negative feedback','a response that reverses a change'],['set point','the normal level'],['receptor','detects the change'],['effector','carries out the response'],['TRH','from the hypothalamus; makes the pituitary release TSH'],['TSH','from the pituitary; makes the thyroid release thyroxin']])}` },
  reteach:{ h:'A geyser, then the same loop for thyroxin', b:`
<p>Match each part of a loop to a part you can see in a <b>geyser</b>, then to the thyroxin loop. Once the parts match, the loop is easy to follow.</p>
${contrast3(['Part of the loop','Geyser','Thyroxin'],[
 ['Set point','60 °C','The normal thyroxin level'],
 ['Detector','The thermostat','The hypothalamus and pituitary, which detect thyroxin in the blood'],
 ['If too high','The element is switched off','Less TRH and TSH are released'],
 ['If too low','The element is switched on','TRH and TSH are released'],
 ['Effector','The heating element','The thyroid gland'],
 ['Result','Water returns to 60 °C','Thyroxin returns to the set point']])}
${ewk([
 'A drug makes the thyroid release too much thyroxin.',
 'Thyroxin rises above the set point and the brain and pituitary detect it.',
 'The thyroid is told to release less thyroxin.'],
 'The level falls back towards the set point: the response reverses the change.')}
${erule('Detect the change, do the opposite, return to the set point. This is called <b>negative feedback</b>. For thyroxin: low thyroxin means TRH, then TSH, then more thyroxin. High thyroxin switches TRH and TSH down.')}
${keyterms([['set point','the normal level'],['detector','senses the change'],['effector','does the reversing'],['TRH, TSH','the two hormones in the thyroxin loop']])}` },
  qs:[
  { type:'mc', stem:`Which of the following is an example of <b>negative</b> feedback?`,
    opts:[`Sweating cools an overheated body, and it stops once the body temperature is normal`,`A snowball rolls downhill, picks up snow and grows, so it picks up snow even faster than before`,`A speaker picks up its own sound through a microphone, which makes the sound louder again`,`A crowd claps in time and the louder it gets, the more people join in and clap`], ans:0,
    hint:`Look for the example where the response undoes the change.`,
    sol:esol(['In the sweating example the change (an overheated body) causes a response (sweating, which cools the body) that stops once the change is reversed: <b>negative</b> feedback.','In the snowball, speaker and crowd examples the response makes the change bigger, so the change keeps growing. They are not negative feedback.'],'Sweating cools an overheated body, and it stops once the body temperature is normal') },
  { type:'text', stem:`Name the type of control in which a change is detected and the response <b>reverses</b> the change, returning the level to its set point.`, ans:'negative feedback', accept:['negative feedbacks','negative feedback loop','negative feedback mechanism','negative feedback control','negative-feedback'], anyCase:true, ph:'two words',
    hint:`The opposite kind of feedback makes a change bigger.`,
    sol:esol(['The response reverses the change and restores the set point.','This is <b>negative feedback</b>.'],'negative feedback') },
  { type:'order', stem:`Thyroxin in the blood falls below its set point. Put the steps of the loop that restores it in the correct order.`,
    items:['Thyroid releases more thyroxin','Blood thyroxin falls below the set point','Pituitary releases TSH','Blood thyroxin returns to the set point','Hypothalamus releases TRH'], ans:[4,1,3,5,2],
    hint:`Begin with the change, and follow the chain of command from the brain down to the effector.`,
    sol:esol(['The change comes first: blood thyroxin falls below the set point.','The hypothalamus detects it and releases TRH, which acts on the pituitary.','The pituitary releases TSH, which acts on the thyroid.','The thyroid releases more thyroxin.','The level of thyroxin in the blood returns to the set point.'],'Falls, TRH, TSH, more thyroxin, back to the set point') },
  { type:'mc', stem:`Why is the control of thyroxin an example of <b>negative</b> feedback?`,
    opts:[`A high thyroxin level inhibits the release of TRH and TSH, so the thyroxin level falls again`,`A high thyroxin level stimulates the release of more TRH and TSH, so the level rises further`,`A low thyroxin level makes the thyroid release even less, so the level stays low for longer`,`Thyroxin has a harmful effect on the body, so the body tries to remove it from the blood`], ans:0,
    hint:`Negative means the response is the opposite of the change.`,
    sol:esol(['When thyroxin rises, the hypothalamus and pituitary release less TRH and TSH, so the thyroid releases less thyroxin and the level falls: the response reverses the change.','The statement that a high level stimulates more TRH and TSH describes positive feedback (the change grows). "Negative" does not mean harmful.'],'A high thyroxin level inhibits the release of TRH and TSH, so the thyroxin level falls again') },
  { type:'mc', stem:`Blood thyroxin stays fairly constant in a healthy person. Which answer would earn <b>full marks</b> for explaining why? (4)`,
    opts:[`When thyroxin rises, less TRH and TSH are released so the thyroid releases less; when it falls, more TRH and TSH are released so the thyroid releases more`,`When thyroxin rises, more TRH and TSH are released so the thyroid releases more; when it falls, less TRH and TSH are released so the thyroid releases less`,`When thyroxin falls, more TRH and TSH are released so the thyroid releases more thyroxin, which returns the level to the set point`,`Nerve impulses from the thyroid tell the hypothalamus how much thyroxin has been made, and the hypothalamus switches the thyroid on or off`], ans:0,
    hint:`A full answer deals with the level going up and the level going down, and names the hormones and glands.`,
    sol:esol(['A full answer covers <b>both directions</b>: thyroxin above the set point, and thyroxin below it.','Above: less TRH and TSH, so less thyroxin. Below: more TRH and TSH, so more thyroxin.','The reversed answer describes positive feedback. The answer that covers only a fall in thyroxin gains only part of the marks. The thyroid and the hypothalamus communicate with hormones, not nerve impulses.'],'When thyroxin rises, less TRH and TSH are released so the thyroid releases less; when it falls, more TRH and TSH are released so the thyroid releases more') }
  ] },

/* ================= LEVEL 7 ================= */
{ id:7, name:'The adrenal glands and adrenalin', short:'Adrenalin',
  teach:{ h:'Adrenalin prepares the body for fight or flight', b:`
<p>The <b>adrenal glands</b> sit on top of the kidneys. In danger the brain sends nerve impulses to the inner part of each gland (the <b>adrenal medulla</b>), which releases <b>adrenalin</b> into the blood. Adrenalin prepares the body to fight or run away. This is the <b>fight or flight</b> response, and its effects last a short time.</p>
${cards([
 {t:'Heart rate rises', d:'Blood carries oxygen and fuel to the muscles faster.'},
 {t:'Breathing rate rises', d:'More oxygen enters the blood.'},
 {t:'Glycogen to glucose', d:'The liver changes glycogen into glucose, which enters the blood for respiration.'},
 {t:'Blood redirected', d:'Less blood to the digestive system and skin, more to the muscles.'},
 {t:'Pupils dilate', d:'More light enters the eyes, so vision improves.'},
 {t:'Digestion slows', d:'Energy is saved for the emergency.'}], {min:170})}
${ewk([
 'A swimmer waits on the starting block. Her leg muscles are about to need a lot of energy.',
 'Respiration needs oxygen, so her breathing rate rises and her heart beats faster to deliver it.',
 'Respiration also needs fuel, so her liver releases extra fuel into the blood.'],
 'A faster breathing rate, a faster heartbeat and more fuel in the blood prepare her muscles for sudden effort.')}
${erule('Adrenalin makes everything that helps muscles work <b>faster</b> and slows everything that is not urgent, such as digestion.')}
${etrap('The adrenal <b>cortex</b> (outer part) makes other hormones, such as aldosterone, which controls the balance of sodium. Adrenalin comes from the <b>medulla</b> (inner part).')}
${keyterms([['adrenalin','hormone of the adrenal medulla'],['fight or flight','the response to danger'],['adrenal medulla','inner part, makes adrenalin'],['adrenal cortex','outer part, makes aldosterone'],['glycogen','stored carbohydrate in the liver'],['dilate','to widen']])}
<p><b>Measuring a change:</b> percentage increase = increase \u00f7 original value \u00d7 100. Example: a heart rate that goes from 80 to 100 beats per minute rises by 20, and 20 \u00f7 80 \u00d7 100 = 25 %.</p>` },
  reteach:{ h:'Preparing the body to run: cause to effect', b:`
<p>Instead of memorising the list, follow the <b>cause and effect</b>. Ask what a runner needs, then see which change delivers it.</p>
<p>Recall: the adrenal glands are endocrine glands that sit on top of the kidneys and release their hormone into the blood.</p>
${chain(['<b>Adrenalin</b> is released into the blood.','<b>Muscles need oxygen and fuel</b>: heart rate and breathing rate rise, the liver changes glycogen into glucose, blood is redirected to the muscles.','<b>Not urgent</b>: digestion slows and blood leaves the digestive system.','<b>See better</b>: the pupils dilate so more light enters the eyes.'])}
${ewk([
 'A learner\'s pulse is 64 beats per minute at rest and 96 beats per minute during a fright.',
 'Increase = 96 − 64 = 32 beats per minute.',
 'Percentage increase = 32 ÷ 64 × 100.'],
 '50 %')}
${erule('Adrenalin: heart rate and breathing rate up, glycogen to glucose, blood to the muscles, pupils wider, digestion slower. The effects are fast but short-lived.')}
${keyterms([['adrenalin','the fight or flight hormone'],['dilate','widen'],['glycogen','changed to glucose by the liver']])}` },
  qs:[
  { type:'text', stem:`Name the hormone that the adrenal glands release in a fight or flight situation.`, ans:'adrenalin', accept:['adrenaline','epinephrine','adrenalin hormone'], anyCase:true, ph:'name of the hormone',
    hint:`It is named after the glands that make it.`,
    sol:esol(['The adrenal medulla releases <b>adrenalin</b> in response to danger.'],'adrenalin') },
  { type:'mc', stem:`Which change is caused by adrenalin during a threat?`,
    opts:[`Blood flow to the muscles increases while digestion slows down`,`Blood flow to the digestive system increases to supply more energy`,`The heart rate falls so that the muscles receive less blood`,`The pupils of the eyes narrow to protect them from bright light`], ans:0,
    hint:`Adrenalin prepares the muscles for action, not the stomach.`,
    sol:esol(['Adrenalin <b>redirects</b> blood to the muscles and slows digestion, which is not urgent.','It speeds up the heart and widens the pupils, so a slower heart, narrower pupils and more blood to the gut are the opposite of its effects.'],'Blood flow to the muscles increases while digestion slows down') },
  { type:'text', stem:`Adrenalin makes the pupils of the eyes ________ so that more light enters. Give the one-word term for this change.`, ans:'dilate', accept:['dilates','dilated','dilation','widen','widens','widened','enlarge','enlarges','enlarged','open','get bigger'], anyCase:true, ph:'one word',
    hint:`The pupils become wider.`,
    sol:esol(['Wider pupils let in more light, which improves vision when there is danger.','The pupils <b>dilate</b>.'],'dilate') },
  { type:'num', stem:`A learner's heart rate was 72 beats per minute at rest and 126 beats per minute during a fright. The data are from a class investigation. Calculate the percentage increase in heart rate. Give a whole number.`, ans:75, unit:'%',
    hint:`Find the increase first, divide it by the resting rate, then multiply by 100.`,
    sol:esol(['Increase = 126 − 72 = 54 beats per minute.','Percentage increase = 54 ÷ 72 × 100.','54 ÷ 72 = 0,75, and 0,75 × 100 = 75.'],'75 %') },
  { type:'mc', stem:`A sudden threat makes a person's heart beat faster. Which sequence correctly explains how this happens?`,
    opts:[`The brain detects danger, nerve impulses reach the adrenal glands, adrenalin is released into the blood and the heart beats faster`,`The brain detects danger, the pituitary releases TSH, the thyroid then releases adrenalin into the blood and the heart beats faster`,`The adrenal glands release adrenalin, the brain then detects danger, nerve impulses reach the heart and the heart beats faster`,`The brain detects danger, adrenalin travels along nerve fibres to the heart, and the heart beats faster as a result`], ans:0,
    hint:`Both the nervous system and the endocrine system are involved. Which one acts first?`,
    sol:esol(['The brain detects the danger first (nervous system).','Nerve impulses then stimulate the adrenal glands (a link between the two systems).','The adrenal glands release adrenalin into the <b>blood</b>, which carries it to the heart.','TSH acts on the thyroid, not the adrenal glands, and adrenalin is carried in blood, not along nerve fibres.'],'The brain detects danger, nerve impulses reach the adrenal glands, adrenalin is released into the blood and the heart beats faster') }
  ] },

/* ================= LEVEL 8 ================= */
{ id:8, name:'The pancreas: insulin and glucagon', short:'Insulin and glucagon',
  teach:{ h:'Insulin lowers blood glucose and glucagon raises it', b:`
<p>The pancreas contains groups of endocrine cells called the <b>islets of Langerhans</b>. The <b>β cells</b> make <b>insulin</b> and the <b>α cells</b> make <b>glucagon</b>. The two hormones have <b>opposite</b> effects (they are <b>antagonistic</b>) and keep blood glucose near its set point, about 4 to 6 mmol/ℓ.</p>
${vis(feedbackLoop({norm:'Blood glucose normal (4 to 6 mmol/ℓ)', up:{stim:'Glucose rises after a meal', gland:'β cells of the islets', hormone:'Insulin is released', effect:'Liver and muscle store glucose as glycogen', tag:'AFTER A MEAL'}, down:{stim:'Glucose falls between meals', gland:'α cells of the islets', hormone:'Glucagon is released', effect:'Liver changes glycogen to glucose', tag:'BETWEEN MEALS'}}), 'Two loops keep blood glucose steady. This is negative feedback.')}
${ewk([
 'Fasting blood glucose is 4,8 mmol/ℓ, inside the normal range of 4 to 6 mmol/ℓ.',
 'One hour after a sweet drink it is 8,2 mmol/ℓ.',
 'Rise = 8,2 − 4,8 = 3,4 mmol/ℓ, so the level is now above the normal range.',
 'Two hours after the drink it is 5,1 mmol/ℓ, inside the range again.'],
 'A rise after a meal and a return to the normal range show a control system reversing the change.')}
${erule('<b>After a meal: insulin, glucose falls.</b> Insulin makes liver and muscle cells take up glucose and convert it to glycogen. <b>Between meals: glucagon, glucose rises.</b> Glucagon makes the liver convert glycogen to glucose.')}
${etrap('Insulin does <b>not</b> turn glycogen into glucose: that is glucagon. Insulin sends glucose <b>into</b> the cells to be stored.')}
${keyterms([['islets of Langerhans','endocrine cells in the pancreas'],['β cells','make insulin'],['α cells','make glucagon'],['insulin','lowers blood glucose'],['glucagon','raises blood glucose'],['glycogen','storage form of glucose in liver and muscle'],['antagonistic','having opposite effects']])}` },
  reteach:{ h:'Two switches, and how to read a glucose graph', b:`
<p>Think of two switches in the pancreas. <b>Only one is on at a time</b>, and the blood glucose level decides which.</p>
${contrast3(['','Insulin switch','Glucagon switch'],[
 ['Cells','β cells','α cells'],
 ['On when','Blood glucose is high (after a meal)','Blood glucose is low (between meals)'],
 ['What the liver and muscle do','Take up glucose and convert it to glycogen','The liver converts glycogen to glucose'],
 ['Blood glucose then','Falls','Rises']])}
<p>To read a glucose graph, give three facts: the <b>start</b> value, the <b>peak</b> with its time, and the <b>end</b> value, then compare them with the normal range of 4 to 6 mmol/ℓ.</p>
${vis(lineChart({title:'Blood glucose (mmol/ℓ) after a meal', xs:['0','30','60','90','120'], series:[{name:'Volunteer',vals:[4.8,7.6,6.4,5.4,5.1]}], min:0, max:10, step:2, w:420}), 'Data from a class investigation. Time in minutes after a meal.')}
${ewk([
 'Start: 4,8 mmol/ℓ.',
 'Peak: 7,6 mmol/ℓ at 30 minutes, a rise of 7,6 − 4,8 = 2,8 mmol/ℓ. This is above the normal range of 4 to 6 mmol/ℓ, so the pancreas released the hormone that lowers glucose.',
 'End: 5,1 mmol/ℓ at 120 minutes, inside the normal range again.'],
 'Start, peak with its time, end: give all three figures, then compare with 4 to 6.')}
${erule('High glucose switches on insulin. Low glucose switches on glucagon. Each switch pushes the level back to normal.')}
${keyterms([['insulin','β cells, lowers glucose'],['glucagon','α cells, raises glucose'],['glycogen','stored glucose'],['antagonistic','opposite effects, like the two switches']])}` },
  qs:[
  { type:'text', stem:`Name the hormone, secreted by the islets of Langerhans, that <b>lowers</b> the concentration of glucose in the blood.`, ans:'insulin', accept:['insulins','insulin hormone'], anyCase:true, ph:'name of the hormone',
    hint:`It is made by the β cells.`,
    sol:esol(['The hormone that lowers blood glucose is <b>insulin</b>.','Glucagon does the opposite, raising blood glucose.'],'insulin') },
  { type:'text', stem:`In the liver and muscle, excess glucose is converted to a storage polysaccharide. Name this substance.`, ans:'glycogen', accept:['glycogens','animal starch'], anyCase:true, ph:'name of the substance',
    hint:`Plants store starch. Animals store this.`,
    sol:esol(['Insulin makes liver and muscle cells convert excess glucose into <b>glycogen</b>.','Glucagon later makes the liver convert glycogen back to glucose.'],'glycogen') },
  { type:'mc', stem:`Between meals the concentration of glucose in the blood falls below the normal range. Which hormone is released, by which cells, and what is its effect?`,
    opts:[`Glucagon from the α cells makes the liver convert glycogen to glucose`,`Glucagon from the β cells makes the liver convert glycogen to glucose`,`Insulin from the β cells makes the liver convert glycogen to glucose`,`Glucagon from the α cells makes the liver convert glucose to glycogen`], ans:0,
    hint:`Low glucose needs the hormone that raises glucose. Check which cells make it and which direction the liver converts.`,
    sol:esol(['Glucose is low, so the hormone that <b>raises</b> it is released: glucagon.','Glucagon is made by the α cells (insulin is made by the β cells).','It makes the liver convert glycogen to glucose, which enters the blood. Converting glucose to glycogen would lower blood glucose even further.'],'Glucagon from the α cells makes the liver convert glycogen to glucose') },
  { type:'mc', stem:`Insulin and glucagon are described as <b>antagonistic</b> hormones. What does this mean?`,
    opts:[`They have opposite effects on the concentration of glucose in the blood`,`They are made by different glands and carried in different body fluids`,`They both lower blood glucose, but act at different speeds in the human body`,`They are secreted by the same cells at the same time in equal amounts`], ans:0,
    hint:`Think of a pair of switches: one raises, one lowers.`,
    sol:esol(['Antagonistic hormones work in opposite directions.','Insulin lowers blood glucose and glucagon raises it.','Both are made in the islets of Langerhans of the same gland, and the α cells and β cells are different cells, so the other statements are wrong.'],'They have opposite effects on the concentration of glucose in the blood') },
  { type:'mc', stem:`The infographic shows what happens after a meal. Which answer correctly describes how insulin lowers blood glucose concentration? (3)`,
    v:vis(chain(['Blood glucose rises after a meal','The islets of Langerhans respond to the rise','Insulin travels in the blood to the liver and muscles','Blood glucose falls back to the normal range']), 'Infographic: the response to a meal'),
    opts:[`Insulin is released by β cells, liver and muscle cells take up glucose from the blood, and the glucose is converted to glycogen`,`Insulin is released by β cells, liver and muscle cells take up glucose from the blood, and the glucose is converted to starch for storage`,`Insulin is released by α cells, liver and muscle cells take up glucose from the blood, and the glucose is converted to glycogen`,`Insulin is released by β cells, the kidneys remove glucose from the blood, and the glucose leaves the body in the urine`], ans:0,
    hint:`A three-mark answer names the cells that release insulin, what the liver and muscle cells do with glucose, and what the glucose becomes.`,
    sol:esol(['Mark 1: insulin is released by the <b>β cells</b> of the islets of Langerhans (the α cells make glucagon).','Mark 2: liver and muscle cells <b>take up</b> glucose from the blood.','Mark 3: the glucose is <b>converted to glycogen</b> and stored, so blood glucose falls.','Starch is the storage carbohydrate of plants, not of animals, and glucose is not removed by the kidneys when the level is normal.'],'Insulin is released by β cells, liver and muscle cells take up glucose from the blood, and the glucose is converted to glycogen') }
  ] },

/* ================= LEVEL 9 ================= */
{ id:9, name:'Diabetes mellitus: type 1 and type 2', short:'Diabetes mellitus',
  teach:{ h:'In diabetes mellitus, blood glucose stays too high', b:`
<p><b>Diabetes mellitus</b> is a disorder in which blood glucose stays too high, because insulin is missing or does not work. There are two main types.</p>
${contrast3(['','Type 1','Type 2'],[
 ['Cause','The immune system destroys the β cells (an autoimmune disease), so little or no insulin is made','Body cells respond poorly to insulin (insulin resistance)'],
 ['Usual onset','Childhood or young adulthood, often suddenly','Adulthood, developing slowly'],
 ['Lifestyle link','None: it cannot be prevented by diet or exercise','Strong: obesity, a poor diet and little exercise raise the risk'],
 ['Treatment','Insulin injections, with a controlled diet','A healthy diet, exercise and tablets; insulin is sometimes needed later']])}
<p><b>Symptoms</b> of untreated diabetes: great thirst, frequent urination, glucose in the urine and tiredness.</p>
<p>A <b>glucose tolerance test</b> checks for diabetes: the person drinks a glucose solution and blood glucose is measured at set times. A graph of the readings shows how high the level climbs and whether it comes back down.</p>
${ewk([
 'In untreated diabetes the blood is full of glucose, but the cells cannot take it in.',
 'The cells are short of energy, so the body breaks down its own fat and protein for energy.'],
 'The person feels tired and loses body mass, even though they may eat a great deal.')}
${erule('<b>Type 1: no insulin</b> (the β cells are destroyed). <b>Type 2: insulin does not work</b> (cells respond poorly). Only type 2 is strongly linked to lifestyle.')}
${etrap('Type 1 is not caused by eating too much sugar. Diet and exercise cannot prevent it, but they can reduce the risk of type 2.')}
${keyterms([['diabetes mellitus','blood glucose stays too high'],['type 1','insulin not made'],['type 2','cells respond poorly to insulin'],['autoimmune','immune system attacks the body\'s own cells'],['insulin resistance','cells respond poorly to insulin'],['symptoms','thirst, frequent urination, glucose in urine, tiredness']])}` },
  reteach:{ h:'Reading a glucose tolerance test', b:`
<p>A <b>glucose tolerance test</b> shows how well the body deals with glucose. A person drinks a glucose solution and blood glucose is measured for two hours. In a person without diabetes the level rises and then falls back. In a person with diabetes it stays high.</p>
${vis(lineChart({title:'Blood glucose (mmol/ℓ) after a glucose drink', xs:['0','30','60','90','120'], series:[{name:'Person X',vals:[5.1,8.2,7.1,5.6,5.1]},{name:'Person Y',vals:[8.1,12.5,14.2,13.5,12.8]}], min:0, max:16, step:4, w:440}), 'Illustrative data. Time in minutes after the drink.')}
${ewk([
 'Read the graph at 90 minutes: person Y 13,5 mmol/ℓ, person X 5,6 mmol/ℓ.',
 'Difference = 13,5 − 5,6 = 7,9 mmol/ℓ.',
 'At 120 minutes person X is back at the start value, 5,1 mmol/ℓ, while person Y is still at 12,8 mmol/ℓ.'],
 'Person Y\'s glucose stays high, so person Y is the person with diabetes.')}
${cards([{t:'Type 1', d:'The immune system destroys the β cells, so no insulin is made. Not preventable by lifestyle. Treated with insulin injections.'},{t:'Type 2', d:'Body cells respond poorly to insulin. Linked to obesity, a poor diet and little exercise. Treated with diet, exercise and tablets.'},{t:'Untreated symptoms', d:'Great thirst, frequent urination, glucose in the urine and tiredness.'}], {min:200})}
${erule('Look at the <b>start value</b> (high in diabetes), the <b>peak</b>, and whether the level <b>returns</b> to normal. Then match: no insulin or poor response means the level stays high.')}
${keyterms([['glucose tolerance test','drink glucose, then measure blood glucose'],['type 1','no insulin'],['type 2','cells respond poorly']])}` },
  qs:[
  { type:'mc', stem:`A 10-year-old girl is very thirsty and has lost body mass. Tests show that her immune system has destroyed her β cells. Which type of diabetes does she have, and why?`,
    opts:[`Type 1, because her β cells can no longer make insulin`,`Type 1, because her cells no longer respond to insulin`,`Type 2, because her β cells can no longer make insulin`,`Type 2, because her cells no longer respond to insulin`], ans:0,
    hint:`Which type is autoimmune, and which type involves cells that respond poorly?`,
    sol:esol(['Destruction of the β cells by the immune system is an autoimmune attack, so little or no insulin is made: <b>type 1</b>.','In type 2 the β cells still make insulin, but the body cells respond poorly to it.'],'Type 1, because her β cells can no longer make insulin') },
  { type:'text', stem:`Which type of diabetes mellitus is strongly linked to obesity, a poor diet and little exercise? Answer with the type number.`, ans:'type 2', accept:['type two','type ii','2','type2','type 2 diabetes','type 2 diabetes mellitus','two'], anyCase:true, ph:'type number',
    hint:`It is the type where the cells respond poorly to insulin.`,
    sol:esol(['Lifestyle factors raise the risk of insulin resistance.','This is <b>type 2</b> diabetes.'],'type 2') },
  { type:'mc', stem:`Which group of symptoms is typical of <b>untreated</b> diabetes mellitus?`,
    opts:[`Great thirst, frequent urination and tiredness`,`Great thirst, rare urination and a slow pulse`,`Weight gain, feeling cold and a slow pulse`,`Frequent urination, restlessness and a high body temperature`], ans:0,
    hint:`High blood glucose draws water out into the urine.`,
    sol:esol(['The high blood glucose leads to glucose in the urine, and water goes with it, so the person urinates often and becomes very thirsty.','The cells cannot use the glucose, so the person feels tired.','The group with rare urination contradicts the high-glucose picture, and the weight gain group describes an underactive thyroid. The last group mixes frequent urination with signs of an overactive thyroid, but the key is the only group made up entirely of diabetes symptoms.'],'Great thirst, frequent urination and tiredness') },
  { type:'num', stem:`A researcher recorded the blood glucose of two volunteers after a glucose drink. One of them has diabetes mellitus. Use the graph to decide which one, then calculate by how many mmol/ℓ the higher glucose was above the lower glucose at 60 minutes. The data are illustrative.`,
    v:vis(lineChart({title:'Blood glucose (mmol/ℓ) after a glucose drink', xs:['0','30','60','90','120','150'], series:[{name:'Volunteer P',vals:[9.1,13.2,15.2,14.1,13.3,12.2]},{name:'Volunteer Q',vals:[4.8,7.9,6.9,5.6,5.1,4.9]}], min:0, max:20, step:4, h:250, w:440}), 'Time in minutes after the drink'),
    ans:8.3, unit:'mmol/ℓ',
    hint:`Read both values at 60 minutes, then subtract the lower from the higher.`,
    sol:esol(['Volunteer P starts high (9,1) and stays high, so P has diabetes. Volunteer Q rises and returns to the start value.','At 60 minutes P had 15,2 mmol/ℓ and Q had 6,9 mmol/ℓ.','Difference = 15,2 − 6,9 = 8,3 mmol/ℓ.'],'8,3 mmol/ℓ') },
  { type:'mc', stem:`A magazine claims: "A balanced diet and regular exercise prevent <b>all</b> forms of diabetes mellitus." Which evaluation is best supported by what you know?`,
    opts:[`Partly correct: lifestyle lowers the risk of type 2, but type 1 is autoimmune and lifestyle cannot prevent it`,`Fully correct: both types are lowered by diet and exercise, because both types involve insulin`,`Incorrect: lifestyle only affects type 1, because insulin injections are linked to diet`,`Partly correct: lifestyle prevents type 1, but type 2 is autoimmune and diet or exercise cannot prevent it either`], ans:0,
    hint:`Test the claim against each type separately: what causes it, and can lifestyle change that cause?`,
    sol:esol(['Type 2 is linked to obesity, poor diet and little exercise, so a healthy lifestyle lowers the risk.','Type 1 is an autoimmune destruction of the β cells, so diet and exercise cannot prevent it.','The claim says <b>all</b> forms, so it is only partly correct. The statement that lifestyle prevents type 1 but not type 2 reverses the two types, and diet and exercise cannot lower the risk of type 1 even though both types involve insulin.'],'Partly correct: lifestyle lowers the risk of type 2, but type 1 is autoimmune and lifestyle cannot prevent it') }
  ] },

/* ================= LEVEL 10 ================= */
{ id:10, name:'The gonads and the sex hormones', short:'Sex hormones',
  teach:{ h:'The gonads make the sex hormones, and the pituitary controls them', b:`
<p>The <b>gonads</b> are the testes and the ovaries. As well as making gametes, they are endocrine glands that make the <b>sex hormones</b>.</p>
${cards([
 {t:'Testosterone (testes)', d:'Stimulates sperm production and the development of male secondary sex characteristics, such as facial hair, a deeper voice and more muscle.'},
 {t:'Oestrogen (ovaries)', d:'Causes female secondary sex characteristics and the repair and thickening of the lining of the uterus.'},
 {t:'Progesterone (corpus luteum)', d:'Made by the corpus luteum, the structure left in the ovary after ovulation. It maintains the uterus lining and helps maintain pregnancy.', hi:true}], {min:210})}
${vis(flow(['Hypothalamus','Pituitary releases FSH and LH','Testes or ovaries','Sex hormones released']), 'The pituitary controls the gonads')}
${ewk([
 'A girl\'s ovaries are removed for medical reasons at the age of 12.',
 'The ovaries made oestrogen, and oestrogen drives the development of female secondary sex characteristics.',
 'Without oestrogen the lining of the uterus is not built up and the secondary characteristics do not develop normally.'],
 'She would need hormone treatment to develop normally.')}
${erule('<b>Testes: testosterone. Ovaries: oestrogen. Corpus luteum: progesterone.</b> FSH and LH from the pituitary control the gonads.')}
${etrap('Progesterone is not made by the pituitary. It is made by the corpus luteum in the ovary.')}
${keyterms([['gonads','testes and ovaries'],['testosterone','male sex hormone'],['oestrogen','female sex hormone'],['progesterone','maintains uterus lining and pregnancy'],['secondary sex characteristics','features that develop at puberty'],['corpus luteum','forms in the ovary after ovulation']])}` },
  reteach:{ h:'Who makes it, where, and what it does', b:`
<p>Learn the three hormones as one table: <b>hormone, gland, effect</b>. A memory trick: <b>T</b> goes with <b>T</b>estes. <b>O</b>estrogen goes with <b>O</b>varies. <b>P</b>rogesterone is the <b>P</b>regnancy keeper.</p>
${dataTable(['Hormone','Made by','Effect'],[
 ['Testosterone','Testes','Sperm production; male secondary sex characteristics'],
 ['Oestrogen','Ovaries','Female secondary sex characteristics; repair and thickening of the uterus lining'],
 ['Progesterone','Corpus luteum (in the ovary)','Maintains the uterus lining and pregnancy'],
 ['FSH and LH','Pituitary gland','Control the gonads']],{w:580})}
<p>Recall: FSH and LH are pituitary hormones that act on the gonads (Level 3).</p>
${ewk([
 'A woman has her ovaries removed and takes a tablet containing the hormone that her ovaries made.',
 'The ovaries made oestrogen and, after ovulation, progesterone.',
 'The main hormone of the ovaries is the one that gives the female characteristics.'],
 'She is given oestrogen to replace it.')}
${erule('Name the gland first, then the hormone. If the gland is a testis the hormone is the male sex hormone. If it is an ovary, oestrogen. If it is the corpus luteum, progesterone.')}
${keyterms([['T for testes','testosterone'],['O for ovaries','oestrogen'],['P for pregnancy','progesterone from the corpus luteum']])}` },
  qs:[
  { type:'text', stem:`Name the hormone made by the testes that stimulates sperm production and the development of male secondary sex characteristics.`, ans:'testosterone', accept:['testosterones','testosteron'], anyCase:true, ph:'name of the hormone',
    hint:`Its name begins with the same letter as the gland that makes it.`,
    sol:esol(['The testes make <b>testosterone</b>.','It stimulates sperm production and male secondary sex characteristics.'],'testosterone') },
  { type:'mc', stem:`Which of the following is an effect of <b>oestrogen</b>?`,
    opts:[`It causes the repair and thickening of the lining of the uterus`,`It stimulates the production of sperm in the testes of a male`,`It is the main hormone that maintains the uterus lining during pregnancy`,`It stimulates the mammary glands to produce milk`], ans:0,
    hint:`Oestrogen is made by the ovaries and acts on female structures.`,
    sol:esol(['Oestrogen from the ovaries causes the lining of the uterus to be repaired and to thicken.','Sperm production is stimulated by testosterone, maintaining the lining during pregnancy is the main job of progesterone, and milk production is stimulated by prolactin.'],'It causes the repair and thickening of the lining of the uterus') },
  { type:'text', stem:`After ovulation, a structure forms in the ovary and secretes progesterone. Name this structure.`, ans:'corpus luteum', accept:['corpus luteums','corpus lutea','the corpus luteum','yellow body'], anyCase:true, ph:'two words',
    hint:`The name is Latin for "yellow body".`,
    sol:esol(['After the egg is released, the empty follicle becomes the <b>corpus luteum</b>.','It secretes progesterone, which maintains the lining of the uterus.'],'corpus luteum') },
  { type:'mc', stem:`Which statement about the control of the gonads is correct?`,
    opts:[`The pituitary releases FSH and LH, which stimulate the gonads to make gametes and sex hormones`,`The gonads release FSH and LH, which stimulate the pituitary gland to make gametes and sex hormones`,`The hypothalamus releases testosterone and oestrogen, which act directly on the gonads`,`The thyroid releases FSH and LH when the level of thyroxin in the blood falls`], ans:0,
    hint:`The pituitary is the master gland: it controls other glands.`,
    sol:esol(['FSH and LH are pituitary hormones, and their target is the gonads.','The gonads are the targets, not the source, and they make the sex hormones, not FSH and LH.','Testosterone and oestrogen are made by the gonads, and FSH and LH are not made by the thyroid.'],'The pituitary releases FSH and LH, which stimulate the gonads to make gametes and sex hormones') },
  { type:'mc', stem:`A researcher removes the testes of a young adult male rat. Which result is the most likely?`,
    opts:[`Sperm production stops and the male secondary sex characteristics are gradually lost`,`Sperm production stops but the male secondary sex characteristics stay unchanged`,`Sperm production continues unchanged but the male secondary sex characteristics are lost`,`Sperm production increases because the pituitary releases more FSH and LH`], ans:0,
    hint:`Sperm are made in the testes, and so is the male sex hormone.`,
    sol:esol(['Sperm are made in the testes, so removing them stops sperm production.','The testes also make testosterone, so without them the male secondary sex characteristics are gradually lost.','Both results follow from the loss of the same gland. More FSH and LH cannot make sperm, because there are no testes left to respond.'],'Sperm production stops and the male secondary sex characteristics are gradually lost') }
  ] },

/* ================= LEVEL 11 ================= */
{ id:11, name:'ADH, the thymus and the pineal gland', short:'ADH, thymus and pineal',
  teach:{ h:'ADH saves water, and two small glands do their own jobs', b:`
<p><b>ADH</b> (antidiuretic hormone) is made in the hypothalamus and released by the pituitary gland. It makes the <b>kidneys reabsorb more water</b> into the blood, so less urine is made and the urine is more concentrated.</p>
${vis(flow(['Blood too concentrated','More ADH released','Kidneys reabsorb more water','Less, more concentrated urine']), 'ADH when the body is short of water')}
${contrast('Short of water (dehydrated)','Plenty of water (a large drink)',[
 ['More ADH released','Less ADH released'],['More water reabsorbed','Less water reabsorbed'],['Small volume of concentrated urine','Large volume of dilute urine']])}
${cards([
 {t:'Thymus', d:'In the chest. Makes thymosin, which helps white blood cells (T lymphocytes) mature, so it is part of immunity. It is most active in childhood and shrinks in adults.'},
 {t:'Pineal gland', d:'In the brain. Makes <b>melatonin</b>, which controls the sleep cycle. More melatonin is released in the dark.'}], {min:230})}
${ewk([
 'A hiker sweats for hours and drinks nothing.',
 'Her blood becomes more concentrated, because she has lost water.',
 'The brain detects this and more of the hormone is released into the blood.',
 'Her kidneys reabsorb more water into the blood.'],
 'She makes only a small volume of dark, concentrated urine, which saves water.')}
${erule('<b>More ADH: more water reabsorbed, less urine.</b> <b>Less ADH: less water reabsorbed, more urine.</b> Alcohol inhibits the release of ADH.')}
${etrap('ADH is <b>made</b> in the hypothalamus, not in the pituitary.')}
${keyterms([['ADH','antidiuretic hormone: makes the kidneys reabsorb water'],['reabsorb','to take back into the blood'],['concentrated urine','little water, much dissolved waste'],['thymus','helps T lymphocytes mature, most active in childhood'],['melatonin','controls the sleep cycle'],['pineal gland','makes melatonin']])}` },
  reteach:{ h:'If this, then that: reasoning cards', b:`
<p>Instead of memorising, follow the <b>if ... then</b> cards. Start at the left of each card and say it out loud. Recall: the hypothalamus makes ADH and the pituitary releases it (Level 3).</p>
${cards([

 {t:'IF it is a child', d:'THEN the thymus is most active, making immune cells mature. In adults it has shrunk.'}], {min:230})}
${ewk([
 'A marathon runner loses 2 ℓ of sweat and drinks nothing.',

 'With more ADH the kidneys reabsorb more water.'],
 'She makes only a little dark urine, which saves water.')}
${erule('Follow the chain every time: blood concentration, ADH, water reabsorbed, urine.')}
${keyterms([['ADH','makes the kidneys keep water'],['alcohol','inhibits the release of ADH'],['melatonin','sleep hormone of the pineal gland'],['thymus','immune gland, most active in childhood']])}` },

  { type:'text', stem:`Name the hormone, released by the pituitary gland, that makes the kidneys reabsorb more water. Give the abbreviation or the full name.`, ans:'ADH', accept:['vasopressin','antidiuretic hormone','anti-diuretic hormone','anti diuretic hormone','antidiuretic'], anyCase:true, ph:'abbreviation or full name',
    hint:`The abbreviation has three letters and starts with A.`,
    sol:esol(['The hormone that makes the kidneys reabsorb more water is <b>ADH</b> (antidiuretic hormone).','It is made in the hypothalamus and released by the pituitary gland.'],'ADH') },
  { type:'mc', stem:`Which statement about the <b>thymus</b> is correct?`,
    opts:[`It helps white blood cells mature, and it is most active in childhood`,`It controls the sleep cycle by releasing melatonin in the dark`,`It controls the water reabsorbed by the kidneys by releasing ADH`,`It releases growth hormone, which is needed by growing bones and muscle`], ans:0,
    hint:`It is part of the immune system.`,
    sol:esol(['The thymus helps the T lymphocytes (white blood cells) to mature, so it is part of immunity. It is most active in childhood.','Melatonin comes from the pineal gland, ADH is released by the pituitary and growth hormone comes from the pituitary.'],'It helps white blood cells mature, and it is most active in childhood') },
  { type:'text', stem:`Name the hormone, made by the pineal gland in the brain, that controls the sleep cycle and is released in greater amounts in the dark.`, ans:'melatonin', accept:['melatonins','melatonine'], anyCase:true, ph:'name of the hormone',

    sol:esol(['The pineal gland releases <b>melatonin</b>, mainly in the dark.','It makes a person feel sleepy and controls the sleep cycle.'],'melatonin') },
  { type:'mc', stem:`Alcohol inhibits the release of ADH. Why does a person who drinks a lot of alcohol become <b>dehydrated</b>?`,

    hint:`Less ADH means less water is taken back into the blood.`,
    sol:esol(['Alcohol inhibits ADH, so the kidneys reabsorb <b>less</b> water.','The water stays in the urine, so a large volume of dilute urine is made.','The body loses water, so the person becomes dehydrated. Small volumes of dark urine would be made if ADH release were <b>increased</b>.'],'Less water is reabsorbed by the kidneys, so a large volume of dilute urine is made') },
  { type:'mc', stem:`A volunteer was tested under two conditions. The data are illustrative. Which conclusion is supported by the table?`,
    v:vis(dataTable(['Condition','ADH in blood (arbitrary units)','Urine volume each hour','Urine colour'],[['After a hot day without water','9,0','40 mℓ','Dark'],['One hour after drinking 1 ℓ of water','2,0','420 mℓ','Pale']],{w:560}), 'Illustrative data for one volunteer'),
    opts:[`A higher ADH level was linked to a smaller volume of urine, because more water was reabsorbed`,`A higher ADH level was linked to a larger volume of urine, because less water was reabsorbed`,`The volunteer made more ADH after drinking, and that is why more urine was produced in the hour`,`ADH level had no link with urine volume, because the volume changed by only 40 mℓ per hour`], ans:0,

{ id:12, name:'Hormones as medicines and drugs: ethics', short:'Hormone use and misuse',
  teach:{ h:'Hormones can treat disorders or be misused, so judge benefit, risk and fairness', b:`

${keyterms([['anabolic steroids','synthetic drugs similar to testosterone'],['synthetic','made artificially'],['side effect','an unwanted effect of a drug'],['genetic engineering','moving a gene to another organism'],['contraceptive','prevents pregnancy'],['ethics','what is fair and right']])}` },
  reteach:{ h:'An evaluation answer with the marks shown', b:`

${chain(['<b>Claim</b>: restate the use you are judging.','<b>For (1 mark)</b>: one benefit.','<b>Against (1 mark)</b>: one risk or problem.','<b>Judgement (1 mark)</b>: your conclusion, with a reason.'])}

${erule('A one-sided answer loses marks. Always give a point for, a point against, and then decide.')}

  qs:[
  { type:'text', stem:`Human insulin for treating type 1 diabetes is made by genetically modified organisms that carry the human insulin gene. Name the type of organism that is most commonly used.`, ans:'bacteria', accept:['bacterium','bacterial cells','e. coli','e.coli','e coli','escherichia coli','yeast','yeast cells'], anyCase:true, ph:'type of organism',

{ id:13, name:'Exam standard: the endocrine system', short:'Exam standard',
  teach:{ h:'A full exam answer: describe with figures, then explain with negative feedback', b:`

${vis(lineChart({title:'Blood glucose (mmol/ℓ) of a healthy volunteer', xs:['0','30','60','90','120'], series:[{name:'Volunteer',vals:[4.9,8.6,6.7,5.4,5.1]}], min:0, max:10, step:2, w:420}), 'A researcher recorded the blood glucose of a healthy volunteer after a sugary drink. Time in minutes. Data are illustrative.')}
${ewk([
 '<b>(a) Describe the trend (2).</b> Glucose rose from 4,9 mmol/ℓ at 0 minutes to a peak of 8,6 mmol/ℓ at 30 minutes (a rise of 3,7 mmol/ℓ), then fell to 5,1 mmol/ℓ by 120 minutes.',
 '<b>(b) Explain (3).</b> The rise above the set point is detected by the pancreas. The β cells release insulin into the blood.',
 'Insulin makes liver and muscle cells take up glucose and convert it to glycogen, so blood glucose falls back to the set point. This is negative feedback.'],
 'Full marks: figures with units in (a), and hormone, cells, effect and the words "negative feedback" in (b).')}
${erule('<b>Describe</b> = start, peak with its time, end, with units. <b>Explain</b> = change detected, gland and hormone named, effect, return to the set point.')}
${etrap('Do not say only "insulin lowers glucose". Say <b>how</b>: liver and muscle cells take up glucose and convert it to glycogen.')}
${keyterms([['negative feedback','response reverses the change'],['set point','the normal level'],['β cells','make insulin'],['α cells','make glucagon'],['glycogen','stored glucose'],['antagonistic','opposite effects']])}` },
  reteach:{ h:'The mark-scheme checklist', b:`
<p>Before you write, tick off the checklist. It is exactly what the marker ticks. Recall: insulin lowers and glucagon raises blood glucose (Level 8).</p>
${cards([

 {t:'Explain with hormones', d:'Name the change. Name the gland or cells. Name the hormone. Say what the target cells do. Say the level returns to the set point.'},
 {t:'Evaluate', d:'Check the claim against the figures. Say whether it is valid. Give the reason with a number.'}], {min:210})}
${vis(lineChart({title:'Blood glucose (mmol/ℓ) of a volunteer who skipped lunch', xs:['12:00','13:00','14:00','15:00','16:00'], series:[{name:'Volunteer',vals:[5.2,4.6,3.9,4.3,4.9]}], min:0, max:8, step:2, w:420}), 'Illustrative data. No food was eaten between 12:00 and 16:00.')}
${ewk([
 '<b>Describe (2).</b> Glucose fell from 5,2 mmol/ℓ at 12:00 to 3,9 mmol/ℓ at 14:00 (a fall of 1,3 mmol/ℓ), then rose to 4,9 mmol/ℓ at 16:00.',
 '<b>Explain (3).</b> The fall below the set point is detected and the α cells release glucagon. Glucagon makes the liver convert glycogen to glucose, which enters the blood.',

${dataTable(['Hormone','Gland','Where','What it does'],[
 ['TSH','Pituitary gland','Head','Makes the thyroid release thyroxin'],
 ['Thyroxin','Thyroid','Neck','Sets the metabolic rate'],
 ['Adrenalin','Adrenal glands','On top of the kidneys','Fight or flight'],
 ['Insulin','Pancreas, \u03b2 cells','Behind the stomach','Lowers blood glucose. Missing in type 1 diabetes.'],

<p><b>A model evaluation (3).</b> Claim: "The volunteer's pancreas is not working, because glucose rose to 8,6 mmol/ℓ after the sugary drink." Check: the rise was 3,7 mmol/ℓ, but the level then fell back to 5,1 mmol/ℓ by 120 minutes. Judgement: not valid, because the level returned to the normal range, which shows the pancreas responded.</p>

  qs:[
  { type:'mc', stem:`The diagram shows four endocrine glands, A to D. Gland A releases TSH. Which row correctly matches the glands that release thyroxin, adrenalin and insulin?`,
    v:vis(bodyMap([{k:'pituitary',l:'A'},{k:'thyroid',l:'B'},{k:'adrenal',l:'C'},{k:'pancreas',l:'D'}],{letters:true}), 'Glands A to D'),
    opts:[`Thyroxin: B; adrenalin: C; insulin: D`,`Thyroxin: B; adrenalin: D; insulin: C`,`Thyroxin: A; adrenalin: C; insulin: D`,`Thyroxin: C; adrenalin: B; insulin: D`], ans:0,
    hint:`Place each gland by region first: neck, abdomen. Remember which gland sits on the kidneys.`,
    sol:esol(['A releases TSH, so A is the pituitary gland.','Thyroxin is made by the thyroid, in the neck: B.','Adrenalin is made by the adrenal glands, on top of the kidneys: C.','Insulin is made by the pancreas, behind the stomach: D.'],'Thyroxin: B; adrenalin: C; insulin: D') },
  { type:'num', stem:`A researcher recorded the blood glucose of a volunteer with type 1 diabetes on two mornings. On both mornings the volunteer ate breakfast at 08:00. On one morning insulin was injected at 08:00. The data are illustrative. Using the graph, calculate how many mmol/ℓ higher the glucose was at 10:00 without insulin than with insulin.`,

    ans:6.5, unit:'mmol/ℓ',

    v:vis(lineChart({title:'Blood glucose (mmol/ℓ) after breakfast', xs:['08:00','09:00','10:00','11:00','12:00'], series:[{name:'No insulin',vals:[6.0,12.5,14.0,15.0,15.5]},{name:'Insulin injected',vals:[6.0,9.5,7.5,6.2,5.8]}], min:0, max:20, step:4, h:250, w:440}), 'Illustrative data, breakfast at 08:00 on both mornings'),
    opts:[`Injected insulin made liver and muscle cells take up glucose and store it as glycogen, but without it the pancreas cannot make enough insulin so glucose stays high`,`Injected insulin made the liver convert glycogen to glucose, which lowered the blood glucose, but without it glucose stays high because nothing converts glycogen in the body`,`Injected insulin made the β cells release more insulin by positive feedback, but without it the α cells cannot release glucagon so glucose stays high at all times`,`Without the injection the α cells released glucagon, which lowered the glucose, but with the injection the β cells released too much insulin to cope with the meal`], ans:0,
    hint:`This volunteer has type 1 diabetes. What can the pancreas not do, and what does the injection replace?`,
    sol:esol(['In type 1 diabetes the β cells are destroyed, so the pancreas cannot make enough insulin and glucose stays high (the upper line).','Injected insulin does the job of the missing hormone: liver and muscle cells take up glucose and convert it to glycogen, so blood glucose falls (the lower line).','Converting glycogen to glucose raises glucose and is caused by glucagon. The injected hormone is insulin, which cannot stimulate β cells to make more.'],'Injected insulin made liver and muscle cells take up glucose and store it as glycogen, but without it the pancreas cannot make enough insulin so glucose stays high') },
  { type:'mc', stem:`Consider two statements about the control of blood glucose.<br>Statement 1: Insulin lowers blood glucose by stimulating the liver to convert glycogen into glucose.<br>Statement 2: Glucagon is secreted by the β cells when blood glucose rises above the set point.<br>Which option is correct?`,
    opts:[`Neither statement is correct`,`Statement 1 alone is correct`,`Statement 2 alone is correct`,`Both statements are correct`], ans:0,
    hint:`Check each statement against what you know about insulin and glucagon.`,
    sol:esol(['Statement 1 is wrong: converting glycogen to glucose <b>raises</b> blood glucose and is caused by glucagon. Insulin makes glucose go into liver and muscle cells and be converted to glycogen.','Statement 2 is wrong twice: glucagon is secreted by the α cells, and it is released when glucose <b>falls</b>.','Neither statement is correct.'],'Neither statement is correct') },
  { type:'mc', stem:`A volunteer with type 1 diabetes ate breakfast at 08:00 on two mornings, and insulin was injected at 08:00 on one of them. The data are illustrative. A learner studies the graph and concludes: "The injection did not work, because glucose still rose between 08:00 and 09:00 on the morning insulin was given." Which evaluation is best?`,
    v:vis(lineChart({title:'Blood glucose (mmol/ℓ) after breakfast', xs:['08:00','09:00','10:00','11:00','12:00'], series:[{name:'No insulin',vals:[6.0,12.5,14.0,15.0,15.5]},{name:'Insulin injected',vals:[6.0,9.5,7.5,6.2,5.8]}], min:0, max:20, step:4, h:250, w:440}), 'Illustrative data, breakfast at 08:00 on both mornings'),
    opts:[`Not valid: the rise with insulin (3,5 mmol/ℓ) was smaller than without it (6,5 mmol/ℓ), and glucose then fell to 7,5 mmol/ℓ by 10:00`,`Valid: any rise in glucose after 08:00 shows that the insulin had no effect on the volunteer, so the injection failed to work that day`,`Not valid: insulin was injected at 08:00, so any change after 09:00 was caused by the breakfast and not by the insulin`,`Valid: glucose at 12:00 was still 5,8 mmol/ℓ, which is above the normal range of 4 to 6 mmol/ℓ for glucose`], ans:0,
    hint:`Work out the actual rise on each morning by subtracting the 08:00 value, then look at what happened afterwards.`,
    sol:esol(['With insulin: 9,5 − 6,0 = 3,5 mmol/ℓ. Without insulin: 12,5 − 6,0 = 6,5 mmol/ℓ. The rise with insulin was smaller.','After 09:00 the glucose with insulin fell to 7,5 mmol/ℓ by 10:00, while without insulin it kept rising.','So the conclusion is not valid. The change after 09:00 cannot be blamed on the breakfast alone, because the line without insulin rose further and kept rising, and 5,8 mmol/ℓ is inside the normal range of 4 to 6 mmol/ℓ.'],'Not valid: the rise with insulin (3,5 mmol/ℓ) was smaller than without it (6,5 mmol/ℓ), and glucose then fell to 7,5 mmol/ℓ by 10:00') }
