 sol:`<div class="step-line">Pattern: 62% survival in reed ponds against 28% in open ponds. Biology: reeds provide cover, so fish predators catch fewer tadpoles. Source B shows fish in only 2 of 10 reed ponds.</div><div class="step-line">The answer that repeats 62% and 28% is "describe". Reeds being "attractive" is not biology. Faster growth lowering survival is not supported by either source.</div><div class="step-line ans">Answer: reeds give tadpoles places to hide, so fewer are eaten by fish and more survive to metamorphosis</div>`},
{type:'mc', stem:`Which statement correctly uses <b>both</b> sources to account for the difference in survival?`, v:vis(passage('Sources A and B (adapted, illustrative)',['<b>Source A:</b> Tadpole survival to metamorphosis was 62% in 10 ponds with dense reeds and 28% in 10 open ponds.','<b>Source B:</b> Fish that eat tadpoles were found in 8 of the 10 open ponds and in 2 of the 10 reed ponds.'])), opts:[`Survival was lower in open ponds (Source A) because fish that eat tadpoles lived in 8 of the 10 of them (Source B)`,`Survival was 28% in open ponds (Source A), so fish must have been present in all ten of those ponds (Source B)`,`Survival was 62% in reed ponds (Source A), which proves that reeds kill the fish that were found there (Source B)`,`Fish were found in 8 of 10 open ponds (Source B), so the low survival there (Source A) was caused by a lack of food`], ans:0,
 hint:'Check each pairing against the exact numbers in Source B.',
 sol:`<div class="step-line">Source A gives the pattern (lower survival in open ponds), and Source B gives the clue (fish in 8 of 10 open ponds). Together they support predation as the reason.</div><div class="step-line">"All ten" contradicts Source B, which says 8 of 10. "Reeds kill the fish" is not supported: fish were still found in 2 reed ponds. "A lack of food" is not in either source.</div><div class="step-line ans">Answer: survival was lower in open ponds (Source A) because fish that eat tadpoles lived in 8 of the 10 of them (Source B)</div>`},
{type:'order', stem:`A source shows that maize yield was lower in plots with heavy weed growth. Put these parts of an answer to "Suggest why" in a logical order, from cause to result.`, items:[`Maize takes in less of each resource`,`Yield is lower at harvest`,`Weeds compete with maize for light, water and mineral ions`,`Photosynthesis and growth slow down`], ans:[2,4,1,3], hint:'Ask which statement needs no earlier statement to explain it, and which one is only a result.',
 sol:`<div class="step-line">Cause: weeds compete with maize for light, water and mineral ions.</div><div class="step-line">Effect on the plant: maize takes in less of each resource, so photosynthesis and growth slow down.</div><div class="step-line">Result: the pattern in the source, a lower yield at harvest.</div><div class="step-line ans">Answer order: weeds compete, maize takes in less, photosynthesis and growth slow, yield is lower</div>`},
{type:'mc', stem:`<b>Suggest</b> why the sprayed orchards produced fewer apples, using the bee data in Source C. (2 marks)`, v:vis(passage('Source C (adapted, illustrative)',['Six apple orchards were sprayed with an insecticide and six were not. Bees visited a mean of 4 flowers per minute in sprayed orchards and 15 in unsprayed orchards. Sprayed orchards produced a mean of 21 apples per tree and unsprayed orchards 58.'])), opts:[`Bees visited fewer flowers, so less pollen was transferred, fewer flowers were fertilised and fewer apples formed`,`Sprayed orchards produced a mean of 21 apples per tree and unsprayed orchards produced a mean of 58 apples per tree`,`Bees visited a mean of 4 flowers per minute in sprayed orchards and 15 flowers per minute in the unsprayed orchards`,`Insecticides are chemicals, and chemicals that are sprayed on a tree make the apples on that tree smaller in size`], ans:0,
 hint:'Follow the chain from the bees to the flowers to the fruit.',
 sol:`<div class="step-line">Pattern in the data: 4 bee visits per minute in sprayed orchards against 15 in unsprayed orchards.</div><div class="step-line">Biology: bees transfer pollen (pollination), pollen leads to fertilisation, and fertilised flowers develop into fruit. Fewer flower visits means fewer pollinated flowers and fewer apples.</div><div class="step-line">Two of the other answers only copy figures (describe), and the fourth gives a vague idea that does not use the bee data.</div><div class="step-line ans">Answer: bees visited fewer flowers, so less pollen was transferred, fewer flowers were fertilised and fewer apples formed</div>`}
]},

{ id:7, name:'Evaluating a claim or investigation', short:'Evaluating claims',
  teach:{ h:'Evaluate: a strength, a weakness and a judgement', b:`
<p>To evaluate a claim, you test the investigation behind it. Ask whether it was a fair test, whether the results would be consistent if it was repeated, and whether anything else could explain them. Then give a verdict.</p>
${passage('Source A (adapted, illustrative)',['An independent team tested a new feed on 60 lambs from one farm. Thirty lambs received the new feed and 30 received the usual feed. All lambs were the same age and breed, grazed the same field and were weighed at the start and after 8 weeks. The mean mass gain was 9,1 kg with the new feed and 7,4 kg with the usual feed.'])}
${cards([
 {t:'Valid (a fair test)', d:'A control group (no treatment, or the usual treatment) is compared, only one thing is changed and everything else is kept the same.'},
 {t:'Reliable', d:'The results would be similar if the investigation were repeated. Larger samples and repeats raise reliability.'},
 {t:'Bias', d:'Who paid or who gains? A writer who gains from the result may shape it.'},
 {t:'Alternative explanation', d:'Another factor could account for the result. Two things that occur together are not necessarily cause and effect.', hi:true}
],{min:210})}
<div class="worked"><span class="lbl">Worked example: Evaluate how convincing Source A is. (3 marks, allocation illustrative)</span>
<div class="step-line"><b>Strength (1):</b> 30 lambs received the usual feed as a comparison group, and age, breed and field were the same, so it was a fair test.</div>
<div class="step-line"><b>Weakness (1):</b> only one farm and one trial were used, so the result may not hold on other farms.</div>
<div class="step-line"><b>Judgement (1):</b> reasonably good evidence that the new feed raises mass gain, but it should be repeated on other farms before it is accepted.</div>
<div class="step-line ans">Evaluate answer: strength, weakness, judgement that follows from them.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>An evaluate answer has at least one strength, at least one weakness and a judgement that follows from them. Use the details of the source for each point.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>A bigger number is not proof. Check the sample size, the comparison group and who paid before you accept a claim.</p></div>
${keyterms([['valid','a fair test that measures what it claims to'],['reliable','gives consistent results when repeated'],['control group','the comparison group that does not receive the treatment'],['sample size','the number of individuals studied'],['bias','a distortion of results caused by interest or method'],['alternative explanation','another factor that could account for the result'],['correlation','two things occurring together, which does not prove cause']])}
`},
  reteach:{ h:'A four-letter checklist: S, F, A, P', b:`
<p>Use a checklist so that you never forget a point. Check <b>S</b>ample, <b>F</b>air comparison, <b>A</b>lternative explanations and <b>P</b>ayer, then write your verdict.</p>
${passage('Source (adapted, illustrative)',['A berry farm paid a laboratory to feed 12 mice. Six mice received a berry extract and six received a normal diet. The mice that received the extract lived a mean of 3 weeks longer. The farm\'s advert says: "Berry extract adds weeks to your life."'])}
${contrast('Check','What you find in this source',[
 ['S: Sample size (reliability)','Only 12 mice, six in each group: small, so chance could play a part'],
 ['F: Fair comparison','Six mice had the normal diet for comparison: a strength'],
 ['A: Alternative explanations','The source does not say that age, sex and cage conditions were matched, so another factor is possible'],
 ['P: Payer','The berry farm paid, and it gains if the result is positive']
])}
<div class="worked"><span class="lbl">Worked example: turning the checklist into an answer</span>
<div class="step-line">Strength: a comparison group of six mice on a normal diet.</div>
<div class="step-line">Weaknesses: only 12 mice in total, and the farm that paid for the work gains from a positive result.</div>
<div class="step-line ans">Judgement: weak evidence for the advert's claim. The result is a hint that should be tested with many more mice and independent funding.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Run S, F, A, P on every source. Write what the source shows for each letter, and finish with a verdict that matches the points you made. Evaluate builds on suggest: each point still needs a reason that links the evidence to the claim.</p></div>
`},
  qs:[
{type:'mc', stem:`A student tested a fertiliser on 3 tomato plants and compared them with 3 plants without it. Which change would most improve the <b>reliability</b> of the conclusion?`, opts:[`Repeat the investigation several times with many more plants in each group`,`Give the fertilised plants a sunnier position so that the difference is easier to see`,`Choose the largest seedlings for the fertilised group so that they grow well`,`Record the mass of every tomato to more decimal places on a better balance`], ans:0,
 hint:'Reliability means getting similar results when the investigation is repeated.',
 sol:`<div class="step-line">Three plants per group is a tiny sample, so chance could explain the result. Repeating the investigation with many more plants makes the result more reliable.</div><div class="step-line">A sunnier position makes the test unfair (a second variable). Choosing the largest seedlings introduces bias. More decimal places improves precision but does not fix a small sample.</div><div class="step-line ans">Answer: repeat the investigation several times with many more plants in each group</div>`},
{type:'text', stem:`In an experiment, the group that does <b>not</b> receive the treatment and is kept for comparison is called the ______ group. (one word)`, ans:'control', anyCase:true, accept:['control group','the control','controls','a control'], ph:'one word',
 hint:'It is the group that shows what happens without the treatment.',
 sol:`<div class="step-line">The comparison group that does not receive the treatment is the control group. Without it you cannot tell whether the treatment caused the change.</div><div class="step-line ans">Answer: control</div>`},
{type:'mc', stem:`A survey found that bird species were more numerous in suburbs with more trees. A writer claims "trees cause more bird species". Which is the best <b>alternative explanation</b>?`, opts:[`Suburbs with many trees may also have fewer cats and more gardens, which could raise bird numbers`,`Birds nest in trees, so the trees must be the reason why more bird species were counted in those suburbs`,`The survey counted birds in many suburbs, so the claim has now been proven to be correct for all suburbs`,`Trees and birds are both living things, which means that they are found together in nature`], ans:0,
 hint:'An alternative explanation names a different factor that could produce the same result.',
 sol:`<div class="step-line">Suburbs with more trees may differ in other ways (fewer cats, more gardens), and any of these could also raise bird numbers. This is another factor that could explain the result.</div><div class="step-line">The nesting answer supports the claim and offers no alternative. Counting many suburbs does not prove a cause. Being "living things" explains nothing about where birds are found.</div><div class="step-line ans">Answer: suburbs with many trees may also have fewer cats and more gardens, which could raise bird numbers</div>`},
{type:'text', stem:`A study of a herbal tonic was paid for by the company that sells it, and it reported that the tonic works. The results may be affected by ______. (one word)`, ans:'bias', anyCase:true, accept:['biased','a bias','researcher bias','funding bias','bias.','conflict of interest','commercial bias','sponsor bias','bias of the funder'], ph:'one word',
 hint:'The word describes a distortion caused by someone who gains from the result.',
 sol:`<div class="step-line">A company that gains from a positive result may, knowingly or not, shape how the study is done or reported. This is bias.</div><div class="step-line ans">Answer: bias</div>`},
{type:'mc', stem:`<b>Evaluate</b> the survey in Source D as evidence that most adults find the app useful. (3 marks) Which answer earns full marks?`, v:vis(passage('Source D (adapted, illustrative)',['A newspaper asked 40 people outside one pharmacy whether a new vaccination-reminder app is useful. Thirty-two said yes. The pharmacy sells the app.'])), opts:[`Strength: 80% said yes. Weaknesses: 40 people at one shop that sells the app is a small, biased sample. Judgement: weak evidence for all adults`,`Strength: 80% of those asked said yes, which is a high percentage. Judgement: this is strong evidence that most adults find the app useful in general`,`Weaknesses: only 40 people were asked, and they were asked outside one pharmacy that sells the app, so the sample is small and biased`,`Thirty-two of the 40 people asked said that the app is useful, and the other eight people said that it is not useful to them`], ans:0,
 hint:'A full-mark evaluate answer needs a strength, weaknesses and a judgement.',
 sol:`<div class="step-line">Strength: 32 ÷ 40 × 100 = 80% said yes. Weaknesses: only 40 people were asked, outside one shop that sells the app, so the sample is small and likely biased. Judgement: this is weak evidence for what most adults think.</div><div class="step-line">One answer gives only a strength and a verdict that ignores the sample. One gives weaknesses but no strength and no explicit judgement. One merely restates the numbers.</div><div class="step-line ans">Answer: strength: 80% said yes. Weaknesses: 40 people at one shop that sells the app is a small, biased sample. Judgement: weak evidence for all adults</div>`}
]},

{ id:8, name:'Decoding the essay question', short:'Decoding the essay',
  teach:{ h:'Decide what the essay prompt asks you to do', b:`
<p>Before you write a word, decode the prompt. Find the <b>command word</b>, the <b>decision</b> you must make and the <b>evidence</b> you are allowed to use. The essay is worth 40 marks, so a wrong reading is costly.</p>
${passage('Essay prompt (illustrative)',['Sources A to H describe two ways to protect a small, declining population of an antelope on a reserve: captive breeding or habitat protection. Write an essay in which you <em>decide</em> which strategy the reserve authority should adopt. <em>Justify</em> your decision using the sources and your own knowledge.'])}
${cards([
 {t:'Command words', d:'"Decide" and "justify": take a position, then prove it.', hi:true},
 {t:'Decision required', d:'One strategy: captive breeding or habitat protection.'},
 {t:'Evidence allowed', d:'Sources A to H, cited by letter, plus your own biology knowledge.'},
 {t:'Format', d:'An essay of about 2,5 to 3 pages: introduction, body, conclusion.'}
],{min:200})}
${contrast('What the marker looks for','What it looks like',[
 ['Plan','a marked plan with your stance, themes and counter-arguments'],
 ['Stance','a clear decision stated early and kept to the end'],
 ['Use of sources','facts cited by letter, for example "Source C"'],
 ['Own knowledge','syllabus biology that is not in the sources'],
 ['Counter-argument','the opposing view, rebutted with evidence'],
 ['Structure','introduction, one theme per paragraph, conclusion'],
 ['Language','scientific terms in a formal style, with no bullet points']
])}
<div class="worked"><span class="lbl">Worked example: decoding the antelope prompt</span>
<div class="step-line">1. Underline the verbs: "decide" and "justify". You must choose, and every claim needs a reason.</div>
<div class="step-line">2. Ring the options: captive breeding or habitat protection. You must choose one.</div>
<div class="step-line">3. Note the evidence: Sources A to H and your own knowledge.</div>
<div class="step-line ans">The question in one line: which strategy should the authority adopt, and why?</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Turn the prompt into one question that you can answer with a stance: "Should X or Y be done, and why?" Your plan and your essay must answer exactly that.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Do not write everything you know about the topic, and do not retell the sources one after the other. The essay must argue for a decision.</p></div>
${keyterms([['command word','tells you what to do: decide, justify, evaluate'],['stance','the position you take on the issue'],['decision','the choice the prompt asks you to make'],['source','material in the booklet, cited by letter'],['own knowledge','syllabus biology you add yourself'],['plan','the marked planning page for the essay'],['counter-argument','the opposing view that you answer']])}
`},
  reteach:{ h:'Three learners decode the same prompt: who got it right?', b:`
<p>See how three learners read one prompt. Only one of them is ready to plan.</p>
${passage('Essay prompt (illustrative)',['Sources A to H discuss using compost or chemical fertiliser in a school food garden. Write an essay in which you evaluate both options and recommend which the school should use. Use the sources and your own knowledge.'])}
${contrast3(['Learner','What the learner thinks the prompt asks','Verdict'],[
 ['1','"Write what I know about how plants get nutrients."','Wrong: this is a topic dump. There is no recommendation, and the sources are ignored.'],
 ['2','"Summarise Sources A to H in order, then finish."','Wrong: this retells the sources. There is no stance and no weighing of the two options.'],
 ['3','"Weigh both options, recommend one, back it with sources and my own knowledge, and answer the other side."','Right: it names the stance, the evidence and the counter-argument.']
])}
<div class="worked"><span class="lbl">Worked example: the check you can run on any decoding</span>
<div class="step-line">Is there a decision? Learner 3 has one: recommend compost or fertiliser.</div>
<div class="step-line">Is there evidence of two kinds? Learner 3 names the sources and own knowledge.</div>
<div class="step-line">Is the other side dealt with? Learner 3 says "answer the other side".</div>
<div class="step-line ans">Learner 3 passes all three checks. Learners 1 and 2 fail the first.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>A correct decoding names a decision, two kinds of evidence (sources and own knowledge) and the opposing view. The plan you write on the planning page is marked, so it must show these.</p></div>
`},
  qs:[
{type:'mc', stem:`Read the essay prompt. Which decision must the essay make?`, v:vis(passage('Essay prompt (illustrative)',['Sources A to H present arguments for and against building housing on part of a coastal wetland. Write an essay in which you evaluate the proposal and decide whether it should go ahead. Use the sources and your own knowledge.'])), opts:[`Whether the housing should be built on the part of the coastal wetland`,`Which one of Sources A to H is the most reliable source on the wetland`,`How a coastal wetland filters water and supports the wildlife that lives in it`,`Where else in the area the new housing could be built instead of the wetland`], ans:0,
 hint:'Look for the words that tell you what you must decide.',
 sol:`<div class="step-line">The prompt says "decide whether it should go ahead": the decision is whether the housing proposal should proceed.</div><div class="step-line">Ranking the sources, describing how wetlands work, or finding a different site are not what the prompt asks.</div><div class="step-line ans">Answer: whether the housing should be built on the part of the coastal wetland</div>`},
{type:'text', stem:`Which command word in this prompt tells you to weigh up the strengths and weaknesses of the proposal before you decide?`, v:vis(passage('Essay prompt (illustrative)',['Sources A to H present arguments for and against building housing on part of a coastal wetland. Write an essay in which you evaluate the proposal and decide whether it should go ahead. Use the sources and your own knowledge.'])), ans:'evaluate', anyCase:true, accept:['evaluates','evaluation','to evaluate'], ph:'one word',
 hint:'Look for the word that means weigh up the strengths and weaknesses.',
 sol:`<div class="step-line">The prompt asks you to "evaluate the proposal and decide": evaluate means weigh the strengths and weaknesses, and decide means take a stance.</div><div class="step-line ans">Answer: evaluate</div>`},
{type:'text', stem:`The clear position that you take in the essay, and keep to the end, is called your ______. (one word)`, ans:'stance', anyCase:true, accept:['a stance','my stance','stances','position','decision','recommendation','choice','point of view','viewpoint','standpoint'], ph:'one word',
 hint:'It is the side you choose on the issue.',
 sol:`<div class="step-line">The position you take on the issue, stated early and defended throughout, is your stance.</div><div class="step-line ans">Answer: stance</div>`},
{type:'mc', stem:`Consider these statements about the essay.<br><b>Statement 1:</b> The plan you write is marked, so it belongs on the planning page and not only in your head.<br><b>Statement 2:</b> Counter-arguments weaken your stance, so they should be left out of the essay.<br>Which option is correct?`, opts:[`Statement 1 only`,`Statement 2 only`,`Both statements`,`Neither statement`], ans:0,
 hint:'Ask what the marker rewards for the plan and for the opposing view.',
 sol:`<div class="step-line">Statement 1 is true: the plan is marked.</div><div class="step-line">Statement 2 is false: answering the opposing view with evidence is rewarded, because it shows that your stance is reasoned.</div><div class="step-line ans">Answer: Statement 1 only</div>`},
{type:'mc', stem:`Read the essay prompt. Which learner statement shows that it has been <b>decoded correctly</b>?`, v:vis(passage('Essay prompt (illustrative)',['Sources A to H present arguments for and against building housing on part of a coastal wetland. Write an essay in which you evaluate the proposal and decide whether it should go ahead. Use the sources and your own knowledge.'])), opts:[`I must decide for or against, defend it with sources and my own knowledge, and answer the opposing side`,`I must describe how wetlands work and then give my own feelings about the building of new houses there`,`I must summarise Sources A to H one by one, in order, and finish with a short conclusion of my own at the end`,`I must say yes to the housing and use only the sources that agree with my own decision about it`], ans:0,
 hint:'A correct decoding names a decision, two kinds of evidence and the other side.',
 sol:`<div class="step-line">The correct reading has a decision (for or against), two kinds of evidence (sources and own knowledge) and the opposing side.</div><div class="step-line">Describing wetlands is a topic dump, summarising the sources is a retelling, and using only the agreeing sources ignores the "evaluate" part and the counter-argument.</div><div class="step-line ans">Answer: I must decide for or against, defend it with sources and my own knowledge, and answer the opposing side</div>`}
]},

{ id:9, name:'Planning the essay', short:'Essay plan',
  teach:{ h:'A marked plan: stance, four themes, counter-argument', b:`
<p>The plan is marked, so it is part of your answer. Write it as a table or mind map: your <b>decision</b> at the top, about four <b>themes</b> with source letters and own knowledge, and one <b>counter-argument</b> with a rebuttal.</p>
<p><b>Prompt:</b> Should a farming community clear alien trees from its river catchment?</p>
${dataTable(['Plan part','Content'],[
 ['Decision (stance)','Yes, clear them in phases.'],
 ['Theme 1: water','Source A: streamflow was lower in plots with alien trees. Own knowledge: alien trees often use more water than indigenous vegetation.'],
 ['Theme 2: biodiversity','Source C: fewer indigenous plant species where alien trees dominate. Own knowledge: alien species outcompete indigenous plants for light and space.'],
 ['Theme 3: people','Source E: clearing created temporary jobs. Own knowledge: a reliable water supply helps farms and homes.'],
 ['Theme 4: fire','Source G: fire damage was greater in alien stands. Own knowledge: dense alien trees carry a heavy fuel load.'],
 ['Counter-argument and rebuttal','Clearing is expensive (Source F). The cost is spread over phases and offset by the water saved (Source A).']
],{w:600})}
<p style="font-size:13px;color:#6B6B6B">An illustrative plan: no real data are quoted.</p>
<p>Build a plan in this order:</p>
${chain(['Underline the decision in the prompt','Skim the sources and note which side each one supports','Choose your stance and write it at the top','Group the best facts into themes, with source letters','Finally, add one counter-argument and your rebuttal'])}
<div class="worked"><span class="lbl">Worked example: building one row of the plan</span>
<div class="step-line">Name the theme in two words: "water".</div>
<div class="step-line">Add a source fact with its letter: "Source A: streamflow was lower where alien trees grew".</div>
<div class="step-line">Add one own-knowledge point that explains it: "alien trees often use more water".</div>
<div class="step-line ans">The row ends by pointing at the stance: so clearing helps the water supply.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>A marked plan shows the decision at the top, about four themes with source letters and own-knowledge points, and one counter-argument with a rebuttal. Notes in a table or mind map are enough.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Do not plan "Source A says, Source B says" in order. Group the facts by theme, so the plan shows your argument and not the booklet.</p></div>
${keyterms([['plan','the marked planning page for the essay'],['stance','your decision, written at the top'],['theme','one main reason for your decision'],['source letter','the letter that cites a fact, for example Source C'],['own knowledge','syllabus biology that you add'],['counter-argument','the opposing view'],['rebuttal','your evidence-based answer to the opposing view']])}
`},
  reteach:{ h:'Before and after: a list of sources becomes a plan', b:`
<p>Compare a weak plan with the same facts rearranged into a strong plan. No new facts are added: they are only regrouped. Source B (a survey of 120 learners) describes the method, so it is left out, and the sources support three themes here.</p>
<div class="worked"><span class="lbl">Prompt: Should a school provide a free daily fruit break? (illustrative)</span>
<div class="step-line"><b>Before (weak):</b> A: learners eat little fruit. B: a survey of 120 learners. C: the cost per learner. D: test scores. E: absence rates. No decision. No themes. No counter-argument.</div>
<div class="step-line"><b>After (strong):</b></div></div>
${dataTable(['Plan part','Content'],[
 ['Stance','Yes, provide the fruit break.'],
 ['Theme 1: nutrition','Source A: learners eat little fruit. Own knowledge: fruit supplies vitamins and fibre.'],
 ['Theme 2: learning','Source D: test scores. Own knowledge: stable blood glucose supports concentration.'],
 ['Theme 3: attendance','Source E: absence rates. Own knowledge: a better diet supports immune function.'],
 ['Counter-argument','The cost (Source C). Rebuttal: the cost per learner is small compared with the benefits in Themes 1 to 3.']
],{w:560})}
<div class="callout"><span class="lbl">Rule</span><p>A strong plan has a stance, facts grouped under themes with source letters and own knowledge, and a counter-argument with a rebuttal. It should read like the outline of your essay.</p></div>
`},
  qs:[
{type:'mc', stem:`Read the prompt. What should you write <b>first</b> at the top of your plan?`, v:vis(passage('Essay prompt (illustrative)',['Sources A to H discuss a proposal for a no-fishing zone to let a depleted fish stock recover. Write an essay in which you decide whether a coastal village should agree to the zone. Use the sources and your own knowledge.'])), opts:[`Your decision on whether the village should agree to the no-fishing zone`,`A list of the sources in the order from Source A to Source H, with a note on each`,`The first sentence of your introduction, written out in full sentences`,`The conclusion of the essay, written out so that it can be copied later`], ans:0,
 hint:'The plan is built around the position you will defend.',
 sol:`<div class="step-line">Every theme in the plan must support a decision, so the decision (stance) is written at the top.</div><div class="step-line">A list of sources in order has no argument, and the full sentences of the introduction or conclusion belong in the essay, not in the plan.</div><div class="step-line ans">Answer: your decision on whether the village should agree to the no-fishing zone</div>`},
{type:'order', stem:`Put these steps of building an essay plan in the best order.`, items:[`Choose your stance and write it at the top of the plan, once you have seen what the sources support`,`Group the best facts into four themes, with source letters`,`Underline the decision that the prompt requires`,`Finally, add one counter-argument and your rebuttal`,`Skim Sources A to H and mark which side each one supports`], ans:[3,4,1,5,2], hint:'For each step, ask what must already have been done before you can take it.',
 sol:`<div class="step-line">First decode the prompt: underline the decision.</div><div class="step-line">Then skim the sources to see what each supports, and choose your stance once you know what they support.</div><div class="step-line">Then group the facts into themes with source letters, and finally add the counter-argument and rebuttal.</div><div class="step-line ans">Answer order: underline the decision, skim the sources, choose the stance, group into themes, add the counter-argument</div>`},
{type:'mc', stem:`For the no-fishing zone prompt, which of the following is the <b>best essay plan</b>?`, opts:[`Stance: agree to the zone. Four themes, each with source letters and own knowledge. One counter-argument with a rebuttal.`,`Notes on what each of Sources A to H says, in the order A to H, with no decision stated on the page.`,`The full introduction and the first body paragraph, written out in sentences, with no notes for the other themes.`,`Stance: agree to the zone. Reasons: fish are important and the village needs food, with no sources and no counter-argument.`], ans:0,
 hint:'A strong plan has a stance, grouped themes with evidence, and an answer to the opposing view.',
 sol:`<div class="step-line">The strongest plan has a stance, four themes backed by source letters and own knowledge, and a counter-argument with a rebuttal.</div><div class="step-line">A source-by-source list has no stance. Writing sentences is the essay itself, not a plan. A stance with general reasons and no evidence or counter-argument earns few marks.</div><div class="step-line ans">Answer: stance: agree to the zone. Four themes, each with source letters and own knowledge. One counter-argument with a rebuttal.</div>`},
{type:'num', stem:`Each theme in your plan has <b>one</b> source fact and <b>one</b> own-knowledge point, as in the model plan. In total, how many source facts and own-knowledge points do <b>four</b> themes contain?`, ans:8, unit:'points', hint:'Count the points in one theme first, then multiply by the number of themes.',
 sol:`<div class="step-line">One theme: 1 source fact + 1 own-knowledge point = 2 points.</div><div class="step-line">Four themes: 4 × 2 = 8.</div><div class="step-line ans">Answer: 8 points</div>`},
{type:'mc', stem:`A learner's plan for the no-fishing zone prompt is shown below. What is the <b>most serious omission</b>?`, v:vis(dataTable(['Plan part','Content'],[['Stance','Yes, agree to the zone.'],['Theme 1: stock recovery','Source B, plus own knowledge on breeding.'],['Theme 2: spawning','Source D, plus own knowledge on young fish.'],['Theme 3: income','Source F, plus own knowledge on tourism.'],['Theme 4: enforcement','Source H, plus own knowledge on monitoring.']],{w:520}),'An illustrative plan.'), opts:[`There is no counter-argument and no rebuttal to answer the opposing view here`,`The stance is written at the top, but it should be left for the conclusion`,`There are four themes, which is too many for an essay of about three pages`,`Source letters are written in the plan, but they should be saved for the essay`], ans:0,
 hint:'Check the plan against the list: stance, themes, source letters, own knowledge, counter-argument.',
 sol:`<div class="step-line">The plan has a stance, four themes, source letters and own-knowledge points. It has no opposing view and no rebuttal.</div><div class="step-line">The stance belongs at the top. Four themes is a good number, and source letters help the marker, so the other three suggestions are wrong.</div><div class="step-line ans">Answer: there is no counter-argument and no rebuttal to answer the opposing view here</div>`}
]},

{ id:10, name:'Introduction and body paragraphs', short:'Intro and body',
  teach:{ h:'An introduction with a stance, and paragraphs that argue', b:`
<p>An introduction has three jobs: <b>define the key terms</b>, <b>state your stance</b> and <b>signpost the themes</b>. Each body paragraph then argues one theme, using a source fact and an explanation, and returns to the stance. Build every paragraph in this order:</p>
${chain(['Point: a topic sentence that makes the claim for this theme','Evidence: a fact from a source, cited by letter (Source B)','Explanation: the biology that shows why the evidence supports the point','Link: a sentence that returns to your stance'])}
<div class="worked"><span class="lbl">Worked example: a school considers replacing its lawn with an indigenous garden (illustrative)</span>
<div class="step-line"><b>Introduction:</b> "Indigenous plants are species that occur naturally in a region. This essay argues that the school should replace its lawn with an indigenous garden, because the garden would use less water, support more biodiversity and cost less to maintain."</div>
<div class="step-line"><b>Point:</b> An indigenous garden uses far less water than a lawn.</div>
<div class="step-line"><b>Evidence:</b> Source B shows that lawn plots received 900 litres per month, whereas the indigenous plots needed only 250 litres.</div>
<div class="step-line"><b>Explanation:</b> Indigenous plants are adapted to local rainfall, and many have small, waxy leaves that reduce water loss by transpiration.</div>
<div class="step-line ans"><b>Link:</b> Since water is scarce, this supports the decision to replace the lawn.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>One theme per paragraph. Begin with a topic sentence, add a cited source fact and the biology that explains it, and end by linking back to the stance.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Do not write "Source A says... Source B says..." as a list. Use each source as evidence for your point, not as the point.</p></div>
${keyterms([['introduction','defines key terms, states the stance, signposts themes'],['topic sentence','the opening claim of a paragraph'],['evidence','a fact from a source, cited by letter'],['explanation','the biology that links evidence to the point'],['link','a sentence that returns to the stance'],['signpost','tell the reader which themes will follow']])}
`},
  reteach:{ h:'Before and after: rewriting a weak paragraph', b:`
<p>Study a weak paragraph and its rewrite. The facts are the same: the rewrite adds structure and reasoning.</p>
<div class="worked"><span class="lbl">Prompt: Should a coastal wetland be protected from housing? (illustrative)</span>
<div class="step-line"><b>Before:</b> "The wetland is important. Many birds live there. Source F says there are birds. So it is good."</div>
<div class="step-line"><b>What is wrong:</b> there is no claim, the source is mentioned without a figure, nothing is explained and the stance is not mentioned.</div>
<div class="step-line"><b>After:</b> "Protecting the wetland conserves biodiversity. Source F records 41 bird species in the wetland. The shallow water and reeds provide food and nesting sites, so many species depend on them. Building would remove this habitat, which supports the decision to protect the wetland."</div>
<div class="step-line ans">The rewrite has a claim, a source fact, a reason from biology and a link to the stance.</div></div>
${contrast('Weak writing','Strong writing',[
 ['No key term defined and no stance','Defines a key term, states the stance and signposts the themes'],
 ['No clear claim','Opens with a topic sentence'],
 ['"Source C says" with no fact','A figure or fact cited by letter'],
 ['No biological reason','A reason from the syllabus'],
 ['Ends without a conclusion','Ends by returning to the stance']
])}
<div class="callout"><span class="lbl">Rule</span><p>Claim, cited evidence, explanation, link. If one of the four is missing, the paragraph is weaker. Write in formal language and cite sources by letter, for example "Source F".</p></div>
`},
  qs:[
{type:'mc', stem:`Which is the strongest <b>opening</b> for an essay on whether a rural clinic should adopt text-message vaccination reminders?`, opts:[`Vaccination uptake is the proportion of children who are vaccinated on schedule; this essay argues that the clinic should adopt reminders, which raise it.`,`Vaccines are things that doctors give to children, and there are many opinions about whether the use of text messages is a good thing or not for a clinic.`,`I reckon that the clinic should totally use text messages, and I am going to explain exactly why that is the best idea in the whole world.`,`In this essay I will first list Sources A to H and then say what each one of them says about vaccines, reminders and clinics in turn.`], ans:0,
 hint:'A strong opening defines a key term and states the stance.',
 sol:`<div class="step-line">The strongest opening defines a key term (vaccination uptake) and states the stance: the clinic should adopt reminders, with a reason.</div><div class="step-line">The vague opening has no stance. The casual opening uses slang. The opening that lists the sources describes the booklet and not an argument.</div><div class="step-line ans">Answer: Vaccination uptake is the proportion of children who are vaccinated on schedule; this essay argues that the clinic should adopt reminders, which raise it.</div>`},
{type:'mc', stem:`Which is the best <b>topic sentence</b> for a paragraph on the theme of vaccination uptake?`, opts:[`Text-message reminders raise the proportion of children who complete their vaccinations`,`A total of 71% of children were fully vaccinated in the group that received the reminders`,`Many people in rural areas own a cellphone, and many of them use it every single day`,`Some caregivers say that a reminder message is not needed because they always remember`], ans:0,
 hint:'A topic sentence makes a claim that supports the stance and is then backed by evidence.',
 sol:`<div class="step-line">A topic sentence makes a claim for the theme that supports the stance. The evidence follows in the next sentence.</div><div class="step-line">A statistic on its own is evidence, not a claim. A general fact about cellphones is not tied to the theme. A caregiver's objection belongs in the counter-argument paragraph.</div><div class="step-line ans">Answer: text-message reminders raise the proportion of children who complete their vaccinations</div>`},
{type:'text', stem:`In the body of the essay, how do you cite a fact that comes from the <b>third</b> source in the booklet? Write the citation. (two words)`, ans:'Source C', anyCase:true, accept:['(Source C)','Source C.','source c','Source "C"'], ph:'e.g. Source A',
 hint:'Count along the sources in the booklet: Source A, Source B, and so on.',
 sol:`<div class="step-line">Sources are labelled A, B, C and so on. The third source is C, and you cite it as "Source C".</div><div class="step-line ans">Answer: Source C</div>`},
{type:'order', stem:`Put these sentences (from illustrative sources) in the correct order to make one body paragraph.`, items:[`Source D shows that 71% of children in the reminder group were fully vaccinated, compared with 54% in the group without reminders.`,`Therefore, the effect on uptake strengthens the case for adopting reminders at the clinic.`,`Text-message reminders raise the proportion of children who complete their vaccinations.`,`A message prompts caregivers to book a visit before the due date passes, so fewer doses are missed.`], ans:[2,4,1,3], hint:'Ask which sentence makes a claim, and which sentence only makes sense after the others.',
 sol:`<div class="step-line">Point: the claim about reminders raising the proportion who complete their vaccinations.</div><div class="step-line">Evidence: Source D with its figures. Explanation: why a message leads to fewer missed doses.</div><div class="step-line">Link: the final sentence returns to the stance.</div><div class="step-line ans">Answer order: claim, evidence from Source D, explanation, link to the stance</div>`},
{type:'mc', stem:`Read this body paragraph. What is the main <b>weakness</b>? (The source figures are illustrative.)<br><i>"Text-message reminders raise attendance. Source E shows that 84% of caregivers who received reminders attended on time, compared with 61% of those who did not. This supports the decision to adopt reminders."</i>`, opts:[`It gives no explanation of why reminders raise attendance, the step that turns evidence into an argument`,`It begins with a topic sentence, and a body paragraph should begin with the evidence from a source`,`It cites a source by letter, but citations should be kept for the introduction and not the body paragraphs`,`It is too short to earn marks, because a body paragraph should fill most of a page of the answer`], ans:0,
 hint:'The paragraph has a claim, evidence and a link. Which of the four parts is missing?',
 sol:`<div class="step-line">The paragraph has a point, evidence (Source E) and a link. The explanation is missing: it never says why a reminder leads to on-time attendance, for example because it prompts caregivers to plan the visit.</div><div class="step-line">Topic sentences come first, source letters must be cited, and marks are not given for page length.</div><div class="step-line ans">Answer: it gives no explanation of why reminders raise attendance, the step that turns evidence into an argument</div>`}
]},

{ id:11, name:'Counter-arguments and conclusions', short:'Counter-argument, end',
  teach:{ h:'Answer the other side, then close without new arguments', b:`
<p>A strong essay deals fairly with the opposing view and then <b>rebuts</b> it with evidence. The conclusion restates your decision and summarises your themes. It adds nothing new.</p>
${vis(flow(['State the opposing view fairly','Concede what is valid (optional)','Rebut with evidence','Return to the stance']), 'The moves of a counter-argument paragraph.')}
<div class="worked"><span class="lbl">Worked example: a municipality could treat wastewater in a constructed reed bed (illustrative)</span>
<div class="step-line"><b>Counter-argument paragraph:</b> "Critics argue that a reed bed needs more land than a chemical works. This is true. However, Source D shows that the reed bed removed 85% of the nitrates, and the extra land also becomes habitat for birds. The larger footprint therefore does not outweigh the benefits."</div>
<div class="step-line"><b>Conclusion:</b> "In conclusion, the municipality should build reed beds. They remove nitrates efficiently (Source D), cost less to run (Source F) and add habitat, so the recommendation stands."</div>
<div class="step-line ans">The opposing view was stated, partly conceded and rebutted with a fact. The conclusion repeated the recommendation and added no new arguments.</div></div>
${contrast('Include in the conclusion','Leave out of the conclusion',[
 ['The decision, restated','New facts or new sources'],
 ['A short summary of the themes','A new counter-argument'],
 ['Scientific language','Slang, casual phrases or bullet points']
])}
<div class="callout"><span class="lbl">Rule</span><p>Counter-argument: state it fairly, concede what is valid, rebut with evidence, return to the stance. Conclusion: restate the decision and summarise, and use formal scientific language with no bullet points. Place the counter-argument paragraph after the theme paragraphs and before the conclusion.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Dismissing the opposing view without evidence ("they are wrong") earns nothing. Raising a fresh objection in the conclusion weakens a stance that the essay has built.</p></div>
${keyterms([['counter-argument','the opposing view'],['rebuttal','evidence-based reply to the opposing view'],['concede','accept what is valid in the opposing view'],['conclusion','restates the decision and summarises'],['scientific language','precise terms in a formal style'],['register','the level of formality of the writing']])}
`},
  reteach:{ h:'A marked paragraph: sentence by sentence', b:`
<p>See a counter-argument paragraph marked sentence by sentence. Learn the pattern by seeing where marks are lost.</p>
${contrast3(['Sentence','Verdict','Why'],[
 ['"Some people say that drip irrigation is too costly to install."','Good','States the opposing view fairly.'],
 ['"But they are wrong."','Weak','Dismisses the view with no evidence.'],
 ['"Drip irrigation is good because it saves water."','Weak','No source and no figure.'],
 ['"I reckon the farm should just go for it."','Language error','Casual first-person phrasing: not scientific register.']
])}
<div class="worked"><span class="lbl">Worked example: the same paragraph rewritten (illustrative)</span>
<div class="step-line">"Some argue that drip irrigation is costly to install. This is a valid concern. However, Source B shows that drip systems used 40% less water than sprinklers, so the installation cost is recovered through lower water bills. The initial cost therefore does not outweigh the savings."</div>
<div class="step-line ans">Fair statement, concession, evidence-based rebuttal, return to the stance, in formal language.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Replace "they are wrong" with evidence, replace slang with scientific language, and write in sentences, not bullet points.</p></div>
`},
  qs:[
{type:'mc', stem:`The essay argues that a province should approve a drought-tolerant maize variety. Which sentence introduces a <b>counter-argument</b> fairly?`, opts:[`Some farmers object that the new seed is more expensive than the seed that they currently plant.`,`Only a fool would plant the old seed, so anyone who objects to the new seed is plainly wrong.`,`The new seed is cheaper than the old seed, therefore farmers will certainly choose to buy it.`,`Many farmers in the province plant maize each year, and some of them plant it on very small fields.`], ans:0,
 hint:'A counter-argument states the opposing view fairly, without an insult and without supporting your own side.',
 sol:`<div class="step-line">A fair counter-argument states an objection to the stance: the seed costs more.</div><div class="step-line">Insulting the critics is not fair. Saying the seed is cheaper supports the stance. A fact about maize farming is neutral and is not an objection.</div><div class="step-line ans">Answer: Some farmers object that the new seed is more expensive than the seed that they currently plant.</div>`},
{type:'order', stem:`Put these sentences (from illustrative sources) in the correct order to make one counter-argument paragraph.`, items:[`Source E, however, records a yield within 5% of the usual variety in a wet year and 38% more in a dry year.`,`Some farmers fear that the drought-tolerant variety yields less than the usual variety in a wet year.`,`A small loss in a wet year is therefore outweighed by the large gain in a dry year, and the decision to approve the variety stands.`,`This fear is understandable, because rainfall in the province differs from year to year.`], ans:[3,1,4,2], hint:'Ask which sentence cannot be understood until the objection has been raised.',
 sol:`<div class="step-line">First state the opposing view (the farmers' fear), then concede what is valid in it (rainfall differs from year to year).</div><div class="step-line">Then rebut with evidence from Source E, and return to the decision.</div><div class="step-line ans">Answer order: the objection, the concession, the rebuttal with Source E, the return to the decision</div>`},
{type:'text', stem:`The conclusion of the essay should restate your ______ without adding new arguments. (one word)`, ans:'decision', anyCase:true, accept:['stance','position','viewpoint','point of view','decision made','decisions','stances','recommendation','choice'], ph:'one word',
 hint:'It is the position that you chose in the introduction.',
 sol:`<div class="step-line">A conclusion restates the decision (stance) you took and summarises the themes. It does not introduce new facts or objections.</div><div class="step-line ans">Answer: decision</div>`},
{type:'mc', stem:`Read this conclusion (illustrative sources). Which sentence should be <b>removed</b>?<br>(1) <i>In conclusion, the province should approve the drought-tolerant maize for small-scale farmers.</i><br>(2) <i>The variety kept its yield in dry years (Source B) and the extra seed cost was recovered within one season (Source E).</i><br>(3) <i>A new objection is that the seed may not suit sandy soils, which no source has tested.</i><br>(4) <i>For these reasons, the decision to approve the variety stands.</i>`, opts:[`The sentence beginning "In conclusion"`,`The sentence beginning "The variety kept its yield"`,`The sentence beginning "A new objection"`,`The sentence beginning "For these reasons"`], ans:2,
 hint:'A conclusion must not open a new line of argument.',
 sol:`<div class="step-line">The sentence beginning "A new objection" raises a counter-argument for the first time in the conclusion. It weakens the stance and has no rebuttal.</div><div class="step-line">The sentence beginning "In conclusion" restates the decision, the sentence beginning "The variety kept its yield" summarises the themes, and the sentence beginning "For these reasons" returns to the stance.</div><div class="step-line ans">Answer: the sentence beginning "A new objection"</div>`},
{type:'mc', stem:`Which version of this point (illustrative source) uses the best <b>scientific register</b> for an essay?`, opts:[`The drought-tolerant variety maintained a higher yield in dry years (Source B), indicating greater water-use efficiency.`,`The new maize totally smashed it in the drought, so it is way better than the old maize that most farmers in the province know.`,`Higher yield in dry years; cheaper over the longer term; more reliable harvests for small farms (as bullet points).`,`I reckon the new maize did great in the drought because it simply likes dry weather a lot more than the old maize does.`], ans:0,
 hint:'Look for a full sentence with a cited fact and precise terms, with no slang.',
 sol:`<div class="step-line">The best version is a full sentence in formal language, with a cited source and precise terms (yield, water-use efficiency).</div><div class="step-line">Slang ("totally smashed it"), bullet points and chatty first-person phrases ("I reckon") are not scientific register.</div><div class="step-line ans">Answer: The drought-tolerant variety maintained a higher yield in dry years (Source B), indicating greater water-use efficiency.</div>`}
]},

{ id:12, name:'Mini Paper II: sources and essay plan', short:'Mini Paper II',
  teach:{ h:'The routine for every item: command word, evidence, shape, check', b:`
<p>Now put the whole technique together. For every item, run the same four steps. Practise first on this small pack, and then try the mini paper.</p>
${chain(['Read the command word and the marks','Find the evidence in the sources and underline it','Write the answer in the shape the command word needs','Check: one point per mark, source letters, figures, units'])}
${passage('Source P (adapted, illustrative)',['Four tanks were placed in full sun and four in shade. After three weeks, the mean algae cover was 60% in the sun tanks and 25% in the shade tanks. Water temperature and nutrients were the same in all tanks.'])}
<div class="worked"><span class="lbl">Worked example: three items on Source P</span>
<div class="step-line"><b>Calculate</b> the percentage decrease in algae cover from the sun tanks to the shade tanks. (2) Change = 60 − 25 = 35. 35 ÷ 60 × 100 = 58,3% (one decimal place).</div>
<div class="step-line"><b>Suggest</b> why shade lowered the algae cover. (2) Shade gives less light, so less photosynthesis (1), and the algae grow and divide more slowly (1).</div>
<div class="step-line"><b>Evaluate</b> the investigation. (3) Strength: temperature and nutrients were the same. Weakness: only four tanks per treatment. Judgement: a reasonably fair test, but it should be repeated with more tanks.</div>
<div class="step-line ans">Each item got its own shape: working with a unit, reason with biology, strength with weakness and verdict.</div></div>
<div class="callout"><span class="lbl">Essay order</span><p>In the essay, work in this order: decode the prompt, read the sources and plan, write the introduction, the theme paragraphs, the counter-argument paragraph with its rebuttal, and then the conclusion.</p></div>
<div class="callout"><span class="lbl">Rule</span><p>For each item decide three things: what is asked (command word), where the evidence is (source and letter) and how many points the marks require.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>A calculation with no working, a "suggest" that only copies numbers, and an "evaluate" with one side are the three most common ways to lose marks that you already know how to earn.</p></div>
${keyterms([['command word','tells you the answer shape'],['evidence','facts and figures from the sources'],['working','the steps shown in a calculation'],['source letter','cites where a fact came from'],['verdict','the judgement in an evaluate answer'],['stance','your decision in the essay'],['plan','the marked planning page']])}
`},
  reteach:{ h:'Before and after: three weak answers rewritten', b:`
<p>See the typical weak answers and their repaired versions side by side. The fix in each is the same: use the shape the command word asks for.</p>
${passage('Source (adapted, illustrative)',['Mussels on exposed rocks had a mean shell length of 31 mm. Mussels in sheltered pools had a mean shell length of 44 mm. Waves wash away food particles from exposed rocks, and exposed mussels are out of the water for longer at low tide.'])}
${contrast3(['Item','Weak answer','Repaired answer'],[
 ['Suggest why the exposed mussels were smaller. (2)','"They were 31 mm and the others were 44 mm."','Exposed mussels are out of the water longer and feed less (1), so they have less energy for growth (1).'],
 ['Calculate the difference in mean length. (2)','"13" (no working and no unit)','44 − 31 (1) = 13 mm (1).'],
 ['Evaluate the claim "waves stunt mussel growth". (3)','"It is a good claim."','Strength: a clear difference in mean length. Weakness: no sample size is given, and waves are not the only difference between sites. Judgement: partly supported, but not proven.']
])}
${chain(['Which command word, and how many marks?','Where is the evidence: which source, which figure?','Have I used the right shape, with one point per mark?'])}
<div class="callout"><span class="lbl">Rule</span><p>Before you hand in an item, check the shape of the answer against its command word, and check that you have one point for each mark.</p></div>
`},
  qs:[
{type:'mc', stem:`<b>List TWO pieces of evidence</b> from the sources that the insecticide harmed insects other than aphids. (2 marks) Which answer earns both marks?`, v:vis(`${dataTable(['Plot type','Week 0','Week 2','Week 4'],[['Untreated','40','52','64'],['Insecticide','40','6','18'],['Ladybirds','40','22','15']],{w:420})}${passage('Source B (adapted, illustrative)',['Observers counted insect visits to flowers for 30 minutes on each plot type. Bees visited untreated plots 11 times, ladybird plots 10 times and insecticide plots 3 times. Dead hoverflies were found beside sprayed plants, and none were found on the other plots.'])}${passage('Source C (adapted, illustrative)',['The insecticide was sprayed every two weeks at a cost of R180 per plot per season. About 60 ladybirds were released once on each ladybird plot at a cost of R95. Ladybirds were still present in week 4.'])}`,'Source A (illustrative, the table at the top): mean number of aphids per plant.'), opts:[`Bees visited insecticide plots 3 times against 11 on untreated plots; dead hoverflies lay beside sprayed plants (Source B)`,`Aphids fell from 40 to 6 per plant by week 2 (Source A); the insecticide cost R180 for each plot per season (Source C)`,`Bees visited the ladybird plots 10 times (Source B); ladybirds were still present in week 4 on those plots as well (Source C)`,`The insecticide is a poison that also kills useful insects, and bees are needed for the pollination of many flowers`], ans:0,
 hint:'Each mark needs a different fact from the sources about insects other than aphids on the sprayed plots.',
 sol:`<div class="step-line">Source B gives two facts about harm to other insects: bee visits fell to 3 on insecticide plots (11 on untreated plots), and dead hoverflies were found beside sprayed plants.</div><div class="step-line">The aphid and cost facts are not about other insects. The ladybird-plot facts are about a different treatment. The last answer is own knowledge, not evidence from the sources.</div><div class="step-line ans">Answer: bees visited insecticide plots 3 times against 11 on untreated plots; dead hoverflies lay beside sprayed plants (Source B)</div>`},
{type:'num', stem:`Use Source A. Calculate the percentage <b>reduction</b> in the mean number of aphids per plant on the ladybird plots from week 0 to week 4. Give your answer correct to one decimal place.`, v:vis(dataTable(['Plot type','Week 0','Week 2','Week 4'],[['Untreated','40','52','64'],['Insecticide','40','6','18'],['Ladybirds','40','22','15']],{w:420}),'Source A (illustrative): mean number of aphids per plant.'), ans:62.5, unit:'%', hint:'The starting value is the week 0 figure for the ladybird plots.',
 sol:`<div class="step-line">Change = 40 − 15 = 25.</div><div class="step-line">25 ÷ 40 = 0,625, and × 100 = 62,5.</div><div class="step-line ans">Answer: 62,5%</div>`},
{type:'mc', stem:`<b>Suggest</b> why the mean number of aphids rose on the insecticide plots between week 2 and week 4, while it kept falling on the ladybird plots. (2 marks)`, v:vis(`${dataTable(['Plot type','Week 0','Week 2','Week 4'],[['Untreated','40','52','64'],['Insecticide','40','6','18'],['Ladybirds','40','22','15']],{w:420})}${passage('Source C (adapted, illustrative)',['The insecticide was sprayed every two weeks at a cost of R180 per plot per season. About 60 ladybirds were released once on each ladybird plot at a cost of R95. Ladybirds were still present in week 4.'])}`,'Source A (illustrative): mean number of aphids per plant.'), opts:[`The spray wore off between sprayings (Source C), so surviving aphids multiplied, while ladybirds were still present to eat them`,`Ladybirds make a chemical that protects aphids from harm, which allowed the aphids on the sprayed plots to multiply faster than before`,`Fewer bees visited the sprayed plots, and aphids need bees to pollinate them before they are able to reproduce at all`,`The gardeners stopped spraying the insecticide plots after week 2, so the aphids were able to return again quickly`], ans:0,
 hint:'Use Source C to explain both trends: why the insecticide plots rebounded and why the ladybird plots did not.',
