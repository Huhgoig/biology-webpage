${keyterms([['codominance','both alleles fully expressed in the heterozygote'],['roan','red and white hairs together'],['heterozygote','two different alleles'],['superscript','the small raised letter on an allele, as in C<sup>R</sup>'],['AB blood group','I<sup>A</sup> and I<sup>B</sup> both expressed'],['sickle cell trait','a heterozygote that makes two kinds of haemoglobin']])}
`},
  reteach:{ h:'Blended, or both showing?', b:`
<p>Codominance and incomplete dominance are easy to mix up. Use one test: look at the heterozygote and ask <b>"is this one blended thing, or two things I can pick out?"</b></p>
${contrast3(['Feature','Incomplete dominance','Codominance'],[['The heterozygote shows','one in-between phenotype','both phenotypes together'],['The test','blended, one smooth colour','two separate things visible'],['Example','snapdragon: red + white = pink','red blood cell carrying both M and N antigens'],['Two heterozygotes give','1 : 2 : 1','1 : 2 : 1']])}
<p>Whichever pattern it is, a cross is worked the same way: write each parent's gametes, fill the Punnett square, then read each box as its own phenotype.</p>
<p>The MN blood groups are a second blood group system. The alleles are L<sup>M</sup> and L<sup>N</sup>. A person with L<sup>M</sup>L<sup>N</sup> is not a mixture: the red blood cells carry <b>M</b> molecules on their surface and <b>N</b> molecules on their surface.</p>
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">A person has the genotype L<sup>M</sup>L<sup>N</sup>. Tests show M molecules and N molecules on the red blood cells.</div>
<div class="step-line">Ask the test question: is the result one blended thing, or two separate things?</div>
<div class="step-line">Two separate things are present at once. Neither allele is hidden and neither is diluted.</div>
<div class="step-line ans">Neither allele is hidden or diluted, so the pattern is not a blend.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Both showing means codominance. A single in-between phenotype means incomplete dominance. A heterozygote that looks like one homozygote means complete dominance.</p></div>
`},
  qs:[
{type:'mc', stem:`In a certain flower species, a red-petalled plant is crossed with a white-petalled plant. The offspring have petals that are red with white spots. Which statement is correct?`, opts:['Both alleles are fully expressed at once in the heterozygote','One allele is dominant and completely masks the other allele','The alleles have blended into a new pink colour for the petals','The offspring have lost one of the two alleles from their cells'], ans:0,
 hint:'Can you still see both parental colours?',
 sol:`<div class="step-line">The offspring show red and white at the same time, so both alleles are doing their job.</div><div class="step-line">If one allele were dominant, the offspring would be only red or only white. If the alleles blended, there would be one in-between colour such as pink.</div><div class="step-line">Offspring receive one allele from each parent, so no allele is lost.</div><div class="step-line ans">Answer: Both alleles are fully expressed at once in the heterozygote</div>`},
{type:'text', stem:`Name the type of inheritance in which both alleles of a gene are fully expressed in the heterozygote, as in the AB blood group.`, ans:'codominance', anyCase:true, accept:['codominant','co-dominance','co-dominant','codominant inheritance'], ph:'one word',
 hint:'Think "co" as in together, and dominance.',
 sol:`<div class="step-line">In the AB blood group, I<sup>A</sup> and I<sup>B</sup> are both expressed, neither masks the other and neither is diluted.</div><div class="step-line">Both alleles dominate together: this is codominance.</div><div class="step-line ans">Answer: codominance</div>`},
{type:'ratio', stem:`A man with sickle cell trait (Hb<sup>A</sup>Hb<sup>S</sup>) and a woman with sickle cell disease (Hb<sup>S</sup>Hb<sup>S</sup>) have children. The heterozygote makes both normal and sickle haemoglobin. Give the ratio of children with sickle cell trait : children with sickle cell disease.`, ans:{a:1,b:1},
 hint:'Gametes of the man: HbA and HbS. Gametes of the woman: HbS only.',
 sol:`<div class="step-line">Gametes of the man: Hb<sup>A</sup> and Hb<sup>S</sup>. Gametes of the woman: Hb<sup>S</sup> only.</div><div class="step-line">Boxes: Hb<sup>A</sup>Hb<sup>S</sup>, Hb<sup>S</sup>Hb<sup>S</sup>, Hb<sup>A</sup>Hb<sup>S</sup>, Hb<sup>S</sup>Hb<sup>S</sup>.</div><div class="step-line">Trait (Hb<sup>A</sup>Hb<sup>S</sup>): 2 boxes. Disease (Hb<sup>S</sup>Hb<sup>S</sup>): 2 boxes.</div><div class="step-line ans">Answer: 1 : 1</div>`},
{type:'mc', stem:`In the MN blood group system the alleles L<sup>M</sup> and L<sup>N</sup> are <b>codominant</b>. Two parents both have the genotype L<sup>M</sup>L<sup>N</sup>. What is the probability that a child has blood group M (genotype L<sup>M</sup>L<sup>M</sup>)?`, opts:['0%','25%','50%','75%'], ans:1,
 hint:'Two heterozygotes cross. How many of the four boxes are LMLM?',
 sol:`<div class="step-line">Gametes of each parent: L<sup>M</sup> and L<sup>N</sup>.</div><div class="step-line">Boxes: L<sup>M</sup>L<sup>M</sup>, L<sup>M</sup>L<sup>N</sup>, L<sup>M</sup>L<sup>N</sup>, L<sup>N</sup>L<sup>N</sup>.</div><div class="step-line">Only 1 of the 4 boxes is L<sup>M</sup>L<sup>M</sup>. 50% would be the share of group MN children, and 75% would apply if one allele were dominant.</div><div class="step-line ans">Answer: 25%</div>`},
{type:'mc', stem:`A learner writes: "Roan cattle prove that inheritance is blending, because a roan coat is a mixture of red and white." Which response is best?`, opts:['Wrong: red hairs and white hairs are both fully expressed, so the alleles stay separate','Correct: the red and white alleles have mixed together and cannot be separated again','Wrong: roan is a dominant phenotype, so the red allele is hidden in the heterozygous animal','Correct: a roan coat is an in-between colour made when the two alleles fuse together'], ans:0,
 hint:'Look closely at the hairs. Is there one new colour, or two?',
 sol:`<div class="step-line">A roan coat has red hairs and white hairs side by side. No new colour has formed.</div><div class="step-line">Each allele is fully expressed in its own hairs, so this is codominance, and the alleles remain separate. A roan bull still makes gametes carrying C<sup>R</sup> or C<sup>W</sup>.</div><div class="step-line">Roan is not a dominant phenotype hiding red, because red is plainly visible. Blending would give one mixed colour and would make the alleles inseparable, which is not what happens.</div><div class="step-line ans">Answer: Wrong: red hairs and white hairs are both fully expressed, so the alleles stay separate</div>`}
]},

{ id:8, name:'Multiple alleles and ABO blood groups', short:'ABO blood groups',
  teach:{ h:'Three alleles control the ABO blood groups', b:`
<p>Some genes have <b>more than two alleles</b> in the population. These are called <b>multiple alleles</b>. The ABO blood group gene has three: I<sup>A</sup>, I<sup>B</sup> and i. A person still carries only <b>two</b> of them. I<sup>A</sup> and I<sup>B</sup> are codominant, and both are dominant to i.</p>
${contrast3(['Blood group','Possible genotypes','Number of genotypes'],[['A','I<sup>A</sup>I<sup>A</sup> or I<sup>A</sup>i','2'],['B','I<sup>B</sup>I<sup>B</sup> or I<sup>B</sup>i','2'],['AB','I<sup>A</sup>I<sup>B</sup>','1'],['O','ii','1']])}
${vis(punnett(['I^A','i'],['I^A','i'],{top:'Gametes of group A parent 1', side:'Gametes of group A parent 2'}),'Two group A parents (I<sup>A</sup>i × I<sup>A</sup>i): 3 group A : 1 group O')}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">A group A father (<b>I<sup>A</sup>i</b>) and a group B mother (<b>I<sup>B</sup>I<sup>B</sup></b>) have a child.</div>
<div class="step-line">Gametes of the father: I<sup>A</sup> and i. Gametes of the mother: I<sup>B</sup> only.</div>
<div class="step-line">Boxes: I<sup>A</sup>I<sup>B</sup>, I<sup>B</sup>i, I<sup>A</sup>I<sup>B</sup>, I<sup>B</sup>i.</div>
<div class="step-line">I<sup>A</sup>I<sup>B</sup> is group AB. I<sup>B</sup>i is group B, because I<sup>B</sup> is dominant to i.</div>
<div class="step-line ans">Possible children: group AB or group B, in a 1 : 1 ratio.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Group AB always needs one of each dominant allele. Groups A and B each have two possible genotypes, so use a parent's children to find out which one the parent has.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>A person has only two alleles, so a genotype such as I<sup>A</sup>I<sup>B</sup>i is impossible. Three alleles exist in the population, not in one person.</p></div>
${keyterms([['multiple alleles','a gene with more than two alleles in the population'],['codominant','both alleles fully expressed'],['I<sup>A</sup>, I<sup>B</sup>','alleles for blood group A and B'],['i','the recessive allele, for group O'],['blood group','the phenotype of the ABO gene']])}
`},
  reteach:{ h:'Paternity by elimination', b:`
<p>Recall level 3: a child's genotype is built from one gamete of each parent, and each blood group is read from the alleles the child carries. Blood groups are often used to show that a man <b>cannot</b> be the father. They can exclude a man; they can never prove that he is the father. The method is elimination: a child receives <b>one allele from each parent</b>, so take away the mother's allele and see what the father must have supplied.</p>
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">A woman of group A (I<sup>A</sup>i) has a child of group B (I<sup>B</sup>i). Which men could be the father?</div>
<div class="step-line">The child has the alleles I<sup>B</sup> and i. The mother has no I<sup>B</sup>, so the I<sup>B</sup> came from the father.</div>
<div class="step-line">The father must therefore carry I<sup>B</sup>. Check each blood group in turn:</div>
<div class="step-line">Group A (I<sup>A</sup>I<sup>A</sup> or I<sup>A</sup>i): no I<sup>B</sup>, so excluded. Group O (ii): no I<sup>B</sup>, so excluded.</div>
<div class="step-line">Group B (I<sup>B</sup>I<sup>B</sup> or I<sup>B</sup>i): has I<sup>B</sup>, so possible. Group AB (I<sup>A</sup>I<sup>B</sup>): has I<sup>B</sup>, so possible.</div>
<div class="step-line ans">The father could be group B or group AB. Groups A and O are excluded.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Write the child's two alleles. Subtract the mother's allele. The allele that is left must have come from the father. Any man who lacks it is excluded.</p></div>
`},
  qs:[
{type:'mc', stem:`Which genotype could belong to a person with blood group <b>O</b>?`, opts:['ii: two copies of the recessive allele','I<sup>A</sup>i: one dominant and one recessive allele','I<sup>B</sup>i: one dominant and one recessive allele','I<sup>A</sup>I<sup>B</sup>: both dominant alleles'], ans:0,
 hint:'Group O shows only when no I allele is present.',
 sol:`<div class="step-line">Both I<sup>A</sup> and I<sup>B</sup> are dominant to i, so any genotype with an I allele shows group A, B or AB.</div><div class="step-line">Group O needs two copies of the recessive allele.</div><div class="step-line">I<sup>A</sup>i is group A, I<sup>B</sup>i is group B and I<sup>A</sup>I<sup>B</sup> is group AB.</div><div class="step-line ans">Answer: ii: two copies of the recessive allele</div>`},
{type:'mc', stem:`A woman of blood group B (genotype I<sup>B</sup>i) and a man of blood group O have children. Which blood groups are possible among their children?`, opts:['Group B or group O','Group B only','Group O only','Group A or group B'], ans:0,
 hint:'List the gametes of each parent. The man can give only i.',
 sol:`<div class="step-line">Gametes of the woman: I<sup>B</sup> and i. Gametes of the man (ii): i only.</div><div class="step-line">Boxes: I<sup>B</sup>i and ii, each twice.</div><div class="step-line">I<sup>B</sup>i is group B and ii is group O.</div><div class="step-line">Group B only would be correct only if the woman were I<sup>B</sup>I<sup>B</sup>. Group A would need an I<sup>A</sup> allele, which neither parent has.</div><div class="step-line ans">Answer: Group B or group O</div>`},
{type:'frac', stem:`A group A father (I<sup>A</sup>i) and a group B mother (I<sup>B</sup>i) have a child. What is the probability that the child has blood group <b>O</b>? Give a fraction.`, ans:{n:1,d:4},
 hint:'Group O needs an i from each parent. Fill the square.',
 sol:`<div class="step-line">Gametes of the father: I<sup>A</sup> and i. Gametes of the mother: I<sup>B</sup> and i.</div><div class="step-line">Boxes: I<sup>A</sup>I<sup>B</sup> (AB), I<sup>A</sup>i (A), I<sup>B</sup>i (B), ii (O).</div><div class="step-line">Only 1 of the 4 boxes is group O.</div><div class="step-line ans">Answer: 1/4</div>`},
{type:'mc', stem:`A man of blood group AB is accused of being the father of a child of blood group O. Could he be the father?`, opts:['No, because the child needs an i from each parent and he has no i allele','Yes, because group AB is a mixture of the group A and the group O alleles','No, because every child of a group AB parent must also have group AB blood','Yes, because the mother could supply both of the i alleles to the child'], ans:0,
 hint:'Write the genotype of a group O child, then ask which parent supplies each allele.',
 sol:`<div class="step-line">A group O child has the genotype ii, so one i came from each parent.</div><div class="step-line">A group AB man is I<sup>A</sup>I<sup>B</sup>. He has no i to give, so he is excluded.</div><div class="step-line">AB is not a mixture of A and O. A group AB parent can also have children of group A or B, so the third option is wrong. A mother gives only one allele to a child, so the fourth option is wrong.</div><div class="step-line ans">Answer: No, because the child needs an i from each parent and he has no i allele</div>`},
{type:'mc', stem:`A woman of blood group A and a man of blood group B have a child of blood group <b>O</b>. Which genotypes are possible for the parents?`, opts:['I<sup>A</sup>i and I<sup>B</sup>i, because each parent must be able to give an i allele','I<sup>A</sup>I<sup>A</sup> and I<sup>B</sup>i, because only the father needs to pass on an i allele','I<sup>A</sup>i and I<sup>B</sup>I<sup>B</sup>, because only the mother needs to pass on an i allele','I<sup>A</sup>I<sup>A</sup> and I<sup>B</sup>I<sup>B</sup>, because two homozygous parents mix alleles'], ans:0,
 hint:'A group O child is ii. Each parent supplies one of the two i alleles.',
 sol:`<div class="step-line">The child is ii, so both parents gave an i allele.</div><div class="step-line">A group A parent who can give i must be I<sup>A</sup>i. A group B parent who can give i must be I<sup>B</sup>i.</div><div class="step-line">I<sup>A</sup>I<sup>A</sup> and I<sup>B</sup>I<sup>B</sup> have no i allele. Two such parents could only have a child of group AB.</div><div class="step-line ans">Answer: I<sup>A</sup>i and I<sup>B</sup>i, because each parent must be able to give an i allele</div>`}
]},
{ id:9, name:'Sex determination', short:'Sex determination',
  teach:{ h:'The father decides the sex of the child', b:`
<p>A human body cell has <b>46 chromosomes</b>, arranged as 23 pairs. Twenty-two of the pairs are <b>autosomes</b>: they carry genes for body traits and look the same in males and females. The 23rd pair is the <b>sex chromosomes</b>. A female has two X chromosomes (XX). A male has one X and one Y (XY).</p>
${vis(punnett(['X','X'],['X','Y'],{top:'Eggs from the mother', side:'Sperm from the father'}),'Every egg carries X. A sperm carries either X or Y')}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">A human body cell has 46 chromosomes. Two of them are the sex chromosomes, so 44 are not.</div>
<div class="step-line">44 chromosomes in pairs is 22 pairs.</div>
<div class="step-line">A body cell of a female has 22 pairs of non-sex chromosomes plus XX. A body cell of a male has 22 pairs of non-sex chromosomes plus XY.</div>
<div class="step-line ans">Body cell: 22 pairs + XX (female) or 22 pairs + XY (male).</div></div>
<div class="callout"><span class="lbl">Rule</span><p>The egg always carries X, so the sperm decides the sex. An X sperm gives a girl (XX) and a Y sperm gives a boy (XY).</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>The mother does not decide the sex. Every egg carries an X, so only the father's sperm can make the difference.</p></div>
${keyterms([['autosomes','the 22 pairs of chromosomes that are not sex chromosomes'],['sex chromosomes','the pair that determines sex: XX or XY'],['X chromosome','present in both sexes, carries many genes'],['Y chromosome','present in males only, carries the male-determining gene'],['gamete','a sperm or egg with 23 chromosomes']])}
`},
  reteach:{ h:'Chance has no memory', b:`
<p>Recall levels 2 and 3: each parent makes gametes, and a Punnett square pairs every gamete of one parent with every gamete of the other. Here the gametes carry sex chromosomes instead of alleles. Try filling the empty square below before you read on.</p>
<p>Every fertilisation is a separate event. A sperm that carries X or a sperm that carries Y reaches the egg first, with equal chance. What happened to earlier children makes no difference.</p>
${contrast('What the family already has','Chance that the next baby is a boy',[['no children yet','1 in 2'],['four daughters','1 in 2'],['two sons and one daughter','1 in 2']])}
${vis(punnettBlank(['X','Y'],['X','X'],{top:'Gametes of the father', side:'Gametes of the mother'}),'The same cross turned round, with the boxes left empty')}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">A couple already has four daughters and is expecting a fifth child.</div>
<div class="step-line">The father makes X sperm and Y sperm in equal numbers.</div>
<div class="step-line">The sperm that fertilises the egg this time is not influenced by the four sperm in the past.</div>
<div class="step-line ans">The chance of a son is still 1 in 2, and the chance of a daughter is 1 in 2.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Past children never change the probability for the next one. The probability for each baby is 1 in 2 for each sex.</p></div>
`},
  qs:[
{type:'frac', stem:`A couple is expecting a baby. What is the probability that the baby is a <b>girl</b>? Give a fraction.`, ans:{n:1,d:2},
 hint:'Half of the sperm carry X and half carry Y.',
 sol:`<div class="step-line">The egg always carries X. Half of the sperm carry X (giving XX, a girl) and half carry Y (giving XY, a boy).</div><div class="step-line">2 of the 4 boxes are XX.</div><div class="step-line ans">Answer: 1/2</div>`},
{type:'mc', stem:`Which parent determines the sex of a child, and why?`, opts:['The father, because his sperm carry either an X or a Y chromosome','The mother, because only she carries X chromosomes in her egg cells','The father, because the Y chromosome is dominant to the X chromosome','Both equally, because each parent supplies an X or a Y at random'], ans:0,
 hint:'Which parent can supply two different kinds of sex chromosome in gametes?',
 sol:`<div class="step-line">Every egg carries X, so the mother always supplies an X. The father supplies X in half of his sperm and Y in the other half.</div><div class="step-line">So the sperm decides whether the child is XX or XY.</div><div class="step-line">The mother does not decide it, because all her eggs are alike. The Y is not "dominant" here: it simply makes the child male. A mother does not supply X or Y at random.</div><div class="step-line ans">Answer: The father, because his sperm carry either an X or a Y chromosome</div>`},
{type:'mc', stem:`How many <b>autosomes</b> does a human sperm cell contain?`, opts:['22','23','44','46'], ans:0,
 hint:'A gamete has half the 44 non-sex chromosomes of a body cell.',
 sol:`<div class="step-line">A body cell has 44 non-sex chromosomes. A gamete has half of that number.</div><div class="step-line">44 divided by 2 is 22. The sperm's 23rd chromosome is a sex chromosome, so it is not counted as an autosome.</div><div class="step-line">23 counts the sex chromosome as well. 44 is the number in a body cell and 46 is the total in a body cell.</div><div class="step-line ans">Answer: 22</div>`},
{type:'text', stem:`What name is given to the 22 pairs of human chromosomes that are <b>not</b> sex chromosomes?`, ans:'autosomes', anyCase:true, accept:['autosome','the autosomes','autosomal chromosomes'], ph:'one word',
 hint:'It starts with the Greek word for self; they are the body chromosomes.',
 sol:`<div class="step-line">The chromosomes that do not determine sex are called autosomes.</div><div class="step-line">They are the same in males and females. Only the 23rd pair differs, XX or XY.</div><div class="step-line ans">Answer: autosomes</div>`},
{type:'mc', stem:`A couple has five sons and is expecting a sixth child. A learner says: "It is more likely to be a girl now, to balance things out." Which response is correct?`, opts:['The chance of a girl is still 1 in 2, because each sperm is equally likely to carry X or Y','The chance of a girl is higher than 1 in 2, because the X sperm of the father have been used up','The chance of a girl is 1 in 6, because five of the six children are already boys','The chance of a girl is lower than 1 in 2, because this father seems to make mostly Y sperm'], ans:0,
 hint:'Does an earlier fertilisation change the sperm that reaches the egg this time?',
 sol:`<div class="step-line">Each fertilisation is a separate event. The father makes X sperm and Y sperm in equal numbers, and either can reach the egg.</div><div class="step-line">So the chance of a girl is 1 in 2, whatever the earlier children were.</div><div class="step-line">The father cannot run out of X sperm. 1 in 6 mixes up the number of children with the probability. Five sons in a row is unusual, but it does not show the father makes more Y sperm.</div><div class="step-line ans">Answer: The chance of a girl is still 1 in 2, because each sperm is equally likely to carry X or Y</div>`}
]},

{ id:10, name:'Sex-linked inheritance', short:'Sex-linked inheritance',
  teach:{ h:'Some genes sit on the X chromosome', b:`
<p>A <b>sex-linked</b> gene is carried on a sex chromosome. Most are on the X chromosome. The Y chromosome is much shorter and carries no matching allele. Haemophilia (blood clots very slowly) is caused by a recessive allele on the X. We write X<sup>H</sup> for the normal allele and X<sup>h</sup> for the haemophilia allele.</p>
${contrast3(['Genotype','Sex','Phenotype'],[['X<sup>H</sup>X<sup>H</sup>','female','normal'],['X<sup>H</sup>X<sup>h</sup>','female','normal (a carrier)'],['X<sup>h</sup>X<sup>h</sup>','female','haemophilia'],['X<sup>H</sup>Y','male','normal'],['X<sup>h</sup>Y','male','haemophilia']])}
${vis(punnett(['X^H','X^H'],['X^h','Y'],{top:'Gametes of the mother', side:'Gametes of the father'}),'Normal mother (X<sup>H</sup>X<sup>H</sup>) × father with haemophilia (X<sup>h</sup>Y)')}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">A normal mother <b>X<sup>H</sup>X<sup>H</sup></b> and a father with haemophilia <b>X<sup>h</sup>Y</b> have children.</div>
<div class="step-line">Every egg carries X<sup>H</sup>. The father's sperm carry X<sup>h</sup> or Y.</div>
<div class="step-line">An X<sup>h</sup> sperm gives a daughter, X<sup>H</sup>X<sup>h</sup>. A Y sperm gives a son, X<sup>H</sup>Y.</div>
<div class="step-line">The daughters have normal clotting because X<sup>H</sup> is dominant, but they carry the h allele. The sons have no h allele.</div>
<div class="step-line ans">All sons are normal. All daughters are normal but carry one h allele.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>A male has one X chromosome and a female has two. A female with X<sup>H</sup>X<sup>h</sup> is a <b>carrier</b>.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Write the male as X<sup>h</sup>Y, with only one allele. Never write X<sup>h</sup>Y<sup>h</sup>, because the Y carries no allele for this gene.</p></div>
${keyterms([['sex-linked','a gene carried on a sex chromosome, usually the X'],['carrier','a person with one recessive allele who is unaffected'],['haemophilia','a disorder in which blood clots slowly'],['colour blindness','a disorder in which red and green are confused'],['X-linked recessive','a recessive allele on the X chromosome']])}
`},
  reteach:{ h:'A boy gets his X from his mother', b:`
<p>You can solve most sex-linked questions without a Punnett square. Use two facts: a <b>son</b> gets his Y from his father, so his only X comes from his <b>mother</b>. A <b>daughter</b> gets one X from each parent, so her father's X always goes to his daughters.</p>
${contrast('Child','Where each sex chromosome comes from',[['Son (XY)','X from the mother, Y from the father'],['Daughter (XX)','one X from the mother and one X from the father']])}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">Mother X<sup>H</sup>X<sup>h</sup> (unaffected, with one h allele). Father X<sup>h</sup>Y (affected).</div>
<div class="step-line"><b>Sons:</b> the Y comes from the father. The X comes from the mother: X<sup>H</sup> or X<sup>h</sup> with equal chance. So half of the sons are affected.</div>
<div class="step-line"><b>Daughters:</b> the father's X is X<sup>h</sup>, always. The mother's X is X<sup>H</sup> or X<sup>h</sup>. So half of the daughters are X<sup>H</sup>X<sup>h</sup> (unaffected) and half are X<sup>h</sup>X<sup>h</sup> (affected).</div>
<div class="step-line ans">Half of the sons and half of the daughters are affected.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>For a son, look only at the mother's alleles. For a daughter, look at both parents' X chromosomes. A father can never pass an X-linked allele to his son.</p></div>
`},
  qs:[
{type:'mc', stem:`A woman with the genotype X<sup>H</sup>X<sup>h</sup> and her brother with the genotype X<sup>h</sup>Y each carry one haemophilia allele (h), yet only <b>he</b> has haemophilia. Why?`, opts:['Her second X carries the dominant allele, which masks h; he has no second allele for this gene','X-linked alleles are expressed only in males, because females switch off both of their X chromosomes','The h allele is dominant in males and recessive in females, so it shows in him but not in her','She inherited h from her father and he inherited it from his mother, so her copy is switched off'], ans:0,
 hint:'Compare what is on the other chromosome of the pair in her and in him.',
 sol:`<div class="step-line">She has two X chromosomes. Her second X carries H, which is dominant and masks h, so she has normal clotting.</div><div class="step-line">He has one X and a Y. The Y carries no matching allele, so nothing masks h on his X and he has haemophilia.</div><div class="step-line">The h allele is recessive in both sexes, so it is not dominant in males. X chromosomes are not switched off in this way, and she did not necessarily get h from her father: his X goes to all his daughters, but here only her brother is affected, so the h came from her mother.</div><div class="step-line ans">Answer: Her second X carries the dominant allele, which masks h; he has no second allele for this gene</div>`},
{type:'frac', stem:`Red-green colour blindness is caused by a recessive allele (X<sup>b</sup>) on the X chromosome. A woman with normal vision who is a carrier (X<sup>B</sup>X<sup>b</sup>) has children with a man with normal vision (X<sup>B</sup>Y). What is the probability that a child, of either sex, is a <b>colour-blind son</b>? Give a fraction of <b>all</b> the children.`, ans:{n:1,d:4},
 hint:'Fill the square, then count the boxes that read XbY out of all four boxes.',
 sol:`<div class="step-line">Gametes of the mother: X<sup>B</sup> and X<sup>b</sup>. Gametes of the father: X<sup>B</sup> and Y.</div><div class="step-line">Boxes: X<sup>B</sup>X<sup>B</sup>, X<sup>B</sup>X<sup>b</sup>, X<sup>B</sup>Y and X<sup>b</sup>Y.</div><div class="step-line">Only X<sup>b</sup>Y is a colour-blind son: 1 of 4 boxes.</div><div class="step-line ans">Answer: 1/4</div>`},
{type:'text', stem:`What term is used for a woman with the genotype X<sup>B</sup>X<sup>b</sup> who has normal vision but can pass the colour blindness allele on to her children?`, ans:'carrier', anyCase:true, accept:['a carrier','carriers','heterozygous carrier','heterozygous','heterozygote','a heterozygote'], ph:'one word',
 hint:'She carries the allele without showing the condition.',
 sol:`<div class="step-line">She has one recessive allele but her dominant allele masks it, so she has normal vision.</div><div class="step-line">She can still pass the allele on, so she is a carrier.</div><div class="step-line ans">Answer: carrier</div>`},
{type:'mc', stem:`Which genotype belongs to a colour-blind <b>male</b>? (B is normal vision, b is colour blindness.)`, opts:['X<sup>b</sup>Y: a male with one recessive allele','X<sup>B</sup>Y: a male with normal vision','X<sup>b</sup>X<sup>b</sup>: a female with two recessive alleles','X<sup>B</sup>X<sup>b</sup>: a female carrier'], ans:0,
 hint:'A male has one X and one Y. The Y carries no allele for this gene.',
 sol:`<div class="step-line">A male has only one X, so one recessive allele (X<sup>b</sup>) is enough.</div><div class="step-line">His genotype is X<sup>b</sup>Y. X<sup>B</sup>Y is a male with normal vision.</div><div class="step-line">X<sup>b</sup>X<sup>b</sup> is a colour-blind female, and X<sup>B</sup>X<sup>b</sup> is a female carrier. Neither is male.</div><div class="step-line ans">Answer: X<sup>b</sup>Y: a male with one recessive allele</div>`},
{type:'mc', stem:`A colour-blind woman (X<sup>b</sup>X<sup>b</sup>) has children with a man with normal vision (X<sup>B</sup>Y). Which prediction is correct?`, opts:['All sons are colour-blind and all daughters are unaffected carriers','Half the sons are colour-blind and all the daughters are unaffected','All children have normal vision because the father has normal vision','All daughters are colour-blind and all sons have normal vision'], ans:0,
 hint:'Sons get their X from their mother. Daughters get one X from each parent.',
 sol:`<div class="step-line">Gametes of the mother: X<sup>b</sup> only. Gametes of the father: X<sup>B</sup> and Y.</div><div class="step-line">Daughters: X<sup>B</sup>X<sup>b</sup>. They have normal vision and carry the allele.</div><div class="step-line">Sons: X<sup>b</sup>Y. Every son gets the mother's only X, so every son is colour-blind.</div><div class="step-line">Half the sons colour-blind would need a carrier mother. The father's normal vision does not protect his sons, because he passes them only his Y.</div><div class="step-line ans">Answer: All sons are colour-blind and all daughters are unaffected carriers</div>`}
]},
{ id:11, name:'Pedigree diagrams', short:'Pedigree diagrams',
  teach:{ h:'A pedigree is a family tree for one trait', b:`
<p>A <b>pedigree diagram</b> follows one trait through a family. <b>Squares</b> are males and <b>circles</b> are females. A <b>filled</b> symbol is an affected person and an open symbol is unaffected. A half-shaded symbol is a carrier. A horizontal line joins a couple, and a vertical line drops to their children. Roman numerals (I, II, III) are the generations.</p>
${vis(pedigree({gens:[[{id:'I-1',s:'m',a:true},{id:'I-2',s:'f'}],[{id:'II-1',s:'f'},{id:'II-2',s:'m',a:true},{id:'II-3',s:'f',a:true},{id:'II-4',s:'m',a:true}],[{id:'III-1',s:'f'},{id:'III-2',s:'m',a:true}]],mates:[['I-1','I-2'],['II-3','II-4']],kids:[{p:['I-1','I-2'],c:['II-1','II-2','II-3']},{p:['II-3','II-4'],c:['III-1','III-2']}]}),'A family in which a genetic condition occurs (filled symbols are affected)')}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">Look at the couple <b>II-3 and II-4</b>. Both are affected.</div>
<div class="step-line">Their daughter <b>III-1</b> is unaffected.</div>
<div class="step-line">If the condition were recessive, both parents would have two recessive alleles and could only pass on recessive alleles, so every child would be affected.</div>
<div class="step-line">An unaffected child means that the parents carry a dominant allele and a hidden normal allele, so both parents are heterozygous.</div>
<div class="step-line">Autosomal or X-linked? A daughter with an X-linked recessive condition must receive an affected X from her father. So an affected daughter of an unaffected father means the recessive condition is autosomal.</div>
<div class="step-line">A child of an affected parent always receives one copy of that parent's allele. For a recessive condition (dd), every child of a dd parent receives one d.</div>
<div class="step-line ans">Two affected parents with an unaffected child: the condition is dominant.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Look for a child whose phenotype differs from both parents. <b>Two unaffected parents with an affected child</b> means the allele is recessive. <b>Two affected parents with an unaffected child</b> means the allele is dominant.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Always justify with named individuals, such as "I-1 and I-2 are unaffected but II-1 is affected". The examiner awards the mark for the evidence, not just for the word "recessive".</p></div>
${keyterms([['pedigree','a diagram of a trait through generations'],['affected','shows the trait (filled symbol)'],['carrier','heterozygous and unaffected (half-shaded)'],['generation','a row in the pedigree, I, II, III'],['autosomal','the gene is on a non-sex chromosome'],['X-linked','the gene is on the X chromosome']])}
`},
  reteach:{ h:'Three questions for every pedigree', b:`
<p>Recall levels 3 and 4: the genotypes of the parents decide what their children can be, so reading a pedigree is working a cross backwards. You can read any pedigree by asking three questions in order. Here they are, followed by a pedigree different from the one before.</p>
${chain(['Do two <b>unaffected</b> parents have an affected child? If yes, the allele is <b>recessive</b>.','Do two <b>affected</b> parents have an unaffected child? If yes, the allele is <b>dominant</b>.','Autosomal or X-linked? For a recessive allele, an affected <b>daughter</b> of an unaffected father means <b>autosomal</b> (an X-linked recessive daughter needs an affected father). If only males are affected and a person who married in cannot carry the allele, it is <b>X-linked</b>.'])}
${vis(pedigree({gens:[[{id:'I-1',s:'m'},{id:'I-2',s:'f'}],[{id:'II-1',s:'m',a:true},{id:'II-2',s:'m'},{id:'II-3',s:'f'},{id:'II-4',s:'m'}],[{id:'III-1',s:'m',a:true},{id:'III-2',s:'f'}]],mates:[['I-1','I-2'],['II-3','II-4']],kids:[{p:['I-1','I-2'],c:['II-1','II-2','II-3']},{p:['II-3','II-4'],c:['III-1','III-2']}]}),'Another family. Individual II-4 married into the family and does not carry the allele')}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line"><b>Question 1:</b> I-1 and I-2 are unaffected but their son II-1 is affected. So the allele is recessive.</div>
<div class="step-line"><b>Question 2:</b> No affected parents appear, so there is nothing to check for dominance.</div>
<div class="step-line"><b>Question 3:</b> Only males are affected. II-3 and II-4 are unaffected and have an affected son, III-1. II-4 married in and does not carry the allele, so III-1 cannot have inherited it from him.</div>
<div class="step-line">So III-1 got the allele from his mother II-3, on her X chromosome.</div>
<div class="step-line ans">The condition is X-linked recessive.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>In X-linked recessive inheritance an affected male passes the allele to his daughters, who are unaffected, and they pass it on to their sons. In many pedigrees it appears to skip a generation.</p></div>
`},
  qs:[
{type:'mc', stem:`The pedigree shows a family in which some members have a genetic condition. Which row gives the mode of inheritance with the correct reason?`,
 v:vis(pedigree({gens:[[{id:'I-1',s:'m'},{id:'I-2',s:'f'}],[{id:'II-1',s:'f',a:true},{id:'II-2',s:'m'},{id:'II-3',s:'m',a:true}]],mates:[['I-1','I-2']],kids:[{p:['I-1','I-2'],c:['II-1','II-2','II-3']}]}),'A family with a genetic condition'),
 opts:['Autosomal recessive, because two unaffected parents have an affected daughter','X-linked recessive, because two unaffected parents have an affected son','Autosomal dominant, because the condition appears in a daughter and in a son','X-linked dominant, because the affected daughter inherited the allele from her mother'], ans:0,
 hint:'Two unaffected parents with an affected child tell you something. Then ask whether the affected child is a girl.',
 sol:`<div class="step-line">I-1 and I-2 are unaffected but II-1 and II-3 are affected, so the allele is recessive.</div><div class="step-line">II-1 is an affected daughter. An X-linked recessive daughter needs an affected father, but I-1 is unaffected, so the condition is autosomal.</div><div class="step-line">Option two ignores the affected daughter. Option three fails because the parents are unaffected, so there is no dominant allele to inherit. Option four is wrong for the same reason.</div><div class="step-line ans">Answer: Autosomal recessive, because two unaffected parents have an affected daughter</div>`},
{type:'mc', stem:`The pedigree shows an autosomal recessive condition (allele <b>d</b>). What is the genotype of individual <b>II-1</b>, and why?`,
 v:vis(pedigree({gens:[[{id:'I-1',s:'m',a:true},{id:'I-2',s:'f'}],[{id:'II-1',s:'f'},{id:'II-2',s:'m'},{id:'II-3',s:'f'}]],mates:[['I-1','I-2']],kids:[{p:['I-1','I-2'],c:['II-1','II-2','II-3']}]}),'An autosomal recessive condition (allele d); filled symbols are affected'),
 opts:['Dd, because she inherited a d allele from her affected father','DD, because she is unaffected, so she carries no d allele','dd, because her father is affected, so she must be affected too','DD or Dd, because her phenotype is unaffected, so it is unknown'], ans:0,
 hint:'Her father is affected. What must he have passed on to every child?',
 sol:`<div class="step-line">The father I-1 is affected, so his genotype is dd. Every child receives one d from him.</div><div class="step-line">II-1 is unaffected, so she must also have a dominant D allele, from her mother.</div><div class="step-line">So her genotype is Dd. DD is impossible because she received d from her father. dd would make her affected, and the genotype is not unknown, because the father's alleles fix it.</div><div class="step-line ans">Answer: Dd, because she inherited a d allele from her affected father</div>`},
{type:'mc', stem:`Which observation in a pedigree is enough to show that a condition is caused by a <b>recessive</b> allele?`, opts:['Unaffected parents have an affected child','An affected parent has an affected child','More males than females are affected','Every affected person has an affected parent'], ans:0,
 hint:'Ask which pattern a dominant allele could never produce.',
 sol:`<div class="step-line">Parents without the trait can only have a child with the trait if they carry a hidden recessive allele.</div><div class="step-line">An affected parent with an affected child fits both dominant and recessive. More males affected suggests X-linked, but that does not show whether it is recessive. Affected people each having an affected parent is a dominant pattern.</div><div class="step-line ans">Answer: Unaffected parents have an affected child</div>`},
{type:'text', stem:`In the pedigree, individual I-2 is drawn with a half-shaded symbol. What one-word term describes such an individual?`,
 v:vis(pedigree({gens:[[{id:'I-1',s:'m'},{id:'I-2',s:'f',car:true}],[{id:'II-1',s:'m',a:true},{id:'II-2',s:'f'}]],mates:[['I-1','I-2']],kids:[{p:['I-1','I-2'],c:['II-1','II-2']}],legend:false}),'Part of a family pedigree'),
 ans:'carrier', anyCase:true, accept:['a carrier','carriers','heterozygous carrier','heterozygous','heterozygote','a heterozygote'], ph:'one word',
 hint:'She is unaffected but has an allele she can pass on.',
 sol:`<div class="step-line">A half-shaded symbol shows a person who is heterozygous and unaffected: she has one copy of the allele and does not show the trait.</div><div class="step-line">That person is a carrier.</div><div class="step-line ans">Answer: carrier</div>`},
{type:'mc', stem:`The pedigree shows a rare condition. Individual <b>II-3</b> married into the family and does <b>not</b> carry the allele. Which statement gives the mode of inheritance with the evidence?`,
 v:vis(pedigree({gens:[[{id:'I-1',s:'m',a:true},{id:'I-2',s:'f'}],[{id:'II-1',s:'m'},{id:'II-2',s:'f'},{id:'II-3',s:'m'}],[{id:'III-1',s:'m',a:true},{id:'III-2',s:'f'}]],mates:[['I-1','I-2'],['II-2','II-3']],kids:[{p:['I-1','I-2'],c:['II-1','II-2']},{p:['II-2','II-3'],c:['III-1','III-2']}]}),'A rare condition over three generations'),
 opts:['X-linked recessive: III-1 is affected but his father cannot carry the allele, so it came from II-2','Autosomal recessive: III-1 is affected, so both of his unaffected parents must carry the allele','Autosomal dominant: I-1 is affected and passed the allele to his daughter II-2, who passed it to III-1','X-linked dominant: the affected father I-1 passed the allele to his son II-1 and his daughter II-2'], ans:0,
 hint:'III-1 is affected, but his father II-3 does not carry the allele. Where did the allele come from?',
 sol:`<div class="step-line">II-2 is unaffected, so the allele must be recessive (an affected son from unaffected parents).</div><div class="step-line">If the gene were autosomal, III-1 would need the allele from both parents, but II-3 does not carry it. So III-1 must have received it from his mother II-2, on her X chromosome, which she inherited from her affected father I-1.</div><div class="step-line">Option two contradicts the information about II-3. Options three and four need II-2, II-1 or both to be affected, but they are not.</div><div class="step-line ans">Answer: X-linked recessive: III-1 is affected but his father cannot carry the allele, so it came from II-2</div>`}
]},

{ id:12, name:'The dihybrid cross', short:'Dihybrid cross',
  teach:{ h:'Two genes sort independently', b:`
<p>A <b>dihybrid cross</b> follows <b>two genes</b> at once. When the genes lie on different chromosomes, the alleles of one gene go into gametes independently of the alleles of the other gene. This is <b>independent assortment</b>. A parent with the genotype <b>RrYy</b> therefore makes <b>four</b> kinds of gamete.</p>
<p>Use <b>FOIL</b> (First, Outer, Inner, Last) to list them without missing one: take the first allele of each gene, then the outer two, then the inner two, then the last of each.</p>
${vis(punnett(['RY','Ry','rY','ry'],['RY','Ry','rY','ry'],{top:'Gametes of parent 1', side:'Gametes of parent 2'}),'RrYy × RrYy: 16 boxes. R is round and dominant, Y is yellow and dominant')}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">Parent genotype <b>RrYy</b>. Write R r on the left and Y y on the right.</div>
<div class="step-line">First: R with Y gives RY. Outer: R with y gives Ry.</div>
<div class="step-line">Inner: r with Y gives rY. Last: r with y gives ry.</div>
<div class="step-line">Each gamete holds one allele of each gene, so none contains both R and r.</div>
<div class="step-line ans">Four kinds of gamete: RY, Ry, rY, ry. Two such parents give 4 × 4 = 16 boxes.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>A cross between two parents that are heterozygous for both genes gives four phenotypes in the ratio <b>9 : 3 : 3 : 1</b>: round yellow, round green, wrinkled yellow, wrinkled green. Only one box in sixteen is the double recessive.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Each gamete must contain one allele of each gene. Writing Rr or YY as a gamete, or writing only two kinds (RY and ry), loses the marks.</p></div>
${keyterms([['dihybrid cross','a cross that follows two genes'],['independent assortment','alleles of different genes sort into gametes independently'],['FOIL','a method for listing the four gametes'],['double recessive','homozygous recessive for both genes, such as rryy'],['9 : 3 : 3 : 1','the phenotypic ratio of RrYy × RrYy']])}
`},
  reteach:{ h:'Multiply two single-gene crosses', b:`
<p>Recall levels 2 and 3: a gamete carries one allele of each gene, and a Punnett square pairs the gametes of the two parents. A dihybrid cross is two monohybrid crosses happening at once. Because the genes are independent, you can work each gene on its own and <b>multiply the probabilities</b>. This is faster than a 16-box square.</p>
${contrast('Single gene','Offspring probabilities (heterozygous × heterozygous)',[['Dominant trait','3/4'],['Recessive trait','1/4']])}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">In pea plants, tall (T) is dominant to dwarf (t), and purple flowers (F) are dominant to white (f). Cross <b>TtFf × TtFf</b>.</div>
<div class="step-line">Gamete check with FOIL: TF, Tf, tF, tf.</div>
<div class="step-line">Probability of a tall plant: 3/4. Probability of white flowers: 1/4.</div>
<div class="step-line">Both must happen together, so multiply: 3/4 × 1/4.</div>
<div class="step-line ans">Probability of a tall plant with white flowers = 3/16.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Dominant × dominant is 3/4 × 3/4. Recessive × recessive is 1/4 × 1/4. A mixed pair uses 3/4 for the dominant trait and 1/4 for the recessive trait. Multiply, then multiply by the number of offspring if you are asked for a number.</p></div>
`},
  qs:[
{type:'mc', stem:`A pea plant has the genotype <b>AaBB</b>. The two genes are on different chromosomes. Which gametes can it produce?`, opts:['AB and aB, because both alleles of the second gene are B, so every gamete has B','AB, Ab, aB and ab, because every plant with two genes makes four kinds of gamete','AB and ab only, because the alleles in each gamete stay together as in the parents','AABB and aaBB, because each gamete holds both copies of each gene in the parent'], ans:0,
 hint:'Use FOIL, but look at what the two B alleles give.',
 sol:`<div class="step-line">FOIL: First AB, Outer AB, Inner aB, Last aB. The two B alleles are the same, so only two different gametes appear.</div><div class="step-line">Four kinds of gamete would need the plant to be heterozygous for both genes. AB and ab only would keep the alleles together, which is not what independent assortment does. A gamete holds one allele of each gene, never both copies.</div><div class="step-line ans">Answer: AB and aB, because both alleles of the second gene are B, so every gamete has B</div>`},
{type:'text', stem:`Two rabbits, both heterozygous for fur colour (B black, b brown) and for fur length (L short, l long), are crossed. Give the phenotypic ratio of black short : black long : brown short : brown long.`, ans:'9 : 3 : 3 : 1', accept:['9:3:3:1','9,3,3,1','9 3 3 1','9 : 3 : 3 : 1.'], ph:'e.g. 4 : 3 : 2 : 1',
 hint:'Both parents are BbLl. Only one box in sixteen is brown and long.',
 sol:`<div class="step-line">Both parents are BbLl and make four gametes: BL, Bl, bL, bl.</div><div class="step-line">Black short (at least one B and at least one L): 9 boxes. Black long (at least one B, ll): 3 boxes.</div><div class="step-line">Brown short (bb, at least one L): 3 boxes. Brown long (bbll): 1 box.</div><div class="step-line ans">Answer: 9 : 3 : 3 : 1</div>`},
{type:'frac', stem:`In a plant species, tall stems (H) are dominant to short stems (h), and smooth seeds (S) are dominant to wrinkled seeds (s). The genes are on different chromosomes. Two plants with the genotype <b>HhSs</b> are crossed. What is the probability that an offspring has short stems <b>and</b> wrinkled seeds? Give a fraction.`, ans:{n:1,d:16},
 hint:'Short stems is hh and wrinkled seeds is ss. Find each probability and multiply.',
 sol:`<div class="step-line">Probability of hh from Hh × Hh: 1/4. Probability of ss from Ss × Ss: 1/4.</div><div class="step-line">The genes sort independently, so multiply: 1/4 × 1/4.</div><div class="step-line">In the 16-box square, only one box is hhss.</div><div class="step-line ans">Answer: 1/16</div>`},
{type:'num', stem:`In a plant species, red fruit (C) is dominant to yellow fruit (c), and smooth leaves (D) are dominant to hairy leaves (d). The genes are on different chromosomes. Two plants with the genotype CcDd are crossed and produce <b>320</b> seeds that all grow. How many of the offspring are expected to have red fruit <b>and</b> smooth leaves?`, ans:180, unit:'plants',
 hint:'Find the probability of red and smooth (3/4 and 3/4), then take that fraction of 320.',
 sol:`<div class="step-line">Probability of red fruit: 3/4. Probability of smooth leaves: 3/4.</div><div class="step-line">Both together: 3/4 × 3/4 = 9/16.</div><div class="step-line">9/16 × 320 = 9 × 20 = 180.</div><div class="step-line ans">Answer: 180</div>`},
{type:'mc', stem:`A researcher crossed two plants and counted 160 offspring. Which conclusion is best supported by the data?`,
 v:vis(dataTable(['Phenotype of offspring','Number'],[['Purple flowers, tall stem','90'],['Purple flowers, dwarf stem','31'],['White flowers, tall stem','29'],['White flowers, dwarf stem','10'],['Total','160']],{w:360}),'Data from a class investigation of a cross between two plants'),
 opts:['Both parents are heterozygous for both genes, because the counts are close to 9 : 3 : 3 : 1','One parent is homozygous for one gene, because the counts are close to 3 : 1 for each trait','The test cross gave a 1 : 1 : 1 : 1 ratio, so both parents are heterozygous for both genes','The two genes are linked, because purple flowers and tall stems occur together most often'], ans:0,
 hint:'Divide 160 by 16 and multiply by 9, 3, 3 and 1.',
 sol:`<div class="step-line">160 divided by 16 is 10. A 9 : 3 : 3 : 1 ratio would give 90, 30, 30 and 10.</div><div class="step-line">The observed counts (90, 31, 29, 10) are very close, which is the pattern of two heterozygous parents for two independent genes.</div><div class="step-line">A 1 : 1 : 1 : 1 ratio would give 40 of each. Linked genes would not give the 9 : 3 : 3 : 1 pattern, and purple tall being most frequent is expected in a 9 : 3 : 3 : 1 ratio anyway.</div><div class="step-line ans">Answer: Both parents are heterozygous for both genes, because the counts are close to 9 : 3 : 3 : 1</div>`}
]},
{ id:13, name:'Mutations, variation and genetic disorders', short:'Mutations and disorders',
  teach:{ h:'Mutations make new alleles, and some cause disorders', b:`
<p>A <b>gene mutation</b> is a change in the base sequence of the DNA of a gene. It makes a <b>new allele</b>. Many mutations have no effect, many are harmful and a few are beneficial. Only a mutation in a cell that makes <b>gametes</b> can be passed to offspring. Some disorders often used as examples:</p>
${cards([
 {t:'Sickle cell anaemia', d:'A base change alters haemoglobin. Autosomal recessive. The heterozygote makes both normal and sickle haemoglobin (codominance at molecular level).'},
 {t:'Cystic fibrosis', d:'Thick sticky mucus blocks the lungs and digestive tract. Autosomal recessive.'},
 {t:'Huntington\'s disease', d:'Nerve cells break down, usually in middle age. Autosomal dominant.'},
 {t:'Haemophilia', d:'Blood clots slowly. X-linked recessive, so it affects males more often.'}
],{min:200})}
<p>Variation is also described in two ways. <b>Discontinuous</b> variation has clear categories with no intermediates. <b>Continuous</b> variation shows a full range of values.</p>
${contrast('Discontinuous variation','Continuous variation',[['Distinct categories, no intermediates','A range of values with intermediates'],['Controlled by one gene or a few genes','Controlled by many genes (polygenic) plus the environment'],['Little environmental influence','Strong environmental influence'],['Example: ABO blood group','Example: body height']])}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">A farmer's skin cells are damaged by years of sun and one skin cell gains a mutation in a gene.</div>
<div class="step-line">Skin cells are body cells. They do not become gametes.</div>
<div class="step-line">Only a mutation present in a sperm, egg or in the cells that make them can pass to a child.</div>
<div class="step-line ans">The mutation will not be inherited by the farmer's children.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Mutations are random. Crossing over and independent assortment only make new <b>combinations</b> of alleles that already exist.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Do not say that crossing over creates new alleles. It swaps segments between chromatids and makes new combinations, but the alleles themselves are not new.</p></div>
${keyterms([['mutation','a change in the DNA base sequence'],['sickle cell anaemia','autosomal recessive; abnormal haemoglobin'],['cystic fibrosis','autosomal recessive; thick mucus'],['Huntington\'s disease','autosomal dominant'],['continuous variation','a range of values; polygenic'],['discontinuous variation','distinct categories']])}
`},
  reteach:{ h:'Classify the disorder from its clues', b:`
<p>Recall from the DNA and meiosis ladders: the base sequence of a gene codes for a protein, and meiosis makes the gametes that carry alleles to the next generation. In exam questions the disorder is rarely named. You are given clues and must work out the type. Match the clue to the row.</p>
${contrast3(['Clue in the question','Disorder','Type of inheritance'],[['Unaffected parents have a child with sickle-shaped red blood cells','sickle cell anaemia','autosomal recessive'],['Thick mucus; unaffected parents have an affected child, boys and girls equally','cystic fibrosis','autosomal recessive'],['An affected parent, symptoms in middle age; about half the children affected','Huntington\'s disease','autosomal dominant'],['Almost only males affected; passed through unaffected mothers; slow clotting','haemophilia','X-linked recessive']])}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">Clues: a disorder in which the blood clots very slowly. In one family only the boys are affected and the parents are unaffected.</div>
<div class="step-line">Parents unaffected but a child is affected: the allele is recessive.</div>
<div class="step-line">Only boys are affected and the clue says the blood clots slowly, which fits haemophilia.</div>
<div class="step-line ans">The disorder is haemophilia, which is X-linked recessive.</div></div>
<p>Two more clue types. A new version of a gene that was not there before comes from a change in the DNA base sequence. A trait with a whole range of values, such as height or mass, is continuous.</p>
<div class="callout"><span class="lbl">Rule</span><p>Ask three things: is it recessive or dominant, is it autosomal or X-linked, and does it affect both sexes equally?</p></div>
`},
  qs:[
{type:'mc', stem:`Which statement correctly describes how a <b>new allele</b> of a gene arises?`, opts:['A random change in the base sequence of the gene, called a mutation','Crossing over exchanges whole alleles between homologous chromosomes','Independent assortment shuffles the alleles into new combinations in gametes','Fertilisation combines two gametes that come from different parents'], ans:0,
 hint:'Which process changes the DNA itself, rather than rearranging existing alleles?',
 sol:`<div class="step-line">An allele is a version of a gene, so a new allele needs a change in the DNA sequence of the gene. That is a mutation.</div><div class="step-line">Crossing over, independent assortment and fertilisation all make new combinations of alleles that already exist. They do not create a new allele.</div><div class="step-line ans">Answer: A random change in the base sequence of the gene, called a mutation</div>`},
{type:'text', stem:`A single base change in the haemoglobin gene causes a recessive disorder. People with one copy of the allele are partly protected against malaria. Name the disorder.`, ans:'sickle cell anaemia', anyCase:true, accept:['sickle cell disease','sickle-cell anaemia','sickle-cell disease','sickle cell anemia','sickle-cell anemia','sickle cell','sickle-cell','sickle cell anaemia.'], ph:'name of the disorder',
 hint:'The affected red blood cells are not round.',
 sol:`<div class="step-line">A base change in the haemoglobin gene makes an abnormal haemoglobin, so red blood cells with the homozygous recessive genotype become sickle-shaped.</div><div class="step-line ans">Answer: sickle cell anaemia</div>`},
{type:'mc', stem:`Huntington's disease is caused by a <b>dominant</b> allele (H). A man with Huntington's disease (genotype Hh) and an unaffected woman (hh) plan a family. What is the probability that a child inherits the disease?`, opts:['0%','25%','50%','100%'], ans:2,
 hint:'Fill the square: Hh × hh.',
 sol:`<div class="step-line">Gametes of the man: H and h. Gametes of the woman: h only.</div><div class="step-line">Boxes: Hh, hh, Hh, hh.</div><div class="step-line">Hh is affected, since H is dominant. That is 2 of 4 boxes. 25% would apply to a recessive disorder from two carriers. 100% would need the man to be HH.</div><div class="step-line ans">Answer: 50%</div>`},
{type:'mc', stem:`Which one of the following traits shows <b>continuous</b> variation?`, opts:['Adult body mass in a population','ABO blood group of a person','Ability or inability to roll the tongue','Attached or free ear lobes in a family'], ans:0,
 hint:'Which trait has a whole range of values, with many intermediates?',
 sol:`<div class="step-line">Continuous variation shows a range of values with intermediates, and many genes plus the environment affect it.</div><div class="step-line">Body mass can take any value in a range. Blood group, tongue rolling and ear lobe type fall into distinct categories, so they show discontinuous variation.</div><div class="step-line ans">Answer: Adult body mass in a population</div>`},
{type:'mc', stem:`A couple, neither of whom has cystic fibrosis, have a daughter with the disorder. Which explanation is correct?`, opts:['Both parents are heterozygous and each passed on a recessive allele','Both parents are homozygous dominant and a new mutation affected the daughter','The father is affected but hides the disorder because it is dominant','The mother passed on an X-linked allele because she is a carrier'], ans:0,
 hint:'Unaffected parents with an affected child tells you the allele is recessive. What genotypes must the parents have?',
 sol:`<div class="step-line">Cystic fibrosis is autosomal recessive. The daughter is homozygous recessive (ff), so she received one f from each parent.</div><div class="step-line">The parents are unaffected, so each has a dominant F as well: both are Ff.</div><div class="step-line">Homozygous dominant parents cannot give an f allele. A new mutation to f would be needed in the gametes of both parents, which is extremely unlikely. The disorder is not dominant and is not X-linked, because an X-linked recessive disorder in a daughter would need an affected father.</div><div class="step-line ans">Answer: Both parents are heterozygous and each passed on a recessive allele</div>`}
]},

{ id:14, name:'Genetic counselling and probability', short:'Genetic counselling',
  teach:{ h:'Each pregnancy is a new chance', b:`
<p>A <b>genetic counsellor</b> uses the genotypes of parents to work out the <b>probability</b> that a child will inherit a disorder. The counsellor gives a risk, never a certainty. Each pregnancy is an independent event: earlier children do not change the chances for the next one.</p>
${vis(punnett(['P','p'],['P','p'],{hi:[3], top:'Gametes of the father', side:'Gametes of the mother'}),'Both parents are carriers of phenylketonuria (PKU), a recessive disorder. The shaded box is a child with PKU')}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">Both parents are carriers, Pp, of a recessive disorder (pp is affected).</div>
<div class="step-line">Boxes: PP, Pp, Pp, pp. One of the 4 boxes is pp.</div>
<div class="step-line">Their first child has the disorder. The gametes are made afresh for the second child, so the first child changes nothing.</div>
<div class="step-line ans">The chance of an affected child is 1 in 4 (25%) for every pregnancy.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>"1 in 4" is the chance for <b>each</b> child. It does not mean exactly one in every four children will be affected. A couple with four children may have none affected, or two.</p></div>
<div class="callout" style="background:#FBEAEA;border-left-color:#B03030"><span class="lbl">Trap</span><p>Do not say that the risk is "used up" after an affected child or after several healthy children. The probability stays the same each time.</p></div>
${keyterms([['genetic counsellor','advises families about the chance of inherited disorders'],['probability','the chance of an outcome, written as a fraction or percentage'],['carrier','a heterozygous, unaffected person'],['independent event','one that is not changed by earlier events'],['risk','the probability of an unwanted outcome']])}
`},
  reteach:{ h:'Think of coin flips', b:`
<p>Recall levels 3 and 4: a cross gives the chance of each genotype in the children, and each box is equally likely. Here is a model for the same idea. A carrier parent passes on the disease allele <b>half the time</b>, like a coin that lands heads half the time. A child is affected only when <b>both</b> parents pass on the allele: both coins land heads.</p>
${contrast3(['Father\'s coin','Mother\'s coin','Child'],[['Heads (allele)','Heads (allele)','Affected'],['Heads (allele)','Tails (normal)','Carrier'],['Tails (normal)','Heads (allele)','Carrier'],['Tails (normal)','Tails (normal)','Unaffected, not a carrier']])}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">Flip two coins for the first child: the result is heads and heads, so the child is affected.</div>
<div class="step-line">Now flip two new coins for the second child. A coin never remembers earlier flips.</div>
<div class="step-line">The coins still give heads and heads in 1 of the 4 equally likely combinations.</div>
<div class="step-line ans">The second child has a 1 in 4 chance of being affected, whatever the first child was.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Four flips of a coin can give heads four times in a row. In the same way, a family of four can have four affected children, or none.</p></div>
`},
  qs:[
{type:'frac', stem:`One parent is a carrier of cystic fibrosis (Cc) and the other parent has the disorder (cc). What is the probability that a child has cystic fibrosis? Give a fraction.`, ans:{n:1,d:2},
 hint:'Cystic fibrosis is recessive, so an affected child is cc. Fill the square.',
 sol:`<div class="step-line">Gametes of the carrier: C and c. Gametes of the parent with the disorder: c only.</div><div class="step-line">Boxes: Cc, cc, Cc and cc.</div><div class="step-line">An affected child is cc: 2 of the 4 boxes.</div><div class="step-line ans">Answer: 1/2</div>`},
{type:'mc', stem:`Two carriers of a recessive disorder have had three unaffected children. What is the probability that their <b>fourth</b> child is affected?`, opts:['1 in 4, the same chance as for each of the earlier children','Higher than 1 in 4, because the first three escaped it','0, because they have already had their one in four','Lower than 1 in 4, because the earlier children were unaffected'], ans:0,
 hint:'Do the first three children change the gametes that the parents make for the fourth?',
 sol:`<div class="step-line">Each pregnancy is an independent event. The parents make new gametes each time.</div><div class="step-line">For every child the risk of pp is 1 in 4.</div><div class="step-line">The risk is not "used up" by earlier healthy children, and it does not build up either. 0 and "higher" both wrongly treat the earlier children as if they change the next one.</div><div class="step-line ans">Answer: 1 in 4, the same chance as for each of the earlier children</div>`},
{type:'mc', stem:`Which statement describes what a genetic counsellor can tell a couple?`, opts:['The probability that a child will inherit a disorder, from the parents\' genotypes','Which of their children will inherit the disorder, once the parents have been tested','That a child who inherits the disorder can be cured by a blood transfusion','That the second child will not inherit the disorder if the first child has it'], ans:0,
 hint:'A counsellor works with probabilities, not certainties.',
 sol:`<div class="step-line">A counsellor draws a cross from the parents' genotypes and states the chance of each outcome.</div><div class="step-line">Which individual child inherits the allele depends on chance and cannot be predicted. Genetic disorders are not cured by a transfusion, and one affected child does not protect the next.</div><div class="step-line ans">Answer: The probability that a child will inherit a disorder, from the parents' genotypes</div>`},
{type:'mc', stem:`A woman has a brother with haemophilia. Both of their parents are unaffected. What is the probability that the woman is a carrier?`, opts:['1 in 4','1 in 2','3 in 4','1, it is certain'], ans:1,
 hint:'Her brother is XhY. Which parent gave him his X? Then ask what that parent gave the woman.',
 sol:`<div class="step-line">The brother is X<sup>h</sup>Y. His X came from his mother, so the mother is a carrier, X<sup>H</sup>X<sup>h</sup>. The father is unaffected: X<sup>H</sup>Y.</div><div class="step-line">The woman receives X<sup>H</sup> from her father. From her mother she receives X<sup>H</sup> or X<sup>h</sup> with equal chance.</div><div class="step-line">So half of the time she is X<sup>H</sup>X<sup>h</sup>, a carrier.</div><div class="step-line ans">Answer: 1 in 2</div>`},
{type:'mc', stem:`A genetic counsellor tells a carrier couple: "Each child has a 1 in 4 chance of being affected." The couple decide to have four children. Which evaluation of their situation is best?`, opts:['None, one or several may be affected, because each child has an independent 1 in 4 chance','Exactly one of the four children will be affected, because the risk is 1 in 4','At least one child will be affected, because four children are enough to show the 1 in 4 ratio','No child will be affected if the first child is unaffected, because the risk is then used up'], ans:0,
 hint:'Does "1 in 4" promise exactly one affected child in every four?',
 sol:`<div class="step-line">1 in 4 is a probability for each child separately. The births are independent, so the number of affected children in a family of four is not fixed.</div><div class="step-line">The family could have none, one, two or even more affected children, though one is the average.</div><div class="step-line">Exactly one and at least one both treat 1 in 4 as a guaranteed count. The last option wrongly says risk is used up.</div><div class="step-line ans">Answer: None, one or several may be affected, because each child has an independent 1 in 4 chance</div>`}
]},

{ id:15, name:'Exam standard: pedigree and full cross', short:'Exam standard genetics',
  teach:{ h:'A full exam question, answered for full marks', b:`
<p>Exam questions often join several skills: read a pedigree, decide the genotype of one person and then write a full cross for a couple. Work through the question in order and show your reasoning.</p>
${vis(pedigree({gens:[[{id:'I-1',s:'m'},{id:'I-2',s:'f'}],[{id:'II-1',s:'m'},{id:'II-2',s:'f'},{id:'II-3',s:'m',a:true}],[{id:'III-1',s:'m',a:true},{id:'III-2',s:'f'},{id:'III-3',s:'m'}]],mates:[['I-1','I-2'],['II-1','II-2']],kids:[{p:['I-1','I-2'],c:['II-2','II-3']},{p:['II-1','II-2'],c:['III-1','III-2','III-3']}]}),'A family with haemophilia. II-1 married into the family and does not carry the allele')}
<p><b>Question.</b> (a) Give the mode of inheritance, with a reason. (b) Give the genotype of II-2. (c) Use a genetic cross to show the possible children of II-1 and II-2. (d) State the probability that their next child is an affected son.</p>
<div class="worked"><span class="lbl">Worked example: model answer</span>
<div class="step-line">(a) X-linked recessive. I-1 and I-2 are unaffected but II-3 is affected, so the allele is recessive. II-1 does not carry the allele, yet his son III-1 is affected, so the allele came from II-2 on her X chromosome.</div>
<div class="step-line">(b) X<sup>H</sup>X<sup>h</sup>. She is unaffected but has an affected son.</div>
<div class="step-line">(c) P1 phenotypes: normal male × normal female (carrier). P1 genotypes: X<sup>H</sup>Y × X<sup>H</sup>X<sup>h</sup>. Meiosis. G: X<sup>H</sup>, Y × X<sup>H</sup>, X<sup>h</sup>. Fertilisation. F1 genotypes: X<sup>H</sup>X<sup>H</sup>, X<sup>H</sup>X<sup>h</sup>, X<sup>H</sup>Y, X<sup>h</sup>Y. F1 phenotypes: normal female, normal female (carrier), normal male, male with haemophilia.</div>
<div class="step-line ans">(d) 1 in 4 (25%): only the box X<sup>h</sup>Y is an affected son, out of four equally likely boxes.</div></div>
<div class="callout"><span class="lbl">Rule</span><p>Answer each part in turn. Justify with named individuals. In the cross write every line of the format. For a probability, name the box (or boxes) you counted out of the total.</p></div>
${keyterms([['X-linked recessive','allele on the X; males affected more often'],['carrier','heterozygous and unaffected female'],['P1, F1','parents and first offspring generation'],['genotype','alleles, written as letters'],['phenotype','trait, written in words'],['probability','boxes counted out of boxes in total']])}
`},
  reteach:{ h:'What the examiner looks for', b:`
<p>Use this checklist on every exam answer. Each part of the question has its own marks and its own tick list.</p>
${contrast('Part of the question','What the examiner looks for',[['Mode of inheritance','The correct type (autosomal or X-linked, dominant or recessive) and a reason that names individuals in the pedigree'],['Genotype of an individual','Alleles written correctly (X<sup>H</sup>X<sup>h</sup>) and a reason that uses a parent, a child or a sibling'],['Full cross','P1 phenotypes and genotypes, meiosis, gametes written one allele each, fertilisation, F1 genotypes and F1 phenotypes'],['Probability','A fraction or percentage with the right denominator: all children, or sons only']])}
<div class="worked"><span class="lbl">Worked example</span>
<div class="step-line">Cross for a haemophiliac father and a carrier mother.</div>
<div class="step-line">P1 phenotypes: male with haemophilia × normal female (carrier). P1 genotypes: X<sup>h</sup>Y × X<sup>H</sup>X<sup>h</sup>. (2)</div>
<div class="step-line">Meiosis. G: X<sup>h</sup>, Y × X<sup>H</sup>, X<sup>h</sup>. Fertilisation. (2)</div>
<div class="step-line">F1 genotypes: X<sup>H</sup>X<sup>h</sup>, X<sup>h</sup>X<sup>h</sup>, X<sup>H</sup>Y, X<sup>h</sup>Y. (1)</div>
<div class="step-line">F1 phenotypes: normal female (carrier), female with haemophilia, normal male, male with haemophilia. (1)</div>
<div class="step-line ans">Probability of a daughter with haemophilia: 1 of 4 boxes, which is 1/4 of all the children.</div></div>
<div class="callout"><span class="lbl">Checklist</span><p>Write the question number. Name individuals. Use the full format. State the probability as a fraction of all the children, or of the sons, and say which.</p></div>
`},
  qs:[
{type:'mc', stem:`The pedigree shows red-green colour blindness in a family. Individual <b>II-5</b> married into the family and does not carry the allele. Which answer gives the mode of inheritance with a correct justification?`,
 v:vis(pedigree({gens:[[{id:'I-1',s:'m'},{id:'I-2',s:'f'}],[{id:'II-1',s:'m',a:true},{id:'II-2',s:'f'},{id:'II-3',s:'m',a:true},{id:'II-4',s:'f'},{id:'II-5',s:'m'}],[{id:'III-1',s:'m',a:true},{id:'III-2',s:'f'},{id:'III-3',s:'f'}]],mates:[['I-1','I-2'],['II-4','II-5']],kids:[{p:['I-1','I-2'],c:['II-1','II-2','II-3','II-4']},{p:['II-4','II-5'],c:['III-1','III-2','III-3']}]}),'A family with colour blindness'),
 opts:['X-linked recessive: III-1 is affected but his father II-5 cannot carry the allele, so it came from II-4','Autosomal recessive: III-1 is affected, so both of his unaffected parents must carry the allele','X-linked recessive: II-1 and II-3 are affected, so the allele must be carried on the Y chromosome','Autosomal dominant: II-1 and II-3 are affected, so one of their parents must have passed on a dominant allele'], ans:0,
 hint:'Who supplies the X chromosome of an affected son? Can his father do so here?',
 sol:`<div class="step-line">I-1 and I-2 are unaffected but II-1 and II-3 are affected, so the allele is recessive.</div><div class="step-line">III-1 is affected but his father II-5 does not carry the allele. If the gene were autosomal, III-1 would need the allele from both parents. So he must have got it from his mother II-4, on her X chromosome. The condition is X-linked recessive.</div><div class="step-line">The Y chromosome does not carry the gene. The parents of II-1 and II-3 are unaffected, so there is no dominant allele to inherit.</div><div class="step-line ans">Answer: X-linked recessive: III-1 is affected but his father II-5 cannot carry the allele, so it came from II-4</div>`},
{type:'mc', stem:`Using the pedigree below for colour blindness (B is normal vision, b is colour blindness), what is the genotype of <b>II-4</b>?`,

 opts:['X<sup>B</sup>X<sup>b</sup>, because she is unaffected but her son III-1 is colour-blind','X<sup>B</sup>X<sup>B</sup>, because she is unaffected, so she cannot carry the b allele','X<sup>b</sup>X<sup>b</sup>, because her son III-1 is colour-blind, so she must be too','X<sup>B</sup>X<sup>B</sup> or X<sup>B</sup>X<sup>b</sup>, because her phenotype cannot show which it is'], ans:0,
 hint:'III-1 is XbY. Where did his X come from?',
 sol:`<div class="step-line">III-1 is colour-blind, so he is X<sup>b</sup>Y. His Y came from his father, so his X<sup>b</sup> came from his mother II-4.</div><div class="step-line">II-4 has normal vision, so she also has a dominant X<sup>B</sup>.</div><div class="step-line">Her genotype is X<sup>B</sup>X<sup>b</sup>. X<sup>B</sup>X<sup>B</sup> cannot give an X<sup>b</sup> to her son. X<sup>b</sup>X<sup>b</sup> would make her colour-blind. The son's phenotype fixes her genotype, so it is not unknown.</div><div class="step-line ans">Answer: X<sup>B</sup>X<sup>b</sup>, because she is unaffected but her son III-1 is colour-blind</div>`},
{type:'frac', stem:`In the pedigree below, III-2 (unaffected) will marry a man with normal vision. Her mother II-4 is X<sup>B</sup>X<sup>b</sup> and her father II-5 is X<sup>B</sup>Y. What is the probability that the <b>first child</b> of III-2 and her husband is a colour-blind son? Give a fraction of all the children.`, ans:{n:1,d:8},
 v:vis(pedigree({gens:[[{id:'I-1',s:'m'},{id:'I-2',s:'f'}],[{id:'II-1',s:'m',a:true},{id:'II-2',s:'f'},{id:'II-3',s:'m',a:true},{id:'II-4',s:'f'},{id:'II-5',s:'m'}],[{id:'III-1',s:'m',a:true},{id:'III-2',s:'f'},{id:'III-3',s:'f'}]],mates:[['I-1','I-2'],['II-4','II-5']],kids:[{p:['I-1','I-2'],c:['II-1','II-2','II-3','II-4']},{p:['II-4','II-5'],c:['III-1','III-2','III-3']}]}),'The same family'),

{type:'mc', stem:`A learner answers a question about a colour-blind father (X<sup>b</sup>Y) and a carrier mother (X<sup>B</sup>X<sup>b</sup>). Which statement correctly identifies the error that costs a mark?
<div style="border:1.5px solid ${LINE};border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px;line-height:1.55;background:#fff">P1 phenotypes: colour-blind male × normal female (carrier)<br>P1 genotypes: X<sup>b</sup>Y<sup>b</sup> × X<sup>B</sup>X<sup>b</sup><br>Meiosis<br>G: X<sup>b</sup>, Y<sup>b</sup> × X<sup>B</sup>, X<sup>b</sup><br>Fertilisation<br>F1 genotypes: X<sup>B</sup>X<sup>b</sup>, X<sup>b</sup>X<sup>b</sup>, X<sup>B</sup>Y<sup>b</sup>, X<sup>b</sup>Y<sup>b</sup><br>F1 phenotypes: normal female (carrier), colour-blind female, normal male, colour-blind male</div>`, opts:['The father is written as X<sup>b</sup>Y<sup>b</sup>, but a Y carries no allele for this gene, so it should be X<sup>b</sup>Y','The mother should be written as X<sup>B</sup>X<sup>B</sup>, because she has normal vision so cannot be a carrier','Fertilisation should come before meiosis, because gametes must join before they can be made','The gametes should be written as pairs, X<sup>b</sup>Y<sup>b</sup> and X<sup>B</sup>X<sup>b</sup>, because each parent makes one gamete'], ans:0,
